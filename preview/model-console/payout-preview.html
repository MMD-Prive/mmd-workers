<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY MODEL · ตรวจสถานะโอนจำลอง</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9edf0;color:#17232d;font:15px/1.6 system-ui,sans-serif}header{max-width:820px;margin:auto;padding:20px}h1{font-size:21px;margin:0 0 8px}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:10px;border:1px solid #8d999f;background:white;border-radius:4px;min-height:44px}button:disabled{opacity:.5}p{margin:10px 0}iframe{display:block;width:min(100%,390px);height:844px;margin:0 auto 24px;border:1px solid #87949b;background:#080e13}a{color:#345568}</style>
<header><h1>Console · ข้อมูลจำลอง</h1><p>ไม่มีการโอนเงินจริงหรือเชื่อมข้อมูล production</p><nav><button data-case="travel">เดินทาง</button><button data-case="arrived">ถึงจุดนัด</button><button data-case="payment">รอตรวจชำระ</button><button data-case="separated">รอลูกค้าอนุมัติ</button><button data-case="review">รอตรวจจบงาน</button><button data-case="pending">รอโอนค่าตัว</button><button data-case="paid">หลักฐานครบ</button><button data-case="missing">หลักฐานไม่ครบ</button><button data-case="duplicate">รายการซ้ำ</button><button data-case="hold">HOLD</button></nav><p id="result" role="status">เลือกเคสเพื่อลอง</p><a href="/mobile-preview">MY MODEL / CONSOLE</a></header>
<iframe title="Console มือถือ" src="/sigil/model/console?t=preview-only-not-a-token"></iframe>
<script>document.querySelectorAll('[data-case]').forEach(button=>button.addEventListener('click',async()=>{const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);const status=document.querySelector('#result');status.textContent='กำลังทดสอบ…';try{const r=await fetch('/__preview/payout-demo',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scenario:button.dataset.case})});if(!r.ok)throw Error();document.querySelector('iframe').src='/sigil/model/console?t=preview-only-not-a-token';status.textContent=button.textContent+' · พร้อมตรวจผล';}catch{status.textContent='ทดสอบไม่สำเร็จ ยังยืนยันสถานะไม่ได้';}finally{buttons.forEach(b=>b.disabled=false);}}));</script></html>
