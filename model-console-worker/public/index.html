<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMD Model Console V1.1</title>
<style>:root{font-family:Inter,system-ui;background:#0b0b0c;color:#f5f2e9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#242019,#0b0b0c 38%);min-height:100vh}.shell{max-width:1180px;margin:auto;padding:28px 18px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}.eyebrow,h2{color:#d6c28d}.eyebrow{font-size:11px;letter-spacing:.18em}.title{font-size:clamp(30px,7vw,62px);line-height:.95;margin:8px 0}.sub,.small{color:#aaa59a}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 12;background:#141414d1;border:1px solid #2d2a25;border-radius:18px;padding:16px}@media(min-width:760px){.half{grid-column:span 6}}h2{font-size:14px;margin:0 0 12px}input,button{width:100%;border-radius:12px;border:1px solid #39352d;background:#111;color:#f6f1e5;padding:12px;margin:5px 0}button{cursor:pointer;background:#d5b96f;color:#15120b;font-weight:700;border:0}.row{display:flex;gap:8px}.row>*{flex:1}.status{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #24221e}.healthy{color:#77b477}.degraded{color:#d5b96f}.blocked{color:#b87575}pre{white-space:pre-wrap;word-break:break-word;background:#090909;padding:12px;border-radius:12px;color:#bdb8ad;min-height:120px}</style></head>
<body><main class="shell"><div class="top"><div><div class="eyebrow">MMD PRIVÉ · OPERATOR SESSION</div><h1 class="title">MODEL<br>CONSOLE</h1><div class="sub">Canonical Model 360 through typed worker contracts. Working memory is never audit truth.</div></div><div class="small">V1.1</div></div>
<div class="grid"><section class="card half"><h2>Operator session</h2><div id="session">กำลังตรวจสอบ session…</div><button onclick="health()">Check worker contracts</button><div id="health"></div></section>
<section class="card half"><h2>Model 360</h2><div class="row"><input id="modelId" placeholder="canonical model id / latest name"><button onclick="model360()">Open 360</button></div><pre id="model">ใช้ canonical identity จาก Worker/Airtable เท่านั้น</pre></section>
<section class="card"><h2>Model search</h2><div class="row"><input id="q" placeholder="name / nickname / unique key"><button onclick="models()">Search</button></div><pre id="models">Ready.</pre></section></div></main>
<script>const $=id=>document.getElementById(id);async function call(path){const r=await fetch(path,{credentials:'include',headers:{Accept:'application/json'}});const data=await r.json().catch(()=>({ok:false,error:'invalid_response'}));if(r.status===401)location.assign('/internal/admin/login?return_to='+encodeURIComponent(location.href));return data}function show(id,x){$(id).textContent=JSON.stringify(x,null,2)}async function boot(){const x=await call('/v1/console/session');$('session').textContent=x.ok?'เชื่อมต่อแล้ว · '+(x.operator||'admin'):'ต้องเข้าสู่ระบบ Admin'}async function health(){const x=await call('/v1/console/workers/health');$('health').innerHTML=(x.checks||[]).map(v=>`<div class="status"><span>${v.name}</span><span class="${v.state}">${v.state} · ${v.contract_version||'no contract'} · ${v.latency_ms??'—'}ms</span></div>`).join('')}async function models(){show('models',await call('/v1/console/models?q='+encodeURIComponent($('q').value)))}async function model360(){const id=$('modelId').value.trim();if(id)show('model',await call('/v1/console/models/'+encodeURIComponent(id)))}boot()</script></body></html>
