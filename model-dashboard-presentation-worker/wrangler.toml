name = "model-dashboard-presentation-worker"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Canonical Model Dashboard presentation only. API authority remains on
# admin-worker under /v1/model/*.
[[routes]]
pattern = "mmdbkk.com/sigil/model/dashboard*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/sigil/model/dashboard*"
zone_name = "mmdbkk.com"

# Compatibility aliases for TanStack/Lovable lazy runtime chunks that may
# resolve to root-absolute paths after hydration. These paths are presentation
# runtime only; /v1/model/* remains outside this worker.
[[routes]]
pattern = "mmdbkk.com/assets/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/assets/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/_build/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/_build/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/_serverFn/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/_serverFn/*"
zone_name = "mmdbkk.com"
