name = "ai-worker"
main = "index.js"
compatibility_date = "2026-09-03"
workers_dev = false

[vars]
WEB_BASE_URL = "https://mmdbkk.com"
AI_DEFAULT_LIMIT = "10"
AI_MAX_LIMIT = "30"
AI_TIMEOUT_MS = "12000"
AI_ENABLE_RECOMMEND = "true"
AI_ENABLE_MEMBER_CONTEXT = "true"
AI_INTELLIGENCE_MODE = "read_only"

