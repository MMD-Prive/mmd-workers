(--card)}\u003c/style>\u003c/head>\u003cbody id=\"mmd-selection\">\u003csvg width=\"0\" height=\"0\" aria-hidden=\"true\" style=\"position:absolute;pointer-events:none\">\u003cdefs>\u003csymbol id=\"lock\" viewBox=\"0 0 24 24\">\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"2\"/>\u003cpath d=\"M8 10V7a4 4 0 018 0v3M12 14v3\"/>\u003c/symbol>\u003csymbol id=\"check\" viewBox=\"0 0 24 24\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/symbol>\u003csymbol id=\"plus\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/symbol>\u003csymbol id=\"close\" viewBox=\"0 0 24 24\">\u003cpath d=\"m6 6 12 12M6 18 18 6\"/>\u003c/symbol>\u003csymbol id=\"clock\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v5l3 2\"/>\u003c/symbol>\u003c/defs>\u003c/svg>\u003cheader class=\"top\">\u003cdiv class=\"wrap top-row\">\u003cdiv class=\"brand\">MMD Privé\u003csmall>Partner selection\u003c/small>\u003c/div>\u003cspan class=\"private\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#lock\"/>\u003c/svg>\u003cspan data-i18n-text=\"partner.modelSelection.header.private\">เฉพาะงานนี้\u003c/span>\u003c/span>\u003c/div>\u003c/header>\u003cmain class=\"wrap\">\u003csection class=\"gate\" id=\"gate\" aria-live=\"polite\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#lock\"/>\u003c/svg>\u003ch1 id=\"gateTitle\">\u003cspan data-i18n-text=\"partner.modelSelection.gate.title\">เปิดลิงก์เฉพาะงาน\u003c/span>\u003c/h1>\u003cp id=\"gateMessage\">\u003cspan data-i18n-text=\"partner.modelSelection.gate.fullLink\">ใช้ลิงก์ฉบับเต็มที่เปอร์ส่งให้ เพื่อดูรูปและรายละเอียดของงานนี้ค่ะ\u003c/span>\u003c/p>\u003cbutton id=\"retryGate\" class=\"secondary wide\" hidden>\u003cspan data-i18n-text=\"partner.modelSelection.gate.retry\">ลองเปิดอีกครั้ง\u003c/span>\u003c/button>\u003c/section>\u003cdiv id=\"workspace\" hidden>\u003csection class=\"intro\">\u003cspan class=\"eyebrow\" id=\"jobTitle\">\u003c/span>\u003ch1>\u003cspan data-i18n-text=\"partner.modelSele
