ง":"การส่งข้อมูลจะเริ่ม Initial Review จากนั้นผมจะกำหนดขั้นต่อไปตาม consent ความพร้อม และความเหมาะสมของเคส","มี potential แต่ยังไม่ public":"มี potential · Private visibility","เคยเกริ่นแล้ว แต่ยังไม่ละเอียด":"เริ่มคุยแล้ว · รอรายละเอียดเพิ่มเติม","Direct, Bridge, Wait หรือไม่รับเคสนี้":"Direct · Bridge · Hold · Close","DO NOT SEND":"CONSENT FIRST","สิ่งที่ผมไม่อยากรับ":"ข้อมูลที่ควรเช็ก consent ก่อนส่ง","Private contact ที่ไม่ได้ขออนุญาต":"Private contact ที่เจ้าตัวยืนยันให้ส่ง","เบอร์ LINE chat ส่วนตัว หรือข้อมูลหลังบ้านที่เจ้าตัวไม่รู้":"ช่องทางติดต่อหรือข้อมูลหลังบ้านที่เจ้าตัวรับรู้และอนุญาต","ถ้าไม่ใช่ public profile หรือสิ่งที่เจ้าตัวให้ดู ห้ามส่ง":"ใช้ public profile หรือข้อมูลที่เจ้าตัวอนุญาตให้ดู","ถ้าเขายังไม่สบายใจ ให้หยุดก่อน ความไว้ใจมาก่อนความเร็ว":"เมื่อเจ้าตัวสบายใจและ consent ชัด เราค่อยเดินขั้นต่อไปด้วยกัน","ถ้าเพื่อนยังไม่พร้อม ให้รอก่อน ความไว้ใจสำคัญกว่าความเร็ว":"ให้เพื่อนเลือกจังหวะที่พร้อม ความไว้ใจเป็นตัวกำหนดความเร็วของเคส","ตอนนี้ยังไม่ใช่การอนุมัติ หรือเริ่มทำงาน":"สถานะปัจจุบันคือ Initial Review","ยังไม่ใช่อนุมัติ":"Review in progress","ยังไม่ใช่เริ่มทำงาน":"Initial Review","ไม่มีขั้นตอนทันที":"Next step follows review","ยังไม่มีการยืนยันงาน นัดหมาย หรือเปิดขั้นตอนใด ๆ ทันที":"ขั้นถัดไปจะเปิดเมื่อ Initial Review กำหนด route ของเคสแล้ว","ยังไม่ใช่การติดต่อทันที":"Contact follows the approved route","ไม่ต้องเร่งคำตอบ":"ให้เวลาเจ้าตัวตัดสินใจ","ไม่ต้องส่ง private contact เพิ่ม":"ส่งข้อมูลเพิ่มเมื่อเจ้าตัวอนุญาต","ไม่ต้องขายแทนเพื่อน":"เล่าตามข้อมูลจริงและปล่อยให้เจ้าตัวตัดสินใจเอง","Care first · ไม่รีบใช้ความไว้ใจผิดทาง":"Care first · Trust sets the pace","สิ่งที่ผมดูไม่ใช่แค่ว่าคุณรู้จักใคร แต่ดูว่าความสัมพันธ์นั้นควรถูกพาเข้าใกล้ MMD Privé แค่ไหน ถ้ามันมีน้ำหนักพอ ผมจะให้ทางไปต่อ":"ผมดูทั้งคุณภาพของ connection บริบทความสัมพันธ์ และระดับความเหมาะสมกับ MMD Privé เพื่อกำหนดทางไปต่อที่ชัดเจน","การส่งข้อมูลเข้ามาไม่ได้หมายความว่า MMD รับเป็น partner ทันที และไม่ได้รับประกันว่า talent หรือ connection ที่แนะนำจะถูกใช้งานจริง":"การส่งข้อมูลจะเริ่ม Partner Review โดยสถานะ Partner และการใช้งาน talent หรือ connection จะเปิดตามผล Review และงานจริง","ถ้าต้องคุยต่อ ใช้ reference จากหน้านี้ประกอบการติดต่อกลับ จะช่วยให้ผมตามเรื่องได้ตรง และลดการส่งข้อมูลซ้ำโดยไม่จำเป็น":"ใช้ reference จากหน้านี้เมื่อคุยต่อ เพื่อให้ผมตามเรื่องได้ตรงและเชื่อมข้อมูลกับเคสเดิมได้ต่อเนื่อง","ค่าแนะนำหรือความร่วมมือใด ๆ จะพิจารณาตามเคสที่เกิดงานจริงและตรวจสอบได้เท่านั้น หากข้อมูลที่ส่งเข้ามาไม่เหมาะกับ MMD Privé ในช่วงนี้ MMD อาจไม่ติดต่อกลับเพิ่มเติม":"ค่าแนะนำและความร่วมมือพิจารณาจากงานจริงที่ตรวจสอบได้ หากเคสยังไม่ตรงกับช่วงเวลาปัจจุบัน สถานะจะถูกเก็บไว้ตามผล Review","คิวส่วนตัว งานนอก MMD รายรับ–รายจ่ายส่วนตัว และโน้ตที่คุณเก็บใน Private Vault เป็นพื้นที่ของ Partner ระบบเข้ารหัสข้อมูลบนอุปกรณ์ก่อนส่ง จึงไม่มีเนื้อหาที่อ่านได้ถูกส่งให้ MMD":"คิวส่วนตัว งานนอก MMD รายรับ–รายจ่ายส่วนตัว และโน้ตใน Private Vault อยู่ในพื้นที่ของ Partner ระบบเข้ารหัสข้อมูลบนอุปกรณ์ก่อนส่ง และส่งเฉพาะ ciphertext ไปจัดเก็บ","เปิดครั้งเดียวก็รู้ว่า Model คนไหนอยู่กับคุณ งานไหนต้องทำต่อ เงินเท่าไรอยู่ขั้นตอนไหน และข้อมูลส่วนไหนเป็นพื้นที่ส่วนตัวที่ MMD อ่านไม่ได้":"เปิดครั้งเดียวก็เห็น Model ในสังกัด งานที่ต้องทำต่อ สถานะรายได้ และพื้นที่ข้อมูลส่วนตัวที่อยู่ภายใต้การควบคุมของ Partner","เก็บคิว งานนอก MMD รายรับ–รายจ่าย และโน้ตแบบเข้ารหัสที่ MMD อ่านไม่ได้":"เก็บคิว งานนอก MMD รายรับ–รายจ่าย และโน้ตด้วย Partner-only encryption","คิวส่วนตัว งานนอก MMD รายรับ–รายจ่ายส่วนตัว และโน้ตใน Private Vault ถูกเข้ารหัส MMD ไม่มีสิทธิ์อ่าน ขอ PIN หรือเข้าถึงเนื้อหา และจะได้รับข้อมูลเพิ่มเติมเมื่อ Partner เลือก Share with MMD เท่านั้น":"คิวส่วนตัว งานนอก MMD รายรับ–รายจ่ายส่วนตัว และโน้ตใน Private Vault ใช้ Partner-only encryption โดย Partner เป็นผู้ควบคุม PIN กุญแจถอดรหัส และการเลือก Share with MMD","ผมเปอร์ครับ หน้านี้สำหรับคนที่อยากแนะนำเพื่อนให้ผมดู แต่ไม่อยากให้เพื่อนต้องสมัครออนไลน์ เปิดเผยตัว หรือรู้สึกว่ากำลังถูกดึงเข้า flow ของ agency":"ผมเปอร์ครับ หน้านี้สำหรับคนที่อยากแนะนำเพื่อนให้ผมดูแบบเป็นส่วนตัว เจ้าตัวเลือกระดับการเปิดเผยและจังหวะที่จะเข้าสู่ flow ด้วยตัวเอง","เรื่อง private ไม่ควรเอาไปผูกกับภาพ public ของ MMD มากเกินไปครับ MMD คือหน้าบ้านและมาตรฐานการคัดเลือก แต่เรื่องการแนะนำเพื่อน การถือข้อมูล และการตัดสินใจรับหรือไม่รับ ผมจะใช้เสียงของผมเองเป็นหลัก":"เรื่อง private ใช้ขอบเขตแยกจากภาพ public ของ MMD ครับ MMD ดูแลหน้าบ้านและมาตรฐานการคัดเลือก ส่วน Friend Referral การถือข้อมูล และการตัดสินใจของเคสนี้อยู่กับผมโดยตรง","งาน private ส่วนใหญ่เริ่มจากคนรู้จัก ไม่ใช่จากฟอร์มออนไลน์ ผมเลยต้องมีวิธีรับข้อมูลที่ไม่ทำให้คนถูกแนะนำรู้สึกถูกเปิดเผยเกินจำเป็น":"งาน private มักเริ่มจากความไว้ใจของคนรู้จัก ผมจึงใช้วิธีรับข้อมูลที่ให้เจ้าตัวควบคุมขอบเขตและการเปิดเผยได้ตั้งแต่ต้น","ระบบมีไว้เพื่อบันทึก consent, route, boundary และสถานะ review ให้ชัด ไม่ใช่เพื่อทำให้เรื่องส่วนตัวกลายเป็นเรื่องขององค์กรใหญ่หรือกลายเป็นการขาย contact":"ระบบบันทึก consent, route, boundary และสถานะ review ให้ชัด พร้อมรักษา Friend Referral เป็นความสัมพันธ์แบบคนต่อคนและเคารพ contact ownership","สิ่งที่ผมต้องรู้ก่อนรับชื่อคือ เจ้าตัวรู้หรือยัง ยินยอมระดับไหน สะดวกคุยตรงไหม หรืออยากให้เพื่อนเป็น bridge ก่อน ถ้าข้อมูลไม่ควรส่ง ผมไม่อยากรับตั้งแต่แรก เพราะความไว้ใจสำคัญกว่าการได้ contact เพิ่ม":"ก่อนรับชื่อ ผมจะดูว่าเจ้าตัวรับรู้และยินยอมระดับไหน สะดวกคุยตรงหรืออยากให้เพื่อนเป็น bridge เพื่อให้ทุกข้อมูลเดินตาม consent และความไว้ใจตั้งแต่แรก","คนตอบคำถามนี้ควรเป็นผม ไม่ใช่ assistant":"เคส Friend Referral ใช้คำตอบจากผมโดยตรง เพื่อให้คนแนะนำรู้ว่าใครรับผิดชอบการตัดสินใจ","ถ้าคุณจะพาเพื่อนเข้ามาในเรื่องละเอียดอ่อน คุณควรรู้ว่าคนรับผิดชอบคือใคร ผมเลยไม่ให้หน้านี้พูดแทนตัวเองด้วยคำว่า MMD ตลอดทั้งหน้า":"เมื่อคุณพาเพื่อนเข้ามาในเรื่องละเอียดอ่อน คุณจะเห็นคนรับผิดชอบชัดเจน หน้านี้จึงใช้เสียงของผมเพื่อรับเรื่องโดยตรง","หน้าบ้านและมาตรฐาน public-facing สำหรับภาพรวม ไม่ใช่เจ้าของเรื่อง private ทุกจุด":"หน้าบ้านและมาตรฐาน public-facing ดูแลภาพรวม ส่วนเคส private มี owner และขอบเขตของตัวเองชัดเจน","ช่วยรับข้อมูลและจัดให้เป็นระเบียบหลังจากคุณพร้อมส่ง ไม่ใช่คนพูดแทน founder":"Yuki ช่วยรับข้อมูลและจัด route หลังจากคุณพร้อมส่ง ส่วน founder เป็นผู้ให้คำตอบและตัดสินใจใน Friend Referral","หน้านี้จึงเปลี่ยน narrative เป็นผม เพราะคนอ่านต้องรู้สึกว่ามีคนจริงรับผิดชอบ ไม่ใช่ระบบกว้าง ๆ ที่เอาคำว่า private ไปผูกกับแบรนด์ public":"หน้านี้ใช้ narrative จากผมเพื่อให้คนอ่านรู้ชัดว่ามีคนจริงรับผิดชอบ และให้ขอบเขต private แยกจากแบรนด์ public อย่างเหมาะสม","ถ้าเพื่อนยังไม่พร้อมคุยตรง ผมรับแบบ bridge ได้ แต่ต้องไม่ใช่การปิดบัง ไม่ใช่การถือ contact เพื่อควบคุม และไม่ใช่การส่งข้อมูลลับ":"เพื่อนสามารถเริ่มผ่าน bridge ได้ โดยยึด consent, contact ownership และข้อมูลที่เจ้าตัวอนุญาตเป็นหลัก","ให้เขารู้ว่าจะส่งให้ผมดูเบื้องต้น ไม่ส่งลับหลัง":"บอกเจ้าตัวก่อนว่าจะส่งให้ผมดูเบื้องต้น แล้วส่งตามระดับ consent ที่ตกลงกัน","ดูความเหมาะสม ความพร้อม ภาพลักษณ์ และความปลอดภัย ไม่รีบขายงาน":"ดูความเหมาะสม ความพร้อม ภาพลักษณ์ และความปลอดภัยก่อนจัดขั้นต่อไปของเคส","ผมไม่อยากให้ข้อมูลเพื่อนคุณถูกเปิดกว้างเพื่อให้ดูเป็นระบบใหญ่ หลักคือจำเป็นแค่ไหน เห็นแค่นั้น":"ข้อมูลของเพื่อนใช้หลัก need-to-know เห็นเท่าที่จำเป็นต่อการพิจารณาแต่ละขั้น","ข้อมูลถูกจัดให้ชัด ไม่กระจัดกระจาย":"ข้อมูลถูกรวมเป็นเคสเดียวที่มี consent, route และสถานะชัดเจน","Yuki ช่วยต่อเมื่อถึงขั้นรับข้อมูล ไม่ใช่ owner ของ private decision":"Yuki รับช่วงเมื่อเคสพร้อมเข้าสู่ Intake ส่วน private decision อยู่กับ Boss Per","DO NOT MIX RATE":"SEPARATE RATE FLOW","ส่งเท่าที่จำเป็น บอก consent ให้ชัด และอย่ากดดันเพื่อน ถ้าเขายังไม่พร้อมคุยตรง ผมเริ่มจาก bridge ผ่านคนที่เขาไว้ใจก่อนได้":"ส่งเฉพาะข้อมูลที่จำเป็น ระบุ consent ให้ชัด และให้เพื่อนเลือกจังหวะของตัวเอง หากต้องการเริ่มแบบ bridge ผมรับผ่านคนที่เขาไว้ใจก่อนได้","ผมเปอร์ครับ หน้านี้ไม่ใช่ใบสมัคร ไม่ใช่หน้า agency และไม่ใช่การพาใครไปยืนหน้าออนไลน์ทันที เป็นทางเบา ๆ สำหรับคนที่อยากแนะนำเพื่อนให้ผมดู โดยไม่ทำให้เพื่อนรู้สึกถูกเปิดเผยเกินจำเป็น":"ผมเปอร์ครับ หน้านี้คือ Friend Referral สำหรับแนะนำเพื่อนให้ผมดูเบื้องต้นแบบเป็นส่วนตัว โดยเจ้าตัวควบคุมระดับการเปิดเผยและ online visibility ของตัวเอง","ถ้าเพื่อนยังไม่รู้เรื่อง ยังไม่โอเค หรือเป็นข้อมูลส่วนตัวที่เขาไม่ได้ให้ส่ง ผมอยากให้หยุดไว้ก่อน ความไว้ใจสำคัญกว่าการรีบส่งชื่อครับ":"เริ่มส่งเมื่อเพื่อนรับรู้และ consent ชัดเจ [/\bmodel\b/g,'น้อง ๆ ผู้ชาย นายแบบ และนักแสดงชาย']
];
function rewrite(value){
if(typeof value!=='string'||!value.trim()) return value;
const key=norm(value);
let output=(path==='/partner/referral'&&referral.get(key))||shared.get(key)||legacy.get(key)||value;
for(const [pattern,replacement] of phraseRules) output=output.replace(pattern,replacement);
return output;
}
function skipElement(element){
if(!element) return true;
return !!element.closest('script,style,noscript,textarea,pre,code,[data-partner-copy-preserve]');
}
function rewriteText(root){
const scope=root.nodeType===Node.DOCUMENT_NODE?root.body:root;
if(!scope) return;
const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT,{
acceptNode(node){
if(!node.nodeValue||!node.nodeValue.trim()||skipElement(node.parentElement)) return NodeFilter.FILTER_REJECT;
return NodeFilter.FILTER_ACCEPT;
}
});
const nodes=[];
while(walker.nextNode()) nodes.push(walker.currentNode);
for(const node of nodes){
const next=rewrite(node.nodeValue);
if(next!==node.nodeValue) node.nodeValue=next;
}
}
function rewriteAttributes(root){
const scope=root.nodeType===Node.DOCUMENT_NODE?root:root.parentElement||root;
if(!scope.querySelectorAll) return;
const elements=[...(scope.matches&&scope.matches('[placeholder],[title],[aria-label],[alt]')?[scope]:[]),...scope.querySelectorAll('[placeholder],[title],[aria-label],[alt]')];
for(const element of elements){
if(skipElement(element)) continue;
for(const name of ['placeholder','title','aria-label','alt']){
if(!element.hasAttribute(name)) continue;
const before=element.getAttribute(name);
const after=rewrite(before);
if(after!==before) element.setAttribute(name,after);
}
}
}
function warmErrors(root){
const scope=root.nodeType===Node.DOCUMENT_NODE?root:root.parentElement||root;
if(!scope.querySelectorAll) return;
scope.querySelectorAll('[role="alert"],.error,.error-message,[data-error]').forEach(element=>{
const text=norm(element.textContent);
if(/ลิงก์.*(ไม่ถูกต้อง|หมดอายุ)|invalid.*(link|token)|expired.*(link|token)/i.test(text)){
element.textContent='ลิงก์นี้ยังเปิดข้อมูลของคุณไม่ได้ กรุณาใช้ลิงก์ล่าสุดที่ MMD ส่งให้นะครับ';
}else if(/network|timeout|เชื่อมต่อ|อินเทอร์เน็ต/i.test(text)){
element.textContent='ตอนนี้ระบบกำลังเชื่อมต่อใหม่ กรุณารอสักครู่แล้วลองอีกครั้งนะครับ';
}else if(/required|กรุณากรอก|จำเป็นต้องกรอก/i.test(text)&&text.length<120){
element.textContent='กรุณากรอกข้อมูลส่วนนี้ให้ครบ เพื่อให้ MMD ช่วยดูต่อได้ครับ';
}
});
}
function fixLinks(root){
const scope=root.nodeType===Node.DOCUMENT_NODE?root:root.parentElement||root;
if(!scope.querySelectorAll) return;
scope.querySelectorAll('a,button').forEach(element=>{
let href=element.getAttribute&&element.getAttribute('href');
if(href==='/partner/model/recommend-model/apply?source=model-to-model'){
element.setAttribute('href','/partner/model/recommend-model-apply?source=model-to-model');
href=element.getAttribute('href');
}
if(href==='/partner/apply?partner_type=model'||href==='/partner/apply?intent=refer_model'){
element.setAttribute('href','/partner/apply?partner_type=modeling');
href=element.getAttribute('href');
}
if(path==='/partner/login'&&/หน้าจัดการ|dashboard/i.test(norm(element.textContent))){
element.setAttribute('href','/sigil/model/dashboard/partner-login');
}
const label=norm(element.textContent);
if(/^(ส่ง|เริ่ม|ยืนยัน|เข้าสู่ระบบ|เปิดหน้าจัดการ)/.test(label)) element.setAttribute('data-partner-cta','primary');
else if(/^(ดู|อ่าน|กลับ)/.test(label)) element.setAttribute('data-partner-cta','secondary');
});
if(path==='/partner/model/preview'){
scope.querySelectorAll('a[href^="/partner/apply"]').forEach(element=>{
element.setAttribute('href','/partner/apply?partner_type=modeling');
element.setAttribute('data-partner-cta','primary');
});
}
}
function hasOwnFooter(){
return !!document.querySelector('footer:not(.mmd-partner-canon-footer),[data-footer],[class$="__footer"],[class*="__footer "],[class^="footer-"],[class*=" footer-"],[class$="-footer"],[class*="-footer "]');
}
function addFooter(){
if(document.querySelector('.mmd-partner-canon-footer')) return;
if(path!=='/partner/terms'&&hasOwnFooter()) return;
if(path!=='/partner/terms') document.documentElement.classList.add('mmd-partner-footer-fallback-compact');
const footer=document.createElement('footer');
footer.className='mmd-partner-canon-footer';
footer.setAttribute('aria-label','ส่วนท้ายหน้าพาร์ตเนอร์ของ MMD Privé');
footer.innerHTML='<span>MMD PRIVÉ · BANGKOK</span><span>ดูแลความเป็นส่วนตัวในทุกขั้นตอน</span>';
document.body.appendChild(footer);
}
function run(root=document){
rewriteText(root);
rewriteAttributes(root);
warmErrors(root);
fixLinks(root);
addFooter();
}
let timer=0;
const schedule=root=>{
clearTimeout(timer);
timer=setTimeout(()=>run(root&&root.isConnected?root:document),24);
};
const boot=()=>{
run(document);
requestAnimationFrame(()=>run(document));
setTimeout(()=>run(document),160);
setTimeout(()=>run(document),700);
const observer=new MutationObserver(records=>{
const node=records.find(record=>record.addedNodes&&record.addedNodes.length)?.target;
schedule(node||document);
});
observer.observe(document.body,{childList:true,subtree:true});
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true});
else boot();
window.addEventListener('load',()=>run(document),{once:true});
})();
</script>
