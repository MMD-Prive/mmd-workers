(function(){
  "use strict";

  var outer=document.getElementById("mmd-public-membership");
  if(!outer)return;

  var root=outer.querySelector("#mmd-membership-lvmax");
  if(!root||root.dataset.init==="1")return;

  root.dataset.init="1";
  root.classList.add("is-enhanced");

  var API=root.getAttribute("data-api")||"/member/api/liff/public-membership";
  var MINIAPP=root.getAttribute("data-miniapp")||"https://miniapp.line.me/2010862595-yT4DCEMc/";

  var status=root.querySelector("[data-public-status]");
  var cards=[].slice.call(root.querySelectorAll("[data-package-card]"));
  var buttons=[].slice.call(root.querySelectorAll("[data-buy-package]"));
  var cardDetails=[].slice.call(root.querySelectorAll(".nx-more"));
  var faq=[].slice.call(root.querySelectorAll(".nx-faq details"));
  var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var catalogReady=false;
  var busy=false;
  var redTermsOK=false;
  var availableCodes=[];

  function money(value){
    var n=Number(value);
    return Number.isFinite(n)?n.toLocaleString("th-TH"):"";
  }

  function monthsFromDays(days){
    var d=Number(days);
    if(!Number.isFinite(d)||d<=0)return 12;
    return Math.max(1,Math.round(d/30.4375));
  }

  function thaiTerm(months){
    var m=Number(months)||12;
    return m%12===0?(m/12)+" ปี":m+" เดือน";
  }

  function monthly(amount,months){
    var a=Number(amount),m=Number(months);
    if(!Number.isFinite(a)||!Number.isFinite(m)||m<=0)return null;
    return Math.round(a/m);
  }


  function show(message,tone){
    if(!status)return;
    status.hidden=!message;
    status.textContent=message||"";
    if(tone)status.setAttribute("data-tone",tone);
    else status.removeAttribute("data-tone");
  }

  function syncButtons(){
    buttons.forEach(function(btn){
      var enabled=catalogReady&&availableCodes.indexOf(btn.dataset.buyPackage)>=0&&!busy;
      btn.disabled=!enabled;
      btn.setAttribute("aria-busy",busy?"true":"false");
    });
  }

  function returnPath(code){
    return "/pay/membership?package="+encodeURIComponent(code);
  }

  function authUrl(code){
    var url=new URL(MINIAPP);
    url.searchParams.set("intent","status");
    url.searchParams.set("return_to",returnPath(code));
    return url.toString();
  }

  function safePay(value){
    if(typeof value!=="string"||!value.trim())return null;
    try{
      var url=new URL(value,"https://mmdbkk.com");
      var keys=Array.from(url.searchParams.keys());
      if(url.protocol!=="https:"||url.hostname!=="mmdbkk.com")return null;
      if(url.port||url.username||url.password||url.hash)return null;
      if(url.pathname!=="/pay/checkout")return null;
      if(keys.length!==1||keys[0]!=="t"||!url.searchParams.get("t").trim())return null;
      return url;
    }catch(_error){return null;}
  }

  async function fetchJson(url,options,timeoutMs){
    var controller="AbortController" in window?new AbortController():null;
    var timer=controller?setTimeout(function(){controller.abort();},timeoutMs):null;
    var opts=Object.assign({},options||{});

    if(controller)opts.signal=controller.signal;

    try{
      var response=await fetch(url,opts);
      var payload=await response.json().catch(function(){return null;});
      return {response:response,payload:payload};
    }finally{
      if(timer)clearTimeout(timer);
    }
  }

  function updateCard(item){
    var code=String(item&&item.package_code||"");
    if(code==="red_card"&&!redTermsOK)return;
    if(!code)return;

    var card=cards.find(function(node){return node.dataset.package===code;});
    if(!card)return;

    var amount=Number(item.amount_thb);
    var months=monthsFromDays(item.duration_days);
    var avg=monthly(amount,months);

    var priceNode=card.querySelector("[data-card-price]");
    var termNode=card.querySelector("[data-card-term]");
    var monthlyNode=card.querySelector("[data-card-monthly]");
    var button=card.querySelector("[data-buy-package]");
    var fact=root.querySelector('[data-package-fact="'+code+'"] [data-fact-price]');

    if(priceNode&&Number.isFinite(amount))priceNode.textContent=money(amount);
    if(termNode)termNode.textContent=thaiTerm(months);
    if(monthlyNode&&avg!==null)monthlyNode.textContent=money(avg)+" THB / เดือน";
    if(fact&&Number.isFinite(amount))fact.textContent=money(amount)+" THB · "+thaiTerm(months);

    if(code==="mmd_member"&&Number.isFinite(amount)){
      var dockPrice=root.querySelector("[data-dock-price]");
      if(dockPrice)dockPrice.textContent=money(amount);
    }

    if(button&&Number.isFinite(amount)){
      var small=button.querySelector("small");
      if(small)small.textContent=money(amount)+" THB · "+thaiTerm(months);
    }
  }

  function focusCard(code,scroll){
    var card=cards.find(function(node){return node.dataset.package===code;});
    if(!card)return;

    card.classList.remove("is-focus");
    void card.offsetWidth;
    card.classList.add("is-focus");

    if(scroll){
      card.scrollIntoView({behavior:reduced?"auto":"smooth",block:"center"});
    }

    setTimeout(function(){card.classList.remove("is-focus");},900);
  }

  async function loadCatalog(){
    catalogReady=false;
    busy=false;
    availableCodes=[];
    syncButtons();
    show("กำลังอัปเดต Membership ล่าสุด…","soft");

    var result=await fetchJson(
      API+"/catalog",
      {credentials:"include",headers:{accept:"application/json"},cache:"no-store"},
      10000
    );

    if(!result.response.ok||!result.payload||result.payload.ok!==true||!Array.isArray(result.payload.packages)){
      throw new Error("catalog_unavailable");
    }

    redTermsOK=result.payload.packages.some(function(item){return item&&item.package_code==="red_card"&&item.amount_thb===11499&&item.duration_days===730;});
    var redNote=root.querySelector("[data-red-note]");
    if(redNote)redNote.hidden=redTermsOK;
    result.payload.packages.forEach(updateCard);
    availableCodes=result.payload.packages.map(function(item){
      return String(item.package_code||"");
    }).filter(function(code){return code&&(code!=="red_card"||redTermsOK);});

    catalogReady=true;
    syncButtons();
    show("Membership ล่าสุดพร้อมแล้วครับ","soft");
    setTimeout(function(){show("");},1400);

    var requested=new URLSearchParams(location.search).get("package");
    if(requested&&availableCodes.indexOf(requested)>=0){
      setTimeout(function(){focusCard(requested,true);},160);
    }
  }

  async function purchase(code){
    if(!catalogReady||busy||availableCodes.indexOf(code)<0)return;

    busy=true;
    syncButtons();
    show("กำลังเตรียมรายการ Membership ของคุณครับ","soft");

    try{
      var result=await fetchJson(
        API+"/purchase",
        {
          method:"POST",
          credentials:"include",
          headers:{accept:"application/json","content-type":"application/json"},
          body:JSON.stringify({package_code:code})
        },
        15000
      );

      var response=result.response;
      var payload=result.payload;

      var errorCode=payload&&payload.error&&payload.error.code;
      var existingRedOrder=code==="red_card"&&response.status===409?{
        red_card_order_already_paid:["รายการ Red Card นี้ชำระแล้วครับ ดูสถานะได้ใน MY MMD โดยไม่ต้องชำระซ้ำ","/my-mmd/","เปิด MY MMD"],
        red_card_order_proof_already_received:["เราได้รับหลักฐานชำระ Red Card แล้วครับ กำลังตรวจสอบ ยังไม่ต้องชำระซ้ำ","/my-mmd/","ดูสถานะใน MY MMD"],
        red_card_prior_order_review_required:["มีรายการ Red Card เดิมที่ต้องตรวจสอบก่อนครับ ติดต่อ MMD เพื่อเช็กสถานะ และยังไม่ต้องชำระซ้ำ","https://lin.ee/xRqsALs","ติดต่อ MMD ทาง LINE"]
      }:null;
      if(existingRedOrder&&Object.prototype.hasOwnProperty.call(existingRedOrder,errorCode)){
        busy=false;
        syncButtons();
        var review=existingRedOrder[errorCode];
        show(review[0],"soft");
        if(status){
          var reviewLink=document.createElement("a");
          reviewLink.href=review[1];
          reviewLink.textContent=review[2];
          status.append(document.createTextNode(" "),reviewLink);
          status.focus();
        }
        return;
      }
      if(code==="red_card"&&((response.status===401&&errorCode==="LINE_SESSION_REQUIRED")||
        (response.status===409&&errorCode==="RED_CARD_ACCOUNT_VERIFICATION_REQUIRED"))){
        busy=false;
        syncButtons();
        show("ยืนยันบัญชี MY MMD ก่อนสมัคร Red Card ครับ เมื่อยืนยันแล้วจะกลับมาเลือก Red Card ได้อีกครั้ง","soft");
        if(status){
          var link=document.createElement("a");
          link.href=authUrl(code);
          link.textContent="ยืนยันบัญชี MY MMD";
          status.append(document.createTextNode(" "),link);
          status.focus();
        }
        return;
      }
      if(response.status===401&&payload&&payload.error&&payload.error.code==="LINE_SESSION_REQUIRED"){
        location.assign(authUrl(code));
        return;
      }

      if(!response.ok||!payload||payload.ok!==true){
        throw new Error(payload&&payload.error&&payload.error.code||"payment_unavailable");
      }

      if(code==="red_card"&&(!payload.package||payload.package.package_code!=="red_card"||
        payload.package.amount_thb!==11499||payload.package.duration_days!==730)){
        availableCodes=availableCodes.filter(function(item){return item!=="red_card";});
        var note=root.querySelector("[data-red-note]");
        if(note)note.hidden=false;
        throw new Error("red_card_terms_unconfirmed");
      }
      var pay=safePay(payload.redirect_to||payload.customer_payment_url);
      if(!pay)throw new Error("payment_link_invalid");

      show("รายการพร้อมแล้วครับ กำลังเปิดหน้าชำระของคุณ…","soft");
      location.assign(pay.toString());
    }catch(_error){
      busy=false;
      syncButtons();
      show(_error.message==="red_card_terms_unconfirmed"?"ผมยังยืนยันเงื่อนไข Red Card 2 ปีไม่ได้ครับ ยังไม่ต้องชำระ ทัก MMD ให้ช่วยเช็กได้เลย":"ผมยังพาไปหน้าชำระไม่ได้ครับ ลองอีกครั้งหรือทัก MMD ทาง LINE ได้เลย","error");
      if(status)status.focus();
    }
  }

  function bindExclusiveDetails(items){
    items.forEach(function(item){
      item.addEventListener("toggle",function(){
        if(!item.open)return;
        items.forEach(function(other){
          if(other!==item&&other.open)other.open=false;
        });
      });
    });
  }

  buttons.forEach(function(button){
    button.addEventListener("click",function(){
      purchase(button.dataset.buyPackage);
    });
  });

  bindExclusiveDetails(cardDetails);
  bindExclusiveDetails(faq);

  var redLink=root.querySelector("[data-focus-red]");
  if(redLink){
    redLink.addEventListener("click",function(){
      setTimeout(function(){focusCard("red_card",true);},70);
    });
  }

  var retry=root.querySelector("[data-retry]");
  function refreshCatalog(){
    if(retry)retry.hidden=true;
    loadCatalog().catch(function(){
    catalogReady=false;
    busy=false;
    availableCodes=[];
    syncButtons();
    show("ตอนนี้เราตรวจสอบแพ็กเกจล่าสุดไม่ได้ครับ ตัวเลขด้านล่างมีไว้ดูเบื้องต้น ลองโหลดอีกครั้งหรือทักเราใน LINE ได้เลย","error");
    if(retry)retry.hidden=false;
    });
  }
  if(retry)retry.addEventListener("click",refreshCatalog);
  refreshCatalog();

  requestAnimationFrame(function(){root.classList.add("is-ready");});
})();
</script>
