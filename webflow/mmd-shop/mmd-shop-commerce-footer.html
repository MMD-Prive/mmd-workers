<script>
(function(){
"use strict";
var root=document.getElementById("mmdshop-final"); if(!root)return;
var API=location.origin;
var CATALOG=API+"/mmd-shop/api/products";
var CHECKOUT=API+"/mmd-shop/api/checkout";
var KEY="mmd_shop_cart";
var grid=document.getElementById("mmdGrid");
var bubble=document.getElementById("mmdCartBubble");
var list=document.getElementById("mmdCartList");
var total=document.getElementById("mmdCartTotal");
var panel=document.querySelector("#mmdCartDrawer .mmd-panel>div");
var products=[];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function money(v){var i=window.MMDShopI18n;if(i&&typeof i.money==="function")return i.money(v);var n=Number(v);return Number.isFinite(n)?n.toLocaleString("th-TH")+" บาท":"สอบถามราคา"}
function restricted(p){return /^PPP25-/i.test(p.sku||"")||/\bpod\b/i.test(p.product_name||"")}
function familyType(p){
 var s=String(p&&p.sku||"").toUpperCase(),n=String(p&&p.product_name||"").toLowerCase();
 if(s.indexOf("PPP25-")===0||n.indexOf("pod premium plus 2.5mg")>=0)return "pod";
 if(s.indexOf("WGG-")===0||n.indexOf("water gg plus")>=0||n.indexOf("gg water")>=0)return "gg";
 return "";
}
function podFlavour(p){
 var n=String(p&&p.product_name||""),m=n.match(/—\s*(.+)$/);
 return m?m[1].trim():(p&&p.sku?p.sku:"Flavour");
}
function ggSize(p){
 var n=String((p&&p.product_name)||"")+" "+String((p&&p.sku)||""),m=n.match(/(10|25|50)\s*ml/i);
 return m?m[1]+"ml":"";
}
function detailUrl(p){return p.product_url||("/mmd-shop/product/"+encodeURIComponent(String(p.sku||p.id||"product").toLowerCase()))}
function groupProducts(rows){
 var normal=[],pod=[],gg=[];
 rows.forEach(function(p){var t=familyType(p);if(t==="pod"){pod.push(p);return}if(t==="gg"){gg.push(p);return}normal.push(p)});
 if(pod.length)normal.unshift({type:"pod_group",name:"Pod Premium Plus 2.5mg",variants:pod});
 if(gg.length){var order={"10ml":1,"25ml":2,"50ml":3};gg.sort(function(a,b){return (order[ggSize(a)]||99)-(order[ggSize(b)]||99)});normal.unshift({type:"gg_group",name:"GG Water",variants:gg})}
 return normal;
}
function eligibleAction(p){
 var priced=Number(p&&p.selling_price_thb)>0,eligible=p&&p.checkout_eligible===true&&!restricted(p)&&priced;
 return eligible
  ? '<button class="mmd-shop-buy" type="button" data-shop-add="'+esc(p.id)+'">เพิ่มลง Cart</button>'
  : '<div class="mmd-shop-restricted">'+esc(restricted(p)?"ไม่เปิด Online Checkout สำหรับสินค้ากลุ่มนี้":checkoutStatusText(p))+'</div>';
}
function renderPodGroup(card,item){
 var first=item.variants[0];
 card.innerHTML='<div class="mmd-card-media"><img src="'+img(first)+'" alt="Pod Premium Plus 2.5mg" loading="lazy"><span class="mmd-badge">FLAVOUR SELECT</span></div><div class="mmd-card-body"><h3>Pod Premium Plus 2.5mg</h3><p>เลือก Flavour จากรายการเดียว</p><div class="mmd-card-bottom"><div class="mmd-price"><span>MMD Price</span><strong data-pod-price>'+money(first&&first.selling_price_thb)+'</strong></div><div class="mmd-variant"><div class="mmd-variant-label">เลือก Flavour</div><select class="mmd-select" data-pod-select>'+item.variants.map(function(v,i){return '<option value="'+i+'">'+esc(podFlavour(v))+' — '+esc(money(v.selling_price_thb))+'</option>'}).join("")+'</select><div class="mmd-variant-meta"><span>SKU</span><strong data-pod-sku>'+esc(first&&first.sku)+'</strong></div></div><a class="mmd-shop-detail" data-pod-detail href="'+esc(detailUrl(first))+'">ดูรายละเอียด Flavour นี้</a><div class="mmd-shop-restricted">ไม่เปิด Online Checkout สำหรับสินค้ากลุ่มนี้</div></div></div>';
 var s=card.querySelector("[data-pod-select]"),sku=card.querySelector("[data-pod-sku]"),price=card.querySelector("[data-pod-price]"),detail=card.querySelector("[data-pod-detail]");
 s.addEventListener("change",function(){var p=item.variants[Number(s.value)]||first;sku.textContent=p.sku||"—";price.textContent=money(p.selling_price_thb);detail.href=detailUrl(p)});
}
function renderGGGroup(card,item){
 var first=item.variants[0];
 card.innerHTML='<div class="mmd-card-media"><img src="'+img(first)+'" alt="GG Water" loading="lazy"><span class="mmd-badge">SIZE SELECT</span></div><div class="mmd-card-body"><h3>GG Water</h3><p>เลือกขนาด 10ml / 25ml / 50ml</p><div class="mmd-card-bottom"><div class="mmd-price"><span>MMD Price</span><strong data-gg-price>'+money(first&&first.selling_price_thb)+'</strong></div><div class="mmd-variant"><div class="mmd-variant-label">เลือกขนาด</div><select class="mmd-select" data-gg-select>'+item.variants.map(function(v,i){return '<option value="'+i+'">'+esc((ggSize(v)||v.sku||"Variant").toUpperCase())+' — '+esc(money(v.selling_price_thb))+'</option>'}).join("")+'</select><div class="mmd-variant-meta"><span>SKU</span><strong data-gg-sku>'+esc(first&&first.sku)+'</strong></div><div class="mmd-variant-state" data-gg-state></div></div><a class="mmd-shop-detail" data-gg-detail href="'+esc(detailUrl(first))+'">ดูรายละเอียดขนาดนี้</a><div data-gg-action>'+eligibleAction(first)+'</div></div></div>';
 var s=card.querySelector("[data-gg-select]"),sku=card.querySelector("[data-gg-sku]"),price=card.querySelector("[data-gg-price]"),detail=card.querySelector("[data-gg-detail]"),state=card.querySelector("[data-gg-state]"),action=card.querySelector("[data-gg-action]");
 function update(){var p=item.variants[Number(s.value)]||first;sku.textContent=p.sku||"—";price.textContent=money(p.selling_price_thb);detail.href=detailUrl(p);state.textContent=p.checkout_eligible===true?"พร้อมสั่งซื้อ":checkoutStatusText(p);action.innerHTML=eligibleAction(p)}
 s.addEventListener("change",update);update();
}
function checkoutStatusText(p){
 var s=String(p&&p.online_checkout_status||"").toLowerCase();
 if(s==="out_of_stock")return "สินค้าหมดชั่วคราว";
 if(s==="stock_untracked")return "กำลังตรวจสต๊อกก่อนเปิดรับรายการ";
 if(s==="on_demand")return "กำลังยืนยัน Supplier ก่อนเปิดรับรายการ";
 if(s==="restricted")return "ไม่เปิด Online Checkout สำหรับสินค้ากลุ่มนี้";
 return "ยังไม่เปิดรับรายการออนไลน์";
}
function toast(msg){var t=document.getElementById("mmdToast");if(t){t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1400)}}
function reconcileCart(){
 var current=cart().filter(function(x){return x&&x.product_id}),next=[],changed=false;
 current.forEach(function(x){
  var p=products.find(function(v){return v.id===x.product_id});
  if(!p||p.checkout_eligible!==true||restricted(p)){changed=true;return}
  var qty=Math.max(1,Math.floor(Number(x.qty)||1));
  if(String(p.stock_status||"").toLowerCase()==="tracked"){
   var available=Math.max(0,Math.floor(Number(p.available)||0));
   if(available<=0){changed=true;return}
   if(qty>available){qty=available;changed=true}
  }
  next.push(Object.assign({},x,{qty:qty}));
 });
 if(changed)localStorage.setItem(KEY,JSON.stringify(next));
 return changed;
}
function img(p){var s=(p.sku||"").toUpperCase();if(s.indexOf("WGG-")===0)return "https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6a8c2bc2521dbd91c40072a0_GG%20Water%2003.webp";if(s.indexOf("PPP25-")===0)return "https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6a8c2de261bf62d20a6d4a9e_Pod%20Plus%20MMD.webp";return "https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6a8c1e2f03656a00250f4531_MMD%20Shop%20Luxury%20Gift%20Box.webp"}
function cart(){try{var c=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(c)?c:[]}catch(e){return[]}}
function save(c){localStorage.setItem(KEY,JSON.stringify(c));renderCart()}
function renderProducts(){
 if(!grid)return;
 var active=products.filter(function(p){return String(p.status||"").toLowerCase()==="active"});
 var items=groupProducts(active);
 grid.innerHTML="";
 items.forEach(function(item){
  var card=document.createElement("article");card.className="mmd-card";
  if(item.type==="pod_group")renderPodGroup(card,item);
  else if(item.type==="gg_group")renderGGGroup(card,item);
  else{
   var p=item,locked=restricted(p),priced=Number(p.selling_price_thb)>0,eligible=p.checkout_eligible===true&&!locked&&priced;
   var detail=detailUrl(p);
   var action=eligible
    ? '<button class="mmd-shop-buy" type="button" data-shop-add="'+esc(p.id)+'">เพิ่มลง Cart</button>'
    : '<div class="mmd-shop-restricted">'+esc(locked?"ไม่เปิด Online Checkout สำหรับสินค้ากลุ่มนี้":checkoutStatusText(p))+'</div>';
   card.innerHTML='<div class="mmd-card-media"><img src="'+img(p)+'" alt="'+esc(p.product_name)+'" loading="lazy"><span class="mmd-badge">'+esc(p.curation_label||p.category||"MMD Pick")+'</span></div><div class="mmd-card-body"><h3>'+esc(p.product_name)+'</h3><p>'+esc(p.description||"MMD curated selection")+'</p><div class="mmd-card-bottom"><div class="mmd-price"><span>MMD Price</span>'+money(p.selling_price_thb)+'</div><a class="mmd-shop-detail" href="'+esc(detail)+'">ดูรายละเอียด</a>'+action+'</div></div>';
  }
  grid.appendChild(card);
 });
}
function renderCart(){
 var c=cart().filter(function(x){return x&&x.product_id});
 var q=c.reduce(function(s,x){return s+(Number(x.qty)||0)},0);
 var count=document.getElementById("mmdCartCount");if(count)count.textContent=q;
 if(list)list.innerHTML=c.length?c.map(function(x,i){return '<div class="mmd-cartitem"><div><strong>'+esc(x.name)+'</strong><small>'+x.qty+' ชิ้น · '+money(x.unit_price_thb)+'</small></div><button type="button" data-shop-remove="'+i+'">ลบ</button></div>'}).join(""):'<p class="mmd-dtext">ยังไม่มีสินค้าใน Cart</p>';
 var sum=c.reduce(function(s,x){return s+(Number(x.unit_price_thb)||0)*(Number(x.qty)||0)},0);
 if(total)total.textContent=money(sum);
}
function add(id){
 var p=products.find(function(x){return x.id===id});
 if(!p||p.checkout_eligible!==true||restricted(p)||!(Number(p.selling_price_thb)>0)){toast(p?checkoutStatusText(p):"ยังไม่สามารถเพิ่มสินค้านี้ได้");return}
 var c=cart().filter(function(x){return x&&x.product_id});var found=c.find(function(x){return x.product_id===id});
 if(String(p.stock_status||"").toLowerCase()==="tracked"){
  var available=Math.max(0,Math.floor(Number(p.available)||0)),current=found?Math.max(0,Math.floor(Number(found.qty)||0)):0;
  if(current>=available){toast("สต๊อกที่พร้อมสั่งมี "+available+" ชิ้น");return}
 }
 if(found)found.qty+=1;else c.push({product_id:p.id,key:p.id,name:p.product_name,sku:p.sku,price:money(p.selling_price_thb),unit_price_thb:Number(p.selling_price_thb),qty:1});
 save(c);toast("เพิ่มลง Cart แล้ว");
}
function syncShippingVisibility(){
 var method=document.getElementById("mmdShopDeliveryMethod"),fields=document.getElementById("mmdShopShippingFields");
 if(fields)fields.hidden=!!(method&&method.value==="pickup");
}
function injectCheckout(){
 if(!panel||document.getElementById("mmdShopCheckoutBox"))return;
 var box=document.createElement("div");box.id="mmdShopCheckoutBox";box.className="mmd-checkoutbox";
 box.innerHTML='<h4>ข้อมูลสำหรับสั่งซื้อ</h4><p>ก่อนเปิด Order ผมให้ MMD เช็กราคา สต๊อก และข้อมูลจัดส่งอีกครั้งครับ</p><input id="mmdShopName" autocomplete="name" placeholder="ชื่อผู้สั่งซื้อ *"><input id="mmdShopPhone" inputmode="tel" autocomplete="tel" placeholder="เบอร์โทร *"><input id="mmdShopEmail" inputmode="email" autocomplete="email" placeholder="อีเมล (ถ้ามี)"><label><span>วิธีรับสินค้า</span><select id="mmdShopDeliveryMethod"><option value="delivery">จัดส่ง</option><option value="pickup">รับสินค้าเอง / Pickup</option></select></label><div class="mmd-shipping-grid" id="mmdShopShippingFields"><input id="mmdShopAddress1" autocomplete="address-line1" placeholder="ที่อยู่จัดส่ง *"><input id="mmdShopAddress2" autocomplete="address-line2" placeholder="อาคาร / ชั้น / ห้อง (ถ้ามี)"><div class="mmd-shipping-two"><input id="mmdShopSubdistrict" placeholder="แขวง / ตำบล"><input id="mmdShopDistrict" placeholder="เขต / อำเภอ *"></div><div class="mmd-shipping-two"><input id="mmdShopProvince" autocomplete="address-level1" placeholder="จังหวัด *"><input id="mmdShopPostal" inputmode="numeric" autocomplete="postal-code" maxlength="5" placeholder="รหัสไปรษณีย์ *"></div></div><textarea id="mmdShopDeliveryNote" rows="2" placeholder="หมายเหตุการจัดส่ง (ถ้ามี)"></textarea><button class="mmd-shop-buy" id="mmdShopCheckoutBtn" type="button">สั่งซื้อและชำระเงิน</button><div class="mmd-checkout-status" id="mmdShopCheckoutStatus" aria-live="polite"></div>';
 var actions=panel.querySelector(".mmd-cartactions");panel.insertBefore(box,actions||null);
 document.getElementById("mmdShopDeliveryMethod").addEventListener("change",syncShippingVisibility);
 document.getElementById("mmdShopCheckoutBtn").addEventListener("click",checkout);
 syncShippingVisibility();
}
async function checkout(){
 var btn=document.getElementById("mmdShopCheckoutBtn"),status=document.getElementById("mmdShopCheckoutStatus");
 var name=(document.getElementById("mmdShopName").value||"").trim(),phone=(document.getElementById("mmdShopPhone").value||"").trim(),email=(document.getElementById("mmdShopEmail").value||"").trim();
 var method=(document.getElementById("mmdShopDeliveryMethod").value||"delivery").trim();
 var shipping={delivery_method:method,recipient_name:name,phone:phone,delivery_note:(document.getElementById("mmdShopDeliveryNote").value||"").trim()};
 if(method==="delivery"){
  shipping.address_line1=(document.getElementById("mmdShopAddress1").value||"").trim();
  shipping.address_line2=(document.getElementById("mmdShopAddress2").value||"").trim();
  shipping.subdistrict=(document.getElementById("mmdShopSubdistrict").value||"").trim();
  shipping.district=(document.getElementById("mmdShopDistrict").value||"").trim();
  shipping.province=(document.getElementById("mmdShopProvince").value||"").trim();
  shipping.postal_code=(document.getElementById("mmdShopPostal").value||"").replace(/\D/g,"").slice(0,5);
 }
 var c=cart().filter(function(x){return x&&x.product_id});
 if(!c.length){status.textContent="กรุณาเพิ่มสินค้าลง Cart ก่อน";return}
 if(reconcileCart()){
  renderCart();
  status.textContent="ผมอัปเดต Cart ตามสต๊อกล่าสุดแล้ว ลองดูรายการอีกครั้งครับ";
  return
 }
 var blocked=c.find(function(x){var p=products.find(function(v){return v.id===x.product_id});return !p||p.checkout_eligible!==true||restricted(p)});
 if(blocked){status.textContent="มีสินค้าที่ไม่พร้อมสั่งซื้อ กรุณานำออกจาก Cart";return}
 if(name.length<2||phone.replace(/\D/g,"").length<8){status.textContent="กรุณากรอกชื่อและเบอร์โทรให้ครบ";return}
 if(method==="delivery"&&(shipping.address_line1.length<5||!shipping.district||!shipping.province||shipping.postal_code.length!==5)){status.textContent="กรุณากรอกที่อยู่ เขต/อำเภอ จังหวัด และรหัสไปรษณีย์ให้ครบ";return}
 btn.disabled=true;status.textContent="กำลังเปิด Order ให้ครับ…";
 try{
  var res=await fetch(CHECKOUT,{method:"POST",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify({customer:{name:name,phone:phone,email:email},shipping:shipping,source_path:"/mmd-shop",items:c.map(function(x){return{product_id:x.product_id,quantity:Number(x.qty)||1}})})});
  var data=await res.json().catch(function(){return{}});
  if(!res.ok||data.ok!==true||!data.payment_url)throw new Error(data.error||"checkout_failed");
  localStorage.removeItem(KEY);location.href=data.payment_url;
 }catch(e){
  var messages={shipping_address_required:"กรุณากรอกที่อยู่จัดส่ง",shipping_district_required:"กรุณากรอกเขต / อำเภอ",shipping_province_required:"กรุณากรอกจังหวัด",shipping_postal_code_required:"กรุณากรอกรหัสไปรษณีย์ 5 หลัก",product_not_eligible_for_online_checkout:"มีสินค้าที่ไม่รองรับ Online Checkout กรุณานำออกจาก Cart"};
  status.textContent=messages[e.message]||"ยังเปิดรายการชำระเงินไม่ได้ครับ ลองใหม่อีกครั้ง";btn.disabled=false
 }
}
grid&&grid.addEventListener("click",function(e){var b=e.target.closest("[data-shop-add]");if(b)add(b.getAttribute("data-shop-add"))});
list&&list.addEventListener("click",function(e){var b=e.target.closest("[data-shop-remove]");if(!b)return;var c=cart().filter(function(x){return x&&x.product_id});c.splice(Number(b.getAttribute("data-shop-remove")),1);save(c)});
function setCartOpen(open){
 var drawer=document.getElementById("mmdCartDrawer");if(!drawer)return;
 drawer.classList.toggle("is-open",!!open);
 document.body.style.overflow=open?"hidden":"";
 if(open){injectCheckout();renderCart()}
}
bubble&&bubble.addEventListener("click",function(){setCartOpen(true)});
document.addEventListener("click",function(e){if(e.target.closest("[data-cart-close]"))setCartOpen(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")setCartOpen(false)});
var clearBtn=document.getElementById("mmdClearCart");
clearBtn&&clearBtn.addEventListener("click",function(){localStorage.removeItem(KEY);renderCart();toast("ล้าง Cart แล้ว")});
var copyBtn=document.getElementById("mmdCopyCart");
copyBtn&&copyBtn.addEventListener("click",function(){
 var c=cart().filter(function(x){return x&&x.product_id});
 var txt=c.length?c.map(function(x){return (x.name||x.sku||"สินค้า")+" × "+(Number(x.qty)||1)+" — "+money((Number(x.unit_price_thb)||0)*(Number(x.qty)||1))}).join("\n"):"ยังไม่มีสินค้าใน Cart";
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("คัดลอก Cart แล้ว")}).catch(function(){toast("คัดลอกไม่สำเร็จ")})}
 else{toast("อุปกรณ์นี้ไม่รองรับการคัดลอกอัตโนมัติ")}
});
document.addEventListener("mmd:shop-language-change",function(){renderProducts();renderCart();if(window.MMDShopI18n)window.MMDShopI18n.apply(root)});\nfetch(CATALOG,{cache:"no-store"}).then(function(r){return r.json()}).then(function(data){if(!data||data.ok!==true)throw 0;products=data.products||[];var cartChanged=reconcileCart();renderProducts();renderCart();injectCheckout();if(cartChanged)toast("Cart อัปเดตตามสต๊อกล่าสุดแล้ว");if(location.hash==="#cart"&&bubble){window.setTimeout(function(){bubble.click()},60)}}).catch(function(){if(grid)grid.innerHTML='<p class="mmd-copy">ยังโหลดรายการสินค้าไม่ได้ กรุณาลองใหม่อีกครั้ง</p>'});
})();
</script>
