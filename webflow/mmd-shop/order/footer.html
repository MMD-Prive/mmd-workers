<script>
(function(){
"use strict";
var state=document.getElementById("orderState"),card=document.getElementById("orderCard");
if(!state||!card)return;
var p=new URLSearchParams(location.search),t=p.get("t")||"";
var $=function(id){return document.getElementById(id)};
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})};
var money=function(v){var n=Number(v);return Number.isFinite(n)?n.toLocaleString("th-TH")+" บาท":"—"};
var orderLabel=function(v){return({draft:"รอชำระ / รอตรวจ",confirmed:"กำลังเตรียมรายการ",fulfilled:"สำเร็จ",cancelled:"ยกเลิก"})[String(v||"").toLowerCase()]||"กำลังตรวจ"};
var fulfillmentLabel=function(v){return({awaiting_payment:"รอชำระ / รอตรวจ",confirmed:"ยืนยัน Order แล้ว",preparing:"กำลังเตรียมสินค้า",ready:"พร้อมส่ง / พร้อมรับ",shipped:"จัดส่งแล้ว",completed:"สำเร็จ",cancelled:"ยกเลิก"})[String(v||"").toLowerCase()]||""};
var reservationLabel=function(v){return({reserved:"สำรองสินค้าแล้ว",payment_review:"กำลังตรวจการชำระ",committed:"ยืนยันสต๊อกสำหรับ Order แล้ว",expired:"หมดเวลาชำระ · คืนสต๊อกแล้ว",released:"คืนสต๊อกแล้ว"})[String(v||"").toLowerCase()]||""};
var dateTime=function(v){if(!v)return"";try{return new Intl.DateTimeFormat("th-TH",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v))}catch(e){return""}};
var payLabel=function(v,proof,verified){if(verified)return"ยืนยันยอดแล้ว";if(proof)return"ได้รับหลักฐานแล้ว · รอตรวจ";return({pending:"รอการชำระเงิน",partial:"ชำระบางส่วน",paid:"ยืนยันยอดแล้ว",refunded:"คืนเงินแล้ว",failed:"ต้องตรวจใหม่"})[String(v||"").toLowerCase()]||"กำลังตรวจ"};
function fail(msg){state.innerHTML="<p class=\"shop-state-text\">"+esc(msg)+"</p>";card.hidden=true}
function renderReservation(r){
 var old=document.getElementById("orderReservation");if(old)old.remove();if(!r)return;
 var box=document.createElement("div"),expired=["expired","released"].indexOf(String(r.state||"").toLowerCase())>-1;
 box.id="orderReservation";box.className="shop-reservation"+(expired?" is-expired":"");
 var expiry=r.expires_at?dateTime(r.expires_at):"";
 var detail=expired?"สามารถเริ่ม Order ใหม่ได้จาก MMD Shop":expiry&&r.state==="reserved"?"สำรองสินค้าไว้ถึง "+expiry:r.state==="payment_review"?"ระบบล็อกสต๊อกไว้ระหว่างตรวจยอด":"";
 box.innerHTML="<small>STOCK RESERVATION</small><strong>"+esc(reservationLabel(r.state)||"กำลังตรวจสต๊อก")+"</strong>"+(detail?"<p>"+esc(detail)+"</p>":"");
 var target=document.getElementById("orderFulfillment"),pay=$("payCta");
 if(target&&target.parentNode)target.parentNode.insertBefore(box,target);else if(pay&&pay.parentNode)pay.parentNode.insertBefore(box,pay);else card.appendChild(box)
}
function renderFulfillment(f){
 var old=document.getElementById("orderFulfillment");if(old)old.remove();if(!f)return;
 var box=document.createElement("div");box.id="orderFulfillment";box.className="shop-fulfillment";
 var method=f.delivery_method==="pickup"?"รับสินค้าเอง / Pickup":f.delivery_method==="delivery"?"จัดส่ง":"กำลังยืนยันวิธีรับสินค้า";
 var tracking=f.tracking_number?(esc(f.courier||"Courier")+" · "+esc(f.tracking_number)):"";
 box.innerHTML='<small>FULFILLMENT</small><strong>'+esc(fulfillmentLabel(f.state)||method)+'</strong><p>'+esc(method)+(tracking?'<br>'+tracking:'')+'</p>';
 var pay=$("payCta");if(pay&&pay.parentNode)pay.parentNode.insertBefore(box,pay);else card.appendChild(box)
}
async function load(){
 if(!t){fail("เปิดหน้านี้จากลิงก์ Order ใน MMD Shop หรือ MY MMD ครับ");return}
 try{
  var r=await fetch("https://sigil.mmdbkk.com/v1/confirm/details",{method:"POST",headers:{"content-type":"application/json","accept":"application/json"},credentials:"omit",cache:"no-store",body:JSON.stringify({t:t,expected_role:"customer"})});
  var d=await r.json().catch(function(){return{}});
  if(!r.ok||d.ok!==true||d.payment_type!=="shop"||!d.shop_order)throw new Error(d.error||"order_unavailable");
  state.hidden=true;card.hidden=false;
  var fulfillment=d.shop_order.fulfillment||null,reservation=d.shop_order.reservation||null;
  $("orderId").textContent=d.shop_order.order_id||d.session_id||"—";
  $("orderStatus").textContent=fulfillment&&fulfillment.state?fulfillmentLabel(fulfillment.state):orderLabel(d.session_status);
  $("orderTotal").textContent=money(d.amount_thb);
  $("paymentStatus").textContent=reservation&&["expired","released"].indexOf(String(reservation.state||"").toLowerCase())>-1?"หมดเวลาชำระ · คืนสต๊อกแล้ว":payLabel(d.payment_status,d.payment&&d.payment.proof_received,d.payment&&d.payment.verified);
  var items=Array.isArray(d.shop_order.items)?d.shop_order.items:[];
  $("orderItems").innerHTML=items.length?items.map(function(x){return"<div class=\"shop-item\"><div><div class=\"shop-item-name\">"+esc(x.item_name||"MMD Shop Item")+"</div><small class=\"shop-item-meta\">"+esc(x.quantity||0)+" ชิ้น · "+esc(money(x.unit_price_thb))+"</small></div><div class=\"shop-item-total\">"+esc(money(x.line_total_thb))+"</div></div>"}).join(""):"<div class=\"shop-item\"><div class=\"shop-item-name\">รายการสินค้ากำลังอัปเดต</div></div>";
  renderFulfillment(fulfillment);
  renderReservation(reservation);
  var pay=$("payCta");
  if(pay){var verified=!!(d.payment&&d.payment.verified),accepting=!(d.payment&&d.payment.accepting_payment===false),rstate=String(reservation&&reservation.state||"").toLowerCase();pay.hidden=verified||!accepting||["expired","released"].indexOf(rstate)>-1||String(d.session_status||"").toLowerCase()==="cancelled";if(!pay.hidden)pay.href="/pay/checkout?t="+encodeURIComponent(t)}
 }catch(e){fail("เปิดรายละเอียด Order ไม่ได้ในขณะนี้ กรุณากลับ MY MMD หรือติดต่อ MMD")}
}
load();
})();
</script>
