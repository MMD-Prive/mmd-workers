function translateLeaf(el){

function syncComposite(selector,keys){
  document.querySelectorAll(selector).forEach(function(el,i){
    var b=el.querySelector("b"),key=keys[i];
    if(!b||!key)return;
    var desired=t(key),tail=null,node=b.nextSibling;
    while(node){
      if(node.nodeType===3){tail=node;break}
      node=node.nextSibling;
    }
    if(!tail){el.appendChild(document.createTextNode(" "+desired));return}
    if(String(tail.nodeValue||"").trim()!==desired)tail.nodeValue=" "+desired;
  });
}

  $("orderId").textContent=d.shop_order.order_id||d.session_id||"—";
  $("orderStatus").textContent=fulfillment&&fulfillment.state?fulfillmentLabel(fulfillment.state):orderLabel(d.session_status);
  $("orderTotal").textContent=money(d.amount_thb);
  $("paymentStatus").textContent=reservation&&["expired","released"].indexOf(String(reservation.state||"").toLowerCase())>-1?"หมดเวลาชำระ · คืนสต๊อกแล้ว":payLabel(d.payment_status,d.payment&&d.payment.proof_received,d.payment&&d.payment.verified);
  var items=Array.isArray(d.shop_order.items)?d.shop_order.items:[];
  $("orderItems").innerHTML=items.length?items.map(function(x){return"<div class=\"shop-item\"><div><div class=\"shop-item-name\">"+esc(x.item_name||"MMD Shop Item")+"</div><small class=\"shop-item-meta\">"+esc(window.MMDShopI18n&&typeof window.MMDShopI18n.qty==="function"?window.MMDShopI18n.qty(x.quantity||0):(x.quantity||0)+" ชิ้น")+" · "+esc(money(x.unit_price_thb))+"</small></div><div class=\"shop-item-total\">"+esc(money(x.line_total_thb))+"</div></div>"}).join(""):"<div class=\"shop-item\"><div class=\"shop-item-name\">รายการสินค้ากำลังอัปเดต</div></div>";
  renderFulfillment(fulfillment);
  renderReservation(reservation);
  var pay=$("payCta");
  if(pay){var verified=!!(d.payment&&d.payment.verified),accepting=!(d.payment&&d.payment.accepting_payment===false),rstate=String(reservation&&reservation.state||"").toLowerCase();pay.hidden=verified||!accepting||["expired","released"].indexOf(rstate)>-1||String(d.session_status||"").toLowerCase()==="cancelled";if(!pay.hidden)pay.href="/pay/checkout?t="+encodeURIComponent(t)}
 }catch(e){fail("ตอนนี้เปิด Order ไม่ได้ครับ กลับ MY MMD หรือติดต่อ MMD ได้เลย")}
}
load();
})();
</script>

<script id="mmdshop-order-fold-v1">
(function(){
 var card=document.getElementById("orderCard");if(!card)return;
 function fold(id,title){
  var box=document.getElementById(id);if(!box||box.dataset.folded==="1")return;
  box.dataset.folded="1";
  var d=document.createElement("details");d.className="shop-fold";
  var s=document.createElement("summary");s.textContent=title;
  var b=document.createElement("div");b.className="shop-fold-body";
  while(box.firstChild)b.appendChild(box.firstChild);
  d.appendChild(s);d.appendChild(b);box.replaceWith(d);
 }
 var mo=new MutationObserver(function(){fold("orderReservation","ของที่กันไว้ให้");fold("orderFulfillment","การรับหรือจัดส่ง")});
 mo.observe(card,{childList:true,subtree:true});
 fold("orderReservation","ของที่กันไว้ให้");fold("orderFulfillment","การรับหรือจัดส่ง");
})();
</script>
