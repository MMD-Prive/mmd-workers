<style id="mmd-shop-coupon-style">
#mmdshop-final .mmd-coupon{margin:0 0 20px;padding:16px;border:1px solid #d8c8ac;border-radius:14px;background:#f8f5f0}
#mmdshop-final .mmd-coupon label{display:block;font-weight:700;margin-bottom:8px}
#mmdshop-final .mmd-coupon-input{display:flex;gap:8px}
#mmdshop-final .mmd-coupon-input input{flex:1;min-width:0;margin:0;font-size:16px}
#mmdshop-final .mmd-coupon button{min-height:44px;padding:8px 12px;border:1px solid #d8c8ac;border-radius:10px;background:#fff;cursor:pointer;color:#171719;font:inherit}
#mmdshop-final .mmd-coupon button:disabled{opacity:.5;cursor:wait}
#mmdshop-final .mmd-coupon p,#mmdShopCouponStatus{font-size:12px;line-height:1.6;margin:8px 0}
#mmdShopCouponSummary>div{display:flex;justify-content:space-between;gap:12px;padding-top:8px;font-size:12px}
#mmdShopCouponSummary[hidden]{display:none}
@media(max-width:360px){#mmdshop-final .mmd-coupon-input{flex-direction:column}}
</style>
<script id="mmd-shop-coupon-client">

    ko: { label: '쿠폰 코드', apply: '적용', remove: '제거', help: 'GG Water 50 ml만 500바트 할인 · 1회 사용 · 발급 후 2개월 유효', checking: '확인 중…', applied: '할인 적용됨', subtotal: '상품 합계', discount: '쿠폰 할인', total: '할인 후 합계', expires: '만료일', invalid: '유효하지 않은 코드입니다.', used: '이미 사용한 쿠폰입니다.', expired: '만료된 쿠폰입니다.', held: '다른 주문에 예약된 쿠폰입니다. MMD에 문의하세요.', product: 'GG Water 50 ml를 추가해 주세요.', unavailable: '확인할 수 없습니다. 다시 시도해 주세요.', required: '주문 전에 적용을 눌러 주세요.', changed: '장바구니가 변경되었습니다. 다시 적용해 주세요.', pending: '이전 주문을 먼저 확인해 주세요.' }
  };
  function bind(config) {
    var root = config.root, applied = null, revision = 0;
    var find = function (id) { return root.querySelector('#' + id); };
    var input = find('mmdShopCouponCode'), button = find('mmdShopCouponApply'), remove = find('mmdShopCouponRemove'), status = find('mmdShopCouponStatus'), summary = find('mmdShopCouponSummary');

    function items() { return config.cart().map(function (x) { return { product_id: x.product_id, quantity: Number(x.qty), expected_unit_price_thb: Number(x.unit_price_thb) }; }); }
    function signature() { return JSON.stringify(items()); }
    function code() { return input.value.trim().toUpperCase(); }
    function reset(message) { revision++; applied = null; summary.hidden = true; summary.replaceChildren(); status.textContent = message || ''; }
    function errorMessage(error) {
      var map = { coupon_invalid: 'invalid', coupon_required: 'invalid', coupon_used: 'used', coupon_expired: 'expired', coupon_in_use: 'held', coupon_product_required: 'product', coupon_apply_required: 'required', coupon_service_unavailable: 'unavailable', coupon_recovery_required: 'held', coupon_product_price_too_low: 'unavailable', coupon_payable_amount_required: 'unavailable', coupon_cart_changed: 'changed' };
      return map[error] ? t(map[error]) : '';
    }
    function render() {
      find('mmdShopCouponLabel').textContent = t('label'); button.textContent = t('apply'); remove.textContent = t('remove'); find('mmdShopCouponHelp').textContent = t('help');
      if (!applied) return;
      summary.hidden = false; summary.replaceChildren();
      [['subtotal', config.money(applied.subtotal_thb)], ['discount', '−' + config.money(applied.discount_thb)], ['total', config.money(applied.total_thb)], ['expires', new Date(applied.coupon.expires_at).toLocaleString(config.lang() || 'en', { timeZone: 'Asia/Bangkok' })]].forEach(function (row) {
        var line = document.createElement('div'), label = document.createElement('span'), value = document.createElement('strong');
        label.textContent = t(row[0]); value.textContent = row[1]; line.append(label, value); summary.append(line);
      });
      status.textContent = t('applied');
    }
    input.addEventListener('input', function () { reset(); });
    remove.addEventListener('click', function () { if (config.locked()) { status.textContent = t('pending'); return; } input.value = ''; reset(); });
    button.addEventListener('click', async function () {
      if (config.locked()) { status.textContent = t('pending'); return; }
      reset(); var stamp = revision, currentCode = code(), currentCart = signature();
      if (!currentCode) { status.textContent = t('invalid'); return; }
      button.disabled = true; status.textContent = t('checking');
      try {
        var data = await config.request('/mmd-shop/api/coupons/quote', { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ coupon_code: currentCode, items: items() }) });
        if (revision !== stamp || code() !== currentCode || signature() !== currentCart) return;
        if (data.shop !== 'mmd-shop' || data.discount_thb !== 500 || data.coupon.sku !== 'WGG-50' || !(data.total_thb > 0) || !Number.isFinite(Date.parse(data.coupon.expires_at))) throw new Error('coupon_service_unavailable');

    };
