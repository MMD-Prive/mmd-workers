<script>
window.__MMD_CALENDAR_WEBFLOW_V2__=true;
(()=>{
  const boot=()=>{
    const root=document.querySelector('.mcal');
    if(!root)return;

    const qs=(s,p=root)=>p.querySelector(s);
    const qsa=(s,p=root)=>[...p.querySelectorAll(s)];
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const validDate=(v)=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''));
    const bangkokYmd=(d=new Date())=>{
      const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
      const o=Object.fromEntries(parts.map(x=>[x.type,x.value]));
      return o.year+'-'+o.month+'-'+o.day;
    };
    const addDays=(dateText,days)=>bangkokYmd(new Date(new Date(dateText+'T12:00:00+07:00').getTime()+days*86400000));
    const thDate=(dateText)=>new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'long',year:'numeric'}).format(new Date(dateText+'T12:00:00+07:00'));
    const thWeekday=(dateText)=>new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',weekday:'long'}).format(new Date(dateText+'T12:00:00+07:00'));
    const hm=(value)=>value?new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value)):'—';
    const money=(value)=>value==null?'—':new Intl.NumberFormat('th-TH',{maximumFractionDigits:0}).format(Number(value)||0)+' ฿';
    const stateClass=(value)=>{
      const s=String(value||'').toLowerCase();
      if(/available|active|ready|confirmed|verified/.test(s))return'is-ok';
      if(/limited|hold|pending|review/.test(s))return'is-limited';
      return'is-off';
    };

    const params=new URLSearchParams(location.search);
    let selected=validDate(params.get('date'))?params.get('date'):bangkokYmd();
    let view='today';
    let payload=null;

    const dateValue=qs('.mcal__datevalue');
    const dateSmall=qs('.mcal__datesmall');
    const dateBtns=qsa('.mcal__datebtn');
    const prev=dateBtns[0],next=dateBtns[1];
    const today=qs('.mcal__today');
    const tabs=qsa('.mcal__tab');
    const metrics=qsa('.mcal__metricvalue');
    const panels=qsa('.mcal__panel');
    const timelinePanel=panels[0]||null;
    const holdsPanel=panels[1]||null;
    const availabilityPanel=qsa('.mcal__availability')[0]||panels.find(p=>qs('.mcal__people',p));
    const timelineMount=timelinePanel?qs('.mcal__empty',timelinePanel):null;
    const holdMount=holdsPanel?qs('.mcal__queueempty',holdsPanel):null;
    const peopleMount=availabilityPanel?qs('.mcal__people',availabilityPanel):null;
    const statusValues=qsa('.mcal__statusvalue');

    if(timelineMount)timelineMount.classList.add('mcal__livefeed');
    if(holdMount)holdMount.classList.add('mcal__livequeue');

    function renderDate(){
      if(dateValue)dateValue.textContent=thDate(selected);
      if(dateSmall)dateSmall.textContent=selected===bangkokYmd()?'วันนี้ · '+thWeekday(selected):thWeekday(selected);
    }

    function filteredItems(){
      let rows=Array.isArray(payload?.items)?payload.items:[];
      if(view==='holds')rows=rows.filter(x=>x.internal_hold);
      if(view==='confirmed')rows=rows.filter(x=>x.deposit?.verified);
      if(view==='models')rows=rows.filter(x=>x.model?.name);
      if(view==='pricing')rows=rows.filter(x=>x.pricing?.review_required);
      return rows;
    }

    function card(item){
      const tags=[
        '<span class="mcal-live-tag">JOB '+esc(item.job?.job_id||'—')+'</span>',
        '<span class="mcal-live-tag">CAL '+esc(item.cal?.booking_uid||'UNLINKED')+'</span>',
        item.internal_hold?'<span class="mcal-live-tag is-hold">INTERNAL HOLD</span>':'',
        item.deposit?.verified?'<span class="mcal-live-tag is-ok">DEPOSIT VERIFIED</span>':'<span class="mcal-live-tag is-hold">DEPOSIT PENDING</span>',
        item.conflict?'<span class="mcal-live-tag is-bad">CONFLICT</span>':'',
        item.pricing?.review_required?'<span class="mcal-live-tag is-hold">QUOTE REVIEW</span>':''
      ].join('');
      return '<article class="mcal-live-card">'
        +'<div class="mcal-live-time"><b>'+hm(item.start_at)+'</b><span>'+hm(item.end_at)+'</span></div>'
        +'<div><h3>'+esc(item.model?.name||'Model pending')+' · '+esc(item.client?.name||'Client pending')+'</h3>'
        +'<div class="mcal-live-meta">'+tags+'</div>'
        +'<div class="mcal-live-meta"><span class="mcal-live-tag">'+esc(item.location||'Location pending')+'</span><span class="mcal-live-tag">'+esc(item.service_type||'Service pending')+'</span><span class="mcal-live-tag">'+esc(item.deposit?.verification_status||'payment pending')+'</span></div></div>'
        +'<div class="mcal-live-money"><b>'+money(item.pricing?.final_quote_thb)+'</b><small>Deposit '+money(item.deposit?.amount_thb)+'</small></div>'
        +'</article>';
    }

    function renderTimeline(){
      if(!timelineMount)return;
      const rows=filteredItems();
      timelineMount.innerHTML=rows.length?rows.map(card).join(''):'<div class="mcal-live-empty">ไม่มีรายการในมุมมองนี้</div>';
    }

    function renderHolds(){
      if(!holdMount)return;
      const rows=(payload?.items||[]).filter(x=>x.internal_hold);
      holdMount.innerHTML=rows.length?rows.map(x=>
        '<div class="mcal-live-hold"><b>'+esc(x.model?.name||'Model')+' · '+hm(x.start_at)+'</b><span>'+esc(x.client?.name||'Client')+' · '+esc(x.deposit?.verification_status||'รอมัดจำ')+'</span></div>'
      ).join(''):'<div class="mcal-live-empty">ไม่มี Internal Hold</div>';
    }

    function renderAvailability(){
      if(!peopleMount)return;
      const models=Array.isArray(payload?.availability?.models)?payload.availability.models:[];
      const therapists=Array.isArray(payload?.availability?.therapists)?payload.availability.therapists:[];
      const rows=[
        ...models.slice(0,10).map(x=>({kind:'MODEL',name:x.name||x.model_id||'Model',id:x.model_id||'',status:x.availability_status||'Unknown'})),
        ...therapists.slice(0,10).map(x=>({kind:'MMS',name:x.display_name||x.therapist_id||'Therapist',id:x.therapist_id||'',status:x.availability_status||'Unknown'}))
      ];
      peopleMount.innerHTML=rows.length?rows.map(x=>
        '<article class="mcal-live-person"><div><b>'+esc(x.name)+'</b><small>'+esc(x.kind+(x.id?' · '+x.id:''))+'</small></div><strong class="mcal-live-state '+stateClass(x.status)+'">'+esc(x.status)+'</strong></article>'
      ).join(''):'<div class="mcal-live-empty">ยังไม่มี Availability records ที่ระบบอ่านได้</div>';
    }

    function renderMetrics(){
      const m=payload?.metrics||{};
      const values=[m.sessions,m.holds,m.conflicts,m.pricing_review];
      metrics.forEach((el,i)=>{el.textContent=Number.isFinite(Number(values[i]))?String(values[i]):'0'});
    }

    function renderStatus(apiOk){
      let diag=null;
      try{const el=document.getElementById('calendar-connection-state');if(el)diag=JSON.parse(el.textContent||'{}')}catch{}
      if(statusValues[0])statusValues[0].textContent=diag?.inbound?.mode?String(diag.inbound.mode).toUpperCase():(apiOk?'LIVE READ':'CHECK');
      if(statusValues[1])statusValues[1].textContent=payload?.timezone||'Asia/Bangkok';
      if(statusValues[2]){
        const ready=diag?.outbound?.api_verified===true&&diag?.inbound?.webhook_secret_configured===true&&diag?.inbound?.mapping_ledger_configured===true;
        statusValues[2].textContent=diag?(ready?'READY':'CHECK'):(apiOk?'API 200':'CHECK');
      }
    }

    function render(){
      renderDate();
      if(!payload)return;
      renderMetrics();
      renderTimeline();
      renderHolds();
      renderAvailability();
      renderStatus(true);
    }

    async function load(){
      renderDate();
      if(/\.webflow\.io$/i.test(location.hostname)){
        if(timelineMount)timelineMount.innerHTML='<div class="mcal-live-preview"><b>Webflow preview</b><span>ข้อมูล Admin จริงต้องอ่านผ่าน Owner session บน production domain</span><a href="https://www.mmdbkk.com/internal/admin/calendar?date='+encodeURIComponent(selected)+'">เปิด Calendar ใช้งานจริง →</a></div>';
        if(holdMount)holdMount.innerHTML='<div class="mcal-live-empty">Protected data is not loaded in Webflow preview.</div>';
        if(peopleMount)peopleMount.innerHTML='<div class="mcal-live-empty">Availability จะแสดงหลังผ่าน Admin session</div>';
        renderStatus(false);
        return;
      }
      try{
        const response=await fetch('/v1/admin/calendar?date='+encodeURIComponent(selected),{credentials:'include',cache:'no-store',headers:{accept:'application/json'}});
        if(response.status===401||response.status===403){
          location.href='/internal/admin/login?next='+encodeURIComponent('/internal/admin/calendar?date='+selected);
          return;
        }
        const body=await response.json().catch(()=>null);
        if(!response.ok||!body?.ok||body?.schema!=='mmd.admin.calendar.v1')throw new Error(body?.error||'calendar_unavailable');
        payload=body;
        const u=new URL(location.href);u.searchParams.set('date',selected);history.replaceState({},'',u.pathname+'?'+u.searchParams.toString());
        render();
      }catch(error){
        payload=null;
        if(timelineMount)timelineMount.innerHTML='<div class="mcal-live-empty" style="color:#ed8f9a">Calendar unavailable · '+esc(error?.message||'read_failed')+'</div>';
        if(holdMount)holdMount.innerHTML='<div class="mcal-live-empty">ยังอ่าน Hold ไม่ได้</div>';
        renderStatus(false);
      }
    }

    if(prev)prev.addEventListener('click',e=>{e.preventDefault();selected=addDays(selected,-1);load()});
    if(next)next.addEventListener('click',e=>{e.preventDefault();selected=addDays(selected,1);load()});
    if(today)today.addEventListener('click',e=>{e.preventDefault();selected=bangkokYmd();load()});

    const viewNames=['today','holds','confirmed','models','pricing'];
    tabs.forEach((tab,index)=>tab.addEventListener('click',e=>{
      e.preventDefault();
      tabs.forEach(x=>x.classList.remove('is-active'));
      tab.classList.add('is-active');
      view=viewNames[index]||'today';
      renderTimeline();
    }));

    const liveCta=qsa('.mcal__action').find(a=>/Calendar ใช้งานจริง/i.test(a.textContent||''));
    if(liveCta&&!/\.webflow\.io$/i.test(location.hostname)){
      liveCta.setAttribute('href','/internal/admin/calendar?date='+encodeURIComponent(selected));
      liveCta.textContent='Refresh Live Data';
      liveCta.addEventListener('click',e=>{e.preventDefault();load()});
    }

    const actions=qs('.mcal__actions');
    if(actions&&!/\.webflow\.io$/i.test(location.hostname)){
      const reconcile=document.createElement('button');
      reconcile.type='button';
      reconcile.className='mcal__action mcal__action--ghost';
      reconcile.textContent='Reconcile Cal';
      reconcile.addEventListener('click',async()=>{
        const original=reconcile.textContent;
        reconcile.disabled=true;
        reconcile.textContent='Reconciling…';
        try{
          const response=await fetch('/v1/admin/calendar/reconcile?horizon_days=60&limit=25',{
            method:'POST',
            credentials:'include',
            cache:'no-store',
            headers:{accept:'application/json'}
          });
          if(response.status===401||response.status===403){
            location.href='/internal/admin/login?next='+encodeURIComponent('/internal/admin/calendar?date='+selected);
            return;
          }
          const body=await response.json().catch(()=>null);
          if(!response.ok||!body?.ok)throw new Error(body?.error||'reconcile_failed');
          const created=Number(body?.summary?.created||0);
          const existing=Number(body?.summary?.existing||0);
          reconcile.textContent='Cal linked +'+created+(existing?' · existing '+existing:'');
          await load();
        }catch(error){
          reconcile.textContent='Reconcile failed';
          console.warn('[mmd-calendar] reconcile failed',error);
        }finally{
          setTimeout(()=>{reconcile.disabled=false;reconcile.textContent=original},2200);
        }
      });
      actions.appendChild(reconcile);
    }

    renderDate();
    load();
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script id="calendar-owner-ui-v3-20260922-runtime">
(()=>{
  const boot=()=>{
    const root=document.querySelector('.mcal');
    if(!root)return;
    root.setAttribute('data-owner-ui','v3');

    const normalise=value=>String(value||'').replace(/\s+/g,' ').trim();
    const cleanInlineArtifacts=()=>{
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      const nodes=[];
      while(walker.nextNode())nodes.push(walker.currentNode);
      nodes.forEach(node=>{
        const before=String(node.nodeValue||'');
        if(/##INLINE\d+##/i.test(before))node.nodeValue=before.replace(/##INLINE\d+##/gi,'').trim();
      });
    };
    cleanInlineArtifacts();

    const tabs=[...root.querySelectorAll('.mcal__tab')];
    ['วันนี้','รอมัดจำ','ยืนยันแล้ว','นายแบบ','เช็กราคา'].forEach((label,i)=>{if(tabs[i])tabs[i].textContent=label});
    const workEyes=[...root.querySelectorAll('.mcal__workspace .mcal__eyebrow')];
    const workTitles=[...root.querySelectorAll('.mcal__workspace .mcal__paneltitle')];
    ['คิววันนี้','ต้องทำต่อ','งานยาว'].forEach((label,i)=>{if(workEyes[i])workEyes[i].textContent=label});
    ['ตารางงาน','รอมัดจำ','งานยาว / ข้ามคืน'].forEach((label,i)=>{if(workTitles[i])workTitles[i].textContent=label});
    const availability=root.querySelector('.mcal__availability');
    if(availability){
      const eye=availability.querySelector('.mcal__eyebrow');
      const title=availability.querySelector('.mcal__paneltitle');
      const note=availability.querySelector('.mcal__panelnote');
      if(eye)eye.textContent='เวลาว่าง';
      if(title)title.textContent='นายแบบ & Therapist';
      if(note)note.textContent='เริ่มงานได้ 24 ชม. · Booking Desk 10:00–24:00';
    }
    const todayButton=root.querySelector('.mcal__today');
    if(todayButton)todayButton.textContent='วันนี้';

    const production=!/\.webflow\.io$/i.test(location.hostname);

    if(production){
      const notice=root.querySelector('.mcal__notice');
      if(notice)notice.hidden=true;
    }

    const legacy=[...document.querySelectorAll('body *')]
      .map(el=>({el,text:normalise(el.textContent)}))
      .filter(x=>x.text.length>80&&x.text.length<1400&&/SMOKE PASS/i.test(x.text)&&/(Model Confirm|Confirmed Session|live-write|source of truth)/i.test(x.text))
      .sort((a,b)=>a.text.length-b.text.length)[0];
    if(legacy?.el&&!legacy.el.classList.contains('mcal')){
      legacy.el.setAttribute('data-mmd-calendar-legacy-banner','hidden');
      legacy.el.hidden=true;
    }

    const eyebrow=root.querySelector('.mcal__eyebrow');

function recoveryPriority(x){const s=String(x&&x.recovery_stage||'');return s==='reminder_follow_up_due'?0:s==='line_link_expired'?1:s==='identity_recovery_required'?2:s==='line_link_required'?3:s==='availability_confirmation_required'?4:s==='reminder_sent_waiting_for_confirmation'?5:s==='line_link_issued_waiting_for_connection'?6:9}
function adoptionActions(x){if(x.kind!=='MODEL')return'';if(x.recovery_stage==='identity_recovery_required')return'<div class="calv5__personActions"><a class="calv5__personActionLink" href="/internal/ceo/models">ผูก Model Key</a></div>';if((x.recovery_stage==='line_link_required'||x.recovery_stage==='line_link_expired')&&x.record_id&&x.model_key)return'<div class="calv5__personActions"><button class="calv5__personAction" data-cal-activate data-model-record="'+esc(x.record_id)+'" data-model-key="'+esc(x.model_key)+'">'+(x.recovery_stage==='line_link_expired'?'ออก link ใหม่':'สร้าง LINE link')+'</button></div>';if((x.recovery_stage==='availability_confirmation_required'||x.recovery_stage==='reminder_follow_up_due')&&x.model_key)return'<div class="calv5__personActions"><button class="calv5__personAction is-primary" data-cal-remind data-model-key="'+esc(x.model_key)+'">'+(x.recovery_stage==='reminder_follow_up_due'?'ติดตาม LINE':'เตือน LINE')+'</button></div>';return''}
async function remindModel(button){const key=button.getAttribute('data-model-key')||'',old=button.textContent;button.disabled=true;button.textContent='กำลังส่ง…';try{const response=await fetch('/v1/admin/calendar/availability-reminder',{method:'POST',credentials:'include',cache:'no-store',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({model_key:key})}),d=await response.json().catch(()=>null);if(response.status===429&&d&&d.error==='availability_reminder_cooldown'){button.textContent='เตือนแล้ววันนี้';return}if(response.status===409&&d&&d.error==='availability_already_fresh'){button.textContent='ยืนยันแล้ว';await load();return}if(!response.ok||!d||!d.ok)throw Error((d&&d.error)||'reminder_failed');button.textContent='เตือนแล้ว';setTimeout(()=>{button.disabled=false;button.textContent=old},2600)}catch(e){button.textContent=e&&e.message==='model_line_identity_required'?'ยังไม่มี LINE':'ส่งไม่สำเร็จ';setTimeout(()=>{button.disabled=false;button.textContent=old},2600)}}
async function createLineActivation(button){const id=button.getAttribute('data-model-record')||'',key=button.getAttribute('data-model-key')||'',old=button.textContent;button.disabled=true;button.textContent='กำลังสร้าง…';try{const response=await fetch('/v1/admin/calendar/availability-activation',{method:'POST',credentials:'include',cache:'no-store',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({model_record_id:id,model_key:key})}),d=await response.json().catch(()=>null);if(response.status===409&&d&&d.error==='model_already_linked'){button.textContent='LINE เชื่อมแล้ว';await load();return}if(!response.ok||!d||!d.ok||!d.activation_url)throw Error((d&&d.error)||'activation_failed');let copied=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(d.activation_url);copied=true}}catch(_){}if(copied)button.textContent=d.tracking_state==='tracked'?'คัดลอก LINE link แล้ว':'คัดลอก link แล้ว · ติดตามไม่ได้';else{window.prompt('คัดลอก LINE activation link สำหรับ Model',d.activation_url);button.textContent=d.tracking_state==='tracked'?'สร้าง LINE link แล้ว':'สร้าง link แล้ว · ติดตามไม่ได้'}setTimeout(()=>{button.disabled=false;button.textContent=old},4200)}catch(e){button.textContent='สร้าง link ไม่สำเร็จ';setTimeout(()=>{button.disabled=false;button.textContent=old},2600)}}
function cohortLabel(x){const b=String(x&&x.priority_bucket||'');if(b==='sla_follow_up')return'เลย SLA';if(b==='upcoming_job')return'มีงานใกล้ถึง';if(b==='line_ready')return'LINE พร้อม';if(b==='identity_repair')return'ผูกตัวตน';if(b==='commercial_active')return'งาน/ขาย active';return'Backfill'}
function cohortReason(x){if(x.priority_bucket==='upcoming_job')return'มีงานภายใน 14 วัน จัด MMD MODEL ก่อนงาน';if(x.priority_bucket==='line_ready')return'LINE เชื่อมแล้ว เหลือยืนยัน Availability ครั้งแรก';if(x.priority_bucket==='identity_repair')return'ต้องซ่อม canonical identity ก่อนออกสิทธิ์';if(x.priority_bucket==='commercial_active')return'มี commercial / work-history signal';if(x.priority_bucket==='sla_follow_up')return'Reminder เดิมเลยเวลา follow-up แล้ว';return'Active operational model รอเข้า MMD MODEL'}
function onboardingAction(x){if(x.recovery_stage==='identity_recovery_required')return'<a class="calv5__personActionLink" href="/internal/ceo/models">ผูก Model Key</a>';if((x.recovery_stage==='line_link_required'||x.recovery_stage==='line_link_expired')&&x.record_id&&x.model_key)return'<button class="calv5__personAction" data-cal-activate data-model-record="'+esc(x.record_id)+'" data-model-key="'+esc(x.model_key)+'">'+(x.recovery_stage==='line_link_expired'?'ออก LINE link ใหม่':'สร้าง LINE link')+'</button>';if((x.recovery_stage==='availability_confirmation_required'||x.recovery_stage==='reminder_follow_up_due')&&x.model_key)return'<button class="calv5__personAction is-primary" data-cal-remind data-model-key="'+esc(x.model_key)+'">'+(x.recovery_stage==='reminder_follow_up_due'?'ติดตาม LINE':'เตือนยืนยัน Availability')+'</button>';return''}
function renderOnboarding(){if(!r.onboarding||!r.onboardingCount)return;const o=data&&data.availability&&data.availability.onboarding||{},a=Array.isArray(o.current_batch)?o.current_batch:[];const unique=Number(o.unique_backlog_models||0),raw=Number(o.raw_backlog_rows||0),dup=Number(o.duplicate_rows_collapsed||0),remain=Number(o.remaining_after_current||0);r.onboardingCount.innerHTML='<span class="calv5__availchip">ค้าง <b>'+unique+'</b> คน</span><span class="calv5__availchip">Batch นี้ <b>'+a.length+'</b></span>'+(dup?'<span class="calv5__availchip">รวม record ซ้ำ <b>'+dup+'</b></span>':'')+(remain?'<span class="calv5__availchip">คิวถัดไป <b>'+remain+'</b></span>':'');r.onboarding.innerHTML=a.length?a.map(x=>{const when=x.upcoming_job_at?new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(x.upcoming_job_at)):'';return '<article class="calv5__cohort"><div class="calv5__cohortTop"><strong>'+esc(x.name||x.model_id||'Model')+'</strong><span class="calv5__cohortBadge">'+esc(cohortLabel(x))+'</span></div><p>'+esc(cohortReason(x))+'</p><div class="calv5__cohortMeta">'+(when?'<span>งาน '+esc(when)+'</span>':'')+'<span>'+(x.line_connected?'LINE เชื่อมแล้ว':'LINE ยังไม่เชื่อม')+'</span>'+(x.partner_job?'<span>Partner job</span>':'')+(x.duplicate_records_collapsed?'<span>รวมซ้ำ +'+Number(x.duplicate_records_collapsed)+'</span>':'')+'</div><div class="calv5__cohortActions">'+onboardingAction(x)+'</div></article>'}).join(''):'<div class="calv5__empty">ไม่มี Model ที่ต้อง onboarding เพิ่มใน cohort ปัจจุบัน</div>';r.onboarding.querySelectorAll('[data-cal-remind]').forEach(button=>button.onclick=()=>remindModel(button));r.onboarding.querySelectorAll('[data-cal-activate]').forEach(button=>button.onclick=()=>createLineActivation(button))}
function renderPeople(){const av=(data&&data.availability)||{},m=(av.models||[]).map(x=>({kind:'MODEL',name:x.name||x.model_id||'Model',id:x.model_id||'',record_id:x.record_id||'',model_key:x.model_key||'',line_connected:x.line_connected===true,status:x.availability_status||'unconfirmed',snapshot_state:x.snapshot_state||'missing',confidence:x.confidence||'',recovery_stage:x.recovery_stage||'',recovery_action:x.recovery_action||'',follow_up_at:x.follow_up_at||'',photo:x.record_id?'/v1/admin/calendar/model-photo?model_id='+encodeURIComponent(x.record_id):''})),t=(av.therapists||[]).map(x=>({kind:'MMS',name:x.display_name||x.therapist_id||'Therapist',id:x.therapist_id||'',status:x.availability_status||'Unknown',snapshot_state:'fresh',confidence:'',photo:x.therapist_id?'/v1/admin/calendar/therapist-photo?therapist_id='+encodeURIComponent(x.therapist_id):(x.public_photo_url||'')})),all=m.concat(t),c={ok:0,warn:0,off:0,unknown:0,excluded:0};all.forEach(x=>c[availabilityView(x).bucket]++);r.avail.innerHTML='<span class="calv5__availchip">ว่าง / พร้อม <b>'+c.ok+'</b></span><span class="calv5__availchip">จำกัด / เร็วๆ นี้ <b>'+c.warn+'</b></span><span class="calv5__availchip">ไม่ว่าง / พัก <b>'+c.off+'</b></span><span class="calv5__availchip">รอยืนยัน <b>'+c.unknown+'</b></span><span class="calv5__availchip">ไม่นับในทีม <b>'+c.excluded+'</b></span>';const due=m.filter(x=>x.recovery_stage==='reminder_follow_up_due').length;r.avail.innerHTML+=due?'<span class="calv5__availchip">ตามผลวันนี้ <b>'+due+'</b></span>':'';const availabilityRank=x=>{const b=availabilityView(x).bucket;return b==='unknown'?0:b==='excluded'?1:2};const visible=showAll?all.slice().sort((a,b)=>recoveryPriority(a)-recoveryPriority(b)||availabilityRank(a)-availabilityRank(b)):all.filter(x=>{const b=availabilityView(x).bucket;return b!=='unknown'&&b!=='excluded'});r.people.innerHTML=visible.length?visible.slice(0,150).map(x=>{const v=availabilityView(x),cls=v.bucket==='ok'?'is-ok':v.bucket==='warn'?'is-warn':'is-off',initial=esc((x.name||'?').trim().charAt(0).toUpperCase()),media=x.photo?'<img data-cal-person-img src="'+esc(x.photo)+'" alt="'+esc(x.name)+'" loading="lazy" decoding="async"><span class="calv5__personFallback" hidden>'+initial+'</span>':'<span class="calv5__personFallback">'+initial+'</span>';return '<article class="calv5__person"><div class="calv5__personMedia">'+media+'</div><div class="calv5__personBody"><div><strong>'+esc(x.name)+'</strong><small>'+availabilitySource(x)+(x.kind==='MODEL'&&v.bucket==='unknown'?' · '+(x.line_connected?'LINE พร้อม':'LINE ยังไม่เชื่อม'):'')+(x.kind==='MODEL'&&recoveryLabel(x)?' · '+recoveryLabel(x):'')+(x.kind==='MODEL'&&x.follow_up_at?' · follow-up '+esc(x.follow_up_at):'')+'</small></div><span class="calv5__state '+cls+'">'+v.label+'</span></div>'+adoptionActions(x,v)+'</article>'}).join(''):'<div class="calv5__empty">ยังไม่มีสถานะว่างที่ยืนยันและยังไม่หมดอายุ</div>';r.people.querySelectorAll('img[data-cal-person-img]').forEach(img=>img.addEventListener('error',()=>{img.hidden=true;const fallback=img.nextElementSibling;if(fallback)fallback.hidden=false},{once:true}));r.people.querySelectorAll('[data-cal-remind]').forEach(button=>button.onclick=()=>remindModel(button));r.people.querySelectorAll('[data-cal-activate]').forEach(button=>button.onclick=()=>createLineActivation(button));r.toggle.hidden=!(c.unknown||c.excluded);if(!r.toggle.hidden)r.toggle.textContent=showAll?'ซ่อนรายการที่รอยืนยัน / ไม่นับในทีม':'ดูรายการที่รอยืนยัน · '+c.unknown+(c.excluded?' · ไม่นับในทีม '+c.excluded:'')}
function render(){r.date.textContent=fmt(selected);r.week.textContent=(selected===today()?'วันนี้ · ':'')+wd(selected);renderStats();renderList();renderActions();renderOnboarding();renderPeople();const m=(data&&data.metrics)||{},av=(data&&data.availability)||{};r.sys.textContent='Cal linked '+Number(m.cal_linked||0)+'/'+Number(m.sessions||0)+' · Availability '+(av.model_source_status==='ok'?'SIGIL ready':av.model_source_status==='partial'?'SIGIL partial':'SIGIL check')+' · '+(av.therapist_source_status==='ok'?'MMS ready':'MMS check');const u=new URL(location.href);u.searchParams.set('date',selected);history.replaceState({},'',u.pathname+'?'+u.searchParams.toString())}
async function load(){r.sys.textContent='กำลังโหลดข้อมูล…';try{const x=await fetch('/v1/admin/calendar?date='+encodeURIComponent(selected),{credentials:'include',cache:'no-store',headers:{accept:'application/json'}});if(x.status===401||x.status===403){location.href='/internal/admin/login?next='+encodeURIComponent('/internal/admin/calendar?date='+selected);return}const d=await x.json().catch(()=>null);if(!x.ok||!d||!d.ok)throw Error((d&&d.error)||'calendar_unavailable');data=d;render()}catch(e){r.list.innerHTML='<div class="calv5__empty">Calendar โหลดไม่ได้ · '+esc(e.message||'read_failed')+'</div>';r.actions.innerHTML='<div class="calv5__ok">ยังอ่านรายการที่ต้องทำไม่ได้</div>';r.sys.textContent='Calendar unavailable'}}
q('[data-cal-prev]').onclick=()=>{selected=shift(selected,-1);load()};q('[data-cal-next]').onclick=()=>{selected=shift(selected,1);load()};q('[data-cal-today]').onclick=()=>{selected=today();load()};q('[data-cal-reload]').onclick=load;qa('[data-cal-view]').forEach(b=>b.onclick=()=>{qa('[data-cal-view]').forEach(x=>x.classList.remove('is-on'));b.classList.add('is-on');view=b.getAttribute('data-cal-view');renderList()});r.toggle.onclick=()=>{showAll=!showAll;renderPeople()};
q('[data-cal-sync]').onclick=async e=>{const b=e.currentTarget,old=b.textContent;b.disabled=true;b.textContent='กำลังซิงก์…';try{const x=await fetch('/v1/admin/calendar/reconcile?horizon_days=60&limit=25',{method:'POST',credentials:'include',cache:'no-store',headers:{accept:'application/json'}}),d=await x.json().catch(()=>null);if(!x.ok||!d||!d.ok)throw Error((d&&d.error)||'reconcile_failed');b.textContent='ซิงก์แล้ว +'+Number((d.summary&&d.summary.created)||0);await load()}catch(_){b.textContent='ซิงก์ไม่สำเร็จ'}finally{setTimeout(()=>{b.disabled=false;b.textContent=old},1800)}};load()};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot()})();
</script>
