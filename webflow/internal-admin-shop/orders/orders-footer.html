<script>
(function(){
"use strict";
var state=document.getElementById("shopAdminState"),list=document.getElementById("shopAdminList"),search=document.getElementById("shopAdminSearch"),filter=document.getElementById("shopAdminFilter"),refresh=document.getElementById("shopAdminRefresh"),form=document.getElementById("shopAdminFilters");
if(!state||!list)return;
var orders=[];
var esc=function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})};
var money=function(v){var n=Number(v);return Number.isFinite(n)?n.toLocaleString("th-TH")+" บาท":"—"};
function injectNav(){if(document.getElementById("shopAdminOpsNav"))return;var app=document.getElementById("shopAdminApp");if(!app)return;var nav=document.createElement("nav");nav.id="shopAdminOpsNav";nav.className="shopadmin-opsnav";nav.innerHTML='<a class="is-active" href="/internal/admin/shop/orders">Orders</a><a href="/internal/admin/shop/inventory">Inventory</a><a href="/internal/admin/shop/products">Products</a>';var top=app.querySelector(".shopadmin-top");if(top&&top.nextSibling)app.insertBefore(nav,top.nextSibling);else app.prepend(nav)}

function injectManualOrderForm(){
 var app=document.getElementById("shopAdminApp");if(!app||document.getElementById("manualOrderPanel"))return;
 var style=document.createElement("style");style.textContent=".manual-order-panel{margin:16px 0;padding:18px;border:1px solid rgba(201,168,110,.35);border-radius:16px;background:#171411;color:#f3eee5}.manual-order-panel h2{margin:0 0 6px;font-size:18px}.manual-order-panel p{margin:0 0 14px;color:#b9afa3;font-size:13px}.manual-order-form{display:grid;gap:12px}.manual-order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.manual-order-field{display:grid;gap:5px;font-size:12px;color:#cfc4b7}.manual-order-field input,.manual-order-field select,.manual-order-field textarea{width:100%;box-sizing:border-box;border:1px solid #51483f;border-radius:9px;background:#211c18;color:#fff;padding:10px;font:inherit}.manual-order-field textarea{min-height:58px;resize:vertical}.manual-order-lines{display:grid;gap:8px}.manual-order-line{display:grid;grid-template-columns:minmax(0,1fr) 92px 34px;gap:8px;align-items:end}.manual-order-line button{height:38px}.manual-order-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.manual-order-button{border:1px solid #c9a86e;border-radius:9px;background:#c9a86e;color:#19130f;padding:10px 14px;font-weight:700;cursor:pointer}.manual-order-button.secondary{background:transparent;color:#e7d6b6}.manual-order-button.danger{border-color:#8d5e57;color:#f0c1ba;background:transparent}.manual-order-total{padding:10px 12px;border-radius:10px;background:#211c18;font-size:14px;line-height:1.7}.manual-order-status{min-height:20px;color:#e7d6b6;font-size:13px}.manual-order-status.is-error{color:#f0a49b}.manual-order-status a{color:#d8b77d}.manual-order-toggle{margin:0 0 14px}.manual-order-muted{color:#9e9488;font-size:12px}@media(max-width:640px){.manual-order-grid{grid-template-columns:1fr}.manual-order-line{grid-template-columns:minmax(0,1fr) 78px 34px}}";document.head.appendChild(style);
 var panel=document.createElement("section");panel.id="manualOrderPanel";panel.className="manual-order-panel";panel.innerHTML='<button type="button" class="manual-order-button manual-order-toggle" id="manualOrderToggle">＋ สร้าง Order ให้ลูกค้า</button><div id="manualOrderBody" hidden><h2>สร้าง Order ให้ลูกค้า</h2><p>ใช้สำหรับกด Order แทนลูกค้า ใส่ส่วนลดเป็นจำนวนเงินบาทได้ ระบบจะกันสต็อกและสร้างลิงก์ชำระเงินให้ทันที</p><form id="manualOrderForm" class="manual-order-form"><div class="manual-order-grid"><label class="manual-order-field">ชื่อลูกค้า *<input name="customer_name" required></label><label class="manual-order-field">เบอร์โทร *<input name="customer_phone" inputmode="tel" required></label><label class="manual-order-field">อีเมล <input name="customer_email" type="email"></label><label class="manual-order-field">วิธีรับสินค้า *<select name="delivery_method"><option value="delivery">จัดส่ง</option><option value="pickup">รับเอง</option></select></label></div><div><div class="manual-order-muted">รายการสินค้า</div><div id="manualOrderLines" class="manual-order-lines"></div><div class="manual-order-actions" style="margin-top:8px"><button type="button" class="manual-order-button secondary" id="manualOrderAddLine">＋ เพิ่มสินค้า</button></div></div><div class="manual-order-grid"><label class="manual-order-field">ส่วนลด (บาท)<input name="discount_amount_thb" type="number" min="0" step="0.01" value="0" inputmode="decimal"></label><label class="manual-order-field">เหตุผลส่วนลด<input name="discount_reason" placeholder="เช่น ลูกค้าสนิท / ซื้อหลายชิ้น"></label></div><div class="manual-order-grid"><label class="manual-order-field">ที่อยู่จัดส่ง<textarea name="address_line1" placeholder="บ้านเลขที่ / ถนน"></textarea></label><label class="manual-order-field">แขวง/ตำบล<input name="subdistrict"></label><label class="manual-order-field">เขต/อำเภอ<input name="district"></label><label class="manual-order-field">จังหวัด<input name="province"></label><label class="manual-order-field">รหัสไปรษณีย์<input name="postal_code" inputmode="numeric"></label><label class="manual-order-field">หมายเหตุจัดส่ง<textarea name="delivery_note"></textarea></label></div><div id="manualOrderTotal" class="manual-order-total">ยอดก่อนลด: —<br>ส่วนลด: 0 บาท<br><strong>ยอดสุทธิ: —</strong></div><div class="manual-order-actions"><button type="submit" class="manual-order-button" id="manualOrderSubmit">สร้าง Order + สร้างลิงก์ชำระเงิน</button><button type="button" class="manual-order-button secondary" id="manualOrderClose">ปิดฟอร์ม</button></div><div id="manualOrderStatus" class="manual-order-status" role="status"></div></form></div>';var top=app.querySelector(".shopadmin-top");if(top&&top.nextSibling)app.insertBefore(panel,top.nextSibling);else app.prepend(panel);
 var body=document.getElementById("manualOrderBody"),toggle=document.getElementById("manualOrderToggle"),close=document.getElementById("manualOrderClose"),form=document.getElementById("manualOrderForm"),lines=document.getElementById("manualOrderLines"),add=document.getElementById("manualOrderAddLine"),total=document.getElementById("manualOrderTotal"),status=document.getElementById("manualOrderStatus"),products=[];
 function productOptions(selected){return '<option value="">เลือกสินค้า…</option>'+products.filter(function(p){return p.mmd_enabled!==false&&p.status==="active"}).map(function(p){return '<option value="'+esc(p.id)+'" data-price="'+esc(p.mmd_price_thb||0)+'"'+(p.id===selected?" selected":"")+'>'+esc(p.product_name||p.id)+' · '+esc(p.sku||"")+' · '+money(p.mmd_price_thb)+' · เหลือ '+esc(p.available_units!=null?p.available_units:p.quantity_remaining||0)+'</option>'}).join("")}
 function addLine(selected,qty){var row=document.createElement("div");row.className="manual-order-line";row.innerHTML='<label class="manual-order-field"><span>สินค้า</span><select data-manual-product>'+productOptions(selected)+'</select></label><label class="manual-order-field"><span>จำนวน</span><input data-manual-qty type="number" min="1" step="1" value="'+esc(qty||1)+'"></label><button type="button" class="manual-order-button danger" data-remove-line aria-label="ลบรายการ">×</button>';lines.appendChild(row);row.querySelector("select").addEventListener("change",recalc);row.querySelector("input").addEventListener("input",recalc);row.querySelector("[data-remove-line]").addEventListener("click",function(){row.remove();recalc()});recalc()}
 function recalc(){var subtotal=0;lines.querySelectorAll(".manual-order-line").forEach(function(row){var select=row.querySelector("[data-manual-product]"),opt=select&&select.options[select.selectedIndex],qty=Number(row.querySelector("[data-manual-qty]")&&row.querySelector("[data-manual-qty]").value||0);subtotal+=Number(opt&&opt.dataset.price||0)*(Number.isFinite(qty)?qty:0)});var discount=Number(form&&form.elements.discount_amount_thb&&form.elements.discount_amount_thb.value||0);if(!Number.isFinite(discount)||discount<0)discount=0;var net=Math.max(0,subtotal-discount);total.innerHTML="ยอดก่อนลด: "+money(subtotal)+"<br>ส่วนลด: "+money(discount)+"<br><strong>ยอดสุทธิ: "+money(net)+"</strong>"}
 function setStatus(message,isError){status.textContent="";status.className="manual-order-status"+(isError?" is-error":"");if(message&&message.indexOf("http")===0){var a=document.createElement("a");a.href=message;a.target="_blank";a.rel="noopener";a.textContent="เปิดลิงก์ชำระเงิน";status.appendChild(a)}else status.textContent=message||""}
 toggle.addEventListener("click",function(){body.hidden=!body.hidden;if(!body.hidden&&lines.children.length===0)addLine()});close.addEventListener("click",function(){body.hidden=true});add.addEventListener("click",function(){addLine()});form.elements.discount_amount_thb.addEventListener("input",recalc);
 api("/v1/admin/shop/products").then(function(d){products=Array.isArray(d.products)?d.products:[];if(lines.children.length===0)addLine();else lines.querySelectorAll("[data-manual-product]").forEach(function(select){var selected=select.value;select.innerHTML=productOptions(selected)});recalc()}).catch(function(e){setStatus("โหลดสินค้าไม่สำเร็จ: "+e.message,true)});
 form.addEventListener("submit",function(e){e.preventDefault();var payloadLines=[];lines.querySelectorAll(".manual-order-line").forEach(function(row){var product=row.querySelector("[data-manual-product]"),qty=Number(row.querySelector("[data-manual-qty]").value||0);if(product&&product.value&&qty>0)payloadLines.push({product_id:product.value,quantity:qty})});if(!payloadLines.length){setStatus("เลือกสินค้าอย่างน้อย 1 รายการ",true);return}var f=new FormData(form);var submit=document.getElementById("manualOrderSubmit");submit.disabled=true;setStatus("กำลังสร้าง Order…");api("/v1/admin/shop/orders/create",{method:"POST",headers:{"content-type":"application/json",accept:"application/json"},body:JSON.stringify({customer:{name:f.get("customer_name"),phone:f.get("customer_phone"),email:f.get("customer_email")},shipping:{delivery_method:f.get("delivery_method"),recipient_name:f.get("customer_name"),phone:f.get("customer_phone"),address_line1:f.get("address_line1"),subdistrict:f.get("subdistrict"),district:f.get("district"),province:f.get("province"),postal_code:f.get("postal_code"),delivery_note:f.get("delivery_note")},items:payloadLines,discount_amount_thb:Number(f.get("discount_amount_thb")||0),discount_reason:f.get("discount_reason")})}).then(function(d){setStatus(d.payment_url||"สร้าง Order แล้ว แต่ยังไม่มีลิงก์ชำระเงิน");form.reset();lines.innerHTML="";addLine();recalc();load()}).catch(function(e){setStatus("สร้าง Order ไม่สำเร็จ: "+e.message,true)}).then(function(){submit.disabled=false})});
}

function fstate(o){return String(o.fulfillment_state||(o.fulfillment&&o.fulfillment.state)||"awaiting_payment").toLowerCase()}
function label(o){var s=fstate(o);return({awaiting_payment:"รอชำระ / รอตรวจ",confirmed:"ยืนยันแล้ว",preparing:"กำลังเตรียม",ready:"พร้อมส่ง / พร้อมรับ",shipped:"จัดส่งแล้ว",delivered:"ส่งถึงลูกค้าแล้ว",delivery_failed:"จัดส่งไม่สำเร็จ",completed:"สำเร็จ",return_requested:"ขอคืนสินค้า",return_received:"รับสินค้าคืนแล้ว",refund_pending:"รอคืนเงิน",refunded:"คืนเงินแล้ว",cancelled:"ยกเลิก"})[s]||"กำลังตรวจ"}
function bucket(o){var s=fstate(o);if(s==="refunded"||o.payment_status==="refunded")return"completed";if(["return_requested","return_received","refund_pending","delivery_failed"].indexOf(s)>-1)return"preparing";if(s==="completed"||o.order_status==="fulfilled")return"completed";if(s==="cancelled"||o.order_status==="cancelled")return"cancelled";if(["confirmed","preparing","ready","shipped","delivered"].indexOf(s)>-1)return"preparing";if(o.payment_status==="paid")return"paid";return"pending"}
function metric(id,v){var e=document.getElementById(id);if(e)e.textContent=String(v==null?0:v)}
function syncMetrics(m){metric("metricPending",m&&m.pending);metric("metricPaid",m&&m.paid);metric("metricPreparing",m&&m.preparing);metric("metricCompleted",m&&m.completed)}
function shippingText(o){var f=o.fulfillment||{},parts=[];if(f.delivery_method==="pickup")return"Pickup / รับสินค้าเอง";if(f.address){parts.push(f.address.address_line1||"");parts.push(f.address.address_line2||"");parts.push([f.address.subdistrict,f.address.district].filter(Boolean).join(" "));parts.push([f.address.province,f.address.postal_code].filter(Boolean).join(" "));}return parts.filter(Boolean).join("\n")||"ยังไม่มีข้อมูลจัดส่ง"}
function nextAction(o){var s=fstate(o),method=o.fulfillment&&o.fulfillment.delivery_method;if(o.order_status==="cancelled"||s==="refunded")return null;if(o.payment_status!=="paid"&&s!=="refunded")return null;if(s==="awaiting_payment")return{state:"confirmed",label:"ยืนยันเข้า Fulfillment"};if(s==="confirmed")return{state:"preparing",label:"เริ่มเตรียมสินค้า"};if(s==="preparing")return{state:"ready",label:"พร้อมส่ง / พร้อมรับ"};if(s==="ready"&&method==="pickup")return{state:"completed",label:"ลูกค้ารับแล้ว · Complete"};if(s==="ready")return{state:"shipped",label:"ยืนยันจัดส่ง"};if(s==="shipped")return{state:"delivered",label:"ยืนยันส่งถึงลูกค้า"};if(s==="delivered")return{state:"completed",label:"ปิด Order · Complete"};if(s==="delivery_failed")return{state:"ready",label:"เตรียมส่งใหม่"};if(s==="return_requested")return{state:"return_received",label:"รับสินค้าคืนแล้ว"};if(s==="return_received")return{state:"refund_pending",label:"เข้าคิวคืนเงิน"};if(s==="refund_pending")return{state:"refunded",label:"บันทึกคืนเงินสำเร็จ"};return null}
function altActions(o){var s=fstate(o),out=[];if(o.payment_status!=="paid")return out;if(s==="shipped")out.push({state:"delivery_failed",label:"จัดส่งไม่สำเร็จ",danger:true});if(s==="delivery_failed")out.push({state:"refund_pending",label:"คืนเงินแทนการส่งใหม่",danger:true});if(s==="delivered"||s==="completed")out.push({state:"return_requested",label:"เปิด Return",danger:false});return out}
function render(){
 var q=String(search&&search.value||"").trim().toLowerCase(),f=filter&&filter.value||"all";
 var rows=orders.filter(function(o){if(f!=="all"&&bucket(o)!==f)return false;if(!q)return true;var hay=[o.order_id,o.customer&&o.customer.name,o.customer&&o.customer.phone,o.customer&&o.customer.email].concat((o.items||[]).map(function(x){return x.item_name})).join(" ").toLowerCase();return hay.indexOf(q)>-1});
 state.hidden=true;list.hidden=false;
 list.innerHTML=rows.length?rows.map(function(o){
  var items=(o.items||[]).map(function(x){return esc(x.item_name||"Item")+" × "+esc(x.quantity||0)}).join(" · ");
  var contact=[o.customer&&o.customer.phone,o.customer&&o.customer.email].filter(Boolean).map(esc).join(" · ");
  var ff=o.fulfillment||{},next=nextAction(o),alts=altActions(o),tracking=ff.tracking_number||"",courier=ff.courier||"";
  var ship='<div class="shopadmin-shipping"><strong>'+(ff.delivery_method==="pickup"?"Pickup":"Delivery")+' · '+esc(ff.recipient_name||o.customer&&o.customer.name||"")+(ff.phone?" · "+esc(ff.phone):"")+'</strong><p>'+esc(shippingText(o))+(ff.delivery_note?"\nNote: "+esc(ff.delivery_note):"")+(tracking?"\n"+esc(courier||"Courier")+" · "+esc(tracking):"")+(ff.refund_method?"\nRefund: "+esc(ff.refund_method)+" · "+esc(money(ff.refund_amount_thb)):"")+'</p></div>';
  var controls="";
  if(next||alts.length||o.can_cancel){
   var refundFields=next&&next.state==="refunded"?'<div class="shopadmin-fulfill-grid"><label class="shopadmin-field"><span>Refund Method *</span><input data-refund-method placeholder="เช่น PromptPay / Bank Transfer"></label><label class="shopadmin-field"><span>Refund Reference *</span><input data-refund-reference placeholder="เลขอ้างอิงการคืนเงิน"></label><label class="shopadmin-field"><span>Refund Amount *</span><input data-refund-amount inputmode="decimal" value="'+esc(o.total_thb||"")+'" placeholder="0"></label></div>':'';
   var altButtons=alts.map(function(a){return'<button class="shopadmin-action '+(a.danger?'shopadmin-action-danger':'')+'" type="button" data-next-state="'+esc(a.state)+'">'+esc(a.label)+'</button>'}).join("");
   controls='<div class="shopadmin-fulfill">'+(next&&next.state==="shipped"?'<div class="shopadmin-fulfill-grid"><label class="shopadmin-field"><span>Courier</span><input data-courier value="'+esc(courier)+'" placeholder="เช่น Flash / Grab / Kerry"></label><label class="shopadmin-field"><span>Tracking Number *</span><input data-tracking value="'+esc(tracking)+'" placeholder="Tracking"></label></div>':'')+refundFields+'<label class="shopadmin-field"><span>Fulfillment / Return Note</span><input data-fulfillment-note placeholder="หมายเหตุภายใน"></label><div class="shopadmin-next"><span class="shopadmin-progress" data-action-status></span>'+(o.can_cancel?'<button class="shopadmin-action shopadmin-action-danger" type="button" data-cancel>ยกเลิก Order</button>':'')+altButtons+(next?'<button class="shopadmin-action shopadmin-action-primary" type="button" data-next-state="'+esc(next.state)+'">'+esc(next.label)+'</button>':'')+'</div></div>'
  }
  return '<article class="shopadmin-order" data-order-id="'+esc(o.order_id)+'"><div class="shopadmin-order-top"><div><div class="shopadmin-order-ref">'+esc(o.order_id)+'</div><small class="shopadmin-order-meta">'+esc(o.order_date||"")+' · '+esc(o.source||"web")+'</small></div><span class="shopadmin-pill">'+esc(label(o))+'</span></div><div class="shopadmin-customer"><strong>'+esc(o.customer&&o.customer.name||"MMD Shop Customer")+'</strong>'+(contact?" · "+contact:"")+'</div><div class="shopadmin-identity"><span class="'+(o.customer&&o.customer.member_linked?"is-linked":"")+'">MY MMD '+(o.customer&&o.customer.member_linked?"LINKED":"—")+'</span><span class="'+(o.customer&&o.customer.line_linked?"is-linked":"")+'">LINE '+(o.customer&&o.customer.line_linked?"LINKED":"—")+'</span></div><div class="shopadmin-items">'+(items||"ไม่มีรายการสินค้า")+'</div>'+ship+'<div class="shopadmin-order-bottom"><div><span class="shopadmin-money-label">ยอดรวม / Payment</span><strong class="shopadmin-money">'+esc(money(o.total_thb))+'</strong><div class="shopadmin-order-meta">'+esc(o.payment_status||"pending")+'</div></div></div>'+controls+'</article>'
 }).join(""):'<div class="shopadmin-state">ไม่พบ Order ตามตัวกรองนี้</div>';
}
async function api(url,opt){var r=await fetch(url,Object.assign({credentials:"include",headers:{accept:"application/json"},cache:"no-store"},opt||{}));var d=await r.json().catch(function(){return{}});if(r.status===401){location.href="/internal/admin/login?next="+encodeURIComponent("/internal/admin/shop/orders");throw new Error("auth")}if(!r.ok||d.ok!==true)throw new Error(d.error||"request_failed");return d}
async function load(){state.hidden=false;state.textContent="กำลังโหลด Order จากระบบ…";list.hidden=true;try{var d=await api("/v1/admin/shop/orders");orders=Array.isArray(d.orders)?d.orders:[];syncMetrics(d.metrics||{});render()}catch(e){if(e.message!=="auth"){state.hidden=false;state.textContent="โหลด Shop Orders ไม่สำเร็จ กรุณารีเฟรชหรือตรวจ Admin Session"}}}
async function transition(card,nextState){var orderId=card.dataset.orderId,status=card.querySelector("[data-action-status]"),buttons=card.querySelectorAll("button"),courier=card.querySelector("[data-courier]"),tracking=card.querySelector("[data-tracking]"),note=card.querySelector("[data-fulfillment-note]"),refundMethod=card.querySelector("[data-refund-method]"),refundReference=card.querySelector("[data-refund-reference]"),refundAmount=card.querySelector("[data-refund-amount]");if(nextState==="shipped"&&tracking&&!tracking.value.trim()){status.textContent="ใส่ Tracking Number ก่อน";tracking.focus();return}if(nextState==="refunded"){if(!refundMethod||!refundMethod.value.trim()){status.textContent="ใส่ Refund Method ก่อน";refundMethod&&refundMethod.focus();return}if(!refundReference||!refundReference.value.trim()){status.textContent="ใส่ Refund Reference ก่อน";refundReference&&refundReference.focus();return}if(!refundAmount||!(Number(refundAmount.value)>0)){status.textContent="ใส่ยอดคืนเงินก่อน";refundAmount&&refundAmount.focus();return}if(!window.confirm("ยืนยันว่าได้คืนเงินเต็มยอดให้ลูกค้าแล้ว?"))return}buttons.forEach(function(b){b.disabled=true});status.textContent="กำลังบันทึก…";try{await api("/v1/admin/shop/orders/fulfillment",{method:"POST",headers:{"content-type":"application/json",accept:"application/json"},body:JSON.stringify({order_id:orderId,state:nextState,courier:courier&&courier.value||undefined,tracking_number:tracking&&tracking.value||undefined,fulfillment_note:note&&note.value||undefined,return_note:note&&note.value||undefined,refund_method:refundMethod&&refundMethod.value||undefined,refund_reference:refundReference&&refundReference.value||undefined,refund_amount_thb:refundAmount&&Number(refundAmount.value)||undefined})});await load()}catch(e){status.textContent="บันทึกไม่ได้: "+e.message;buttons.forEach(function(b){b.disabled=false})}}
if(form)form.addEventListener("submit",function(e){e.preventDefault()});if(search)search.addEventListener("input",render);if(filter)filter.addEventListener("change",render);if(refresh)refresh.addEventListener("click",load);
list.addEventListener("click",function(e){var card=e.target.closest("[data-order-id]");if(!card)return;var next=e.target.closest("[data-next-state]");if(next)transition(card,next.dataset.nextState);var cancel=e.target.closest("[data-cancel]");if(cancel&&window.confirm("ยืนยันยกเลิก Order นี้?"))transition(card,"cancelled")});
injectNav();injectManualOrderForm();load();
})();
</script>
