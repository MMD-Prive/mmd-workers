<meta name="robots" content="noindex,nofollow"><meta name="googlebot" content="noindex,nofollow">
<style>
.shopadmin-opsnav{max-width:1180px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto}
.shopadmin-opsnav a{white-space:nowrap;padding:7px 10px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:#1a1815;color:#bdb4a8;text-decoration:none;font-size:10px;font-weight:850}
.shopadmin-opsnav a.is-active{border-color:#c9a86e;color:#c9a86e}
.shopadmin-identity{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.shopadmin-identity span{padding:4px 7px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:#9e9588;font-size:9px;font-weight:850}
.shopadmin-identity span.is-linked{border-color:rgba(201,168,110,.4);color:#c9a86e}
.shopadmin-shipping{margin-top:12px;padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:#15130f}
.shopadmin-shipping strong{display:block;font-size:11px;color:#eee5d7}
.shopadmin-shipping p{margin:5px 0 0;color:#948b7f;font-size:10px;line-height:1.6;white-space:pre-line}
.shopadmin-fulfill{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)}
.shopadmin-fulfill-grid{display:grid;grid-template-columns:1fr;gap:7px}
.shopadmin-field{display:grid;gap:4px}.shopadmin-field span{font-size:9px;color:#948b7f}
.shopadmin-field input{width:100%;min-height:38px;padding:0 10px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#11100e;color:#f3eee5;font:inherit;outline:none}
.shopadmin-field input:focus{border-color:#c9a86e;box-shadow:0 0 0 2px rgba(201,168,110,.12)}
.shopadmin-next{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.shopadmin-action-danger{border-color:#8f4c52!important;color:#e6a2a6!important;background:rgba(143,76,82,.12)!important}
.shopadmin-progress{font-size:10px;color:#948b7f;line-height:1.5}
