<script>(function(){
"use strict";
var root=document.getElementById("mmd-shop-products-admin-v1");if(!root||root.dataset.bound==="1")return;root.dataset.bound="1";
var API=root.dataset.api,UPDATE_API=root.dataset.updateApi,state=root.querySelector("[data-state]"),list=root.querySelector("[data-products]"),search=root.querySelector("[data-search]"),filter=root.querySelector("[data-filter]");var data={products:[],metrics:{}};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function money(v){var n=Number(v);return Number.isFinite(n)?n.toLocaleString("th-TH",{maximumFractionDigits:2}):""}
function num(v){var n=Number(v);return Number.isFinite(n)?n.toLocaleString("th-TH"):"0"}
function login(){location.href="/internal/admin/login?next="+encodeURIComponent("/internal/admin/shop/products")}
async function api(url,opt){var r=await fetch(url,Object.assign({credentials:"include",headers:{accept:"application/json"},cache:"no-store"},opt||{}));var d=await r.json().catch(function(){return{}});if(r.status===401){login();throw new Error("auth")}if(!r.ok||d.ok!==true)throw new Error(d.error||"request_failed");return d}
function metric(k,v){var el=root.querySelector('[data-metric="'+k+'"]');if(el)el.textContent=num(v)}
function visible(p){var q=String(search&&search.value||"").trim().toLowerCase(),f=filter&&filter.value||"all";if(q&&[p.product_name,p.sku,p.category].join(" ").toLowerCase().indexOf(q)<0)return false;if(f==="enabled"&&!p.mmd_enabled)return false;if(f==="disabled"&&p.mmd_enabled)return false;if(f==="needs_price"&&(!p.mmd_enabled||Number(p.mmd_price_thb)>0))return false;if(f==="low_stock"&&!p.low_stock)return false;return true}
function render(){
 Object.keys(data.metrics||{}).forEach(function(k){metric(k,data.metrics[k])});
 var rows=data.products.filter(visible);
 state.hidden=true;list.hidden=false;
 list.innerHTML=rows.length?rows.map(function(p){return '<article class="shopops-product" data-product-id="'+esc(p.id)+'"><div><div class="shopops-producttop"><div><h3>'+esc(p.product_name)+'</h3><div class="shopops-meta">'+esc(p.sku||"No SKU")+' · Stock '+num(p.quantity_remaining)+'</div></div><span class="shopops-pill '+(p.mmd_enabled?'is-gold':'')+'">'+(p.mmd_enabled?'MMD ON':'MMD OFF')+'</span></div><div class="shopops-productmeta"><span class="shopops-pill">Shared: '+esc(p.shared_status||"draft")+'</span><span class="shopops-pill">'+esc(p.category||"Other")+'</span><span class="shopops-pill">Stock: '+esc(p.stock_status||"unknown")+'</span><span class="shopops-pill">Mode: '+esc(p.availability_mode||"stock")+'</span><span class="shopops-pill '+(p.checkout_eligible?'is-good':'is-low')+'">'+(p.checkout_eligible?'CHECKOUT ON':'CHECKOUT OFF')+'</span><span class="shopops-pill">'+esc(p.online_checkout_status||"unknown")+'</span>'+(p.curation_label?'<span class="shopops-pill">'+esc(p.curation_label)+'</span>':'')+(p.low_stock?'<span class="shopops-pill is-low">LOW STOCK</span>':'')+'</div>'+'<div class="shopops-meta">Supplier: '+esc((p.suppliers||[]).join(" · ")||"—")+'</div>'+(p.product_note?'<div class="shopops-meta">'+esc(p.product_note)+'</div>':'')+'</div><div class="shopops-productcontrol"><label class="shopops-switch"><input type="checkbox" data-enabled '+(p.mmd_enabled?'checked':'')+'> เปิดขายใน MMD Shop</label><label class="shopops-pricefield"><span>MMD Shop Selling Price THB</span><input type="number" min="0.01" step="0.01" data-price value="'+esc(money(p.mmd_price_thb))+'" placeholder="ราคา MMD"></label><div class="shopops-productactions"><span class="shopops-savestatus" data-save-status></span><button class="shopops-btn shopops-btn--primary" type="button" data-save>บันทึก</button></div></div></article>'}).join(""):'<div class="shopops-empty">ไม่พบสินค้า</div>'
}
async function load(){state.hidden=false;state.textContent="กำลังโหลด Product Catalog…";list.hidden=true;try{data=await api(API);render()}catch(e){if(e.message!=="auth"){state.hidden=false;state.textContent="โหลด Products ไม่สำเร็จ กรุณารีเฟรชหรือตรวจ Admin Session"}}}
list.addEventListener("click",async function(e){var btn=e.target.closest("[data-save]");if(!btn)return;var card=btn.closest("[data-product-id]"),status=card.querySelector("[data-save-status]"),enabled=card.querySelector("[data-enabled]").checked,price=Number(card.querySelector("[data-price]").value);if(enabled&&!(price>0)){status.textContent="ต้องใส่ราคา MMD ก่อนเปิดขาย";return}btn.disabled=true;status.textContent="กำลังบันทึก…";try{await api(UPDATE_API,{method:"POST",headers:{"content-type":"application/json",accept:"application/json"},body:JSON.stringify({product_id:card.dataset.productId,mmd_enabled:enabled,mmd_price_thb:price>0?price:undefined})});status.textContent="บันทึกแล้ว";await load()}catch(err){status.textContent="บันทึกไม่ได้: "+err.message;btn.disabled=false}});
root.querySelector("[data-refresh]").addEventListener("click",load);if(search)search.addEventListener("input",render);if(filter)filter.addEventListener("change",render);load()
})();</script>
