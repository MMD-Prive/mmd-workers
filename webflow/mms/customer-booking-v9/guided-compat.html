
<script>(function(){function patch(){var consent=document.querySelector('#mmb2-review .w-checkbox-label');if(consent&&consent.textContent.indexOf('MMD')>-1)consent.textContent=consent.textContent.replace(/MMD/g,'MMS');var success=document.querySelectorAll('#mmb2-success p');success.forEach(function(p){if(p.textContent.indexOf('MMD')>-1)p.textContent=p.textContent.replace(/MMD/g,'MMS')});}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',patch)}else{patch()}})();</script>
