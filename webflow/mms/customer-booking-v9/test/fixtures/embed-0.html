<script>
(function(){
  'use strict';
  var ZONE_CODE_RE=/^(BKK|NBI|PTE|SPK|SKN|NPT)-[A-Z0-9-]{2,70}$/;
  var catalog=null,writingZones=false;
  function ready(fn){if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',fn,{once:true});}else{fn();}}
  function el(id){return document.getElementById(id);}
  function numberFromOption(o){var raw=(o&&((o.value||'')+' '+(o.textContent||'')))||'';var m=raw.match(/\d+/);return m?parseInt(m[0],10):null;}
  function enforceDuration(){var e=el('mmb2-duration');if(!e)return;var ninety=null;Array.prototype.forEach.call(e.options,function(o){var n=numberFromOption(o);if(n!==null&&n<90){o.disabled=true;o.hidden=true;o.setAttribute('data-mmb-below-min','1');}if(n===90)ninety=o;});if(!ninety){ninety=new Option('90 นาที','90');e.add(ninety,Math.min(1,e.options.length));}var current=numberFromOption(e.options[e.selectedIndex]||{});if(current===null||current<90){ninety.disabled=false;ninety.hidden=false;e.value=ninety.value;ninety.selected=true;e.dispatchEvent(new Event('change',{bubbles:true}));}}
  function setStatus(text,isError){var s=el('mmb2-gps-status');if(s){s.textContent=text||'';s.dataset.state=isError?'error':'ready';}}
  function option(select,label,value){var o=new Option(label,value);select.add(o);return o;}
  function zoneLabel(z){return z.label_th||z.safe_label_th||z.code;}
  function zonesForProvince(code){return (catalog&&catalog.zones||[]).filter(function(z){return z.province_code===code&&ZONE_CODE_RE.test(z.code||'');});}
  function renderZones(preferred){var province=el('mmb2-province'),zone=el('mmb2-zone');if(!province||!zone||!catalog)return;var list=zonesForProvince(province.value);writingZones=true;while(zone.options.length)zone.remove(0);option(zone,province.value?'เลือกโซน / เขต / อำเภอ':'เลือกจังหวัดก่อน','');list.forEach(function(z){var o=option(zone,zoneLabel(z),z.code);if(z.admin_areas_th)o.title=z.admin_areas_th;});var wanted=preferred&&list.some(function(z){return z.code===preferred;})?preferred:'';zone.value=wanted;zone.disabled=!province.value||!list.length;zone.setAttribute('data-mmb-zone-source','canonical');writingZones=false;if(wanted)zone.dispatchEvent(new Event('change',{bubbles:true}));}
  function renderProvinces(){var province=el('mmb2-province');if(!province||!catalog)return;var previous=province.value;while(province.options.length)province.remove(0);option(province,'เลือกจังหวัด','');(catalog.provinces||[]).forEach(function(p){option(province,p.label_th||p.label_en||p.code,p.code);});province.disabled=false;var wanted=(catalog.provinces||[]).some(function(p){return p.code===previous;})?previous:((catalog.provinces||[]).some(function(p){return p.code==='BKK';})?'BKK':'');province.value=wanted;renderZones('');}
  function validCatalog(data){return data&&Array.isArray(data.provinces)&&data.provinces.length&&Array.isArray(data.zones)&&data.zones.length&&data.zones.every(function(z){return ZONE_CODE_RE.test(z.code||'')&&z.province_code;});}
  async function loadZones(){var root=el('mmb2'),province=el('mmb2-province'),zone=el('mmb2-zone');if(!root||!province||!zone)return;province.disabled=true;zone.disabled=true;while(province.options.length)province.remove(0);option(province,'กำลังโหลดจังหวัด…','');while(zone.options.length)zone.remove(0);option(zone,'กำลังโหลดโซน…','');var endpoint=root.getAttribute('data-service-zones-endpoint');if(!endpoint){setStatus('ยังไม่สามารถโหลดพื้นที่ให้บริการได้ กรุณาลองใหม่อีกครั้ง',true);return;}try{var res=await fetch(endpoint,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});var payload=await res.json().catch(function(){return null;});if(!res.ok||!payload||payload.ok!==true||!validCatalog(payload.data))throw new Error('catalog');catalog=payload.data;renderProvinces();setStatus('เลือกจังหวัดก่อน แล้วเลือกโซนที่ใกล้สถานที่จริงที่สุด',false);}catch(e){catalog=null;while(province.options.length)province.remove(0);option(province,'โหลดจังหวัดไม่สำเร็จ','');while(zone.options.length)zone.remove(0);option(zone,'โหลดโซนไม่สำเร็จ','');province.disabled=true;zone.disabled=true;setStatus('พื้นที่ให้บริการโหลดไม่สำเร็จ จึงยังไม่ส่งคำขอจองเพื่อป้องกันการจับคู่ผิดพื้นที่',true);}}
  function initProvince(){var province=el('mmb2-province'),zone=el('mmb2-zone');if(!province||!zone)return;province.addEventListener('change',function(){renderZones('');zone.dispatchEvent(new Event('change',{bubbles:true}));});new MutationObserver(function(){if(!catalog||writingZones)return;var bad=Array.prototype.some.call(zone.options,function(o){return o.value&& !ZONE_CODE_RE.test(o.value);});if(bad)renderZones(zone.value);}).observe(zone,{childList:true,subtree:false});}
  function initGps(){var btn=el('mmb2-use-gps');if(!btn||btn.dataset.mmbCanonicalReady==='1')return;btn.dataset.mmbCanonicalReady='1';btn.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();if(!navigator.geolocation){setStatus('Browser นี้ไม่รองรับ GPS กรุณาเลือกจังหวัดและโซนเองได้เลย',true);return;}btn.disabled=true;setStatus('กำลังตรวจว่าตำแหน่งพร้อมใช้งาน…',false);navigator.geolocation.getCurrentPosition(function(){setStatus('รับตำแหน่งแล้ว เพื่อความแม่นยำในการจับคู่ กรุณายืนยันจังหวัดและโซนจากรายการเอง',false);btn.disabled=false;},function(){setStatus('ไม่สามารถอ่านตำแหน่งได้ กรุณาเลือกจังหวัดและโซนเองได้เลย',true);btn.disabled=false;},{enableHighAccuracy:false,timeout:8000,maximumAge:300000});},true);}
  ready(function(){enforceDuration();initProvince();initGps();loadZones();var d=el('mmb2-duration');if(d){new MutationObserver(enforceDuration).observe(d,{childList:true,subtree:true});d.addEventListener('change',enforceDuration);}setTimeout(enforceDuration,400);setTimeout(enforceDuration,1400);});
})();
</script>
