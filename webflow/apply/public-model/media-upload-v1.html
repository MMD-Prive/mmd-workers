<!-- MMD Public Model · Media upload V1 · place inside /apply/public-model page custom code -->
<style>
.pma-media-v1{grid-column:1/-1;padding:18px;border:1px solid rgba(210,182,116,.42);border-radius:18px;background:#171717;color:#f7f2e8}.pma-media-v1 h3{margin:0 0 6px}.pma-media-v1 p{margin:6px 0;line-height:1.5}.pma-media-v1__note{color:#cfc7b7;font-size:13px}.pma-media-v1 input{display:block;width:100%;margin:12px 0;padding:12px;border:1px solid #76684c;border-radius:10px;background:#0d0d0d;color:#fff}.pma-media-v1 ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}.pma-media-v1 li{padding:10px;border-radius:10px;background:#0e0e0e}.pma-media-v1 progress{width:100%;height:8px;accent-color:#d9bd80}.pma-media-v1 button{min-height:42px;border:1px solid #c9aa69;border-radius:10px;background:#d9bd80;color:#17130b;font-weight:700}.pma-media-v1__row{display:flex;justify-content:space-between;gap:10px}.pma-media-v1__error{color:#ffb9ae}.pma-media-v1__ok{color:#bde7bd}.pma-media-v1__confidential{display:inline-block;margin-top:8px;color:#e6c77e;text-underline-offset:3px}
</style>
<script>
(() => {
  'use strict';
  const APPLY='/v1/public-model/apply',UPLOAD='/v1/public-model/upload-url',MAX_BYTES=25*1024*1024,MAX_PHOTOS=8,MAX_CLIPS=1,STORE='mmd:public-model-media:v1';
  const worker='https://sigil-worker.malemodel-bkk.workers.dev';
  const photos=new Set(['image/jpeg','image/png','image/webp','image/heic','image/heif']),clips=new Set(['video/mp4','video/quicktime','video/webm']);
  const form=document.querySelector('#p9-apply form'),step=document.querySelector('#p9-apply [data-step="3"]'),submit=document.querySelector('#p9-apply [data-submit]');
  if(!form||!step||!submit||document.querySelector('[data-mmd-public-media="v1"]'))return;
  const box=document.createElement('section');box.className='pma-media-v1';box.dataset.mmdPublicMedia='v1';box.innerHTML='<h3>รูปและข้อมูลเพิ่มเติมให้พี่เปอร์ดู</h3><p>ส่งรูปได้สูงสุด 8 รูป · คลิปสูงสุด 1 คลิป · ไฟล์ละไม่เกิน 25 MB</p><p class="pma-media-v1__note">ถ้ายังไม่สะดวกส่งรูปตอนนี้ ส่งข้อมูลกับ LINE หรือเบอร์โทรไว้ก่อนได้ เดี๋ยวพี่เปอร์คุยต่อให้เองครับ</p><p class="pma-media-v1__note">แนะนำภาพไลฟ์สไตล์ที่เป็นตัวเอง เห็นใบหน้าชัด ยิ้มหรือดูเท่ มีภาพกิจกรรม/กีฬาได้ ควรให้ผู้อื่นช่วยถ่าย เลี่ยงภาพสตูดิโอ แว่นดำ หมวก เซลฟี่ที่บังหน้า แต่งหน้าจัด และรูปคู่</p><p class="pma-media-v1__note">รูปและข้อมูลที่ส่งใช้ให้พี่เปอร์พิจารณาและจัดงานเท่านั้น ไม่เปิดให้คนทั่วไปเห็น</p><a class="pma-media-v1__confidential" href="https://t.me/per_mmd" rel="noreferrer">CONFIDENTIAL · คุยกับพี่เปอร์โดยตรงที่ t.me/per_mmd</a><input data-media-files type="file" multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,video/mp4,video/quicktime,video/webm"><p data-media-state role="status" aria-live="polite"></p><ul data-media-list></ul>';
  (step.querySelector('.p9-fields')||step).append(box);
  const input=box.querySelector('[data-media-files]'),state=box.querySelector('[data-media-state]'),list=box.querySelector('[data-media-list]');let queue=[],draft=readDraft(),uploading=false;
  function readDraft(){try{const value=JSON.parse(localStorage.getItem(STORE)||'null');return value&&Array.isArray(value.uploads)?value:{upload_session_id:'',uploads:[]}}catch{return{upload_session_id:'',uploads:[]}}}
  function saveDraft(){localStorage.setItem(STORE,JSON.stringify(draft))}
  function say(text,error=false){state.textContent=text;state.className=error?'pma-media-v1__error':''}
  function kind(file){return photos.has(file.type)?'photo':clips.has(file.type)?'clip':''}
  function role(type){return type==='clip'?'introduction':'other_photo'}
  function syncSubmit(){submit.disabled=uploading||queue.some(item=>item.status!=='done'&&item.status!=='error')}
  function renderSaved(){if(!draft.uploads.length)return;say('กู้รายการที่ส่งไว้แล้ว '+draft.uploads.length+' ไฟล์ · พร้อมแนบกับใบสมัคร');for(const item of draft.uploads){const li=document.createElement('li');li.className='pma-media-v1__ok';li.textContent=(item.kind==='clip'?'คลิป':'รูป')+' · ส่งแล้ว · รอพี่เปอร์ดู';list.append(li)}}
  function row(item){const li=document.createElement('li');li.innerHTML='<div class="pma-media-v1__row"><span></span><button type="button" hidden>ลองอีกครั้ง</button></div><progress max="100" value="0"></progress><p></p>';li.querySelector('span').textContent=item.file.name;item.node=li;item.progress=li.querySelector('progress');item.message=li.querySelector('p');item.retry=li.querySelector('button');item.retry.onclick=()=>uploadOne(item);list.append(li);return item}
  function validate(files){const accepted=[],seen=new Set();for(const file of files){const type=kind(file);if(!type)throw new Error('รองรับเฉพาะ JPG, PNG, WebP, HEIC, MP4, MOV และ WebM');if(file.size<1||file.size>MAX_BYTES)throw new Error('ไฟล์ '+file.name+' ต้องไม่เกิน 25 MB');const key=[file.name,file.size,file.lastModified].join(':');if(seen.has(key))continue;seen.add(key);accepted.push({file,type})}const existingPhotos=draft.uploads.filter(x=>x.kind==='photo').length,existingClips=draft.uploads.filter(x=>x.kind==='clip').length;if(existingPhotos+accepted.filter(x=>x.type==='photo').length>MAX_PHOTOS)throw new Error('เลือกรูปได้สูงสุด 8 รูป');if(existingClips+accepted.filter(x=>x.type==='clip').length>MAX_CLIPS)throw new Error('เลือกคลิปได้สูงสุด 1 คลิป');return accepted}
  function put(item,url){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',url);xhr.setRequestHeader('content-type',item.file.type);xhr.upload.onprogress=event=>{if(event.lengthComputable)item.progress.value=Math.round(event.loaded/event.total*100)};xhr.onload=()=>{let data=null;try{data=JSON.parse(xhr.responseText)}catch{}if(xhr.status>=200&&xhr.status<300&&data?.ok)resolve(data);else reject(new Error(data?.error||'ส่งไฟล์ไม่สำเร็จ'))};xhr.onerror=()=>reject(new Error('เครือข่ายขัดข้อง กรุณาลองใหม่'));xhr.send(item.file)})}
  async function uploadOne(item){if(item.busy||item.status==='done')return;item.busy=true;item.status='uploading';item.retry.hidden=true;item.message.className='';item.message.textContent='กำลังขอสิทธิ์ส่งไฟล์…';syncSubmit();try{const response=await fetch(worker+UPLOAD,{method:'POST',mode:'cors',credentials:'omit',headers:{'content-type':'application/json'},body:JSON.stringify({application_type:'public_model',source:'webflow_public_model',form_version:'public-model-apply-v8',upload_session_id:draft.upload_session_id||undefined,kind:item.type,role:role(item.type),file_name:item.file.name,content_type:item.file.type,file_size:item.file.size,consent:true,source_path:location.pathname})}),plan=await response.json();if(!response.ok||!plan?.ok)throw new Error(plan?.error||'ขอสิทธิ์ส่งไฟล์ไม่สำเร็จ');draft.upload_session_id=plan.upload_session_id;item.message.textContent='กำลังส่งไฟล์…';await put(item,plan.upload_url);draft.uploads.push({upload_ref:plan.upload_ref,kind:item.type,role:role(item.type)});item.status='done';item.progress.value=100;item.message.className='pma-media-v1__ok';item.message.textContent='ส่งแล้ว · รอพี่เปอร์ดู';saveDraft()}catch(error){item.status='error';item.message.className='pma-media-v1__error';item.message.textContent='ยังส่งไม่ได้: '+(error.message||'unknown_error');item.retry.hidden=false}finally{item.busy=false;syncSubmit()}}
  input.addEventListener('change',async()=>{try{queue=validate([...input.files]).map(item=>row({...item,status:'ready'}));uploading=true;syncSubmit();for(const item of queue)await uploadOne(item)}catch(error){input.value='';queue=[];say(error.message,true)}finally{uploading=false;syncSubmit()}});
  const nativeFetch=window.fetch.bind(window);window.fetch=(inputArg,init={})=>{const url=typeof inputArg==='string'?inputArg:inputArg.url,isApply=init.method==='POST'&&url.includes(APPLY)&&typeof init.body==='string';if(isApply){const body=JSON.parse(init.body),params=new URLSearchParams(location.search);body.upload_enabled=true;body.upload_endpoint_present=true;body.upload_session_id=draft.upload_session_id||undefined;body.uploads=draft.uploads;const jobId=params.get('job_id');const source=params.get('source');if(jobId)body.job_id=jobId;if(source)body.application_source=source;init={...init,body:JSON.stringify(body)}}return nativeFetch(inputArg,init).then(response=>{if(isApply&&response.ok)localStorage.removeItem(STORE);return response})};
  form.addEventListener('submit',()=>{if(draft.uploads.length)localStorage.setItem(STORE,JSON.stringify(draft))},true);renderSaved();syncSubmit();
})();
</script>
