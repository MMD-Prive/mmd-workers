<script id="sigil-confirm-lv9-navigation">
(()=>{
function arrange(){
const root=document.getElementById("mmd-model-confirm-v15"),nav=root?.querySelector("[data-mmd-model-work-nav]"),wrap=root?.querySelector(".mm15__wrap"),intro=wrap?.querySelector(".mm15__intro");
if(!nav||!wrap||!intro)return false;
intro.insertAdjacentElement("afterend",nav);
const en=(document.documentElement.lang||"").startsWith("en");
const links=nav.querySelectorAll("a");
for(const a of links){
const path=new URL(a.href,location.origin).pathname;
if(path==="/sigil/model/console"){const sub=document.createElement("small");sub.textContent=en?"Manage your work":"จัดการงานของคุณ";a.appendChild(sub);}
if(path==="/rules/model"){const sub=document.createElement("small");sub.textContent=en?"Before accepting a job":"กติกาก่อนรับงาน";a.appendChild(sub);}
}
return true;
}
function boot(){if(arrange())return;const observer=new MutationObserver(()=>{if(arrange())observer.disconnect();});observer.observe(document.body,{childList:true,subtree:true});}
document.readyState==="loading"?document.addEventListener("DOMContentLoaded",boot,{once:true}):boot();
})();
</script>
