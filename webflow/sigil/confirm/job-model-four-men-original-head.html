<style id="mmd-model-confirm-hero-v1">
html body #mmd-model-confirm-v15{position:relative!important;isolation:isolate!important}
html body #mmd-model-confirm-v15::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(9,7,6,.26) 0%,rgba(9,7,6,.50) 46%,rgba(9,7,6,.94) 100%),
    linear-gradient(90deg,rgba(9,7,6,.54) 0%,rgba(9,7,6,.20) 48%,rgba(9,7,6,.48) 100%),
    url("https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6aae01986694a15782cd6d83_Confirmation%20Group.webp") center 34% / cover no-repeat;
  filter:saturate(.88) contrast(.96) brightness(.88);
}
html body #mmd-model-confirm-v15::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(36rem 24rem at 72% 10%,rgba(227,189,124,.13),transparent 68%),
    linear-gradient(180deg,transparent 0 64%,rgba(8,6,5,.52) 100%);
}
@media(max-width:560px){
  html body #mmd-model-confirm-v15::before{
    background:
      linear-gradient(180deg,rgba(9,7,6,.20) 0%,rgba(9,7,6,.42) 42%,rgba(9,7,6,.96) 100%),
      linear-gradient(90deg,rgba(9,7,6,.42),rgba(9,7,6,.16),rgba(9,7,6,.38)),
      url("https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6aaf1cc6fdfd853b3d9f2c1a_Group%20SIGIL%20Pay%20Mob.webp") center 20% / cover no-repeat;
  }
}
</style>
<style id="mmd-model-lang-layout-v1">
