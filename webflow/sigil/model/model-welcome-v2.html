        ? "private"
        : "public";

    const inviteTrusted = token(context.entry_source) === "per_invite"
      && context.invite_verified === true
      && context.invite_replay_safe === true;

    return Object.freeze({
      lane,
      entrySource: inviteTrusted ? "per_invite" : "self",
      trusted: true,
    });
  }

  function liffTarget() {
    const url = new URL(LIFF_URL);
    url.searchParams.set("source", "model_login");
    url.searchParams.set("return_to", "dashboard");
    return url.toString();
  }

  function ensureStyle() {
    if (document.getElementById("mmd-model-welcome-v2-style")) return;
    const style = document.createElement("style");
    style.id = "mmd-model-welcome-v2-style";
    style.textContent = "#mmd-model-welcome-v2{--paper:#eee8dc;--ink:#27201d;--body:#554b46;--accent:#a21d36;--button:#731b2a;--button-ink:#fff8eb;min-height:100svh;width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:'LINE Seed Sans TH','Noto Sans Thai',system-ui,sans-serif}\n#mmd-model-welcome-v2[data-lane=private]{--paper:#0c0a08;--ink:#f5ebd8;--body:#ddd1be;--accent:#d7b162;--button:#cca45c;--button-ink:#17100a}\n#mmd-model-welcome-v2 *{box-sizing:border-box}\n#mmd-model-welcome-v2 .mw2-hero{height:176px;position:relative;background:linear-gradient(90deg,rgba(7,5,4,.84) 0%,rgba(7,5,4,.42) 45%,rgba(7,5,4,.03) 100%),url('https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6aa6cead27f3ee081d057794_TMIB%20Bangkok.webp') center 48%/cover,#19110d}\n#mmd-model-welcome-v2[data-lane=private] .mw2-hero{background:linear-gradient(90deg,rgba(4,3,2,.18),rgba(4,3,2,.12)),url('https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6a61b1d19a4570eb40235c4b_SigilWall.webp') center/cover,#100c08}\n#mmd-model-welcome-v2 .mw2-brand{position:absolute;top:max(24px,env(safe-area-inset-top));left:27px;right:20px;display:flex;gap:13px;align-items:center;color:#fff5e7!important;-webkit-text-fill-color:#fff5e7!important}\n#mmd-model-welcome-v2 .mw2-logo{display:block;width:32px;height:32px;object-fit:contain;border-radius:6px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}\n#mmd-model-welcome-v2[data-lane=private] .mw2-logo{width:60px;height:60px;border-radius:10px;box-shadow:none}\n#mmd-model-welcome-v2 .mw2-brand-title{display:block;font:400 22px/1.05 Georgia,serif;letter-spacing:.03em;color:#fff2e6!important;-webkit-text-fill-color:#fff2e6!important}\n#mmd-model-welcome-v2[data-lane=private] .mw2-brand-title{color:#f2d797!important;-webkit-text-fill-color:#f2d797!important}\n#mmd-model-welcome-v2 .mw2-brand-subtitle{display:block;margin-top:7px;font:500 9px/1.2 'LINE Seed Sans TH',sans-serif;letter-spacing:.34em;color:#f0ddd1!important;-webkit-text-fill-color:#f0ddd1!important}\n#mmd-model-welcome-v2[data-lane=private] .mw2-brand-subtitle{color:#d9bc7d!important;-webkit-text-fill-color:#d9bc7d!important}\n#mmd-model-welcome-v2 .mw2-shell{width:min(100%,720px);margin:0 auto;padding:19px 27px max(32px,env(safe-area-inset-bottom));}\n#mmd-model-welcome-v2 .mw2-copy:before{content:'';display:block;width:32px;height:2px;background:var(--accent);margin:0 0 18px}\n#mmd-model-welcome-v2 .mw2-eyebrow{margin:0 0 20px;font-size:13px;line-height:1.45;color:var(--accent)!important;-webkit-text-fill-color:var(--accent)!important}\n#mmd-model-welcome-v2 h1{margin:0;max-width:580px;font:500 31px/1.32 'LINE Seed Sans TH','Noto Sans Thai',sans-serif;letter-spacing:-.025em;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;white-space:normal;overflow-wrap:break-word}\n#mmd-model-welcome-v2 .mw2-title-accent{color:var(--accent)!important;-webkit-text-fill-color:var(--accent)!important}\n#mmd-model-welcome-v2 .mw2-body{margin-top:24px;display:grid;gap:16px}\n#mmd-model-welcome-v2 .mw2-body p{margin:0;font:400 13.5px/1.62 'LINE Seed Sans TH','Noto Sans Thai',sans-serif;color:var(--body)!important;-webkit-text-fill-color:var(--body)!important}\n#mmd-model-welcome-v2 .mw2-signature{margin:17px 0 0;font-size:13px;font-weight:600;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important}\n#mmd-model-welcome-v2 .mw2-actions{margin-top:28px;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--accent),transparent 65%)}\n#mmd-model-welcome-v2 .mw2-verify{width:202px;min-height:48px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;padding:0 23px;background:var(--button);color:var(--button-ink)!important;-webkit-text-fill-color:var(--button-ink)!important;text-decoration:none!important;font:500 12px/1 'LINE Seed Sans TH',sans-serif;letter-spacing:.28em;box-shadow:none;transition:filter .18s,transform .18s}\n#mmd-model-welcome-v2 .mw2-verify:hover{filter:brightness(1.1);transform:translateY(-1px)}\n#mmd-model-welcome-v2 .mw2-verify:focus-visible{outline:3px solid var(--accent);outline-offset:4px}\n#mmd-model-welcome-v2 .mw2-arrow{font:400 24px/1 system-ui;letter-spacing:0}\n#mmd-model-welcome-v2 .mw2-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}\n#mmd-model-welcome-v2 .mw2-status[data-tone=error]{position:static;width:auto;height:auto;clip-path:none;white-space:normal;margin:10px 0;color:var(--accent);font-size:12px}\n@media(max-width:359px){#mmd-model-welcome-v2 .mw2-brand{left:20px}#mmd-model-welcome-v2 .mw2-shell{padding-left:20px;padding-right:20px}#mmd-model-welcome-v2 h1{font-size:27px}#mmd-model-welcome-v2 .mw2-body p{font-size:13px}}\n@media(min-width:760px){#mmd-model-welcome-v2 .mw2-hero{height:260px}#mmd-model-welcome-v2 .mw2-shell{padding:28px 40px 55px}#mmd-model-welcome-v2 .mw2-brand{left:40px;top:35px}}\n@media(prefers-reduced-motion:reduce){#mmd-model-welcome-v2 *{animation:none!important;transition:none!important}}\nbody:has(#mmd-model-welcome-v2)>:not(#mmd-model-welcome-v2){display:none!important}\nhtml:has(#mmd-model-welcome-v2),body:has(#mmd-model-welcome-v2){margin:0!important;width:100%!important;max-width:none!important;overflow-x:hidden!important}";
    document.head.appendChild(style);
  }

  function render(payload) {
    const variant = resolveWelcomeVariant(payload);
    const content = COPY[variant.entrySource];
    ensureStyle();

    let root = document.getElementById("mmd-model-welcome-v2");
    if (!root) {
      root = document.createElement("main");
      root.id = "mmd-model-welcome-v2";
      document.body.prepend(root);
    }
    root.dataset.lane = variant.lane;
    root.dataset.entrySource = variant.entrySource;
    root.innerHTML = `
      <div class="mw2-hero" aria-hidden="true">
        <div class="mw2-brand"><img class="mw2-logo" src="${variant.lane === "private" ? SIGIL_LOGO : MMD_LOGO}" alt="">
          <div><span class="mw2-brand-title">${variant.lane === "private" ? "SĪGIL" : "MY MODEL"}</span>
          <span class="mw2-brand-subtitle">${variant.lane === "private" ? "SYSTEM · PRIVATE MODEL" : "MMD PRIVÉ"}</span></div>
        </div>
      </div>
      <div class="mw2-shell">
        <section class="mw2-copy" aria-labelledby="mw2-title">
          <p class="mw2-eyebrow"></p><h1 id="mw2-title"></h1><div class="mw2-body"></div><p class="mw2-signature"></p>
        </section>
        <div class="mw2-actions">
          <a class="mw2-verify" data-model-login-v2 href="${liffTarget()}" aria-label="ENTER เข้าสู่ MY MODEL ผ่าน LINE"><span>ENTER</span><span class="mw2-arrow" aria-hidden="true">→</span></a>
          <p class="mw2-status" role="status" aria-live="polite">ใช้ LINE เพื่อเข้าสู่ Dashboard หลังอ่านข้อความจากเปอร์</p>
        </div>
      </div>`;
    root.querySelector(".mw2-eyebrow").textContent = content.eyebrow;
    const title = root.querySelector("h1");
    title.textContent = content.title;
    if (variant.entrySource === "self") {
      title.innerHTML = "สวัสดีครับ<br><span class=\"mw2-title-accent\">ยินดีที่ได้รู้จัก</span>";
    } else {
      title.innerHTML = "ยินดีต้อนรับอีกครั้ง<br><span class=\"mw2-title-accent\">และขอบคุณที่เป็น<br>พลังงานที่ดี</span>";
    }
    root.querySelector(".mw2-signature").textContent = content.signature;
    const body = root.querySelector(".mw2-body");
    content.paragraphs.forEach((value) => {
      const paragraph = document.createElement("p");
      paragraph.textContent = value;
      body.appendChild(paragraph);
    });
    return variant;
  }

  async function boot() {
    render(null);
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 4500);
    try {
      const response = await fetch(PROFILE_URL, {
        credentials: "include",
        cache: "no-store",
        headers: { accept: "application/json" },
        signal: controller.signal,
      });
      if (response.status === 401 || response.status === 403) return;
      if (!response.ok) throw new Error("profile_unavailable");
      const payload = await response.json();
      render(payload && payload.ok === true ? payload : null);
      if (payload && payload.ok === true) {
        const action = document.querySelector("#mmd-model-welcome-v2 .mw2-verify");
        action.removeAttribute("data-model-login-v2");
        action.href = DASHBOARD_URL;
        action.setAttribute("aria-label", "ENTER เข้าสู่ Dashboard");
        document.querySelector("#mmd-model-welcome-v2 .mw2-status").textContent =
          "ยืนยัน LINE แล้ว อ่านข้อความจากเปอร์ก่อน แล้วกดเข้าสู่ Dashboard ได้เลย";
      }
    } catch (error) {
      const status = document.querySelector("#mmd-model-welcome-v2 .mw2-status");
      status.dataset.tone = "error";
      status.textContent = error && error.name === "AbortError"
        ? "ตรวจสถานะใช้เวลานาน คุณยืนยันผ่าน LINE ต่อได้ หรือลองเปิดหน้านี้ใหม่"
        : "ยังตรวจสถานะไม่ได้ คุณยืนยันผ่าน LINE ต่อได้ หรือลองอีกครั้ง";
    } finally {
      clearTimeout(timeout);
    }
  }

  const api = Object.freeze({ COPY, resolveWelcomeVariant, trustedContext });
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  if (global) global.MMDModelWelcomeV2 = api;
  if (typeof document !== "undefined") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, { once: true });
    else boot();
  }
})(typeof window !== "undefined" ? window : globalThis);
</script>
