<style id="sigil-member-recovery-style">
#mmd-member-login-lvmaxx .member-recovery-entry{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px}
#sigil-member-recovery{width:min(520px,calc(100% - 32px));max-height:85dvh;overflow:auto;margin:auto;padding:28px;border:1px solid #75664f;border-radius:22px;background:#101316;font-family:inherit;box-shadow:0 30px 100px #0008}
#sigil-member-recovery::backdrop{background:#000b;backdrop-filter:blur(8px)}
#sigil-member-recovery h2{font-size:28px;line-height:1.3;margin:20px 0 12px}
#sigil-member-recovery form{display:grid;gap:14px;margin-top:20px}
#sigil-member-recovery label{display:grid;gap:6px;font-size:15px}
#sigil-member-recovery input{width:100%;min-height:48px;border:1px solid #555b5c;border-radius:10px;padding:12px;background:#1b2023;font:inherit}
#sigil-member-recovery button,#sigil-member-recovery a{min-height:48px;border-radius:10px;padding:12px 16px;font:inherit;text-decoration:none}
#sigil-member-recovery button{cursor:pointer;border:1px solid #75664f;background:#ddc59d}
#sigil-member-recovery [data-recovery-close]{background:transparent}
#sigil-member-recovery [hidden]{display:none!important}
#sigil-member-recovery :focus-visible{outline:2px solid #ddc59d;outline-offset:3px}
body:has(#sigil-member-recovery[open]){overflow:hidden}
/* Final scoped contrast protection. */
#sigil-member-recovery :is(h2,p,label,input,a),#sigil-member-recovery [data-recovery-close]{color:#f3f0e8!important;-webkit-text-fill-color:#f3f0e8!important;background-image:none!important}
#sigil-member-recovery button{color:#17191b!important;-webkit-text-fill-color:#17191b!important}
#sigil-member-recovery input::placeholder{color:#b5b4b0;opacity:1}
#sigil-member-recovery [role=status]{color:#ddc59d!important;-webkit-text-fill-color:#ddc59d!important;line-height:1.65}
</style>
<script id="sigil-member-recovery-runtime">
(()=>{'use strict';function boot(){const root=document.getElementById('mmd-member-login-lvmaxx');if(!root||document.getElementById('sigil-member-recovery'))return;
const trigger=root.querySelector('[data-mml-recovery]');if(!trigger)return;
const dialog=document.createElement('dialog');dialog.id='sigil-member-recovery';dialog.setAttribute('aria-labelledby','sigil-recovery-title');dialog.innerHTML='<button type="button" data-recovery-close>← กลับ</button><p>EXISTING MEMBERSHIP</p><h2 id="sigil-recovery-title">เชื่อมสมาชิกเดิม</h2><p>ใช้เบอร์โทรหรืออีเมลที่เคยให้ MMD ไว้ เพื่อให้เปอร์ตรวจสอบและเชื่อมสมาชิกเดิมกับ LINE ของคุณ</p><form><label>เบอร์โทร<input name="phone" type="tel" autocomplete="tel" maxlength="24" placeholder="เบอร์ที่เคยให้ MMD"></label><label>อีเมล<input name="email" type="email" autocomplete="email" maxlength="254" placeholder="อีเมลที่เคยให้ MMD"></label><p>กรอกอย่างใดอย่างหนึ่งได้ การส่งข้อมูลยังไม่เปิดสิทธิ์สมาชิก</p><button type="submit">ส่งคำขอตรวจสอบ</button></form><p role="status" aria-live="polite"></p><button type="button" data-recovery-login hidden>เชื่อมบัญชี LINE</button><a href="/member/dashboard" data-recovery-dashboard hidden>ดูสถานะสมาชิกใน SĪGIL System ↗</a>';root.append(dialog);
const form=dialog.querySelector('form'),status=dialog.querySelector('[role=status]'),login=dialog.querySelector('[data-recovery-login]'),dashboard=dialog.querySelector('[data-recovery-dashboard]'),submit=form.querySelector('[type=submit]');let busy=false,cancelled=false,generation=0,sessionReady=false,recoveryBinding='';
const DRAFT_KEY='mmd.member.recovery.draft.v2',DRAFT_TTL=10*60*1000;
function draftRead(){try{const value=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'null');if(!value||Date.now()-Number(value.createdAt||0)>DRAFT_TTL){sessionStorage.removeItem(DRAFT_KEY);return null}return value}catch(_){return null}}
function draftWrite(phone,email,lineSub,binding){try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify({phone,email,lineSub:lineSub||'',recoveryBinding:binding||'',createdAt:Date.now()}))}catch(_){} }
function draftClear(){try{sessionStorage.removeItem(DRAFT_KEY)}catch(_){} }
function lineSub(){try{return String(window.liff?.getDecodedIDToken?.()?.sub||'').trim()}catch(_){return ''}}
function stale(token){return cancelled||token!==generation}trigger.addEventListener('click',e=>{e.preventDefault();cancelled=false;busy=false;generation+=1;if(!dialog.open)dialog.showModal()});dialog.querySelector('[data-recovery-close]').addEventListener('click',()=>{cancelled=true;busy=true;generation+=1;draftClear();dialog.close()});dialog.addEventListener('cancel',()=>{cancelled=true;busy=true;generation+=1;draftClear()});dialog.addEventListener('close',()=>{if(!form.hidden){cancelled=true;busy=true;generation+=1;draftClear()}});
async function post(path,body){if(path.endsWith('/recovery')){if(!sessionReady||!recoveryBinding)throw Error();body={...body,recovery_binding:recoveryBinding}}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:controller.signal});return{response,payload:await response.json().catch(()=>null)}}finally{clearTimeout(timer)}}
async function ensureSession(token){sessionReady=false;if(!window.liff?.isLoggedIn?.()||!window.liff.getIDToken){login.hidden=false;return false}const id_token=window.liff.getIDToken();if(!id_token)throw Error();const{response,payload}=await post('/member/api/liff/start',{id_token,intent:'signup'});if(!response.ok||!payload?.ok)throw Error();recoveryBinding=String(payload.data?.recovery_binding||'');if(!recoveryBinding)throw Error();sessionReady=true;return true}
async function submitDraft(draft,token=generation){if(!draft||busy||stale(token))return false;const current=lineSub();if(draft.lineSub&&current&&draft.lineSub!==current){draftClear();status.textContent='บัญชี LINE เปลี่ยนไปจากตอนเริ่มคำขอ จึงหยุดไว้ก่อนเพื่อไม่ให้เชื่อมผิดบัญชีครับ';return false}busy=true;submit.disabled=true;login.disabled=true;dashboard.hidden=true;status.textContent='กำลังบันทึกคำขอตรวจสอบ…';try{await ensureSession(token);if(stale(token))return false;const{response,payload}=await post('/member/api/liff/recovery',{...(draft.phone?{phone:draft.phone}:{}),...(draft.email?{email:draft.email}:{})});if(stale(token))return false;if(response.status===401){if(!stale(token))draftWrite(draft.phone,draft.email,current||draft.lineSub);login.hidden=false;status.textContent='ต้องเชื่อมบัญชี LINE ก่อน ระบบจะส่งคำขอนี้ต่อให้อัตโนมัติหลังยืนยันครับ';return false}if(!response.ok||!payload?.ok)throw Error();draftClear();login.hidden=true;form.hidden=true;const data=payload.data||{},ref=data.merge_request_id?` เลขคำขอ ${data.merge_request_id}`:'';status.textContent=data.state==='already_linked'?`บัญชี LINE นี้เชื่อมข้อมูลสมาชิกแล้ว${ref} ตรวจสถานะสมาชิกและวันหมดอายุใน SĪGIL System ได้ครับ`:data.state==='review_required'?`รับคำขอแล้วครับ${ref} ระบบจะส่งให้ MMD ตรวจต่อ ยังไม่เปิดสิทธิ์สมาชิกอัตโนมัติ`:`รับคำขอแล้วครับ${ref} เปอร์จะตรวจข้อมูลเดิมก่อนเชื่อมสมาชิกและสิทธิ์ให้ ยังไม่ต้องสมัครหรือชำระซ้ำ`;dashboard.hidden=false;return true}catch{if(!stale(token))status.textContent='ยังส่งคำขอไม่สำเร็จครับ ข้อมูลยังไม่ถูกยืนยัน กรุณาลองใหม่อีกครั้ง';return false}finally{busy=false;submit.disabled=false;login.disabled=false}}
form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const token=generation,phone=form.elements.phone.value.trim(),email=form.elements.email.value.trim().toLowerCase();if(!phone&&!email){status.textContent='กรุณากรอกเบอร์โทรหรืออีเมลอย่างใดอย่างหนึ่งครับ';return}draftWrite(phone,email,lineSub());await submitDraft(draftRead(),token)});
async function loadLiff(){if(!window.liff){await new Promise((resolve,reject)=>{const sdk=document.createElement('script');sdk.src='https://static.line-scdn.net/liff/edge/2/sdk.js';sdk.onload=resolve;sdk.onerror=reject;document.head.append(sdk)})}await window.liff.init({liffId:'2010862595-yT4DCEMc'});await Promise.race([window.liff.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error()),12000))]);return window.liff}
async function connectAndResume(allowLogin){const token=generation,draft=draftRead();if(!draft||stale(token)){status.textContent='กรุณากรอกเบอร์โทรหรืออีเมลก่อนเชื่อม LINE ครับ';return}login.disabled=true;try{const liff=await loadLiff();if(stale(token))return;if(!liff.isLoggedIn()){if(!allowLogin){status.textContent='กลับจาก LINE แล้ว แต่ยังไม่พบการยืนยันบัญชี กดเชื่อม LINE เพื่อเริ่มใหม่ได้ครับ';return}if(stale(token))return;draftWrite(draft.phone,draft.email,draft.lineSub);liff.login({redirectUri:location.origin+'/member/login#existing-member'});return}const current=lineSub();if(draft.lineSub&&current&&draft.lineSub!==current){draftClear();status.textContent='บัญชี LINE เปลี่ยนไปจากตอนเริ่มคำขอ จึงหยุดไว้ก่อนเพื่อไม่ให้เชื่อมผิดบัญชีครับ';return}if(stale(token))return;const id_token=liff.getIDToken();if(!id_token)throw Error();const{response,payload}=await post('/member/api/liff/start',{id_token,intent:'signup'});if(stale(token))return;if(!response.ok||!payload?.ok)throw Error();draftWrite(draft.phone,draft.email,current);login.hidden=true;await submitDraft(draftRead(),token)}catch{if(!stale(token))status.textContent='ยังเชื่อม LINE ไม่สำเร็จครับ เปิดหน้านี้ผ่าน LINE แล้วลองใหม่ได้ โดยข้อมูลจะคงไว้ชั่วคราว'}finally{if(!stale(token))login.disabled=false}}
login.addEventListener('click',connectAndResume);
if(location.hash==='#existing-member'){dialog.showModal();login.hidden=false;if(draftRead())connectAndResume(false)}}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot,{once:true}):boot();})();
</script>
