function renderItems(items){

function budgetProvided(){return Number(v('budget_thb'))>0||['under_10000','10000_20000','20000_30000','30000_plus'].includes(filters.budget_band)}
function requestedAt(){var d=v('date'),t=v('time');return d&&t?d+'T'+t+':00+07:00':''}
async function search(){
  var q=v('model_query');
  if(mode==='search'&&!budgetProvided()){msg('SIGIL Search ต้องมี Budget','เลือกช่วงงบหรือกรอกจำนวนเงินก่อนค้นหา Model');return}
  if(scope==='private'&&!access.can_search_private_models){identity.open=true;msg('Private Model ยังเปิดไม่ได้',access.protected_model_review_required?'ส่งชื่อหรือลิงก์ไว้ใน Request ได้ แล้ว Per จะตรวจสิทธิ์เป็นราย Model':'ระบบต้องยืนยันสมาชิก Active ก่อน');return}
  clearModel();busy(searchBtn,true,'กำลังหา...');results.innerHTML='';

    var qs=new URLSearchParams({scope:scope,booking_ref:ids.booking_ref,session_id:ids.session_id,search_mode:mode});
    if(q)qs.set('q',q);if(filters.customer_lane)qs.set('customer_lane',filters.customer_lane);if(filters.private_work)qs.set('work_lane',filters.private_work);if(filters.selected_access_folder)qs.set('selected_access_folder',filters.selected_access_folder);if(v('budget_thb'))qs.set('budget_thb',v('budget_thb'));if(filters.budget_band)qs.set('budget_band',filters.budget_band);if(v('spec'))qs.set('spec',v('spec'));if(v('telegram_link'))qs.set('telegram_reference',v('telegram_link'));if(requestedAt())qs.set('requested_at',requestedAt());
    var d=await req('/sigil/api/models/search?'+qs.toString());
    if(d.validation_error){msg('ตรวจข้อมูลก่อนค้นหา',(d.errors||[]).join(', '));return}
    if(d.blocked){identity.open=true;msg('ยัง Browse กลุ่มนี้ไม่ได้',d.reason==='protected_models_require_per_review'?'ส่งชื่อหรือลิงก์ไว้ได้ โดยระบบจะไม่เปิดเผย Profile หรือ Rate จนกว่า Per ตรวจ':'ระบบต้องยืนยันสิทธิ์ก่อน');return}
    if(scope==='private'&&!(d.visibility_enforced===true&&Array.isArray(d.allowed_model_folders))){results.innerHTML='<div class="skb26-empty"><strong>ยังเปิดผลค้นหาไม่ได้</strong><span>ระบบไม่พบ entitlement projection ที่ยืนยันได้</span></div>';return}
    var items=Array.isArray(d.items)?d.items:[];
    if(!items.length){results.innerHTML='<div class="skb26-empty"><strong>ยังไม่พบ Model ที่ตรงทั้งหมด</strong><span>ส่ง Search Request ได้ แล้ว HYPE จะเตรียมให้ Per ตรวจต่อ</span></div>';return}
    renderItems(items)
  }catch(e){results.innerHTML='<div class="skb26-empty"><strong>ค้นหายังไม่สำเร็จ</strong><span>Spec / Budget / ชื่อ / Telegram link ยังส่งเป็น Request ให้ Per ตรวจได้</span></div>'}
  finally{busy(searchBtn,false,'กำลังหา...')}
}

  try{

    ids.booking_ref=d.booking_ref||ids.booking_ref;ids.session_id=d.session_id||ids.session_id;

    submit.textContent='ส่ง Request แล้ว';submit.disabled=true
  }catch(err){msg('ยังส่งไม่สำเร็จ',String(err&&err.message||'กรุณาลองอีกครั้ง หรือกลับไป MY MMD เพื่อเริ่มใหม่'))}
