ss={member_status:'unknown',membership_tier:'',access_scope:'public_only',can_search_private_models:false,allowed_model_folders:[]},ids={booking_ref:'',session_id:''},filters={customer_lane:'',private_work:'',budget_band:'estimate',selected_access_folder:''},selected=null;var selectedMedia=document.createElement('div');selectedMedia.className='skb26-selected-media skb26-hidden';selectedMedia.setAttribute('aria-live','polite');selectedBox.after(selectedMedia);var back=root.querySelector('.skb26-back');if(params.get('t')){var bu=new URL(back.getAttribute('href'),location.origin);bu.searchParams.set('t',params.get('t'));back.href=bu.pathname+bu.search}var dateField=form.elements.date,now=new Date(),local=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);dateField.min=local;function v(n){return String(form.elements[n]&&form.elements[n].value||'').trim()}function esc(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}function token(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}function busy(btn,on,txt){if(!btn)return;if(!btn.dataset.label)btn.dataset.label=btn.textContent;btn.disabled=on;if(txt)btn.textContent=on?txt:btn.dataset.label}function msg(title,text){result.classList.add('is-show');result.innerHTML='<strong>'+esc(title)+'</strong>'+esc(text||'')}async function req(path,opt){var r=await fetch(API+path,opt||{}),t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok)throw new Error(d.error||d.message||('HTTP '+r.status));return d}function allowedForTier(t){t=token(t);if(t==='standard'||t.includes('standard'))return['standard'];if(t==='premium'||t.includes('premium'))return['standard','premium'];if(t==='vip'||t==='svip'||t==='black_card'||t==='blackcard'||t.includes('svip')||t.includes('black'))return['standard','premium','vip','exclusive'];return[]}function tierLabel(t){t=token(t);if(t==='black_card'||t==='blackcard')return'BLACK CARD';
