<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="mmd-sigil-pay-v19">
#sigil-pay-v19{--bg:#0d0b0a;--panel:rgba(18,15,13,.9);--panel2:#171310;--line:rgba(255,241,218,.14);--line-strong:rgba(227,189,124,.34);--text:#fff8ee;--body:#eee2d4;--muted:#bdae9f;--gold:#e3bd7c;--gold2:#b88948;--ok:#a5c49e;--danger:#e09a93;min-height:100vh;background:radial-gradient(circle at 18% -8%,rgba(227,189,124,.08),transparent 34%),linear-gradient(180deg,#0d0b0a,#090807 72%);color:var(--text);font-family:"LINE Seed Sans TH","Noto Sans Thai",system-ui,-apple-system,sans-serif;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
#sigil-pay-v19 *{box-sizing:border-box}
#sigil-pay-v19 a{color:inherit;text-decoration:none}
#sigil-pay-v19 button,#sigil-pay-v19 input,#sigil-pay-v19 textarea{font:inherit}
#sigil-pay-v19 button{color:inherit}
#sigil-pay-v19 [hidden]{display:none!important}
#sigil-pay-v19 .sp19__shell{width:min(100%,1180px);margin:0 auto}
#sigil-pay-v19 .sp19__top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 2px 14px}
#sigil-pay-v19 .sp19__brand{display:flex;align-items:center;gap:10px;min-width:0}
#sigil-pay-v19 .sp19__brand>span:last-child{display:grid;min-width:0}
#sigil-pay-v19 .sp19__brand strong{font-size:14px;letter-spacing:.18em}
#sigil-pay-v19 .sp19__brand small{margin-top:1px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sigil-pay-v19 .sp19__mark{position:relative;width:32px;height:32px;flex:0 0 32px;border:1px solid rgba(227,189,124,.5);border-radius:50%}
#sigil-pay-v19 .sp19__mark i,#sigil-pay-v19 .sp19__mark b{position:absolute;left:50%;top:50%;display:block;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
#sigil-pay-v19 .sp19__mark i{width:12px;height:1px}
#sigil-pay-v19 .sp19__mark b{width:1px;height:12px}
#sigil-pay-v19 .sp19__private{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px;letter-spacing:.09em}
#sigil-pay-v19 .sp19__private i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(227,189,124,.5)}
#sigil-pay-v19 .sp19__state{display:flex;gap:12px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);min-height:82px}
#sigil-pay-v19 .sp19__state strong{display:block;font-size:14px}
#sigil-pay-v19 .sp19__state p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
#sigil-pay-v19 .sp19__state--error{border-color:rgba(224,154,147,.3)}
#sigil-pay-v19 .sp19__state-icon{display:grid;place-items:center;width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:rgba(224,154,147,.12);color:var(--danger);font-weight:800}
#sigil-pay-v19 .sp19__spinner,#sigil-pay-v19 .sp19__mini-spinner{display:block;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:sp19-spin .75s linear infinite}
#sigil-pay-v19 .sp19__spinner{width:26px;height:26px;flex:0 0 26px}
#sigil-pay-v19 .sp19__mini-spinner{width:15px;height:15px}
@keyframes sp19-spin{to{transform:rotate(360deg)}}
#sigil-pay-v19 .sp19__state-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#sigil-pay-v19 .sp19__content{display:grid;gap:14px}
#sigil-pay-v19 .sp19__hero{position:relative;overflow:hidden;min-height:430px;border:1px solid var(--line);border-radius:24px;background:#100d0b}
#sigil-pay-v19 .sp19__hero-media,#sigil-pay-v19 .sp19__hero-shade{position:absolute;inset:0}
#sigil-pay-v19 .sp19__hero-media img{width:100%;height:100%;object-fit:cover;object-position:67% center;filter:saturate(.72) brightness(.62) contrast(1.03)}
#sigil-pay-v19 .sp19__hero-shade{background:linear-gradient(180deg,rgba(7,6,5,.1) 5%,rgba(7,6,5,.28) 35%,rgba(7,6,5,.96) 82%,#0d0b0a 100%),linear-gradient(90deg,rgba(7,6,5,.9) 0%,rgba(7,6,5,.3) 72%,rgba(7,6,5,.1) 100%)}
#sigil-pay-v19 .sp19__hero-copy{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;min-height:430px;padding:22px}
#sigil-pay-v19 .sp19__hero-topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
#sigil-pay-v19 .sp19__eyebrow,#sigil-pay-v19 .sp19__kicker{margin:0;color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.13em}
#sigil-pay-v19 .sp19__status-pill,#sigil-pay-v19 .sp19__truth{padding:6px 9px;border:1px solid var(--line-strong);border-radius:999px;background:rgba(227,189,124,.07);color:var(--gold);font-size:9px;font-weight:700;white-space:nowrap}
#sigil-pay-v19 .sp19__hero h1{margin:11px 0 0;font-size:clamp(31px,9vw,48px);line-height:1.03;letter-spacing:-.045em}
#sigil-pay-v19 .sp19__hero-lead{max-width:520px;margin:9px 0 0;color:var(--body);font-size:13px;line-height:1.7}
#sigil-pay-v19 .sp19__due{display:grid;gap:2px;margin-top:22px}
#sigil-pay-v19 .sp19__due>span,#sigil-pay-v19 .sp19__due>small{color:var(--muted);font-size:10px}
#sigil-pay-v19 .sp19__due strong{display:flex;align-items:flex-start;gap:5px;line-height:1}
#sigil-pay-v19 .sp19__due i{margin-top:6px;color:var(--gold);font-size:18px;font-style:normal}
#sigil-pay-v19 .sp19__due b{font-size:clamp(46px,14vw,72px);letter-spacing:-.06em}
#sigil-pay-v19 .sp19__hero-ref{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
#sigil-pay-v19 .sp19__hero-ref span{max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.28);color:var(--muted);font-size:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sigil-pay-v19 .sp19__layout{display:grid;gap:14px}
#sigil-pay-v19 .sp19__main,#sigil-pay-v19 .sp19__aside{display:grid;gap:14px;align-content:start}
#sigil-pay-v19 .sp19__card,#sigil-pay-v19 .sp19__side-card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(24,20,17,.92),rgba(14,12,10,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.015)}
#sigil-pay-v19 .sp19__card{padding:18px}
#sigil-pay-v19 .sp19__side-card{padding:17px}
#sigil-pay-v19 .sp19__section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#sigil-pay-v19 .sp19__section-head h2,#sigil-pay-v19 .sp19__side-card h2{margin:5px 0 0;font-size:21px;line-height:1.25;letter-spacing:-.025em}
#sigil-pay-v19 .sp19__body,#sigil-pay-v19 .sp19__side-card>p:not(.sp19__kicker){margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
#sigil-pay-v19 .sp19__model{display:flex;gap:12px;align-items:center;margin-top:17px;padding:13px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.018)}
#sigil-pay-v19 .sp19__avatar{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:linear-gradient(145deg,var(--gold),var(--gold2));color:#16110c;font-size:17px;font-weight:800}
#sigil-pay-v19 .sp19__model small{display:block;color:var(--muted);font-size:8px;letter-spacing:.12em}
#sigil-pay-v19 .sp19__model strong{display:block;margin-top:2px;font-size:17px}
#sigil-pay-v19 .sp19__model p{margin:2px 0 0;color:var(--muted);font-size:10px}
#sigil-pay-v19 .sp19__facts{margin:14px 0 0}
#sigil-pay-v19 .sp19__facts>div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid rgba(255,241,218,.09)}
#sigil-pay-v19 .sp19__facts dt{color:var(--muted);font-size:10px}
#sigil-pay-v19 .sp19__facts dd{margin:0;font-size:12px;font-weight:600}
#sigil-pay-v19 .sp19__facts dd a{display:block;margin-top:3px;color:var(--gold);font-size:10px}
#sigil-pay-v19 .sp19__pricing{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#sigil-pay-v19 .sp19__pricing>div{padding:11px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.02)}
#sigil-pay-v19 .sp19__pricing span,#sigil-pay-v19 .sp19__pricing del{display:block;color:var(--muted);font-size:9px}
#sigil-pay-v19 .sp19__pricing strong{display:block;margin-top:3px;font-size:13px}
#sigil-pay-v19 .sp19__gold{color:var(--gold)}
#sigil-pay-v19 .sp19__method-state{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:11px}
#sigil-pay-v19 .sp19__tabs{display:grid;gap:8px;margin-top:14px}
#sigil-pay-v19 .sp19__tab{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-areas:"num title" "num sub";gap:1px 10px;text-align:left;width:100%;padding:12px 42px 12px 12px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.02);cursor:pointer}
#sigil-pay-v19 .sp19__tab:after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px}
#sigil-pay-v19 .sp19__tab>span{grid-area:num;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:rgba(227,189,124,.09);color:var(--gold);font-size:9px;font-weight:800}
#sigil-pay-v19 .sp19__tab strong{grid-area:title;font-size:12px}
#sigil-pay-v19 .sp19__tab small{grid-area:sub;color:var(--muted);font-size:9px}
#sigil-pay-v19 .sp19__tab.is-active{border-color:var(--line-strong);background:rgba(227,189,124,.07)}
#sigil-pay-v19 .sp19__tab.is-active:after{color:var(--gold);transform:translateY(-50%) rotate(90deg)}
#sigil-pay-v19 .sp19__panel{margin-top:9px;padding:15px;border:1px solid var(--line-strong);border-radius:17px;background:rgba(227,189,124,.035)}
#sigil-pay-v19 .sp19__panel-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#sigil-pay-v19 .sp19__panel-title small{display:block;color:var(--gold);font-size:8px;font-weight:800;letter-spacing:.1em}
#sigil-pay-v19 .sp19__panel-title strong{display:block;margin-top:3px;font-size:13px}
#sigil-pay-v19 .sp19__panel-title>span{padding:5px 8px;border:1px solid var(--line-strong);border-radius:999px;color:var(--gold);font-size:8px;font-weight:800}
#sigil-pay-v19 .sp19__qr-wrap{display:grid;place-items:center;margin-top:14px}
#sigil-pay-v19 .sp19__qr-wrap img{width:min(74vw,240px);aspect-ratio:1;object-fit:contain;padding:10px;border-radius:18px;background:#fff}
#sigil-pay-v19 .sp19__qr-fallback{display:grid;gap:4px;text-align:center;width:100%;padding:18px;border:1px dashed var(--line-strong);border-radius:15px}
#sigil-pay-v19 .sp19__qr-fallback small{color:var(--muted);font-size:9px}
#sigil-pay-v19 .sp19__qr-fallback strong{font-size:22px;letter-spacing:.03em}
#sigil-pay-v19 .sp19__hint{margin:11px 0 0;color:var(--muted);font-size:10px;line-height:1.55}
#sigil-pay-v19 .sp19__bank{display:grid;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#sigil-pay-v19 .sp19__bank>div:not(.sp19__bank-actions){display:grid;grid-template-columns:92px minmax(0,1fr);gap:9px;padding:11px;border-bottom:1px solid rgba(255,241,218,.08)}
#sigil-pay-v19 .sp19__bank span{color:var(--muted);font-size:9px}
#sigil-pay-v19 .sp19__bank strong{font-size:12px;word-break:break-word}
#sigil-pay-v19 .sp19__bank-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
#sigil-pay-v19 .sp19__card-fee{display:grid;margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#sigil-pay-v19 .sp19__card-fee>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px;border-bottom:1px solid rgba(255,241,218,.08)}
#sigil-pay-v19 .sp19__card-fee>div:last-child{border-bottom:0;background:rgba(227,189,124,.05)}
#sigil-pay-v19 .sp19__card-fee span{color:var(--muted);font-size:9px}
#sigil-pay-v19 .sp19__card-fee strong{font-size:12px}
#sigil-pay-v19 .sp19__card-fee>div:last-child strong{font-size:17px}
#sigil-pay-v19 .sp19__btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:0 13px;border:1px solid transparent;border-radius:12px;background:none;cursor:pointer;font-size:11px;font-weight:700;text-align:center}
#sigil-pay-v19 .sp19__btn--ghost{border-color:var(--line);background:rgba(255,255,255,.025);color:var(--text)}
#sigil-pay-v19 .sp19__btn--gold{background:linear-gradient(135deg,#efd58e,#c39149);color:#17110b}
#sigil-pay-v19 .sp19__btn--wide{width:100%;margin-top:12px}
#sigil-pay-v19 .sp19__btn:disabled{opacity:.38;cursor:not-allowed}
#sigil-pay-v19 .sp19__upload{display:grid;place-items:center;text-align:center;gap:4px;margin-top:15px;padding:22px 12px;border:1px dashed rgba(227,189,124,.38);border-radius:16px;background:rgba(227,189,124,.035);cursor:pointer}
#sigil-pay-v19 .sp19__upload input{display:none}
#sigil-pay-v19 .sp19__upload>span{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(227,189,124,.12);color:var(--gold);font-size:21px}
#sigil-pay-v19 .sp19__upload strong{font-size:13px}
#sigil-pay-v19 .sp19__upload small{color:var(--muted);font-size:9px}
#sigil-pay-v19 .sp19__file-card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:11px;padding:10px;border:1px solid var(--line);border-radius:14px}
#sigil-pay-v19 .sp19__preview{display:grid;place-items:center;width:48px;height:48px;border-radius:10px;background:#15120f;color:var(--muted);font-size:9px;overflow:hidden}
#sigil-pay-v19 .sp19__preview img{width:100%;height:100%;object-fit:cover}
#sigil-pay-v19 .sp19__file-card>div:nth-child(2){min-width:0}
#sigil-pay-v19 .sp19__file-card strong,#sigil-pay-v19 .sp19__file-card small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sigil-pay-v19 .sp19__file-card strong{font-size:10px}
#sigil-pay-v19 .sp19__file-card small{margin-top:2px;color:var(--muted);font-size:8px}
#sigil-pay-v19 .sp19__file-card button{border:0;background:none;color:var(--gold);font-size:10px;cursor:pointer}
#sigil-pay-v19 .sp19__field{display:block;margin-top:13px}
#sigil-pay-v19 .sp19__field>span{font-size:10px}
#sigil-pay-v19 .sp19__field em{color:var(--muted);font-style:normal}
#sigil-pay-v19 .sp19__field textarea{width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b0908;color:var(--text);resize:vertical;outline:none}
#sigil-pay-v19 .sp19__field textarea:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(227,189,124,.07)}
#sigil-pay-v19 .sp19__consent{display:flex;gap:9px;align-items:flex-start;margin-top:12px;color:var(--muted);font-size:9px;line-height:1.55}
#sigil-pay-v19 .sp19__consent input{margin-top:2px}
#sigil-pay-v19 .sp19__submit-status{min-height:16px;margin:8px 0 0;color:var(--muted);font-size:9px}
#sigil-pay-v19 .sp19__proof-state{margin-top:14px;padding:14px;border:1px solid var(--line-strong);border-radius:14px;background:rgba(227,189,124,.045);color:var(--body);font-size:11px;line-height:1.65}
#sigil-pay-v19 .sp19__side-card h2{font-size:18px}
#sigil-pay-v19 .sp19__side-card--help{background:linear-gradient(145deg,rgba(227,189,124,.08),rgba(15,12,10,.96))}
#sigil-pay-v19 .sp19__text-link{display:inline-block;margin-top:10px;color:var(--gold);font-size:11px;font-weight:700}
#sigil-pay-v19 .sp19__footer{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;color:var(--muted);font-size:8px}
#sigil-pay-v19 .sp19__footer strong{color:var(--gold);letter-spacing:.16em}
#sigil-pay-v19 .sp19__sticky{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:25;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 9px 9px 13px;border:1px solid rgba(227,189,124,.24);border-radius:17px;background:rgba(10,8,7,.94);backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.42)}
#sigil-pay-v19 .sp19__sticky small,#sigil-pay-v19 .sp19__sticky strong{display:block}
#sigil-pay-v19 .sp19__sticky small{color:var(--muted);font-size:8px}
#sigil-pay-v19 .sp19__sticky strong{margin-top:1px;font-size:15px}
#sigil-pay-v19 :is(button,a,input,textarea):focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(min-width:700px){
  #sigil-pay-v19{padding:22px 20px 46px}
  #sigil-pay-v19 .sp19__hero{min-height:500px}
  #sigil-pay-v19 .sp19__hero-copy{min-height:500px;padding:34px}
  #sigil-pay-v19 .sp19__hero-media img{object-position:72% center}
  #sigil-pay-v19 .sp19__hero-shade{background:linear-gradient(90deg,rgba(7,6,5,.95) 0%,rgba(7,6,5,.74) 40%,rgba(7,6,5,.18) 78%),linear-gradient(180deg,rgba(7,6,5,.05),rgba(7,6,5,.82) 100%)}
  #sigil-pay-v19 .sp19__hero-copy{width:64%}
  #sigil-pay-v19 .sp19__tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  #sigil-pay-v19 .sp19__tab{grid-template-columns:1fr;grid-template-areas:"num" "title" "sub";padding:13px}
  #sigil-pay-v19 .sp19__tab:after{display:none}
  #sigil-pay-v19 .sp19__pricing{grid-template-columns:repeat(3,minmax(0,1fr))}
  #sigil-pay-v19 .sp19__sticky{left:50%;right:auto;width:min(620px,calc(100% - 32px));transform:translateX(-50%)}
}
@media(min-width:960px){
  #sigil-pay-v19 .sp19__layout{grid-template-columns:minmax(0,1fr) 300px}
  #sigil-pay-v19 .sp19__card{padding:22px}
  #sigil-pay-v19 .sp19__aside{position:sticky;top:18px}
  #sigil-pay-v19 .sp19__sticky{display:none!important}
}
@media(max-width:360px){
  #sigil-pay-v19 .sp19__pricing{grid-template-columns:1fr}
  #sigil-pay-v19 .sp19__facts>div{grid-template-columns:68px minmax(0,1fr)}
  #sigil-pay-v19 .sp19__bank>div:not(.sp19__bank-actions){grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  #sigil-pay-v19 *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
/* FINAL MMD CONTRAST SAFETY LAYER */
#sigil-pay-v19 :is(h1,h2,.sp19__model strong,.sp19__due b,.sp19__status-pill,.sp19__tab strong,.sp19__panel-title strong,.sp19__btn){
  color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;background-image:none
}
#sigil-pay-v19 .sp19__btn--gold{color:#17110b!important;-webkit-text-fill-color:#17110b!important}
#sigil-pay-v19 :is(.sp19__eyebrow,.sp19__kicker,.sp19__gold,.sp19__text-link,.sp19__truth,.sp19__panel-title>span){
  color:var(--gold)!important;-webkit-text-fill-color:var(--gold)!important
}
#sigil-pay-v19 :is(.sp19__body,.sp19__hint,.sp19__side-card>p:not(.sp19__kicker),.sp19__hero-lead){color:var(--body)!important;-webkit-text-fill-color:var(--body)!important}
#sigil-pay-v19 :is(.sp19__brand small,.sp19__private,.sp19__facts dt,.sp19__pricing span,.sp19__pricing del,.sp19__tab small,.sp19__submit-status,.sp19__sticky small){color:var(--muted)!important;-webkit-text-fill-color:var(--muted)!important}
</style>
