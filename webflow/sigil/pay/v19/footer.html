<script id="mmd-sigil-pay-v19-runtime">
(function(){
  "use strict";
  var root=document.getElementById("sigil-pay-v19");
  if(!root||root.dataset.ready==="1")return;
  root.dataset.ready="1";

  var $=function(s){return root.querySelector(s);};
  var $$=function(s){return Array.from(root.querySelectorAll(s));};
  var clean=function(v){return String(v==null?"":v).trim();};
  var number=function(v){var n=Number(v);return Number.isFinite(n)?n:null;};
  var money=function(v){var n=number(v);return n==null?"—":"฿"+n.toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2});};
  var safeHttps=function(v){try{var u=new URL(clean(v));return u.protocol==="https:"?u.toString():"";}catch(e){return"";}};
  var params=new URLSearchParams(location.search);
  var API=clean(root.dataset.apiBase).replace(/\/+$/,"");
  var DETAILS=API+clean(root.dataset.detailsPath);
  var INSTRUCTIONS=API+clean(root.dataset.instructionsPath);
  var PROOF=API+clean(root.dataset.proofPath);
  var token=resolveToken();
  var payment=null;
  var instructions=null;
  var selectedMethod="";
  var proofFile=null;
  var objectUrl="";

  function resolveToken(){
    var direct=params.get("t");
    if(direct)return direct;
    var state=params.get("liff.state");
    if(!state)return"";
    try{return new URLSearchParams(decodeURIComponent(state).replace(/^\?/,"")).get("t")||"";}catch(e){return"";}
  }

  function canonicalize(){
    if(params.get("demo")==="1")return false;
    var host=String(location.hostname||"").toLowerCase();
    if(!token||!host.endsWith(".webflow.io"))return false;
    var origin=clean(root.dataset.canonicalOrigin)||"https://mmdbkk.com";
    var target=origin+location.pathname+location.search+location.hash;
    location.replace(target);
    return true;
  }

  function text(sel,value,fallback){
    var el=$(sel);
    if(!el)return;
    var v=value==null||clean(value)===""?(fallback==null?"—":fallback):String(value);
    el.textContent=v;
  }

  function showError(title,message){
    $("[data-sp19-loading]").hidden=true;
    $("[data-sp19-content]").hidden=true;
    $("[data-sp19-sticky]").hidden=true;
    var box=$("[data-sp19-error]");
    box.hidden=false;
    text("[data-sp19-error-title]",title);
    text("[data-sp19-error-message]",message);
    root.removeAttribute("aria-busy");
  }

  function stageLabel(stage){
    var s=clean(stage).toLowerCase();
    return ({deposit:"มัดจำ",balance:"ยอดคงเหลือ",final:"ยอดคงเหลือ",full:"ชำระเต็มจำนวน",adjustment:"ยอดปรับเพิ่มเติม",membership:"Membership"})[s]||"ยอดที่ต้องชำระ";
  }

  function statusMeta(data){
    var p=data&&data.payment||{};
    if(p.verified)return{label:"ยืนยันยอดแล้ว",copy:"MMD ยืนยันยอดนี้เรียบร้อยแล้วครับ ดูขั้นตอนต่อได้จาก My MMD",lock:true};
    if(p.proof_received)return{label:"กำลังตรวจสอบ",copy:"MMD ได้รับหลักฐานแล้วครับ ตอนนี้กำลังตรวจยอด ไม่ต้องส่งซ้ำ",lock:true};
    if(p.accepting_payment===false)return{label:"รายการนี้ยังชำระไม่ได้",copy:"ช่องทางชำระของรายการนี้ถูกปิดไว้ครับ ติดต่อ MMD เพื่อเช็กสถานะล่าสุด",lock:true};
    var raw=clean(data&&data.payment_status).toLowerCase();
    if(["verified","paid","approved","completed"].includes(raw))return{label:"ยืนยันยอดแล้ว",copy:"MMD ยืนยันยอดนี้เรียบร้อยแล้วครับ",lock:true};
    return{label:"รอการชำระเงิน",copy:"เมื่อ MMD ตรวจยอดแล้ว สถานะจะอัปเดตให้เองครับ",lock:false};
  }

  function formatDate(v){
    var raw=clean(v);
    if(!raw)return"—";
    var d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(raw)?raw+"T12:00:00+07:00":raw);
    if(Number.isNaN(d.getTime()))return raw;
    try{return new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Bangkok"}).format(d);}catch(e){return raw;}
  }

  function formatTime(v){
    var raw=clean(v);
    if(!raw)return"";
    var m=raw.match(/(?:T|\s)(\d{2}:\d{2})/);
    if(m)return m[1];
    var m2=raw.match(/^(\d{1,2}:\d{2})/);
    return m2?m2[1]:raw;
  }

  function serviceLabel(v){
    var raw=clean(v);
    if(!raw)return"Private Session";
    return raw.split(/[:|]/).map(function(part){
      var p=clean(part).replace(/[_-]+/g," ");
      var low=p.toLowerCase();
      if(low==="pn")return"PN";
      if(low==="vip")return"VIP";
      if(low==="svip")return"SVIP";
      return p.charAt(0).toUpperCase()+p.slice(1);
    }).filter(Boolean).join(" · ");
  }

  async function fetchJson(url,options){
    var controller=new AbortController();
    var timer=setTimeout(function(){controller.abort();},12000);
    try{
      var res=await fetch(url,Object.assign({cache:"no-store",credentials:"omit",signal:controller.signal},options||{}));
      var data=await res.json().catch(function(){return{};});
      if(!res.ok)throw new Error(clean(data.error||data.message)||("HTTP "+res.status));
      return data;
    }finally{clearTimeout(timer);}
  }

  function renderDetails(data){
    payment=data;
    var p=data.payment||{};
    var pricing=data.pricing||{};
    var meta=statusMeta(data);
    var due=number(p.amount_due_thb);
    var net=number(pricing.net_price_thb)!=null?number(pricing.net_price_thb):number(data.amount_thb);
    var full=number(pricing.full_price_thb);
    var discount=number(pricing.discount_thb);
    var balance=number(pricing.balance_thb);
    var stage=clean(p.stage||data.payment_type);

    text("[data-sp19-status]",meta.label);
    text("[data-sp19-side-status]",meta.label);
    text("[data-sp19-side-copy]",meta.copy);
    text("[data-sp19-amount]",due==null?"—":due.toLocaleString("th-TH",{maximumFractionDigits:2}));
    text("[data-sp19-due]",money(due));
    text("[data-sp19-sticky-amount]",money(due));
    text("[data-sp19-stage]",stageLabel(stage));
    text("[data-sp19-sticky-stage]",stageLabel(stage));
    text("[data-sp19-payment-ref]",data.payment_ref||"—");
    text("[data-sp19-session-id]",data.session_id||"—");
    text("[data-sp19-client]",data.client_name||"—");
    text("[data-sp19-model]",data.model_name||"—");
    text("[data-sp19-model-initial]",clean(data.model_name||"M").charAt(0).toUpperCase()||"M");
    text("[data-sp19-service]",serviceLabel(data.job_type));
    text("[data-sp19-date]",formatDate(data.job_date));
    var start=formatTime(data.start_time),end=formatTime(data.end_time);
    text("[data-sp19-time]",[start,end].filter(Boolean).join(" – ")||"—");
    text("[data-sp19-location]",data.location_name||"—");
    text("[data-sp19-net]",money(net));

    var map=$("[data-sp19-map]");
    var mapUrl=safeHttps(data.google_map_url);
    if(map){map.hidden=!mapUrl;if(mapUrl)map.href=mapUrl;}

    var fullRow=$("[data-sp19-full-row]");
    var discountRow=$("[data-sp19-discount-row]");
    var hasDiscount=full!=null&&net!=null&&full>net;
    if(fullRow){fullRow.hidden=!hasDiscount;if(hasDiscount)text("[data-sp19-full]",money(full));}
    if(discountRow){
      discountRow.hidden=!hasDiscount;
      if(hasDiscount){
        var pct=number(pricing.discount_percent);
        text("[data-sp19-discount]",discount!=null?("- "+money(discount)+(pct!=null?" · "+pct+"%":"")):(pct!=null?pct+"%":"ส่วนลด"));
      }
    }

    var balanceRow=$("[data-sp19-balance-row]");
    var showBalance=balance!=null&&balance>=0&&["deposit"].includes(stage.toLowerCase());
    if(balanceRow){balanceRow.hidden=!showBalance;if(showBalance)text("[data-sp19-balance]",money(balance));}

    syncProofLock(meta);
    $("[data-sp19-loading]").hidden=true;
    $("[data-sp19-error]").hidden=true;
    $("[data-sp19-content]").hidden=false;
    $("[data-sp19-sticky]").hidden=false;
    root.removeAttribute("aria-busy");
  }

  function syncProofLock(meta){
    var form=$("[data-sp19-proof-form]");
    var state=$("[data-sp19-proof-state]");
    if(!form||!state)return;
    if(meta.lock){
      form.hidden=true;
      state.hidden=false;
      state.textContent=meta.copy;
    }else{
      form.hidden=false;
      state.hidden=true;
      state.textContent="";
    }
  }

  function methodButton(name){return root.querySelector('[data-sp19-method="'+name+'"]');}
  function methodPanel(name){return root.querySelector('[data-sp19-panel="'+name+'"]');}

  function setMethod(name){
    selectedMethod=name;
    $$("[data-sp19-method]").forEach(function(btn){
      var on=btn.dataset.sp19Method===name;
      btn.classList.toggle("is-active",on);
      btn.setAttribute("aria-selected",on?"true":"false");
    });
    $$("[data-sp19-panel]").forEach(function(panel){panel.hidden=panel.dataset.sp19Panel!==name;});
    var sticky=$("[data-sp19-sticky-action]");
    if(sticky)sticky.textContent=name==="paypal_card"?"ชำระด้วยบัตร":"ชำระ / ส่งสลิป";
  }

  function setMethodVisible(name,visible){
    var btn=methodButton(name);
    if(btn)btn.hidden=!visible;
  }

  function methodUnavailable(message){
    var state=$("[data-sp19-method-state]");
    if(state){
      state.hidden=false;
      state.innerHTML="";
      var span=document.createElement("span");
      span.textContent=message||"ช่องทางชำระเงินยังไม่พร้อม กรุณาติดต่อ MMD";
      state.appendChild(span);
    }
    $("[data-sp19-tabs]").hidden=true;
    $$("[data-sp19-panel]").forEach(function(panel){panel.hidden=true;});
  }

  function renderInstructions(data){
    instructions=data.instructions||{};
    var pp=instructions.promptpay||{};
    var bank=instructions.bank_transfer||{};
    var card=instructions.paypal_card||{};
    var ppOn=pp.enabled===true;
    var bankOn=bank.enabled===true&&clean(bank.account_number)!=="";
    var cardUrl=card.enabled===true?safeHttps(card.url):"";
    var cardOn=!!cardUrl;

    setMethodVisible("promptpay",ppOn);
    setMethodVisible("bank_transfer",bankOn);
    setMethodVisible("paypal_card",cardOn);

    var qr=$("[data-sp19-qr]");
    var qrFallback=$("[data-sp19-qr-fallback]");
    var qrUrl=ppOn?safeHttps(pp.qr_url):"";
    if(qr){qr.hidden=!qrUrl;if(qrUrl)qr.src=qrUrl;}
    if(qrFallback){qrFallback.hidden=!!qrUrl||!ppOn;}
    text("[data-sp19-promptpay-ref]",pp.display_ref||"—");

    text("[data-sp19-bank-name]",bank.bank_name_th||bank.bank_name_en||bank.provider||"โอนธนาคาร");
    text("[data-sp19-account-name]",bank.account_name_th||bank.account_name_en||"MMD Privé");

    text("[data-sp19-card-rate]","+"+(number(card.fee_percent)!=null?number(card.fee_percent):4)+"%");
    text("[data-sp19-card-base]",money(card.service_amount_thb!=null?card.service_amount_thb:data.amount_due_thb));
    text("[data-sp19-card-fee]",card.fee_thb!=null?("+ "+money(card.fee_thb)):"—");
    text("[data-sp19-card-total]",money(card.amount_due_thb));
    var paypal=$("[data-sp19-paypal]");
    if(paypal&&cardUrl)paypal.href=cardUrl;

    var methods=[];
    if(ppOn)methods.push("promptpay");
    if(bankOn)methods.push("bank_transfer");
    if(cardOn)methods.push("paypal_card");
    if(!methods.length){methodUnavailable("ช่องทางชำระเงินยังไม่พร้อม กรุณาติดต่อ MMD");return;}

    var state=$("[data-sp19-method-state]");
    if(state)state.hidden=true;
    $("[data-sp19-tabs]").hidden=false;
    setMethod(methods[0]);
  }

  async function loadInstructions(){
    try{
      var data=await fetchJson(INSTRUCTIONS,{
        method:"POST",
        headers:{"Accept":"application/json","Content-Type":"application/json"},
        body:JSON.stringify({t:token})
      });
      if(data.ok!==true||data.authority!=="payments-worker"||data.schema!=="mmd_payment_instructions_v1")throw new Error("payment_instructions_invalid");
      if(data.available!==true){
        var reason=clean(data.reason);
        var msg=reason==="proof_received_waiting_verification"?"MMD ได้รับสลิปแล้วครับ ตอนนี้กำลังตรวจยอด":
          reason==="payment_verified"?"ยอดนี้ได้รับการยืนยันแล้วครับ":
          reason==="payment_not_accepting"?"รายการนี้ยังไม่เปิดรับการชำระเงิน":
          "ช่องทางชำระเงินยังไม่พร้อม กรุณาติดต่อ MMD";
        methodUnavailable(msg);
        return;
      }
      renderInstructions(data);
    }catch(e){
      methodUnavailable("โหลดช่องทางชำระเงินไม่สำเร็จครับ กรุณาทัก MMD เพื่อเช็กก่อนชำระ");
    }
  }

  async function load(){
    if(canonicalize())return;
    root.setAttribute("aria-busy","true");
    $("[data-sp19-loading]").hidden=false;
    $("[data-sp19-error]").hidden=true;
    $("[data-sp19-content]").hidden=true;
    $("[data-sp19-sticky]").hidden=true;
    if(!token){showError("เปิดจากลิงก์ชำระของรายการนี้ครับ","หน้านี้ต้องใช้ Customer Payment Link ที่ MMD ส่งให้ หากไม่มีลิงก์ ทัก MMD ได้เลยครับ");return;}
    try{
      var data=await fetchJson(DETAILS,{
        method:"POST",
        headers:{"Accept":"application/json","Content-Type":"application/json"},
        body:JSON.stringify({t:token,expected_role:"customer"})
      });
      if(data.ok!==true||data.authority!=="payments-worker"||data.schema!=="confirmation_details_v1"||data.role!=="customer")throw new Error("confirmation_details_invalid");
      renderDetails(data);
      loadInstructions();
    }catch(e){
      var code=clean(e&&e.message);
      var msg=code==="confirmation_token_expired"?"ลิงก์นี้หมดอายุแล้วครับ ทัก MMD เพื่อรับลิงก์ล่าสุดได้เลย":
        code==="session_not_found"?"ยังไม่พบรายการที่ผูกกับลิงก์นี้ครับ กรุณาทัก MMD":
        "MMD ยังเปิดรายละเอียดของรายการนี้ไม่ได้ครับ กรุณาลองลิงก์ล่าสุดหรือติดต่อ MMD";
      showError("เปิดรายการนี้ไม่ได้ครับ",msg);
    }
  }

  $$("[data-sp19-method]").forEach(function(btn){btn.addEventListener("click",function(){setMethod(btn.dataset.sp19Method);});});

  var reveal=$("[data-sp19-bank-reveal]");
  var copy=$("[data-sp19-bank-copy]");
  var bankRevealed=false;
  if(reveal)reveal.addEventListener("click",function(){
    var account=clean(instructions&&instructions.bank_transfer&&instructions.bank_transfer.account_number);
    if(!account)return;
    bankRevealed=!bankRevealed;
    text("[data-sp19-account-number]",bankRevealed?account:"••••••••••");
    reveal.textContent=bankRevealed?"ซ่อนเลขบัญชี":"ดูเลขบัญชี";
    if(copy)copy.disabled=!bankRevealed;
  });
  if(copy)copy.addEventListener("click",async function(){
    var account=clean(instructions&&instructions.bank_transfer&&instructions.bank_transfer.account_number);
    if(!account)return;
    try{await navigator.clipboard.writeText(account);copy.textContent="คัดลอกแล้ว";setTimeout(function(){copy.textContent="คัดลอก";},1300);}catch(e){}
  });

  var fileInput=$("[data-sp19-file]");
  var consent=$("[data-sp19-consent]");
  var submit=$("[data-sp19-submit]");

  function syncSubmit(){if(submit)submit.disabled=!(proofFile&&consent&&consent.checked);}
  function clearPreview(){
    if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl="";}
    var prev=$("[data-sp19-preview]");
    if(prev){prev.innerHTML="";prev.textContent="FILE";}
  }

  if(fileInput)fileInput.addEventListener("change",function(){
    var f=fileInput.files&&fileInput.files[0];
    if(!f)return;
    var allowed=["image/jpeg","image/png","image/webp","application/pdf"];
    if(!allowed.includes(f.type)||f.size>10*1024*1024){
      fileInput.value="";proofFile=null;alert("ใช้ไฟล์ JPG, PNG, WEBP หรือ PDF ขนาดไม่เกิน 10 MB ครับ");syncSubmit();return;
    }
    proofFile=f;
    text("[data-sp19-file-name]",f.name);
    text("[data-sp19-file-size]",(f.size/1024/1024).toFixed(2)+" MB");
    $("[data-sp19-file-card]").hidden=false;
    clearPreview();
    var prev=$("[data-sp19-preview]");
    if(prev&&f.type.indexOf("image/")===0){
      objectUrl=URL.createObjectURL(f);
      var img=document.createElement("img");img.src=objectUrl;img.alt="ตัวอย่างสลิป";prev.textContent="";prev.appendChild(img);
    }
    syncSubmit();
  });

  var remove=$("[data-sp19-file-remove]");
  if(remove)remove.addEventListener("click",function(){
    proofFile=null;if(fileInput)fileInput.value="";$("[data-sp19-file-card]").hidden=true;clearPreview();syncSubmit();
  });
  if(consent)consent.addEventListener("change",syncSubmit);

  if(submit)submit.addEventListener("click",async function(){
    if(!payment||!proofFile||!consent||!consent.checked)return;
    submit.disabled=true;
    text("[data-sp19-submit-label]","กำลังส่งสลิปครับ");
    text("[data-sp19-submit-status]","กำลังผูกหลักฐานกับรายการนี้");
    var fd=new FormData();
    fd.append("payment_ref",clean(payment.payment_ref));
    fd.append("session_id",clean(payment.session_id));
    fd.append("payment_type",clean(payment.payment&&payment.payment.stage||payment.payment_type||"full"));
    fd.append("payment_stage",clean(payment.payment&&payment.payment.stage||payment.payment_type||"full"));
    fd.append("proof_type","payment_slip");
    fd.append("source_page","sigil_pay_v19");
    fd.append("t",token);
    fd.append("file",proofFile);
    fd.append("note",clean(($("[data-sp19-note]")||{}).value));
    try{
      var res=await fetch(PROOF,{method:"POST",body:fd,cache:"no-store",credentials:"omit"});
      var data=await res.json().catch(function(){return{};});
      if(!res.ok||data.ok===false)throw new Error(clean(data.error||data.message)||"proof_submit_failed");
      var form=$("[data-sp19-proof-form]"),state=$("[data-sp19-proof-state]");
      if(form)form.hidden=true;
      if(state){state.hidden=false;state.textContent="ได้รับสลิปแล้วครับ · เดี๋ยว MMD ดูแลต่อให้";}
      text("[data-sp19-status]","กำลังตรวจสอบ");
      text("[data-sp19-side-status]","กำลังตรวจสอบ");
      text("[data-sp19-side-copy]","MMD ได้รับหลักฐานแล้วครับ ตอนนี้กำลังตรวจยอด ไม่ต้องส่งซ้ำ");
      methodUnavailable("MMD ได้รับสลิปแล้วครับ ตอนนี้กำลังตรวจยอด");
      text("[data-sp19-submit-status]","");
    }catch(e){
      text("[data-sp19-submit-status]","ส่งสลิปไม่สำเร็จครับ กรุณาลองอีกครั้งหรือติดต่อ MMD");
      submit.disabled=false;
      text("[data-sp19-submit-label]","ส่งสลิปให้ MMD");
    }
  });

  var stickyAction=$("[data-sp19-sticky-action]");
  if(stickyAction)stickyAction.addEventListener("click",function(){
    var target=selectedMethod==="paypal_card"?$("[data-sp19-panel='paypal_card']"):$("#sp19-payment");
    if(target)target.scrollIntoView({behavior:window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });

  var retry=$("[data-sp19-retry]");
  if(retry)retry.addEventListener("click",load);
  window.addEventListener("beforeunload",clearPreview);

  load();
})();
</script>
