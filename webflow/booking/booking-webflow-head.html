<style id="booking-v5-editorial-i18n-css">
/* BOOKING_V5_EDITORIAL_I18N
   Additive presentation layer. Booking/package truth remains owned by booking-v4. */
#mmd-booking-v4{
  --bk5-ivory:#fbf7f0;
  --bk5-paper:#fffdf9;
  --bk5-ink:#171314;
  --bk5-muted:#756b66;
  --bk5-wine:#6e1828;
  --bk5-red:#a91632;
  --bk5-gold:#d2b176;
  --bk5-line:rgba(38,28,29,.11);
  --bk5-shadow:0 28px 85px rgba(31,20,20,.12);
  --bk5-ease:cubic-bezier(.22,1,.36,1);
  --bk5-spring:cubic-bezier(.16,1,.3,1);
  background:
    radial-gradient(circle at 90% 18%,rgba(169,22,50,.045),transparent 25rem),
    var(--bk5-ivory);
}
#mmd-booking-v4 .bk-nav{
  position:fixed;
  z-index:90;
  top:10px;
  left:12px;
  right:12px;
  min-height:54px;
  padding:7px 8px 7px 14px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  background:rgba(24,18,16,.48);
  box-shadow:0 12px 40px rgba(0,0,0,.15);
  backdrop-filter:blur(22px) saturate(1.18);
  -webkit-backdrop-filter:blur(22px) saturate(1.18);
  transition:background .42s var(--bk5-ease),border-color .42s var(--bk5-ease),transform .42s var(--bk5-ease);
}
#mmd-booking-v4 .bk-nav__right{
  display:flex;
  align-items:center;
  gap:7px;
}
#mmd-booking-v4 .bk-lang{
  display:flex;
  gap:2px;
  padding:3px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:999px;
  background:rgba(255,255,255,.08);
}
#mmd-booking-v4 .bk-lang button{
  width:32px;
  height:30px;
  padding:0;
  border:0;
  border-radius:999px;
  background:transparent;
  color:rgba(255,255,255,.68);
  font:800 9px/1 Manrope,"Noto Sans Thai",sans-serif;
  letter-spacing:.06em;
  transition:background .3s var(--bk5-ease),color .3s ease,transform .3s var(--bk5-ease);
}
#mmd-booking-v4 .bk-lang button[aria-pressed="true"]{
  background:#fff;
  color:#241a18;
  box-shadow:0 4px 14px rgba(0,0,0,.13);
}
#mmd-booking-v4 .bk-nav>a{
  min-height:36px;
  display:inline-flex;
  align-items:center;
  padding:0 13px;
  border-radius:999px;
  background:rgba(255,255,255,.11);
  font-size:10px;
  font-weight:800;
}
#mmd-booking-v4 .bk-hero{
  min-height:92svh;
  overflow:hidden;
}
#mmd-booking-v4 .bk-hero:after{
  background:
    radial-gradient(circle at 72% 42%,transparent 0 14%,rgba(8,6,6,.08) 40%),
    linear-gradient(180deg,rgba(9,7,7,.14),rgba(9,7,7,.04) 26%,rgba(13,9,9,.86) 88%,#120e0d),
    linear-gradient(90deg,rgba(12,9,9,.68),rgba(12,9,9,.08) 72%);
}
#mmd-booking-v4 .bk-hero picture img{
  transform:scale(1.045);
  filter:saturate(.9) contrast(1.02);
  transition:transform 1.25s var(--bk5-ease),filter 1.1s var(--bk5-ease);
}
#mmd-booking-v4.bk-v5-ready .bk-hero picture img{
  transform:scale(1);
  filter:none;
}
#mmd-booking-v4 .bk-hero-copy{
  max-width:760px;
  padding-bottom:clamp(40px,7vw,74px);
}
#mmd-booking-v4 .bk-hero h1{
  max-width:9ch;
  font-size:clamp(3.7rem,14vw,8.6rem);
  line-height:.88;
  letter-spacing:-.075em;
  text-wrap:balance;
}
#mmd-booking-v4 .bk-hero p{
  max-width:620px;
  font-size:clamp(1rem,2.2vw,1.2rem);
}
#mmd-booking-v4 .bk-action{
  min-height:54px;
  padding-inline:22px;
  background:linear-gradient(135deg,#f6e7c8,#d7b36f);
  box-shadow:0 16px 42px rgba(0,0,0,.16);
}
#mmd-booking-v4 .bk-v5-context{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:15px;
}
#mmd-booking-v4 .bk-v5-context[hidden]{display:none}
#mmd-booking-v4 .bk-v5-context span{
  min-height:28px;
  display:inline-flex;
  align-items:center;
  padding:0 10px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.84);
  backdrop-filter:blur(12px);
  font-size:9px;
  font-weight:800;
  letter-spacing:.04em;
}
#mmd-booking-v4 .bk-section{
  padding:clamp(70px,10vw,118px) 0;
}
#mmd-booking-v4 #bk-moods{
  background:
    linear-gradient(180deg,#f7f2ea 0%,#fffdf9 100%);
}
#mmd-booking-v4 .bk-head{
  margin-bottom:34px;
}
#mmd-booking-v4 .bk-head h2,
#mmd-booking-v4 .bk-form-head h2{
  color:var(--bk5-ink);
  font-weight:700;
  letter-spacing:-.055em;
  text-wrap:balance;
}
#mmd-booking-v4 .bk-rail{
  gap:14px;
  scroll-padding:18px;
}
#mmd-booking-v4 .bk-card{
  min-height:440px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:30px;
  box-shadow:0 22px 62px rgba(32,23,20,.13);
  transform:translate3d(0,10px,0) scale(.988);
  opacity:.88;
  transition:
    transform .72s var(--bk5-spring),
    opacity .45s ease,
    box-shadow .5s var(--bk5-ease),
    outline-color .3s ease;
}
#mmd-booking-v4 .bk-card.is-visible-v5{
  opacity:1;
  transform:none;
}
#mmd-booking-v4 .bk-card.is-picked{
  outline:2px solid #e8c788;
  outline-offset:3px;
  box-shadow:0 28px 78px rgba(70,24,35,.18);
}
#mmd-booking-v4 .bk-card:after{
  background:
    linear-gradient(180deg,rgba(8,7,7,.02) 18%,rgba(8,6,6,.18) 48%,rgba(8,6,6,.94) 100%);
}
#mmd-booking-v4 .bk-card-body{
  padding:26px;
}
#mmd-booking-v4 .bk-card h3{
  font-size:clamp(1.75rem,6vw,2.25rem);
}
#mmd-booking-v4 .bk-card b{
  min-height:34px;
  align-items:center;
  padding-inline:12px;
  background:rgba(255,255,255,.10)!important;
  backdrop-filter:blur(12px);
}
#mmd-booking-v4 #mmd-request{
  position:relative;
  background:
    radial-gradient(circle at 12% 0,rgba(169,22,50,.06),transparent 26rem),
    #f4eee6;
}
#mmd-booking-v4 .bk-shell{
  border-color:rgba(38,28,29,.09);
  border-radius:34px;
  background:rgba(255,253,249,.95);
  box-shadow:var(--bk5-shadow);
}
#mmd-booking-v4 .bk-progress{
  gap:7px;
}
#mmd-booking-v4 .bk-progress span{
  height:3px;
  background:#e7ded4;
  transition:background .4s ease,transform .5s var(--bk5-ease);
}
#mmd-booking-v4 .bk-progress span.on{
  background:linear-gradient(90deg,var(--bk5-red),var(--bk5-gold));
  transform:scaleY(1.35);
}
#mmd-booking-v4 .bk-form-head{
  padding-top:28px;
}
#mmd-booking-v4 .bk-form-head h2{
  max-width:10ch;
}
#mmd-booking-v4 .bk-flow{
  min-width:0;
}
#mmd-booking-v4 .bk-panel.active{
  animation:bk5PanelIn .62s var(--bk5-ease) both;
}
@keyframes bk5PanelIn{
  from{opacity:0;transform:translate3d(16px,0,0);filter:blur(3px)}
  to{opacity:1;transform:none;filter:none}
}
#mmd-booking-v4 .bk-choice-grid{
  gap:9px;
}
#mmd-booking-v4 .bk-choice{
  position:relative;
  min-height:86px;
  padding:14px 14px 14px 16px;
  border-color:var(--bk5-line);
  border-radius:20px;
  background:#fff;
  color:var(--bk5-ink);
  box-shadow:0 8px 25px rgba(31,20,20,.035);
  transition:
    transform .4s var(--bk5-ease),
    border-color .3s ease,
    background .3s ease,
    box-shadow .4s var(--bk5-ease);
}
#mmd-booking-v4 .bk-choice strong{
  color:#2b2022;
  font-size:.9rem;
}
#mmd-booking-v4 .bk-choice.picked{
  border-color:rgba(169,22,50,.55);
  background:linear-gradient(145deg,#fff,#fff8f7);
  box-shadow:0 0 0 3px rgba(169,22,50,.07),0 16px 38px rgba(76,25,35,.08);
}
@media(hover:hover) and (pointer:fine){
  #mmd-booking-v4 .bk-choice:not(:disabled):hover{
    transform:translateY(-3px);
    border-color:rgba(169,22,50,.28);
    box-shadow:0 16px 36px rgba(45,29,31,.08);
  }
}
#mmd-booking-v4 .bk-field label{
  color:#51474a;
}
#mmd-booking-v4 .bk-field input,
#mmd-booking-v4 .bk-field textarea{
  border-color:rgba(38,28,29,.12);
  border-radius:17px;
  background:#fff;
  transition:border-color .3s ease,box-shadow .3s ease,transform .3s var(--bk5-ease);
}
#mmd-booking-v4 .bk-field input:focus,
#mmd-booking-v4 .bk-field textarea:focus{
  border-color:rgba(169,22,50,.48);
  box-shadow:0 0 0 4px rgba(169,22,50,.07),0 12px 28px rgba(50,29,33,.06);
}
#mmd-booking-v4 .bk-next,
#mmd-booking-v4 .bk-back{
  min-height:54px;
}
#mmd-booking-v4 .bk-next{
  background:linear-gradient(135deg,#8a1930,#5e1725);
  box-shadow:0 12px 28px rgba(110,24,40,.14);
}
#mmd-booking-v4 .bk-package-lock{
  border-radius:22px;
  background:
    radial-gradient(circle at 90% 0,rgba(210,177,118,.15),transparent 45%),
    linear-gradient(145deg,#211a18,#130f0f);
  box-shadow:0 18px 42px rgba(25,17,16,.13);
}
#mmd-booking-v4 .bk-summary{
  gap:0;
}
#mmd-booking-v4 .bk-row{
  padding:14px 0;
  grid-template-columns:minmax(88px,.36fr) 1fr;
}
#mmd-booking-v4 .bk-row strong{
  color:#2d2425;
}
#mmd-booking-v4 .bk-accord{
  border-top:1px solid var(--bk5-line);
  padding-top:6px;
}
#mmd-booking-v4 .bk-accord details{
  border-color:var(--bk5-line);
}
#mmd-booking-v4 .bk-footer{
  background:#f4eee6;
}
#mmd-booking-v4.is-lang-swapping .bk-hero-copy,
#mmd-booking-v4.is-lang-swapping .bk-head,
#mmd-booking-v4.is-lang-swapping .bk-shell{
  opacity:.42;
  transform:translate3d(0,-3px,0);
  filter:blur(2px);
  transition:opacity .15s ease,transform .18s ease,filter .18s ease;
}
#mmd-booking-v4 .bk-hero-copy,
#mmd-booking-v4 .bk-head,
#mmd-booking-v4 .bk-shell{
  transition:opacity .34s ease,transform .45s var(--bk5-ease),filter .3s ease;
}
@media(min-width:720px){
  #mmd-booking-v4 .bk-nav{
    left:max(18px,calc((100vw - 1240px)/2));
    right:max(18px,calc((100vw - 1240px)/2));
    top:14px;
  }
  #mmd-booking-v4 .bk-hero{
    min-height:min(900px,96svh);
  }
  #mmd-booking-v4 .bk-hero picture{
    left:36%;
  }
  #mmd-booking-v4 .bk-hero:after{
    background:
      linear-gradient(90deg,#15100f 0%,rgba(21,16,15,.93) 30%,rgba(21,16,15,.58) 47%,rgba(21,16,15,.05) 72%),
      linear-gradient(180deg,transparent 62%,rgba(10,8,8,.48));
  }
  #mmd-booking-v4 .bk-card{
    min-height:520px;
  }
  #mmd-booking-v4 .bk-shell{
    grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr);
  }
  #mmd-booking-v4 .bk-progress,
  #mmd-booking-v4 .bk-form-head{
    padding-left:42px;
    padding-right:38px;
  }
  #mmd-booking-v4 .bk-flow{
    border-left-color:rgba(38,28,29,.09);
  }
  #mmd-booking-v4 .bk-fields{
    padding:42px;
  }
  #mmd-booking-v4 .bk-actions,
  #mmd-booking-v4 .bk-status{
    padding-left:42px;
    padding-right:42px;
  }
  #mmd-booking-v4 .bk-summary{
    padding:42px;
  }
}
@media(min-width:1040px){
  #mmd-booking-v4 .bk-choice-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:719px){
  #mmd-booking-v4 .bk-nav>a{
    display:none;
  }
  #mmd-booking-v4 .bk-nav{
    right:auto;
    width:calc(100% - 24px);
  }
  #mmd-booking-v4 .bk-hero-copy{
    padding-top:124px;
  }
  #mmd-booking-v4 .bk-rail{
    grid-auto-columns:88%;
    margin-inline:-16px;
    padding-inline:16px;
  }
  #mmd-booking-v4 .bk-choice-grid{
    grid-template-columns:1fr;
  }
  #mmd-booking-v4 .bk-choice{
    min-height:76px;
  }
}
@media(prefers-reduced-motion:reduce){
  #mmd-booking-v4 .bk-card,
  #mmd-booking-v4 .bk-panel.active,
  #mmd-booking-v4 .bk-hero picture img,
  #mmd-booking-v4 .bk-choice,
  #mmd-booking-v4 .bk-hero-copy,
  #mmd-booking-v4 .bk-head,
  #mmd-booking-v4 .bk-shell{
    animation:none!important;
    transition:none!important;
    transform:none!important;
    filter:none!important;
    opacity:1!important;
  }
}
</style>

  function projectedMedia(item) {

    const valid = m => m && m.media_source === 'mmd_model_media_assets' && /^media_[a-z0-9_-]{8,100}$/i.test(m.media_id || '') && ['photo','clip'].includes(m.kind);
    const approved = (Array.isArray(item.approved_media) ? item.approved_media : []).filter(valid);
    const published = (Array.isArray(item.gallery_media) ? item.gallery_media : []).filter(valid);
    const cover = approved.find(m => m.media_id === item.primary_media_id && m.kind === 'photo') || null;
    const seen = new Set();
    const gallery = [...approved,...published].filter(m => {if(seen.has(m.media_id)) return false; seen.add(m.media_id); return true;});

  }
  function mediaNode(media) {

  async function submitRequest() {

})();
