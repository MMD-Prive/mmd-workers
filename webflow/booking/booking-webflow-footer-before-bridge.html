  function normalizeLang(value){
    const x=String(value||'').trim().toLowerCase();
    if(x==='zh'||x.startsWith('zh-')||x==='cn')return'zh';
    if(x==='en'||x.startsWith('en-'))return'en';
    if(x==='th'||x.startsWith('th-'))return'th';
    return'';
  }

  function detectLang(){
    const query=normalizeLang(qs.get('lang'));
    if(query)return query;
    try{
      const stored=normalizeLang(localStorage.getItem('mmd_lang'));
      if(stored)return stored;
    }catch(_){}
    const html=normalizeLang(document.documentElement.lang);
    return html||'th';
  }

  function setText(el,value){
    if(el&&value!=null&&el.textContent!==value)el.textContent=value;
  }
  function setHtml(el,value){
    if(el&&value!=null&&el.innerHTML!==value)el.innerHTML=value;
  }
  function setLabel(name,value){
    const field=root.querySelector('[name="'+name+'"]');
    const label=field&&field.closest('label');
    if(!label)return;
    let node=Array.from(label.childNodes).find(n=>n.nodeType===3);
    if(!node){
      node=document.createTextNode('');
      label.insertBefore(node,label.firstChild);
    }
    node.nodeValue=value;
  }

  function buildChrome(){
    const nav=root.querySelector('.bk-nav');
    if(!nav)return;
    let right=nav.querySelector('.bk-nav__right');
    const request=nav.querySelector('a[href="#mmd-request"]');
    if(!right){
      right=document.createElement('div');
      right.className='bk-nav__right';
      if(request)right.append(request);
      nav.append(right);
    }
    if(!right.querySelector('.bk-lang')){
      const group=document.createElement('div');
      group.className='bk-lang';
      group.setAttribute('role','group');
      group.setAttribute('aria-label','Language');
      [['th','TH'],['en','EN'],['zh','中']].forEach(([code,label])=>{
        const b=document.createElement('button');
        b.type='button';
        b.dataset.bookingLang=code;
        b.textContent=label;
        b.setAttribute('aria-pressed','false');
        group.append(b);
      });
      right.insertBefore(group,request||null);
    }
    const heroCopy=root.querySelector('.bk-hero-copy');
    if(heroCopy&&!heroCopy.querySelector('.bk-v5-context')){
      const ctx=document.createElement('div');
      ctx.className='bk-v5-context';
      ctx.hidden=true;
      ctx.dataset.bookingContext='';
      heroCopy.append(ctx);
    }
  }

  function serviceCopy(button,lang){
    const key=button.dataset.service;
    const item=SERVICES[key]&&SERVICES[key][lang];
    if(!item)return;
    const strong=button.querySelector('strong');
    setText(strong,item[0]);
    Array.from(button.childNodes).filter(n=>n.nodeType===3).forEach(n=>n.remove());
    button.append(document.createTextNode(item[1]));
  }

  function moodCopy(button,lang){
    const item=MOODS[button.dataset.mood]&&MOODS[button.dataset.mood][lang];
    if(!item)return;
    setText(button.querySelector('small'),item[0]);
    setText(button.querySelector('h3'),item[1]);
    setText(button.querySelector('p'),item[2]);
    setText(button.querySelector('b'),item[3]);
  }

  function heroCopy(lang){
    const d=COPY[lang];
    const specific=ROLE_HERO[role]&&ROLE_HERO[role][lang];
    setText(root.querySelector('.bk-hero .bk-kicker'),d.hero.kicker);
    setHtml(root.querySelector('.bk-hero h1'),specific?specific[0]:d.hero.title);
    setText(root.querySelector('.bk-hero p'),specific?specific[1]:d.hero.copy);
    setText(root.querySelector('.bk-action'),specific?specific[2]:d.hero.action);
    if(specific)root.querySelector('.bk-action')?.setAttribute('href','#mmd-request');
    setText(root.querySelector('.bk-assure span'),d.hero.assure);
    const img=root.querySelector('.bk-hero picture img');
    if(img)img.alt=lang==='zh'?'MMD Privé 预约氛围':lang==='en'?'MMD Privé booking atmosphere':'บรรยากาศ Booking ของ MMD Privé';
  }

  function contextCopy(lang){
    const d=COPY[lang];
    const ctx=root.querySelector('[data-booking-context]');
    if(!ctx)return;
    ctx.replaceChildren();
    if(model){
      const s=document.createElement('span');
      s.textContent=d.context.model+' · '+model;
      ctx.append(s);
    }
    if(packageKey){
      const lock=root.querySelector('[data-package-lock]');
      const name=lock?.querySelector('[data-package-name]')?.textContent.trim()||packageKey.replaceAll('_',' ').toUpperCase();
      const s=document.createElement('span');
      s.textContent=d.context.package+' · '+name;
      ctx.append(s);
    }
    ctx.hidden=!ctx.children.length;
  }

  function packageCopy(lang){
    const lock=root.querySelector('[data-package-lock]');
    if(!lock||lock.hidden)return;
    setText(lock.querySelector('small'),COPY[lang].selectedPackage);
    const detail=PACKAGE_COPY[packageKey]&&PACKAGE_COPY[packageKey][lang];
    if(detail)setText(lock.querySelector('[data-package-detail]'),detail);
  }

  function staticCopy(lang){
    const d=COPY[lang];
    setText(root.querySelector('.bk-nav>a[href="#mmd-request"]'),d.nav);
    heroCopy(lang);
    setText(root.querySelector('#bk-moods .bk-step'),d.mood.step);
    setText(root.querySelector('#bk-moods .bk-head h2'),d.mood.title);
    setText(root.querySelector('#bk-moods .bk-head>p'),d.mood.copy);
    root.querySelectorAll('[data-mood]').forEach(b=>moodCopy(b,lang));

    setText(root.querySelector('.bk-form-head .bk-step'),d.form.step);
    setText(root.querySelector('.bk-form-head h2'),d.form.title);
    setText(root.querySelector('.bk-form-head p'),d.form.copy);

    const panels=root.querySelectorAll('[data-panel]');
    setText(panels[0]?.querySelector('.bk-step'),d.panel.one);
    setText(panels[1]?.querySelector('.bk-step'),d.panel.two);
    setText(panels[2]?.querySelector('.bk-step'),d.panel.three);

    root.querySelectorAll('[data-service]').forEach(b=>serviceCopy(b,lang));
    setLabel('date',d.fields.date);
    setLabel('time',d.fields.time);
    setLabel('place',d.fields.place);
    setLabel('name',d.fields.name);
    setLabel('contact',d.fields.contact);
    setLabel('note',d.fields.note);

    const time=root.querySelector('[name="time"]');
    const place=root.querySelector('[name="place"]');
    const note=root.querySelector('[name="note"]');
    if(time)time.placeholder=d.placeholders.time;
    if(place)place.placeholder=d.placeholders.place;
    if(note)note.placeholder=d.placeholders.note;

    root.querySelectorAll('[data-next]').forEach((b,i)=>{
      setText(b,b.type==='submit'?d.buttons.summary:d.buttons.next);
    });
    root.querySelectorAll('[data-back]').forEach((b,i)=>{
      setText(b,i===root.querySelectorAll('[data-back]').length-1?d.buttons.edit:d.buttons.back);
    });
    setText(root.querySelector('[data-copy]'),d.buttons.copy);

    const details=root.querySelectorAll('.bk-accord details');
    d.faq.forEach((item,i)=>{
      setText(details[i]?.querySelector('summary'),item[0]);
      setText(details[i]?.querySelector('p'),item[1]);
    });
    setText(root.querySelector('.bk-footer .bk-wrap'),d.footer);
    packageCopy(lang);
    contextCopy(lang);
  }

  const SUMMARY_KEYS={
    'ฟีล':'mood','Mood':'mood','氛围':'mood',
    'บริการ':'service','Service':'service','服务':'service',
    'แพ็กเกจ':'package','Package':'package','套餐':'package',
    'คนที่สนใจ':'model','Model':'model','感兴趣的人选':'model',
    'วันที่':'date','Date':'date','日期':'date',
    'เวลา':'time','Time':'time','时间':'time',
    'พื้นที่':'place','Area':'place','地区':'place',
    'ชื่อ':'name','Name':'name','姓名':'name',
    'ติดต่อ':'contact','Contact':'contact','联系方式':'contact',
    'เพิ่มเติม':'note','Additional note':'note','补充说明':'note'
  };

  function currentMood(){
    const b=root.querySelector('[data-mood].is-picked');
    return b?b.dataset.mood:'';
  }
  function currentService(){
    const b=root.querySelector('[data-service].picked');
    return b?b.dataset.service:'';
  }
  function displayMood(value,lang){
    const key=currentMood()||value;
    if(!key)return COPY[lang].summary.fallbackMood;
    return MOODS[key]?.[lang]?.[1]||key;
  }
  function displayService(value,lang){
    const key=currentService()||value;
    return SERVICES[key]?.[lang]?.[0]||key;
  }

  function translateSummary(lang){
    const d=COPY[lang];
    root.querySelectorAll('.bk-row').forEach(row=>{
      const label=row.querySelector('span');
      const value=row.querySelector('strong');
      if(!label||!value)return;
      const key=SUMMARY_KEYS[label.textContent.trim()];
      if(!key)return;
      label.textContent=d.summary[key];
      if(key==='mood')value.textContent=displayMood(value.textContent.trim(),lang);
      if(key==='service')value.textContent=displayService(value.textContent.trim(),lang);
      if(key==='package'&&packageKey){
        const lock=root.querySelector('[data-package-lock]');
        const name=lock?.querySelector('[data-package-name]')?.textContent.trim()||'';
        const price=lock?.querySelector('[data-package-price]')?.textContent.trim()||'';
        const detail=PACKAGE_COPY[packageKey]?.[lang]||lock?.querySelector('[data-package-detail]')?.textContent.trim()||'';
        value.textContent=[name,price,detail].filter(Boolean).join(' · ');
      }
    });
  }

  const STATUS_KEY={
    'เลือกสิ่งที่กำลังมองหาสักข้อก่อนครับ':'choose',
    'Choose what you are looking for before continuing.':'choose',
    '请先选择你在寻找的服务。':'choose',
    'ตรวจสรุปแล้วกดคัดลอกเพื่อส่งให้ MMD ทาง LINE ได้เลยครับ':'review',
    'Review the summary, then copy it to send to MMD on LINE.':'review',
    '请先检查摘要，再复制并通过 LINE 发送给 MMD。':'review',
    'คัดลอกข้อความแล้ว กำลังเปิด LINE…':'copied',
    'Copied. Opening LINE…':'copied',
    '已复制，正在打开 LINE…':'copied'
  };

  function translateStatus(lang){
    const status=root.querySelector('[data-status]');
    if(!status||!status.textContent.trim())return;
    const key=STATUS_KEY[status.textContent.trim()];
    if(key)setText(status,COPY[lang].status[key]);
  }

  function syncLangUrl(lang){
    try{
      const u=new URL(location.href);
      u.searchParams.set('lang',lang);
      history.replaceState(null,'',u.pathname+u.search+u.hash);
    }catch(_){}
  }

  let activeLang=detectLang();

  function setLang(raw,{syncUrl=false,animate=false}={}){
    const lang=normalizeLang(raw)||'th';
    activeLang=lang;
    const apply=()=>{
      document.documentElement.lang=lang==='zh'?'zh-Hans':lang;
      root.querySelectorAll('[data-booking-lang]').forEach(b=>{
        b.setAttribute('aria-pressed',String(b.dataset.bookingLang===lang));
      });
      staticCopy(lang);
      translateSummary(lang);
      translateStatus(lang);
      try{localStorage.setItem('mmd_lang',lang)}catch(_){}
      if(syncUrl)syncLangUrl(lang);
    };
    if(!animate||matchMedia('(prefers-reduced-motion: reduce)').matches){
      apply();
      return;
    }
    root.classList.add('is-lang-swapping');
    setTimeout(()=>{
      apply();
      requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('is-lang-swapping')));
    },140);
  }

  function installCopyHandler(){
    const button=root.querySelector('[data-copy]');
    if(!button)return;
    button.onclick=async()=>{
      translateSummary(activeLang);
      const lines=Array.from(root.querySelectorAll('.bk-row')).map(row=>{
        const label=row.querySelector('span')?.textContent.trim()||'';
        const value=row.querySelector('strong')?.textContent.trim()||'';
        return label+': '+value;
      });
      const text=[COPY[activeLang].clipboard.title,...lines,COPY[activeLang].clipboard.note].join('\n');
      try{await navigator.clipboard.writeText(text)}catch(_){}
      setText(root.querySelector('[data-status]'),COPY[activeLang].status.copied);
      setTimeout(()=>window.open('https://lin.ee/xRqsALs','_blank','noopener'),250);
    };
  }

  function installPostActionTranslation(){
    root.addEventListener('click',event=>{
      const langButton=event.target.closest('[data-booking-lang]');
      if(langButton){
        setLang(langButton.dataset.bookingLang,{syncUrl:true,animate:true});
        return;
      }
      if(event.target.closest('[data-next],[data-back],[data-service],[data-mood]')){
        setTimeout(()=>{
          packageCopy(activeLang);
          translateSummary(activeLang);
          translateStatus(activeLang);
          contextCopy(activeLang);
        },30);
      }
    },true);

    const form=root.querySelector('[data-form]');
    if(form){
      form.addEventListener('submit',()=>{
        setTimeout(()=>{
          translateSummary(activeLang);
          translateStatus(activeLang);
        },20);
      });
    }

    const status=root.querySelector('[data-status]');
    if(status){
      new MutationObserver(()=>translateStatus(activeLang))
        .observe(status,{childList:true,subtree:true,characterData:true});
    }
    const summary=root.querySelector('[data-summary]');
    if(summary){
      new MutationObserver(()=>translateSummary(activeLang))
        .observe(summary,{childList:true,subtree:true});
    }
    const lock=root.querySelector('[data-package-lock]');
    if(lock){
      new MutationObserver(()=>packageCopy(activeLang))
        .observe(lock,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden']});
    }
  }

  function installReveal(){
    const cards=Array.from(root.querySelectorAll('.bk-card'));
    if(matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver'in window)){
      cards.forEach(c=>c.classList.add('is-visible-v5'));
      return;
    }
    const io=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting)return;
        const i=cards.indexOf(entry.target);
        setTimeout(()=>entry.target.classList.add('is-visible-v5'),Math.max(0,i)*55);
        io.unobserve(entry.target);
      });
    },{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    cards.forEach(c=>io.observe(c));
  }

  buildChrome();
  setLang(activeLang);
  installCopyHandler();
  installPostActionTranslation();
  installReveal();
  requestAnimationFrame(()=>root.classList.add('bk-v5-ready'));
})();
</script>
