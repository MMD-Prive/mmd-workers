<section class="mmd-bkkv1" data-mmd-bkk-visual="1" data-tone="light" data-head-th="เลือกฟีลกรุงเทพที่อยากได้วันนี้" data-head-en="Start with the Bangkok mood you want today." data-head-zh="先选今天想要的曼谷氛围。" data-copy-th="บอก MMD ว่าวันนี้อยากได้กรุงเทพแบบไหน แล้วเราจะช่วยดู route และคนที่เข้ากับจังหวะนั้นให้ครับ" data-copy-en="Tell MMD the kind of Bangkok you want today, and we’ll help match the route and person to that mood." data-copy-zh="告诉 MMD 今天想体验怎样的曼谷，我们会帮您匹配合适的路线与人选。"><style>.mmd-bkkv1{--bg:#f2ede5;--fg:#181614;--muted:#655d56;--accent:#6d2738;background:var(--bg);color:var(--fg);padding:44px 0;border-block:1px solid rgba(24,22,20,.08);font-family:"LINE Seed Sans TH","Noto Sans Thai",Arial,sans-serif;overflow:hidden}.mmd-bkkv1[data-tone="dark"]{--bg:#181513;--fg:#fff8ed;--muted:rgba(255,248,237,.76);--accent:#d0ad75}.mmd-bkkv1 *{box-sizing:border-box}.mmd-bkkv1 .bkkv1-shell{width:min(1280px,calc(100% - 28px));margin:auto}.mmd-bkkv1 .bkkv1-k{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}.mmd-bkkv1 h2{margin:12px 0 0;font-family:"LINE Seed Sans TH","Noto Sans Thai",Arial,sans-serif;font-size:clamp(38px,8.5vw,72px);font-weight:750;line-height:1.04;letter-spacing:-.04em;color:var(--fg)!important;-webkit-text-fill-color:var(--fg)!important;background:none!important}.mmd-bkkv1 p{max-width:680px;margin:16px 0 0;color:var(--muted)!important;font-size:14px;line-height:1.75}.mmd-bkkv1 .bkkv1-rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:28px -14px 0;padding:0 14px 8px;scrollbar-width:none}.mmd-bkkv1 .bkkv1-rail::-webkit-scrollbar{display:none}.mmd-bkkv1 figure{position:relative;flex:0 0 76%;aspect-ratio:4/3;margin:0;border-radius:18px;overflow:hidden;background:#cbc1b7;scroll-snap-align:start;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1)}.mmd-bkkv1.is-in figure{opacity:1;transform:none}.mmd-bkkv1 figure:nth-child(2){transition-delay:.08s}.mmd-bkkv1 figure:nth-child(3){transition-delay:.16s}.mmd-bkkv1 img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.22,1,.36,1)}.mmd-bkkv1 figure:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.62))}.mmd-bkkv1 figcaption{position:absolute;z-index:2;left:14px;bottom:13px;color:#fff!important;-webkit-text-fill-color:#fff!important;font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.mmd-bkkv1 .bkkv1-swipe{margin-top:10px;color:var(--muted);font-size:10px;letter-spacing:.08em}.mmd-bkkv1 h2,.mmd-bkkv1 p,.mmd-bkkv1 .bkkv1-k{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s cubic-bezier(.22,1,.36,1)}.mmd-bkkv1.is-in h2,.mmd-bkkv1.is-in p,.mmd-bkkv1.is-in .bkkv1-k{opacity:1;transform:none}@media(min-width:768px){.mmd-bkkv1{padding:72px 0}.mmd-bkkv1 .bkkv1-shell{width:min(1280px,calc(100% - 48px))}.mmd-bkkv1 .bkkv1-rail{display:grid;grid-template-columns:repeat(3,1fr);margin:36px 0 0;padding:0;overflow:visible}.mmd-bkkv1 figure{aspect-ratio:4/3;min-width:0}.mmd-bkkv1 .bkkv1-swipe{display:none}.mmd-bkkv1 figure:hover img{transform:scale(1.025)}}@media(prefers-reduced-motion:reduce){.mmd-bkkv1 *{transition:none!important}.mmd-bkkv1 figure,.mmd-bkkv1 h2,.mmd-bkkv1 p,.mmd-bkkv1 .bkkv1-k{opacity:1;transform:none}}</style><div class="bkkv1-shell"><div class="bkkv1-k">FIND YOUR MMD · BANGKOK FIRST</div><h2 data-bkk-head>เลือกฟีลกรุงเทพที่อยากได้วันนี้</h2><p data-bkk-copy>บอก MMD ว่าวันนี้อยากได้กรุงเทพแบบไหน แล้วเราจะช่วยดู route และคนที่เข้ากับจังหวะนั้นให้ครับ</p><div class="bkkv1-rail"><figure><img loading="lazy" src="https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6aa33e6773b7576ce3983de3_Bangkok%20TMIB%20Card%20B.webp" alt="Bangkok TMIB discovery card"><figcaption>Bangkok · Mood B</figcaption></figure><figure><img loading="lazy" src="https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6aa33e67ef037b902ef53086_Bangkok%20TMIB%20Card%20C.webp" alt="Bangkok TMIB discovery card"><figcaption>Bangkok · Mood C</figcaption></figure><figure><img loading="lazy" src="https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6aa33e67990ef64f63d222fd_Bangkok%20TMIB%20Card%20D.webp" alt="Bangkok TMIB discovery card"><figcaption>Bangkok · Mood D</figcaption></figure></div><div class="bkkv1-swipe">SWIPE TO EXPLORE →</div></div><script>(()=>{const s=document.currentScript.closest('[data-mmd-bkk-visual]');if(!s)return;const sync=()=>{let l=(new URLSearchParams(location.search).get('lang')||document.documentElement.lang||'th').toLowerCase();l=l.startsWith('zh')?'zh':l.startsWith('en')?'en':'th';const c=l[0].toUpperCase()+l.slice(1);s.querySelector('[data-bkk-head]').textContent=s.dataset['head'+c]||s.dataset.headTh;s.querySelector('[data-bkk-copy]').textContent=s.dataset['copy'+c]||s.dataset.copyTh};sync();new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});if('IntersectionObserver'in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){new IntersectionObserver(([e],o)=>{if(e.isIntersecting){s.classList.add('is-in');o.disconnect()}},{threshold:.08}).observe(s)}else{s.classList.add('is-in')}requestAnimationFrame(()=>{const f=[...document.querySelectorAll('footer')].find(x=>!s.contains(x));if(f&&f.parentNode)f.parentNode.insertBefore(s,f)})})();</script></section>
