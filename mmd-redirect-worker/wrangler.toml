name = "mmd-redirect-worker"
main = "src/index.js"
compatibility_date = "2026-06-07"
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

[[services]]
binding = "IMMIGRATE_WORKER"
service = "immigrate-worker"

[[services]]
binding = "ADMIN_WORKER"
service = "admin-worker"

[[routes]]
pattern = "mmdbkk.com/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/*"
zone_name = "mmdbkk.com"

