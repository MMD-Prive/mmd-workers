points_rules:
  standard:
    label: "Standard Package"
    bonus_points: 150
    eligibility: "new_member"
  premium:
    label: "Premium Package"
    bonus_points: 250
    eligibility: "new_member"
  blackcard:
    label: "Black Card"
    bonus_points: 350
    # Backend approval-only. Black Card is NOT a normal purchasable package.
    # bonus_points applies only after explicit blackcard_approved: true is set by admin.
    # Must never appear in customer-facing copy as an automatic points path.
    eligibility: "new_member_private_approval_only"

max_bonus_points: 350

