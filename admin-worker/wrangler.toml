# Serializes all Kenji Knowledge workflow mutations through one Worker-owned
# coordinator. Airtable status, version, command ID, QA snapshot and audit log
# are then written in one record PATCH.
[[durable_objects.bindings]]
name = "KENJI_KNOWLEDGE_COORDINATOR"
class_name = "KenjiKnowledgeCoordinator"

# Serializes first-time LINE binding per Model record. It prevents two different
# LINE identities from racing to claim the same model and makes same-LINE retry idempotent.
[[durable_objects.bindings]]
name = "MODEL_ACTIVATION_COORDINATOR"
class_name = "ModelActivationCoordinator"

# Stores at most one short-lived GPS point per model. Coordinates are never written to Airtable.
[[durable_objects.bindings]]
name = "MODEL_LOCATION_COORDINATOR"
class_name = "ModelLocationCoordinator"


# One durable job serializes Console Inbox pagination and provides resumable progress.
[[durable_objects.bindings]]
name = "LINE_OFC_BACKFILL_COORDINATOR"
class_name = "LineOfcConsoleBackfillCoordinator"

