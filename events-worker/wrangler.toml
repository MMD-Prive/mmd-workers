name = "events-worker"
main = "src/model-eta-wrapper.js"
compatibility_date = "2026-02-27"

# cron triggers
[triggers]
crons = ["*/15 * * * *"] # run every 15 minutes

[vars]
# required runtime vars (set actual values in dashboard or use wrangler kv/vars)
TELEGRAM_WORKER_BASE = "https://telegram-worker.malemodel-bkk.workers.dev"
PAYMENTS_WORKER_BASE = "https://payments-worker.malemodel-bkk.workers.dev"
ADMIN_WORKER_BASE = "https://admin-worker.malemodel-bkk.workers.dev"
RT_BASE_URL = "https://realtime-worker.malemodel-bkk.workers.dev"

# Canonical MMD storage for the pre-job reconfirm scheduler.
AIRTABLE_BASE_ID = "appsV1ILPRfIjkaYg"
AIRTABLE_TABLE_SESSIONS = "tblC98mKWbzmPuNzX"
AIRTABLE_TABLE_MODELS = "tblI4B0bI446vp9GX"

# Pre-job reconfirm reuses this Worker's existing 15-minute cron.
MODEL_RECONFIRM_ENABLED = "true"
# Guard v2: next-ICT-day only, no model guessing, owner-only fallback, bounded retries. Off = legacy behavior unchanged.
# MODEL_RECONFIRM_OWNER_CHAT_ID is a Cloudflare secret/var (fallback HYPE_JOB_DAILY_CHAT_ID); never hardcoded here.
MODEL_RECONFIRM_GUARD_V2 = "true"
MODEL_LIFF_PUBLISHED_ID = "2010864854-N34SgCqq"

# Owner-approved New Card 2026 source. One model rotates daily; campaign copy
# or art is sent only while its approved manifest entry remains current.
HYPE_COMPCARD_ENABLED = "true"
HYPE_COMPCARD_SEND_AT_ICT = "16:30"
HYPE_PROMOTION_ENABLED = "true"
HYPE_PROMOTION_SEND_AT_ICT = "20:00"

# Secrets: AUTH_SERVICE_EVENTS_TO_PAYMENTS, AUTH_SERVICE_EVENTS_TO_REALTIME,
# AUTH_SERVICE_EVENTS_TO_TELEGRAM, AUTH_SERVICE_ADMIN_TO_EVENTS
# ETA auth falls back to the existing CONFIRM_KEY until the dedicated service
# secret is provisioned on both admin-worker and events-worker.
# Reconfirm additionally needs MODEL_LINE_CHANNEL_ACCESS_TOKEN (or LINE_CHANNEL_ACCESS_TOKEN)
# plus the canonical Airtable Sessions/Models bindings.

# AIRTABLE_API_KEY remains a Cloudflare secret. Other optional table bindings,
# such as AIRTABLE_TABLE_CLIENTS and AIRTABLE_TABLE_ACTIVITY_LOGS, stay in dashboard config.

# Private receipts and immutable daily plans. Do not use the public model-asset bucket.
[[r2_buckets]]
binding = "HYPE_COMPCARD_STATE"
bucket_name = "mmd-hype-compcard-state"

[[services]]
binding = "TELEGRAM_ROUTER"
service = "telegram-worker"
