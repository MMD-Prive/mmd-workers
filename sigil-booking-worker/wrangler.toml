# sigil-booking-worker/wrangler.toml
# MMD Booking / SIGIL public booking resolver

name = "sigil-booking-worker"
main = "src/model-image-policy-worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Production API attachment for Webflow /sigil/booking.
# Keep these route patterns narrow. Do not capture all /sigil/api/* paths
# because other SIGIL/API owners may exist or be added later.
# Each pattern ends with * so requests with query strings still match.
[[routes]]
pattern = "sigil.mmdbkk.com/sigil/api/client/resolve*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "sigil.mmdbkk.com/sigil/api/models/search*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "sigil.mmdbkk.com/sigil/api/booking/intake*"
zone_name = "mmdbkk.com"

[vars]
ALLOWED_ORIGINS = "https://mmdbkk.com,https://www.mmdbkk.com,https://sigil.mmdbkk.com,https://mmdprive.com,https://www.mmdprive.com,https://mmdprive.webflow.io"
AIRTABLE_BASE_ID = "appsV1ILPRfIjkaYg"
WEB_BASE_URL = "https://mmdbkk.com"
PAY_URL = "/sigil/pay"
INME_URL = "/trust/inme"
INTERNAL_ADMIN_BOOKING_URL = "https://sigil.mmdbkk.com/internal/admin/console"
MODEL_PUBLIC_ASSET_BASE_URL = ""

# Telegram notification for new booking drafts
# MMD Prive & HYPE forum group, topic: MMD • Booking
TELEGRAM_NOTIFY_ENABLED = "true"
TELEGRAM_INTERNAL_SEND_URL = "https://telegram-worker.malemodel-bkk.workers.dev/telegram/internal/send"
TELEGRAM_BOOKING_CHAT_ID = "-1003546439681"
TG_THREAD_BOOKING_DRAFT = "1399"

# Airtable table IDs
AIRTABLE_TABLE_BOOKING_REQUESTS_ID = "tblQa2OK4U69eOCRF"
AIRTABLE_TABLE_MODELS_ID = "tblI4B0bI446vp9GX"
AIRTABLE_TABLE_MEMBERS_ID = "tblgWc5VRon5o8Mhk"
AIRTABLE_TABLE_MEMBER_PACKAGES_ID = "tblurt3GuKKiNjQAK"
AIRTABLE_TABLE_ENTITLEMENTS_ID = "tblNImdF9PKAxhXGi"

# Optional R2 lookup for object-exists checks. Public URLs still come from Airtable
# Public Image URL or MODEL_PUBLIC_ASSET_BASE_URL + primary_image_key.
[[r2_buckets]]
binding = "MMD_MODEL_ASSETS"
bucket_name = "mmd-models"

# ---- Secrets ----
# AIRTABLE_API_KEY
# INTERNAL_TOKEN optional for telegram-worker auth
# CONFIRM_KEY optional for telegram-worker auth
