name = "sigil-worker"
main = "src/index-with-public-model-notify.js"
compatibility_date = "2026-06-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# No custom routes are declared here on purpose.
# Cloudflare API is currently rejecting route updates for this worker at /workers/scripts/sigil-worker/routes.
# Keeping routes out of wrangler.toml allows deploys to succeed through workers.dev.
# Temporary public Complaint Evidence intake URL:
# https://sigil-worker.malemodel-bkk.workers.dev/member/api/recovery/complaint-evidence
#
# When the Cloudflare route conflict is cleared manually, add the custom route back:
# routes = [
#   { pattern = "sigil.mmdbkk.com/member/api/recovery/*", zone_name = "mmdbkk.com" }
# ]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
WORKER_NAME = "sigil-worker"
ALLOWED_ORIGINS = "https://mmdbkk.com,https://www.mmdbkk.com,https://sigil.mmdbkk.com,https://mmdprive.webflow.io"
PUBLIC_MODEL_ENABLED = "true"
PUBLIC_MODEL_UPLOAD_ENABLED = "true"
PUBLIC_MODEL_UPLOAD_REQUIRED = "false"
PUBLIC_MODEL_REVIEW_BASE_URL = "https://mmdbkk.com/internal/admin/model-applications"
TELEGRAM_CHAT_ID = "-1003546439681"
TELEGRAM_PUBLIC_MODEL_THREAD_ID = "155"
TG_THREAD_CONFIRM = "61"

# Do not put secrets here.
# TELEGRAM_BOT_TOKEN remains a Cloudflare Worker secret.
# Public Model notifications use the existing Telegram group TELEGRAM_CHAT_ID and MUST
# target TELEGRAM_PUBLIC_MODEL_THREAD_ID. Current Public Model topic candidate: 155.
# There is intentionally no fallback from TELEGRAM_PUBLIC_MODEL_THREAD_ID to
# TELEGRAM_ADMIN_THREAD_ID or TG_THREAD_CONFIRM, so an application cannot land in
# Payments (Confirm) by accident. TELEGRAM_PUBLIC_MODEL_CHAT_ID may be set later only
# if Public Model is moved to a separate Telegram chat.
# Board queue reads are read-only:
# - SIGIL_BOARD_QUEUE_JSON as non-secret JSON for smoke/dev only
# - SIGIL_BOARD_KV production key: sigil:board:v1:cards
# - SIGIL_BOARD_KV optional meta key: sigil:board:v1:meta
#
# Production complaint evidence metadata:
# - Bind SIGIL_COMPLAINT_KV in Cloudflare for dedicated complaint case storage.
# - SIGIL_RECOVERY_KV can be bound as fallback shared recovery storage.
# - COMPLAINT_GOOGLE_DRIVE_WEBHOOK_URL and COMPLAINT_TELEGRAM_WEBHOOK_URL are optional secrets.

[[kv_namespaces]]
binding = "SIGIL_BOARD_KV"
id = "7922350083a644db8a48c16c7e48fca7"
preview_id = "f673c4ab6e4f456baefeab032564db72"

[[r2_buckets]]
binding = "PUBLIC_MODEL_UPLOADS_R2"
bucket_name = "mmd-private-public-model-uploads"

[[durable_objects.bindings]]
name = "PUBLIC_MODEL_COORDINATOR"
class_name = "PublicModelCoordinator"

[[migrations]]
tag = "public-model-coordinator-v1"
new_sqlite_classes = ["PublicModelCoordinator"]
