name = "sigil-worker"
main = "src/index.js"
compatibility_date = "2026-06-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Stable production triggers that Cloudflare currently accepts for this worker.
# Complaint Evidence intake is available through workers.dev until the blocked custom route
# sigil.mmdbkk.com/member/api/recovery/* is added manually in Cloudflare or the route conflict is cleared.
routes = [
  { pattern = "sigil.mmdbkk.com/api/sigil/models/search*", zone_name = "mmdbkk.com" },
  { pattern = "sigil.mmdbkk.com/api/sigil/models/new-arrivals*", zone_name = "mmdbkk.com" },
  { pattern = "www.mmdbkk.com/v1/sigil/board/*", zone_name = "mmdbkk.com" },
  { pattern = "mmdbkk.com/v1/sigil/board/*", zone_name = "mmdbkk.com" }
]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
WORKER_NAME = "sigil-worker"
ALLOWED_ORIGINS = "https://mmdbkk.com,https://www.mmdbkk.com,https://sigil.mmdbkk.com,https://mmdprive.webflow.io"

# Do not put secrets here.
# Board queue reads are read-only:
# - SIGIL_BOARD_QUEUE_JSON as non-secret JSON for smoke/dev only
# - SIGIL_BOARD_KV production key: sigil:board:v1:cards
# - SIGIL_BOARD_KV optional meta key: sigil:board:v1:meta
#
# Production complaint evidence metadata:
# - Bind SIGIL_COMPLAINT_KV in Cloudflare for dedicated complaint case storage.
# - SIGIL_RECOVERY_KV can be bound as fallback shared recovery storage.
# - COMPLAINT_GOOGLE_DRIVE_WEBHOOK_URL and COMPLAINT_TELEGRAM_WEBHOOK_URL are optional secrets.
# - Temporary public intake URL while custom route is blocked:
#   https://sigil-worker.malemodel-bkk.workers.dev/member/api/recovery/complaint-evidence

[[kv_namespaces]]
binding = "SIGIL_BOARD_KV"
id = "7922350083a644db8a48c16c7e48fca7"
preview_id = "f673c4ab6e4f456baefeab032564db72"
