name = "member-dashboard-chat-worker"
main = "src/index.js"
compatibility_date = "2026-07-02"
workers_dev = false

[observability]
enabled = true

[[routes]]
pattern = "mmdbkk.com/webhooks/line"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/webhooks/line/"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/webhooks/line"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/webhooks/line/"
zone_name = "mmdbkk.com"

# Bind LINE_CHANNEL_ACCESS_TOKEN, LINE_CHANNEL_SECRET, INTERNAL_TOKEN, and CONFIRM_KEY as Cloudflare secrets only.
