name = "member-dashboard-chat-worker"
main = "src/mms-line-front-gate.js"
compatibility_date = "2026-07-02"
workers_dev = false

[[services]]
binding = "MEMBER_PAGES_WORKER"
service = "member-pages-worker"

[[services]]
binding = "ADMIN_WORKER"
service = "admin-worker"

[[services]]
binding = "AI_WORKER"
service = "ai-worker"

[[services]]
binding = "MMS_WORKER"
service = "mms-worker"

[[r2_buckets]]
binding = "LINE_SLIP_EVIDENCE"
bucket_name = "mmd-line-slip-evidence"

# Canonical renewal page. These specific routes win before the generic front
# gate and keep the full query string available to the local renderer.
[[routes]]
pattern = "mmdbkk.com/pay/renewal*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/pay/renewal*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "sigil.mmdbkk.com/pay/renewal*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/sigil/pay/renewal*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/sigil/pay/renewal*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "sigil.mmdbkk.com/sigil/pay/renewal*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/member/api/liff/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/member/api/liff/*"
zone_name = "mmdbkk.com"

# Public Birthday Wish is intentionally outside the LIFF prefix. The public
# front gate owns these routes and delegates to member-pages-worker through the
# service binding. Benefits remain separately verified through LINE/LIFF.
[[routes]]
pattern = "mmdbkk.com/member/api/care-back/public-wish*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/member/api/care-back/public-wish*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/member/api/care-back/link-wish*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/member/api/care-back/link-wish*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/api/member/dashboard*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/api/member/dashboard*"
zone_name = "mmdbkk.com"

# My MMD behavior/data BFF. The Lovable app is presentation only; every live
# member read remains same-origin and delegates through member-pages-worker so
# points, membership, entitlement and coupon truth never move into the browser.
[[routes]]
pattern = "mmdbkk.com/api/member/app/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/api/member/app/*"
zone_name = "mmdbkk.com"

# MMS Therapist auth is a separate role-scoped identity surface. The public
# same-origin route is owned by this front gate and delegated only to mms-worker.
[[routes]]
pattern = "mmdbkk.com/male-massage/therapists/api/auth/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/male-massage/therapists/api/auth/*"
zone_name = "mmdbkk.com"

# Canonical My MMD customer application. Lovable owns presentation; this Worker
# owns the custom-domain route, strips member credentials before fetching the
# Lovable app, republishes its assets same-origin, and keeps all behavior on the
# MMD Worker/API stack.
[[routes]]
pattern = "mmdbkk.com/my-mmd*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/my-mmd*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/my-mmd-assets/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/my-mmd-assets/*"
zone_name = "mmdbkk.com"

# Legacy My MMD address remains Worker-owned only to provide a bounded 308
# compatibility redirect into /my-mmd/. It is no longer a canonical app route.
[[routes]]
pattern = "mmdbkk.com/member/my-mmd*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/member/my-mmd*"
zone_name = "mmdbkk.com"

# Legacy asset prefix remains owned during the migration window so stale cached
# bundles cannot fall through to Webflow. New app HTML never emits this prefix.
[[routes]]
pattern = "mmdbkk.com/member/my-mmd-assets/*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/member/my-mmd-assets/*"
zone_name = "mmdbkk.com"

# Cloudflare route matching includes the query string. The trailing wildcard
# is required for CARE BACK URLs such as /member/liff?intent=promo.
# Runtime routing still accepts only /member/liff and /member/liff/.
[[routes]]
pattern = "mmdbkk.com/member/liff*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/member/liff*"
zone_name = "mmdbkk.com"

[observability]
enabled = true

# MMD Privé LINE OA transport.
[[routes]]
pattern = "mmdbkk.com/webhooks/line"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/webhooks/line/"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/webhooks/line"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/webhooks/line/"
zone_name = "mmdbkk.com"

# MMS / Male Massage has a separate LINE OA and separate transport credentials.
# Never reuse the MMD Privé LINE secret/token for these routes.
[[routes]]
pattern = "mmdbkk.com/webhooks/line/mms"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "mmdbkk.com/webhooks/line/mms/"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/webhooks/line/mms"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/webhooks/line/mms/"
zone_name = "mmdbkk.com"

# Cloudflare-only LINE runtime.
# MMD secrets: LINE_CHANNEL_ACCESS_TOKEN, LINE_CHANNEL_SECRET, INTERNAL_TOKEN.
# MMS secrets: MMS_LINE_CHANNEL_ACCESS_TOKEN, MMS_LINE_CHANNEL_SECRET.
# LINE_WEBHOOK_UPSTREAM_URL is retired and must remain unset.
[vars]
LINE_AUTO_REPLY_ENABLED = "true"
LINE_KENJI_AI_ENABLED = "true"
LINE_KENJI_KNOWLEDGE_ENABLED = "true"
KENJI_AI_WORKER_BRIDGE_ENABLED = "true"
KENJI_LINE_CREW_SOURCE_IDS = ""
LINE_PAYMENT_PROOF_GROUP_HASHES = "7cb8cf05c7e2ec9489d6ec9560de60fade231412f9dd82b89a7e51b58eba996f"
LINE_SLIP_MAX_IMAGE_BYTES = "10485760"
AIRTABLE_TABLE_PAYMENT_PROOFS_ID = "tblfJfM4Sqag9zrLi"
LINE_KENJI_MODEL_ENABLED = "false"
LINE_KENJI_MODEL_ACCESS_ENABLED = "false"
OPENAI_MODEL = "gpt-5.6"
LINE_KENJI_MODEL_CANARY_HASHES = ""
LINE_KENJI_MODEL_KNOWLEDGE_IDS = ""
LINE_KENJI_MODEL_MAX_ATTEMPTS_PER_WINDOW = "3"
LINE_KENJI_MODEL_QUOTA_WINDOW_SECONDS = "900"

# MMS customer LINE OA: 24/7 customer front door. The menu remains visible;
# operational confirmation is asynchronous and still owned by canonical MMS state.
MMS_LINE_AI_ENABLED = "true"
MMS_RICH_MENU_ENABLED = "true"
MMS_RICH_MENU_VISIBILITY = "24/7"
MMS_RICH_MENU_IMAGE_URL = "https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6a9e734844dc373650988c84_MMS-Rich-Menu-Customer-24-7-final.jpg"

[[durable_objects.bindings]]
name = "KENJI_MODEL_DEDUPE"
class_name = "KenjiModelIdempotency"

[[migrations]]
tag = "v1-kenji-model-idempotency"
new_sqlite_classes = ["KenjiModelIdempotency"]

# Full CARE BACK staging front gate. No production routes are inherited into
# named environments; this Worker is reachable only on its workers.dev URL.
[env.staging]
name = "member-dashboard-chat-worker-staging"
workers_dev = true
routes = []

[[env.staging.services]]
binding = "MEMBER_PAGES_WORKER"
service = "member-pages-worker-staging"

[env.staging.observability]
enabled = true
