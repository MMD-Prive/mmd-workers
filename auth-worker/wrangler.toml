name = "mmd-auth-worker"
main = "src/operator-payment-runtime-index.js"
compatibility_date = "2026-01-20"

[triggers]
crons = ["7 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://mmdbkk.com,https://mmdprive.webflow.io,https://mmdprive.com"
WEB_BASE_URL = "https://mmdbkk.com"
COOKIE_DOMAIN = ".mmdbkk.com"
AUTH_COOKIE_NAME = "mmd_auth"
AUTH_SESSION_TTL_DAYS = "30"
AUTH_CODE_TTL_MINUTES = "10"
AUTH_CODE_LENGTH = "6"
AUTH_MAX_CODE_ATTEMPTS = "5"
LIFECYCLE_RECONCILIATION_ENABLED = "true"
LIFECYCLE_RECONCILIATION_MAX_MEMBERS = "500"

AIRTABLE_TABLE_MEMBERS = "Members"
AIRTABLE_TABLE_MEMBER_PACKAGES = "member_packages"
AIRTABLE_TABLE_PACKAGES = "packages"
AIRTABLE_TABLE_PAYMENTS = "Payments"
AIRTABLE_TABLE_SESSIONS = "Sessions"
AIRTABLE_TABLE_POINTS_LEDGER = "MMD — Points Ledger"
AIRTABLE_TABLE_MEMBER_ENTITLEMENTS = "MMD — Member Entitlements"
AIRTABLE_TABLE_ACCESS_LOG = "System — Access Log"
AIRTABLE_TABLE_AUTH_IDENTITIES = "MMD — Auth Identities"
AIRTABLE_TABLE_AUTH_LOGIN_CODES = "MMD — Auth Login Codes"
AIRTABLE_TABLE_AUTH_SESSIONS = "MMD — Auth Sessions"

# Members summary is compatibility/readback only. Entitlement decisions come from
# MMD — Member Entitlements through my_mmd_entitlement_resolver_v1.
AIRTABLE_MEMBERS_LINE_USER_ID_FIELD = "line_id"
AIRTABLE_MEMBERS_DISPLAY_NAME_FIELD = "Full Name (Display)"
AIRTABLE_MEMBERS_NAME_FIELD = "Full Name"
AIRTABLE_MEMBERS_EMAIL_FIELD = "Contact Email"
AIRTABLE_MEMBERS_TIER_FIELD = "Membership Tier"
AIRTABLE_MEMBERS_STATUS_FIELD = "Membership Status"
AIRTABLE_MEMBERS_POINTS_FIELD = "Points Balance"
AIRTABLE_MEMBERS_EXPIRY_FIELD = "Membership Expiry"
AIRTABLE_MEMBERS_END_DATE_FIELD = "Membership End Date"
AIRTABLE_MEMBERS_EXPIRE_AT_FIELD = "Expire At"

AIRTABLE_CLIENTS_LINE_USER_ID_FIELD = "line_user_id"
AIRTABLE_CLIENTS_EMAIL_FIELDS = "Contact Email,email"
AIRTABLE_SESSIONS_LINE_USER_ID_FIELD = "line_user_id"
AIRTABLE_SESSIONS_EMAIL_FIELD = "email"
AIRTABLE_SESSIONS_HISTORY_DATE_FIELD = "job_date"
AIRTABLE_SESSIONS_STATUS_FIELD = "Session Status"
AIRTABLE_SESSIONS_SERVICE_TYPE_FIELD = "job_type"
AIRTABLE_MEMBER_PACKAGES_EMAIL_FIELD = "member_email"
AIRTABLE_MEMBER_PACKAGES_CREATED_FIELD = "created_at"
AIRTABLE_POINTS_EMAIL_FIELD = "member_email"
AIRTABLE_POINTS_HISTORY_DATE_FIELD = "created_at"
AIRTABLE_PAYMENTS_EMAIL_FIELD = "Member Email"
AIRTABLE_PAYMENTS_STATUS_FIELD = "Payment Status"
AIRTABLE_PAYMENTS_INTENT_FIELD = "Payment Intent Status"
AIRTABLE_PAYMENTS_VERIFICATION_FIELD = "Verification Status"
AIRTABLE_PAYMENTS_DATE_FIELD = "Payment Date"
AIRTABLE_PAYMENTS_CREATED_FIELD = "Created At"
AIRTABLE_PAYMENTS_UPDATED_FIELD = "Updated At"

AIRTABLE_ENTITLEMENT_MEMBERSTACK_ID_FIELD = "memberstack_id"
AIRTABLE_ENTITLEMENT_MEMBER_EMAIL_FIELD = "member_email"
AIRTABLE_ENTITLEMENT_TELEGRAM_USER_ID_FIELD = "telegram_user_id"
AIRTABLE_ENTITLEMENT_TELEGRAM_USERNAME_FIELD = "telegram_username"
AIRTABLE_ENTITLEMENT_LINE_USER_ID_FIELD = "line_user_id"
AIRTABLE_ENTITLEMENT_ACCESS_STATUS_FIELDS = "access_status"
AIRTABLE_ENTITLEMENT_MEMBER_STATUS_FIELDS = "member_lifecycle_status,member_status"
AIRTABLE_ENTITLEMENT_ACTIVE_VALUES = "active,grace"
AIRTABLE_ENTITLEMENT_BLOCKED_MEMBER_STATUS_VALUES = "inactive,blocked,suspended,revoked"
AIRTABLE_ENTITLEMENT_RESOURCE_FIELDS = "resource_key,access_key,capability,package_code"
AIRTABLE_ENTITLEMENT_TIER_FIELDS = "capability,min_tier,tier,package_code"
AIRTABLE_ENTITLEMENT_EXPIRES_AT_FIELDS = "expire_at"

AIRTABLE_ACCESS_LOG_EVENT_ID_FIELD = "Event ID"
AIRTABLE_ACCESS_LOG_ACTION_FIELD = "Action"
AIRTABLE_ACCESS_LOG_RESULT_FIELD = "Result"
AIRTABLE_ACCESS_LOG_MEMBER_FIELD = ""
AIRTABLE_ACCESS_LOG_METADATA_FIELD = ""
AIRTABLE_ACCESS_LOG_IP_HASH_FIELD = ""
AIRTABLE_ACCESS_LOG_USER_AGENT_FIELD = ""
AIRTABLE_ACCESS_LOG_CREATED_AT_FIELD = ""

LOGIN_PATH = "/login"
DENIED_PATH = "/membership/upgrade-required"
EXPIRED_PATH = "/membership/renewal"
MMD_AUTH_DEV_MODE = "false"
MEMBER_STATUS_AIRTABLE_TIMEOUT_MS = "10000"

# Required secrets:
# AIRTABLE_API_KEY
# AIRTABLE_BASE_ID
# AUTH_HMAC_SECRET
# ADMIN_BEARER
# MEMBER_STATUS_RESOLVER_SECRET
# AUTH_RECONCILE_SECRET
# AUTH_SERVICE_AUTH_TO_TELEGRAM
# AUTH_SERVICE_AUTH_TO_MEMBER_PAGES
# AUTH_SERVICE_LOVABLE_TO_AUTH

[[services]]
binding = "TELEGRAM_ACCESS_RECONCILER"
service = "telegram-worker"

[[services]]
binding = "DRIVE_ACCESS_RECONCILER"
service = "member-pages-worker"

[env.staging]
name = "mmd-auth-worker-staging"
workers_dev = false

[env.staging.vars]
AIRTABLE_API_KEY = "synthetic-staging-only"
AIRTABLE_BASE_ID = "app_auth_staging_fixture"
AIRTABLE_TABLE_MEMBERS = "Members"
AIRTABLE_TABLE_MEMBER_PACKAGES = "member_packages"
AIRTABLE_TABLE_PAYMENTS = "Payments"
AIRTABLE_TABLE_SESSIONS = "Sessions"
AIRTABLE_TABLE_POINTS_LEDGER = "MMD — Points Ledger"
AIRTABLE_TABLE_MEMBER_ENTITLEMENTS = "MMD — Member Entitlements"
AIRTABLE_MEMBERS_LINE_USER_ID_FIELD = "line_id"
AIRTABLE_MEMBERS_DISPLAY_NAME_FIELD = "Full Name (Display)"
AIRTABLE_MEMBERS_EMAIL_FIELD = "Contact Email"
AIRTABLE_CLIENTS_LINE_USER_ID_FIELD = "line_user_id"
AIRTABLE_CLIENTS_EMAIL_FIELDS = "Contact Email,email"
AIRTABLE_SESSIONS_LINE_USER_ID_FIELD = "line_user_id"
AIRTABLE_SESSIONS_EMAIL_FIELD = "email"
AIRTABLE_SESSIONS_HISTORY_DATE_FIELD = "job_date"
AIRTABLE_SESSIONS_STATUS_FIELD = "Session Status"
AIRTABLE_SESSIONS_SERVICE_TYPE_FIELD = "job_type"
AIRTABLE_MEMBER_PACKAGES_EMAIL_FIELD = "member_email"
AIRTABLE_MEMBER_PACKAGES_CREATED_FIELD = "created_at"
AIRTABLE_POINTS_EMAIL_FIELD = "member_email"
AIRTABLE_POINTS_HISTORY_DATE_FIELD = "created_at"
AIRTABLE_PAYMENTS_EMAIL_FIELD = "Member Email"
AIRTABLE_PAYMENTS_STATUS_FIELD = "Payment Status"
AIRTABLE_PAYMENTS_VERIFICATION_FIELD = "Verification Status"
AIRTABLE_PAYMENTS_DATE_FIELD = "Payment Date"
AIRTABLE_PAYMENTS_CREATED_FIELD = "Created At"
AIRTABLE_PAYMENTS_UPDATED_FIELD = "Updated At"
AIRTABLE_ENTITLEMENT_MEMBER_EMAIL_FIELD = "member_email"
AIRTABLE_ENTITLEMENT_LINE_USER_ID_FIELD = "line_user_id"
AIRTABLE_ENTITLEMENT_MEMBER_STATUS_FIELDS = "member_lifecycle_status,member_status"
MEMBER_STATUS_AIRTABLE_TIMEOUT_MS = "10000"
LIFECYCLE_RECONCILIATION_ENABLED = "false"

[[env.staging.services]]
binding = "AIRTABLE_HTTP"
service = "auth-staging-airtable-fixtures-worker-staging"
