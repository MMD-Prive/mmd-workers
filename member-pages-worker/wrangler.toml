name = "member-pages-worker"
main = "src/index.js"
compatibility_date = "2026-06-20"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# Promotion Claim bridge. Bind LINE_ID_HASH_SECRET and INTERNAL_SERVICE_SECRET as secrets.
# MEMBER_STATUS_RESOLVER must resolve a verified LINE subject to an immutable member snapshot.
[[services]]
binding = "PROMOTION_WORKER"
service = "promotion-worker"
