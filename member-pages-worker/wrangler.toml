name = "member-pages-worker"
main = "src/index.js"
compatibility_date = "2026-06-20"
workers_dev = true

routes = [
  { pattern = "mmdbkk.com/member/api/liff/*", zone_name = "mmdbkk.com" },
  # Repo-only declaration for the approved same-site LIFF shell. Do not deploy
  # until LINE_LIFF_ID and the remaining LIFF live gates are explicitly cleared.
  # The trailing wildcard is required so query-string entry URLs also match.
  { pattern = "mmdbkk.com/member/liff*", zone_name = "mmdbkk.com" }
]

[vars]
LIFF_VERIFY_TIMEOUT_MS = "5000"
LIFF_MEMBER_RESOLVER_TIMEOUT_MS = "5000"
LINE_ID_TOKEN_VERIFY_URL = "https://api.line.me/oauth2/v2.1/verify"

[[kv_namespaces]]
binding = "LIFF_IDENTITY_KV"
id = "12f4c4e7357d4019b5e0951be0b984f5"

[[services]]
binding = "MEMBER_STATUS_RESOLVER"
service = "mmd-auth-worker"

# Required before deployment:
# - public var LINE_LIFF_ID for the approved LIFF app endpoint
# - secret LINE_LOGIN_CHANNEL_ID
# - secret LIFF_SESSION_SECRET
# - secret MEMBER_STATUS_RESOLVER_SECRET (same value in mmd-auth-worker)
# - service binding MEMBER_STATUS_RESOLVER -> mmd-auth-worker
#
# These exact routes have precedence over the member catch-all in
# mmd-redirect-worker. Do not add www routes without confirming www is an API host.

[observability]
enabled = true
head_sampling_rate = 1
