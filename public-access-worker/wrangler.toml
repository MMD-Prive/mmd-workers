name = "public-access-worker"
main = "src/index.js"
compatibility_date = "2026-07-18"

routes = [
  { pattern = "sigil.mmdbkk.com/public/api/*", zone_name = "mmdbkk.com" }
]

[[r2_buckets]]
binding = "mmd_public_access_evidence"
bucket_name = "mmd-public-access-evidence"

[vars]
ALLOWED_ORIGINS = "https://mmdbkk.com,https://www.mmdbkk.com,https://mmdprive.webflow.io"
AIRTABLE_TABLE_PUBLIC_ACCESS_REQUESTS = "Public Access Requests"
PUBLIC_ACCESS_ADMIN_URL = "https://sigil.mmdbkk.com/internal/admin/console"

# Secrets — do not commit:
# AIRTABLE_API_KEY
# TELEGRAM_INTERNAL_TOKEN
# TELEGRAM_INTERNAL_SEND_URL
# TELEGRAM_PUBLIC_ACCESS_CHAT_ID
