name: Payments Confirm Link CI

on:
  pull_request:
    paths:
      - "payments-worker/**"
      - ".github/workflows/payments-confirm-link-ci.yml"
      - ".github/workflows/deploy-payments-worker.yml"

permissions:
  contents: read

jobs:
  canonical-confirm-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate canonical confirm-link contract
        shell: bash
        run: |
          set -euo pipefail
          node --check payments-worker/canonical-confirm-link.js
          node --check payments-worker/index.review-wrapper.js
          node --test payments-worker/canonical-confirm-link.test.mjs
          node --test payments-worker/session-finance-write.test.mjs
          node payments-worker/payment-confirmation-token.test.mjs
          npx --yes wrangler@4 versions upload --dry-run --keep-vars --config payments-worker/wrangler.merged.toml
