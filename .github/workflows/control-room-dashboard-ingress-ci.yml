name: Control Room Dashboard Ingress CI

on:
  pull_request:
    paths:
      - "immigrate-worker/**"
      - "admin-worker/src/admin-login-hero-worker.js"
      - ".github/workflows/control-room-dashboard-ingress-ci.yml"
      - ".github/workflows/sync-control-room-dashboard-ingress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: immigrate-worker/package-lock.json

      - name: Install immigrate-worker dependencies
        run: npm ci --prefix immigrate-worker

      - name: Run immigrate-worker contracts
        run: |
          set -euo pipefail
          npm test --prefix immigrate-worker
          npm run typecheck --prefix immigrate-worker

      - name: Verify Control Room dashboard entrypoint and routes
        run: |
          set -euo pipefail
          grep -F 'main = "src/control-room-dashboard-ingress-wrapper.ts"' immigrate-worker/wrangler.toml
          grep -F 'pattern = "mmdbkk.com/v1/admin/dashboard*"' immigrate-worker/wrangler.toml
          grep -F 'pattern = "www.mmdbkk.com/v1/admin/dashboard*"' immigrate-worker/wrangler.toml
          grep -F 'env.ADMIN_WORKER.fetch(forwarded)' immigrate-worker/src/control-room-dashboard-ingress-wrapper.ts
          grep -F 'headers.delete("authorization")' immigrate-worker/src/control-room-dashboard-ingress-wrapper.ts
          grep -F 'headers.delete("x-confirm-key")' immigrate-worker/src/control-room-dashboard-ingress-wrapper.ts

      - name: Wrangler dry run
        working-directory: immigrate-worker
        run: npx --yes wrangler@4.128.0 versions upload --dry-run --keep-vars
