name: Control Room Dashboard Ingress CI

on:
  pull_request:
    paths:
      - "immigrate-worker/**"
      - "admin-worker/src/create-session-client-lineage-runtime.js"
      - "admin-worker/create-session-client-lineage-runtime.test.mjs"
      - "admin-worker/create-session-remembered-name-priority.test.mjs"
      - "admin-worker/src/admin-login-hero-worker.js"
      - "admin-worker/src/dashboard-worker.js"
      - "admin-worker/src/payment-review-runtime.js"
      - "admin-worker/src/historical-slip-backfill-runtime.js"
      - "admin-worker/dashboard-canonical-payment-counts.test.mjs"
      - ".github/workflows/control-room-dashboard-ingress-ci.yml"
      - ".github/workflows/sync-control-room-dashboard-ingress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: immigrate-worker/package-lock.json

      - name: Install immigrate-worker dependencies
        run: npm ci --prefix immigrate-worker

      - name: Run immigrate-worker contracts
        run: |
          set -euo pipefail
          npm test --prefix immigrate-worker

      - name: Verify canonical dashboard payment counts
        run: |
          set -euo pipefail
          node --check admin-worker/src/dashboard-worker.js
          node --experimental-global-webcrypto --test admin-worker/dashboard-canonical-payment-counts.test.mjs
          grep -F 'loadCanonicalPaymentReviewQueue(env)' admin-worker/src/dashboard-worker.js
          grep -F 'loadCanonicalHistoricalQueue(env)' admin-worker/src/dashboard-worker.js
          grep -F 'payment_review: paymentQueue.length' admin-worker/src/dashboard-worker.js
          grep -F 'historical_recovery: historicalPending.length' admin-worker/src/dashboard-worker.js
          grep -F 'href: "/internal/admin/payments/historical-backfill"' admin-worker/src/dashboard-worker.js

      - name: Verify Control Room dashboard entrypoint and routes
        run: |
          set -euo pipefail
          grep -F 'main = "src/customer-360-live-ingress-wrapper.ts"' immigrate-worker/wrangler.toml
          grep -F 'import canonicalWorker from "./control-room-dashboard-ingress-wrapper"' immigrate-worker/src/customer-360-live-ingress-wrapper.ts
          grep -F 'pattern = "mmdbkk.com/v1/admin/dashboard*"' immigrate-worker/wrangler.toml
          grep -F 'pattern = "www.mmdbkk.com/v1/admin/dashboard*"' immigrate-worker/wrangler.toml
          grep -F 'env.ADMIN_WORKER.fetch(forwarded)' immigrate-worker/src/control-room-dashboard-ingress-wrapper.ts
          grep -F 'headers.delete("authorization")' immigrate-worker/src/control-room-dashboard-ingress-wrapper.ts
          grep -F 'headers.delete("x-confirm-key")' immigrate-worker/src/control-room-dashboard-ingress-wrapper.ts

      - name: Wrangler dry run
        working-directory: immigrate-worker
        run: npx --yes wrangler@4.128.0 versions upload --dry-run --keep-vars
