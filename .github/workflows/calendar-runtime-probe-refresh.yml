name: Calendar Runtime Probe Refresh
on:
  push:
    branches: [fix/calendar-runtime-probes-20260914]
    paths: ['.github/workflows/calendar-runtime-probe-refresh.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-runtime-probes-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align Calendar surface and endpoint-specific API version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-worker/src/admin-calendar-visibility.test.mjs')
          s=p.read_text().replace("'admin-worker-v1.2'","'admin-worker-v1.3'")
          p.write_text(s)
          p=Path('tools/calendar-production-connection.mjs')
          s=p.read_text()
          s=s.replace("admin-worker-v1.2","admin-worker-v1.3")
          s=s.replace("'cal-api-version':'2026-02-25'","'cal-api-version':'2024-06-14'")
          p.write_text(s)
          PY
          node --check admin-worker/src/admin-calendar-visibility.js
          node --check tools/calendar-production-connection.mjs
          node --test admin-worker/src/admin-calendar-service-binding.test.mjs admin-worker/src/admin-calendar-visibility.test.mjs admin-worker/src/admin-calendar-runtime.test.mjs
          grep -Fq 'admin-worker-v1.3' tools/calendar-production-connection.mjs
          grep -Fq "'cal-api-version':'2024-06-14'" tools/calendar-production-connection.mjs
      - name: Commit aligned runtime checks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-worker/src/admin-calendar-visibility.test.mjs tools/calendar-production-connection.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(calendar): align v1.3 runtime probes'
          git push origin HEAD:fix/calendar-runtime-probes-20260914
