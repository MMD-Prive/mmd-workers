name: Apply Renewal Expiry Resolver V5

on:
  push:
    branches:
      - feat/renewal-expiry-resolver-v5-20260911
    paths:
      - scripts/apply-renewal-expiry-resolver-v5.mjs
      - scripts/fix-renewal-expiry-v5-test.mjs
      - .github/workflows/apply-renewal-expiry-v5.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/renewal-expiry-resolver-v5-20260911
      - name: Apply V5 codemod
        run: node scripts/apply-renewal-expiry-resolver-v5.mjs
      - name: Harden V5 contract assertions
        run: node scripts/fix-renewal-expiry-v5-test.mjs
      - name: Install immigrate-worker dependencies
        run: npm ci --prefix immigrate-worker
      - name: Focused typecheck for V5 files
        working-directory: immigrate-worker
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --skipLibCheck --types @cloudflare/workers-types src/lib/airtable.ts src/types.ts
      - name: Run focused V5 contract test
        run: node --test immigrate-worker/test/renewal-expiry-resolver-v5-contract.test.mjs
      - name: Remove one-shot codemod files
        run: |
          rm -f scripts/apply-renewal-expiry-resolver-v5.mjs
          rm -f scripts/fix-renewal-expiry-v5-test.mjs
          rm -f .github/workflows/apply-renewal-expiry-v5.yml
      - name: Commit verified V5 implementation
        run: |
          git config user.name "MMD Privé"
          git config user.email "malemodel.bkk@gmail.com"
          git add -A
          git commit -m "feat(renewal): add resolver-aware expiry fallback v5"
          git push origin HEAD:feat/renewal-expiry-resolver-v5-20260911
