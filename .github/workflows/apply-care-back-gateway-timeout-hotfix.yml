name: Apply CARE BACK gateway timeout hotfix

on:
  push:
    branches:
      - hotfix/care-back-member-resolver-v7-1
    paths:
      - .github/workflows/apply-care-back-gateway-timeout-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/care-back-member-resolver-v7-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply bounded gateway timeout hotfix
        run: python3 scripts/apply-care-back-gateway-timeout-hotfix.py
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix member-pages-worker/test-runtime
      - name: Run focused regression
        run: |
          npm run test:member-pages-liff
          npm run test:member-dashboard-liff
          npm run check:care-back-staging
          npm run test:care-back-staging-fixtures
          npm run check:member-pages-wrangler
          git diff --check
      - name: Commit tested hotfix
        shell: bash
        run: |
          rm .github/workflows/apply-care-back-gateway-timeout-hotfix.yml
          rm scripts/apply-care-back-gateway-timeout-hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(liff): extend bounded gateway Airtable timeout"
          git push origin HEAD:hotfix/care-back-member-resolver-v7-1
