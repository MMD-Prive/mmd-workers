name: Finalize Public Model review wiring

on:
  push:
    branches:
      - fix/public-model-application-review
    paths:
      - ".github/workflows/public-model-review-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/public-model-application-review
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Patch canonical deployment wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          wrangler = Path("admin-worker/wrangler.toml")
          text = wrangler.read_text()
          route_block = '''# Public Model application review. The page, review API, decision endpoint and
          # private media proxy all stay behind the credential-bound admin gate.
          [[routes]]
          pattern = "mmdbkk.com/internal/admin/model-applications*"
          zone_name = "mmdbkk.com"

          [[routes]]
          pattern = "www.mmdbkk.com/internal/admin/model-applications*"
          zone_name = "mmdbkk.com"

          [[routes]]
          pattern = "mmdbkk.com/v1/admin/model-applications*"
          zone_name = "mmdbkk.com"

          [[routes]]
          pattern = "www.mmdbkk.com/v1/admin/model-applications*"
          zone_name = "mmdbkk.com"

          '''
          marker = "# MMS team operations console. Keep this namespace exact and narrow."
          if 'mmdbkk.com/internal/admin/model-applications*' not in text:
              if marker not in text:
                  raise SystemExit("admin review route insertion marker not found")
              text = text.replace(marker, route_block + marker, 1)

          r2_block = '''
          [[r2_buckets]]
          binding = "PUBLIC_MODEL_UPLOADS_R2"
          bucket_name = "mmd-private-public-model-uploads"
          '''
          if 'binding = "PUBLIC_MODEL_UPLOADS_R2"' not in text:
              anchor = '[[r2_buckets]]\nbinding = "MMD_MODEL_ASSETS"\nbucket_name = "mmd-models"\n'
              if anchor not in text:
                  raise SystemExit("admin R2 insertion marker not found")
              text = text.replace(anchor, anchor + r2_block, 1)
          wrangler.write_text(text)

          deploy = Path(".github/workflows/deploy-admin-worker.yml")
          text = deploy.read_text()
          if "node --check src/public-model-application-review.js" not in text:
              anchor = "          node --check src/mms-admin-runtime.js\n"
              if anchor not in text:
                  raise SystemExit("deploy source-check marker not found")
              text = text.replace(anchor, anchor + "          node --check src/public-model-application-review.js\n", 1)
          if "public-model-application-review.test.mjs" not in text:
              anchor = "            mms-admin-session-bounce.test.mjs \\\n"
              if anchor not in text:
                  raise SystemExit("deploy test-list marker not found")
              text = text.replace(anchor, anchor + "            public-model-application-review.test.mjs \\\n", 1)
          if '"/internal/admin/model-applications*"' not in text:
              anchor = '            "/internal/admin/mms",\n'
              if anchor not in text:
                  raise SystemExit("deploy route-sync page marker not found")
              text = text.replace(anchor, anchor + '            "/internal/admin/model-applications*",\n', 1)
          if '"/v1/admin/model-applications*"' not in text:
              anchor = '            "/v1/admin/mms/*",\n'
              if anchor not in text:
                  raise SystemExit("deploy route-sync api marker not found")
              text = text.replace(anchor, anchor + '            "/v1/admin/model-applications*",\n', 1)
          deploy.write_text(text)
          PY

      - name: Validate focused review flows
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/public-model-application-review.js
          node --check admin-worker/src/admin-login-hero-worker.js
          node --test admin-worker/public-model-application-review.test.mjs
          node --test sigil-worker/test/public-model-notify.test.mjs
          git diff --check

      - name: Commit canonical wiring and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/public-model-review-finalize.yml
          git config user.name "MMD Review Wiring"
          git config user.email "actions@users.noreply.github.com"
          git add admin-worker/wrangler.toml .github/workflows/deploy-admin-worker.yml .github/workflows/public-model-review-finalize.yml
          if git diff --cached --quiet; then
            echo "No wiring changes to commit"
            exit 0
          fi
          git commit -m "chore(admin): wire Public Model review routes and private media"
          git push origin HEAD:fix/public-model-application-review
