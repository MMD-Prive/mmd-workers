name: OPS Slip Staging Smoke PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ops-slip-staging-smoke-pr.yml"

permissions:
  contents: read

jobs:
  deploy-smoke:
    if: github.event.pull_request.head.ref == 'ops/slip-staging-smoke-20260903' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: mmd-slip-extractor-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MMD_SLIP_EXTRACTOR_TOKEN: ${{ secrets.MMD_SLIP_EXTRACTOR_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/mmd-slip-extractor/package-lock.json
            services/mmd-slip-extractor/cloudflare/package-lock.json
      - name: Install and validate extractor
        run: |
          npm ci --prefix services/mmd-slip-extractor
          npm ci --prefix services/mmd-slip-extractor/cloudflare
          node --test services/mmd-slip-extractor/test/*.test.mjs
          node --test services/mmd-slip-extractor/cloudflare/test/*.test.mjs
          node --check services/mmd-slip-extractor/cloudflare/worker-core.mjs
          node --check services/mmd-slip-extractor/cloudflare/worker.mjs
          node --check services/mmd-slip-extractor/cloudflare/container-server.mjs
      - name: Assert staging-only boundary and secrets
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('services/mmd-slip-extractor/cloudflare/wrangler.jsonc','utf8'));
          if(c.name!=='mmd-slip-extractor-staging'||c.workers_dev!==true||c.preview_urls!==false||!Array.isArray(c.routes)||c.routes.length!==0||c.vars?.MMD_RUNTIME_SCOPE!=='staging') throw new Error('staging boundary invalid');
          for(const k of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','MMD_SLIP_EXTRACTOR_TOKEN']) { const v=String(process.env[k]||'').replace(/[\r\n\u2028\u2029]/g,'').trim(); if(!v) throw new Error(k+' missing'); console.log('::add-mask::'+v); }
          const token=String(process.env.MMD_SLIP_EXTRACTOR_TOKEN||'').trim();
          if(!/^[A-Za-z0-9_-]{32,}$/.test(token)) throw new Error('invalid staging token');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/extractor.env','MMD_SLIP_EXTRACTOR_TOKEN='+token+'\n',{mode:0o600});
          NODE
      - name: Build and local health smoke
        working-directory: services/mmd-slip-extractor
        run: |
          docker build --file cloudflare/Dockerfile --tag mmd-slip-extractor-staging:ops .
          name="mmd-slip-extractor-staging-ops-${GITHUB_RUN_ID}"
          trap 'docker rm --force "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" -p 127.0.0.1:18080:8080 mmd-slip-extractor-staging:ops
          for i in $(seq 1 30); do code="$(curl -sS -o "$RUNNER_TEMP/local-health.json" -w '%{http_code}' http://127.0.0.1:18080/health || true)"; if [ "$code" = 200 ]; then node -e 'const b=require(process.argv[1]);if(!b.ok)process.exit(1)' "$RUNNER_TEMP/local-health.json"; exit 0; fi; sleep 1; done
          docker logs "$name"; exit 1
      - name: Deploy isolated staging
        id: deploy
        working-directory: services/mmd-slip-extractor/cloudflare
        run: |
          npx --yes wrangler@4.124.0 deploy --config wrangler.jsonc --keep-vars --secrets-file "$RUNNER_TEMP/extractor.env" | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          test -n "$url"
          case "$url" in https://mmd-slip-extractor-staging.*.workers.dev) ;; *) exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Live health
        run: |
          url='${{ steps.deploy.outputs.url }}'
          for i in $(seq 1 30); do code="$(curl -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$url/health" || true)"; if [ "$code" = 200 ]; then node -e 'const b=require(process.argv[1]);if(!b.ok)process.exit(1)' "$RUNNER_TEMP/health.json"; exit 0; fi; sleep 20; done
          exit 1
      - name: Create synthetic QR and OCR
        working-directory: services/mmd-slip-extractor
        env: { FIXTURE_DIR: "${{ runner.temp }}" }
        run: |
          node --input-type=module <<'NODE'
          import QRCode from 'qrcode'; import sharp from 'sharp';
          const d=process.env.FIXTURE_DIR; const emv='00020101021229370016A0000006770101110113006681234567853037645406100.005802TH6304ABCD';
          await QRCode.toFile(d+'/synthetic-qr.png',emv,{errorCorrectionLevel:'M',margin:4,width:500});
          const svg='<svg width="1200" height="500" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="60" y="130" font-family="Arial" font-size="58" fill="black">Amount: THB 500.00</text><text x="60" y="230" font-family="Arial" font-size="58" fill="black">Transaction ID: SYNTHETIC-OCR-123456</text><text x="60" y="330" font-family="Arial" font-size="58" fill="black">Sender: TEST CUSTOMER</text></svg>';
          await sharp(Buffer.from(svg)).png().toFile(d+'/synthetic-ocr.png');
          NODE
      - name: Live auth plus QR OCR smoke
        run: |
          url='${{ steps.deploy.outputs.url }}'
          code="$(curl -sS -o "$RUNNER_TEMP/noauth.json" -w '%{http_code}' -X POST -H 'content-type: image/png' --data-binary "@$RUNNER_TEMP/synthetic-qr.png" "$url/v1/extract/qr")"
          test "$code" = 401
          curl --fail -sS -X POST -H "authorization: Bearer $MMD_SLIP_EXTRACTOR_TOKEN" -H 'content-type: image/png' --data-binary "@$RUNNER_TEMP/synthetic-qr.png" "$url/v1/extract/qr" > "$RUNNER_TEMP/qr.json"
          curl --fail -sS -X POST -H "authorization: Bearer $MMD_SLIP_EXTRACTOR_TOKEN" -H 'content-type: image/png' --data-binary "@$RUNNER_TEMP/synthetic-ocr.png" "$url/v1/extract/ocr" > "$RUNNER_TEMP/ocr.json"
          node <<'NODE'
          const fs=require('node:fs'); for(const n of ['qr','ocr']) { const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json')); if(!p.result||typeof p.result!=='object') throw new Error(n+' result missing'); for(const f of ['paid','verified','status','membership','points','session_confirmed']) if(Object.hasOwn(p.result,f)) throw new Error('forbidden '+f); }
          NODE
      - run: echo 'LIVE STAGING PASS — health, auth, QR, OCR; no production route changed' >> "$GITHUB_STEP_SUMMARY"
