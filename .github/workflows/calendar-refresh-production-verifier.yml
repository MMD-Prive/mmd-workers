name: Calendar Refresh Production Verifier
on:
  push:
    branches: [fix/calendar-production-verifier-v12-20260914]
    paths: ['.github/workflows/calendar-refresh-production-verifier.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-production-verifier-v12-20260914
      - name: Refresh production verifier constants only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/calendar-production-connection.mjs')
          s=p.read_text()
          replacements={
            "r.headers.get('x-mmd-calendar-surface')==='admin-worker-v1.1'":"r.headers.get('x-mmd-calendar-surface')==='admin-worker-v1.2'",
            "'cal-api-version':'2024-06-14'":"'cal-api-version':'2026-02-25'",
            "surface:'admin-worker-v1.1'":"surface:'admin-worker-v1.2'",
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing verifier marker: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check tools/calendar-production-connection.mjs
          grep -Fq "admin-worker-v1.2" tools/calendar-production-connection.mjs
          grep -Fq "2026-02-25" tools/calendar-production-connection.mjs
      - name: Commit verifier patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/calendar-production-connection.mjs
          git commit -m 'fix(calendar): verify v1.2 production surface'
          git push origin HEAD:fix/calendar-production-verifier-v12-20260914
