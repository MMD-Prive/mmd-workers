name: Historical Backfill Authenticated Controlled Smoke

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner approval for this workflow and its production side effects only'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this workflow and commit'
        type: string
        required: true
      approved_sha:
        description: 'Full main commit SHA approved for this workflow'
        type: string
        required: true
permissions:
  contents: read

jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}

  controlled-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [production-approval]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORIGIN: https://www.mmdbkk.com
      ADMIN_SMOKE_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
    steps:
      - name: Require browser admin credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_SMOKE_CREDENTIAL"
          echo "::add-mask::$ADMIN_SMOKE_CREDENTIAL"

      - name: Login, create pending proof, validate handoff, and clean up
        shell: bash
        run: |
          set -euo pipefail
          cookie="$(mktemp)"
          headers="$(mktemp)"
          body="$(mktemp)"
          smoke_file="$(mktemp --suffix=.png)"
          source_ref="github-actions-controlled-smoke:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          printf 'MMD Historical Backfill controlled smoke %s\n' "$source_ref" > "$smoke_file"

          login_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
            -D "$headers" -o "$body" -c "$cookie" -w "%{http_code}" \
            -X POST \
            -H "Origin: $ORIGIN" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "credential=$ADMIN_SMOKE_CREDENTIAL" \
            --data-urlencode "next=/internal/admin/payments" \
            "$ORIGIN/internal/admin/login/session")"
          test "$login_code" = "303"
          grep -qi '^set-cookie: mmd_admin_gate_v1=' "$headers"

          queue_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
            -o "$body" -b "$cookie" -w "%{http_code}" \
            "$ORIGIN/v1/admin/payments/historical-backfill?limit=100")"
          test "$queue_code" = "200"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!p.ok||p.authority!=="payments-worker") process.exit(1)' "$body"

          intake_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
            -o "$body" -b "$cookie" -w "%{http_code}" \
            -X POST \
            -H "Origin: $ORIGIN" \
            -F "file=@$smoke_file;type=image/png;filename=controlled-smoke.png" \
            -F "source_type=line_archive" \
            -F "source_ref=$source_ref" \
            -F "context_text=GitHub authenticated controlled smoke; must remain pending" \
            "$ORIGIN/v1/admin/payments/historical-backfill/intake")"
          cat "$body"
          echo "Historical intake transport HTTP: $intake_code"
          case "$intake_code" in
            200|201) ;;
            *) echo "Unexpected historical intake HTTP status: $intake_code" >&2; exit 1 ;;
          esac
          proof_id="$(node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!p.ok||p.duplicate!==false||p.state!=="pending"||!p.proof_id||p.guardrails?.may_mark_paid!==false) process.exit(1); process.stdout.write(p.proof_id)' "$body")"

          queue_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
            -o "$body" -b "$cookie" -w "%{http_code}" \
            "$ORIGIN/v1/admin/payments/historical-backfill?limit=100")"
          test "$queue_code" = "200"
          PROOF_ID="$proof_id" SOURCE_REF="$source_ref" node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const x=(p.items||[]).find(i=>i.proof_id===process.env.PROOF_ID&&i.source_ref===process.env.SOURCE_REF); if(!x||x.status!=="pending"||x.review_state!=="pending") process.exit(1)' "$body"

          review_json="$(PROOF_ID="$proof_id" node -e 'process.stdout.write(JSON.stringify({proof_id:process.env.PROOF_ID,decision:"validate_handoff",review_reason:"GitHub authenticated controlled handoff smoke"}))')"
          review_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
            -o "$body" -b "$cookie" -w "%{http_code}" \
            -X POST \
            -H "Origin: $ORIGIN" \
            -H "Content-Type: application/json" \
            --data "$review_json" \
            "$ORIGIN/v1/admin/payments/historical-backfill/review")"
          cat "$body"
          test "$review_code" = "200"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!p.ok||p.state!=="pending"||p.handoff_validated!==true||p.money_truth_mutated!==false||p.expected_rejection!=="historical_proof_sha_mismatch"||p.guardrails?.may_mark_paid!==false) process.exit(1)' "$body"

          queue_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
            -o "$body" -b "$cookie" -w "%{http_code}" \
            "$ORIGIN/v1/admin/payments/historical-backfill?limit=100")"
          test "$queue_code" = "200"
          PROOF_ID="$proof_id" node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const x=(p.items||[]).find(i=>i.proof_id===process.env.PROOF_ID); if(!x||x.status!=="pending"||x.review_state!=="pending") process.exit(1)' "$body"

          cleanup_json="$(PROOF_ID="$proof_id" node -e 'process.stdout.write(JSON.stringify({proof_id:process.env.PROOF_ID,decision:"reject",review_reason:"Controlled smoke cleanup after handoff validation"}))')"
          cleanup_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
            -o "$body" -b "$cookie" -w "%{http_code}" \
            -X POST \
            -H "Origin: $ORIGIN" \
            -H "Content-Type: application/json" \
            --data "$cleanup_json" \
            "$ORIGIN/v1/admin/payments/historical-backfill/review")"
          cat "$body"
          test "$cleanup_code" = "200"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!p.ok||p.state!=="rejected"||p.guardrails?.may_mark_paid!==false) process.exit(1)' "$body"

          echo "PASS: real admin session -> queue -> pending proof -> admin-worker service handoff -> payments-worker SHA rejection before Money Truth -> proof still pending -> cleanup reject"
