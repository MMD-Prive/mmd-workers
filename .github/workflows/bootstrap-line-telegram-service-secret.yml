name: Bootstrap LINE to Telegram service secret

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-line-telegram-service-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-line-telegram-service-secret-production
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token
        run: npx --yes wrangler@4 whoami

      - name: Generate ephemeral shared service secret
        shell: bash
        run: |
          set -euo pipefail
          service_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$service_secret"
          printf 'LINE_TELEGRAM_SHARED_SECRET=%s\n' "$service_secret" >> "$GITHUB_ENV"

      - name: Install secret on telegram-worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if printf '%s' "$LINE_TELEGRAM_SHARED_SECRET" | npx --yes wrangler@4 secret put AUTH_SERVICE_LINE_TO_TELEGRAM --config telegram-worker/wrangler.toml; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Install matching secret on member-dashboard-chat-worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if printf '%s' "$LINE_TELEGRAM_SHARED_SECRET" | npx --yes wrangler@4 secret put AUTH_SERVICE_LINE_TO_TELEGRAM --config member-dashboard-chat-worker/wrangler.toml; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Validate both worker configurations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --keep-vars --config telegram-worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --keep-vars --config member-dashboard-chat-worker/wrangler.toml

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          telegram="$(curl --retry 6 --retry-delay 2 --retry-all-errors -fsS https://telegram-worker.malemodel-bkk.workers.dev/health)"
          printf '%s' "$telegram" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          printf '%s' "$telegram" | grep -Eq '"worker"[[:space:]]*:[[:space:]]*"telegram"'

          line="$(curl --retry 6 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error https://www.mmdbkk.com/webhooks/line)"
          node -e '
            const body=JSON.parse(process.argv[1]);
            if(body.ok!==true || body.worker!=="member-dashboard-chat-worker" || body.route!=="line_webhook") {
              throw new Error(`Unexpected production response: ${process.argv[1]}`);
            }
          ' "$line"
