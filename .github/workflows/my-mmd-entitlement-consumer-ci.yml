name: My MMD Entitlement Consumer CI

on:
  pull_request:
    paths:
      - "auth-worker/src/my-mmd-line-identity-bridge.js"
      - "auth-worker/src/my-mmd-runtime-index.js"
      - "auth-worker/src/member-entitlement-resolver.js"
      - "auth-worker/src/member-downstream-access-reconciler.js"
      - "auth-worker/src/member-lifecycle-reconciliation.js"
      - "auth-worker/wrangler.toml"
      - "auth-worker/test/member-entitlement-resolver.test.mjs"
      - "auth-worker/test/member-downstream-access-reconciler.test.mjs"
      - "auth-worker/test/member-lifecycle-reconciliation.test.mjs"
      - "member-pages-worker/src/runtime-index.js"
      - "member-pages-worker/src/drive-member-bootstrap-runtime.js"
      - "member-pages-worker/src/drive-access-reconcile.js"
      - "telegram-worker/src/access-runtime.js"
      - "telegram-worker/wrangler.toml"
      - "sigil-booking-worker/src/runtime-index.js"
      - "sigil-booking-worker/src/entitlement-runtime-worker.js"
      - "sigil-booking-worker/wrangler.toml"
      - "docs/architecture/MY_MMD_ENTITLEMENT_CONSUMER_CONTRACT_V1.md"
      - ".github/workflows/my-mmd-entitlement-consumer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check auth-worker/src/my-mmd-line-identity-bridge.js
          node --check auth-worker/src/my-mmd-runtime-index.js
          node --check auth-worker/src/member-entitlement-resolver.js
          node --check auth-worker/src/member-downstream-access-reconciler.js
          node --check auth-worker/src/member-lifecycle-reconciliation.js
          node --check member-pages-worker/src/runtime-index.js
          node --check member-pages-worker/src/drive-member-bootstrap-runtime.js
          node --check member-pages-worker/src/drive-access-reconcile.js
          node --check telegram-worker/src/access-runtime.js
          node --check sigil-booking-worker/src/runtime-index.js
          node --check sigil-booking-worker/src/entitlement-runtime-worker.js
      - name: Resolver and downstream policy tests
        run: |
          node --test auth-worker/test/member-entitlement-resolver.test.mjs
          node --test auth-worker/test/member-downstream-access-reconciler.test.mjs
          node --test auth-worker/test/member-lifecycle-reconciliation.test.mjs
      - name: Wrangler entrypoint contract
        run: |
          grep -F 'main = "src/my-mmd-line-identity-bridge.js"' auth-worker/wrangler.toml
          grep -F 'import currentWorker from "./my-mmd-runtime-index.js"' auth-worker/src/my-mmd-line-identity-bridge.js
          grep -F 'crons = ["7 * * * *"]' auth-worker/wrangler.toml
          grep -F 'LIFECYCLE_RECONCILIATION_ENABLED = "true"' auth-worker/wrangler.toml
          grep -F 'main = "src/access-runtime.js"' telegram-worker/wrangler.toml
          grep -F 'main = "src/runtime-index.js"' sigil-booking-worker/wrangler.toml
      - name: Downstream authority contract
        run: |
          grep -F 'authority: "my_mmd_entitlement_resolver_v1"' auth-worker/src/member-downstream-access-reconciler.js
          grep -F 'schema_version: "my_mmd_lifecycle_reconciliation_v1"' auth-worker/src/member-lifecycle-reconciliation.js
          grep -F 'legacy_drive_source_disabled' auth-worker/src/my-mmd-runtime-index.js
          grep -F 'legacy_drive_source_disabled' member-pages-worker/src/drive-member-bootstrap-runtime.js
          grep -F 'AUTH_SERVICE_AUTH_TO_TELEGRAM' telegram-worker/src/access-runtime.js
          grep -F 'AUTH_SERVICE_AUTH_TO_MEMBER_PAGES' member-pages-worker/src/drive-access-reconcile.js
      - name: Booking snapshot contract
        run: |
          grep -F 'entitlement_snapshot_at_confirm' sigil-booking-worker/src/entitlement-runtime-worker.js
          grep -F 'honor_after_expiry' sigil-booking-worker/src/runtime-index.js
          grep -F 'payment_verified_at_confirm' sigil-booking-worker/src/entitlement-runtime-worker.js
