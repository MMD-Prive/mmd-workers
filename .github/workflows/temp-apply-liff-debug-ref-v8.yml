name: Temporary apply LIFF debug ref V8

on:
  push:
    branches:
      - hotfix/liff-debug-ref-v8
    paths:
      - ".github/workflows/temp-apply-liff-debug-ref-v8.yml"
      - "scripts/temp-liff-debug-ref-v8.mjs"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/liff-debug-ref-v8
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply diagnostic ref patch
        run: node scripts/temp-liff-debug-ref-v8.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression
        run: |
          node --check member-pages-worker/src/liff-member-shell.js
          npm run test:member-pages-liff
          npm run test:member-dashboard-liff
          npx --yes wrangler@4 deploy --dry-run --config member-pages-worker/wrangler.toml
      - name: Commit tested shell patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-apply-liff-debug-ref-v8.yml scripts/temp-liff-debug-ref-v8.mjs
          git add member-pages-worker/src/liff-member-shell.js
          git commit -m "fix(liff): expose safe diagnostic ref in debug mode"
          git push origin HEAD:hotfix/liff-debug-ref-v8
