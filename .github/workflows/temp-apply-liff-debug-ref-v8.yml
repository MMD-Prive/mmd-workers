name: Temporary apply LIFF debug ref V8

on:
  push:
    branches:
      - hotfix/liff-debug-ref-v8
    paths:
      - ".github/workflows/temp-apply-liff-debug-ref-v8.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/liff-debug-ref-v8
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply diagnostic ref patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'member-pages-worker/src/liff-member-shell.js';
          let source = fs.readFileSync(path, 'utf8');
          const pattern = /  async function call\(endpoint, body\) \{[\s\S]*?\n  async function readProfile\(\) \{/;
          if (!pattern.test(source)) throw new Error('call() block not found');
          const replacement = `  function isDiagnosticMode() {
    try { return new URLSearchParams(window.location.search).get("debug") === "1"; }
    catch { return false; }
  }

  function safeDiagnosticCode(value) {
    const code = String(value || "UNKNOWN_ERROR").trim().toUpperCase();
    return /^[A-Z0-9_]{2,80}$/.test(code) ? code : "UNKNOWN_ERROR";
  }

  function showTemporaryError(ref) {
    let message = "ตอนนี้ระบบตรวจสอบข้อมูลชั่วคราวยังไม่พร้อมครับ กรุณาลองใหม่อีกครั้ง";
    if (isDiagnosticMode() && ref) message += "\\nRef: " + ref;
    show(message);
  }

  async function call(endpoint, body) {
    let response;
    try {
      response = await fetch(endpoint, {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json", "accept": "application/json" },
        body: JSON.stringify(body || {}),
      });
    } catch {
      showTemporaryError("CLIENT_FETCH_FAILED");
      return null;
    }
    const payload = await response.json().catch(() => null);
    if (!payload || typeof payload !== "object") {
      showTemporaryError("HTTP " + response.status + " · INVALID_RESPONSE");
      return null;
    }
    if (!response.ok || payload.ok !== true) {
      if (payload.data) render(payload.data);
      else showTemporaryError("HTTP " + response.status + " · " + safeDiagnosticCode(payload?.error?.code));
      return null;
    }
    render(payload.data || {});
    return payload.data || {};
  }

  async function readProfile() {`;
          source = source.replace(pattern, replacement);
          fs.writeFileSync(path, source);
          NODE
          grep -Fq 'Ref: ' member-pages-worker/src/liff-member-shell.js
          grep -Fq 'CLIENT_FETCH_FAILED' member-pages-worker/src/liff-member-shell.js
          grep -Fq 'safeDiagnosticCode' member-pages-worker/src/liff-member-shell.js
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression
        run: |
          node --check member-pages-worker/src/liff-member-shell.js
          npm run test:member-pages-liff
          npm run test:member-dashboard-liff
          npx --yes wrangler@4 deploy --dry-run --config member-pages-worker/wrangler.toml
      - name: Commit tested shell patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-apply-liff-debug-ref-v8.yml
          git add member-pages-worker/src/liff-member-shell.js
          git commit -m "fix(liff): expose safe diagnostic ref in debug mode"
          git push origin HEAD:hotfix/liff-debug-ref-v8
