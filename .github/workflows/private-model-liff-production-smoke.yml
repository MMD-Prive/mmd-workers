name: Private Model LIFF production smoke

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner approval for this workflow and its production side effects only'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this workflow and commit'
        type: string
        required: true
      approved_sha:
        description: 'Full main commit SHA approved for this workflow'
        type: string
        required: true
permissions:
  contents: read

jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}

  smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [production-approval]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out deployed SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify published LIFF contract
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { activationLiffUrl } from './admin-worker/src/model-first-time-activation.js';
          import { deterministicPrivateModelKey } from './admin-worker/src/private-model-application-handoff.js';
          const url = new URL(activationLiffUrl('smoke-token', 'published', {}));
          if (url.hostname !== 'miniapp.line.me') throw new Error(`unexpected LIFF host: ${url.hostname}`);
          if (url.pathname !== '/2010864854-N34SgCqq/') throw new Error(`unexpected published LIFF additional-info path: ${url.pathname}`);
          if (url.searchParams.get('activation') !== 'smoke-token') throw new Error('activation deep-link token missing');
          if (deterministicPrivateModelKey('pma_20260913_smoke123') !== 'mdl_pri_app_20260913_smoke123') {
            throw new Error('deterministic Private Model canonical key contract changed');
          }
          console.log('Published LIFF + Private Model canonical contract OK:', url.origin + url.pathname);
          NODE

      - name: Smoke Private Model owner routes fail closed without admin session
        run: |
          set -euo pipefail
          api_headers="$(mktemp)"
          api_body="$(mktemp)"
          api_code="$(curl -sS -D "$api_headers" -o "$api_body" -w '%{http_code}' \
            'https://mmdbkk.com/v1/admin/model-applications?application_type=private_model')"
          test "$api_code" = "401"
          node - "$api_body" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.error !== 'unauthorized') throw new Error(`unexpected private owner API gate: ${JSON.stringify(body)}`);
          NODE
          page_headers="$(mktemp)"
          page_code="$(curl -sS -D "$page_headers" -o /dev/null -w '%{http_code}' \
            'https://mmdbkk.com/internal/admin/model-applications?application_type=private_model')"
          test "$page_code" = "303"
          grep -qi '^location:.*\/internal\/admin\/login' "$page_headers"
          echo "Private Model owner review routes remain credential-bound"

      - name: Smoke production activate route on apex and www
        run: |
          set -euo pipefail
          for host in mmdbkk.com www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
              -X POST "https://${host}/v1/model/liff/activate" \
              -H 'Origin: https://mmdbkk.com' \
              -H 'Content-Type: application/json' \
              --data '{"environment":"published"}')"
            test "$code" = "400"
            node - "$body" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.error !== 'activation_token_required') {
            throw new Error(`unexpected activate negative-smoke body: ${JSON.stringify(body)}`);
          }
          NODE
            if grep -qi '^set-cookie:.*mmd_model_session_v1' "$headers"; then
              echo "Fail: negative smoke must not issue a model session cookie" >&2
              exit 1
            fi
            echo "${host}: activate route published-environment negative smoke OK"
          done

      - name: Smoke production LIFF exchange fail-closed route
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
            -X POST 'https://mmdbkk.com/v1/model/liff/exchange' \
            -H 'Origin: https://mmdbkk.com' \
            -H 'Content-Type: application/json' \
            --data '{"environment":"published"}')"
          test "$code" = "400"
          node - "$body" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.error !== 'id_token_required') {
            throw new Error(`unexpected exchange negative-smoke body: ${JSON.stringify(body)}`);
          }
          NODE
          if grep -qi '^set-cookie:.*mmd_model_session_v1' "$headers"; then
            echo "Fail: negative exchange smoke must not issue a model session cookie" >&2
            exit 1
          fi
          echo "Published LIFF exchange fail-closed smoke OK"
