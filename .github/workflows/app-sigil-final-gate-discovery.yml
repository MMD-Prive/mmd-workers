name: APP SIGIL final gate discovery

on:
  push:
    branches: [main]
    paths:
      - "ops/release-gates/app-sigil-final-gate-discovery-trigger.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-sigil-final-gate-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover genuine production handoff receipts through remote R2
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

          cat > "$RUNNER_TEMP/r2-gate-reader.mjs" <<'WORKER'
          export default {
            async fetch(_request, env) {
              const prefix = "public-job-board/v2/handoffs/";
              const listed = await env.PUBLIC_ACCESS_EVIDENCE.list({ prefix, limit: 500 });
              const rows = [];
              for (const item of listed.objects || []) {
                const object = await env.PUBLIC_ACCESS_EVIDENCE.get(item.key);
                if (!object) continue;
                const row = await object.json().catch(() => null);
                if (!row || row.schema !== "mmd_public_job_board_v2.model_handoff_receipt") continue;
                rows.push({
                  receipt_ref: row.receipt_ref || null,
                  model_record_id: row.model_record_id || null,
                  job_id: row.job_id || null,
                  target_path: row.target_path || null,
                  verified_at: row.verified_at || null,
                  source: row.source || null,
                });
              }
              rows.sort((a,b) => String(b.verified_at || "").localeCompare(String(a.verified_at || "")));
              return Response.json({ ok: true, handoffs: rows.slice(0,100) });
            }
          };
          WORKER

          cat > "$RUNNER_TEMP/wrangler.toml" <<'TOML'
          name = "app-sigil-final-gate-r2-reader"
          main = "r2-gate-reader.mjs"
          compatibility_date = "2026-09-29"

          [[r2_buckets]]
          binding = "PUBLIC_ACCESS_EVIDENCE"
          bucket_name = "mmd-public-access-evidence"
          remote = true
          TOML

          (
            cd "$RUNNER_TEMP"
            npx --yes wrangler@4 dev --config wrangler.toml --port 8787 > wrangler-r2-reader.log 2>&1
          ) &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8787/ > "$RUNNER_TEMP/handoffs.json"; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/handoffs.json"

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { verifyCampaignDestination } from "./ops/release-gates/app-sigil-final-gate-verifier.mjs";

          const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/handoffs.json", "utf8"));
          if (body?.ok !== true || !Array.isArray(body.handoffs)) throw new Error("handoff_discovery_body_invalid");

          const safe = body.handoffs
            .filter((row) => row?.source === "validated_model_handoff")
            .filter((row) => /^handoff_[a-f0-9]{24}$/.test(String(row?.receipt_ref || "")))
            .filter((row) => /^rec[A-Za-z0-9]{14}$/.test(String(row?.model_record_id || "")))
            .filter((row) => /^[A-Za-z0-9][A-Za-z0-9_-]{2,99}$/.test(String(row?.job_id || "")))
            .filter((row) => String(row?.target_path || "").startsWith("/public/api/jobs"))
            .sort((a,b) => String(b.verified_at).localeCompare(String(a.verified_at)))
            .slice(0,20);

          const campaign = await verifyCampaignDestination({
            campaignId: "app-sigil-always-on-20260929",
            source: "x_campaign",
            jobId: safe[0]?.job_id || "JOB-20260928-3DE86201F471",
          });

          const out = {
            schema: "mmd.app_sigil_final_gate_discovery.v1",
            generated_at: new Date().toISOString(),
            source: "cloudflare_remote_r2_read_only",
            handoff_count: safe.length,
            latest_handoff: safe[0] || null,
            handoffs: safe,
            campaign_destination_smoke: campaign,
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + "/app-sigil-final-gate-discovery.json", JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-sigil-final-gate-discovery
          path: ${{ runner.temp }}/app-sigil-final-gate-discovery.json
          if-no-files-found: ignore
