name: Deploy partners-worker

on:
  push:
    branches: [main]
    paths:
      - "partners-worker/**"
      - ".github/workflows/deploy-partners-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-partners-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: "appsV1ILPRfIjkaYg"
      KENDO_RECORD_ID: "recjegeHuesDmm7QP"
      KENDO_NOTES_FIELD_ID: "fldiPJbsdnuxYQAl5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: partners-worker/package-lock.json

      - name: Normalize required credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          for (const key of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ROUTES_API_TOKEN","AIRTABLE_API_KEY"]) {
            const value = clean(process.env[key]);
            if (!value) throw new Error(`Missing required secret: ${key}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ROUTES_API_TOKEN"
          echo "::add-mask::$AIRTABLE_API_KEY"

      - name: Load optional Kendo smoke token
        shell: bash
        run: |
          set -euo pipefail
          record="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $AIRTABLE_API_KEY" \
              "https://api.airtable.com/v0/$AIRTABLE_BASE_ID/tbl1ksDlsTiiGEHWe/$KENDO_RECORD_ID"
          )"
          notes="$(jq -r --arg f "$KENDO_NOTES_FIELD_ID" '.fields["Notes Internal"] // .fields[$f] // ""' <<<"$record")"
          dashboard_url="$(printf '%s\n' "$notes" | sed -n 's/^Dashboard: //p' | tail -n 1)"
          token=""
          if [ -n "$dashboard_url" ]; then
            token="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.parse_qs(urllib.parse.urlparse(sys.argv[1]).query).get("t",[""])[0])' "$dashboard_url")"
          fi

          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "::add-mask::$dashboard_url"
            echo "KENDO_TOKEN=$token" >> "$GITHUB_ENV"
            echo "KENDO_TOKEN_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "KENDO_TOKEN=" >> "$GITHUB_ENV"
            echo "KENDO_TOKEN_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Kendo raw token is intentionally absent; continuing with deploy and unauthenticated route checks."
          fi

      - name: Install
        working-directory: partners-worker
        run: npm ci

      - name: Typecheck
        working-directory: partners-worker
        run: npm run typecheck

      - name: Rotate Partners-to-Telegram service secret
        shell: bash
        run: |
          set -euo pipefail
          service_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$service_secret"
          printf 'PARTNERS_TELEGRAM_ROUTER_SECRET=%s\n' "$service_secret" >> "$GITHUB_ENV"
          router_secret_ready=0
          for attempt in $(seq 1 24); do
            if printf '%s' "$service_secret" | npx --yes wrangler@4 secret put AUTH_SERVICE_PARTNERS_TO_TELEGRAM --config telegram-worker/wrangler.toml; then
              router_secret_ready=1
              echo "telegram-worker service secret ready on attempt $attempt"
              break
            fi
            echo "telegram-worker latest version not deployable yet; retrying secret rotation (attempt $attempt)"
            sleep 5
          done
          test "$router_secret_ready" = "1"
          printf 'AUTH_SERVICE_PARTNERS_TO_TELEGRAM=%s\n' "$service_secret" > "$RUNNER_TEMP/partners-worker-router.env"
          chmod 600 "$RUNNER_TEMP/partners-worker-router.env"

      - name: Build route-free deploy config
        working-directory: partners-worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("wrangler.toml","utf8").split(/\r?\n/);
          const output = [];
          let skipRoutes = false;
          for (const line of input) {
            if (!skipRoutes && /^\s*routes\s*=\s*\[\s*$/.test(line)) {
              skipRoutes = true;
              continue;
            }
            if (skipRoutes) {
              if (/^\s*\]\s*$/.test(line)) skipRoutes = false;
              continue;
            }
            output.push(line);
          }
          if (skipRoutes) throw new Error("Unclosed routes array in wrangler.toml");
          const result = output.join("\n")+"\n";
          if (/^\s*routes\s*=/m.test(result)) throw new Error("Route-free config still contains routes");
          fs.writeFileSync(".wrangler-no-routes.toml", result);
          NODE

      - name: Deploy worker code without route mutation
        working-directory: partners-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars --secrets-file "$RUNNER_TEMP/partners-worker-router.env" --config .wrangler-no-routes.toml

      - name: Verify Cloudflare routes token
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$code" = "200"
          jq -e '.success == true and .result.status == "active"' "$body" >/dev/null

      - name: Bind canonical partner API routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "partners-worker";
          const desired = [
            "mmdbkk.com/v1/partner/*",
            "www.mmdbkk.com/v1/partner/*",
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const detail = (payload.errors || [])
                .map((e) => `${e.code || "unknown"}: ${e.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare route request failed (${response.status}): ${detail}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing partner route takeover: ${conflicts.map((r) => `${r.pattern} -> ${r.script || "none"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cf(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cf(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Unresolved routes: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length}; created ${missing.length}`);
          NODE

      - name: Smoke Kendo on bound partner API
        if: env.KENDO_TOKEN_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 6
          encoded="$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["KENDO_TOKEN"], safe=""))')"

          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            verify="$(curl --retry 5 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$origin/v1/partner/verify?t=$encoded")"
            dashboard="$(curl --retry 5 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$origin/v1/partner/dashboard?t=$encoded")"

            test "$(jq -r '.ok // false' <<<"$verify")" = "true"
            test "$(jq -r '.partner_id // empty' <<<"$verify")" = "$KENDO_RECORD_ID"
            test "$(jq -r '.ok // false' <<<"$dashboard")" = "true"
            test "$(jq -r '.partner.id // empty' <<<"$dashboard")" = "$KENDO_RECORD_ID"

            approval_body="$(mktemp)"
            approval_code="$(curl --silent --show-error -o "$approval_body" -w "%{http_code}" \
              -X POST -H "Content-Type: application/json" \
              --data '{"partner_record_id":"'"$KENDO_RECORD_ID"'","action":"recognized"}' \
              "$origin/v1/partner/approve")"
            case "$approval_code" in
              401|403|503) ;;
              *) cat "$approval_body"; echo "Approval endpoint did not fail closed: HTTP $approval_code" >&2; exit 1 ;;
            esac
          done

      - name: Clean raw Kendo token from Airtable notes
        if: env.KENDO_TOKEN_AVAILABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          record="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $AIRTABLE_API_KEY" \
              "https://api.airtable.com/v0/$AIRTABLE_BASE_ID/tbl1ksDlsTiiGEHWe/$KENDO_RECORD_ID"
          )"
          notes="$(jq -r --arg f "$KENDO_NOTES_FIELD_ID" '.fields["Notes Internal"] // .fields[$f] // ""' <<<"$record")"
          cleaned="$(NOTES="$notes" node <<'NODE'
          const notes = process.env.NOTES || "";
          const without = notes
            .replace(/\n?\[TEMP_KENDO_REISSUE 2026-09-20\][\s\S]*?(?:Smoke: pending|Smoke: PASS[^\n]*)/, "")
            .trim();
          const audit = "[2026-09-20] Kendo partner access reissued; custom-domain verify/dashboard smoke PASS. Raw token not retained.";
          process.stdout.write(without ? without+"\n\n"+audit : audit);
          NODE
          )"
          payload="$(jq -n --arg f "$KENDO_NOTES_FIELD_ID" --arg v "$cleaned" '{fields:{($f):$v}}')"
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $AIRTABLE_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.airtable.com/v0/$AIRTABLE_BASE_ID/tbl1ksDlsTiiGEHWe/$KENDO_RECORD_ID" >/dev/null

      - name: Clean temporary config
        if: always()
        working-directory: partners-worker
        run: rm -f .wrangler-no-routes.toml "$RUNNER_TEMP/partners-worker-router.env"
