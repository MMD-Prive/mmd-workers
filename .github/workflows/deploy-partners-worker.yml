name: Deploy partners-worker

on:
  push:
    branches: [main]
    paths:
      - "partners-worker/**"
      - ".github/workflows/deploy-partners-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-router-secret-rotation-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: partners-worker/package-lock.json

      - name: Normalize required credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          for (const key of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ROUTES_API_TOKEN"]) {
            const value = clean(process.env[key]);
            if (!value) throw new Error(`Missing required secret: ${key}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ROUTES_API_TOKEN"

      - name: Install
        working-directory: partners-worker
        run: npm ci

      - name: Typecheck
        working-directory: partners-worker
        run: npm test && npm run typecheck

      - name: Verify existing service secret bindings without rotation
        shell: bash
        run: |
          set -euo pipefail
          for config in partners-worker/wrangler.toml telegram-worker/wrangler.toml; do
            partners-worker/node_modules/.bin/wrangler secret list --config "$config" > "$RUNNER_TEMP/partner-router-secret-names.json"
            jq -e 'any(.[]; .name == "AUTH_SERVICE_PARTNERS_TO_TELEGRAM")' "$RUNNER_TEMP/partner-router-secret-names.json" >/dev/null
          done
          rm -f "$RUNNER_TEMP/partner-router-secret-names.json"

      - name: Build route-free deploy config
        working-directory: partners-worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("wrangler.toml","utf8").split(/\r?\n/);
          const output = [];
          let skipRoutes = false;
          for (const line of input) {
            if (!skipRoutes && /^\s*routes\s*=\s*\[\s*$/.test(line)) {
              skipRoutes = true;
              continue;
            }
            if (skipRoutes) {
              if (/^\s*\]\s*$/.test(line)) skipRoutes = false;
              continue;
            }
            output.push(line);
          }
          if (skipRoutes) throw new Error("Unclosed routes array in wrangler.toml");
          const result = output.join("\n")+"\n";
          if (/^\s*routes\s*=/m.test(result)) throw new Error("Route-free config still contains routes");
          fs.writeFileSync(".wrangler-no-routes.toml", result);
          NODE

      - name: Deploy worker code without route mutation
        working-directory: partners-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars --config .wrangler-no-routes.toml

      - name: Verify Cloudflare routes token
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$code" = "200"
          jq -e '.success == true and .result.status == "active"' "$body" >/dev/null

      - name: Bind canonical partner API routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "partners-worker";
          const desired = [
            "mmdbkk.com/sigil/model/dashboard/partner-login*",
            "www.mmdbkk.com/sigil/model/dashboard/partner-login*",
            "mmdbkk.com/v1/partner/*",
            "www.mmdbkk.com/v1/partner/*",
            "mmdbkk.com/partner/dashboard*",
            "www.mmdbkk.com/partner/dashboard*",
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const detail = (payload.errors || [])
                .map((e) => `${e.code || "unknown"}: ${e.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare route request failed (${response.status}): ${detail}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing partner route takeover: ${conflicts.map((r) => `${r.pattern} -> ${r.script || "none"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cf(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cf(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Unresolved routes: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length}; created ${missing.length}`);
          NODE

      - name: Smoke Partner Control Room and fail-closed routes
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            page="$(curl --location --retry 5 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$origin/partner/dashboard?t=production-smoke-placeholder")"
            grep -Fq 'data-partner-control-room' <<<"$page"
            grep -Fq 'MMD ไม่มีสิทธิ์อ่าน' <<<"$page"
            grep -Fq 'Private Vault' <<<"$page"

            for path in \
              /v1/partner/dashboard \
              /v1/partner/private-vault; do
              body="$(mktemp)"
              code="$(curl --silent --show-error -o "$body" -w "%{http_code}" "$origin$path")"
              test "$code" = "401"
              test "$(jq -r '.error.code // .error // empty' "$body")" = "token_missing"
            done

            for path in \
              /v1/partner/models/change \
              /v1/partner/models/upload \
              /v1/partner/jobs/action \
              /v1/partner/telegram/connect \
              /v1/partner/sales/proposal; do
              body="$(mktemp)"
              code="$(curl --silent --show-error -o "$body" -w "%{http_code}" -X POST "$origin$path")"
              test "$code" = "401"
              test "$(jq -r '.error.code // .error // empty' "$body")" = "token_missing"
            done
          done

      - name: Smoke native Partner LINE entry
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            page="$(curl --retry 3 --retry-delay 2 --fail --silent --show-error "$origin/sigil/model/dashboard/partner-login")"
            grep -Fq '2010864854-N34SgCqq' <<<"$page"
            grep -Fq 'เข้าสู่ระบบด้วย LINE' <<<"$page"
            if grep -Fq 'lovable.app' <<<"$page"; then exit 1; fi
            headers="$(curl --silent --show-error --head "$origin/v1/partner/line/login")"
            grep -Fiq 'location: https://mmdbkk.com/sigil/model/dashboard/partner-login' <<<"$headers"
            body="$(mktemp)"
            code="$(curl --silent --show-error -o "$body" -w "%{http_code}" -X POST -H "Origin: $origin" -H 'Content-Type: application/json' --data '{}' "$origin/v1/partner/line/exchange")"
            test "$code" = "401"
            test "$(jq -r '.error.code' "$body")" = "id_token_required"
          done

      - name: Clean temporary config
        if: always()
        working-directory: partners-worker
        run: rm -f .wrangler-no-routes.toml
