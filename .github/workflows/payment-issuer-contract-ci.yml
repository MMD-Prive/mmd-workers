name: Payment issuer contract CI

on:
  pull_request:
    paths:
      - "admin-worker/src/payments-issuer-transport.js"
      - "admin-worker/src/payment-issuer-diagnostic.js"
      - "admin-worker/src/admin-login-hero-worker-core.js"
      - "admin-worker/src/index.js"
      - "admin-worker/wrangler.toml"
      - "admin-worker/payment-issuer-diagnostic.test.mjs"
      - "admin-worker/service-auth-contract.test.mjs"
      - "payments-worker/**"
      - ".github/workflows/payment-issuer-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issuer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify issuer transport, authentication and empty-probe behavior
        run: |
          node --check admin-worker/src/payments-issuer-transport.js
          node --check admin-worker/src/payment-issuer-diagnostic.js
          node --test admin-worker/payment-issuer-diagnostic.test.mjs admin-worker/service-auth-contract.test.mjs payments-worker/canonical-confirm-link.test.mjs payments-worker/session-finance-write.test.mjs
