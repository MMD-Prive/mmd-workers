name: Sync CEO route worker

on:
  workflow_run:
    workflows:
      - Deploy immigrate-worker
    types:
      - completed

permissions:
  contents: read

jobs:
  sync-routes:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      WORKER_NAME: immigrate-worker

    steps:
      - name: Sync CEO routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = (process.env.CLOUDFLARE_ROUTES_API_TOKEN || '').trim();
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = process.env.WORKER_NAME;
          if (!token) throw new Error('CLOUDFLARE_ROUTES_API_TOKEN missing');

          const desired = [
            'mmdbkk.com/internal/ceo*',
            'www.mmdbkk.com/internal/ceo*',
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) throw new Error(JSON.stringify(body.errors || body));
            return body.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          let existing = await cf(routePath);

          for (const pattern of desired) {
            const conflict = existing.find((route) => route.pattern === pattern && route.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || 'none'}`);
          }

          for (const pattern of desired) {
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) continue;
            await cf(routePath, { method: 'POST', body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
          }

          existing = await cf(routePath);
          const missing = desired.filter((pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`missing CEO routes: ${missing.join(', ')}`);
          console.log(`verified ${desired.length}/${desired.length} CEO routes`);
          NODE

      - name: Verify CEO route ownership fail-closed on both hosts
        shell: bash
        run: |
          set -euo pipefail
          for host in mmdbkk.com www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "https://${host}/internal/ceo?route-smoke=1")"
            if [ "$code" != "302" ]; then
              echo "Expected 302 admin auth redirect from ${host} CEO route, got ${code}" >&2
              cat "$headers" >&2
              rm -f "$headers" "$body"
              exit 1
            fi
            grep -Eiq '^x-mmd-ceo-route-owner:[[:space:]]*immigrate-worker' "$headers"
            grep -Eiq '^x-mmd-ceo-auth:[[:space:]]*required' "$headers"
            grep -Eiq '^x-mmd-ceo-human-operator:[[:space:]]*per' "$headers"
            grep -Eiq '^x-mmd-ceo-mode:[[:space:]]*single-owner-v1' "$headers"
            grep -Eiq "^location:[[:space:]]*https://${host//./\\.}/internal/admin/login\\?next=" "$headers"
            rm -f "$headers" "$body"
          done