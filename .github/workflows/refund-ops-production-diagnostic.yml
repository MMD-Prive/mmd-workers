name: Diagnose Refund Ops 1101

on:
  push:
    branches:
      - diag/refund-1101-20260929

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORIGIN: https://www.mmdbkk.com
      ADMIN_SMOKE_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      TARGET: /internal/admin/refunds?inbox_id=refund_manual_man_20260929_pay_mulcs8o4&action=upload
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require diagnostic credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_SMOKE_CREDENTIAL:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "::add-mask::$ADMIN_SMOKE_CREDENTIAL"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
      - name: Tail admin-worker and hit authenticated Refund Ops
        shell: bash
        run: |
          set -euo pipefail
          cookie="$RUNNER_TEMP/refund.cookies"
          headers="$RUNNER_TEMP/refund.headers"
          body="$RUNNER_TEMP/refund.body"
          tail_log="$RUNNER_TEMP/refund-tail.log"

          timeout 45s npx --yes wrangler@4.142.0 tail admin-worker --format json --status error >"$tail_log" 2>&1 &
          tail_pid=$!
          sleep 8

          login_code="$(curl -sS -D "$headers" -o /dev/null -c "$cookie" -w "%{http_code}"             -X POST             -H "Origin: $ORIGIN"             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "credential=$ADMIN_SMOKE_CREDENTIAL"             --data-urlencode "next=/internal/admin/refunds"             "$ORIGIN/internal/admin/login/session" || true)"
          echo "login_http=$login_code"
          test "$login_code" = "303"

          : > "$headers"
          page_code="$(curl -sS -D "$headers" -o "$body" -b "$cookie" -w "%{http_code}" "$ORIGIN$TARGET" || true)"
          echo "refund_http=$page_code"
          echo "refund_content_type=$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
          echo "refund_cf_ray=$(grep -i '^cf-ray:' "$headers" | tail -1 | tr -d '\r' || true)"
          echo "refund_route_owner=$(grep -i '^x-mmd-route-owner:' "$headers" | tail -1 | tr -d '\r' || true)"
          echo "refund_body_prefix=$(head -c 180 "$body" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g')"

          sleep 8
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          echo "--- cloudflare error tail ---"
          cat "$tail_log"
