name: Telegram Canonical Map Smoke Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-canonical-map-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ contains(github.event.head_commit.message, '[canonical-topic-smoke]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mmd-slip-extractor-staging
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.MMS_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "-1003546439681"
    steps:
      - name: Smoke canonical Telegram topic map
        shell: bash
        run: |
          set -u -o pipefail
          token="$(printf '%s' "${TELEGRAM_BOT_TOKEN:-}" | tr -d '\r\n' | xargs)"
          test -n "$token"
          echo "::add-mask::${token}"
          run_id="canonical-topic-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          failures=0

          topics=(
            "1399:BOOKING_DRAFT"
            "20:PAYMENTS_MEMBERSHIP"
            "17:POINTS"
            "22:PAYMENTS_CONFIRM"
            "9:ALERTS"
            "155:APPLICATIONS"
            "157:HIMAI_ORDERS"
            "158:HIMAI_PAYMENTS"
            "159:HIMAI_ALERTS"
            "160:MMD_SHOP_ORDERS"
            "161:MMD_SHOP_PAYMENTS"
            "162:MMD_SHOP_ALERTS"
            "134:LEGACY_ARCHIVE"
            "39:RULES_MODEL"
            "29:RULES_CUSTOMER"
          )

          for item in "${topics[@]}"; do
            thread="${item%%:*}"
            label="${item#*:}"
            text="MMD CANONICAL TOPIC SMOKE\nTopic: ${label}\nThread: ${thread}\nRun: ${run_id}\nSynthetic / silent / no customer data"
            payload="$(node -e 'process.stdout.write(JSON.stringify({chat_id:process.env.TELEGRAM_CHAT_ID,message_thread_id:Number(process.argv[1]),text:process.argv[2],disable_notification:true}))' "$thread" "$text")"
            file="$RUNNER_TEMP/thread-${thread}.json"
            code="$(curl -sS -o "$file" -w '%{http_code}' -X POST "https://api.telegram.org/bot${token}/sendMessage" -H 'Content-Type: application/json' --data-binary "$payload" || true)"
            if node -e 'const fs=require("node:fs");const [file,thread,label,code]=process.argv.slice(1);let b={};try{b=JSON.parse(fs.readFileSync(file,"utf8"))}catch{};if(code==="200"&&b.ok===true){console.log(`PASS label=${label} thread=${thread} message_id=${b.result?.message_id||"n/a"}`);process.exit(0)}const d=String(b.description||b.error||"delivery_failed").replace(/[^A-Za-z0-9 _.:/-]/g,"_").slice(0,180);console.log(`FAIL label=${label} thread=${thread} http=${code} error_code=${b.error_code||"n/a"} description=${d}`);process.exit(1)' "$file" "$thread" "$label" "$code"; then
              :
            else
              failures=$((failures + 1))
            fi
          done

          echo "### Canonical Telegram topic smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${run_id}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Topics tested: ${#topics[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failures: ${failures}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synthetic / silent / no customer data" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
