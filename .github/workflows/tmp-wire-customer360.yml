name: Temporary wire Customer 360

on:
  push:
    branches:
      - feat/wire-customer-360-v1
    paths:
      - ".github/workflows/tmp-wire-customer360.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wire-customer-360-v1
      - name: Patch route and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'immigrate-worker/src/internal-routes.ts';
          let source = fs.readFileSync(path, 'utf8');
          const importNeedle = 'import { renderOwnerControlRoomPage } from "./control-room-owner-ui";\n';
          const importLine = 'import { renderCustomer360Page } from "./customer-360-ui-v1";\n';
          if (!source.includes(importLine)) {
            if (!source.includes(importNeedle)) throw new Error('control-room import anchor missing');
            source = source.replace(importNeedle, importNeedle + importLine);
          }
          const routeNeedle = `  if (pathname === "/internal/admin/customer-data") {\n    const gate = await requireAdminGate(request, env);\n    if (gate) return gate;\n    return renderCustomerDataPage();\n  }`;
          const routePatch = `  if (pathname === "/internal/admin/customer-data") {\n    const gate = await requireAdminGate(request, env);\n    if (gate) return gate;\n    return renderCustomer360Page();\n  }`;
          if (!source.includes(routePatch)) {
            if (!source.includes(routeNeedle)) throw new Error('customer-data route anchor missing');
            source = source.replace(routeNeedle, routePatch);
          }
          fs.writeFileSync(path, source);
          NODE
          rm .github/workflows/tmp-wire-customer360.yml
          git config user.name "MMD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add immigrate-worker/src/internal-routes.ts .github/workflows/tmp-wire-customer360.yml
          git commit -m "feat: route Customer Data to Customer 360"
          git push origin HEAD:feat/wire-customer-360-v1
