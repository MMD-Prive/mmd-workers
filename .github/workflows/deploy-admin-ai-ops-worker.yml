name: Deploy admin-ai-ops-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-ai-ops-worker/**"
      - ".github/workflows/deploy-admin-ai-ops-worker.yml"

concurrency:
  group: deploy-admin-ai-ops-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      WORKER_NAME: admin-ai-ops-worker
      BASE_URL: https://mmdbkk.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare tokens
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const deployToken = clean(process.env.CLOUDFLARE_API_TOKEN);
          const routesToken = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          if (!deployToken) throw new Error("CLOUDFLARE_API_TOKEN missing");
          if (!routesToken) throw new Error("CLOUDFLARE_ROUTES_API_TOKEN missing");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${deployToken}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${routesToken}\n`);
          NODE

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-ai-ops-worker/src/index.js
          node --check admin-ai-ops-worker/src/gate.js
          node --test admin-ai-ops-worker/test/*.test.mjs
          npx --yes wrangler@4 deploy --dry-run --config admin-ai-ops-worker/wrangler.toml

      - name: Deploy worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --config admin-ai-ops-worker/wrangler.toml \
            --keep-vars \
            --message "GitHub Actions ${GITHUB_SHA}"

      - name: Sync exact production routes
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ROUTES_API_TOKEN"
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = process.env.WORKER_NAME;
          const desired = [
            "mmdbkk.com/v1/admin/ai-ops/*",
            "www.mmdbkk.com/v1/admin/ai-ops/*",
          ];
          async function cf(path, options = {}) {
            const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", ...(options.headers || {}) },
            });
            const body = await r.json();
            if (!r.ok || body.success !== true) throw new Error(JSON.stringify(body.errors || body));
            return body.result;
          }
          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          for (const pattern of desired) {
            const conflict = existing.find((x) => x.pattern === pattern && x.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || "none"}`);
          }
          for (const pattern of desired) {
            if (existing.some((x) => x.pattern === pattern && x.script === worker)) continue;
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
          }
          const verified = await cf(routePath);
          const missing = desired.filter((pattern) => !verified.some((x) => x.pattern === pattern && x.script === worker));
          if (missing.length) throw new Error(`missing routes: ${missing.join(", ")}`);
          console.log(`verified ${desired.length}/${desired.length} AI Ops routes`);
          NODE

      - name: Smoke shared client
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" "$BASE_URL/v1/admin/ai-ops/client.js")"
          test "$code" = "200"
          grep -q 'AI OPS' "$body"

      - name: Smoke context fail-closed without admin session
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w "%{http_code}" "$BASE_URL/v1/admin/ai-ops/context?path=%2Finternal%2Fadmin%2Fcontrol-room")"
          echo "HTTP $code"
          cat "$body"
          test "$code" = "401"
          grep -q '"error":"unauthorized"' "$body"
