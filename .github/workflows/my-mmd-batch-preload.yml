name: My MMD customer history batch preload

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/my-mmd-batch-preload.js"
      - "scripts/my-mmd-batch-preload.test.js"
      - ".github/workflows/my-mmd-batch-preload.yml"

permissions:
  contents: read

concurrency:
  group: my-mmd-batch-preload-production
  cancel-in-progress: false

jobs:
  preload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: "appsV1ILPRfIjkaYg"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate lifetime Points policy and amount guardrails
        run: |
          node --check scripts/my-mmd-batch-preload.js
          node --test scripts/my-mmd-batch-preload.test.js

      - name: Dry-run every canonical Client
        run: node scripts/my-mmd-batch-preload.js --report /tmp/my-mmd-preload-dry-run.json

      - name: Verify projection-only write boundary
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/my-mmd-preload-dry-run.json", "utf8"));
          if (report?.ok !== true || report?.truth_writes !== false) throw new Error("preload_write_boundary_failed");
          const forbidden = new Set(report?.forbidden_writes || []);
          for (const table of ["MMD — Member Entitlements", "MMD — Points Ledger", "Payments", "Sessions"]) {
            if (!forbidden.has(table)) throw new Error(`missing_forbidden_write_guard:${table}`);
          }
          NODE

      - name: Apply customer projections to Airtable
        run: node scripts/my-mmd-batch-preload.js --apply --report /tmp/my-mmd-preload-apply.json

      - name: Verify same-window idempotency
        run: node scripts/my-mmd-batch-preload.js --assert-idempotent --report /tmp/my-mmd-preload-idempotency.json

      - name: Upload redacted operational reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-mmd-batch-preload-${{ github.run_id }}
          path: |
            /tmp/my-mmd-preload-dry-run.json
            /tmp/my-mmd-preload-apply.json
            /tmp/my-mmd-preload-idempotency.json
          if-no-files-found: warn
          retention-days: 30
