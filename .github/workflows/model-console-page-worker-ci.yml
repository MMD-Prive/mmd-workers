name: Model Console Page Worker CI

on:
  pull_request:
    paths:
      - "model-console-page-worker/**"
      - ".github/workflows/model-console-page-worker-ci.yml"
  push:
    branches: [main]
    paths:
      - "model-console-page-worker/**"
      - ".github/workflows/model-console-page-worker-ci.yml"

permissions:
  contents: read

jobs:
  console-page-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify approved HTML artifact hashes
        run: |
          sha256sum -c - <<'SHA256'
          4aff4a31b418a92501349e446af8ac893b9ff17183355ed20df623c41a4be739  model-console-page-worker/src/artifacts/candidate.html
          7dd6e42b4a4dcb292fb4830c8abd134b94ca356a8a9a3d4b5dba51128eae8965  model-console-page-worker/src/artifacts/rollback.html
          SHA256
      - name: Run Console page Worker mock tests
        run: node --test model-console-page-worker/test/index.test.mjs
