name: Legacy SIGIL Booking deployment retired

# Full-source deployment and route synchronization are retired.
# Use the separately reviewed Booking artifact workflow with explicit owner approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-release-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse legacy deployment
        run: |
          echo 'Legacy SIGIL Booking deployment is disabled. No production changes were made.'
          echo 'Use deploy-member-booking-artifact.yml only after exact SHA and migration review plus owner approval.'
          exit 1
