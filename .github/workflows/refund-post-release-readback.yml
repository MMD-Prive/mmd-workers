name: Refund post-release GET-only attestation
on:
  push:
    branches: [codex/refund-post-release-readback]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: No-network reporting regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/refund-release-preserved.test.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41700178784
          name: refund-preserved-bundles-59187649f3cdeb209f6b424303b03da765ec31b8
          path: refund-preserved-input
      - name: GET-only exact active version source and maps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/refund-post-release-readback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-post-release-readback-${{ github.run_id }}
          path: refund-served-readback/
          retention-days: 7
