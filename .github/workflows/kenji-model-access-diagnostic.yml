name: Kenji model access diagnostic

on:
  pull_request:
    paths:
      - "admin-worker/src/kenji-model-access-rpc.js"
      - "admin-worker/kenji-model-access-rpc.test.mjs"
      - "member-dashboard-chat-worker/src/index.js"
      - "member-dashboard-chat-worker/test/kenji-model-access.test.mjs"
      - ".github/workflows/kenji-model-access-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax and config checks
        run: npm run check
      - name: Admin login regression
        run: npm run test:admin-login
      - name: Model access LINE adapter regression
        run: node --experimental-global-webcrypto --test member-dashboard-chat-worker/test/kenji-model-access.test.mjs
      - name: LINE live truth and webhook core
        run: node --experimental-global-webcrypto --test member-dashboard-chat-worker/src/kenji-live-member-truth-adapter.test.mjs shared/verified-member-concierge.test.mjs member-dashboard-chat-worker/test/kenji-line-live-truth.test.mjs member-dashboard-chat-worker/test/line-webhook.test.mjs
      - name: Remaining member dashboard LINE regression
        run: node --experimental-global-webcrypto --test webflow/member/kenji-ai-20/kenji-member-concierge.test.mjs shared/kenji-customer-memory-v2.test.mjs member-dashboard-chat-worker/test/kenji-canonical-client-memory-v2.test.mjs member-dashboard-chat-worker/test/kenji-next-action.test.mjs member-dashboard-chat-worker/test/kenji-seed-live-truth-cutover.test.mjs member-dashboard-chat-worker/test/kenji-model-layer.test.mjs member-dashboard-chat-worker/test/kenji-model-access-smoke.test.mjs member-dashboard-chat-worker/test/kenji-folder-history-assessment.test.mjs member-dashboard-chat-worker/test/kenji-folder-history-adapter.test.mjs member-dashboard-chat-worker/test/kenji-ai-worker-line-bridge.test.mjs member-dashboard-chat-worker/test/kenji-seed-runtime-cutover.test.mjs member-dashboard-chat-worker/test/kenji-runtime-env-bindings.test.mjs
      - name: Canonical model access regression
        run: npm run test:kenji-model-access
