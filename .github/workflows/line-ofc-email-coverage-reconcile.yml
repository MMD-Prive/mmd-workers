name: LINE OFC email coverage reconcile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/line-ofc-email-coverage-reconcile.js
      - .github/workflows/line-ofc-email-coverage-reconcile.yml

permissions:
  contents: read

concurrency:
  group: line-ofc-email-coverage-reconcile-production
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: appsV1ILPRfIjkaYg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate
        run: |
          node --check scripts/line-ofc-email-coverage-reconcile.js
          node scripts/line-ofc-email-coverage-reconcile.js --self-test
      - name: Dry run
        run: node scripts/line-ofc-email-coverage-reconcile.js --dry-run --report /tmp/email-coverage-dry-run.json
      - name: Apply verified email evidence
        run: node scripts/line-ofc-email-coverage-reconcile.js --apply --report /tmp/email-coverage-apply.json
      - name: Verify idempotency
        run: node scripts/line-ofc-email-coverage-reconcile.js --dry-run --assert-idempotent --report /tmp/email-coverage-idempotency.json
      - name: Upload redacted count reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-ofc-email-coverage-report
          path: |
            /tmp/email-coverage-dry-run.json
            /tmp/email-coverage-apply.json
            /tmp/email-coverage-idempotency.json
          if-no-files-found: warn
          retention-days: 30
