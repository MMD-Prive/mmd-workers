name: Fix Customer Data API routes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-customer-data-api-routes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      WORKER_NAME: immigrate-worker
    steps:
      - name: Sync Customer Data API routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = (process.env.CLOUDFLARE_ROUTES_API_TOKEN || '').trim();
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = process.env.WORKER_NAME;
          if (!token) throw new Error('missing CLOUDFLARE_ROUTES_API_TOKEN');
          const desired = [
            'mmdbkk.com/v1/admin/customer-data*',
            'www.mmdbkk.com/v1/admin/customer-data*',
          ];
          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) throw new Error(JSON.stringify(body.errors || body));
            return body.result;
          }
          const routePath = `/zones/${zoneId}/workers/routes`;
          let routes = await cf(routePath);
          for (const pattern of desired) {
            const conflict = routes.find((r) => r.pattern === pattern && r.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || 'none'}`);
            if (!routes.some((r) => r.pattern === pattern && r.script === worker)) {
              await cf(routePath, { method: 'POST', body: JSON.stringify({ pattern, script: worker }) });
              console.log(`created ${pattern} -> ${worker}`);
            }
          }
          routes = await cf(routePath);
          for (const pattern of desired) {
            if (!routes.some((r) => r.pattern === pattern && r.script === worker)) {
              throw new Error(`missing route ${pattern}`);
            }
          }
          console.log('Customer Data API routes verified');
          NODE

      - name: Verify API no longer falls through to Webflow HTML
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$origin/v1/admin/customer-data/queue?status=review_required")"
            ctype="$(grep -i '^content-type:' "$headers" | tail -n1 | tr -d '\r' || true)"
            echo "$origin -> HTTP $code / $ctype"
            if grep -Eqi 'text/html' "$headers"; then
              echo "Customer Data API still falls through to HTML on $origin" >&2
              head -c 240 "$body" >&2 || true
              exit 1
            fi
            rm -f "$headers" "$body"
          done
