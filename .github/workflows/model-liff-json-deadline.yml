name: MY MODEL JSON deadline contract

on:
  pull_request:
    paths:
      - "model-dashboard-presentation-worker/**"
      - ".github/workflows/model-liff-json-deadline.yml"
  push:
    branches: [main]
    paths:
      - "model-dashboard-presentation-worker/**"
      - ".github/workflows/model-liff-json-deadline.yml"

permissions:
  contents: read

jobs:
  timeout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test generated bootstrap and real stalled JSON on localhost only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model-deadline-evidence/src"
          cp model-dashboard-presentation-worker/src/model-liff-digital-shell.js "$RUNNER_TEMP/model-deadline-evidence/src/"
          cp model-dashboard-presentation-worker/src/model-json-deadline-runtime.js "$RUNNER_TEMP/model-deadline-evidence/src/"
          cp model-dashboard-presentation-worker/model-liff-json-deadline.test.mjs "$RUNNER_TEMP/model-deadline-evidence/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/model-deadline-evidence/source-sha.txt"
          node --check model-dashboard-presentation-worker/src/model-liff-digital-shell.js
          node --check model-dashboard-presentation-worker/src/model-json-deadline-runtime.js
          node --test model-dashboard-presentation-worker/model-liff-json-deadline.test.mjs 2>&1 | tee "$RUNNER_TEMP/model-deadline-evidence/tests.tap"
      - name: Preserve test evidence (synthetic, no credentials or production requests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-liff-json-deadline-${{ github.sha }}
          path: ${{ runner.temp }}/model-deadline-evidence/
          retention-days: 14
          if-no-files-found: error
