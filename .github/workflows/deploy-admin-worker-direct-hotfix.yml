name: Emergency direct deploy admin-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-admin-worker-direct-hotfix.yml"

concurrency:
  group: deploy-admin-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  direct-deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      ADMIN_WORKER_URL: https://admin-worker.malemodel-bkk.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare deploy token
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const token = (process.env.CLOUDFLARE_API_TOKEN || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          if (!token) throw new Error("Cloudflare deploy API token is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${token}\n`);
          NODE

      - name: Verify exact manual fallback behavior before deploy
        shell: bash
        run: |
          set -euo pipefail
          node --check src/create-session-client-lineage-runtime.js
          node --test \
            create-session-client-lineage-runtime.test.mjs \
            create-session-manual-public-fallback.test.mjs

      - name: Build no-routes deploy config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("wrangler.toml", "utf8").split(/\r?\n/);
          const output = [];
          let skippingRoute = false;
          for (const line of input) {
            if (/^\s*\[\[routes\]\]\s*$/.test(line)) {
              skippingRoute = true;
              continue;
            }
            if (skippingRoute && /^\s*\[/.test(line)) skippingRoute = false;
            if (!skippingRoute) output.push(line);
          }
          fs.writeFileSync(".wrangler-direct-no-routes.toml", `${output.join("\n")}\n`);
          NODE
          if grep -q '^\s*\[\[routes\]\]' .wrangler-direct-no-routes.toml; then
            echo "No-routes deploy config still contains routes; refusing deploy." >&2
            exit 1
          fi

      - name: Direct deploy exact main source without route mutation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy \
            --keep-vars \
            --config .wrangler-direct-no-routes.toml \
            2>&1 | tee "$RUNNER_TEMP/admin-worker-direct-deploy.log"
          version_id="$(sed -n 's/.*Current Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/admin-worker-direct-deploy.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Direct deploy completed but Current Version ID was not present in Wrangler output." >&2
            cat "$RUNNER_TEMP/admin-worker-direct-deploy.log" >&2
            exit 1
          fi
          echo "ADMIN_WORKER_DIRECT_VERSION_ID=${version_id}" >> "$GITHUB_ENV"
          echo "Direct-deployed admin-worker version ${version_id} from ${GITHUB_SHA}"

      - name: Verify live Worker script contains manual fallback
        shell: bash
        run: |
          set -euo pipefail
          script_file="$(mktemp)"
          http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
            -o "$script_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/admin-worker/content")"
          test "$http_code" = "200"
          grep -a -q 'manual_public_only_pending_reconcile' "$script_file"
          grep -a -q 'manual_name_pending_reconcile' "$script_file"
          grep -a -q 'owner_manual_name_pending_reconcile' "$script_file"
          echo "Verified live admin-worker script content contains canonical manual Public fallback markers."

      - name: Verify live admin-worker route responds
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
            -o "$body_file" \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"query":"__mmd_manual_fallback_live_smoke__"}' \
            "$ADMIN_WORKER_URL/v1/admin/clients/lineage-lookup")"
          cat "$body_file"
          test "$http_code" = "401"
          grep -q '"error":"unauthorized"' "$body_file"
          echo "Live admin-worker route responds after direct deployment; focused fallback tests passed on the exact deployed source."

      - name: Clean temporary config
        if: always()
        shell: bash
        run: rm -f .wrangler-direct-no-routes.toml
