name: Sync Telegram routes (owner approved only)

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner approval for the listed missing routes only'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference including the reviewed route diff'
        type: string
        required: true
      approved_sha:
        description: 'Full main commit SHA approved for this operation'
        type: string
        required: true
      approved_missing_patterns:
        description: 'Exact JSON array of missing canonical patterns; [] permits readback only'
        type: string
        required: true

concurrency:
  group: deploy-telegram-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && github.run_attempt == 1
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}

  sync-routes:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && github.run_attempt == 1
    needs: [production-approval]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Sync only the approved missing exact routes
        env:
          CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
          APPROVED_MISSING_PATTERNS: ${{ inputs.approved_missing_patterns }}
        run: node scripts/telegram-workflow-operations.mjs sync-routes
