name: Apply payment proof client provenance v1

on:
  push:
    branches:
      - feat/payment-proof-client-provenance-v1
    paths:
      - scripts/apply-payment-proof-client-provenance-v1.mjs
      - .github/workflows/apply-payment-proof-client-provenance-v1.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-proof-client-provenance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical Client linkage patch
        run: node scripts/apply-payment-proof-client-provenance-v1.mjs
      - name: Syntax and focused tests
        run: |
          set -euo pipefail
          node --check immigrate-worker/netlify/functions/line-payment-slip-intake.mjs
          node --check admin-worker/src/payment-proof-client-provenance-wrapper.js
          node --check admin-worker/src/client-credit-ref-wrapper.js
          node --test immigrate-worker/netlify/tests/payment-slip-client-link.test.mjs
          node --test admin-worker/payment-proof-client-provenance-wrapper.test.mjs
      - name: Commit generated source patch
        run: |
          set -euo pipefail
          git diff --check
          git add immigrate-worker/netlify/functions/line-payment-slip-intake.mjs
          if git diff --cached --quiet; then
            echo "No generated source changes"
            exit 0
          fi
          git config user.name "mmd-provenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: link LINE payment proofs to canonical Clients"
          git push origin HEAD:feat/payment-proof-client-provenance-v1
