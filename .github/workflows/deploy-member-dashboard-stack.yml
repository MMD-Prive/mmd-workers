name: Deploy member dashboard status stack

on:
  push:
    branches:
      - main
    paths:
      - "member-pages-worker/**"
      - "auth-worker/**"
      - "mmd-redirect-worker/**"
      - ".github/workflows/deploy-member-dashboard-stack.yml"
  workflow_dispatch:

concurrency:
  group: deploy-member-dashboard-status-stack-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_API_TOKEN);
          const accountId = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          if (!token || !accountId) throw new Error("Cloudflare credentials are missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${token}\nCLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate member-pages worker
        run: |
          npm run test:member-pages-liff
          npm run check:member-pages-wrangler

      - name: Validate worker syntax
        run: |
          node --check member-pages-worker/src/runtime-index.js
          node --check auth-worker/src/index.js
          node --check mmd-redirect-worker/src/index.js

      - name: Dry run member-pages-worker
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars --config member-pages-worker/wrangler.toml

      - name: Deploy member-pages-worker
        run: npx --yes wrangler@4 deploy --keep-vars --config member-pages-worker/wrangler.toml

      - name: Dry run mmd-auth-worker
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars --config auth-worker/wrangler.toml

      - name: Deploy mmd-auth-worker
        run: npx --yes wrangler@4 deploy --keep-vars --config auth-worker/wrangler.toml

      - name: Dry run mmd-redirect-worker
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars --config mmd-redirect-worker/wrangler.toml

      - name: Deploy mmd-redirect-worker
        run: npx --yes wrangler@4 deploy --keep-vars --config mmd-redirect-worker/wrangler.toml
