name: Validate member dashboard status stack

on:
  pull_request:
    paths:
      - "auth-worker/**"
      - "member-pages-worker/**"
      - ".github/workflows/deploy-member-dashboard-stack.yml"
  push:
    branches:
      - main
    paths:
      - "auth-worker/**"
      - "member-pages-worker/**"
      - ".github/workflows/deploy-member-dashboard-stack.yml"
  workflow_dispatch:

concurrency:
  group: validate-member-dashboard-status-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Validation-only guard.
# Production ownership for mmd-auth-worker lives exclusively in
# .github/workflows/deploy-auth-worker.yml, which uploads/deploys a Worker version,
# syncs the narrow operator routes with the dedicated routes token, runs production
# smoke checks, and records the deployment receipt. Do not deploy auth-worker here.

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix member-pages-worker/test-runtime

      - name: Validate member-pages worker
        run: |
          npm run test:member-pages-liff
          npm run check:member-pages-wrangler

      - name: Validate auth worker and customer projection
        run: |
          node --check auth-worker/src/index.js
          node --check auth-worker/src/customer-360-resolver.js
          npm run test:auth-liff-profile

      - name: Validate worker syntax
        run: node --check member-pages-worker/src/runtime-index.js

      - name: Dry run mmd-auth-worker only
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars --config auth-worker/wrangler.toml
