name: Diagnose Man Refund LINE Quota

on:
  push:
    branches:
      - ops/diagnose-man-refund-line-quota-20260929

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_SMOKE_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require owner credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_SMOKE_CREDENTIAL:-}"
          echo "::add-mask::$ADMIN_SMOKE_CREDENTIAL"
      - name: Diagnose failed LINE lane once
        run: node scripts/diagnose-man-refund-line-quota-prod.mjs
