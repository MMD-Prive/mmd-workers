name: Private Model LIFF handoff CI

on:
  pull_request:
    paths:
      - "admin-worker/src/private-model-application-handoff.js"
      - "admin-worker/src/admin-login-hero-worker.js"
      - "admin-worker/private-model-application-handoff.test.mjs"
      - ".github/workflows/private-model-liff-handoff-ci.yml"
  push:
    branches: [main]
    paths:
      - "admin-worker/src/private-model-application-handoff.js"
      - "admin-worker/src/admin-login-hero-worker.js"
      - "admin-worker/private-model-application-handoff.test.mjs"
      - ".github/workflows/private-model-liff-handoff-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: admin-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check src/private-model-application-handoff.js
          node --check src/admin-login-hero-worker.js
      - name: Handoff policy tests
        run: node --test private-model-application-handoff.test.mjs model-dashboard-policy.test.mjs
