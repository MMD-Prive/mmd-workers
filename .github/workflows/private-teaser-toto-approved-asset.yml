name: Private Teaser TOTO approved asset production prepare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-teaser-toto-approved-asset.yml"
      - "scripts/private-teaser-toto-approved-asset.mjs"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: private-teaser-toto-approved-asset-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      ORIGIN: https://mmdbkk.com
      MODEL_UNIQUE_KEY: toto
      ADMIN_LOGIN_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: appsV1ILPRfIjkaYg
      MODELS_TABLE: tblI4B0bI446vp9GX
      MEDIA_TABLE: tblrpQXhHnbTU9RhW
      GRANTS_TABLE: tblbP1csaTYfffS01
      CONSUMPTION_TABLE: tblcjjCW0pXvlhNQQ
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate owner-approved asset runner
        run: node --check scripts/private-teaser-toto-approved-asset.mjs
      - name: Import and approve exact canonical TOTO teaser asset
        run: node scripts/private-teaser-toto-approved-asset.mjs
