name: Release member-pages-worker code only

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Approval-only proof performs no Worker release; release requires separate production approval'
        type: choice
        required: true
        default: approval_boundary_only
        options:
          - approval_boundary_only
          - release
      production_approved:
        description: 'Owner authorization for the selected mode and exact SHA; not an environment approval receipt'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this exact release'
        type: string
        required: true
      approved_sha:
        description: 'Full main SHA of approved release tooling; application source is fixed to Graphics V4 startup fix PR 2544'
        type: string
        required: true
      expected_version:
        description: 'Active member-pages-worker version UUID from fresh approved preflight'
        type: string
        required: false
      expected_deployment:
        description: 'Active deployment UUID from fresh approved preflight'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.execution_mode == 'approval_boundary_only' && 'member-pages-approval-boundary-test' || 'deploy-member-pages-worker-production' }}
  cancel-in-progress: false

jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && (inputs.execution_mode == 'approval_boundary_only' || inputs.execution_mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify existing production reviewer protection
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/member-pages-owner-approval.mjs --preflight

  approval-boundary-only:
    # This job can create GitHub environment approval history, never a Worker release.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && inputs.execution_mode == 'approval_boundary_only'
    needs: [production-approval]
    environment: member-pages-code-only-owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify actual current-run owner approval without release credentials
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/member-pages-owner-approval.mjs

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && inputs.execution_mode == 'release' && inputs.expected_version != '' && inputs.expected_deployment != ''
    needs: [production-approval]
    environment: member-pages-code-only-owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: release-tools
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: release-tools
          persist-credentials: false
      - name: Check out exact reviewed Graphics V4 startup fix PR 2544 application source
        uses: actions/checkout@v5
        with:
          ref: fe5f9d98876b600421c5614efc049ffc890b8adb
          fetch-depth: 0
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify code-only release contract and targeted LIFF behavior
        run: |
          node --test scripts/member-pages-owner-approval.test.mjs scripts/member-pages-code-only-release.test.mjs
          node --test ../release-source/member-pages-worker/test/liff-member-shell.test.mjs ../release-source/member-pages-worker/test/liff-member-compact-v4.test.mjs ../release-source/member-pages-worker/test/liff-quick-membership.test.mjs ../release-source/member-pages-worker/test/member-history-preview.test.mjs ../release-source/member-pages-worker/test/points-display-source-guard.test.mjs ../release-source/member-pages-worker/test/kenji-line-member-truth.test.mjs
          node --check ../release-source/member-pages-worker/src/liff-member-shell.js
      - name: Install pinned Wrangler bundler
        run: npm install --global wrangler@4.151.1 --no-audit --no-fund
      - name: Upload and promote exact source with strict binding inheritance
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          SOURCE_DIRECTORY: ${{ github.workspace }}/release-source
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
          CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/member-pages-code-only-release.mjs --execute-approved
      - name: Upload sanitized code-only release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-pages-worker-code-only-${{ github.run_id }}
          path: ${{ runner.temp }}/member-pages-code-only-receipt.json
          if-no-files-found: ignore
          retention-days: 14
