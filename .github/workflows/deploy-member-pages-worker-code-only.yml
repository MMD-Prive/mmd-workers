name: Release member-pages-worker code only

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Approval-only proof performs no Worker release; release requires separate production approval'
        type: choice
        required: true
        default: approval_boundary_only
        options:
          - approval_boundary_only
          - release
          - recovery-artifact
          - companion-artifact
          - renewal-artifact
          - renewal-activation
          - promote-existing
          - lv15-artifact
          - nightline-artifact
          - care-back-november
          - care-back-november-resume
      production_approved:
        description: 'Owner authorization for the selected mode and exact SHA; not an environment approval receipt'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this exact release'
        type: string
        required: true
      approved_sha:
        description: 'Full main SHA of approved release tooling; source or artifact delta is fixed by the selected reviewed mode'
        type: string
        required: true
      expected_version:
        description: 'Active member-pages-worker version UUID from fresh approved preflight'
        type: string
        required: false
      expected_deployment:
        description: 'Active deployment UUID from fresh approved preflight'
        type: string
        required: false
      patch_manifest:
        description: 'For care-back-november only: tracked exact function-pair manifest path'
        type: string
        required: false
      expected_manifest_sha256:
        description: 'For care-back-november only: exact reviewed manifest SHA-256'
        type: string
        required: false
      expected_module_sha256:
        description: 'For care-back-november only: fresh active main-module SHA-256'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.execution_mode == 'approval_boundary_only' && 'member-pages-approval-boundary-test' || 'deploy-member-pages-worker-production' }}
  cancel-in-progress: false

jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && (inputs.execution_mode == 'approval_boundary_only' || inputs.execution_mode == 'release' || inputs.execution_mode == 'recovery-artifact' || inputs.execution_mode == 'companion-artifact' || inputs.execution_mode == 'renewal-artifact' || inputs.execution_mode == 'promote-existing' || inputs.execution_mode == 'renewal-activation' || inputs.execution_mode == 'lv15-artifact' || inputs.execution_mode == 'nightline-artifact' || (inputs.execution_mode == 'care-back-november' || inputs.execution_mode == 'care-back-november-resume'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify existing production reviewer protection
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/member-pages-owner-approval.mjs --preflight

  approval-boundary-only:
    # This job can create GitHub environment approval history, never a Worker release.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && inputs.execution_mode == 'approval_boundary_only'
    needs: [production-approval]
    environment: member-pages-code-only-owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify actual current-run owner approval without release credentials
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/member-pages-owner-approval.mjs

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && (inputs.execution_mode == 'release' || inputs.execution_mode == 'recovery-artifact' || inputs.execution_mode == 'companion-artifact' || inputs.execution_mode == 'renewal-artifact' || inputs.execution_mode == 'promote-existing' || inputs.execution_mode == 'renewal-activation') && inputs.expected_version != '' && inputs.expected_deployment != ''
    needs: [production-approval]
    environment: member-pages-code-only-owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: release-tools
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: release-tools
          persist-credentials: false
      - name: Check out exact reviewed MY MMD PR 2652 application source
        if: inputs.execution_mode == 'release'
        uses: actions/checkout@v5
        with:
          ref: 871d99cd9eb1c8d53e1d473160119030dca01d4c
          fetch-depth: 0
          path: release-source
          persist-credentials: false
      - name: Check out exact reviewed recovery source
        if: inputs.execution_mode == 'recovery-artifact'
        uses: actions/checkout@v5
        with:
          ref: d82c284fb48943c7c8a8cc5a970107f799186ee3
          fetch-depth: 0
          path: recovery-source
          persist-credentials: false
      - name: Verify scoped recovery release runner without production writes
        if: inputs.execution_mode == 'recovery-artifact'
        run: |
          node --test scripts/member-pages-recovery-artifact.test.mjs scripts/member-pages-recovery-artifact-release.test.mjs
          node scripts/member-pages-recovery-artifact-release.mjs --plan-only
      - name: Check out original startup source for promotion-only recovery
        if: inputs.execution_mode == 'promote-existing'
        uses: actions/checkout@v5
        with:
          ref: fe5f9d98876b600421c5614efc049ffc890b8adb
          fetch-depth: 0
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify code-only release contract
        run: |
          node --test scripts/member-pages-owner-approval.test.mjs scripts/member-pages-artifact-delta.test.mjs scripts/member-pages-code-only-release.test.mjs scripts/member-pages-uploaded-recovery.test.mjs scripts/member-pages-promotion-only-recovery.test.mjs scripts/member-pages-recovery-adapter.test.mjs scripts/member-pages-renewal-artifact.test.mjs scripts/member-pages-renewal-activation.test.mjs
      - name: Verify MY MMD release source behavior
        if: inputs.execution_mode == 'release'
        run: |
          node --test ../release-source/member-pages-worker/test/liff-member-shell.test.mjs ../release-source/member-pages-worker/test/liff-member-compact-v4.test.mjs ../release-source/member-pages-worker/test/liff-quick-membership.test.mjs ../release-source/member-pages-worker/test/member-history-preview.test.mjs ../release-source/member-pages-worker/test/points-display-source-guard.test.mjs ../release-source/member-pages-worker/test/kenji-line-member-truth.test.mjs ../release-source/member-pages-worker/test/liff-account-view.test.mjs ../release-source/member-pages-worker/test/liff-identity-foundation.test.mjs ../release-source/member-pages-worker/test/member-app-api.runtime.test.mjs
          node --check ../release-source/member-pages-worker/src/liff-member-shell.js
      - name: Verify original startup source behavior for recovery
        if: inputs.execution_mode == 'promote-existing'
        run: |
          node --test ../release-source/member-pages-worker/test/liff-member-shell.test.mjs ../release-source/member-pages-worker/test/liff-member-compact-v4.test.mjs ../release-source/member-pages-worker/test/liff-quick-membership.test.mjs ../release-source/member-pages-worker/test/member-history-preview.test.mjs ../release-source/member-pages-worker/test/points-display-source-guard.test.mjs ../release-source/member-pages-worker/test/kenji-line-member-truth.test.mjs
          node --check ../release-source/member-pages-worker/src/liff-member-shell.js
      - name: Verify Companion behavior for artifact delta
        if: inputs.execution_mode == 'companion-artifact'
        run: node --test member-pages-worker/test/liff-member-shell.test.mjs member-pages-worker/test/liff-personal-main.test.mjs
      - name: Verify Renewal recovery source behavior
        if: inputs.execution_mode == 'renewal-artifact'
        run: node --test member-pages-worker/test/liff-member-shell.test.mjs member-pages-worker/test/liff-identity-foundation.test.mjs member-pages-worker/test/liff-renewal-card.test.mjs member-pages-worker/test/renewal-offer.test.mjs shared/membership-promotion-policy.test.mjs
      - name: Install pinned Wrangler bundler
        if: inputs.execution_mode != 'companion-artifact' && inputs.execution_mode != 'renewal-artifact' && inputs.execution_mode != 'renewal-activation'
        run: npm install --global wrangler@4.151.1 --no-audit --no-fund
      - name: Upload and promote reviewed code with strict binding inheritance
        if: inputs.execution_mode == 'release' || inputs.execution_mode == 'companion-artifact' || inputs.execution_mode == 'renewal-artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          SOURCE_DIRECTORY: ${{ github.workspace }}/release-source
          RELEASE_MODE: ${{ inputs.execution_mode }}
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
          CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/member-pages-code-only-release.mjs --execute-approved
      - name: Verify Renewal activation payment evidence regressions
        if: inputs.execution_mode == 'renewal-activation'
        run: node --test member-pages-worker/test/liff-renewal-eligibility.test.mjs member-pages-worker/test/liff-renewal-card.test.mjs member-pages-worker/test/renewal-offer.test.mjs payments-worker/renewal-payment-intent.test.mjs payments-worker/renewal-pending-readback.test.mjs
      - name: Activate only the reviewed Renewal flag with unchanged code
        if: inputs.execution_mode == 'renewal-activation'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_MODE: ${{ inputs.execution_mode }}
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
          CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/member-pages-renewal-activation.mjs --execute-approved
      - name: Promote only the verified existing startup version
        if: inputs.execution_mode == 'promote-existing'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          SOURCE_DIRECTORY: ${{ github.workspace }}/release-source
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          RECOVERY_MODE: ${{ inputs.execution_mode }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
          EXPECTED_UPLOADED_VERSION: eef80a0c-afb7-4abc-bd91-6b02f5440d02
          CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/member-pages-recovery-adapter.mjs --execute-approved
      - name: Upload sanitized code-only release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-pages-worker-code-only-${{ github.run_id }}
          path: ${{ runner.temp }}/member-pages-code-only-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  lv15-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && inputs.execution_mode == 'lv15-artifact' && inputs.expected_version != '' && inputs.expected_deployment != ''
    needs: [production-approval]
    environment: member-pages-code-only-owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify LV15 artifact and existing member regressions
        run: |
          node --check scripts/member-pages-lv15-artifact.mjs
          node --check scripts/verify-my-mmd-lv15-live.mjs
          node --test scripts/member-pages-lv15-artifact.test.mjs scripts/member-pages-owner-approval.test.mjs member-pages-worker/test/liff-member-lv15-restore.test.mjs member-pages-worker/test/liff-member-compact-v4.test.mjs member-pages-worker/test/liff-member-shell.test.mjs member-pages-worker/test/liff-quick-membership.test.mjs member-pages-worker/test/points-display-source-guard.test.mjs
      - name: Apply exact reversible LV15 delta to approved active artifact
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_MODE: lv15-artifact
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
          CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/member-pages-lv15-artifact.mjs --execute-approved
      - name: Verify live LIFF HTML without login or business writes
        run: node scripts/verify-my-mmd-lv15-live.mjs --read-only
      - name: Save sanitized LV15 release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-pages-lv15-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/member-pages-lv15-receipt.json
            ${{ runner.temp }}/member-pages-lv15-live-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  nightline-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && inputs.execution_mode == 'nightline-artifact' && inputs.expected_version != '' && inputs.expected_deployment != ''
    needs: [production-approval]
    environment: member-pages-code-only-owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify Nightline skin and owner gate
        run: node --test scripts/member-pages-owner-approval.test.mjs
      - name: Apply exact reversible Nightline delta to approved active artifact
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RELEASE_MODE: nightline-artifact
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
          CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/member-pages-nightline-artifact.mjs --execute-approved
      - name: Save sanitized Nightline release receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-pages-nightline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/member-pages-nightline-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  care-back-november-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && (inputs.execution_mode == 'care-back-november' || inputs.execution_mode == 'care-back-november-resume') && inputs.expected_version != '' && inputs.expected_deployment != '' && inputs.patch_manifest != '' && inputs.expected_manifest_sha256 != '' && inputs.expected_module_sha256 != ''
    needs: [production-approval]
    environment: member-pages-code-only-owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify exact artifact delta and existing owner approval contract
        run: node --test scripts/care-back-november-policy-release.test.mjs scripts/care-back-november-memberpages-manifest.test.mjs scripts/member-pages-owner-approval.test.mjs shared/membership-promotion-policy.test.mjs
      - name: Apply reviewed November policy to the fresh active artifact
        env:
          CARE_BACK_WORKER: member-pages-worker
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          PRODUCTION_ENVIRONMENT_NAME: member-pages-code-only-owner
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          PATCH_MANIFEST: ${{ inputs.patch_manifest }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_MODULE_SHA256: ${{ inputs.expected_module_sha256 }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
        run: node scripts/care-back-november-policy-release.mjs ${{ inputs.execution_mode == 'care-back-november-resume' && '--promote-reviewed-upload' || '--execute-approved' }}
      - name: Save sanitized November artifact release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-back-november-member-pages-${{ github.run_id }}
          path: ${{ runner.temp }}/care-back-november-member-pages-worker-receipt.json
          if-no-files-found: ignore
          retention-days: 14


