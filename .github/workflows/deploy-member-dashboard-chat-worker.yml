name: Deploy member-dashboard-chat-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "member-dashboard-chat-worker/**"
      - ".github/workflows/deploy-member-dashboard-chat-worker.yml"

concurrency:
  group: deploy-member-dashboard-chat-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      WORKER_NAME: "member-dashboard-chat-worker"
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Normalize Cloudflare tokens
        id: credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const deployToken = clean(process.env.CLOUDFLARE_API_TOKEN);
          const routesToken = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          const accountId = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const zoneId = clean(process.env.CLOUDFLARE_ZONE_ID);
          if (!deployToken || !routesToken || !accountId || !zoneId) {
            throw new Error("Cloudflare deploy/routes credentials are missing after normalization");
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${deployToken}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${routesToken}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ZONE_ID=${zoneId}\n`);
          NODE

      - name: Verify Cloudflare API token status
        id: token_verify
        shell: bash
        run: |
          set -euo pipefail
          user_body="$RUNNER_TEMP/cloudflare-token-user-verify.json"
          account_body="$RUNNER_TEMP/cloudflare-token-account-verify.json"

          user_http="$(curl --silent --show-error -o "$user_body" -w "%{http_code}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)"
          account_http="$(curl --silent --show-error -o "$account_body" -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)"

          node <<'NODE'
          const fs = require("node:fs");
          const parse = (path) => {
            try { return JSON.parse(fs.readFileSync(path, "utf8")); }
            catch { return {}; }
          };
          const user = parse(process.env.RUNNER_TEMP + "/cloudflare-token-user-verify.json");
          const account = parse(process.env.RUNNER_TEMP + "/cloudflare-token-account-verify.json");
          const userActive = user?.success === true && user?.result?.status === "active";
          const accountActive = account?.success === true && account?.result?.status === "active";
          const safe = (body) => ({
            success: body?.success,
            status: body?.result?.status,
            errors: Array.isArray(body?.errors) ? body.errors.map(({ code, message }) => ({ code, message })) : []
          });
          console.log("Cloudflare user token verify:", JSON.stringify(safe(user)));
          console.log("Cloudflare account token verify:", JSON.stringify(safe(account)));
          if (!userActive && !accountActive) {
            throw new Error("Cloudflare token did not verify active on user or target-account endpoint");
          }
          NODE
          echo "Cloudflare user verify HTTP: ${user_http}"
          echo "Cloudflare account verify HTTP: ${account_http}"

      - name: Inspect Wrangler account context
        id: whoami
        continue-on-error: true
        shell: bash
        working-directory: member-dashboard-chat-worker
        run: |
          set -o pipefail
          npx --yes wrangler@4 whoami 2>&1 | tee "$RUNNER_TEMP/cloudflare-whoami.log"

      - name: Install dependencies
        run: npm ci

      - name: Validate LINE, LIFF, CARE BACK, MMS Therapist, and MMS AI front gate
        id: tests
        run: |
          node --check member-dashboard-chat-worker/src/index.js
          node --check member-dashboard-chat-worker/src/front-gate-index.js
          node --check member-dashboard-chat-worker/src/mms-ai-knowledge-v4.js
          node --check member-dashboard-chat-worker/src/mms-ai-line-front-gate.js
          npm run test:member-dashboard-liff
          npm run test:member-dashboard-line
          node --test member-dashboard-chat-worker/test/line-membership-fallback.test.mjs
          node --test member-dashboard-chat-worker/test/mms-therapist-auth-front-gate.test.mjs

      - name: Validate Cloudflare version upload
        id: wrangler_dry_run
        working-directory: member-dashboard-chat-worker
        run: npx --yes wrangler@4 versions upload --dry-run --keep-vars

      - name: Upload member-dashboard-chat-worker version
        id: upload
        continue-on-error: true
        shell: bash
        working-directory: member-dashboard-chat-worker
        run: |
          set -euo pipefail
          tag="gha-${GITHUB_SHA:0:12}"
          npx --yes wrangler@4 versions upload \
            --keep-vars \
            --tag "$tag" \
            --message "GitHub Actions ${GITHUB_SHA}" \
            2>&1 | tee "$RUNNER_TEMP/member-dashboard-chat-worker-upload.log"

      - name: Resolve uploaded version ID
        id: resolve_version
        if: steps.upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/member-dashboard-chat-worker-upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Unable to parse Worker Version ID from upload output" >&2
            cat "$RUNNER_TEMP/member-dashboard-chat-worker-upload.log" >&2
            exit 2
          fi
          echo "MEMBER_DASHBOARD_CHAT_WORKER_VERSION_ID=${version_id}" >> "$GITHUB_ENV"
          echo "Resolved version ${version_id}"

      - name: Deploy uploaded member-dashboard-chat-worker version
        id: deploy
        if: steps.resolve_version.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: member-dashboard-chat-worker
        run: |
          set -o pipefail
          npx --yes wrangler@4 versions deploy "${MEMBER_DASHBOARD_CHAT_WORKER_VERSION_ID}@100%" -y \
            2>&1 | tee "$RUNNER_TEMP/member-dashboard-chat-worker-deploy.log"

      - name: Sync MMS Therapist auth and MMS LINE routes
        id: route_sync
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = process.env.WORKER_NAME;
          const desired = [
            "mmdbkk.com/male-massage/therapists/api/auth/*",
            "www.mmdbkk.com/male-massage/therapists/api/auth/*",
            "mmdbkk.com/webhooks/line/mms",
            "mmdbkk.com/webhooks/line/mms/",
            "www.mmdbkk.com/webhooks/line/mms",
            "www.mmdbkk.com/webhooks/line/mms/",
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function cf(path, options = {}) {
            let lastError;
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              try {
                const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
                  ...options,
                  headers: {
                    Authorization: `Bearer ${token}`,
                    "Content-Type": "application/json",
                    ...(options.headers || {}),
                  },
                });
                const text = await response.text();
                let body = null;
                try { body = JSON.parse(text); } catch {}
                if (response.ok && body?.success === true) return body.result;
                const retryable = response.status === 429 || response.status >= 500 || !body;
                lastError = new Error(body ? JSON.stringify(body.errors || body) : `cloudflare_non_json_${response.status}:${text.slice(0, 160)}`);
                if (!retryable) throw lastError;
              } catch (error) {
                lastError = error;
              }
              if (attempt < 5) await sleep(attempt * 1000);
            }
            throw lastError || new Error("cloudflare_route_api_failed");
          }
          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          for (const pattern of desired) {
            const conflict = existing.find((route) => route.pattern === pattern && route.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || "none"}`);
          }
          for (const pattern of desired) {
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) continue;
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
          }
          const verified = await cf(routePath);
          const missing = desired.filter((pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`missing routes: ${missing.join(", ")}`);
          console.log(`verified ${desired.length}/${desired.length} MMS routes`);
          NODE

      - name: Smoke production LINE and MMS route ownership
        id: smoke
        if: steps.route_sync.outcome == 'success'
        shell: bash
        run: |
          response="$(curl --retry 6 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error https://www.mmdbkk.com/webhooks/line)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true || body.worker !== "member-dashboard-chat-worker" || body.route !== "line_webhook") {
              throw new Error(`Unexpected production smoke response: ${process.argv[1]}`);
            }
          ' "$response"

          mms_ai="$(curl --retry 6 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error https://www.mmdbkk.com/webhooks/line/mms)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true || body.worker !== "member-dashboard-chat-worker" || body.route !== "mms_line_webhook") {
              throw new Error(`Unexpected MMS AI smoke response: ${process.argv[1]}`);
            }
            if (!String(body.knowledge_version || "").startsWith("mms-ai-knowledge-v4") || body.mutation_allowed !== false) {
              throw new Error(`Unexpected MMS AI knowledge contract: ${process.argv[1]}`);
            }
          ' "$mms_ai"

          catalog="$(curl --retry 6 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error \
            -H 'Origin: https://www.mmdbkk.com' \
            https://www.mmdbkk.com/member/api/liff/mms/catalog)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true || body.data?.skills?.length !== 8) {
              throw new Error(`Unexpected MMS member catalog response: ${process.argv[1]}`);
            }
          ' "$catalog"

          auth_headers="$RUNNER_TEMP/mms-therapist-auth.headers"
          auth_body="$RUNNER_TEMP/mms-therapist-auth.json"
          curl --retry 6 --retry-delay 2 --retry-all-errors --silent --show-error \
            -D "$auth_headers" -o "$auth_body" \
            -H 'Origin: https://www.mmdbkk.com' \
            https://www.mmdbkk.com/male-massage/therapists/api/auth/me || true
          grep -qi '^x-mmd-route-owner: member-dashboard-chat-worker' "$auth_headers"
          grep -qi '^x-mmd-upstream-service: mms-worker' "$auth_headers"
          grep -qi '^cache-control: .*no-store' "$auth_headers"

      - name: Report deploy stage diagnosis
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          TOKEN_VERIFY_OUTCOME: ${{ steps.token_verify.outcome }}
          WHOAMI_OUTCOME: ${{ steps.whoami.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.wrangler_dry_run.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RESOLVE_OUTCOME: ${{ steps.resolve_version.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ROUTE_SYNC_OUTCOME: ${{ steps.route_sync.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$CREDENTIALS_OUTCOME" != "success" ]; then
            stopped="cloudflare token normalization"
          elif [ "$TOKEN_VERIFY_OUTCOME" != "success" ]; then
            stopped="cloudflare token verification"
          elif [ "$TESTS_OUTCOME" != "success" ]; then
            stopped="tests"
          elif [ "$DRY_RUN_OUTCOME" != "success" ]; then
            stopped="versions dry-run"
          elif [ "$UPLOAD_OUTCOME" != "success" ]; then
            stopped="versions upload"
          elif [ "$RESOLVE_OUTCOME" != "success" ]; then
            stopped="resolve uploaded version"
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            stopped="versions deploy"
          elif [ "$ROUTE_SYNC_OUTCOME" != "success" ]; then
            stopped="MMS route sync"
          elif [ "$SMOKE_OUTCOME" != "success" ]; then
            stopped="production smoke"
          else
            stopped="none — live verified"
          fi

          detail=""
          for log in \
            "$RUNNER_TEMP/cloudflare-token-user-verify.json" \
            "$RUNNER_TEMP/cloudflare-token-account-verify.json" \
            "$RUNNER_TEMP/cloudflare-whoami.log" \
            "$RUNNER_TEMP/member-dashboard-chat-worker-upload.log" \
            "$RUNNER_TEMP/member-dashboard-chat-worker-deploy.log" \
            "$RUNNER_TEMP/mms-therapist-auth.headers" \
            "$RUNNER_TEMP/mms-therapist-auth.json"; do
            if [ -f "$log" ]; then
              detail="${detail}$(grep -Ei 'active|disabled|expired|error|failed|permission|account|binding|service|route|conflict|workers.dev|code:|code |version|secret|var|therapist|mms' "$log" | tail -n 50 || true)\n"
            fi
          done
          if [ -z "${detail//\\n/}" ]; then
            detail="No focused Cloudflare/Wrangler diagnostic lines captured."
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ### member-dashboard-chat-worker deploy diagnosis

          - source_sha: \`${GITHUB_SHA}\`
          - checked_at: \`${checked_at}\`
          - token normalization: \`${CREDENTIALS_OUTCOME}\`
          - token verification: \`${TOKEN_VERIFY_OUTCOME}\`
          - wrangler whoami (diagnostic only): \`${WHOAMI_OUTCOME}\`
          - tests: \`${TESTS_OUTCOME}\`
          - versions dry-run: \`${DRY_RUN_OUTCOME}\`
          - versions upload: \`${UPLOAD_OUTCOME}\`
          - resolve version: \`${RESOLVE_OUTCOME}\`
          - versions deploy: \`${DEPLOY_OUTCOME}\`
          - MMS route sync: \`${ROUTE_SYNC_OUTCOME}\`
          - production smoke: \`${SMOKE_OUTCOME}\`
          - **stopped_at: \`${stopped}\`**

          Cloudflare/Wrangler detail:
          \`\`\`text
          ${detail}
          \`\`\`
          EOF
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body-file "$body_file"

      - name: Record verified live receipt
        if: steps.smoke.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "✅ member-dashboard-chat-worker LIVE VERIFIED\n\n- source_sha: \`${GITHUB_SHA}\`\n- deployed_at: \`${deployed_at}\`\n- version_id: \`${MEMBER_DASHBOARD_CHAT_WORKER_VERSION_ID}\`\n- MMD LINE endpoint: \`https://www.mmdbkk.com/webhooks/line\`\n- MMS LINE endpoint: \`https://www.mmdbkk.com/webhooks/line/mms\`\n- MMS Therapist auth route: \`https://www.mmdbkk.com/male-massage/therapists/api/auth/*\`\n- production smoke: MMD LINE + MMS AI V4 + MMS service binding verified\n- route mutation: \`6 narrow MMS routes synced\`"
