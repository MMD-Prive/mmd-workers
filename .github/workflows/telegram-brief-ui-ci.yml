name: Telegram Brief UI
on:
  pull_request:
    paths:
      - 'webflow/internal/admin/telegram-brief/**'
      - '.github/workflows/telegram-brief-ui-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test webflow/internal/admin/telegram-brief/telegram-brief.test.mjs
