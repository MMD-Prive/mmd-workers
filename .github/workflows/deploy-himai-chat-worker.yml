name: Deploy himai-chat-worker
# Router closure rerun: 2026-09-21 configured-state verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "shared/posthog-authority-events.mjs"
      - "himai-chat-worker/**"
      - "shared/mmd-shop-stock-reservation.mjs"
      - "shared/mmd-shop-fulfillment.mjs"
      - "shared/mmd-shop-stock-reconciliation.mjs"
      - ".github/workflows/deploy-himai-chat-worker.yml"

concurrency:
  group: telegram-router-secret-rotation-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: himai-chat-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      WORKER_NAME: "himai-chat-worker"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token
        run: npx --yes wrangler@4 whoami

      - name: Validate source
        run: |
          set -euo pipefail
          node --check src/entry.js
          node --check src/index.js
          node --check src/shop-catalog.js
          node --check src/mmd-shop-checkout.js
          node --check src/mmd-shop-order-page.js
          node --check src/mmd-shop-product-page.js
          node --check src/mmd-shop-stock-coordinator.js
          node --check src/mmd-shop-stock-health.js
          node --check ../shared/mmd-shop-stock-reservation.mjs
          node --check ../shared/mmd-shop-fulfillment.mjs
          node --check ../shared/mmd-shop-stock-reconciliation.mjs
          grep -Fq 'name = "MMD_SHOP_STOCK_COORDINATOR"' wrangler.toml
          grep -Fq 'binding = "PAYMENTS_WORKER"' wrangler.toml
          grep -Fq 'crons = ["*/5 * * * *"]' wrangler.toml
          node --check src/shop-movements.js
          if ls test/*.test.mjs >/dev/null 2>&1; then node --test test/*.test.mjs; fi

      - name: Rotate HIMAI-to-Telegram service secret
        shell: bash
        run: |
          set -euo pipefail
          service_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$service_secret"
          printf 'HIMAI_TELEGRAM_ROUTER_SECRET=%s\n' "$service_secret" >> "$GITHUB_ENV"
          router_secret_log="$RUNNER_TEMP/telegram-worker-himai-secret-version.log"
          printf '%s' "$service_secret" | npx --yes wrangler@4 versions secret put AUTH_SERVICE_HIMAI_TO_TELEGRAM \
            --config ../telegram-worker/wrangler.toml \
            --tag "router-himai-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}" \
            --message "Rotate AUTH_SERVICE_HIMAI_TO_TELEGRAM from ${GITHUB_SHA}" \
            2>&1 | tee "$router_secret_log"
          router_version_id="$(sed -n -e 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' -e 's/.*Created version[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$router_secret_log" | tail -n 1)"
          if [ -z "$router_version_id" ]; then
            echo "Unable to resolve telegram-worker secret version id for AUTH_SERVICE_HIMAI_TO_TELEGRAM" >&2
            cat "$router_secret_log" >&2
            exit 1
          fi
          npx --yes wrangler@4 versions deploy "${router_version_id}@100%" -y --config ../telegram-worker/wrangler.toml
          printf 'AUTH_SERVICE_HIMAI_TO_TELEGRAM=%s\n' "$service_secret" > "$RUNNER_TEMP/himai-chat-worker-router.env"
          chmod 600 "$RUNNER_TEMP/himai-chat-worker-router.env"

      - name: Validate version upload
        run: npx --yes wrangler@4 versions upload --dry-run --keep-vars

      - name: Upload himai-chat-worker version
        id: upload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tag="gha-${GITHUB_SHA:0:12}"
          npx --yes wrangler@4 versions upload \
            --keep-vars \
            --secrets-file "$RUNNER_TEMP/himai-chat-worker-router.env" \
            --tag "$tag" \
            --message "GitHub Actions ${GITHUB_SHA}" \
            2>&1 | tee "$RUNNER_TEMP/himai-chat-worker-upload.log"

      - name: Apply MMD Shop stock coordinator migration
        id: migration_deploy
        if: steps.upload.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq 'code:[[:space:]]*10211|\[code:[[:space:]]*10211\]|pending Durable Object migration|Durable Object migrations must be applied with' "$RUNNER_TEMP/himai-chat-worker-upload.log"; then
            echo "Version upload failed for a reason other than Cloudflare Durable Object migration code 10211." >&2
            cat "$RUNNER_TEMP/himai-chat-worker-upload.log" >&2
            exit 1
          fi
          migration_config=".wrangler-migration-no-routes.toml"
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("wrangler.toml","utf8").split(/\r?\n/);
          const output = [];
          let skippingRoute = false;
          for (const line of input) {
            if (/^\s*\[\[routes\]\]\s*$/.test(line)) { skippingRoute = true; continue; }
            if (skippingRoute && /^\s*\[/.test(line)) skippingRoute = false;
            if (!skippingRoute) output.push(line);
          }
          fs.writeFileSync(".wrangler-migration-no-routes.toml", output.join("\n")+"\n");
          NODE
          trap 'rm -f "$migration_config"' EXIT
          npx --yes wrangler@4 deploy --keep-vars --secrets-file "$RUNNER_TEMP/himai-chat-worker-router.env" --config "$migration_config" 2>&1 | tee "$RUNNER_TEMP/himai-chat-worker-migration.log"
          echo "HIMAI_CHAT_WORKER_VERSION_ID=direct-deploy-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Resolve uploaded version ID
        id: resolve_version
        if: steps.upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/himai-chat-worker-upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Unable to resolve himai-chat-worker version id" >&2
            cat "$RUNNER_TEMP/himai-chat-worker-upload.log" >&2
            exit 1
          fi
          echo "HIMAI_CHAT_WORKER_VERSION_ID=$version_id" >> "$GITHUB_ENV"

      - name: Deploy uploaded himai-chat-worker version
        id: deploy
        if: steps.resolve_version.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy "${HIMAI_CHAT_WORKER_VERSION_ID}@100%" -y

      - name: Validate MMD Shop scheduled trigger
        id: cron_trigger
        if: steps.deploy.outcome == 'success' || steps.migration_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'crons = ["*/5 * * * *"]' wrangler.toml
          if [ "${{ steps.migration_deploy.outcome }}" = "success" ]; then
            echo "Scheduled trigger was applied by the direct wrangler deploy used for the Durable Object migration."
          else
            echo "Scheduled trigger is already provisioned at */5; validating canonical config without re-submitting route triggers."
          fi

      - name: Sync Himai and MMD Shop routes
        id: route_sync
        if: steps.cron_trigger.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = String(process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").trim();
          const zoneId = String(process.env.CLOUDFLARE_ZONE_ID || "").trim();
          const worker = String(process.env.WORKER_NAME || "").trim();
          if (!token || !zoneId || !worker) throw new Error("Cloudflare route credentials are not configured");

          const desired = [
            "mmdbkk.com/shop/api/*",
            "www.mmdbkk.com/shop/api/*",
            "mmdbkk.com/mmd-shop/api/*",
            "www.mmdbkk.com/mmd-shop/api/*",
            "mmdbkk.com/mmd-shop/order*",
            "www.mmdbkk.com/mmd-shop/order*",
            "mmdbkk.com/mmd-shop/product/*",
            "www.mmdbkk.com/mmd-shop/product/*",
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function cf(path, options = {}) {
            let lastError;
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              try {
                const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
                  ...options,
                  headers: {
                    Authorization: `Bearer ${token}`,
                    "Content-Type": "application/json",
                    ...(options.headers || {}),
                  },
                });
                const raw = await response.text();
                let body = null;
                try { body = JSON.parse(raw); } catch {}
                if (response.ok && body?.success === true) return body.result;
                const retryable = response.status === 429 || response.status >= 500 || !body;
                lastError = new Error(body ? JSON.stringify(body.errors || body) : `cloudflare_non_json_${response.status}:${raw.slice(0,160)}`);
                if (!retryable) throw lastError;
              } catch (error) {
                lastError = error;
              }
              if (attempt < 5) await sleep(attempt * 1000);
            }
            throw lastError || new Error("cloudflare_route_api_failed");
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          for (const pattern of desired) {
            const conflict = existing.find((route) => route.pattern === pattern && route.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || "none"}`);
          }
          for (const pattern of desired) {
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) continue;
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
          }
          const verified = await cf(routePath);
          const missing = desired.filter((pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`missing routes: ${missing.join(", ")}`);
          console.log(`verified ${desired.length}/${desired.length} Himai and MMD Shop routes`);
          NODE

      - name: Verify production MMD Shop catalog and product routes
        if: steps.route_sync.outcome == 'success'
        run: |
          set -euo pipefail
          catalog="$(curl --retry 6 --retry-delay 2 --retry-all-errors -fsS https://www.mmdbkk.com/mmd-shop/api/products)"
          echo "$catalog"
          node -e 'const b=JSON.parse(process.argv[1]); if (b.ok !== true || !Array.isArray(b.products)) process.exit(1); const active=b.products.filter(p=>String(p.status||"").toLowerCase()==="active"); const sku=active.map(p=>String(p.sku||"")); const families={wgg:sku.some(s=>/^WGG-/.test(s)),glen:sku.some(s=>/^GLEN-POP/.test(s)),pod:sku.some(s=>/^PPP25-/.test(s))}; if (!families.wgg || !families.glen || !families.pod) throw new Error("mmd_shop_three_family_catalog_missing");' "$catalog"

          product="$(curl --retry 6 --retry-delay 2 --retry-all-errors -fsS https://www.mmdbkk.com/mmd-shop/api/product/wgg-10)"
          echo "$product"
          node -e 'const b=JSON.parse(process.argv[1]); const p=b.product||{}; if (b.ok !== true || b.schema !== "mmd_shop_product_v1" || p.sku !== "WGG-10") process.exit(1); if (p.checkout_eligible === true && p.stock_status !== "tracked") throw new Error("untracked_product_must_not_be_checkout_eligible"); if (p.stock_status === "untracked" && p.online_checkout_status !== "stock_untracked") throw new Error("untracked_catalog_status_mismatch");' "$product"

          on_demand="$(curl --retry 6 --retry-delay 2 --retry-all-errors -fsS https://www.mmdbkk.com/mmd-shop/api/product/glen-pop15-blk)"
          echo "$on_demand"
          node -e 'const b=JSON.parse(process.argv[1]); const p=b.product||{}; if (b.ok !== true || p.sku !== "GLEN-POP15-BLK") process.exit(1); if (p.stock_status !== "on_demand" || p.online_checkout_status !== "on_demand" || p.checkout_eligible !== true) throw new Error("glenburgies_on_demand_contract_failed"); if (p.variant_group !== "GLEN" || p.variant_type !== "bottle" || !Array.isArray(b.variants) || b.variants.length < 2) throw new Error("glenburgies_variant_family_contract_failed");' "$on_demand"

      - name: Verify production Himai storefront and API routes
        if: steps.route_sync.outcome == 'success'
        run: node scripts/verify-himai-shop-routes.mjs
