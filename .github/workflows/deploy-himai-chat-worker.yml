name: Deploy himai-chat-worker

# Branch-only, code-only release for the approved GG Water coupon change.
on:
  workflow_dispatch:

concurrency:
  group: telegram-router-secret-rotation-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      WORKER_NAME: "himai-chat-worker"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate coupon and checkout regression cases
        run: |
          set -euo pipefail
          node --check himai-chat-worker/src/mmd-shop-coupons.js
          node --check himai-chat-worker/src/shop-coupon-routes.js
          node --test himai-chat-worker/test/mmd-shop-coupons.test.mjs himai-chat-worker/test/shop-phase1-integration.test.mjs himai-chat-worker/test/mmd-shop-payment-binding.test.mjs himai-chat-worker/test/mmd-shop-webflow-checkout-gate.test.mjs shared/shop-phase1-safety.test.mjs himai-chat-worker/test/mmd-shop-reservation.test.mjs
      - name: Read serving configuration and preserve existing bindings
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}`;
          const response = await fetch(root + '/settings', { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
          const data = await response.json();
          if (!response.ok || data.success !== true) throw new Error('Cannot read serving Worker configuration; deployment refused');
          const settings = data.result;
          const declared = [
            ['MEMBER_PAGES_WORKER', 'service', 'member-pages-worker'],
            ['PAYMENTS_WORKER', 'service', 'payments-worker'],
            ['TELEGRAM_WORKER', 'service', 'telegram-worker'],
            ['MMD_SHOP_STOCK_COORDINATOR', 'durable_object_namespace', 'MmdShopStockCoordinator'],
          ];
          const actual = (settings.bindings || []).filter(b => !['plain_text', 'json', 'secret_text'].includes(b.type));
          if (actual.length !== declared.length) throw new Error('Serving resource bindings differ from the reviewed source; deployment refused');
          for (const [name, type, target] of declared) {
            const b = actual.find(b => b.name === name && b.type === type);
            if (!b || (type === 'service' ? b.service !== target : b.class_name !== target)) throw new Error('Serving resource binding does not match the reviewed source');
            if (type === 'service' && b.environment && b.environment !== 'production') throw new Error('Serving service environment mismatch');
            if (type === 'durable_object_namespace' && b.script_name && b.script_name !== process.env.WORKER_NAME) throw new Error('Durable Object owner mismatch');
          }
          if (!(settings.bindings || []).some(b => b.name === 'INTERNAL_TOKEN' && b.type === 'secret_text')) throw new Error('Existing internal issuance auth is unavailable');
          const source = fs.readFileSync('himai-chat-worker/wrangler.toml', 'utf8');
          const compatibility = source.match(/^compatibility_date\s*=\s*"([^"]+)"/m)?.[1];
          if (settings.compatibility_date !== compatibility || (settings.compatibility_flags || []).length) throw new Error('Serving compatibility settings differ; deployment refused');
          const before = { settings };
          const deployments = await fetch(root + '/deployments', { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } }).then(r => r.json());
          if (deployments.success !== true || !deployments.result?.deployments?.length) throw new Error('Serving deployment provenance is unavailable');
          before.deployment = deployments.result.deployments[0];
          const record = process.env.RUNNER_TEMP + '/gg-coupon-serving-before.json';
          fs.writeFileSync(record, JSON.stringify(before), { mode: 0o600 });
          // No route, secret, migration, variable, or scheduled-trigger writes in this workflow.
          let skip = false;
          const lines = source.split(/\r?\n/).filter(line => {
            if (/^\s*\[/.test(line)) skip = /^\s*(?:\[\[routes\]\]|\[vars\]|\[triggers\]|\[\[migrations\]\])\s*$/.test(line);
            return !skip;
          });
          fs.writeFileSync('himai-chat-worker/.wrangler-coupon-code-only.toml', lines.join('\n') + '\n');
          console.log('Verified existing resources and auth; source SHA:', process.env.GITHUB_SHA);
          console.log('Previous deployment:', before.deployment.id);
          NODE
      - name: Package reviewed Worker source
        working-directory: himai-chat-worker
        run: npx --yes wrangler@4.138.0 versions upload --dry-run --keep-vars --config .wrangler-coupon-code-only.toml
      - name: Upload code version preserving secrets and variables
        working-directory: himai-chat-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.138.0 versions upload --keep-vars --config .wrangler-coupon-code-only.toml --tag "gg-coupon-${GITHUB_SHA:0:12}" --message "GG Water coupon code release ${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/gg-coupon-upload.log"
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/gg-coupon-upload.log" | tail -n 1)"
          test -n "$version_id"
          echo "COUPON_VERSION_ID=$version_id" >> "$GITHUB_ENV"
      - name: Verify uploaded resources and prevent deployment races
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/gg-coupon-serving-before.json', 'utf8'));
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}`;
          const read = async path => {
            const r = await fetch(root + path, { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
            const d = await r.json(); if (!r.ok || d.success !== true) throw new Error('Cloudflare verification failed'); return d.result;
          };
          const canonical = v => Array.isArray(v) ? v.map(canonical) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canonical(v[k])])) : v;
          const bindings = rows => JSON.stringify(canonical(rows.slice().sort((a, b) => a.name.localeCompare(b.name))));
          const version = await read('/versions/' + process.env.COUPON_VERSION_ID);
          if (bindings(version.resources.bindings) !== bindings(before.settings.bindings)) throw new Error('Uploaded binding or variable drift; version will not be deployed');
          const current = await read('/deployments');
          if (current.deployments[0].id !== before.deployment.id) throw new Error('Another deployment occurred after preflight; refusing to replace it');
          NODE
      - name: Activate approved himai-chat-worker code version
        working-directory: himai-chat-worker
        run: npx --yes wrangler@4.138.0 versions deploy "${COUPON_VERSION_ID}@100%" -y --config .wrangler-coupon-code-only.toml
      - name: Verify active version and read-only production coupon routes
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}`;
          const response = await fetch(root + '/deployments', { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
          const data = await response.json();
          const active = data.result?.deployments?.[0];
          if (!response.ok || data.success !== true || active?.versions?.length !== 1 || active.versions[0].version_id !== process.env.COUPON_VERSION_ID || active.versions[0].percentage !== 100) throw new Error('Exact coupon version is not serving 100%');
          const checks = [];
          for (const host of ['www.mmdbkk.com', 'mmdbkk.com']) {
            for (const [path, options, status, error] of [
              ['/mmd-shop/api/coupons/quote', {}, 405, 'method_not_allowed'],
              ['/mmd-shop/api/coupons/issue', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }, 401, 'internal_auth_required'],
              ['/mmd-shop/api/coupons/quote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ coupon_code: 'INVALID', items: [] }) }, 400, 'coupon_invalid'],
            ]) {
              const r = await fetch('https://' + host + path, { ...options, signal: AbortSignal.timeout(20000) });
              const body = await r.json();
              if (r.status !== status || body.error !== error) throw new Error('Coupon production route did not return the expected guard');
              checks.push({ host, path, status, error });
            }
          }
          const catalog = await fetch('https://www.mmdbkk.com/mmd-shop/api/products', { signal: AbortSignal.timeout(20000) }).then(r => r.json());
          const product = catalog.products?.find(p => p.id === 'recSod352ioZ17aMr' && p.sku === 'WGG-50');
          if (catalog.ok !== true || !product) throw new Error('Canonical GG Water 50 ml product unavailable');
          const receipt = { worker: process.env.WORKER_NAME, source_sha: process.env.GITHUB_SHA, version_id: process.env.COUPON_VERSION_ID, deployment_id: active.id, percentage: 100, coupon_route_checks: checks, gg50_price_thb: product.selling_price_thb, authenticated_redemption: 'not_run', real_coupon_issued: false, webflow_published: false };
          fs.writeFileSync('gg-coupon-deploy-receipt.json', JSON.stringify(receipt, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'GG Water coupon backend deployed.\n\n```json\n' + JSON.stringify(receipt, null, 2) + '\n```\n');
          console.log(JSON.stringify(receipt));
          NODE
      - name: Save deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: gg-coupon-deploy-receipt
          path: gg-coupon-deploy-receipt.json
          if-no-files-found: error
