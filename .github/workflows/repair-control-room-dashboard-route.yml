name: Repair Control Room dashboard route

on:
  pull_request:
    paths:
      - ".github/workflows/repair-control-room-dashboard-route.yml"
      - "immigrate-worker/src/control-room-owner-ui-legacy.ts"
      - "admin-worker/src/dashboard-worker.js"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-control-room-dashboard-route.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy admin-worker
    types:
      - completed

concurrency:
  group: repair-control-room-dashboard-route-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate Control Room dashboard dependency
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/dashboard-worker.js
          grep -Fq "fetch('/v1/admin/dashboard'" immigrate-worker/src/control-room-owner-ui-legacy.ts
          grep -Fq 'BACKEND WAITING' immigrate-worker/src/control-room-owner-ui-legacy.ts

  repair-and-smoke:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: validate-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize and verify Cloudflare routes token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          if (!token) throw new Error("Cloudflare routes API token is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${token}\n`);
          NODE

          response_file="$(mktemp)"
          http_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -o "$response_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$http_code" = "200"
          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.success !== true || payload.result?.status !== "active") {
            throw new Error("Cloudflare routes token is not active");
          }
          NODE

      - name: Repair exact Control Room dashboard routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "admin-worker";
          const desired = [
            "mmdbkk.com/v1/admin/dashboard",
            "www.mmdbkk.com/v1/admin/dashboard",
          ];

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(
              `Refusing to replace conflicting Control Room dashboard routes: ${conflicts
                .map((route) => `${route.pattern} -> ${route.script || "no script"}`)
                .join(", ")}`
            );
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) {
            throw new Error(`Control Room dashboard route verification failed: ${unresolved.join(", ")}`);
          }
          console.log(`Verified ${desired.length}/${desired.length} exact Control Room dashboard routes; created ${missing.length}`);
          NODE

      - name: Smoke dashboard ingress on apex and www
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            passed=0
            for attempt in $(seq 1 12); do
              headers_file="$(mktemp)"
              body_file="$(mktemp)"
              http_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
                -D "$headers_file" \
                -o "$body_file" \
                -w "%{http_code}" \
                "$origin/v1/admin/dashboard")"
              if [ "$http_code" = "401" ] \
                && grep -Eiq '^content-type:[[:space:]]*application/json' "$headers_file" \
                && grep -q '"error":"unauthorized"' "$body_file"; then
                passed=1
                echo "Control Room dashboard ingress smoke passed: origin=$origin attempt=$attempt"
                break
              fi
              echo "Dashboard ingress not converged yet: origin=$origin attempt=$attempt status=$http_code"
              sleep 5
            done
            if [ "$passed" != "1" ]; then
              echo "::error title=Control Room dashboard ingress smoke failed::origin=$origin status=$http_code after=12-attempts"
              cat "$body_file" || true
              exit 1
            fi
          done
