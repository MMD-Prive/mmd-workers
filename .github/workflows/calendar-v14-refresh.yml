name: Calendar v1.4 Refresh
on:
  push:
    branches: [fix/calendar-cal-fetch-typeerror-20260914]
    paths: ['.github/workflows/calendar-v14-refresh.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-cal-fetch-typeerror-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align v1.4 surface checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['admin-worker/src/admin-calendar-visibility.test.mjs','tools/calendar-production-connection.mjs']:
            p=Path(name)
            s=p.read_text().replace('admin-worker-v1.3','admin-worker-v1.4')
            p.write_text(s)
          PY
          node --check admin-worker/src/admin-calendar-visibility.js
          node --check tools/calendar-production-connection.mjs
          node --test admin-worker/src/admin-calendar-service-binding.test.mjs admin-worker/src/admin-calendar-visibility.test.mjs admin-worker/src/admin-calendar-runtime.test.mjs
          grep -Fq 'admin-worker-v1.4' tools/calendar-production-connection.mjs
      - name: Commit v1.4 checks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-worker/src/admin-calendar-visibility.test.mjs tools/calendar-production-connection.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(calendar): align v1.4 production checks'
          git push origin HEAD:fix/calendar-cal-fetch-typeerror-20260914
