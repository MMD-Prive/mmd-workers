name: HYPE Shop production smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/src/hype-shop-orders.js"
      - "admin-worker/src/admin-login-hero-worker-core.js"
      - "admin-worker/wrangler.toml"
      - "member-pages-worker/src/hype-shop-orders-projection.js"
      - "member-pages-worker/src/runtime-index.js"
      - "telegram-worker/src/index.js"
      - "ops/hype-shop-production-smoke/**"
      - ".github/workflows/hype-shop-production-smoke.yml"

concurrency:
  group: hype-shop-production-smoke
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      SMOKE_WORKER_NAME: hype-shop-production-smoke
      WORKERS_DEV_SUBDOMAIN: malemodel-bkk

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Wait for production deploys from this push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          printf '%s\n' "$changed"

          expected=()
          if printf '%s\n' "$changed" | grep -Eq '^admin-worker/'; then expected+=("Deploy admin-worker"); fi
          if printf '%s\n' "$changed" | grep -Eq '^member-pages-worker/'; then expected+=("Deploy member-pages-worker"); fi
          if printf '%s\n' "$changed" | grep -Eq '^telegram-worker/'; then expected+=("Deploy telegram-worker"); fi

          if [ "${#expected[@]}" -eq 0 ]; then
            echo "No production Worker path changed in this push; validating current deployed chain."
            exit 0
          fi

          for workflow_name in "${expected[@]}"; do
            completed=0
            for attempt in $(seq 1 120); do
              rows="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --limit 100 --json name,status,conclusion,databaseId)"
              found="$(node -e 'const n=process.argv[1]; const r=JSON.parse(process.argv[2]||"[]"); const m=r.find((x)=>x.name===n); if(m) process.stdout.write(JSON.stringify(m));' "$workflow_name" "$rows")"
              if [ -z "$found" ]; then sleep 3; continue; fi

              status="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.status||""))' "$found")"
              conclusion="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.conclusion||""))' "$found")"
              run_id="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.databaseId||""))' "$found")"
              echo "$workflow_name run=$run_id status=$status conclusion=$conclusion"

              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                completed=1
                break
              fi
              sleep 3
            done

            if [ "$completed" -ne 1 ]; then
              echo "Production deploy did not complete successfully for $workflow_name on $GITHUB_SHA" >&2
              exit 1
            fi
          done

      - name: Generate isolated synthetic identities
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const c=require("node:crypto"),fs=require("node:fs"); const token=c.randomBytes(32).toString("hex"); const line="U"+c.randomBytes(16).toString("hex"); const digits=Array.from(c.randomBytes(18),(v)=>String(v%10)).join(""); const tg="9"+digits.slice(0,17); const exp=Date.now()+20*60*1000; process.stdout.write("::add-mask::"+token+"\n"); fs.appendFileSync(process.env.GITHUB_ENV,["SMOKE_TOKEN="+token,"SMOKE_LINE_ID="+line,"SMOKE_TELEGRAM_ID="+tg,"SMOKE_EXPIRES_AT="+exp,""].join("\n"));'

      - name: Validate smoke worker source
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/hype-shop-production-smoke/src/index.js
          npx --yes wrangler@4 deploy --dry-run --config ops/hype-shop-production-smoke/wrangler.toml --var "SMOKE_TOKEN:${SMOKE_TOKEN}" --var "SMOKE_LINE_ID:${SMOKE_LINE_ID}" --var "SMOKE_TELEGRAM_ID:${SMOKE_TELEGRAM_ID}" --var "SMOKE_EXPIRES_AT:${SMOKE_EXPIRES_AT}"

      - name: Deploy temporary smoke worker
        id: deploy_smoke
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config ops/hype-shop-production-smoke/wrangler.toml --var "SMOKE_TOKEN:${SMOKE_TOKEN}" --var "SMOKE_LINE_ID:${SMOKE_LINE_ID}" --var "SMOKE_TELEGRAM_ID:${SMOKE_TELEGRAM_ID}" --var "SMOKE_EXPIRES_AT:${SMOKE_EXPIRES_AT}"
          echo "SMOKE_DEPLOYED=true" >> "$GITHUB_ENV"

      - name: Run production service-binding smoke
        shell: bash
        run: |
          set -euo pipefail
          url="https://${SMOKE_WORKER_NAME}.${WORKERS_DEV_SUBDOMAIN}.workers.dev/smoke"
          passed=0
          final_body="$(mktemp)"

          for attempt in $(seq 1 40); do
            body="$(mktemp)"
            code="$(curl --retry 2 --retry-delay 1 --retry-all-errors -sS -o "$body" -w "%{http_code}" -X POST -H "Authorization: Bearer ${SMOKE_TOKEN}" "$url" || true)"
            if [ "$code" = "200" ]; then
              cp "$body" "$final_body"
              if node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const c=p?.checks||{}; const req=["admin_to_member_pages_binding","synthetic_line_has_no_owned_orders","projection_is_read_only","ownership_filter_active","private_contact_fields_blocked","unresolved_telegram_fails_closed"]; if(p?.ok!==true||p?.state!=="pass"||!req.every((k)=>c[k]===true)||p?.guardrails?.customer_data_returned!==false||p?.guardrails?.business_truth_mutated!==false) process.exit(1);' "$final_body"; then
                passed=1
                break
              fi
            fi
            sleep 3
          done

          if [ "$passed" -ne 1 ]; then
            echo "HYPE Shop production service-binding smoke did not reach PASS." >&2
            if [ -s "$final_body" ]; then cat "$final_body"; fi
            exit 1
          fi

          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify({ok:p.ok,state:p.state,checks:p.checks,observations:p.observations,guardrails:p.guardrails},null,2));' "$final_body"

      - name: Verify public fail-closed boundaries and Telegram health
        shell: bash
        run: |
          set -euo pipefail

          admin_payload="$(printf '{"line_user_id":"%s"}' "$SMOKE_LINE_ID")"
          admin_body="$(mktemp)"
          admin_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$admin_body" -w "%{http_code}" -X POST -H "content-type: application/json" --data "$admin_payload" "https://admin-worker.${WORKERS_DEV_SUBDOMAIN}.workers.dev/__internal/hype/shop-orders/smoke")"
          cat "$admin_body"
          test "$admin_code" = "403"
          grep -q '"error":"internal_only"' "$admin_body"

          member_payload="$(printf '{"line_user_id":"%s"}' "$SMOKE_LINE_ID")"
          member_body="$(mktemp)"
          member_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$member_body" -w "%{http_code}" -X POST -H "content-type: application/json" -H "x-mmd-internal-call: true" -H "x-mmd-service-binding: admin-worker" --data "$member_payload" "https://member-pages-worker.${WORKERS_DEV_SUBDOMAIN}.workers.dev/__internal/hype/shop-orders")"
          cat "$member_body"
          test "$member_code" = "404"
          grep -q '"error":"not_found"' "$member_body"

          telegram_body="$(mktemp)"
          telegram_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$telegram_body" -w "%{http_code}" "https://telegram-worker.${WORKERS_DEV_SUBDOMAIN}.workers.dev/health")"
          cat "$telegram_body"
          test "$telegram_code" = "200"
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(p?.ok!==true) throw new Error("telegram health is not ok"); if(p?.capability_pack!=="mmd-concierge-capability-pack-v1-20260919") throw new Error("unexpected HYPE capability pack"); if(p?.recovery_outcome_taxonomy!=="mmd-recovery-outcome-taxonomy-v1-20260919") throw new Error("unexpected Recovery outcome taxonomy");' "$telegram_body"

          mms_body="$(mktemp)"
          mms_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$mms_body" -w "%{http_code}" "https://mms-worker.${WORKERS_DEV_SUBDOMAIN}.workers.dev/health")"
          cat "$mms_body"
          test "$mms_code" = "200"
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const line=p?.bindings?.line||{}; if(p?.ok!==true) throw new Error("mms health is not ok"); if(line?.persona!=="HENNA") throw new Error("unexpected MMS LINE persona"); if(line?.capability_pack!=="mmd-concierge-capability-pack-v1-20260919") throw new Error("unexpected HENNA capability pack"); if(line?.recovery_outcome_taxonomy!=="mmd-recovery-outcome-taxonomy-v1-20260919") throw new Error("unexpected HENNA recovery taxonomy"); if(line?.auto_reply_enabled!==false) throw new Error("HENNA auto reply must remain disabled");' "$mms_body"

      - name: Record acceptance summary
        if: success()
        shell: bash
        run: |
          {
            echo "### HYPE Shop production smoke"
            echo ""
            echo "- source_sha: \`${GITHUB_SHA}\`"
            echo "- admin -> member-pages Shop binding: PASS"
            echo "- synthetic ownership empty: PASS"
            echo "- read-only/payment/fulfillment/refund guardrails: PASS"
            echo "- unresolved Telegram fail-closed: PASS"
            echo "- public internal endpoints blocked: PASS"
            echo "- telegram HYPE capability pack health: PASS"
            echo "- recovery outcome taxonomy health: PASS"
            echo "- HENNA MMS LINE taxonomy health: PASS"
            echo "- HENNA auto reply remains disabled: PASS"
            echo "- customer data used: NONE"
            echo "- business truth mutation: NONE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary smoke worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --silent --show-error -o "$body" -w "%{http_code}" -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SMOKE_WORKER_NAME}" || true)"
          cat "$body"

          if [ "${SMOKE_DEPLOYED:-false}" = "true" ]; then
            test "$code" = "200"
            node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(p?.success!==true) throw new Error("temporary smoke worker deletion failed");' "$body"
          elif [ "$code" != "200" ] && [ "$code" != "404" ]; then
            echo "Unexpected cleanup HTTP $code" >&2
            exit 1
          fi
