name: Diagnose Control Room route

on:
  push:
    branches:
      - diag/control-room-route-owner
    paths:
      - ".github/workflows/diag-control-room-route.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
    steps:
      - name: Inspect active Cloudflare route ownership
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=(process.env.CLOUDFLARE_ROUTES_API_TOKEN||'').replace(/[\u2028\u2029\r\n]/g,'').trim();
          if(!token) throw new Error('missing routes token');
          const zone=process.env.CLOUDFLARE_ZONE_ID;
          const response=await fetch(`https://api.cloudflare.com/client/v4/zones/${zone}/workers/routes`,{headers:{Authorization:`Bearer ${token}`}});
          const payload=await response.json();
          if(!response.ok||payload.success!==true) throw new Error(`route read failed ${response.status}`);
          const routes=(payload.result||[]).filter((route)=>String(route.pattern||'').includes('/internal/admin/control-room'));
          console.log('CONTROL_ROOM_ROUTES='+JSON.stringify(routes.map(({id,pattern,script})=>({id,pattern,script}))));
          NODE

      - name: Inspect production response markers
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -D "$headers" -o "$body" -w '%{http_code}' "$origin/internal/admin/control-room?mock=1&diag=${GITHUB_SHA}")"
            echo "ORIGIN=$origin HTTP=$code"
            grep -Ei '^(location|x-mmd-control-room-ui|x-mmd-route-owner|x-mmd-page|server|cf-ray):' "$headers" || true
            node - "$body" <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          console.log('BODY_MARKERS='+JSON.stringify({
            owner:html.includes('data-control-room'),
            operator:html.includes('MMD PRIVÉ · OPERATOR HOME'),
            stripped:html.includes('WORKER-RENDERED INTERNAL PAGES')||html.includes('Worker-rendered Internal Pages'),
            login:html.includes('Enter the')&&html.includes('control room')
          }));
          NODE
            rm -f "$headers" "$body"
          done

      - name: Inspect deployed version preview markers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -D "$headers" -o "$body" -w '%{http_code}' 'https://13d103e1-immigrate-worker.malemodel-bkk.workers.dev/internal/admin/control-room?mock=1')"
          echo "PREVIEW_HTTP=$code"
          grep -Ei '^(location|x-mmd-control-room-ui|x-mmd-route-owner|x-mmd-page|server|cf-ray):' "$headers" || true
          node - "$body" <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          console.log('PREVIEW_MARKERS='+JSON.stringify({owner:html.includes('data-control-room'),operator:html.includes('MMD PRIVÉ · OPERATOR HOME'),stripped:html.includes('Worker-rendered Internal Pages')}));
          NODE
          rm -f "$headers" "$body"
