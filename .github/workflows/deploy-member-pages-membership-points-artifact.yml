name: Release member-pages membership and Points artifact delta

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner authorization for this exact artifact release'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this exact release'
        type: string
        required: true
      approved_sha:
        description: 'Must equal the current main SHA containing this guarded workflow'
        type: string
        required: true
      approved_source_sha:
        description: 'Exact merged membership and Points source SHA'
        type: string
        required: true
      expected_version:
        description: 'Fresh active member-pages-worker version UUID'
        type: string
        required: true
      expected_deployment:
        description: 'Fresh active deployment UUID'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-member-pages-membership-points-artifact
  cancel-in-progress: false

jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && inputs.approved_source_sha == 'd3ad42ec9d66639a3dc215045e5a4d5e9a040c86'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact approved source scope
        run: node --test scripts/member-pages-membership-points-release.test.mjs

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && inputs.approved_source_sha == 'd3ad42ec9d66639a3dc215045e5a4d5e9a040c86'
    needs: [production-approval]
    environment: member-pages-code-only-owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_APPROVED: ${{ inputs.production_approved }}
      APPROVAL_REF: ${{ inputs.approval_ref }}
      APPROVED_SHA: ${{ inputs.approved_sha }}
      APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
      SOURCE_DIRECTORY: ${{ github.workspace }}/release-source
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d3ad42ec9d66639a3dc215045e5a4d5e9a040c86
          fetch-depth: 0
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scoped source and artifact preservation contract
        working-directory: release-tools
        run: node --test scripts/member-pages-membership-points-release.test.mjs
      - name: Install pinned Wrangler bundler
        working-directory: release-tools
        run: npm install --global wrangler@4.151.1 --no-audit --no-fund
      - name: Upload and promote exact membership/Points artifact delta
        working-directory: release-tools
        run: node scripts/member-pages-membership-points-release.mjs --execute-approved
