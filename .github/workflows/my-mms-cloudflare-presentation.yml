name: MY MMS Cloudflare presentation
on:
  pull_request:
    paths:
      - 'workers/my-mms-customer-ui/**'
      - '.github/workflows/my-mms-cloudflare-presentation.yml'
      - 'scripts/my-mms-customer-release*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: my-mms-customer-ui-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/my-mms-cloudflare-gateway-candidate.test.mjs scripts/my-mms-customer-release.test.mjs
      - uses: oven-sh/setup-bun@v2
      - name: Verify and extract pinned private customer release package
        run: node scripts/my-mms-customer-release.mjs
      - name: Install pinned frontend dependencies
        working-directory: .release/my-mms-customer
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate and build pinned approved customer source
        working-directory: .release/my-mms-customer
        env:
          VITE_MMS_LIVE: 'true'
        run: |
          npx tsc --noEmit
          npm test
          npm run build
      - name: Validate private Worker package without deploying
        run: npx --yes wrangler@4.151.3 deploy --config workers/my-mms-customer-ui/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/mms-dry-run"
      - uses: actions/upload-artifact@v4
        with:
          name: my-mms-customer-ui-${{ github.sha }}
          path: .release/my-mms-customer/.output/
          include-hidden-files: true
          retention-days: 14
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: my-mms-customer-ui-${{ github.sha }}
          path: .release/my-mms-customer/.output/
      - name: Deploy presentation only; no routes, sessions or backend bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { readMyMmsRelease } from './scripts/my-mms-customer-release.mjs';
          const { manifest } = readMyMmsRelease();
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').replace(/[\u2028\u2029\r\n]/g, '').trim();
          if (!token) throw Error('Cloudflare deploy credential unavailable');
          const result = spawnSync('npx', ['--yes', 'wrangler@4.151.3', 'deploy', '--config', 'workers/my-mms-customer-ui/wrangler.jsonc', '--strict', '--tag', manifest.tag, '--message', `MY MMS approved customer source ${manifest.sourceCommit}`], { stdio: 'inherit', env: { ...process.env, CLOUDFLARE_API_TOKEN: token } });
          process.exit(result.status ?? 1);
          NODE
