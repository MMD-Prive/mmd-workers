name: Cleanup temporary Batch 01 verification artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-model-batch01-r2.yml"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: "9922086447"
    steps:
      - name: Delete temporary private media artifact
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/delete-body -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          echo "artifact cleanup http=$code"
          test "$code" = "204" || test "$code" = "404"
