name: Repair SIGIL Jobs Client Lookup Routes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/repair-sigil-jobs-client-lookup-routes.yml"
      - "admin-worker/wrangler.toml"
      - "immigrate-worker/wrangler.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-sigil-jobs-client-lookup-routes.yml"
      - "admin-worker/wrangler.toml"
      - "immigrate-worker/wrangler.toml"

permissions:
  contents: read

jobs:
  route-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify SIGIL Jobs route declarations
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'pattern = "mmdbkk.com/v1/admin/clients/lineage-lookup"' admin-worker/wrangler.toml
          grep -Fq 'pattern = "www.mmdbkk.com/v1/admin/clients/lineage-lookup"' admin-worker/wrangler.toml
          grep -Fq 'pattern = "mmdbkk.com/v1/admin/clients/recent"' admin-worker/wrangler.toml
          grep -Fq 'pattern = "www.mmdbkk.com/v1/admin/clients/recent"' admin-worker/wrangler.toml
          grep -Fq 'pattern = "mmdbkk.com/v1/admin/job/create"' admin-worker/wrangler.toml
          grep -Fq 'pattern = "www.mmdbkk.com/v1/admin/job/create"' admin-worker/wrangler.toml
          grep -Fq 'pattern = "mmdbkk.com/v1/admin/models/search*"' immigrate-worker/wrangler.toml
          grep -Fq 'pattern = "www.mmdbkk.com/v1/admin/models/search*"' immigrate-worker/wrangler.toml

  repair-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: route-contract
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
    steps:
      - name: Normalize Cloudflare routes token
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const token = (process.env.CLOUDFLARE_ROUTES_API_TOKEN || '').replace(/[\u2028\u2029\r\n]/g, '').trim();
          if (!token) throw new Error('Cloudflare routes API token is missing');
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${token}\n`);
          NODE

      - name: Repair exact SIGIL Jobs ingress routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const desired = [
            ['mmdbkk.com/v1/admin/clients/lineage-lookup', 'admin-worker'],
            ['www.mmdbkk.com/v1/admin/clients/lineage-lookup', 'admin-worker'],
            ['mmdbkk.com/v1/admin/clients/recent', 'admin-worker'],
            ['www.mmdbkk.com/v1/admin/clients/recent', 'admin-worker'],
            ['mmdbkk.com/v1/admin/job/create', 'admin-worker'],
            ['www.mmdbkk.com/v1/admin/job/create', 'admin-worker'],
            ['mmdbkk.com/v1/admin/models/search*', 'immigrate-worker'],
            ['www.mmdbkk.com/v1/admin/models/search*', 'immigrate-worker'],
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              throw new Error(JSON.stringify(body.errors || body));
            }
            return body.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          let existing = await cf(routePath);
          for (const [pattern, script] of desired) {
            const samePattern = existing.filter((route) => route.pattern === pattern);
            for (const route of samePattern) {
              if (route.script === script) continue;
              await cf(`${routePath}/${route.id}`, { method: 'DELETE' });
              console.log(`removed stale ${pattern} -> ${route.script || 'none'}`);
            }
            existing = await cf(routePath);
            if (!existing.some((route) => route.pattern === pattern && route.script === script)) {
              await cf(routePath, {
                method: 'POST',
                body: JSON.stringify({ pattern, script }),
              });
              console.log(`created ${pattern} -> ${script}`);
            }
          }

          const verified = await cf(routePath);
          const missing = desired.filter(([pattern, script]) =>
            !verified.some((route) => route.pattern === pattern && route.script === script)
          );
          if (missing.length) throw new Error(`route verification failed: ${JSON.stringify(missing)}`);
          console.log(`verified ${desired.length}/${desired.length} SIGIL Jobs routes`);
          NODE

      - name: Verify client lookup reaches JSON auth guard
        shell: bash
        run: |
          set -euo pipefail
          for host in mmdbkk.com www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -D "$headers" -o "$body" -w '%{http_code}' \
              -X POST -H 'content-type: application/json' \
              --data '{"query":"route-smoke"}' \
              "https://${host}/v1/admin/clients/lineage-lookup")"
            echo "${host} -> HTTP ${code}"
            grep -Eiq '^content-type:[[:space:]]*application/json' "$headers"
            test "$code" = "401" -o "$code" = "403"
            grep -Eq '"(error|ok)"' "$body"
            rm -f "$headers" "$body"
          done
