name: Recover admin browser credential

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-admin-browser-credential.yml"

concurrency:
  group: recover-admin-browser-credential
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare account
        run: npx --yes wrangler@4 whoami

      - name: Inspect safe secret names before recovery
        id: before
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config admin-worker/wrangler.toml > "$RUNNER_TEMP/admin-secrets-before.txt"
          cat "$RUNNER_TEMP/admin-secrets-before.txt"
          if ! grep -q 'ADMIN_BEARER' "$RUNNER_TEMP/admin-secrets-before.txt"; then
            echo "ADMIN_BEARER is not provisioned; refusing to remove the dedicated browser credential." >&2
            exit 1
          fi

      - name: Remove stale dedicated browser credential
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'ADMIN_LOGIN_CREDENTIAL' "$RUNNER_TEMP/admin-secrets-before.txt"; then
            printf 'y\n' | npx --yes wrangler@4 secret delete ADMIN_LOGIN_CREDENTIAL --config admin-worker/wrangler.toml
          else
            echo "ADMIN_LOGIN_CREDENTIAL is already absent; fallback is already active."
          fi

      - name: Verify fallback credential state
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list --config admin-worker/wrangler.toml > "$RUNNER_TEMP/admin-secrets-after.txt"
          cat "$RUNNER_TEMP/admin-secrets-after.txt"
          grep -q 'ADMIN_BEARER' "$RUNNER_TEMP/admin-secrets-after.txt"
          if grep -q 'ADMIN_LOGIN_CREDENTIAL' "$RUNNER_TEMP/admin-secrets-after.txt"; then
            echo "ADMIN_LOGIN_CREDENTIAL still exists after recovery." >&2
            exit 1
          fi
          echo "Browser login now resolves through ADMIN_BEARER fallback."
