name: Sync MMS Admin Review Route

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-mms-admin-review-route.yml"

permissions:
  contents: read

jobs:
  sync-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
    steps:
      - name: Sync query-safe MMS admin review routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = String(process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").trim();
          if (!zoneId || !token) throw new Error("Cloudflare route credentials are unavailable");

          const worker = "admin-worker";
          const desired = [
            "mmdbkk.com/internal/admin/mms*",
            "www.mmdbkk.com/internal/admin/mms*",
          ];
          const routePath = `/zones/${zoneId}/workers/routes`;

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const details = (payload.errors || []).map((item) => `${item.code || "unknown"}: ${item.message || "unknown"}`).join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${details}`);
            }
            return payload.result;
          }

          const existing = await cloudflare(routePath);
          for (const pattern of desired) {
            const conflict = existing.find((route) => route.pattern === pattern && route.script !== worker);
            if (conflict) throw new Error(`Refusing route takeover: ${pattern} -> ${conflict.script || "no script"}`);
          }

          const missing = desired.filter((pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker));
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          for (const pattern of desired) {
            if (!verified.some((route) => route.pattern === pattern && route.script === worker)) {
              throw new Error(`Route verification failed: ${pattern}`);
            }
          }
          console.log(`Verified MMS admin query-safe routes; created ${missing.length}`);
          NODE

      - name: Smoke exact HENNA applicant deep link
        shell: bash
        run: |
          set -euo pipefail
          application_id="mmsapp_1234567890abcdef12345678"
          url="https://www.mmdbkk.com/internal/admin/mms?tab=applications&application_id=${application_id}"
          headers="$(mktemp)"
          body="$(mktemp)"
          http_code="$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS -D "$headers" -o "$body" -w "%{http_code}" "$url")"
          cat "$headers"
          test "$http_code" = "303"
          expected="location: https://www.mmdbkk.com/internal/admin/login?next=%2Finternal%2Fadmin%2Fmms%3Ftab%3Dapplications%26application_id%3D${application_id}"
          grep -Fqi "$expected" "$headers"
          echo "MMS HENNA applicant deep link reaches admin-worker and preserves the exact application."
