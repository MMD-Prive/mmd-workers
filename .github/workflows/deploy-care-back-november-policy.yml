name: Inspect or release exact CARE BACK November policy artifact

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Inspect is read-only. Member Pages release uses its existing code-only workflow.'
        type: choice
        required: true
        default: inspect
        options: [inspect, release]
      worker:
        description: 'Exact target Worker; this workflow may release payments-worker only'
        type: choice
        required: true
        default: payments-worker
        options: [payments-worker, member-pages-worker]
      production_approved:
        description: 'Owner authorizes this exact payment artifact delta'
        type: boolean
        default: false
        required: true
      approval_ref:
        description: 'Existing owner approval reference; required for release'
        type: string
        required: false
      approved_sha:
        description: 'Exact current main SHA containing the reviewed tooling and manifest'
        type: string
        required: true
      patch_manifest:
        description: 'Tracked JSON path for the reviewed exact function-pair manifest'
        type: string
        required: true
      expected_manifest_sha256:
        description: 'SHA-256 of the exact UTF-8 manifest file'
        type: string
        required: true
      expected_module_sha256:
        description: 'Fresh active main-module SHA-256'
        type: string
        required: true
      expected_version:
        description: 'Fresh active version UUID'
        type: string
        required: true
      expected_deployment:
        description: 'Fresh active deployment UUID'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.execution_mode == 'inspect' && format('care-back-november-inspect-{0}', inputs.worker) || 'payments-worker-owner-approved-production' }}
  cancel-in-progress: false

env:
  CARE_BACK_WORKER: ${{ inputs.worker }}
  CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
  APPROVED_SHA: ${{ inputs.approved_sha }}
  APPROVAL_REF: ${{ inputs.approval_ref }}
  PATCH_MANIFEST: ${{ inputs.patch_manifest }}
  EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
  EXPECTED_MODULE_SHA256: ${{ inputs.expected_module_sha256 }}
  EXPECTED_VERSION: ${{ inputs.expected_version }}
  EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mmdprive' && github.triggering_actor == 'mmdprive' && github.run_attempt == 1 && inputs.approved_sha == github.sha && inputs.execution_mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify bounded release guards
        run: node --test scripts/care-back-november-policy-release.test.mjs
      - name: Verify reviewed payment function semantics before inspection
        if: inputs.worker == 'payments-worker'
        run: node --test scripts/care-back-november-payments-manifest.test.mjs
      - name: Read active artifact and prove exact reversible patch without uploading
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/care-back-november-policy-release.mjs
      - name: Save sanitized inspection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-back-november-inspect-${{ inputs.worker }}-${{ github.run_id }}
          path: ${{ runner.temp }}/care-back-november-${{ inputs.worker }}-receipt.json
          if-no-files-found: ignore
          retention-days: 14

  verify-protection:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mmdprive' && github.triggering_actor == 'mmdprive' && github.run_attempt == 1 && inputs.approved_sha == github.sha && inputs.execution_mode == 'release' && inputs.worker == 'payments-worker' && inputs.production_approved == true && inputs.approval_ref != ''
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}
      environment_name: mmd-production-mutation

  release-payments:
    needs: [verify-protection]
    if: needs.verify-protection.result == 'success' && inputs.execution_mode == 'release' && inputs.worker == 'payments-worker'
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify guarded transport and existing payment behavior
        run: node --test scripts/care-back-november-policy-release.test.mjs scripts/care-back-november-payments-manifest.test.mjs scripts/admin-production-approval.test.mjs shared/membership-promotion-policy.test.mjs payments-worker/reviewed-membership-write-through.test.mjs payments-worker/canonical-web-renewal-settlement.test.mjs payments-worker/reviewed-proof-line-recovery.test.mjs
      - name: Upload and promote the exact reviewed delta with strict binding inheritance
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          PRODUCTION_ENVIRONMENT_NAME: mmd-production-mutation
        run: node scripts/care-back-november-policy-release.mjs --execute-approved
      - name: Save sanitized release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-back-november-payments-${{ github.run_id }}
          path: ${{ runner.temp }}/care-back-november-payments-worker-receipt.json
          if-no-files-found: ignore
          retention-days: 14

