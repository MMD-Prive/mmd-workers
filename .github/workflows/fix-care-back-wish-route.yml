name: Fix CARE BACK Wish route

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-care-back-wish-route.yml"

permissions:
  contents: read

concurrency:
  group: fix-care-back-wish-route-production
  cancel-in-progress: false

jobs:
  sync-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      WORKER_NAME: "member-dashboard-chat-worker"
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: "appsV1ILPRfIjkaYg"

    steps:
      - name: Normalize route and storage credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => String(value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const routeToken = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          const zoneId = clean(process.env.CLOUDFLARE_ZONE_ID);
          const airtableToken = clean(process.env.AIRTABLE_API_KEY);
          const airtableBase = clean(process.env.AIRTABLE_BASE_ID);
          if (!routeToken || !zoneId) throw new Error("Cloudflare route credentials are missing");
          if (!airtableToken || airtableBase !== "appsV1ILPRfIjkaYg") throw new Error("Airtable cleanup credentials are missing");
          console.log(`::add-mask::${routeToken}`);
          console.log(`::add-mask::${airtableToken}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${routeToken}\nAIRTABLE_API_KEY=${airtableToken}\n`);
          NODE

      - name: Restore exact CARE BACK Wish routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = process.env.WORKER_NAME;
          const desired = [
            "mmdbkk.com/member/api/care-back/public-wish*",
            "www.mmdbkk.com/member/api/care-back/public-wish*",
            "mmdbkk.com/member/api/care-back/link-wish*",
            "www.mmdbkk.com/member/api/care-back/link-wish*",
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "content-type": "application/json",
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            if (!response.ok || body?.success !== true) {
              const errors = Array.isArray(body?.errors) ? body.errors.map(({ code, message }) => ({ code, message })) : [];
              throw new Error(`Cloudflare route API ${response.status}: ${JSON.stringify(errors)}`);
            }
            return body.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          let existing = await cf(routePath);
          for (const pattern of desired) {
            const found = existing.find((route) => route.pattern === pattern);
            if (!found) {
              await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
              console.log(`created ${pattern} -> ${worker}`);
              existing = await cf(routePath);
              continue;
            }
            if (found.script !== worker) {
              await cf(`${routePath}/${found.id}`, { method: "PUT", body: JSON.stringify({ pattern, script: worker }) });
              console.log(`reassigned ${pattern} -> ${worker}`);
              existing = await cf(routePath);
            } else {
              console.log(`kept ${pattern} -> ${worker}`);
            }
          }

          const verified = await cf(routePath);
          const missing = desired.filter((pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`CARE BACK Wish routes not owned by ${worker}: ${missing.join(", ")}`);
          console.log(`verified ${desired.length}/${desired.length} CARE BACK Wish routes -> ${worker}`);
          NODE

      - name: Prove production public Wish end to end
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const airtableToken = String(process.env.AIRTABLE_API_KEY || "").trim();
          const base = String(process.env.AIRTABLE_BASE_ID || "").trim();
          const table = "tblvMJjYXy29mgDLb";
          const requestId = `wish-${crypto.randomUUID()}`;
          const endpoint = "https://mmdbkk.com/member/api/care-back/public-wish";
          let response = null;
          let payload = null;
          try {
            response = await fetch(endpoint, {
              method: "POST",
              redirect: "manual",
              headers: {
                accept: "application/json",
                "content-type": "application/json",
                origin: "https://mmdbkk.com",
                referer: "https://mmdbkk.com/promotion/6-years-care-back/wish",
              },
              body: JSON.stringify({
                wish_text: "Production public Wish route smoke",
                request_id: requestId,
                language: "en",
              }),
            });
            payload = await response.json().catch(() => null);
            const owner = String(response.headers.get("x-mmd-route-owner") || "");
            const upstream = String(response.headers.get("x-mmd-upstream-service") || "");
            const worker = String(response.headers.get("x-mmd-worker") || "");
            console.log(`production Wish: HTTP ${response.status}; route_owner=${owner || "none"}; upstream=${upstream || "none"}; worker=${worker || "none"}; ok=${payload?.ok === true}; state=${String(payload?.state || "")}`);
            if (response.status !== 200 || payload?.ok !== true || payload?.state !== "completed") {
              const code = String(payload?.error?.code || "none").slice(0, 120);
              throw new Error(`Production public Wish failed: HTTP_${response.status} ${code}`);
            }
            if (owner !== "member-dashboard-chat-worker" || upstream !== "member-pages-worker") {
              throw new Error(`Unexpected production Wish ownership: ${owner || "none"}/${upstream || "none"}`);
            }
          } finally {
            const lookup = new URL(`https://api.airtable.com/v0/${base}/${table}`);
            lookup.searchParams.set("filterByFormula", `AND({campaign_id}='care_back',{idempotency_key}='${requestId}')`);
            lookup.searchParams.set("maxRecords", "2");
            const foundResponse = await fetch(lookup, { headers: { Authorization: `Bearer ${airtableToken}` } }).catch(() => null);
            const found = foundResponse ? await foundResponse.json().catch(() => ({})) : {};
            for (const record of Array.isArray(found?.records) ? found.records : []) {
              if (!record?.id) continue;
              await fetch(`https://api.airtable.com/v0/${base}/${table}/${encodeURIComponent(record.id)}`, {
                method: "DELETE",
                headers: { Authorization: `Bearer ${airtableToken}` },
              }).catch(() => null);
            }
          }
          console.log("Production public Wish accepted, persisted, and synthetic smoke record was removed");
          NODE
