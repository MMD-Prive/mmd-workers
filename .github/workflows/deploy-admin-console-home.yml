name: Release Admin Console home only

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-admin-console-home.yml'
      - 'scripts/admin-console-*'
      - 'scripts/admin-current-session-code-only*'
      - 'scripts/admin-production-approval*'
      - 'scripts/admin-production-validation*'
      - 'admin-worker/src/admin-login-hero-worker.js'
      - 'admin-worker/src/admin-login-hero-worker-core.js'
      - 'admin-worker/src/admin-login-page.js'
      - 'admin-worker/src/admin-console-page.js'
      - 'admin-worker/admin-console-*.test.mjs'
      - 'admin-worker/admin-login-*.test.mjs'
      - 'admin-worker/owner-production-smoke-contracts.test.mjs'
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner approval for Console home/default landing only; preserve routes and configuration'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this exact Console-home release'
        type: string
        required: true
      approved_sha:
        description: 'Exact full main SHA running this protected release'
        type: string
        required: true
      expected_version:
        description: 'Reviewed active version: 51ae638f-55b5-40f2-a0fb-2a0f7e40c8f5'
        type: string
        required: true
      expected_deployment:
        description: 'Reviewed active deployment: 8eb1667c-28d0-4410-896d-9357f979b8a4'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-admin-worker-production' || format('admin-console-home-contracts-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix immigrate-worker --ignore-scripts --no-audit --no-fund
      - run: npm install --global wrangler@4.158.0 --no-audit --no-fund
      - name: Verify exact overlay, delivered candidate and unchanged release guards
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --test scripts/admin-console-*.test.mjs scripts/admin-current-session-code-only.test.mjs scripts/admin-production-approval.test.mjs scripts/admin-production-validation.test.mjs
          node --test admin-worker/admin-console-*.test.mjs admin-worker/admin-dashboard-jobs.test.mjs admin-worker/admin-login-*.test.mjs admin-worker/owner-production-smoke-contracts.test.mjs

  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}
      environment_name: mmd-production-mutation

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [production-approval, contracts]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Overlay Console home on the exact live module and verify delivery
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          PRODUCTION_ENVIRONMENT_NAME: mmd-production-mutation
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/admin-console-home-release.mjs --execute-approved
      - name: Save the sanitized Console-home release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-home-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admin-console-home-receipt.json
          if-no-files-found: ignore
          retention-days: 90
