name: Patch payment internal binding temp

on:
  push:
    branches:
      - fix/payment-internal-binding-headline-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-internal-binding-headline-20260913

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply service-binding-first transport and headline contrast patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              write(path, text.replace(old, new, 1))

          def insert_after_once(path, needle, addition):
              replace_once(path, needle, needle + addition)

          transport = '''const DEFAULT_PAYMENTS_ORIGIN = "https://sigil.mmdbkk.com";

export function paymentsInternalTransport(env = {}) {
  return typeof env.PAYMENTS_WORKER?.fetch === "function" ? "service_binding" : "https_fallback";
}

export async function requestPaymentsInternal(env = {}, path, body) {
  const serviceToken = String(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS || "").trim();
  if (!serviceToken) throw transportError(503, "payments_worker_service_auth_missing");

  const internalPath = String(path || "").trim();
  if (!internalPath.startsWith("/v1/internal/payments/")) {
    throw transportError(500, "payments_worker_internal_path_invalid");
  }

  const init = {
    method: "POST",
    headers: {
      Authorization: `Bearer ${serviceToken}`,
      "Content-Type": "application/json",
      Accept: "application/json",
    },
    body: JSON.stringify(body),
    redirect: "manual",
  };

  if (paymentsInternalTransport(env) === "service_binding") {
    return env.PAYMENTS_WORKER.fetch(new Request(`${DEFAULT_PAYMENTS_ORIGIN}${internalPath}`, init));
  }

  const base = String(env.PAYMENTS_WORKER_BASE_URL || env.PAYMENTS_BASE_URL || "").trim().replace(/\\/+$/, "");
  if (!base) throw transportError(503, "payments_worker_base_url_missing");

  let url;
  try {
    url = new URL(base);
  } catch {
    throw transportError(503, "payments_worker_base_url_invalid");
  }
  if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash || url.pathname !== "/") {
    throw transportError(503, "payments_worker_base_url_invalid");
  }

  return fetch(`${url.origin}${internalPath}`, init);
}

function transportError(status, message) {
  const error = new Error(message);
  error.status = status;
  return error;
}
'''
          write("admin-worker/src/payments-internal-transport.js", transport)

          transport_test = '''import test from "node:test";
import assert from "node:assert/strict";

import { paymentsInternalTransport, requestPaymentsInternal } from "./src/payments-internal-transport.js";

test("service binding wins over HTTPS fallback for internal payment writes", async () => {
  const originalFetch = globalThis.fetch;
  let globalFetchCalls = 0;
  let boundCalls = 0;
  globalThis.fetch = async () => {
    globalFetchCalls += 1;
    throw new Error("global fetch must not run when PAYMENTS_WORKER binding exists");
  };
  try {
    const env = {
      PAYMENTS_BASE_URL: "https://old-unreachable.example.invalid",
      AUTH_SERVICE_ADMIN_TO_PAYMENTS: "service-secret",
      PAYMENTS_WORKER: {
        fetch: async (request) => {
          boundCalls += 1;
          assert.equal(request.url, "https://sigil.mmdbkk.com/v1/internal/payments/reviewed-proof");
          assert.equal(request.headers.get("Authorization"), "Bearer service-secret");
          assert.equal(request.headers.get("Content-Type"), "application/json");
          assert.deepEqual(await request.json(), { proof_id: "proof-1" });
          return Response.json({ ok: true, authority: "payments-worker" });
        },
      },
    };
    assert.equal(paymentsInternalTransport(env), "service_binding");
    const response = await requestPaymentsInternal(env, "/v1/internal/payments/reviewed-proof", { proof_id: "proof-1" });
    assert.equal(response.status, 200);
    assert.equal(boundCalls, 1);
    assert.equal(globalFetchCalls, 0);
  } finally {
    globalThis.fetch = originalFetch;
  }
});

test("HTTPS fallback remains available only when service binding is absent", async () => {
  const originalFetch = globalThis.fetch;
  let called = 0;
  globalThis.fetch = async (input, init) => {
    called += 1;
    assert.equal(String(input), "https://sigil.mmdbkk.com/v1/internal/payments/historical-slip/reviewed");
    assert.equal(init.headers.Authorization, "Bearer service-secret");
    return Response.json({ ok: false, error: "historical_proof_sha_mismatch" }, { status: 409 });
  };
  try {
    const env = {
      PAYMENTS_BASE_URL: "https://sigil.mmdbkk.com",
      AUTH_SERVICE_ADMIN_TO_PAYMENTS: "service-secret",
    };
    assert.equal(paymentsInternalTransport(env), "https_fallback");
    const response = await requestPaymentsInternal(env, "/v1/internal/payments/historical-slip/reviewed", { proof_id: "proof-2" });
    assert.equal(response.status, 409);
    assert.equal(called, 1);
  } finally {
    globalThis.fetch = originalFetch;
  }
});

test("transport refuses non-payment internal paths", async () => {
  await assert.rejects(
    requestPaymentsInternal({ AUTH_SERVICE_ADMIN_TO_PAYMENTS: "service-secret" }, "/v1/confirm/link", {}),
    /payments_worker_internal_path_invalid/,
  );
});
'''
          write("admin-worker/payments-internal-transport.test.mjs", transport_test)

          # Normal Payment Review -> payments-worker.
          path = "admin-worker/src/payment-review-runtime.js"
          insert_after_once(
              path,
              'import { inferMembershipPayment, membershipInferenceLabel } from "../../shared/payment-intelligence.mjs";\n',
              'import { requestPaymentsInternal } from "./payments-internal-transport.js";\n',
          )
          replace_once(
              path,
              '''async function sendReviewedProofToPayments(env, body) {
  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  const token = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!base) throw httpError(503, "payments_worker_base_url_missing");
  if (!token) throw httpError(503, "payments_worker_service_auth_missing");
  return fetch(`${base}/v1/internal/payments/reviewed-proof`, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}
''',
              '''async function sendReviewedProofToPayments(env, body) {
  return requestPaymentsInternal(env, "/v1/internal/payments/reviewed-proof", body);
}
''',
          )

          # Email-less LINE renewal recovery -> payments-worker.
          path = "admin-worker/src/payment-review-line-recovery.js"
          write(path, 'import { requestPaymentsInternal } from "./payments-internal-transport.js";\n\n' + read(path))
          replace_once(
              path,
              '''async function sendToPayments(env, body) {
  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  const tokenValue = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!base || !tokenValue) throw httpError(503, "payments_worker_service_not_ready");
  return fetch(`${base}/v1/internal/payments/reviewed-proof`, {
    method: "POST",
    headers: { Authorization: `Bearer ${tokenValue}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}
''',
              '''async function sendToPayments(env, body) {
  try {
    return await requestPaymentsInternal(env, "/v1/internal/payments/reviewed-proof", body);
  } catch (error) {
    if ([
      "payments_worker_base_url_missing",
      "payments_worker_base_url_invalid",
      "payments_worker_service_auth_missing",
    ].includes(String(error?.message || ""))) {
      throw httpError(503, "payments_worker_service_not_ready");
    }
    throw error;
  }
}
''',
          )

          # Historical recovery actual handoff and controlled probe -> payments-worker.
          path = "admin-worker/src/historical-slip-backfill-runtime.js"
          write(path, 'import { requestPaymentsInternal } from "./payments-internal-transport.js";\n\n' + read(path))
          text = read(path)
          old_guard = '''  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  const serviceToken = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!base) throw httpError(503, "payments_worker_base_url_missing");
  if (!serviceToken) throw httpError(503, "payments_worker_service_auth_missing");

'''
          if text.count(old_guard) != 2:
              raise SystemExit(f"{path}: expected two historical HTTP guard blocks, found {text.count(old_guard)}")
          write(path, text.replace(old_guard, ""))
          replace_once(
              path,
              '''  const response = await fetch(`${base}/v1/internal/payments/historical-slip/reviewed`, {
    method: "POST",
    headers: { Authorization: `Bearer ${serviceToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(handoff),
  });
''',
              '''  const response = await requestPaymentsInternal(
    env,
    "/v1/internal/payments/historical-slip/reviewed",
    handoff,
  );
''',
          )
          replace_once(
              path,
              '''  const response = await fetch(base + "/v1/internal/payments/historical-slip/reviewed", {
    method: "POST",
    headers: { Authorization: "Bearer " + serviceToken, "Content-Type": "application/json" },
    body: JSON.stringify(handoffProbe),
  });
''',
              '''  const response = await requestPaymentsInternal(
    env,
    "/v1/internal/payments/historical-slip/reviewed",
    handoffProbe,
  );
''',
          )

          # Shared payment headline contrast: prevent transparent/near-black hero typography.
          headline_patch = '''\n    if (!document.getElementById('mmd-payment-headline-contrast-v1')) {
      const style = document.createElement('style');
      style.id = 'mmd-payment-headline-contrast-v1';
      style.textContent = `
        #money-control-v3 h1, #mmd-slip-inbox h1, #mmd-history-backfill h1 {
          background: none !important;
          color: #f4efe6 !important;
          -webkit-text-fill-color: #f4efe6 !important;
          opacity: 1 !important;
          filter: none !important;
          text-shadow: 0 1px 0 rgba(255,255,255,.05), 0 14px 38px rgba(0,0,0,.38) !important;
        }
        #money-control-v3 h2, #mmd-slip-inbox h2, #mmd-history-backfill h2 {
          background: none !important;
          color: #ece5da !important;
          -webkit-text-fill-color: #ece5da !important;
          opacity: 1 !important;
          filter: none !important;
        }
      `;
      document.head.appendChild(style);
    }
'''
          insert_after_once(
              "webflow/internal/admin/payments/payment-control-plane-v6.js",
              "    if (!root) return;\n",
              headline_patch,
          )
          insert_after_once(
              "webflow/internal/ceo/payment-slip-inbox-v5.js",
              "  if (!root || root.__psi5) return;\n",
              headline_patch.replace("\n    if", "\n  if", 1).replace("\n      const style", "\n    const style").replace("\n      style.id", "\n    style.id").replace("\n      style.textContent", "\n    style.textContent").replace("\n      document.head", "\n    document.head").replace("\n    }\n", "\n  }\n", 1),
          )
          hist_headline = headline_patch.replace("\n    if", "\n  if", 1).replace("\n      const style", "\n    const style").replace("\n      style.id", "\n    style.id").replace("\n      style.textContent", "\n    style.textContent").replace("\n      document.head", "\n    document.head").replace("\n    }\n", "\n  }\n", 1)
          insert_after_once(
              "webflow/internal/admin/payments/historical-backfill-control-plane-v2.js",
              "  if (!root) return;\n",
              hist_headline,
          )

          # Payment Review CI knows transport auth/binding now lives in the shared helper.
          path = ".github/workflows/payment-review-facade-ci.yml"
          text = read(path)
          text = text.replace(
              '      - "admin-worker/src/payment-review-line-recovery.js"\n',
              '      - "admin-worker/src/payment-review-line-recovery.js"\n      - "admin-worker/src/payments-internal-transport.js"\n      - "admin-worker/src/historical-slip-backfill-runtime.js"\n      - "admin-worker/payments-internal-transport.test.mjs"\n',
              1,
          )
          text = text.replace(
              '      - "webflow/internal/admin/payments/**"\n',
              '      - "webflow/internal/admin/payments/**"\n      - "webflow/internal/ceo/payment-slip-inbox-v5.js"\n',
              1,
          )
          text = text.replace(
              '          node --check admin-worker/src/payment-review-line-recovery.js\n',
              '          node --check admin-worker/src/payment-review-line-recovery.js\n          node --check admin-worker/src/payments-internal-transport.js\n          node --check admin-worker/src/historical-slip-backfill-runtime.js\n',
              1,
          )
          marker = '      - name: Newest payment proof queue contract\n'
          if marker not in text:
              raise SystemExit("payment-review CI insertion marker missing")
          text = text.replace(
              marker,
              '      - name: Internal payments service binding contract\n        run: |\n          set -euo pipefail\n          node --test admin-worker/payments-internal-transport.test.mjs\n\n' + marker,
              1,
          )
          old_truth = '''          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' admin-worker/src/payment-review-runtime.js
          grep -F '/v1/internal/payments/reviewed-proof' admin-worker/src/payment-review-runtime.js
          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' admin-worker/src/payment-review-line-recovery.js
          grep -F '/v1/internal/payments/reviewed-proof' admin-worker/src/payment-review-line-recovery.js
'''
          new_truth = '''          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' admin-worker/src/payments-internal-transport.js
          grep -F 'PAYMENTS_WORKER?.fetch' admin-worker/src/payments-internal-transport.js
          grep -F 'requestPaymentsInternal' admin-worker/src/payment-review-runtime.js
          grep -F '/v1/internal/payments/reviewed-proof' admin-worker/src/payment-review-runtime.js
          grep -F 'requestPaymentsInternal' admin-worker/src/payment-review-line-recovery.js
          grep -F '/v1/internal/payments/reviewed-proof' admin-worker/src/payment-review-line-recovery.js
          grep -F 'requestPaymentsInternal' admin-worker/src/historical-slip-backfill-runtime.js
          grep -F '/v1/internal/payments/historical-slip/reviewed' admin-worker/src/historical-slip-backfill-runtime.js
'''
          if old_truth not in text:
              raise SystemExit("payment-review CI Money Truth block missing")
          text = text.replace(old_truth, new_truth, 1)
          write(path, text)

          # Historical route gate validates the shared service-binding helper too.
          path = ".github/workflows/historical-backfill-route-gate.yml"
          text = read(path)
          text = text.replace(
              '      - "admin-worker/src/historical-slip-backfill-runtime.js"\n',
              '      - "admin-worker/src/historical-slip-backfill-runtime.js"\n      - "admin-worker/src/payments-internal-transport.js"\n      - "admin-worker/payments-internal-transport.test.mjs"\n',
              1,
          )
          text = text.replace(
              '          node --check admin-worker/src/historical-slip-backfill-runtime.js\n',
              '          node --check admin-worker/src/historical-slip-backfill-runtime.js\n          node --check admin-worker/src/payments-internal-transport.js\n',
              1,
          )
          text = text.replace(
              '            admin-worker/historical-slip-backfill-route.test.mjs \\\n            admin-worker/historical-slip-backfill-handoff-probe.test.mjs\n',
              '            admin-worker/historical-slip-backfill-route.test.mjs \\\n            admin-worker/historical-slip-backfill-handoff-probe.test.mjs \\\n            admin-worker/payments-internal-transport.test.mjs\n',
              1,
          )
          text = text.replace(
              "          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' admin-worker/src/historical-slip-backfill-runtime.js\n",
              "          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' admin-worker/src/payments-internal-transport.js\n          grep -F 'PAYMENTS_WORKER?.fetch' admin-worker/src/payments-internal-transport.js\n          grep -F 'requestPaymentsInternal' admin-worker/src/historical-slip-backfill-runtime.js\n",
              1,
          )
          write(path, text)
          PY

      - name: Validate targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/payments-internal-transport.js
          node --check admin-worker/src/payment-review-runtime.js
          node --check admin-worker/src/payment-review-line-recovery.js
          node --check admin-worker/src/historical-slip-backfill-runtime.js
          node --test admin-worker/payments-internal-transport.test.mjs
          node --experimental-global-webcrypto --test admin-worker/historical-slip-backfill-handoff-probe.test.mjs
          node --test admin-worker/payment-review-manual-renewal-recovery.test.mjs
          node --check webflow/internal/admin/payments/payment-control-plane-v6.js
          node --check webflow/internal/ceo/payment-slip-inbox-v5.js
          node --check webflow/internal/admin/payments/historical-backfill-control-plane-v2.js

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-payment-internal-binding-temp.yml
          git add -A
          git diff --cached --check
          git config user.name "mmd-payment-bot"
          git config user.email "mmd-payment-bot@users.noreply.github.com"
          git commit -m "Fix payment internal service binding and headline contrast"
          git push origin HEAD:fix/payment-internal-binding-headline-20260913
