name: CARE BACK Production Trusted Caller Rollout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/care-back-prod-trusted-caller-rollout.yml"

concurrency:
  group: care-back-prod-trusted-caller-rollout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: appsV1ILPRfIjkaYg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Normalize credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const clean = (value) => (value || '').replace(/[\u2028\u2029\r\n]/g, '').trim();
          const cf = clean(process.env.CLOUDFLARE_API_TOKEN);
          const account = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const airtable = clean(process.env.AIRTABLE_API_KEY);
          if (!cf || !account) throw new Error('Cloudflare deployment credentials missing');
          if (!airtable) throw new Error('Airtable production credential missing');
          console.log(`::add-mask::${cf}`);
          console.log(`::add-mask::${airtable}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${cf}\nCLOUDFLARE_ACCOUNT_ID=${account}\nAIRTABLE_API_KEY=${airtable}\n`);
          NODE

      - name: Validate trusted caller source
        shell: bash
        run: |
          set -euo pipefail
          node --check member-pages-worker/src/care-back-trusted-booking-approval.js
          node --check member-pages-worker/src/runtime-index.js
          node --check sigil-booking-worker/src/care-back-trusted-caller.js
          node --check sigil-booking-worker/src/runtime-index.js
          node --experimental-global-webcrypto --test member-pages-worker/test/care-back-trusted-booking-approval.test.mjs
          node --experimental-global-webcrypto --test sigil-booking-worker/test/care-back-trusted-caller.test.mjs
          node --experimental-global-webcrypto --test member-pages-worker/test/care-back-claim-store.test.mjs
          npx --yes wrangler@4 deploy --dry-run --keep-vars --config member-pages-worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --keep-vars --config sigil-booking-worker/wrangler.toml

      - name: Generate one shared trusted-caller secret
        shell: bash
        run: |
          set -euo pipefail
          secret="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          test "${#secret}" -eq 64
          echo "::add-mask::$secret"
          echo "CARE_BACK_TRUSTED_CALLER_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Provision shared service secret on both Workers
        shell: bash
        run: |
          set -euo pipefail
          set +x
          printf '%s' "$CARE_BACK_TRUSTED_CALLER_SECRET" | npx --yes wrangler@4 secret put AUTH_SERVICE_SIGIL_BOOKING_TO_MEMBER_PAGES --config member-pages-worker/wrangler.toml
          printf '%s' "$CARE_BACK_TRUSTED_CALLER_SECRET" | npx --yes wrangler@4 secret put AUTH_SERVICE_SIGIL_BOOKING_TO_MEMBER_PAGES --config sigil-booking-worker/wrangler.toml
          printf '%s' "$AIRTABLE_API_KEY" | npx --yes wrangler@4 secret put AIRTABLE_API_KEY --config member-pages-worker/wrangler.toml

      - name: Deploy member-pages-worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --keep-vars --config member-pages-worker/wrangler.toml

      - name: Deploy sigil-booking-worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --keep-vars --config sigil-booking-worker/wrangler.toml

      - name: Smoke service health and trusted-route perimeter
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() {
            curl --retry 8 --retry-delay 2 --retry-all-errors -sS "$@"
          }

          sigil_body="$(mktemp)"
          sigil_code="$(retry_curl -o "$sigil_body" -w '%{http_code}' https://sigil-booking-worker.malemodel-bkk.workers.dev/health)"
          cat "$sigil_body"
          test "$sigil_code" = "200"
          grep -q '"ok":true' "$sigil_body"

          confirm_body="$(mktemp)"
          confirm_code="$(retry_curl -o "$confirm_body" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' https://sigil.mmdbkk.com/__internal/booking/confirm)"
          cat "$confirm_body"
          test "$confirm_code" = "401"
          grep -q 'unauthorized' "$confirm_body"

          public_search_body="$(mktemp)"
          public_search_code="$(retry_curl -o "$public_search_body" -w '%{http_code}' -H 'Origin: https://mmdbkk.com' 'https://sigil.mmdbkk.com/sigil/api/models/search?q=__care_back_prod_smoke_no_match__&scope=public')"
          cat "$public_search_body"
          test "$public_search_code" = "200"

      - name: Emit rollout receipt
        shell: bash
        run: |
          cat <<EOF
          CARE BACK trusted caller production rollout complete
          source_sha=${GITHUB_SHA}
          member_pages_worker=deployed
          sigil_booking_worker=deployed
          shared_secret=provisioned_masked
          perimeter_smoke=passed
          real_line_smoke=still_requires_real_line_session
          EOF
