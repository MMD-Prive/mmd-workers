name: HYPE production receipts

on:
  push:
    branches:
      - main
    paths:
      - "ops/hype-shop-production-smoke/PRODUCTION_REVERIFY_20260920.md"
      - "telegram-worker/PRODUCTION_REVERIFY_20260920.md"
  workflow_run:
    workflows:
      - "Deploy telegram-worker"
      - "HYPE closed-loop production smoke"
    types:
      - completed

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  record-workflow:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record component production receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "### HYPE production acceptance receipt

- workflow: `$RUN_NAME`
- source_sha: `$RUN_SHA`
- run_id: `$RUN_ID`
- conclusion: `$RUN_CONCLUSION`
- run: $RUN_URL

This receipt is generated from the completed production workflow, not inferred from source presence."
          test "$RUN_CONCLUSION" = "success"

  record-final-pair:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for both production acceptance workflows
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          names=("Deploy telegram-worker" "HYPE closed-loop production smoke")
          : > "$RUNNER_TEMP/hype-final-runs.jsonl"

          for workflow_name in "${names[@]}"; do
            completed=0
            for attempt in $(seq 1 180); do
              rows="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA" --limit 100 --json name,workflowName,status,conclusion,databaseId,url,headSha)"
              found="$(node -e 'const wanted=process.argv[1]; const rows=JSON.parse(process.argv[2]||"[]"); const row=rows.find((x)=>x.headSha===process.env.SOURCE_SHA && (x.workflowName===wanted || x.name===wanted)); if(row) process.stdout.write(JSON.stringify(row));' "$workflow_name" "$rows")"

              if [ -z "$found" ]; then
                sleep 5
                continue
              fi

              status="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.status||""))' "$found")"
              conclusion="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.conclusion||""))' "$found")"
              run_id="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.databaseId||""))' "$found")"
              echo "$workflow_name run=$run_id status=$status conclusion=$conclusion"

              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                printf '%s\n' "$found" >> "$RUNNER_TEMP/hype-final-runs.jsonl"
                completed=1
                break
              fi
              sleep 5
            done

            if [ "$completed" -ne 1 ]; then
              echo "Final production workflow did not complete successfully: $workflow_name @ $SOURCE_SHA" >&2
              exit 1
            fi
          done

      - name: Write FINAL closed-loop production receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/hype-final-runs.jsonl" "$RUNNER_TEMP/hype-final-receipt.md" <<'NODE'
          const fs = require("node:fs");
          const [input, output] = process.argv.slice(2);
          const rows = fs.readFileSync(input, "utf8").trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          const by = new Map(rows.map((row) => [row.workflowName || row.name, row]));
          const telegram = by.get("Deploy telegram-worker");
          const smoke = by.get("HYPE closed-loop production smoke");
          if (!telegram || !smoke) throw new Error("both production receipts are required");
          if (telegram.conclusion !== "success" || smoke.conclusion !== "success") throw new Error("production acceptance requires success");
          const sourceSha = process.env.SOURCE_SHA;
          const body = [
            "## ✅ FINAL HYPE closed-loop production receipt",
            "",
            `- source_sha: \`${sourceSha}\``,
            `- Deploy telegram-worker: **success** · run ${telegram.databaseId} · ${telegram.url}`,
            `- HYPE closed-loop production smoke: **success** · run ${smoke.databaseId} · ${smoke.url}`,
            "- Recovery domains: **Shop + Booking + MMS accepted**",
            "- LINE slip live intake: **production owner path accepted**",
            "- Customer/Model Telegram Auto-DM: **verified contract accepted**",
            "- Telegram core route owner: **telegram-worker locked**",
            "- business truth mutation by smoke: **NONE**",
            "",
            "**closed-loop production complete: VERIFIED**",
            "",
            "This final receipt is emitted only after both production workflows for the same source SHA complete successfully."
          ].join("\n");
          fs.writeFileSync(output, body + "\n");
          NODE
          cat "$RUNNER_TEMP/hype-final-receipt.md"
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/hype-final-receipt.md"
