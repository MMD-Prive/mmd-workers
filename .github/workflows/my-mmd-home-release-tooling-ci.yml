name: My MMD Home release tooling CI
on:
  pull_request:
    paths:
      - scripts/my-mmd-home-delta-*
      - scripts/care-back-november-policy-release.mjs
      - scripts/member-pages-owner-approval.test.mjs
      - .github/workflows/deploy-member-pages-worker-code-only.yml
      - .github/workflows/my-mmd-home-release-tooling-ci.yml
permissions:
  contents: read
jobs:
  offline-release-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Offline adapter, workflow and Owner guard tests
        run: node --test scripts/my-mmd-home-delta-workflow.test.mjs scripts/my-mmd-home-delta-adapter.test.mjs scripts/care-back-november-policy-release.test.mjs scripts/member-pages-owner-approval.test.mjs
      - name: CLI syntax and whitespace
        run: |
          node --check scripts/my-mmd-home-delta-cli.mjs
          git diff --check
