name: MMD Rich Menu Production Acceptance

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner approval for this workflow and its production side effects only'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this workflow and commit'
        type: string
        required: true
      approved_sha:
        description: 'Full main commit SHA approved for this workflow'
        type: string
        required: true
permissions:
  contents: read

concurrency:
  group: mmd-rich-menu-production-acceptance
  cancel-in-progress: false

jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}

  acceptance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [production-approval]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADMIN_LOGIN_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate current three-level Rich Menu contract
        run: |
          node --check member-dashboard-chat-worker/src/mmd-rich-menu-scheduled-runtime.mjs
          node --check admin-worker/src/index.js
          node --test member-dashboard-chat-worker/test/rich-menu-line-id-transport.test.mjs member-dashboard-chat-worker/test/mmd-rich-menu-scheduled-runtime.test.mjs member-dashboard-chat-worker/test/rich-menu-navigation-reply.test.mjs member-dashboard-chat-worker/test/rich-menu-navigation-webhook.test.mjs member-dashboard-chat-worker/test/rich-menu-membership-response.test.mjs admin-worker/rich-menu-admin-publisher.test.mjs

      - name: Prepare objects and audit production
        run: node tools/mmd-rich-menu-production-acceptance.mjs

      - name: Upload sanitized production receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmd-rich-menu-production-acceptance
          path: ${{ runner.temp }}/mmd-rich-menu-production-acceptance.json
          retention-days: 14
          if-no-files-found: error

      - name: Acceptance summary
        if: success()
        run: |
          echo '### MMD Rich Menu production acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo '- Current runtime: mmd-rm3-20261004-v4.15' >> "$GITHUB_STEP_SUMMARY"
          echo '- LV1 artwork: approved v4.1 MMD STORIES / Discover TMIB asset' >> "$GITHUB_STEP_SUMMARY"
          echo '- Visibility: available 24h, collapsed by default; user can open the menu anytime' >> "$GITHUB_STEP_SUMMARY"
          echo '- Menu objects/actions/images: verified against LINE production' >> "$GITHUB_STEP_SUMMARY"
          echo '- Five-state resolver policy: Guest/Public/Private/Expired/Blocked verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Physical taps: intentionally not claimed; requires real LINE client' >> "$GITHUB_STEP_SUMMARY"
