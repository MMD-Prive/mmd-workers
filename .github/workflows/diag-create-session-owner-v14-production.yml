name: Diagnose Create Session owner UI

on:
  push:
    branches:
      - diag/create-session-owner-v14-production
    paths:
      - ".github/workflows/diag-create-session-owner-v14-production.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify apex and www owner Create Session
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -D "$headers" -o "$body" -w '%{http_code}' \
              "$origin/internal/admin/jobs/create-session?mock=1&diag=${GITHUB_SHA}")"
            echo "ORIGIN=$origin HTTP=$code"
            grep -Ei '^(x-mmd-create-session-ui|x-mmd-create-session-runtime|server|cf-ray):' "$headers" || true
            test "$code" = "200"
            grep -Eiq '^x-mmd-create-session-ui:[[:space:]]*owner-v14-vnext2-restored' "$headers"
            grep -Eiq '^x-mmd-create-session-runtime:[[:space:]]*current-entitlement-aware' "$headers"
            grep -q 'class="mmd-cs-v14"' "$body"
            grep -q '>Create Sessions<' "$body"
            grep -q 'data-mmd-create-session-pro' "$body"
            grep -q 'data-op-model-select' "$body"
            grep -q '/a/create-session.js?v=owner-v14-vnext2' "$body"
            if grep -q 'Find client. Verify lineage. Create session.' "$body"; then
              echo "Simplified worker-rendered shell is still live" >&2
              exit 1
            fi
            if grep -q 'create-sessions.js' "$body"; then
              echo "Legacy v14 runtime was restored by mistake" >&2
              exit 1
            fi
            rm -f "$headers" "$body"
          done
          echo "Production Create Session owner v14/vNext+2 UI verified on apex and www"
