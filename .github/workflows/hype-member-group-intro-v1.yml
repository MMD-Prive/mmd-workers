name: HYPE Member Group Intro V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hype-member-group-intro-v1.yml"

permissions:
  contents: read

jobs:
  introduce-hype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      STANDARD_GROUP_ID: "-1002073919780"
      PREMIUM_GROUP_ID: "-1001668261779"
      HYPE_BOT_USERNAME: "mmdprivebot"
      MMD_BASE_URL: "https://www.mmdbkk.com"
    steps:
      - name: Send one-time HYPE introduction
        shell: bash
        run: |
          set -euo pipefail

          # This workflow is intentionally one-shot. A GitHub rerun must not
          # duplicate the member-group announcement.
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Skipping duplicate introduction on rerun attempt ${GITHUB_RUN_ATTEMPT}"
            exit 0
          fi

          bot_token="${TELEGRAM_BOT_TOKEN:-}"
          test -n "$bot_token"

          # Fail before any group post unless this is the canonical HYPE bot.
          getme_response="$RUNNER_TEMP/hype-getme.json"
          getme_code="$(curl -sS -o "$getme_response" -w '%{http_code}'             "https://api.telegram.org/bot${bot_token}/getMe")"
          if [ "$getme_code" != "200" ]; then
            node - "$getme_response" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const body = JSON.parse(fs.readFileSync(file, "utf8"));
          console.error(`Telegram getMe failed: ${body.description || "unknown error"}`);
          NODE
            exit 1
          fi
          HYPE_BOT_USERNAME="$HYPE_BOT_USERNAME" node - "$getme_response" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const body = JSON.parse(fs.readFileSync(file, "utf8"));
          const expected = String(process.env.HYPE_BOT_USERNAME || "").replace(/^@/, "").toLowerCase();
          const actual = String(body?.result?.username || "").toLowerCase();
          if (body.ok !== true || !actual || actual !== expected) {
            throw new Error(`wrong Telegram bot: expected @${expected}, got @${actual || "unknown"}`);
          }
          console.log(`HYPE bot verified: @${actual}`);
          NODE

          check_chat() {
            group_id="$1"
            group_label="$2"
            response="$RUNNER_TEMP/hype-getchat-$(printf '%s' "$group_label" | tr '[:upper:]' '[:lower:]').json"
            payload="$RUNNER_TEMP/hype-getchat-payload-$(printf '%s' "$group_label" | tr '[:upper:]' '[:lower:]').json"
            GROUP_ID="$group_id" node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/hype-getchat-payload-" + (process.env.GROUP_ID === "-1002073919780" ? "standard" : "premium") + ".json",
            JSON.stringify({ chat_id: process.env.GROUP_ID }),
          );
          NODE
            code="$(curl -sS -o "$response" -w '%{http_code}'               -X POST "https://api.telegram.org/bot${bot_token}/getChat"               -H 'Content-Type: application/json'               --data-binary "@$payload")"
            if [ "$code" != "200" ]; then
              node - "$response" "$group_label" <<'NODE'
          const fs = require("node:fs");
          const [file, label] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, "utf8"));
          console.error(`${label} getChat failed: ${body.description || "unknown error"}`);
          NODE
              exit 1
            fi
            node - "$response" "$group_label" <<'NODE'
          const fs = require("node:fs");
          const [file, label] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, "utf8"));
          if (body.ok !== true || !body.result?.id) throw new Error(`${label} getChat invalid`);
          console.log(`${label} chat verified: ${body.result.id}`);
          NODE
          }

          check_chat "$STANDARD_GROUP_ID" "STANDARD"
          check_chat "$PREMIUM_GROUP_ID" "PREMIUM"

          send_intro() {
            group_id="$1"
            group_label="$2"

            GROUP_ID="$group_id" GROUP_LABEL="$group_label" node <<'NODE'
          const fs = require("node:fs");
          const groupId = process.env.GROUP_ID;
          const groupLabel = process.env.GROUP_LABEL;
          const bot = process.env.HYPE_BOT_USERNAME;
          const base = process.env.MMD_BASE_URL;

          const text = [
            "👋 <b>สวัสดีครับ ผม HYPE</b>",
            `ผู้ช่วย Telegram ของ MMD Privé ประจำห้อง <b>${groupLabel}</b>`,
            "",
            "ตั้งแต่วันนี้ ถ้าต้องการเช็กทางไป หรือให้ผมช่วยดูว่าต้องทำอะไรต่อ เรียกผมได้เลยครับ",
            "",
            "<b>ใช้ในกลุ่มนี้ได้</b>",
            "<b>/commands</b> — ดูคำสั่งทั้งหมดที่ผมช่วยได้",
            "<b>/points</b> — ไปที่ MY MMD · Points",
            "<b>/coupons</b> — เปิด Coupon Wallet",
            "<b>/careback</b> — ดู 6 YEARS CARE BACK · Phase 2",
            "",
            "<b>เรื่องส่วนตัว</b>",
            "<b>/status</b> — สถานะสมาชิก / งาน / การชำระ",
            "<b>/next</b> — ตอนนี้ต้องทำอะไรต่อ",
            "<b>/booking</b> — progress งานและการจอง",
            "",
            "ถ้าพิมพ์คำสั่งส่วนตัวในกลุ่ม ผมจะไม่เปิดข้อมูลตรงนี้ครับ ผมจะพาไปคุยกันในแชตส่วนตัวแทน 🔒",
            "",
            "ผมอ่านจากระบบ MMD ที่ยืนยันได้เท่านั้น ไม่เดาสถานะ และไม่เปลี่ยนสิทธิ์หรือยืนยันงานแทน MMD/Per ครับ",
            "",
            "เริ่มเรียกผมได้เลยครับ → <b>/commands</b>",
          ].join("\n");

          const payload = {
            chat_id: groupId,
            text,
            parse_mode: "HTML",
            disable_web_page_preview: true,
            disable_notification: false,
            reply_markup: {
              inline_keyboard: [
                [{ text: "คุยกับ HYPE แบบส่วนตัว", url: `https://t.me/${bot}` }],
                [
                  { text: "MY MMD", url: `${base}/my-mmd/` },
                  { text: "Booking", url: `${base}/booking` },
                ],
              ],
            },
          };

          fs.writeFileSync(
            process.env.RUNNER_TEMP + `/hype-intro-${groupLabel.toLowerCase()}.json`,
            JSON.stringify(payload),
          );
          NODE

            payload="$RUNNER_TEMP/hype-intro-$(printf '%s' "$group_label" | tr '[:upper:]' '[:lower:]').json"
            response="$RUNNER_TEMP/hype-intro-response-$(printf '%s' "$group_label" | tr '[:upper:]' '[:lower:]').json"
            code="$(curl -sS -o "$response" -w '%{http_code}'               -X POST "https://api.telegram.org/bot${bot_token}/sendMessage"               -H 'Content-Type: application/json'               --data-binary "@$payload")"

            if [ "$code" != "200" ]; then
              node - "$response" "$group_label" <<'NODE'
          const fs = require("node:fs");
          const [file, label] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, "utf8"));
          console.error(`${label} sendMessage failed: ${body.description || "unknown error"}`);
          NODE
              exit 1
            fi
            node - "$response" "$group_label" <<'NODE'
          const fs = require("node:fs");
          const [file, label] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, "utf8"));
          if (body.ok !== true || !body.result?.message_id) {
            throw new Error(`HYPE introduction failed for ${label}`);
          }
          console.log(`${label} intro sent: message_id=${body.result.message_id}`);
          NODE
          }

          send_intro "$STANDARD_GROUP_ID" "STANDARD"
          send_intro "$PREMIUM_GROUP_ID" "PREMIUM"
