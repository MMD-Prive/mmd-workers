name: Patch payment proof Client LINE gate

on:
  push:
    branches:
      - feat/payment-proof-client-provenance-v1
    paths:
      - scripts/patch-payment-proof-client-line-id-gate.mjs
      - .github/workflows/patch-payment-proof-client-line-id-gate.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-proof-client-provenance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical LINE User ID gate
        run: node scripts/patch-payment-proof-client-line-id-gate.mjs
      - name: Run contracts
        run: |
          set -euo pipefail
          node --check immigrate-worker/netlify/functions/line-payment-slip-intake.mjs
          node --test admin-worker/line-slip-intake-review-queue.contract.test.mjs
          node --test immigrate-worker/netlify/tests/payment-slip-client-link.test.mjs
          node --test admin-worker/payment-proof-client-provenance-wrapper.test.mjs
      - name: Commit source patch
        run: |
          set -euo pipefail
          git diff --check
          git add immigrate-worker/netlify/functions/line-payment-slip-intake.mjs
          git config user.name "mmd-provenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: gate Client lookup to canonical LINE user ids"
          git push origin HEAD:feat/payment-proof-client-provenance-v1
