name: Diagnose admin login secret bindings

on:
  push:
    branches:
      - diag/admin-login-secret-bindings-20260902

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
    steps:
      - name: Inspect secret binding names only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          response="$(mktemp)"
          code="$(curl -sS -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/admin-worker/settings")"
          test "$code" = "200"
          node - "$response" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.success !== true) throw new Error('cloudflare_settings_read_failed');
          const bindings = Array.isArray(payload.result?.bindings) ? payload.result.bindings : [];
          const secretNames = new Set(bindings.filter((b) => b && (b.type === 'secret_text' || b.type === 'secret_key')).map((b) => String(b.name || '')));
          for (const name of ['ADMIN_LOGIN_CREDENTIAL','ADMIN_SESSION_SECRET','ADMIN_BEARER']) {
            console.log(`${name}=${secretNames.has(name) ? 'present' : 'missing'}`);
          }
          NODE
