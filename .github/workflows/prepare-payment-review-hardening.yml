name: Prepare Payment Review Hardening

on:
  push:
    branches:
      - feat/payment-review-facade-v1
    paths:
      - ".github/workflows/prepare-payment-review-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-review-facade-v1
          fetch-depth: 0
      - name: Apply hardening
        run: node scripts/harden-payment-review-before-merge.mjs
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check admin-worker/src/payment-review-runtime.js
          grep -F 'const CANONICAL_PAYMENTS_TABLE_ID = "tblWGGJJOx5eBvBZJ";' admin-worker/src/payment-review-runtime.js
          grep -F 'if (!proofId) return null;' admin-worker/src/payment-review-runtime.js
          grep -F 'manual_audit_required: audit.ok === false' admin-worker/src/payment-review-runtime.js
          if grep -F 'findReviewAudit(env, idempotencyKey)' admin-worker/src/payment-review-runtime.js >/dev/null; then
            ! grep -F 'maxRecords: 2 }).catch(() => [])' admin-worker/src/payment-review-runtime.js
          fi
      - name: Commit runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMD Privé"
          git config user.email "malemodel.bkk@gmail.com"
          git add admin-worker/src/payment-review-runtime.js
          git commit -m "fix(payments): harden Payment Review fail-closed behavior"
          git push origin HEAD:feat/payment-review-facade-v1
