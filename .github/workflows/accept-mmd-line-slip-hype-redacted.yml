name: Accept MMD LINE Slip HYPE Redacted Alert

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/accept-mmd-line-slip-hype-redacted.yml"

permissions:
  contents: read
  issues: write

jobs:
  hype-redacted-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mmd-slip-extractor-staging
    env:
      AUTH_SERVICE_LINE_TO_TELEGRAM: ${{ secrets.AUTH_SERVICE_LINE_TO_TELEGRAM || secrets.TELEGRAM_INTERNAL_TOKEN || secrets.INTERNAL_API_TOKEN }}
      TELEGRAM_BOT_TOKEN_GENERIC: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN_MMS: ${{ secrets.MMS_TELEGRAM_BOT_TOKEN }}
      HYPE_CHAT_ID: "-1003546439681"
      HYPE_THREAD_ID: "21"
    steps:
      - name: Send synthetic redacted HYPE acceptance alert
        id: send
        shell: bash
        run: |
          set -euo pipefail
          text=$'🧪 LINE SLIP STAGING ACCEPTANCE B\nStatus: pending\nSynthetic/redacted only\nNo customer data / no production LINE'
          service_token="$(printf '%s' "${AUTH_SERVICE_LINE_TO_TELEGRAM:-}" | tr -d '\r\n' | xargs)"
          generic_token="$(printf '%s' "${TELEGRAM_BOT_TOKEN_GENERIC:-}" | tr -d '\r\n' | xargs)"
          mms_token="$(printf '%s' "${TELEGRAM_BOT_TOKEN_MMS:-}" | tr -d '\r\n' | xargs)"

          node -e 'const fs=require("node:fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/hype-payload.json",JSON.stringify({chat_id:process.env.HYPE_CHAT_ID,message_thread_id:Number(process.env.HYPE_THREAD_ID),text:"🧪 LINE SLIP STAGING ACCEPTANCE B\nStatus: pending\nSynthetic/redacted only\nNo customer data / no production LINE",disable_notification:true}))'

          if [ -n "$service_token" ]; then
            echo "::add-mask::${service_token}"
            service_payload="$(node -e 'process.stdout.write(JSON.stringify({flow:"payment_proof",chat_id:process.env.HYPE_CHAT_ID,message_thread_id:Number(process.env.HYPE_THREAD_ID),text:process.argv[1]}))' "$text")"
            code="$(curl -sS -o "$RUNNER_TEMP/service.json" -w '%{http_code}' -X POST 'https://telegram-worker.malemodel-bkk.workers.dev/telegram/internal/send' -H "Authorization: Bearer ${service_token}" -H 'Content-Type: application/json' --data-binary "$service_payload" || true)"
            if [ "$code" = 200 ] && node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/service.json","utf8"));process.exit(b.ok===true&&b.telegram?.ok===true?0:1)'; then
              echo "mode=service" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "service credential did not deliver; trying bounded bot candidates"
          fi

          try_bot() {
            label="$1"
            token="$2"
            file="$RUNNER_TEMP/${label}.json"
            if [ -z "$token" ]; then
              echo "${label}: unavailable"
              return 1
            fi
            echo "::add-mask::${token}"
            code="$(curl -sS -o "$file" -w '%{http_code}' -X POST "https://api.telegram.org/bot${token}/sendMessage" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/hype-payload.json" || true)"
            if [ "$code" = 200 ] && node -e 'const fs=require("node:fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.exit(b.ok===true?0:1)' "$file"; then
              echo "${label}: delivered"
              return 0
            fi
            node -e 'const fs=require("node:fs");let b={};try{b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};console.log(`${process.argv[2]}: Telegram ${b.error_code||"HTTP"} ${String(b.description||"delivery_failed").slice(0,160)}`)' "$file" "$label"
            return 1
          }

          if try_bot bot-generic "$generic_token"; then
            echo "mode=bot-generic" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if try_bot bot-mms "$mms_token"; then
            echo "mode=bot-mms" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=none" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Record HYPE acceptance result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ steps.send.outputs.mode }}"
          if [ "${{ steps.send.outcome }}" = success ] && [ -n "$mode" ] && [ "$mode" != none ]; then
            gh issue comment 317 --repo "$GITHUB_REPOSITORY" --body "✅ Staging acceptance B PASS — authenticated/signed redacted HYPE alert delivered via \`${mode}\`. Synthetic/redacted only; no customer data; production LINE and real-LINE traffic untouched."
            exit 0
          fi
          gh issue comment 317 --repo "$GITHUB_REPOSITORY" --body "⛔ Staging acceptance B still blocked — all bounded Telegram credential candidates failed delivery. No auth weakening; production LINE and real-LINE traffic untouched. See run \`${GITHUB_RUN_ID}\` for sanitized Telegram error classification."
          exit 1
