name: Deploy Model Dashboard presentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "model-dashboard-presentation-worker/**"
      - ".github/workflows/deploy-model-dashboard-presentation.yml"
  push:
    branches:
      - main
    paths:
      - "model-dashboard-presentation-worker/**"
      - ".github/workflows/deploy-model-dashboard-presentation.yml"

concurrency:
  group: deploy-model-dashboard-presentation-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate presentation proxy
        working-directory: model-dashboard-presentation-worker
        run: |
          set -euo pipefail
          node --check src/index.js
          node --test index.test.mjs model-webflow-home.test.mjs
          node --test ../webflow/sigil/model/model-webflow-entry-recovery.test.mjs ../webflow/sigil/model/model-console-v3-identity-first.test.mjs

      - name: Validate MY MODEL privacy navigation and controls
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/model-privacy-ui" --no-save --ignore-scripts --package-lock=false jsdom@24.1.3
          NODE_PATH="$RUNNER_TEMP/model-privacy-ui/node_modules" node --test model-dashboard-presentation-worker/model-customer-privacy-ui.test.cjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: model-dashboard-presentation-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare tokens
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          for (const name of ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ROUTES_API_TOKEN"]) {
            const token = (process.env[name] || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
            if (!token) throw new Error(`${name} is missing after normalization`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${token}\n`);
          }
          NODE

      - name: Build no-routes deploy config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("wrangler.toml", "utf8").split(/\r?\n/);
          const output = [];
          let skippingRoute = false;
          for (const line of input) {
            if (/^\s*\[\[routes\]\]\s*$/.test(line)) {
              skippingRoute = true;
              continue;
            }
            if (skippingRoute && /^\s*\[/.test(line)) skippingRoute = false;
            if (!skippingRoute) output.push(line);
          }
          fs.writeFileSync(".wrangler-no-routes.toml", `${output.join("\n")}\n`);
          NODE
          if grep -q '^\s*\[\[routes\]\]' .wrangler-no-routes.toml; then
            echo "No-routes config still contains routes; refusing deploy." >&2
            exit 1
          fi

      - name: Deploy presentation worker script
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --keep-vars --config .wrangler-no-routes.toml \
            2>&1 | tee "$RUNNER_TEMP/model-dashboard-presentation-deploy.log"
          version_id="$(sed -n 's/.*Current Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/model-dashboard-presentation-deploy.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Deploy completed but Current Version ID was not present in Wrangler output." >&2
            cat "$RUNNER_TEMP/model-dashboard-presentation-deploy.log" >&2
            exit 1
          fi
          echo "MODEL_DASHBOARD_PRESENTATION_VERSION_ID=${version_id}" >> "$GITHUB_ENV"
          echo "Deployed model-dashboard-presentation-worker ${version_id} from ${GITHUB_SHA}"

      - name: Sync exact presentation routes
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "model-dashboard-presentation-worker";
          const desired = [
            "mmdbkk.com/sigil/model/dashboard*",
            "www.mmdbkk.com/sigil/model/dashboard*",
            "mmdbkk.com/sigil/model/wish*",
            "mmdbkk.com/sigil/model/login",
            "mmdbkk.com/sigil/confirm/job-model",
            "mmdbkk.com/assets/*",
            "www.mmdbkk.com/assets/*",
            "mmdbkk.com/_build/*",
            "www.mmdbkk.com/_build/*",
            "mmdbkk.com/_serverFn/*",
            "www.mmdbkk.com/_serverFn/*",
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const detail = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare request failed (${response.status}): ${detail}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing route takeover: ${conflicts.map((r) => `${r.pattern} -> ${r.script || "none"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cf(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cf(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Unresolved routes: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length}; created ${missing.length}`);
          NODE

      - name: Smoke canonical presentation and API separation
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS \
              -D "$headers" -o "$body" -w "%{http_code}" \
              "$origin/sigil/model/dashboard?mmd_smoke=1")"
            cat "$headers"
            test "$code" = "200"
            tr -d '\r' < "$headers" | grep -i -q '^x-mmd-ui-source:[[:space:]]*webflow-dashboard-proxy$'
            grep -q 'data-wf-page=' "$body"
            grep -q 'https://static.line-scdn.net/liff/edge/2/sdk.js' "$body"
            grep -q '2010864854-N34SgCqq' "$body"
            if tr -d '\r' < "$headers" | grep -i -q '^location:'; then
              echo "Webflow Dashboard unexpectedly redirected before its embedded LIFF initialized" >&2
              exit 1
            fi

            tg_js="$origin/sigil/model/dashboard-assets/telegram-connect-v1.js"
            tg_css="$origin/sigil/model/dashboard-assets/telegram-connect-v1.css"
            tg_js_body="$(mktemp)"
            tg_js_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$tg_js_body" -w "%{http_code}" "$tg_js")"
            test "$tg_js_code" = "200"
            grep -q '/v1/model/telegram/bind' "$tg_js_body"
            grep -q 'telegram_connected' "$tg_js_body"
            tg_css_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o /dev/null -w "%{http_code}" "$tg_css")"
            test "$tg_css_code" = "200"

            manifest="$origin/sigil/model/dashboard/manifest.webmanifest"
            manifest_body="$(mktemp)"
            manifest_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$manifest_body" -w "%{http_code}" "$manifest")"
            test "$manifest_code" = "200"
          node --input-type=module - "$manifest_body" <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (manifest?.display !== "standalone") throw new Error("MMD APP PWA must remain standalone");
          if (manifest?.start_url !== "/sigil/model/dashboard?launch=pwa") throw new Error("MMD APP PWA start URL changed");
          if (manifest?.scope !== "/sigil/model/dashboard") throw new Error("MMD APP PWA scope changed");
          if (!Array.isArray(manifest?.icons) || manifest.icons.length < 1) throw new Error("MMD APP PWA icon is required");
          NODE

            asset="$(grep -oE '/sigil/model/dashboard-assets/[^"'"'"' ]+\.(js|css)(\?[^"'"'"' ]*)?' "$body" | head -n 1 || true)"
            if [ -n "$asset" ]; then
              asset_headers="$(mktemp)"
              asset_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
                -D "$asset_headers" -o /dev/null -w "%{http_code}" "$origin$asset")"
              cat "$asset_headers"
              test "$asset_code" = "200"
              tr -d '\r' < "$asset_headers" | grep -i -q '^x-mmd-dashboard-addon:[[:space:]]*model-media-upload-v1$'
            fi

            api_body="$(mktemp)"
            api_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$api_body" -w "%{http_code}" \
              "$origin/v1/model/profile")"
            cat "$api_body"
            test "$api_code" = "401"
            grep -q '"error":"model_session_required"' "$api_body"
          done

          assert_wish_body() {
            local body="$1"
            grep -q 'id="mmd-model-wish-v1"' "$body"
            grep -q 'data-mmd-wish-line-return-bridge-v1' "$body"
            grep -q 'year6_direct_wish' "$body"
          }

          smoke_apex_wish() {
            local url="$1"
            local headers body code
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS \
              -D "$headers" -o "$body" -w "%{http_code}" \
              -H 'Cookie: mmd_model_session_v1=production-smoke-placeholder' \
              "$url")"
            cat "$headers"
            test "$code" = "200"
            tr -d '\r' < "$headers" | grep -i -q '^x-mmd-route-owner:[[:space:]]*model-dashboard-presentation-worker$'
            tr -d '\r' < "$headers" | grep -i -q '^x-mmd-ui-source:[[:space:]]*webflow-apex-proxy$'
            tr -d '\r' < "$headers" | grep -i -q '^x-mmd-page:[[:space:]]*model-wish$'
            if tr -d '\r' < "$headers" | grep -i -q '^location:'; then
              echo "Model Wish apex route redirected and would drop the host-only session" >&2
              exit 1
            fi
            if tr -d '\r' < "$headers" | grep -i -q '^set-cookie:.*mmd_model_session_v1'; then
              echo "Model Wish front gate unexpectedly changed the Model session cookie" >&2
              exit 1
            fi
            assert_wish_body "$body"
          }

          smoke_apex_wish 'https://mmdbkk.com/sigil/model/wish?mmd_smoke=1'
          smoke_apex_wish 'https://mmdbkk.com/sigil/model/wish?line_return=1&mmd_smoke=1'

          www_wish_body="$(mktemp)"
          www_wish_code="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS \
            -o "$www_wish_body" -w "%{http_code}" \
            'https://www.mmdbkk.com/sigil/model/wish?mmd_smoke=1')"
          test "$www_wish_code" = "200"
          assert_wish_body "$www_wish_body"

          canonical_headers="$(mktemp)"
          canonical_code="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS \
            -D "$canonical_headers" -o /dev/null -w "%{http_code}" \
            'https://mmdbkk.com/')"
          case "$canonical_code" in
            301|308) ;;
            *)
              echo "Unrelated apex canonicalization changed: HTTP $canonical_code" >&2
              exit 1
              ;;
          esac
          canonical_location="$(tr -d '\r' < "$canonical_headers" | grep -i '^location:' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          test "$canonical_location" = "location: https://www.mmdbkk.com/"

      - name: Deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Model Dashboard home: Webflow document with embedded LIFF · nested app: Worker-rendered"
          echo "Worker: model-dashboard-presentation-worker"
          echo "Version: ${MODEL_DASHBOARD_PRESENTATION_VERSION_ID}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Deployed at: ${deployed_at}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## MMD MODEL Wish — Production Recovery Receipt
          - Source SHA: \`${GITHUB_SHA}\`
          - Worker: \`model-dashboard-presentation-worker\`
          - Deployment/version: \`${MODEL_DASHBOARD_PRESENTATION_VERSION_ID}\`
          - Deployed at: \`${deployed_at}\`
          - Apex \`/sigil/model/wish\`: **PASS — 200, host preserved**
          - Apex \`line_return=1\`: **PASS — 200, host preserved**
          - WWW Wish body: **PASS**
          - Wish root marker: **PASS**
          - LINE return bridge marker: **PASS**
          - direct-Wish runtime marker: **PASS**
          - Unrelated apex canonicalization: **PASS**
          - Model session-cookie rewrite: **NONE**
          - Real Model E2E: **NOT STARTED**
          EOF

      - name: Clean temporary config
        if: always()
        shell: bash
        run: rm -f .wrangler-no-routes.toml
