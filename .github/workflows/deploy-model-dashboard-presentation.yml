name: Deploy Model Dashboard presentation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "model-dashboard-presentation-worker/**"
      - ".github/workflows/deploy-model-dashboard-presentation.yml"
  push:
    branches:
      - main
    paths:
      - "model-dashboard-presentation-worker/**"
      - ".github/workflows/deploy-model-dashboard-presentation.yml"

concurrency:
  group: deploy-model-dashboard-presentation-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate presentation proxy
        working-directory: model-dashboard-presentation-worker
        run: |
          set -euo pipefail
          node --check src/index.js
          node --test index.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: model-dashboard-presentation-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare tokens
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          for (const name of ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ROUTES_API_TOKEN"]) {
            const token = (process.env[name] || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
            if (!token) throw new Error(`${name} is missing after normalization`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${token}\n`);
          }
          NODE

      - name: Build no-routes deploy config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("wrangler.toml", "utf8").split(/\r?\n/);
          const output = [];
          let skippingRoute = false;
          for (const line of input) {
            if (/^\s*\[\[routes\]\]\s*$/.test(line)) {
              skippingRoute = true;
              continue;
            }
            if (skippingRoute && /^\s*\[/.test(line)) skippingRoute = false;
            if (!skippingRoute) output.push(line);
          }
          fs.writeFileSync(".wrangler-no-routes.toml", `${output.join("\n")}\n`);
          NODE
          if grep -q '^\s*\[\[routes\]\]' .wrangler-no-routes.toml; then
            echo "No-routes config still contains routes; refusing deploy." >&2
            exit 1
          fi

      - name: Deploy presentation worker script
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --keep-vars --config .wrangler-no-routes.toml \
            2>&1 | tee "$RUNNER_TEMP/model-dashboard-presentation-deploy.log"
          version_id="$(sed -n 's/.*Current Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/model-dashboard-presentation-deploy.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Deploy completed but Current Version ID was not present in Wrangler output." >&2
            cat "$RUNNER_TEMP/model-dashboard-presentation-deploy.log" >&2
            exit 1
          fi
          echo "MODEL_DASHBOARD_PRESENTATION_VERSION_ID=${version_id}" >> "$GITHUB_ENV"
          echo "Deployed model-dashboard-presentation-worker ${version_id} from ${GITHUB_SHA}"

      - name: Sync exact presentation routes
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "model-dashboard-presentation-worker";
          const desired = [
            "mmdbkk.com/sigil/model/dashboard*",
            "www.mmdbkk.com/sigil/model/dashboard*",
            "mmdbkk.com/assets/*",
            "www.mmdbkk.com/assets/*",
            "mmdbkk.com/_build/*",
            "www.mmdbkk.com/_build/*",
            "mmdbkk.com/_serverFn/*",
            "www.mmdbkk.com/_serverFn/*",
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const detail = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare request failed (${response.status}): ${detail}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing route takeover: ${conflicts.map((r) => `${r.pattern} -> ${r.script || "none"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cf(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cf(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Unresolved routes: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length}; created ${missing.length}`);
          NODE

      - name: Smoke canonical presentation and API separation
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --retry 8 --retry-delay 2 --retry-all-errors -sS \
              -D "$headers" -o "$body" -w "%{http_code}" \
              "$origin/sigil/model/dashboard?liff_env=published&mmd_smoke=1")"
            cat "$headers"
            test "$code" = "200"
            tr -d '\r' < "$headers" | grep -i -q '^x-mmd-route-owner:[[:space:]]*model-dashboard-presentation-worker$'
            tr -d '\r' < "$headers" | grep -i -q '^x-mmd-ui-source:[[:space:]]*lovable-presentation-proxy$'
            grep -q 'lovable-model-dashboard' "$body"
            if grep -q 'mmd-model-home-v3' "$body"; then
              echo "Webflow fallback still owns ${origin}/sigil/model/dashboard" >&2
              exit 1
            fi

            asset="$(grep -oE '/sigil/model/dashboard-assets/[^\"'"'"' ]+\.(js|css)(\?[^\"'"'"' ]*)?' "$body" | head -n 1 || true)"
            if [ -n "$asset" ]; then
              asset_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o /dev/null -w "%{http_code}" "$origin$asset")"
              test "$asset_code" = "200"

              root_asset="/${asset#/sigil/model/dashboard-assets/}"
              root_headers="$(mktemp)"
              root_asset_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
                -D "$root_headers" -o /dev/null -w "%{http_code}" "$origin$root_asset")"
              cat "$root_headers"
              test "$root_asset_code" = "200"
              tr -d '\r' < "$root_headers" | grep -i -q '^x-mmd-route-owner:[[:space:]]*model-dashboard-presentation-worker$'
              if tr -d '\r' < "$root_headers" | grep -i -q '^location:'; then
                echo "Root runtime alias redirected instead of staying same-origin: $origin$root_asset" >&2
                exit 1
              fi
            fi

            api_body="$(mktemp)"
            api_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$api_body" -w "%{http_code}" \
              "$origin/v1/model/profile")"
            cat "$api_body"
            test "$api_code" = "401"
            grep -q '"error":"model_session_required"' "$api_body"
          done

      - name: Deployment receipt
        shell: bash
        run: |
          echo "Model Dashboard presentation source: Lovable"
          echo "Worker: model-dashboard-presentation-worker"
          echo "Version: ${MODEL_DASHBOARD_PRESENTATION_VERSION_ID}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Clean temporary config
        if: always()
        shell: bash
        run: rm -f .wrangler-no-routes.toml
