name: Temporary CARE BACK auth-path staging

on:
  push:
    branches:
      - hotfix/auth-profile-airtable-deadline-v7-2
    paths:
      - ".github/workflows/temp-care-back-auth-staging.yml"

concurrency:
  group: care-back-auth-path-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: care-back-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      CARE_BACK_STAGING_KV_NAMESPACE_ID: ${{ secrets.CARE_BACK_STAGING_KV_NAMESPACE_ID }}
      CARE_BACK_STAGING_AIRTABLE_API_KEY: ${{ secrets.CARE_BACK_STAGING_AIRTABLE_API_KEY }}
      CARE_BACK_STAGING_LIFF_SESSION_SECRET: ${{ secrets.CARE_BACK_STAGING_LIFF_SESSION_SECRET }}
      CARE_BACK_STAGING_CODE_SECRET: ${{ secrets.CARE_BACK_STAGING_CODE_SECRET }}
      CARE_BACK_STAGING_RESOLVER_SECRET: ${{ secrets.CARE_BACK_STAGING_RESOLVER_SECRET }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate auth-path hotfix
        run: |
          npm run check:care-back-staging
          npm run test:care-back-staging-fixtures
          node --test auth-staging-airtable-fixtures-worker/test/*.test.mjs
          npm run test:auth-liff-profile
          npm run test:member-pages-liff
          npm run test:member-dashboard-liff
          npx --yes wrangler@4 deploy --dry-run --env staging --config care-back-staging-fixtures-worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --env staging --config auth-staging-airtable-fixtures-worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --env staging --config auth-worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --env staging --config member-pages-worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --env staging --config member-dashboard-chat-worker/wrangler.toml
      - name: Prepare isolated staging secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const required = [
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "CARE_BACK_STAGING_KV_NAMESPACE_ID",
            "CARE_BACK_STAGING_AIRTABLE_API_KEY",
            "CARE_BACK_STAGING_LIFF_SESSION_SECRET",
            "CARE_BACK_STAGING_CODE_SECRET",
            "CARE_BACK_STAGING_RESOLVER_SECRET",
          ];
          const values = Object.fromEntries(required.map((key) => [key, String(process.env[key] || "").replace(/[\r\n\u2028\u2029]/g, "").trim()]));
          for (const key of required) {
            if (!values[key]) throw new Error(`${key} is required`);
            console.log(`::add-mask::${values[key]}`);
          }
          if (!/^[a-f0-9]{32}$/i.test(values.CARE_BACK_STAGING_KV_NAMESPACE_ID)) throw new Error("CARE_BACK_STAGING_KV_NAMESPACE_ID is invalid");
          for (const key of ["CARE_BACK_STAGING_LIFF_SESSION_SECRET", "CARE_BACK_STAGING_CODE_SECRET", "CARE_BACK_STAGING_RESOLVER_SECRET"]) {
            if (!/^[A-Za-z0-9_-]{32,}$/.test(values[key])) throw new Error(`${key} must be a base64url-safe value of at least 32 characters`);
          }
          const config = "member-pages-worker/wrangler.toml";
          fs.writeFileSync(config, fs.readFileSync(config, "utf8").replace("00000000000000000000000000000000", values.CARE_BACK_STAGING_KV_NAMESPACE_ID));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/fixture.env`, `MEMBER_STATUS_RESOLVER_SECRET=${values.CARE_BACK_STAGING_RESOLVER_SECRET}\n`, { mode: 0o600 });
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/auth.env`, `MEMBER_STATUS_RESOLVER_SECRET=${values.CARE_BACK_STAGING_RESOLVER_SECRET}\n`, { mode: 0o600 });
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/member.env`, [
            `AIRTABLE_API_KEY=${values.CARE_BACK_STAGING_AIRTABLE_API_KEY}`,
            `LIFF_SESSION_SECRET=${values.CARE_BACK_STAGING_LIFF_SESSION_SECRET}`,
            `CARE_BACK_CODE_SECRET=${values.CARE_BACK_STAGING_CODE_SECRET}`,
            `MEMBER_STATUS_RESOLVER_SECRET=${values.CARE_BACK_STAGING_RESOLVER_SECRET}`,
          ].join("\n") + "\n", { mode: 0o600 });
          NODE
      - name: Deploy synthetic LINE fixtures
        run: npx --yes wrangler@4 deploy --env staging --config care-back-staging-fixtures-worker/wrangler.toml --keep-vars --secrets-file "$RUNNER_TEMP/fixture.env"
      - name: Deploy synthetic Airtable fixtures
        run: npx --yes wrangler@4 deploy --env staging --config auth-staging-airtable-fixtures-worker/wrangler.toml --keep-vars
      - name: Deploy auth resolver staging
        run: npx --yes wrangler@4 deploy --env staging --config auth-worker/wrangler.toml --keep-vars --secrets-file "$RUNNER_TEMP/auth.env"
      - name: Deploy member-pages staging
        run: npx --yes wrangler@4 deploy --env staging --config member-pages-worker/wrangler.toml --keep-vars --secrets-file "$RUNNER_TEMP/member.env"
      - name: Deploy workers.dev front gate
        id: front_gate
        shell: bash
        run: |
          npx --yes wrangler@4 deploy --env staging --config member-dashboard-chat-worker/wrangler.toml --keep-vars 2>&1 | tee "$RUNNER_TEMP/front-gate-deploy.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/front-gate-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke current, returning, and new member states through auth resolver
        run: node scripts/smoke-care-back-staging.mjs "${{ steps.front_gate.outputs.url }}"
      - name: Record staging receipt
        run: echo "CARE BACK auth-path staging passed at ${{ steps.front_gate.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
