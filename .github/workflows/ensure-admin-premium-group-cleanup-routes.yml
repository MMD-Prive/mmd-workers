name: Ensure admin-worker premium-group-cleanup routes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ensure-admin-premium-group-cleanup-routes.yml"

concurrency:
  group: ensure-admin-premium-group-cleanup-routes-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ensure-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
    steps:
      - name: Ensure premium-group-cleanup owner routes (create only, never replace)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = String(process.env.CLOUDFLARE_ZONE_ID || '').trim();
          const token = String(process.env.CLOUDFLARE_ROUTES_API_TOKEN || '').replace(/[  \r\n]/g, '').trim();
          if (!zoneId || !token) throw new Error('Cloudflare route credentials are unavailable');
          const worker = 'admin-worker';
          const desired = [
            'mmdbkk.com/internal/admin/premium-group-cleanup/*',
            'www.mmdbkk.com/internal/admin/premium-group-cleanup/*',
          ];
          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers || {}) },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || []).map((e) => `${e.code || 'unknown'}: ${e.message || 'unknown error'}`).join('; ');
              throw new Error(`Cloudflare ${options.method || 'GET'} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }
          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) => existing.filter((route) => route.pattern === pattern && route.script !== worker));
          if (conflicts.length) throw new Error(`Refusing to replace existing routes: ${conflicts.map((r) => `${r.pattern} -> ${r.script || 'no script'}`).join(', ')}`);
          for (const pattern of desired) {
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) {
              console.log(`Already present ${pattern} -> ${worker}`);
              continue;
            }
            await cloudflare(routePath, { method: 'POST', body: JSON.stringify({ pattern, script: worker }) });
            console.log(`Created ${pattern} -> ${worker}`);
          }
          const verified = await cloudflare(routePath);
          const unresolved = desired.filter((pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker));
          if (unresolved.length) throw new Error(`Route verification failed: ${unresolved.join(', ')}`);
          console.log(`Verified ${desired.length}/${desired.length} premium-group-cleanup routes`);
          NODE

      - name: Smoke (unauthenticated must reach admin-worker, not Webflow 404)
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://mmdbkk.com/internal/admin/premium-group-cleanup/status" \
            "https://www.mmdbkk.com/internal/admin/premium-group-cleanup/status"
          do
            body="$(mktemp)"
            code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "$body" -w '%{http_code}' "$url")"
            echo "$url -> HTTP $code"
            if [ "$code" != "401" ] && [ "$code" != "403" ]; then
              echo "Expected 401/403 from admin-worker owner guard: $url" >&2
              exit 1
            fi
          done
