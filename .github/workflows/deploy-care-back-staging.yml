name: Deploy CARE BACK full staging

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy isolated workers.dev staging after validation
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-care-back-staging.yml"

concurrency:
  group: care-back-full-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:care-back-staging
      - run: npm run test:care-back-staging-fixtures
      - run: npm run test:member-pages-liff
      - run: npm run test:care-back-wish-frontend
      - run: npm run test:member-dashboard-liff
      - run: npx --yes wrangler@4 deploy --dry-run --env staging --config care-back-staging-fixtures-worker/wrangler.toml
      - run: npx --yes wrangler@4 deploy --dry-run --env staging --config member-pages-worker/wrangler.toml
      - run: npx --yes wrangler@4 deploy --dry-run --env staging --config member-dashboard-chat-worker/wrangler.toml

  deploy:
    if: github.event_name == 'push' || inputs.deploy == true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: care-back-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CARE_BACK_STAGING_KV_NAMESPACE_ID: ${{ secrets.CARE_BACK_STAGING_KV_NAMESPACE_ID }}
      CARE_BACK_STAGING_AIRTABLE_API_KEY: ${{ secrets.CARE_BACK_STAGING_AIRTABLE_API_KEY }}
      CARE_BACK_STAGING_LIFF_SESSION_SECRET: ${{ secrets.CARE_BACK_STAGING_LIFF_SESSION_SECRET }}
      CARE_BACK_STAGING_CODE_SECRET: ${{ secrets.CARE_BACK_STAGING_CODE_SECRET }}
      CARE_BACK_STAGING_RESOLVER_SECRET: ${{ secrets.CARE_BACK_STAGING_RESOLVER_SECRET }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate and prepare isolated staging secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const required = [
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "CARE_BACK_STAGING_KV_NAMESPACE_ID",
            "CARE_BACK_STAGING_AIRTABLE_API_KEY",
            "CARE_BACK_STAGING_LIFF_SESSION_SECRET",
            "CARE_BACK_STAGING_CODE_SECRET",
            "CARE_BACK_STAGING_RESOLVER_SECRET",
          ];
          const values = Object.fromEntries(required.map((key) => [key, String(process.env[key] || "").replace(/[\r\n\u2028\u2029]/g, "").trim()]));
          for (const key of required) {
            if (!values[key]) throw new Error(`${key} is required`);
            console.log(`::add-mask::${values[key]}`);
          }
          if (!/^[a-f0-9]{32}$/i.test(values.CARE_BACK_STAGING_KV_NAMESPACE_ID)) throw new Error("CARE_BACK_STAGING_KV_NAMESPACE_ID is invalid");
          for (const key of ["CARE_BACK_STAGING_LIFF_SESSION_SECRET", "CARE_BACK_STAGING_CODE_SECRET", "CARE_BACK_STAGING_RESOLVER_SECRET"]) {
            if (!/^[A-Za-z0-9_-]{32,}$/.test(values[key])) throw new Error(`${key} must be a base64url-safe value of at least 32 characters`);
          }
          if (!/^[A-Za-z0-9._-]+$/.test(values.CARE_BACK_STAGING_AIRTABLE_API_KEY)) throw new Error("CARE_BACK_STAGING_AIRTABLE_API_KEY contains unsupported dotenv characters");
          const config = "member-pages-worker/wrangler.toml";
          fs.writeFileSync(config, fs.readFileSync(config, "utf8").replace("00000000000000000000000000000000", values.CARE_BACK_STAGING_KV_NAMESPACE_ID));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/fixture.env`, `MEMBER_STATUS_RESOLVER_SECRET=${values.CARE_BACK_STAGING_RESOLVER_SECRET}\n`, { mode: 0o600 });
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/member.env`, [
            `AIRTABLE_API_KEY=${values.CARE_BACK_STAGING_AIRTABLE_API_KEY}`,
            `LIFF_SESSION_SECRET=${values.CARE_BACK_STAGING_LIFF_SESSION_SECRET}`,
            `CARE_BACK_CODE_SECRET=${values.CARE_BACK_STAGING_CODE_SECRET}`,
            `MEMBER_STATUS_RESOLVER_SECRET=${values.CARE_BACK_STAGING_RESOLVER_SECRET}`,
          ].join("\n") + "\n", { mode: 0o600 });
          NODE
      - name: Deploy service-only synthetic fixtures
        run: npx --yes wrangler@4 deploy --env staging --config care-back-staging-fixtures-worker/wrangler.toml --keep-vars --secrets-file "$RUNNER_TEMP/fixture.env"
      - name: Deploy service-bound CARE BACK implementation
        run: npx --yes wrangler@4 deploy --env staging --config member-pages-worker/wrangler.toml --keep-vars --secrets-file "$RUNNER_TEMP/member.env"
      - name: Deploy workers.dev front gate
        id: front_gate
        shell: bash
        run: |
          npx --yes wrangler@4 deploy --env staging --config member-dashboard-chat-worker/wrangler.toml --keep-vars 2>&1 | tee "$RUNNER_TEMP/front-gate-deploy.log"
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RUNNER_TEMP/front-gate-deploy.log" | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke public Wish split
        env:
          BASE_URL: ${{ steps.front_gate.outputs.url }}
        run: |
          node <<'NODE'
          import assert from "node:assert/strict";
          const base = process.env.BASE_URL;
          const requestId = `wish-v7-staging-${Date.now()}`;
          async function post(body) {
            const response = await fetch(`${base}/member/api/care-back/public-wish`, {
              method: "POST",
              headers: { origin: base, "content-type": "application/json", accept: "application/json" },
              body: JSON.stringify(body),
            });
            return { response, payload: await response.json() };
          }
          const first = await post({ wish_text: "V7 staging smoke wish", request_id: requestId, language: "en" });
          assert.equal(first.response.status, 200, JSON.stringify(first.payload));
          assert.equal(first.payload.ok, true);
          assert.equal(first.payload.state, "completed");
          assert.equal(first.payload.benefits.verification_required, true);
          assert.equal(first.payload.benefits.coupon, false);
          assert.equal(first.payload.benefits.membership_extension, false);
          assert.equal(first.payload.benefits.points, false);
          assert.equal(first.payload.grants.membership, false);
          assert.equal(first.payload.grants.points, false);
          assert.match(first.payload.wish_link_token, /^pw_[A-Za-z0-9_-]+$/);
          const replay = await post({ wish_text: "V7 staging smoke wish", request_id: requestId, language: "en" });
          assert.equal(replay.response.status, 200, JSON.stringify(replay.payload));
          assert.equal(replay.payload.wish_link_token, first.payload.wish_link_token);
          const forged = await post({ wish_text: "forged identity smoke", request_id: `${requestId}-forged`, member_id: "mem_fake" });
          assert.equal(forged.response.status, 400, JSON.stringify(forged.payload));
          assert.equal(forged.payload.error.code, "BROWSER_IDENTITY_REJECTED");
          console.log("PUBLIC_WISH_STAGING_SMOKE_PASS", JSON.stringify({ base, anonymous: true, idempotent: true, forged_identity_rejected: true }));
          NODE
      - name: Record staging URL
        run: echo "CARE BACK public Wish staging passed at ${{ steps.front_gate.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
