name: Kenji Model Admin Media Preview One Shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kenji-model-admin-media-preview-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin-only model media preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          adapter_path = Path('admin-worker/src/kenji-model-admin-adapter.js')
          adapter = adapter_path.read_text()

          old = '''export function projectKenjiAdminModelRecord(record = {}) {
            const fields = record.fields || {};
            return {
              model_id: clean(record.id, 80),
          '''
          new = '''export function projectKenjiAdminModelRecord(record = {}) {
            const fields = record.fields || {};
            const modelId = clean(record.id, 80);
            const hasAdminPreview = Boolean(clean(firstField(fields, ["primary_image_key"]), 500));
            return {
              model_id: modelId,
          '''
          if old not in adapter:
              raise SystemExit('project model marker not found')
          adapter = adapter.replace(old, new, 1)

          old = '''    folder_name: clean(firstField(fields, ["folder_name", "access_folder", "model_folder"]), 120),
              requires_per_approval: booleanValue(firstField(fields, ["requires_per_approval"])),
          '''
          new = '''    folder_name: clean(firstField(fields, ["folder_name", "access_folder", "model_folder"]), 120),
              has_admin_preview: hasAdminPreview,
              admin_preview_url: hasAdminPreview && modelId
                ? `${KENJI_MODEL_ADMIN_BASE_PATH}?preview_model_id=${encodeURIComponent(modelId)}`
                : "",
              requires_per_approval: booleanValue(firstField(fields, ["requires_per_approval"])),
          '''
          if old not in adapter:
              raise SystemExit('preview projection marker not found')
          adapter = adapter.replace(old, new, 1)

          old = '''    access_folder: profile?.folder_name || identity.folder_name || "",
              allowed_customer_scope: profile?.allowed_customer_scope || [],
          '''
          new = '''    access_folder: profile?.folder_name || identity.folder_name || "",
              has_admin_preview: Boolean(identity.has_admin_preview),
              admin_preview_url: identity.admin_preview_url || "",
              allowed_customer_scope: profile?.allowed_customer_scope || [],
          '''
          if old not in adapter:
              raise SystemExit('merge preview marker not found')
          adapter = adapter.replace(old, new, 1)

          marker = 'async function listModels(request, env, fetchImpl) {'
          preview_impl = '''function primaryImageContentType(key, object) {
            const metadataType = clean(object?.httpMetadata?.contentType, 100).toLowerCase();
            if (/^image\\/(?:jpeg|png|webp|gif|avif)$/.test(metadataType)) return metadataType;
            const lower = clean(key, 500).toLowerCase();
            if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "image/jpeg";
            if (lower.endsWith(".png")) return "image/png";
            if (lower.endsWith(".webp")) return "image/webp";
            if (lower.endsWith(".gif")) return "image/gif";
            if (lower.endsWith(".avif")) return "image/avif";
            return "";
          }

          async function streamAdminPrimaryMedia(request, env, fetchImpl) {
            const url = new URL(request.url);
            const modelId = clean(url.searchParams.get("preview_model_id"), 80);
            if (!/^rec[A-Za-z0-9]{14,}$/.test(modelId)) {
              return json({ ok: false, error: "invalid_preview_model_id" }, 400);
            }
            if (!env.MMD_MODEL_ASSETS || typeof env.MMD_MODEL_ASSETS.get !== "function") {
              return json({ ok: false, error: "model_asset_store_unavailable" }, 503);
            }

            const config = airtableConfig(env);
            const modelsResult = await fetchAllRecords(env, config.modelsTable, fetchImpl);
            if (!modelsResult.ok) {
              return json({ ok: false, error: "model_source_unavailable" }, 503);
            }
            const record = modelsResult.records.find((item) => clean(item?.id, 80) === modelId);
            if (!record) return json({ ok: false, error: "model_not_found" }, 404);

            const key = clean(firstField(record.fields || {}, ["primary_image_key"]), 500);
            if (!key) return json({ ok: false, error: "primary_media_not_configured" }, 404);

            let object;
            try {
              object = await env.MMD_MODEL_ASSETS.get(key);
            } catch (_) {
              return json({ ok: false, error: "model_asset_store_unavailable" }, 503);
            }
            if (!object) return json({ ok: false, error: "primary_media_not_found" }, 404);

            const contentType = primaryImageContentType(key, object);
            if (!contentType) return json({ ok: false, error: "primary_media_type_not_allowed" }, 415);

            return new Response(object.body, {
              status: 200,
              headers: {
                "Cache-Control": "no-store, private",
                "Content-Type": contentType,
                "Content-Disposition": "inline",
                "X-Content-Type-Options": "nosniff",
                "X-MMD-Media-Scope": "admin-only",
              },
            });
          }

          '''
          if marker not in adapter:
              raise SystemExit('listModels marker not found')
          adapter = adapter.replace(marker, preview_impl + marker, 1)

          old = '''async function listModels(request, env, fetchImpl) {
            const url = new URL(request.url);
            const q = clean(url.searchParams.get("q"), 120).toLowerCase();
          '''
          new = '''async function listModels(request, env, fetchImpl) {
            const url = new URL(request.url);
            if (url.searchParams.get("preview_model_id")) {
              return streamAdminPrimaryMedia(request, env, fetchImpl);
            }
            const q = clean(url.searchParams.get("q"), 120).toLowerCase();
          '''
          if old not in adapter:
              raise SystemExit('listModels preview dispatch marker not found')
          adapter = adapter.replace(old, new, 1)
          adapter_path.write_text(adapter)

          ui_path = Path('webflow/internal/admin/kenji/kenji-admin-v1.js')
          ui = ui_path.read_text()
          safety = '''      +'<div class="ka__notice"><b>Safety lock</b><br>หน้านี้ไม่รับราคา, availability/คิว, เบอร์ติดต่อ, LINE/Telegram, private asset หรือ R2 key. Access visibility และ Public Kenji เป็น proposal สำหรับ Review และยังไม่เปลี่ยน Production Profile.</div>'
          '''
          preview = '''      +(model.admin_preview_url?'<div class="ka__notice"><b>Admin Media Preview</b><div style="margin:12px 0;max-width:360px;overflow:hidden;border-radius:18px;background:#111"><img src="'+attr(model.admin_preview_url)+'" alt="'+attr((model.working_name||model.model_key||"Model")+" admin media preview")+'" loading="lazy" style="display:block;width:100%;height:auto;max-height:520px;object-fit:cover"></div><small>Admin-only · primary R2 asset · customer/public exposure remains blocked until media review is approved.</small></div>':'')
          '''
          if safety not in ui:
              raise SystemExit('UI safety marker not found')
          ui = ui.replace(safety, preview + safety, 1)
          ui_path.write_text(ui)

          test_path = Path('admin-worker/kenji-model-admin-adapter.test.mjs')
          tests = test_path.read_text()
          if 'admin primary media preview streams only the server-resolved R2 object' not in tests:
              tests += r'''

test("admin primary media preview streams only the server-resolved R2 object", async () => {
  const expectedKey = "private/Premium Package/Premium - VIP Models/Straight/Top/Mek/messageImage_1739652377408.jpg";
  const fetchImpl = async (url) => {
    if (!decodeURIComponent(url).includes("tblModelsCanonical")) {
      throw new Error(`unexpected table call: ${url}`);
    }
    return response({
      records: [{
        id: "rec12345678901234",
        fields: {
          unique_key: "mek",
          working_name: "Mek",
          primary_image_key: expectedKey,
        },
      }],
    });
  };
  const env = {
    ...ENV,
    MMD_MODEL_ASSETS: {
      async get(key) {
        assert.equal(key, expectedKey);
        return {
          body: new Uint8Array([0xff, 0xd8, 0xff]),
          httpMetadata: { contentType: "image/jpeg" },
        };
      },
    },
  };

  const result = await handleKenjiModelAdminRequest(
    new Request("https://mmdbkk.com/v1/admin/kenji/models?preview_model_id=rec12345678901234"),
    env,
    { fetchImpl }
  );

  assert.equal(result.status, 200);
  assert.equal(result.headers.get("Content-Type"), "image/jpeg");
  assert.equal(result.headers.get("Cache-Control"), "no-store, private");
  assert.equal(result.headers.get("X-MMD-Media-Scope"), "admin-only");
  assert.deepEqual([...new Uint8Array(await result.arrayBuffer())], [0xff, 0xd8, 0xff]);
});
'''
              test_path.write_text(tests)
          PY

      - name: Validate syntax and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/kenji-model-admin-adapter.js
          node --check webflow/internal/admin/kenji/kenji-admin-v1.js
          node --test admin-worker/kenji-model-admin-adapter.test.mjs

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mmdprive-bot"
          git config user.email "malemodel.bkk@gmail.com"
          git rm .github/workflows/kenji-model-admin-media-preview-once.yml
          git add admin-worker/src/kenji-model-admin-adapter.js admin-worker/kenji-model-admin-adapter.test.mjs webflow/internal/admin/kenji/kenji-admin-v1.js
          git commit -m "feat: add admin-only Kenji model media preview"
          git push origin HEAD:main
