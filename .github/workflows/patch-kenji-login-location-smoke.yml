name: Patch Kenji login location smoke

on:
  push:
    branches:
      - hotfix/kenji-admin-login-location-smoke-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/kenji-admin-login-location-smoke-20260906
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align smoke with absolute same-origin login Location
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/workflows/deploy-admin-worker.yml';
          const source = fs.readFileSync(file, 'utf8');
          const oldLine = "            grep -qi '^location: /internal/admin/login?next=%2Finternal%2Fadmin%2Fkenji' \"$shell_headers\"";
          const newLine = "            grep -Fqi \"location: ${origin}/internal/admin/login?next=%2Finternal%2Fadmin%2Fkenji\" \"$shell_headers\"";
          if (!source.includes(oldLine)) throw new Error('Kenji protected-shell Location smoke marker not found');
          const next = source.replace(oldLine, newLine);
          fs.writeFileSync(file, next);
          NODE
          grep -Fq 'location: ${origin}/internal/admin/login?next=%2Finternal%2Fadmin%2Fkenji' .github/workflows/deploy-admin-worker.yml

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-kenji-login-location-smoke.yml
          git config user.name 'MMD GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/deploy-admin-worker.yml .github/workflows/patch-kenji-login-location-smoke.yml
          git commit -m 'fix(kenji): verify absolute admin login redirect'
          git push origin HEAD:hotfix/kenji-admin-login-location-smoke-20260906
