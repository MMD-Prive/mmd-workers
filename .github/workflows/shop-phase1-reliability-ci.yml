name: Shop Phase 1 reliability CI
on:
  pull_request:
    paths:
      - "himai-chat-worker/**"
      - "payments-worker/shop-phase1-brand.test.mjs"
      - "telegram-worker/src/index.js"
      - "ops/shop-phase1/**"
      - "payments-worker/shop-payment-v1.js"
      - "payments-worker/unified-payment-proof.js"
      - "shared/shop-*.mjs"
      - "webflow/himai-shop/**"
      - "webflow/mmd-shop/**"
      - "webflow/shared/shop-*"
      - ".github/workflows/shop-phase1-reliability-ci.yml"
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Phase 1 and existing authority contracts
        run: |
          node ops/shop-phase1/build-presentation.mjs --check
          node --experimental-default-type=module --test himai-chat-worker/test/*.test.mjs shared/shop-brand.test.mjs webflow/shared/shop-reliability.test.mjs payments-worker/shop-phase1-brand.test.mjs payments-worker/unified-payment-proof.test.mjs payments-worker/shop-refund-v1.test.mjs payments-worker/payment-instructions-v1.test.mjs shared/mmd-shop-fulfillment-aftercare.test.mjs shared/mmd-shop-stock-reconciliation.test.mjs
          node --check telegram-worker/src/index.js
      - name: Export exact reviewed source snapshot
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/shop-phase1-source-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/shop-phase1-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-phase1-reviewed-source
          retention-days: 1
          path: |
            ${{ runner.temp }}/shop-phase1-source.tar.gz
            ${{ runner.temp }}/shop-phase1-source-sha.txt
