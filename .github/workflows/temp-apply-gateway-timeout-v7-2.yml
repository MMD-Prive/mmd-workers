name: Temporary apply gateway timeout v7.2

on:
  push:
    branches:
      - hotfix/auth-profile-airtable-deadline-v7-2
    paths:
      - ".github/workflows/temp-apply-gateway-timeout-v7-2.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/auth-profile-airtable-deadline-v7-2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply bounded gateway timeout patch
        run: node scripts/temp-gateway-timeout-v7-2.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression
        run: |
          npm run test:member-pages-liff
          npm run test:auth-liff-profile
          npm run check:care-back-staging
          npx --yes wrangler@4 deploy --dry-run --config member-pages-worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --env staging --config member-pages-worker/wrangler.toml
      - name: Commit tested gateway hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/temp-gateway-timeout-v7-2.mjs
          git add member-pages-worker
          git commit -m "fix(liff): extend bounded gateway Airtable deadline"
          git push origin HEAD:hotfix/auth-profile-airtable-deadline-v7-2
