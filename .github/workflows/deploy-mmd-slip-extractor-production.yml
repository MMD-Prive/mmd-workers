name: Release Slip OCR Amount Retry to Existing Production

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the reviewed OCR release to the existing private extractor
        required: true
        type: boolean
        default: false
      confirm_release_sha:
        description: Enter the full reviewed source SHA to authorize this release
        required: true
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-mmd-slip-extractor-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy == true &&
      inputs.confirm_release_sha == '0a6efde5dd6c5c8b8986889b3c688211390caf9b'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.MMD_SLIP_EXTRACTOR_PRODUCTION_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      WRANGLER_SEND_METRICS: "false"
      NO_COLOR: "1"
      EXTRACTOR_RELEASE_SHA: 0a6efde5dd6c5c8b8986889b3c688211390caf9b
      EXTRACTOR_REVIEW_BASE_SHA: 49dc5b72eb5598220fb9482f47de074af31d5d53
      EXTRACTOR_EXPECTED_PREVIOUS_IMAGE: registry.cloudflare.com/b176eda1172b741fd2e58904cc9d77c5/mmd-slip-extractor-slipextractorcontainer@sha256:c1e61a077332d8dbc024a5c2255cb07fe32cdc2fc56ce31bd46650f2a0d4b701
      EXTRACTOR_EXPECTED_PREVIOUS_VERSION: 3ca124b2-4979-4138-947b-8115018c2d12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a6efde5dd6c5c8b8986889b3c688211390caf9b
          fetch-depth: 0
      - name: Validate exact reviewed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXTRACTOR_RELEASE_SHA"
          git diff --name-only "$EXTRACTOR_REVIEW_BASE_SHA" "$EXTRACTOR_RELEASE_SHA" -- services/mmd-slip-extractor > "$RUNNER_TEMP/extractor-files.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          expected=set(["services/mmd-slip-extractor/lib/extractor.mjs","services/mmd-slip-extractor/test/extractor.test.mjs"])
          actual=set(Path(os.environ['RUNNER_TEMP'],'extractor-files.txt').read_text().splitlines())
          assert actual==expected, 'Unexpected extractor source changes; only the two reviewed OCR files are allowed'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/mmd-slip-extractor/package-lock.json
            services/mmd-slip-extractor/cloudflare/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm ci --prefix services/mmd-slip-extractor
          npm ci --prefix services/mmd-slip-extractor/cloudflare
      - name: Test extraction and private adapter
        run: |
          node --test services/mmd-slip-extractor/test/*.test.mjs services/mmd-slip-extractor/cloudflare/test/*.test.mjs
          node --check services/mmd-slip-extractor/cloudflare/worker-core.mjs
          node --check services/mmd-slip-extractor/cloudflare/worker.mjs
          node --check services/mmd-slip-extractor/cloudflare/container-server.mjs
      - name: Verify existing private production resources before upload
        id: preflight
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/extractor-boundary.mjs" <<'JS'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').replace(/[\u2028\u2029\r\n]/g,'').trim();
          if(!token||!/^[a-f0-9]{32}$/.test(account||''))throw Error('Deploy credential unavailable');
          const worker='mmd-slip-extractor';
          export async function read(path){
            const allowed=[`/workers/scripts/${worker}/settings`,`/workers/scripts/${worker}/subdomain`,`/workers/scripts/${worker}/deployments`,'/containers/applications?name=mmd-slip-extractor-slipextractorcontainer'];
            if(!allowed.includes(path))throw Error('Read path denied');
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{headers:{authorization:`Bearer ${token}`},signal:AbortSignal.timeout(30000)});
            const d=await r.json();if(!r.ok||d.success!==true)throw Error(`Production preflight read failed: ${r.status}`);return d.result;
          }
          export const canonical=x=>JSON.stringify(sort(x));
          function sort(x){if(Array.isArray(x))return x.map(sort);if(x&&typeof x==='object')return Object.fromEntries(Object.keys(x).sort().map(k=>[k,sort(x[k])]));return x}
          export async function snapshot(){
            const settings=await read(`/workers/scripts/${worker}/settings`);
            const subdomain=await read(`/workers/scripts/${worker}/subdomain`);
            if(subdomain.enabled!==false||subdomain.previews_enabled!==false)throw Error('Extractor must remain private');
            const binding=settings.bindings?.find(b=>b.name==='SLIP_EXTRACTOR'&&b.type==='durable_object_namespace');
            if(!binding?.namespace_id||binding.class_name!=='SlipExtractorContainer')throw Error('Existing production DO binding required');
            const apps=await read('/containers/applications?name=mmd-slip-extractor-slipextractorcontainer');
            const matches=apps.filter(a=>a.durable_objects?.namespace_id===binding.namespace_id);
            if(matches.length!==1)throw Error('Expected one existing production container application');
            const app=matches[0];
            // Wrangler 4.124.0 inferInstanceType: the API may return expanded resources
            // instead of an instance_type name. Match all three values exactly.
            const presets={lite:[0.0625,256,2000],basic:[0.25,1024,4000],'standard-1':[0.5,4096,8000],'standard-2':[1,6144,12000],'standard-3':[2,8192,16000],'standard-4':[4,12288,20000]};
            const c=app.configuration||{};
            const instanceType=c.instance_type||Object.keys(presets).find(k=>{const [cpu,memory,disk]=presets[k];return c.vcpu===cpu&&c.memory_mib===memory&&c.disk?.size_mb===disk});
            if(!Number.isInteger(app.max_instances)||app.max_instances<1||!Object.hasOwn(presets,instanceType||''))throw Error('Existing container capacity unavailable: '+JSON.stringify({max_instances:app.max_instances??null,instance_type:c.instance_type??null,vcpu:c.vcpu??null,memory_mib:c.memory_mib??null,disk_mb:c.disk?.size_mb??null}));
            const [cpu,memory,disk]=presets[instanceType];
            if((c.vcpu!=null&&c.vcpu!==cpu)||(c.memory_mib!=null&&c.memory_mib!==memory)||(c.disk?.size_mb!=null&&c.disk.size_mb!==disk))throw Error('Expanded container resources disagree with preset; release blocked');
            return {settings,subdomain,app,instanceType};
          }
          export const file=`${process.env.RUNNER_TEMP}/extractor-before.json`;
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('services/mmd-slip-extractor/cloudflare/wrangler.production.jsonc','utf8'));
          if(config.containers?.length!==1||config.containers[0].class_name!=='SlipExtractorContainer'||config.containers[0].image!=='./Dockerfile'||config.containers[0].image_build_context!=='..'||config.name!=='mmd-slip-extractor'||config.workers_dev!==false||config.preview_urls!==false||config.routes?.length!==0||config.vars?.MMD_RUNTIME_SCOPE!=='production')throw Error('Private production boundary mismatch');
          const api=await import(`file://${process.env.RUNNER_TEMP}/extractor-boundary.mjs`);
          const before=await api.snapshot();
          if(config.compatibility_date!==before.settings.compatibility_date||api.canonical(config.compatibility_flags)!==api.canonical(before.settings.compatibility_flags))throw Error('Compatibility settings moved; release blocked');
          const expectedNames=['MMD_RUNTIME_SCOPE','MMD_SLIP_EXTRACTOR_MAX_BYTES','SLIP_EXTRACTOR'].sort();
          if(api.canonical(before.settings.bindings.map(b=>b.name).sort())!==api.canonical(expectedNames))throw Error('Production bindings changed; review before releasing');
          for(const [name,value] of Object.entries(config.vars)){
            const binding=before.settings.bindings.find(b=>b.name===name&&b.type==='plain_text');
            if(binding?.text!==value)throw Error('Production variable moved; release blocked: '+name);
          }
          fs.writeFileSync(api.file,JSON.stringify(before),{mode:0o600});
          const deployments=await api.read('/workers/scripts/mmd-slip-extractor/deployments'),active=deployments.deployments?.[0];
          if(before.app.configuration.image!==process.env.EXTRACTOR_EXPECTED_PREVIOUS_IMAGE||active?.versions?.length!==1||active.versions[0].percentage!==100||active.versions[0].version_id!==process.env.EXTRACTOR_EXPECTED_PREVIOUS_VERSION)throw Error('Production image/version moved; review the new baseline before releasing');
          if(before.app.id!=='a03cfd9f-78b5-4840-afa7-510d30367e66'||before.app.durable_objects?.namespace_id!=='8f70a7ac154e4e4d8817375c8f739097'||before.app.max_instances!==2||before.instanceType!=='basic')throw Error('Production resource identity/capacity moved; release blocked');
          const rollback=`Previous Worker version: ${active.versions[0].version_id}\nPrevious container image: ${before.app.configuration.image}\nExisting application: ${before.app.id}\nRelease source: ${process.env.EXTRACTOR_RELEASE_SHA}\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,rollback);
          config.containers[0].max_instances=before.app.max_instances;
          config.containers[0].instance_type=before.instanceType;
          fs.writeFileSync('services/mmd-slip-extractor/cloudflare/.wrangler-existing-production.json',JSON.stringify(config),{mode:0o600});
          console.log('Preserving existing container capacity: '+JSON.stringify({max_instances:before.app.max_instances,instance_type:before.instanceType}));
          fs.appendFileSync(process.env.GITHUB_ENV,`CLOUDFLARE_API_TOKEN=${(process.env.CLOUDFLARE_API_TOKEN||'').replace(/[\u2028\u2029\r\n]/g,'').trim()}\n`);
          console.log('Verified existing private extractor and container; no new resources required');
          JS
      - name: Validate production bundle
        working-directory: services/mmd-slip-extractor/cloudflare
        run: npx --yes wrangler@4.124.0 deploy --dry-run --config .wrangler-existing-production.json
      - name: Deploy reviewed image to existing private production extractor
        working-directory: services/mmd-slip-extractor/cloudflare
        run: npx --yes wrangler@4.124.0 deploy --config .wrangler-existing-production.json --keep-vars
      - name: Verify unchanged bindings and capacity; record image/version receipt
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const api=await import(`file://${process.env.RUNNER_TEMP}/extractor-boundary.mjs`);
          const before=JSON.parse(fs.readFileSync(api.file,'utf8'));
          // Container deployment is asynchronous. Compare the final configuration
          // only after the rollout disappears and the new image is visible.
          const deadline=Date.now()+10*60*1000;
          let after;
          while(Date.now()<deadline){
            const candidate=await api.snapshot();
            if(candidate.app.id!==before.app.id||candidate.app.durable_objects?.namespace_id!==before.app.durable_objects?.namespace_id)throw Error('Production resource identity changed during rollout');
            if(candidate.app.health?.errors?.length||candidate.app.health?.instances?.failed>0)throw Error('Container rollout reports unhealthy instances');
            if(!candidate.app.active_rollout_id&&candidate.app.configuration.image!==process.env.EXTRACTOR_EXPECTED_PREVIOUS_IMAGE){
              after=candidate;
              break;
            }
            console.log('Waiting for existing extractor container rollout to finish');
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(!after)throw Error('Timed out waiting for container rollout completion and new image; release unverified');
          const bindings=x=>[...x.settings.bindings].sort((a,b)=>a.name.localeCompare(b.name));
          if(before.settings.compatibility_date!==after.settings.compatibility_date||api.canonical(before.settings.compatibility_flags)!==api.canonical(after.settings.compatibility_flags)||api.canonical(bindings(before))!==api.canonical(bindings(after))||api.canonical(before.subdomain)!==api.canonical(after.subdomain)||before.app.id!==after.app.id||before.app.max_instances!==after.app.max_instances)throw Error('Private production boundary changed');
          const withoutImage=x=>{
            const c={...x.app.configuration,image:'IMAGE',instance_type:x.instanceType};
            // Same canonicalization as official Wrangler cleanForInstanceType:
            // CPU/RAM/disk values may be expanded or represented by their preset.
            for(const key of ['vcpu','memory','memory_mib','disk'])delete c[key];
            return c;
          };
          if(api.canonical(withoutImage(before))!==api.canonical(withoutImage(after)))throw Error('Container configuration changed beyond image: '+Object.keys({...withoutImage(before),...withoutImage(after)}).filter(k=>api.canonical(withoutImage(before)[k])!==api.canonical(withoutImage(after)[k])).join(','));
          const deployments=await api.read('/workers/scripts/mmd-slip-extractor/deployments'),active=deployments.deployments?.[0];
          if(active?.versions?.length!==1||active.versions[0].percentage!==100)throw Error('Expected one active extractor version');
          if(after.app.configuration.image===process.env.EXTRACTOR_EXPECTED_PREVIOUS_IMAGE||active.versions[0].version_id===process.env.EXTRACTOR_EXPECTED_PREVIOUS_VERSION)throw Error('OCR release did not advance both image and Worker version');
          const receipt=`Extractor release source: ${process.env.EXTRACTOR_RELEASE_SHA}\nActive Worker version: ${active.versions[0].version_id}\nContainer image: ${after.app.configuration.image}\nExisting DO/container application, bindings, secrets and private access preserved.\nNo customer evidence or payment operations in deployment smoke.\n`;
          console.log(receipt);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,receipt);
          JS
      - name: Remove private preflight files
        if: always()
        run: rm -f services/mmd-slip-extractor/cloudflare/.wrangler-existing-production.json "$RUNNER_TEMP/extractor-before.json" "$RUNNER_TEMP/extractor-boundary.mjs"
