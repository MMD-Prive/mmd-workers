name: HYPE Preview Intro One Shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hype-preview-intro-one-shot.yml"

permissions:
  contents: read

jobs:
  introduce-hype-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INTRO_URL: "https://telegram-worker.malemodel-bkk.workers.dev/telegram/internal/preview/introduce-hype"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token
        run: npx --yes wrangler@4 whoami

      - name: Introduce HYPE in Preview with ephemeral Worker token
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Skipping duplicate Preview introduction on rerun attempt ${GITHUB_RUN_ATTEMPT}"
            exit 0
          fi

          intro_token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          echo "::add-mask::${intro_token}"

          cleanup() {
            set +e
            printf 'y\n' | npx --yes wrangler@4 secret delete HYPE_PREVIEW_INTRO_TOKEN >"$RUNNER_TEMP/hype-preview-secret-delete.log" 2>&1
            cleanup_status=$?
            cat "$RUNNER_TEMP/hype-preview-secret-delete.log"
            if [ "$cleanup_status" -ne 0 ]; then
              echo "Ephemeral HYPE Preview secret cleanup failed" >&2
              return "$cleanup_status"
            fi
          }
          trap cleanup EXIT

          printf '%s' "$intro_token" | npx --yes wrangler@4 secret put HYPE_PREVIEW_INTRO_TOKEN

          response_file="$RUNNER_TEMP/hype-preview-intro.json"
          delivered=false

          # The deploy workflow runs independently from this one-shot workflow.
          # Retry while the new endpoint/secret propagates.
          for attempt in $(seq 1 30); do
            code="$(curl -sS -o "$response_file" -w '%{http_code}'               -X POST "$INTRO_URL"               -H "Authorization: Bearer ${intro_token}"               -H 'Content-Type: application/json'               --data '{"confirm":"INTRODUCE_HYPE_PREVIEW_V1"}' || true)"

            if [ "$code" = "200" ]; then
              delivered=true
              break
            fi

            if [ "$code" = "404" ] || [ "$code" = "503" ] || [ "$code" = "401" ]; then
              sleep 2
              continue
            fi

            break
          done

          if [ "$delivered" != "true" ]; then
            node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          let body = {};
          try { body = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          console.error(`HYPE Preview intro failed: ${body.error || body.detail || "HTTP failure"}`);
          if (body.stage) console.error(`stage=${body.stage}`);
          if (body.telegram?.description) console.error(`telegram=${body.telegram.description}`);
          NODE
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const body = JSON.parse(fs.readFileSync(file, "utf8"));
          if (body.ok !== true || !body.message_id || body.bot_username !== "mmdprivebot") {
            throw new Error("HYPE Preview intro receipt invalid");
          }
          console.log(`PREVIEW intro message_id=${body.message_id}`);
          console.log(`bot=@${body.bot_username}`);
          console.log(`chat_id=${body.chat_id}`);
          NODE
