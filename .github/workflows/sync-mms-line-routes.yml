name: Sync MMS LINE routes

on:
  workflow_run:
    workflows:
      - Deploy member-dashboard-chat-worker
    types:
      - completed

permissions:
  contents: read

jobs:
  sync:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      WORKER_NAME: "member-dashboard-chat-worker"
    steps:
      - name: Sync MMS customer LINE webhook routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = String(process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").trim();
          const zoneId = String(process.env.CLOUDFLARE_ZONE_ID || "").trim();
          const worker = String(process.env.WORKER_NAME || "").trim();
          if (!token || !zoneId || !worker) throw new Error("Cloudflare route configuration missing");

          const desired = [
            "mmdbkk.com/webhooks/line/mms",
            "mmdbkk.com/webhooks/line/mms/",
            "www.mmdbkk.com/webhooks/line/mms",
            "www.mmdbkk.com/webhooks/line/mms/",
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body?.success !== true) throw new Error(JSON.stringify(body?.errors || body));
            return body.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          let existing = await cf(routePath);
          for (const pattern of desired) {
            const conflict = existing.find((route) => route.pattern === pattern && route.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || "none"}`);
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) continue;
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
            existing = await cf(routePath);
          }

          const missing = desired.filter((pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`missing routes: ${missing.join(", ")}`);
          console.log(`verified ${desired.length}/${desired.length} MMS LINE routes`);
          NODE

      - name: Smoke MMS LINE route owner
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 6 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error https://www.mmdbkk.com/webhooks/line/mms)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true || body.worker !== "member-dashboard-chat-worker" || body.route !== "mms_line_webhook") {
              throw new Error(`Unexpected MMS LINE smoke response: ${process.argv[1]}`);
            }
            console.log(`MMS LINE route live; configured=${body.configured}; ai_enabled=${body.ai_enabled}`);
          ' "$response"
