name: Sync MMS LINE Routes

on:
  workflow_run:
    workflows:
      - "Deploy member-dashboard-chat-worker"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      WORKER_NAME: "member-dashboard-chat-worker"
    steps:
      - name: Synchronize exact MMS LINE webhook routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = (process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").trim();
          const zoneId = (process.env.CLOUDFLARE_ZONE_ID || "").trim();
          const worker = (process.env.WORKER_NAME || "").trim();
          if (!token || !zoneId || !worker) throw new Error("route sync credentials/config missing");
          const desired = [
            "mmdbkk.com/webhooks/line/mms",
            "mmdbkk.com/webhooks/line/mms/",
            "www.mmdbkk.com/webhooks/line/mms",
            "www.mmdbkk.com/webhooks/line/mms/",
          ];
          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body?.success !== true) {
              throw new Error(JSON.stringify(body?.errors || body || { status: response.status }));
            }
            return body.result;
          }
          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          for (const pattern of desired) {
            const conflict = existing.find((route) => route.pattern === pattern && route.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || "none"}`);
          }
          for (const pattern of desired) {
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) continue;
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
          }
          const verified = await cf(routePath);
          const missing = desired.filter((pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`missing MMS LINE routes: ${missing.join(", ")}`);
          console.log(`verified ${desired.length}/${desired.length} MMS LINE routes`);
          NODE

      - name: Smoke MMS LINE webhook ownership
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 6 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error https://www.mmdbkk.com/webhooks/line/mms)"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true || body.worker !== "member-dashboard-chat-worker" || body.route !== "mms_line_webhook") {
              throw new Error(`Unexpected MMS LINE smoke response: ${process.argv[1]}`);
            }
            if (body.configured !== true) throw new Error("MMS LINE secrets are not visible to the deployed Worker");
            if (body.ai_enabled !== true) throw new Error("MMS LINE AI is not enabled");
            if (body.rich_menu_mode !== "24/7") throw new Error("MMS Rich Menu mode is not 24/7");
          ' "$response"
