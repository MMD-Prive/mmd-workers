name: Owner Book EI payment verification
on:
  workflow_run:
    workflows: [Deploy admin-worker]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owner-book-ei-verify-20261012
  cancel-in-progress: false
jobs:
  verify-owner-request:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '[book-ei-verify]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_SMOKE_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test scripts/verify-book-ei-owner-request.test.mjs
      - name: Apply the exact owner-approved payment review and reissue confirmation pair
        run: node scripts/verify-book-ei-owner-request.mjs
