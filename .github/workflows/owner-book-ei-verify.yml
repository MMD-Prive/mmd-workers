name: Owner Book EI payment verification
on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner approval for this workflow and its production side effects only'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this workflow and commit'
        type: string
        required: true
      approved_sha:
        description: 'Full main commit SHA approved for this workflow'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: owner-book-ei-verify-20261012
  cancel-in-progress: false
jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}

  verify-owner-request:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [production-approval]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_SMOKE_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test scripts/verify-book-ei-owner-request.test.mjs
      - name: Apply the exact owner-approved payment review and reissue confirmation pair
        run: node scripts/verify-book-ei-owner-request.mjs
