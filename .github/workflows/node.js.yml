# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test

  anniversary-staging-smoke:
    name: Anniversary staging smoke (no production writes)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install Control Room test dependencies
      run: npm ci
      working-directory: immigrate-worker
    - name: Validate signed Admin session
      run: node --test admin-worker/admin-login-session.test.mjs
    - name: Validate Control Room bridge
      run: npm test
      working-directory: immigrate-worker
    - name: Run Care Back staging smoke
      run: npm run check && npm run smoke:staging
      working-directory: promotion-worker
