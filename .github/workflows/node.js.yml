# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - if: matrix.node-version != '18.x'
      run: npm test
    - if: matrix.node-version != '18.x'
      run: node --experimental-global-webcrypto --test member-pages-worker/private-teaser.test.mjs member-dashboard-chat-worker/test/my-mmd-lovable-app-front-gate.test.mjs webflow/profiles/private-teaser-handoff.test.mjs
    - if: matrix.node-version == '18.x'
      run: node --check member-dashboard-chat-worker/src/my-mmd-lovable-app-front-gate.js && node --check member-dashboard-chat-worker/test/my-mmd-lovable-app-front-gate.test.mjs
    - if: matrix.node-version == '22.x'
      run: npm ci --prefix member-pages-worker/test-runtime
    - if: matrix.node-version == '22.x'
      run: npm run test:member-pages-runtime
    - if: matrix.node-version == '22.x'
      run: npm run check:member-pages-wrangler
    - if: matrix.node-version == '22.x'
      run: npm ci --prefix sigil-worker --ignore-scripts
    - if: matrix.node-version == '22.x'
      run: npm test --prefix sigil-worker
    - if: matrix.node-version == '22.x'
      working-directory: sigil-worker
      run: npx wrangler deploy --dry-run
    - if: matrix.node-version != '18.x'
      run: npm ci --prefix services/mmd-slip-extractor
    - if: matrix.node-version != '18.x'
      run: npm test --prefix services/mmd-slip-extractor
