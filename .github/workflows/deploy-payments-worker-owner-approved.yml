name: Deploy payments-worker (owner approved)

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner requests deployment of this exact main SHA'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this exact deployment'
        type: string
        required: true
      approved_sha:
        description: 'Full main commit SHA approved for deployment'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: payments-worker-owner-approved-production
  cancel-in-progress: false

jobs:
  verify-protection:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'mmdprive' &&
      github.triggering_actor == 'mmdprive' &&
      github.run_attempt == 1 &&
      inputs.production_approved == true &&
      inputs.approval_ref != '' &&
      inputs.approved_sha == github.sha
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}
      environment_name: mmd-production-mutation

  deploy:
    needs: verify-protection
    if: needs.verify-protection.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: mmd-production-mutation
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      APPROVED_SHA: ${{ inputs.approved_sha }}
      APPROVAL_REF: ${{ inputs.approval_ref }}
    steps:
      - name: Check out the approved SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify approval still matches the checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -n "$APPROVAL_REF"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Validate customer confirmation projection
        shell: bash
        run: |
          set -euo pipefail
          node --check payments-worker/confirmation-details.js
          node --experimental-global-webcrypto --test payments-worker/confirmation-details.test.mjs

      - name: Validate model acknowledgement receipts before release
        shell: bash
        run: |
          set -euo pipefail
          node --check payments-worker/confirmation-ack.js
          node --check webflow/sigil/confirm/job-model-v15-i18n.js
          node --test payments-worker/confirmation-ack.test.mjs payments-worker/confirmation-ack-revision.test.mjs payments-worker/model-confirm-no-silent-failure.test.mjs webflow/sigil/confirm/job-model-v15-no-silent-failure.test.mjs

      - name: Validate production Worker configuration without uploading
        shell: bash
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars --config payments-worker/wrangler.merged.toml

      - name: Upload payments-worker version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions upload --keep-vars --config payments-worker/wrangler.merged.toml 2>&1 | tee "$RUNNER_TEMP/payments-upload.log"
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/payments-upload.log" | tail -n 1)"
          test -n "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Deploy only the uploaded payments-worker version
        working-directory: payments-worker
        env:
          PAYMENTS_WORKER_VERSION_ID: ${{ steps.upload.outputs.version_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAYMENTS_WORKER_VERSION_ID"
          npx --yes wrangler@4 versions deploy "${PAYMENTS_WORKER_VERSION_ID}@100%" --yes --config wrangler.merged.toml

      - name: Read-only confirmation route smoke checks
        shell: bash
        run: |
          set -euo pipefail
          health_body="$RUNNER_TEMP/payment-health.json"
          health_code="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o "$health_body" -w '%{http_code}' 'https://sigil.mmdbkk.com/v1/pay/slip/evidence/health')"
          test "$health_code" = "200"
          node -e 'const d=require(process.argv[1]); if (d.ready !== true || d.signed_token_required !== true) process.exit(1)' "$health_body"

          details_body="$RUNNER_TEMP/confirmation-details-invalid-token.json"
          details_code="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o "$details_body" -w '%{http_code}' -X POST -H 'Origin: https://mmdbkk.com' -H 'Content-Type: application/json' --data '{"t":"invalid.invalid","expected_role":"customer"}' 'https://sigil.mmdbkk.com/v1/confirm/details')"
          test "$details_code" = "401"
          grep -Eq 'invalid_confirmation_token|invalid_confirmation_token_signature|confirmation_token_not_active' "$details_body"
