name: Prepare Historical Backfill Controlled Handoff
# retry-v2: generator uses string concatenation only

on:
  push:
    branches:
      - feat/payment-review-facade-v1
    paths:
      - ".github/workflows/prepare-historical-backfill-controlled-handoff.yml"

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-review-facade-v1
          fetch-depth: 0

      - name: Apply controlled-handoff patch
        run: node scripts/prepare-historical-controlled-handoff.mjs

      - name: Validate generated changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check admin-worker/src/historical-slip-backfill-runtime.js
          node --experimental-global-webcrypto --test \
            admin-worker/historical-slip-backfill-route.test.mjs \
            admin-worker/historical-slip-backfill-handoff-probe.test.mjs
          grep -F '"/v1/admin/payments/historical-backfill*"' .github/workflows/deploy-admin-worker.yml

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMD Privé"
          git config user.email "malemodel.bkk@gmail.com"
          git add \
            admin-worker/src/historical-slip-backfill-runtime.js \
            admin-worker/historical-slip-backfill-handoff-probe.test.mjs \
            .github/workflows/deploy-admin-worker.yml \
            .github/workflows/historical-backfill-authenticated-controlled-smoke.yml
          if git diff --cached --quiet; then
            echo "Controlled-handoff changes already applied"
            exit 0
          fi
          git commit -m "test(payments): add authenticated Historical Backfill handoff smoke"
          git push origin HEAD:feat/payment-review-facade-v1
