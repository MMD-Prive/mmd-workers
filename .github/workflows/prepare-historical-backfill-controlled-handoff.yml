name: Prepare Historical Backfill Controlled Handoff
# runtime-only preparer; workflow files are managed by the GitHub connector

on:
  push:
    branches:
      - feat/payment-review-facade-v1
    paths:
      - ".github/workflows/prepare-historical-backfill-controlled-handoff.yml"

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-review-facade-v1
          fetch-depth: 0

      - name: Apply controlled-handoff runtime patch
        run: node scripts/prepare-historical-controlled-handoff.mjs

      - name: Validate runtime and handoff contract
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/historical-slip-backfill-runtime.js
          node --experimental-global-webcrypto --test \
            admin-worker/historical-slip-backfill-route.test.mjs \
            admin-worker/historical-slip-backfill-handoff-probe.test.mjs

      - name: Commit runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMD Privé"
          git config user.email "malemodel.bkk@gmail.com"
          git add admin-worker/src/historical-slip-backfill-runtime.js
          if git diff --cached --quiet; then
            echo "Controlled-handoff runtime already applied"
            exit 0
          fi
          git commit -m "feat(payments): add safe Historical Backfill handoff probe"
          git push origin HEAD:feat/payment-review-facade-v1
