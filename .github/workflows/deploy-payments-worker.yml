name: Deploy payments-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "payments-worker/**"
      - ".github/workflows/deploy-payments-worker.yml"

concurrency:
  group: deploy-payments-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source and confirmation contract
        shell: bash
        run: |
          set -euo pipefail
          node --check payments-worker/index.phase1.js
          node --check payments-worker/confirmation-ack.js
          node payments-worker/payment-confirmation-token.test.mjs
          npx --yes wrangler@4 versions upload --dry-run --keep-vars --config payments-worker/wrangler.merged.toml

      - name: Upload payments-worker version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions upload --keep-vars --config payments-worker/wrangler.merged.toml \
            2>&1 | tee "$RUNNER_TEMP/payments-upload.log"
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/payments-upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Unable to resolve payments-worker version id" >&2
            exit 1
          fi
          echo "PAYMENTS_WORKER_VERSION_ID=$version_id" >> "$GITHUB_ENV"

      - name: Deploy uploaded version without changing route ownership
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy "${PAYMENTS_WORKER_VERSION_ID}@100%" -y --config payments-worker/wrangler.merged.toml

      - name: Smoke signed confirmation routes
        shell: bash
        run: |
          set -euo pipefail
          for path in /v1/confirm/verify /v1/confirm/ack; do
            body_file="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -o "$body_file" -w "%{http_code}" \
              -X POST \
              -H 'Origin: https://mmdbkk.com' \
              -H 'Content-Type: application/json' \
              --data '{"t":"invalid.invalid","expected_role":"customer"}' \
              "https://sigil.mmdbkk.com${path}")"
            test "$code" = "401"
            grep -Eq 'invalid_confirmation_token|invalid_confirmation_token_signature|confirmation_token_not_active' "$body_file"
          done
