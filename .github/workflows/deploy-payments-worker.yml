name: Deploy payments-worker
# PostHog authority deploy retry 2026-09-22

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "shared/shop-brand-context.mjs"
      - "shared/posthog-authority-events.mjs"
      - "payments-worker/**"
      - "shared/mmd-shop-stock-reservation.mjs"
      - "shared/mmd-shop-fulfillment.mjs"
      - "shared/membership-promotion-policy.mjs"
      - "shared/membership-promotion-policy.test.mjs"
      - ".github/workflows/deploy-payments-worker.yml"
      - "shared/payment-intelligence.mjs"
      - "shared/canonical-payment-evidence*"
      - "shared/payment-notification-outbox*"
      - "shared/test/payment-memory-r2.mjs"
      - "scripts/ensure-payment-notification-cron*"

concurrency:
  group: telegram-router-secret-rotation-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source and confirmation contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:payment-delivery
          node --check payments-worker/canonical-confirm-link.js
          node --check payments-worker/index.review-wrapper.js
          node --check payments-worker/shop-payment-v1.js
          node --check payments-worker/index.phase1.js
          node --check payments-worker/confirmation-ack.js
          node --check payments-worker/confirmation-details.js
          node --check payments-worker/customer-change-request.js
          node --check payments-worker/payment-instructions-v1.js
          node --check shared/mmd-shop-stock-reservation.mjs
          node --check shared/mmd-shop-fulfillment.mjs
          grep -Fq 'binding = "MMD_SHOP_WORKER"' payments-worker/wrangler.merged.toml
          grep -Fq 'binding = "TELEGRAM_WORKER"' payments-worker/wrangler.merged.toml
          grep -Fq 'service = "telegram-worker"' payments-worker/wrangler.merged.toml
          node --check payments-worker/final-payment-flow.js
          node --check payments-worker/double-moment-purchase-v1.js
          node --experimental-default-type=module --check payments-worker/reviewed-membership-write-through.js
          node --check shared/membership-promotion-policy.mjs
          node --test payments-worker/canonical-confirm-link.test.mjs
          node --test payments-worker/confirmation-ack.test.mjs
          node --test payments-worker/confirmation-details.test.mjs
          node --test payments-worker/customer-change-request.test.mjs
          node --test webflow/sigil/confirm/customer-session-tracker-v2.test.mjs
          node --test payments-worker/payment-instructions-v1.test.mjs
          node --test payments-worker/final-payment-flow.test.mjs
          node --test payments-worker/session-finance-write.test.mjs
          node --test payments-worker/double-moment-purchase-v1.test.mjs
          node --experimental-global-webcrypto --experimental-default-type=module --test payments-worker/reviewed-membership-write-through.test.mjs
          node --test payments-worker/reviewed-proof-line-recovery.test.mjs shared/membership-promotion-policy.test.mjs
          node payments-worker/payment-confirmation-token.test.mjs
          npx --yes wrangler@4 deploy --dry-run --keep-vars --config payments-worker/wrangler.merged.toml

      - name: Rotate payments-to-Telegram service secret
        shell: bash
        run: |
          set -euo pipefail
          service_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$service_secret"
          printf 'PAYMENTS_TELEGRAM_SHARED_SECRET=%s\n' "$service_secret" >> "$GITHUB_ENV"
          router_secret_log="$RUNNER_TEMP/telegram-worker-payments-secret-version.log"
          printf '%s' "$service_secret" | npx --yes wrangler@4 versions secret put AUTH_SERVICE_PAYMENTS_TO_TELEGRAM \
            --config telegram-worker/wrangler.toml \
            --tag "router-payments-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}" \
            --message "Rotate AUTH_SERVICE_PAYMENTS_TO_TELEGRAM from ${GITHUB_SHA}" \
            2>&1 | tee "$router_secret_log"
          router_version_id="$(sed -n -e 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' -e 's/.*Created version[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$router_secret_log" | tail -n 1)"
          if [ -z "$router_version_id" ]; then
            echo "Unable to resolve telegram-worker secret version id for AUTH_SERVICE_PAYMENTS_TO_TELEGRAM" >&2
            cat "$router_secret_log" >&2
            exit 1
          fi
          npx --yes wrangler@4 versions deploy "${router_version_id}@100%" -y --config telegram-worker/wrangler.toml
          printf 'AUTH_SERVICE_PAYMENTS_TO_TELEGRAM=%s\n' "$service_secret" > "$RUNNER_TEMP/payments-worker-router.env"
          chmod 600 "$RUNNER_TEMP/payments-worker-router.env"

      - name: Smoke canonical Payments Confirm service transport
        shell: bash
        env:
          TELEGRAM_CHAT_ID: "-1003546439681"
          TELEGRAM_PAYMENT_THREAD_ID: "22"
        run: |
          set -euo pipefail
          test -n "${PAYMENTS_TELEGRAM_SHARED_SECRET:-}"
          proof_file="$RUNNER_TEMP/payment-proof-transport-smoke.txt"
          response_file="$RUNNER_TEMP/payment-proof-transport-smoke.json"
          printf '%s\n' 'synthetic transport smoke; no customer data' > "$proof_file"

          passed=0
          for attempt in $(seq 1 24); do
            code="$(curl --retry 2 --retry-delay 1 --retry-all-errors -sS \
              -o "$response_file" -w "%{http_code}" \
              -X POST 'https://telegram-worker.malemodel-bkk.workers.dev/telegram/internal/payments/proof-document' \
              -H "Authorization: Bearer ${PAYMENTS_TELEGRAM_SHARED_SECRET}" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "message_thread_id=${TELEGRAM_PAYMENT_THREAD_ID}" \
              -F 'caption=🧪 MMD Payments Confirm transport check · synthetic / no customer data' \
              -F 'disable_notification=true' \
              -F "document=@${proof_file};type=text/plain;filename=payment-proof-transport-smoke.txt")"
            cat "$response_file"

            if [ "$code" = "200" ] && node -e '
              const fs=require("node:fs");
              const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              if (b.ok !== true || !b.message_id || Number(b.message_thread_id) !== 22) process.exit(1);
              console.log("Payments Confirm service transport delivered, message_id="+b.message_id);
            ' "$response_file"; then
              passed=1
              echo "Payments Confirm service transport ready on attempt $attempt"
              break
            fi

            if [ "$code" = "403" ] && node -e '
              const fs=require("node:fs");
              let body={};
              try { body=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); } catch {}
              process.exit(body?.error === "internal_token_required" ? 0 : 1);
            ' "$response_file"; then
              echo "Payments Telegram auth not propagated yet (attempt $attempt); retrying..."
              sleep 5
              continue
            fi

            echo "Payments Confirm service transport failed with non-propagation response (HTTP $code)" >&2
            exit 1
          done
          test "$passed" = "1"

      - name: Upload payments-worker version
        id: upload
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 versions upload --keep-vars --secrets-file "$RUNNER_TEMP/payments-worker-router.env" --config payments-worker/wrangler.merged.toml \
            2>&1 | tee "$RUNNER_TEMP/payments-upload.log"

      - name: Resolve uploaded version ID
        id: resolve_version
        if: steps.upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/payments-upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Unable to resolve payments-worker version id" >&2
            cat "$RUNNER_TEMP/payments-upload.log" >&2
            exit 1
          fi
          echo "PAYMENTS_WORKER_VERSION_ID=$version_id" >> "$GITHUB_ENV"

      - name: Apply Durable Object migration without changing route ownership
        id: migration_deploy
        if: steps.upload.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq 'code:[[:space:]]*10211|\[code:[[:space:]]*10211\]' "$RUNNER_TEMP/payments-upload.log"; then
            echo "Version upload failed for a reason other than Cloudflare Durable Object migration code 10211; refusing direct-deploy fallback." >&2
            cat "$RUNNER_TEMP/payments-upload.log" >&2
            exit 1
          fi

          echo "Cloudflare requires a non-versioned deployment to apply the pending Durable Object migration."
          migration_config="payments-worker/.wrangler-migration-no-routes.toml"
          node <<'NODE'
          const fs = require("node:fs");
          const source = "payments-worker/wrangler.merged.toml";
          const target = "payments-worker/.wrangler-migration-no-routes.toml";
          const input = fs.readFileSync(source, "utf8").split(/\r?\n/);
          const output = [];
          let skippingRoutesArray = false;
          for (const line of input) {
            if (/^\s*routes\s*=\s*\[/.test(line)) {
              skippingRoutesArray = true;
              if (/\]\s*$/.test(line)) skippingRoutesArray = false;
              continue;
            }
            if (skippingRoutesArray) {
              if (/\]\s*$/.test(line)) skippingRoutesArray = false;
              continue;
            }
            if (/^\s*\[\[routes\]\]\s*$/.test(line)) {
              throw new Error("Unexpected [[routes]] block in payments config; refusing unsafe fallback");
            }
            output.push(line);
          }
          const rendered = `${output.join("\n")}\n`;
          if (/^\s*routes\s*=|^\s*\[\[routes\]\]/m.test(rendered)) {
            throw new Error("Migration config still contains route declarations");
          }
          fs.writeFileSync(target, rendered);
          NODE
          trap 'rm -f "$migration_config"' EXIT
          npx --yes wrangler@4 deploy --keep-vars --secrets-file "$RUNNER_TEMP/payments-worker-router.env" --config "$migration_config"

      - name: Deploy uploaded version without changing route ownership
        id: deploy_version
        if: steps.resolve_version.outcome == 'success'
        shell: bash
        working-directory: payments-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy "${PAYMENTS_WORKER_VERSION_ID}@100%" -y --config wrangler.merged.toml

      - name: Ensure payment notification retry schedule
        if: steps.deploy_version.outcome == 'success' || steps.migration_deploy.outcome == 'success'
        run: node scripts/ensure-payment-notification-cron.mjs payments-worker

      - name: Smoke signed confirmation routes
        if: steps.deploy_version.outcome == 'success' || steps.migration_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          proof_health_body="$(mktemp)"
          proof_health_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
            -o "$proof_health_body" -w "%{http_code}" \
            'https://sigil.mmdbkk.com/v1/pay/slip/evidence/health')"
          cat "$proof_health_body"
          test "$proof_health_code" = "200"
          grep -F '"version":"sigil_pay_proof_intake_v3"' "$proof_health_body"
          grep -F '"signed_token_required":true' "$proof_health_body"
          grep -F '"canonical_proof_status":"pending"' "$proof_health_body"
          grep -F '"telegram_thread_id":22' "$proof_health_body"
          grep -F '"ready":true' "$proof_health_body"

          for path in /v1/confirm/verify /v1/confirm/details /v1/confirm/ack /v1/confirm/change-request /v1/confirm/payment-instructions; do
            body_file="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -o "$body_file" -w "%{http_code}" \
              -X POST \
              -H 'Origin: https://mmdbkk.com' \
              -H 'Content-Type: application/json' \
              --data '{"t":"invalid.invalid","expected_role":"customer"}' \
              "https://sigil.mmdbkk.com${path}")"
            cat "$body_file"
            test "$code" = "401"
            grep -Eq 'invalid_confirmation_token|invalid_confirmation_token_signature|confirmation_token_not_active' "$body_file"
          done

          health_body="$(mktemp)"
          health_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
            -o "$health_body" -w "%{http_code}" \
            'https://sigil.mmdbkk.com/v1/confirm/double-moment/health')"
          cat "$health_body"
          test "$health_code" = "200"
          grep -F '"campaign_id":"promo_double_moment_sep2026"' "$health_body"
          grep -F '"purchase_amount_thb":20000' "$health_body"
          grep -F '"total_credit_thb":27000' "$health_body"
          grep -F '"minimum_service_thb":20000' "$health_body"
          grep -F '"validity_days":180' "$health_body"

          unauth_body="$(mktemp)"
          unauth_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
            -o "$unauth_body" -w "%{http_code}" \
            -X POST \
            -H 'Origin: https://mmdbkk.com' \
            -H 'Content-Type: application/json' \
            --data '{"client_record_id":"rec00000000000"}' \
            'https://sigil.mmdbkk.com/v1/confirm/double-moment/start')"
          cat "$unauth_body"
          test "$unauth_code" = "401"
          grep -F '"error":"service_auth_required"' "$unauth_body"


      - name: Verify fully unified Telegram Router Health
        if: steps.deploy_version.outcome == 'success' || steps.migration_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PAYMENTS_TELEGRAM_SHARED_SECRET:-}"
          body="$(mktemp)"
          passed=0
          for attempt in $(seq 1 24); do
            code="$(curl --retry 2 --retry-delay 1 --retry-all-errors -sS               -o "$body" -w "%{http_code}"               -H "Authorization: Bearer ${PAYMENTS_TELEGRAM_SHARED_SECRET}"               'https://telegram-worker.malemodel-bkk.workers.dev/telegram/internal/router/health?probe=1')"
            cat "$body"
            if [ "$code" = "200" ] && node -e '
              const fs=require("node:fs");
              const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const c=p?.counts||{};
              if (p?.schema!=="mmd.hype_telegram_router_health.v1") process.exit(1);
              if (p?.registry_version!=="2026-09-21.2") process.exit(1);
              if (p?.status!=="configured" || p?.ok!==true) process.exit(1);
              if (Number(c.partial||0)!==0 || Number(c.unavailable||0)!==0 || Number(c.legacy_direct_senders||0)!==0) process.exit(1);
              if (p?.transport?.live_probe?.attempted!==true || p?.transport?.live_probe?.ok!==true) process.exit(1);
              if (!(Array.isArray(p?.lanes) && p.lanes.every((lane)=>lane.status==="configured"))) process.exit(1);
            ' "$body"; then
              passed=1
              echo "Unified Telegram Router Health configured on attempt $attempt"
              break
            fi
            echo "Unified Telegram Router Health not fully propagated yet (attempt $attempt, HTTP $code)"
            sleep 5
          done
          test "$passed" = "1"
