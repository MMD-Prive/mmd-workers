name: Deploy payments-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "payments-worker/**"
      - ".github/workflows/deploy-payments-worker.yml"

concurrency:
  group: deploy-payments-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source and confirmation contract
        shell: bash
        run: |
          set -euo pipefail
          node --check payments-worker/index.phase1.js
          node --check payments-worker/confirmation-ack.js
          node payments-worker/payment-confirmation-token.test.mjs
          npx --yes wrangler@4 deploy --dry-run --keep-vars --config payments-worker/wrangler.merged.toml

      - name: Build route-free deployment config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('payments-worker/wrangler.merged.toml', 'utf8').split(/\r?\n/);
          const output = [];
          let inRoutesArray = false;
          for (const line of source) {
            if (/^\s*routes\s*=\s*\[\s*$/.test(line)) {
              inRoutesArray = true;
              continue;
            }
            if (inRoutesArray) {
              if (/^\s*\]\s*$/.test(line)) inRoutesArray = false;
              continue;
            }
            if (/^\s*\[\[routes\]\]\s*$/.test(line)) {
              throw new Error('Unexpected [[routes]] block in payments config; refuse ambiguous route mutation');
            }
            output.push(line);
          }
          if (inRoutesArray) throw new Error('Unterminated routes array');
          const result = output.join('\n') + '\n';
          if (/^\s*routes\s*=/m.test(result) || /^\s*\[\[routes\]\]/m.test(result)) {
            throw new Error('Route-free config still contains route declarations');
          }
          fs.writeFileSync('payments-worker/.wrangler-no-routes.toml', result);
          NODE

      - name: Deploy payments-worker without changing custom-host routes
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f payments-worker/.wrangler-no-routes.toml' EXIT
          npx --yes wrangler@4 deploy --keep-vars --config payments-worker/.wrangler-no-routes.toml

      - name: Smoke signed confirmation routes
        shell: bash
        run: |
          set -euo pipefail
          for path in /v1/confirm/verify /v1/confirm/context /v1/confirm/ack; do
            body_file="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -o "$body_file" -w "%{http_code}" \
              -X POST \
              -H 'Origin: https://mmdbkk.com' \
              -H 'Content-Type: application/json' \
              --data '{"t":"invalid.invalid","expected_role":"customer"}' \
              "https://sigil.mmdbkk.com${path}")"
            cat "$body_file"
            test "$code" = "401"
            grep -Eq 'invalid_confirmation_token|invalid_confirmation_token_signature|confirmation_token_not_active' "$body_file"
          done
