name: MMS admin production state

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy admin-worker
    types:
      - completed

permissions:
  contents: read

jobs:
  browser-state:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_MMS_SMOKE_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
      EXPECTED_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize smoke credential
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const clean = (value) => (value || '').replace(/[\u2028\u2029\r\n]/g, '').trim();
          const credential = clean(process.env.ADMIN_MMS_SMOKE_CREDENTIAL);
          if (!credential) throw new Error('ADMIN_LOGIN_CREDENTIAL or ADMIN_BEARER is required');
          fs.appendFileSync(process.env.GITHUB_ENV, `ADMIN_MMS_SMOKE_CREDENTIAL=${credential}\n`);
          NODE
          echo "::add-mask::$ADMIN_MMS_SMOKE_CREDENTIAL"

      - name: Verify host-bound admin sessions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const credential = String(process.env.ADMIN_MMS_SMOKE_CREDENTIAL || '').trim();
            const expectedBuild = String(process.env.EXPECTED_BUILD_SHA || '').trim();
            const origins = ['https://mmdbkk.com', 'https://www.mmdbkk.com'];

            function setCookieValues(headers) {
              if (typeof headers.getSetCookie === 'function') return headers.getSetCookie();
              const value = headers.get('set-cookie');
              return value ? [value] : [];
            }

            for (const origin of origins) {
              const body = new URLSearchParams({
                credential,
                next: '/internal/admin/mms',
              });
              const login = await fetch(`${origin}/internal/admin/login/session`, {
                method: 'POST',
                headers: {
                  Origin: origin,
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: body.toString(),
                redirect: 'manual',
              });
              if (login.status !== 303) throw new Error(`${origin} login expected 303, got ${login.status}`);
              if (login.headers.get('location') !== '/internal/admin/mms') {
                throw new Error(`${origin} login returned unexpected location ${login.headers.get('location')}`);
              }

              const gateCookie = setCookieValues(login.headers)
                .find((value) => /(?:^|;\s*)mmd_admin_gate_v1=/.test(value));
              if (!gateCookie) throw new Error(`${origin} login did not issue mmd_admin_gate_v1`);
              if (/\bdomain=/i.test(gateCookie)) throw new Error(`${origin} admin cookie must remain host-only`);
              const cookiePair = gateCookie.split(';', 1)[0];

              const sameHost = await fetch(`${origin}/internal/admin/mms`, {
                headers: { Cookie: cookiePair },
                redirect: 'manual',
              });
              const sameBody = await sameHost.text();
              if (sameHost.status !== 200 || !sameBody.includes('MMS · Internal Operations')) {
                throw new Error(`${origin} host-bound session did not render MMS admin`);
              }
              if (expectedBuild && !sameBody.includes(`<meta name="mmd-admin-build" content="${expectedBuild}">`)) {
                throw new Error(`${origin} MMS build marker does not match ${expectedBuild}`);
              }

              const otherOrigin = origin.includes('www.') ? 'https://mmdbkk.com' : 'https://www.mmdbkk.com';
              const crossHost = await fetch(`${otherOrigin}/internal/admin/mms`, {
                headers: { Cookie: cookiePair },
                redirect: 'manual',
              });
              const crossBody = await crossHost.text();
              if (crossHost.status === 200 && crossBody.includes('MMS · Internal Operations')) {
                throw new Error(`host-bound cookie from ${origin} authenticated ${otherOrigin}`);
              }

              console.log(`Host-bound session passed: ${origin} authenticates itself and not ${otherOrigin}`);
            }
          })().catch((error) => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          NODE

      - name: Install browser driver only
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund puppeteer-core@24.16.0

      - name: Verify canonical redirect and production DOM state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const puppeteer = require('puppeteer-core');

          (async () => {
            function findChrome() {
              for (const bin of ['google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser']) {
                try {
                  return execFileSync('which', [bin], { encoding: 'utf8' }).trim();
                } catch {}
              }
              throw new Error('Chrome/Chromium executable not found on runner');
            }

            const credential = String(process.env.ADMIN_MMS_SMOKE_CREDENTIAL || '').trim();
            const expectedBuild = String(process.env.EXPECTED_BUILD_SHA || '').trim();
            const browser = await puppeteer.launch({
              executablePath: findChrome(),
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-gpu'],
            });

            try {
              const redirectContext = await browser.createBrowserContext();
              const redirectPage = await redirectContext.newPage();
              await redirectPage.goto(
                `https://www.mmdbkk.com/internal/admin/login?next=${encodeURIComponent('/internal/admin/mms')}`,
                { waitUntil: 'domcontentloaded', timeout: 30000 },
              );
              const canonicalUrl = new URL(redirectPage.url());
              if (canonicalUrl.hostname !== 'mmdbkk.com' || canonicalUrl.pathname !== '/internal/admin/login') {
                throw new Error(`www login did not canonicalize to apex login: ${redirectPage.url()}`);
              }
              console.log(`Canonical www login redirect passed: ${redirectPage.url()}`);
              await redirectContext.close();

              const context = await browser.createBrowserContext();
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              const requestFailures = [];

              page.on('console', (msg) => {
                if (msg.type() === 'error') consoleErrors.push(msg.text());
              });
              page.on('pageerror', (error) => {
                pageErrors.push(error && error.message ? error.message : String(error));
              });
              page.on('requestfailed', (request) => {
                const url = request.url();
                if (url.includes('/v1/admin/mms/') || url.includes('/internal/admin/mms')) {
                  requestFailures.push(`${request.method()} ${url} :: ${request.failure()?.errorText || 'failed'}`);
                }
              });

              await page.goto(
                `https://mmdbkk.com/internal/admin/login?next=${encodeURIComponent('/internal/admin/mms')}`,
                { waitUntil: 'domcontentloaded', timeout: 30000 },
              );

              const loginResult = await page.evaluate(async ({ credential }) => {
                const body = new URLSearchParams({ credential, next: '/internal/admin/mms' });
                const response = await fetch('/internal/admin/login/session', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body: body.toString(),
                  credentials: 'include',
                  redirect: 'manual',
                });
                return { status: response.status, type: response.type };
              }, { credential });

              await page.goto('https://mmdbkk.com/internal/admin/mms', {
                waitUntil: 'domcontentloaded',
                timeout: 30000,
              });

              await page.waitForFunction(() => {
                const ops = document.querySelector('#opsAppsCount');
                const summary = document.querySelector('#sApps');
                return ops && summary && !['', '–'].includes((ops.textContent || '').trim()) && !['', '–'].includes((summary.textContent || '').trim());
              }, { timeout: 15000 });
              await new Promise((resolve) => setTimeout(resolve, 500));

              const dom = await page.evaluate(async () => {
                const text = (selector) => {
                  const el = document.querySelector(selector);
                  return el ? (el.textContent || '').trim() : null;
                };
                const response = await fetch('/v1/admin/mms/snapshot', {
                  credentials: 'same-origin',
                  headers: { accept: 'application/json' },
                });
                const snapshot = await response.json();
                return {
                  href: location.href,
                  build: document.querySelector('meta[name="mmd-admin-build"]')?.content || null,
                  favicon: document.querySelector('[data-mms-admin-favicon]')?.getAttribute('href') || null,
                  bridgeType: typeof window.mmsAdminApplySnapshot,
                  summary: {
                    applications: text('#sApps'),
                    therapists: text('#sTher'),
                    prebookings: text('#sPre'),
                  },
                  nav: {
                    applications: text('#appCount'),
                    therapists: text('#therCount'),
                    prebookings: text('#preCount'),
                  },
                  ops: {
                    applications: text('#opsAppsCount'),
                    prebookings: text('#opsPreCount'),
                    jobs: text('#opsJobsCount'),
                  },
                  snapshot: response.ok && snapshot?.ok === true ? {
                    ok: true,
                    applications: Array.isArray(snapshot.applications) ? snapshot.applications.length : null,
                    therapists: Array.isArray(snapshot.therapists) ? snapshot.therapists.length : null,
                    prebookings: Array.isArray(snapshot.prebookings) ? snapshot.prebookings.length : null,
                  } : { ok: false, status: response.status, error: snapshot?.error || 'snapshot_not_ok' },
                };
              });

              const mismatches = [];
              const expected = dom.snapshot?.ok ? dom.snapshot : null;
              if (!expected) {
                mismatches.push(`snapshot endpoint not ok: ${JSON.stringify(dom.snapshot)}`);
              } else {
                for (const [label, actual, wanted] of [
                  ['summary.applications', dom.summary.applications, expected.applications],
                  ['nav.applications', dom.nav.applications, expected.applications],
                  ['ops.applications', dom.ops.applications, expected.applications],
                  ['summary.therapists', dom.summary.therapists, expected.therapists],
                  ['nav.therapists', dom.nav.therapists, expected.therapists],
                  ['summary.prebookings', dom.summary.prebookings, expected.prebookings],
                  ['nav.prebookings', dom.nav.prebookings, expected.prebookings],
                ]) {
                  if (String(actual) !== String(wanted)) mismatches.push(`${label}: DOM=${actual} API=${wanted}`);
                }
              }
              if (dom.href !== 'https://mmdbkk.com/internal/admin/mms') mismatches.push(`canonical DOM href=${dom.href}`);
              if (expectedBuild && dom.build !== expectedBuild) mismatches.push(`build=${dom.build} expected=${expectedBuild}`);
              if (dom.bridgeType !== 'function') mismatches.push(`mmsAdminApplySnapshot type=${dom.bridgeType}`);
              if (dom.favicon !== 'https://cdn.prod.website-files.com/68f879d546d2f4e2ab186e90/6a0ea3f9421cae9dd223f50b_SIGIL%20only%20logo.webp') mismatches.push(`favicon=${dom.favicon}`);
              if (pageErrors.length) mismatches.push(`pageerror=${pageErrors.join(' | ')}`);
              if (consoleErrors.length) mismatches.push(`console.error=${consoleErrors.join(' | ')}`);
              if (requestFailures.length) mismatches.push(`requestfailed=${requestFailures.join(' | ')}`);

              console.log(JSON.stringify({ loginResult, dom, pageErrors, consoleErrors, requestFailures, mismatches }, null, 2));
              if (mismatches.length) throw new Error(`MMS canonical production DOM mismatch: ${mismatches.join(' ; ')}`);
              console.log('MMS canonical production DOM state passed.');
              await context.close();
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          NODE
