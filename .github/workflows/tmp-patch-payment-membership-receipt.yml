name: Temporary patch payment membership receipt

on:
  push:
    branches:
      - feat/payment-resolver-entitlement-write-through-20260913
    paths:
      - ".github/workflows/tmp-patch-payment-membership-receipt.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payment-resolver-entitlement-write-through-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch admin membership receipt and UI
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const runtimeFile = 'admin-worker/src/payment-review-runtime.js';
          let runtime = fs.readFileSync(runtimeFile, 'utf8');

          const replaceOnce = (source, before, after, label) => {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label} marker count=${count}`);
            return source.replace(before, after);
          };

          runtime = replaceOnce(
            runtime,
            `    context_source: approval.context_source,\n    renewal_session_id: approval.renewal_session_id,\n  }).then((value) => ({ ...value, ok: true })).catch((error) => ({`,
            `    context_source: approval.context_source,\n    renewal_session_id: approval.renewal_session_id,\n    membership_write_through: safeMembershipWriteThrough(payload.membership_write_through),\n    manual_membership_review_required: payload.manual_membership_review_required === true,\n  }).then((value) => ({ ...value, ok: true })).catch((error) => ({`,
            'approve audit'
          );

          runtime = replaceOnce(
            runtime,
            `    recovery_context: approval.context_source === "liff_renewal_recovery",\n    duplicate: payload.duplicate === true,\n    money_truth_changed: true,`,
            `    recovery_context: approval.context_source === "liff_renewal_recovery",\n    duplicate: payload.duplicate === true,\n    entitlement_materialized: payload.entitlement_materialized === true,\n    manual_membership_review_required: payload.manual_membership_review_required === true,\n    membership_expire_at: isoOrText(payload.membership_expire_at) || null,\n    membership_write_through: safeMembershipWriteThrough(payload.membership_write_through),\n    money_truth_changed: true,`,
            'approve response'
          );

          runtime = replaceOnce(
            runtime,
            `    recovery_context: safeCode(after.context_source) === "liff_renewal_recovery",\n    money_truth_changed: after.money_truth_changed === true,`,
            `    recovery_context: safeCode(after.context_source) === "liff_renewal_recovery",\n    payment_stage: safeCode(after.payment_stage || ""),\n    membership_write_through: safeMembershipWriteThrough(after.membership_write_through),\n    manual_membership_review_required: after.manual_membership_review_required === true,\n    money_truth_changed: after.money_truth_changed === true,`,
            'idempotent audit readback'
          );

          runtime = replaceOnce(
            runtime,
            `      authority: input.authority || "payments-worker",\n      context_source: input.context_source || "",\n      money_truth_changed: input.decision === "approve" && input.authority === "payments-worker",`,
            `      authority: input.authority || "payments-worker",\n      context_source: input.context_source || "",\n      payment_stage: input.payment_stage || null,\n      membership_write_through: input.membership_write_through || null,\n      manual_membership_review_required: input.manual_membership_review_required === true,\n      money_truth_changed: input.decision === "approve" && input.authority === "payments-worker",`,
            'audit after json'
          );

          runtime = replaceOnce(
            runtime,
            `function confidenceOrNull(value) {`,
            `function safeMembershipWriteThrough(value) {\n  if (!value || typeof value !== "object" || Array.isArray(value)) return null;\n  return {\n    status: safeCode(value.status),\n    reason: safeCode(value.reason),\n    action: safeCode(value.action),\n    package_code: canonicalPackageCode(value.package_code) || safeCode(value.package_code),\n    capability: safeCode(value.capability),\n    current_expire_at: isoOrText(value.current_expire_at) || null,\n    start_at: isoOrText(value.start_at) || null,\n    expire_at: isoOrText(value.expire_at) || null,\n    membership_term: safeCode(value.membership_term),\n    membership_expiry_rule: safeCode(value.membership_expiry_rule),\n    confidence: confidenceOrNull(value.confidence),\n    duplicate: value.duplicate === true,\n    manual_reconciliation_required: value.manual_reconciliation_required === true,\n  };\n}\n\nfunction confidenceOrNull(value) {`,
            'receipt helper'
          );

          fs.writeFileSync(runtimeFile, runtime);

          const uiFile = 'webflow/internal/admin/payments/money-control-v3.html';
          let ui = fs.readFileSync(uiFile, 'utf8');
          ui = ui.replaceAll('money-control-v3-evidence-context-20260912', 'money-control-v4-entitlement-receipt-20260913');
          const toastOld = `toast(kind.toUpperCase()+' สำเร็จ'+(d.duplicate?' · idempotent replay':''));`;
          const toastNew = `var notice=kind.toUpperCase()+' สำเร็จ'+(d.duplicate?' · idempotent replay':'');var wt=d.membership_write_through;if(kind==='approve'&&wt){if(wt.status==='materialized'){var actionLabel=wt.action==='renewal'?'ต่ออายุ':'เปิดสมาชิก';notice='ยืนยันเงินแล้ว · '+actionLabel+(wt.package_code?' '+String(wt.package_code).toUpperCase():'')+(wt.expire_at?' · ถึง '+date(wt.expire_at):'');if(wt.duplicate)notice+=' · ตรวจซ้ำแล้ว';}else if(wt.status==='review_required'||wt.status==='failed'){notice='ยืนยันเงินแล้ว · Membership Review'+(wt.reason?' · '+wt.reason:' · ต้องตรวจสิทธิ์ต่อ');}}toast(notice);`;
          if (!ui.includes(toastOld)) throw new Error('payment UI toast marker not found');
          ui = ui.replace(toastOld, toastNew);
          fs.writeFileSync(uiFile, ui);
          NODE
          node --check admin-worker/src/payment-review-runtime.js
          grep -F 'safeMembershipWriteThrough' admin-worker/src/payment-review-runtime.js
          grep -F 'membership_write_through:' admin-worker/src/payment-review-runtime.js
          grep -F 'manual_membership_review_required:' admin-worker/src/payment-review-runtime.js
          grep -F 'money-control-v4-entitlement-receipt-20260913' webflow/internal/admin/payments/money-control-v3.html
          grep -F 'Membership Review' webflow/internal/admin/payments/money-control-v3.html
      - name: Remove temporary patch workflow and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-patch-payment-membership-receipt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-worker/src/payment-review-runtime.js webflow/internal/admin/payments/money-control-v3.html .github/workflows/tmp-patch-payment-membership-receipt.yml
          git commit -m "feat(payments): surface entitlement receipt in admin review"
          git push origin HEAD:feat/payment-resolver-entitlement-write-through-20260913
