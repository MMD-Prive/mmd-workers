name: LINE OFC follower sync production smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "member-dashboard-chat-worker/src/line-ofc-follower-sync.mjs"
      - "member-dashboard-chat-worker/src/mmd-rich-menu-scheduled-runtime.mjs"
      - ".github/workflows/line-ofc-follower-sync-production-smoke.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      WORKER_NAME: "member-dashboard-chat-worker"
    steps:
      - name: Query count-only follower sync receipt from Workers Logs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const token = String(process.env.CLOUDFLARE_API_TOKEN || "").replace(/[\r\n\u2028\u2029]/g, "").trim();
          const account = String(process.env.CLOUDFLARE_ACCOUNT_ID || "").trim();
          const worker = String(process.env.WORKER_NAME || "").trim();
          if (!token || !account || !worker) throw new Error("cloudflare_observability_config_missing");

          const allow = new Set([
            "ok", "supported", "skipped", "reason", "error", "followers_returned", "pages",
            "clients_scanned", "already_canonical", "duplicate_line_identity_review", "missing_clients",
            "clients_created", "clients_create_planned", "clients_updated", "clients_update_planned",
            "profiles_requested", "profile_errors", "membership_mutation", "entitlement_mutation",
            "points_mutation", "payment_mutation", "job_mutation", "session_mutation", "started_at", "completed_at"
          ]);

          function scrub(value) {
            const out = {};
            if (!value || typeof value !== "object" || Array.isArray(value)) return out;
            for (const [key, item] of Object.entries(value)) if (allow.has(key)) out[key] = item;
            return out;
          }

          function strings(value, out = []) {
            if (typeof value === "string") { out.push(value); return out; }
            if (Array.isArray(value)) { for (const item of value) strings(item, out); return out; }
            if (value && typeof value === "object") for (const item of Object.values(value)) strings(item, out);
            return out;
          }

          function parseReceipt(text) {
            const marker = "line_ofc_follower_sync";
            const pos = text.indexOf(marker);
            if (pos < 0) return null;
            const jsonStart = text.indexOf("{", pos + marker.length);
            if (jsonStart < 0) return { marker, raw_status: text.includes("failed") ? "failed" : "seen" };
            try { return scrub(JSON.parse(text.slice(jsonStart))); }
            catch { return { marker, raw_status: text.includes("failed") ? "failed" : "seen_unparsed" }; }
          }

          async function query(filters) {
            const to = Date.now();
            const from = to - 30 * 60 * 1000;
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/observability/telemetry/query`, {
              method: "POST",
              headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
              body: JSON.stringify({
                queryId: "mmd-line-ofc-follower-sync-production-smoke",
                timeframe: { from, to },
                view: "events",
                limit: 500,
                parameters: { filterCombination: "and", filters },
              }),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.success === false) {
              const message = payload?.errors?.map((x) => x?.message).filter(Boolean).join("; ") || `http_${response.status}`;
              throw new Error(`observability_query_failed:${message}`);
            }
            return payload;
          }

          (async () => {
            let payload = await query([
              { key: "$metadata.service", operation: "eq", type: "string", value: worker },
              { key: "$metadata.message", operation: "includes", type: "string", value: "line_ofc_follower_sync" },
            ]);
            let found = strings(payload).filter((value) => value.includes("line_ofc_follower_sync"));
            if (!found.length) {
              payload = await query([
                { key: "$metadata.service", operation: "eq", type: "string", value: worker },
              ]);
              found = strings(payload).filter((value) => value.includes("line_ofc_follower_sync"));
            }
            const receipts = found.map(parseReceipt).filter(Boolean);
            const unique = [];
            const seen = new Set();
            for (const receipt of receipts) {
              const key = JSON.stringify(receipt);
              if (!seen.has(key)) { seen.add(key); unique.push(receipt); }
            }
            const report = {
              ok: true,
              worker,
              window_minutes: 30,
              receipt_found: unique.length > 0,
              receipts: unique.slice(0, 10),
              checked_at: new Date().toISOString(),
            };
            fs.writeFileSync("/tmp/line-ofc-follower-sync-smoke.json", JSON.stringify(report, null, 2) + "\n");
            console.log(JSON.stringify(report));
            if (!report.receipt_found) process.exitCode = 2;
          })().catch((error) => {
            const report = { ok: false, error: String(error?.message || error).slice(0, 400), checked_at: new Date().toISOString() };
            fs.writeFileSync("/tmp/line-ofc-follower-sync-smoke.json", JSON.stringify(report, null, 2) + "\n");
            console.error(JSON.stringify(report));
            process.exitCode = 1;
          });
          NODE

      - name: Upload count-only smoke receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-ofc-follower-sync-production-smoke
          path: /tmp/line-ofc-follower-sync-smoke.json
          if-no-files-found: warn
          retention-days: 14
