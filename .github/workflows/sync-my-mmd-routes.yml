name: Sync My MMD production routes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-my-mmd-routes.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-my-mmd-production-routes
  cancel-in-progress: false

jobs:
  sync-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      WORKER_NAME: "member-dashboard-chat-worker"

    steps:
      - name: Normalize and verify route token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const token = String(process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          if (!token) throw new Error("CLOUDFLARE_ROUTES_API_TOKEN is missing");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${token}\n`);
          NODE
          body="$(mktemp)"
          code="$(curl --silent --show-error -o "$body" -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_ROUTES_API_TOKEN}" || true)"
          if [ "$code" != "200" ]; then
            code="$(curl --silent --show-error -o "$body" -w "%{http_code}" \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
              -H "Authorization: Bearer ${CLOUDFLARE_ROUTES_API_TOKEN}" || true)"
          fi
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (body.success !== true) throw new Error(`Cloudflare route token verification failed: ${JSON.stringify(body.errors || [])}`);
          NODE

      - name: Sync bounded My MMD routes
        id: route_sync
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = process.env.WORKER_NAME;
          const desired = [
            "mmdbkk.com/my-mmd*",
            "www.mmdbkk.com/my-mmd*",
            "mmdbkk.com/my-mmd-assets/*",
            "www.mmdbkk.com/my-mmd-assets/*",
            "mmdbkk.com/member/my-mmd*",
            "www.mmdbkk.com/member/my-mmd*",
            "mmdbkk.com/member/my-mmd-assets/*",
            "www.mmdbkk.com/member/my-mmd-assets/*",
            "mmdbkk.com/api/member/app/*",
            "www.mmdbkk.com/api/member/app/*",
          ];
          const endpoint = `https://api.cloudflare.com/client/v4/zones/${zoneId}/workers/routes`;
          const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(options = {}) {
            let last;
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              const response = await fetch(endpoint, { ...options, headers: { ...headers, ...(options.headers || {}) } });
              const text = await response.text();
              let body = null;
              try { body = JSON.parse(text); } catch {}
              if (response.ok && body?.success === true) return body.result;
              last = new Error(body ? JSON.stringify(body.errors || body) : `cloudflare_non_json_${response.status}:${text.slice(0, 180)}`);
              if (!(response.status === 429 || response.status >= 500) || attempt === 5) throw last;
              await sleep(attempt * 1000);
            }
            throw last;
          }

          const before = await request();
          for (const pattern of desired) {
            const conflict = before.find((route) => route.pattern === pattern && route.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || "none"}`);
          }
          for (const pattern of desired) {
            if (before.some((route) => route.pattern === pattern && route.script === worker)) {
              console.log(`already owned ${pattern}`);
              continue;
            }
            await request({ method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
          }
          const after = await request();
          const missing = desired.filter((pattern) => !after.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`missing My MMD routes: ${missing.join(", ")}`);
          console.log(`verified ${desired.length}/${desired.length} My MMD routes`);
          NODE

      - name: Smoke canonical My MMD Lovable app ownership
        id: mymmd_smoke
        shell: bash
        run: |
          set -euo pipefail
          for host in www.mmdbkk.com mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sSL -D "$headers" -o "$body" -w "%{http_code}" \
              "https://${host}/my-mmd/")"
            echo "${host} /my-mmd/ final -> ${code}"
            test "$code" = "200"
            grep -qi '^x-mmd-route-owner: member-dashboard-chat-worker' "$headers"
            grep -qi '^x-mmd-ui-source: lovable-full-app-proxy' "$headers"
            grep -qi '^x-mmd-presentation-owner: lovable' "$headers"
            grep -qi '^x-mmd-behavior-owner: mmd-workers' "$headers"
            if grep -q 'MY MMD · PRIVATE MEMBER SPACE' "$body"; then
              echo "Webflow fallback still owns ${host}/my-mmd/" >&2
              exit 1
            fi
            if grep -q 'data-mmd-shell="lovable-single-file-v1"' "$body"; then
              echo "legacy single-file shell still owns ${host}/my-mmd/" >&2
              exit 1
            fi

            asset_path="$(node - "$body" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const match = html.match(/\/my-mmd-assets\/[^"'`\s<>]+/);
          if (!match) process.exit(2);
          process.stdout.write(match[0]);
          NODE
            )"
            echo "${host} live asset -> ${asset_path}"
            asset_headers="$(mktemp)"
            asset_body="$(mktemp)"
            asset_code="$(curl --retry 4 --retry-delay 2 --retry-all-errors -sSL -D "$asset_headers" -o "$asset_body" -w "%{http_code}" \
              "https://${host}${asset_path}")"
            echo "${host} ${asset_path} final -> ${asset_code}"
            test "$asset_code" = "200"
            test -s "$asset_body"
            grep -qi '^content-type:' "$asset_headers"
            grep -qi '^x-mmd-route-owner: member-dashboard-chat-worker' "$asset_headers"
            grep -qi '^x-mmd-ui-source: lovable-full-app-proxy' "$asset_headers"
            grep -qi '^x-mmd-presentation-owner: lovable' "$asset_headers"

            legacy_headers="$(mktemp)"
            legacy_code="$(curl --retry 4 --retry-delay 2 --retry-all-errors -sS -D "$legacy_headers" -o /dev/null -w "%{http_code}" \
              "https://${host}/member/my-mmd")"
            echo "${host} legacy /member/my-mmd -> ${legacy_code}"
            test "$legacy_code" = "308"
            grep -qi '^location: https://.*\/my-mmd/' "$legacy_headers"

            api_headers="$(mktemp)"
            api_body="$(mktemp)"
            api_code="$(curl --retry 4 --retry-delay 2 --retry-all-errors -sSL -D "$api_headers" -o "$api_body" -w "%{http_code}" \
              -H 'accept: application/json' "https://${host}/api/member/app/dashboard")"
            echo "${host} /api/member/app/dashboard no-session -> ${api_code}"
            test "$api_code" = "401"
            grep -qi '^x-mmd-route-owner: member-dashboard-chat-worker' "$api_headers"
            grep -qi '^x-mmd-upstream-service: member-pages-worker' "$api_headers"
          done

      - name: Record route-live receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "✅ MY MMD LOVABLE APP ROUTES LIVE VERIFIED\n\n- source_sha: \`${GITHUB_SHA}\`\n- checked_at: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`\n- canonical app: \`/my-mmd/\` with Lovable presentation through \`member-dashboard-chat-worker\`\n- behavior/data: \`/api/member/app/*\` remains Worker/BFF-owned\n- legacy \`/member/my-mmd\` returns bounded 308 to \`/my-mmd/\`\n- headers prove \`x-mmd-ui-source=lovable-full-app-proxy\`, \`x-mmd-presentation-owner=lovable\`, \`x-mmd-behavior-owner=mmd-workers\`\n- live \`/my-mmd-assets/*\` GET returns 200 with Worker/Lovable ownership headers and non-empty body\n- unauthenticated \`/api/member/app/dashboard\` is strictly 401 and proves \`x-mmd-upstream-service=member-pages-worker\`\n- Webflow fallback and legacy single-file shell are absent from the canonical response\n- verification does not create or widen member authority"
