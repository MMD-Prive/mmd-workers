name: Model Drive Directory

on:
  pull_request:
    paths:
      - "member-pages-worker/src/model-drive-directory.js"
      - "member-pages-worker/src/runtime-index.js"
      - "member-pages-worker/test/model-drive-directory.test.mjs"
      - "admin-worker/src/unified-model-drive-link.js"
      - "admin-worker/src/admin-model-line-link-worker.js"
      - "admin-worker/src/model-line-avatar-review.js"
      - "admin-worker/model-line-link-review.test.mjs"
      - ".github/workflows/model-drive-directory-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check member-pages-worker/src/model-drive-directory.js
          node --check member-pages-worker/src/runtime-index.js
          node --check admin-worker/src/unified-model-drive-link.js
          node --check admin-worker/src/admin-model-line-link-worker.js
          node --check admin-worker/src/model-line-avatar-review.js
      - name: Contract tests
        run: |
          node --experimental-global-webcrypto --test member-pages-worker/test/model-drive-directory.test.mjs
          node --experimental-global-webcrypto --test admin-worker/model-line-link-review.test.mjs
      - name: Worker dry runs
        run: |
          npx wrangler deploy --dry-run --config member-pages-worker/wrangler.toml
          npx wrangler deploy --dry-run --config admin-worker/wrangler.toml
