name: History Materializer Contract

on:
  pull_request:
    paths:
      - "scripts/line-official-legacy/historical-note-parser.js"
      - "scripts/line-official-legacy/historical-note-parser.test.js"
      - "scripts/line-official-legacy/history-materializer.js"
      - "scripts/line-official-legacy/history-materializer.test.js"
      - "scripts/line-official-legacy/history-materializer-v2.js"
      - "scripts/line-official-legacy/history-materializer-v2.test.js"
      - "scripts/line-official-legacy/model-identity-resolver.js"
      - "scripts/line-official-legacy/model-identity-resolver.test.js"
      - "scripts/line-official-legacy/history-review-queue.js"
      - "scripts/line-official-legacy/history-review-queue.test.js"
      - "scripts/line-official-legacy/history-batch-migrate.js"
      - "scripts/line-official-legacy/client-lifecycle-reconciliation.js"
      - "scripts/line-official-legacy/client-lifecycle-reconciliation.test.js"
      - "scripts/line-official-legacy/client-lifecycle-reconciliation-v2.js"
      - "scripts/line-official-legacy/client-lifecycle-reconciliation-v2.test.js"
      - "scripts/line-official-legacy/history-evidence-intake.js"
      - "scripts/model-history/model-history-evidence-intake.js"
      - "scripts/model-history/model-history-evidence-intake.test.js"
      - "scripts/model-history/README.md"
      - "scripts/line-official-legacy/dry-run-import.js"
      - "auth-worker/src/member-entitlement-resolver.js"
      - "docs/ops/HISTORY_MATERIALIZER_V1.md"
      - ".github/workflows/history-materializer-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --check scripts/line-official-legacy/historical-note-parser.js
      - run: node --check scripts/model-history/model-history-evidence-intake.js
      - run: node --check scripts/line-official-legacy/history-review-queue.js
      - run: node --check scripts/line-official-legacy/history-materializer.js
      - run: node --check scripts/line-official-legacy/history-materializer-v2.js
      - run: node --check scripts/line-official-legacy/model-identity-resolver.js
      - run: node --check scripts/line-official-legacy/history-batch-migrate.js
      - run: node --check scripts/line-official-legacy/client-lifecycle-reconciliation.js
      - run: node --check scripts/line-official-legacy/client-lifecycle-reconciliation-v2.js
      - run: node --test scripts/line-official-legacy/historical-note-parser.test.js scripts/line-official-legacy/history-review-queue.test.js scripts/line-official-legacy/history-materializer.test.js scripts/line-official-legacy/history-materializer-v2.test.js scripts/line-official-legacy/model-identity-resolver.test.js scripts/line-official-legacy/client-lifecycle-reconciliation.test.js scripts/line-official-legacy/client-lifecycle-reconciliation-v2.test.js scripts/model-history/model-history-evidence-intake.test.js
