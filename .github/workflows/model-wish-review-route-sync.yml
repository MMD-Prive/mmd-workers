name: Sync Model Wish review routes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/src/model-direct-wish.js"
      - "admin-worker/src/admin-login-hero-worker-pre-model-line-link.js"
      - ".github/workflows/model-wish-review-route-sync.yml"
  workflow_run:
    workflows:
      - Deploy admin-worker
    types:
      - completed

permissions:
  contents: read

jobs:
  sync-route:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
    steps:
      - name: Point Model Wish review endpoints to admin-worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = (process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").trim();
          const worker = "admin-worker";
          if (!token) throw new Error("CLOUDFLARE_ROUTES_API_TOKEN is missing");

          const desired = [
            "mmdbkk.com/v1/admin/model-wishes/review-queue",
            "www.mmdbkk.com/v1/admin/model-wishes/review-queue",
            "mmdbkk.com/v1/admin/model-wishes/review-queue*",
            "www.mmdbkk.com/v1/admin/model-wishes/review-queue*",
            "mmdbkk.com/v1/admin/model-wishes/review",
            "www.mmdbkk.com/v1/admin/model-wishes/review",
          ];

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing to replace existing routes: ${conflicts.map((route) => `${route.pattern} -> ${route.script || "no script"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Route verification failed: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length} Model Wish review routes`);
          NODE

      - name: Verify unauthenticated review routes fail closed
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            queue_body="$(mktemp)"
            queue_code="$(curl -L --max-redirs 3 --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -o "$queue_body" -w "%{http_code}" \
              "$origin/v1/admin/model-wishes/review-queue")"
            cat "$queue_body"
            case "$queue_code" in 401|403) ;; *) echo "unexpected queue status: $queue_code"; exit 1;; esac

            review_body="$(mktemp)"
            review_code="$(curl -L --max-redirs 3 --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -o "$review_body" -w "%{http_code}" \
              -H 'content-type: application/json' \
              --data '{"record_id":"rec00000000000000","decision":"approve"}' \
              "$origin/v1/admin/model-wishes/review")"
            cat "$review_body"
            case "$review_code" in 401|403) ;; *) echo "unexpected review status: $review_code"; exit 1;; esac
          done
