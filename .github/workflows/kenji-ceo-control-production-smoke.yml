name: Kenji CEO Control production smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/**"
      - ".github/workflows/deploy-admin-worker.yml"
      - ".github/workflows/kenji-ceo-control-production-smoke.yml"

concurrency:
  group: kenji-ceo-control-production-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
    steps:
      - name: Verify route token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ROUTES_API_TOKEN:-}"
          response_file="$(mktemp)"
          http_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -o "$response_file" -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$http_code" = "200"
          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.success !== true || payload.result?.status !== "active") {
            throw new Error("Cloudflare routes token is not active");
          }
          NODE

      - name: Sync and inspect query-safe Kenji CEO control routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "admin-worker";
          const patterns = [
            "/v1/admin/kenji/control/memory*",
            "/v1/admin/kenji/control/conversations*",
            "/v1/admin/kenji/control/approvals*",
          ];
          const desired = patterns.flatMap((pattern) => [
            `mmdbkk.com${pattern}`,
            `www.mmdbkk.com${pattern}`,
          ]);

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing to replace existing routes: ${conflicts.map((route) => `${route.pattern} -> ${route.script || "no script"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) {
            throw new Error(`Route verification failed: ${unresolved.join(", ")}`);
          }
          console.log(`Verified ${desired.length}/${desired.length} query-safe Kenji CEO control routes; created ${missing.length}`);

          const relevant = verified
            .filter((route) => /mmdbkk\.com/.test(route.pattern || "") && (/kenji\/control/.test(route.pattern || "") || /\/v1\/admin\/.*\*/.test(route.pattern || "")))
            .map((route) => ({ pattern: route.pattern, script: route.script || null }))
            .sort((a, b) => b.pattern.length - a.pattern.length);
          console.log("Relevant Cloudflare route candidates:");
          for (const route of relevant) console.log(`${route.pattern} -> ${route.script || "<no script>"}`);
          NODE

      - name: Smoke unauthenticated CEO control endpoints with diagnostics
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for origin in https://www.mmdbkk.com https://mmdbkk.com; do
            for endpoint in \
              "/v1/admin/kenji/control/memory?client_id=smoke" \
              "/v1/admin/kenji/control/conversations?client_id=smoke" \
              "/v1/admin/kenji/control/approvals?status=pending"
            do
              body_file="$(mktemp)"
              headers_file="$(mktemp)"
              http_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
                -D "$headers_file" -o "$body_file" -w "%{http_code}" "$origin$endpoint" || true)"
              echo "=== $origin$endpoint ==="
              echo "HTTP $http_code"
              grep -Ei '^(HTTP/|location:|server:|cf-ray:|content-type:|x-mmd-|x-powered-by:)' "$headers_file" || true
              cat "$body_file"
              echo
              if [ "$http_code" != "401" ] || ! grep -q '"error":"unauthorized"' "$body_file"; then
                failed=1
              fi
            done
          done
          if [ "$failed" -ne 0 ]; then
            echo "Kenji CEO Control production smoke failed; diagnostics printed above" >&2
            exit 1
          fi
          echo "Kenji CEO Control production smoke passed on apex and www"
