name: Owner Review Gallery · Mock-Only Security Checks

on:
  pull_request:
    paths:
      - "owner-review-gallery-worker/**"
      - ".github/workflows/owner-review-gallery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check owner-review-gallery-worker/src/catalog.mjs
          node --check owner-review-gallery-worker/src/ui.mjs
          node --check owner-review-gallery-worker/src/index.mjs
          node --check owner-review-gallery-worker/src/deploy-entry.mjs
          node --check owner-review-gallery-worker/test/gallery.test.mjs
      - name: Read-only access and mock isolation tests
        run: node --test owner-review-gallery-worker/test/*.test.mjs
