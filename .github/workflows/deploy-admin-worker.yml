name: Deploy admin-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/**"
      - "knowledge/kenji/**"
      - ".github/workflows/deploy-admin-worker.yml"

concurrency:
  group: deploy-admin-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_DASHBOARD_PRODUCTION_URL: https://admin-worker.malemodel-bkk.workers.dev/v1/admin/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare token
        id: credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_API_TOKEN);
          if (!token) throw new Error("Cloudflare API token is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${token}\n`);
          NODE

      - name: Verify Cloudflare token account
        id: whoami
        shell: bash
        run: npx --yes wrangler@4 whoami

      - name: Run tests and source validation
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/admin-login-hero-worker.js
          node --check src/admin-login-page.js
          node --check src/dashboard-worker.js
          node --test \
            admin-login-hero.test.mjs \
            admin-login-regression-guard.test.mjs \
            admin-login-session.test.mjs
          node ../knowledge/kenji/validate.mjs
          node --test \
            kenji-knowledge-runtime-storage.test.mjs \
            kenji-public-knowledge-runtime.test.mjs

      - name: Validate Cloudflare deployment
        id: wrangler_dry_run
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars

      - name: Deploy admin-worker
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --keep-vars 2>&1 | tee "$RUNNER_TEMP/admin-worker-deploy.log"

      - name: Verify production dashboard route
        id: smoke
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" "$ADMIN_DASHBOARD_PRODUCTION_URL")"
          cat "$body_file"
          test "$http_code" = "401"
          grep -q '"error":"unauthorized"' "$body_file"

      - name: Report deploy stage diagnosis
        if: always()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          WHOAMI_OUTCOME: ${{ steps.whoami.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.wrangler_dry_run.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$CREDENTIALS_OUTCOME" != "success" ]; then
            stopped="cloudflare token normalization"
          elif [ "$WHOAMI_OUTCOME" != "success" ]; then
            stopped="cloudflare token account preflight"
          elif [ "$TESTS_OUTCOME" != "success" ]; then
            stopped="tests"
          elif [ "$DRY_RUN_OUTCOME" != "success" ]; then
            stopped="wrangler dry-run"
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            stopped="wrangler deploy"
          elif [ "$SMOKE_OUTCOME" != "success" ]; then
            stopped="production smoke"
          else
            stopped="none — live verified"
          fi

          deploy_detail=""
          if [ -f "$RUNNER_TEMP/admin-worker-deploy.log" ]; then
            deploy_detail="$(grep -Ei 'error|failed|permission|route|conflict|workers.dev|code:|code ' "$RUNNER_TEMP/admin-worker-deploy.log" | tail -n 30 || true)"
          fi
          if [ -z "$deploy_detail" ]; then
            deploy_detail="No focused Wrangler error lines captured."
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ### admin-worker deploy diagnosis

          - source_sha: \`${GITHUB_SHA}\`
          - checked_at: \`${checked_at}\`
          - token normalization: \`${CREDENTIALS_OUTCOME}\`
          - wrangler whoami: \`${WHOAMI_OUTCOME}\`
          - tests: \`${TESTS_OUTCOME}\`
          - wrangler dry-run: \`${DRY_RUN_OUTCOME}\`
          - wrangler deploy: \`${DEPLOY_OUTCOME}\`
          - production smoke: \`${SMOKE_OUTCOME}\`
          - **stopped_at: \`${stopped}\`**

          Wrangler deploy detail:
          \`\`\`text
          ${deploy_detail}
          \`\`\`
          EOF
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body-file "$body_file"

      - name: Record verified live receipt on launch issue
        if: steps.smoke.outcome == 'success'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "✅ admin-worker LIVE VERIFIED\n\n- source_sha: \`${GITHUB_SHA}\`\n- deployed_at: \`${deployed_at}\`\n- endpoint: \`${ADMIN_DASHBOARD_PRODUCTION_URL}\`\n- production smoke: \`401 unauthorized\`\n\nThis receipt is written only after Wrangler deploy succeeds and the production Worker returns the expected auth-guard response."
