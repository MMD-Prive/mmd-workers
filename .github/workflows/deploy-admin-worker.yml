name: Deploy admin-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/**"
      - "shared/mmd-shop-stock-reservation.mjs"
      - "shared/control-room-v2-system-health.mjs"
      - "shared/posthog-conversion-canon.mjs"
      - "shared/posthog-conversion-canon.test.mjs"
      - "shared/mmd-shop-fulfillment.mjs"
      - "shared/mmd-shop-stock-reconciliation.mjs"
      - "shared/private-media.mjs"
      - "scripts/ensure-private-media-bucket.mjs"
      - "knowledge/kenji/**"
      - ".github/workflows/deploy-admin-worker.yml"
      - ".github/workflows/model-media-real-e2e-production-smoke.yml"
      - "shared/payment-intelligence.mjs"
      - "shared/payment-notification-outbox*"
      - "shared/kenji-continuity-operator-draft*"
      - "shared/test/payment-memory-r2.mjs"
      - "scripts/ensure-payment-notification-cron*"

concurrency:
  group: deploy-admin-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      ADMIN_DASHBOARD_PRODUCTION_URL: https://mmdbkk.com/v1/admin/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Normalize Cloudflare tokens
        id: credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const deployToken = clean(process.env.CLOUDFLARE_API_TOKEN);
          const routesToken = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          if (!deployToken) throw new Error("Cloudflare deploy API token is missing after normalization");
          if (!routesToken) throw new Error("Cloudflare routes API token is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${deployToken}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${routesToken}\n`);
          NODE

      - name: Verify Cloudflare token account
        id: whoami
        shell: bash
        run: npx --yes wrangler@4 whoami

      - name: Run tests and source validation
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix .. run test:payment-delivery
          node --check src/admin-payment-review-entry.js
          node --check src/payment-review-runtime.js
          node --check src/payment-approved-job-link-dispatch.js
          node --check src/telegram-identity-bind-authority.js
          node --check src/admin-login-hero-worker.js
          node --check src/owner-private-job-grant-create.js
          node --check src/mmd-shop-orders-admin.js
          node --check src/mmd-shop-operations-admin.js
          node --check src/payments-issuer-transport.js
          node --check src/payment-issuer-diagnostic.js
          node --check src/hype-shop-orders.js
          node --check src/recovery-control.js
          node --check src/recovery-control-page.js
          node --check src/cancellation-credit-recovery.js
          node --check src/hype-owner-summary.js
          node --check src/model-media-e2e-smoke.js
          node --check src/model-owner-review-queue.js
          node --experimental-global-webcrypto --test payment-issuer-diagnostic.test.mjs hype-shop-orders.test.mjs hype-handoff-runtime.test.mjs hype-recovery-picker-stale.test.mjs hype-owner-summary.test.mjs hype-cross-system-stuck-sla.test.mjs owner-actions-queue.test.mjs owner-actions-triage.test.mjs dashboard-canonical-payment-counts.test.mjs mms-owner-actions-bau.test.mjs recovery-control.test.mjs cancellation-credit-recovery.test.mjs client-credit-verification.test.mjs model-media-e2e-smoke.test.mjs model-owner-review-queue.test.mjs service-auth-contract.test.mjs payment-approved-job-link-dispatch.test.mjs job-create-flow.test.mjs create-job-fast-trust-access.test.mjs telegram-identity-bind-authority.test.mjs owner-private-job-grant-create.test.mjs
          node --test model-session-runtime-v1a.test.mjs partner-owner-console.test.mjs
          node --check src/admin-login-page.js
          node --check src/dashboard-worker.js
          node --check src/owner-analytics-dashboard.js
          node --test owner-analytics-dashboard.test.mjs ../shared/posthog-conversion-canon.test.mjs
          node --check src/mms-admin-runtime.js
          node --check src/kenji-model-access-rpc.js
          node --check src/sigil-availability-snapshot.js
          node --check ../shared/sigil-availability-snapshot-v1.mjs
          node --check src/kenji-control-endpoints.js
          node --check src/client-intelligence-endpoint.js
          node --check src/client-intelligence-audit.js
          node --check ../shared/kenji-continuity-operator-draft.mjs
          node --check src/kenji-model-admin-adapter.js
          node --check src/kenji-model-workflow.js
          node --check src/payment-entitlement-approval.js
          node --check ../webflow/internal/admin/kenji/kenji-admin-v1.js
          node --check ../webflow/internal/admin/kenji/kenji-admin-ux-overlay.js
          node --test ../webflow/internal/admin/kenji/kenji-admin-v1.test.mjs
          node --test \
            admin-login-hero.test.mjs \
            admin-login-regression-guard.test.mjs \
            admin-login-session.test.mjs \
            mms-admin-session-bounce.test.mjs \
            model-liff-cross-origin-session.test.mjs \
            kenji-model-access-rpc.test.mjs \
            sigil-availability-snapshot.test.mjs \
            ../shared/sigil-availability-snapshot-v1.test.mjs \
            client-intelligence-endpoint.test.mjs \
            client-intelligence-audit.test.mjs \
            ../shared/kenji-continuity-operator-draft.test.mjs \
            kenji-model-admin-adapter.test.mjs \
            kenji-model-workflow.test.mjs \
            payment-entitlement-approval.test.mjs \
            line-slip-intake-review-queue.contract.test.mjs \
            payment-inbox-admin-session.test.mjs
          node ../knowledge/kenji/validate.mjs
          node --test \
            kenji-knowledge-runtime-storage.test.mjs \
            kenji-public-knowledge-runtime.test.mjs

      - name: Pin Kenji admin shell assets to deploy SHA
        id: kenji_shell_pin
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const file = "src/index.js";
          const version = process.env.GITHUB_SHA;
          if (!version) throw new Error("GITHUB_SHA is unavailable");

          const stableCss = "https://models.mmdbkk.com/webflow/internal/admin/kenji/kenji-admin-v1.css";
          const stableJs = "https://models.mmdbkk.com/webflow/internal/admin/kenji/kenji-admin-v1.js";
          const versionedCss = `${stableCss}?v=${version}`;
          const versionedJs = `${stableJs}?v=${version}`;
          const source = fs.readFileSync(file, "utf8");

          if (!source.includes(stableCss) || !source.includes(stableJs)) {
            throw new Error("Kenji admin stable shell asset markers are missing");
          }

          const next = source
            .replace(stableCss, versionedCss)
            .replace(stableJs, versionedJs);

          if (!next.includes(versionedCss) || !next.includes(versionedJs)) {
            throw new Error("Failed to pin Kenji admin shell assets to GITHUB_SHA");
          }

          fs.writeFileSync(file, next);
          console.log(`Pinned Kenji admin shell JS/CSS to ${version}`);
          NODE
          node --check src/index.js
          grep -Fq "kenji-admin-v1.css?v=${GITHUB_SHA}" src/index.js
          grep -Fq "kenji-admin-v1.js?v=${GITHUB_SHA}" src/index.js

      - name: Verify private media storage and security tests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          node ../scripts/ensure-private-media-bucket.mjs
          node --experimental-global-webcrypto --test ../shared/private-media.test.mjs model-schema-patch-v1.test.mjs

      - name: Ensure SIGIL availability KV binding
        id: availability_kv
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          (async () => {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = (process.env.CLOUDFLARE_API_TOKEN || "").trim();
            const title = "MMD_SIGIL_AVAILABILITY_SNAPSHOTS_V1";
            if (!account || !token) throw new Error("Cloudflare KV credentials are missing");
            const api = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces`;
            const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
            const call = async (url, init = {}) => {
              const response = await fetch(url, { ...init, headers: { ...headers, ...(init.headers || {}) } });
              const data = await response.json().catch(() => ({}));
              if (!response.ok || data.success !== true) throw new Error(JSON.stringify(data.errors || data));
              return data.result;
            };
            const namespaces = await call(`${api}?per_page=1000&order=title&direction=asc`);
            let namespace = namespaces.find((item) => item.title === title);
            if (!namespace) namespace = await call(api, { method: "POST", body: JSON.stringify({ title }) });
            if (!/^[a-f0-9]{32}$/i.test(String(namespace.id || ""))) throw new Error("Cloudflare returned an invalid KV namespace ID");

            const source = fs.readFileSync("wrangler.toml", "utf8").trimEnd();
            const binding = source.includes('binding = "SIGIL_AVAILABILITY_SNAPSHOTS"') ? "" : [
              "",
              "# GENERATED SIGIL AVAILABILITY KV",
              "[[kv_namespaces]]",
              'binding = "SIGIL_AVAILABILITY_SNAPSHOTS"',
              `id = "${namespace.id}"`,
              "",
            ].join("\n");
            const output = ".wrangler-admin-production.toml";
            fs.writeFileSync(output, `${source}${binding}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `ADMIN_WORKER_WRANGLER_CONFIG=${output}\n`);
            console.log(`Resolved ${title} for SIGIL_AVAILABILITY_SNAPSHOTS`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          grep -Fq 'binding = "SIGIL_AVAILABILITY_SNAPSHOTS"' .wrangler-admin-production.toml
      - name: Validate Cloudflare version upload
        id: wrangler_dry_run
        shell: bash
        run: |
          npx --yes wrangler@4 versions upload --dry-run --keep-vars \
            --config "${ADMIN_WORKER_WRANGLER_CONFIG}" \
            --var "ADMIN_WORKER_BUILD_SHA:${GITHUB_SHA}"

      - name: Upload admin-worker version
        id: upload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tag="gha-${GITHUB_SHA:0:12}"
          echo "ADMIN_WORKER_VERSION_TAG=${tag}" >> "$GITHUB_ENV"
          npx --yes wrangler@4 versions upload \
            --keep-vars \
            --config "${ADMIN_WORKER_WRANGLER_CONFIG}" \
            --var "ADMIN_WORKER_BUILD_SHA:${GITHUB_SHA}" \
            --tag "$tag" \
            --message "GitHub Actions ${GITHUB_SHA}" \
            2>&1 | tee "$RUNNER_TEMP/admin-worker-upload.log"

      - name: Apply Durable Object migration with direct deploy
        id: migration_deploy
        if: steps.upload.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq 'code:[[:space:]]*10211|\[code:[[:space:]]*10211\]' "$RUNNER_TEMP/admin-worker-upload.log"; then
            echo "Version upload failed for a reason other than Cloudflare Durable Object migration code 10211; refusing direct-deploy fallback." >&2
            cat "$RUNNER_TEMP/admin-worker-upload.log" >&2
            exit 1
          fi
          echo "Cloudflare requires a non-versioned deployment to apply the Durable Object migration; applying the migration without mutating routes."
          echo "ADMIN_WORKER_VERSION_ID=direct-deploy-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          migration_config=".wrangler-migration-no-routes.toml"
          node <<'NODE'
          const fs = require("node:fs");
          const config = process.env.ADMIN_WORKER_WRANGLER_CONFIG || "wrangler.toml";
          const input = fs.readFileSync(config, "utf8").split(/\r?\n/);
          const output = [];
          let skippingRoute = false;
          for (const line of input) {
            if (/^\s*\[\[routes\]\]\s*$/.test(line)) {
              skippingRoute = true;
              continue;
            }
            if (skippingRoute && /^\s*\[/.test(line)) skippingRoute = false;
            if (!skippingRoute) output.push(line);
          }
          fs.writeFileSync(".wrangler-migration-no-routes.toml", `${output.join("\n")}\n`);
          NODE
          trap 'rm -f "$migration_config"' EXIT
          if grep -q '^\s*\[\[routes\]\]' "$migration_config"; then
            echo "Migration-only Wrangler config still contains routes; refusing deploy." >&2
            exit 1
          fi
          npx --yes wrangler@4 deploy --keep-vars --config "$migration_config" \
            --var "ADMIN_WORKER_BUILD_SHA:${GITHUB_SHA}" \
            2>&1 | tee "$RUNNER_TEMP/admin-worker-deploy.log"

      - name: Resolve uploaded version ID
        id: resolve_version
        if: steps.upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/admin-worker-upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Unable to parse Worker Version ID from upload output" >&2
            cat "$RUNNER_TEMP/admin-worker-upload.log" >&2
            exit 2
          fi
          echo "ADMIN_WORKER_VERSION_ID=${version_id}" >> "$GITHUB_ENV"
          echo "Resolved version ${version_id} from versions upload output"

      - name: Deploy uploaded admin-worker version
        id: deploy
        if: steps.resolve_version.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 versions deploy "${ADMIN_WORKER_VERSION_ID}@100%" -y \
            2>&1 | tee "$RUNNER_TEMP/admin-worker-deploy.log"

      - name: Ensure payment notification retry schedule
        if: steps.deploy.outcome == 'success' || steps.migration_deploy.outcome == 'success'
        run: node ../scripts/ensure-payment-notification-cron.mjs admin-worker

      - name: Validate admin-worker routes and triggers
        id: triggers_dry_run
        if: steps.deploy.outcome == 'success' || steps.migration_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ROUTES_API_TOKEN"
          npx --yes wrangler@4 triggers deploy --dry-run

      - name: Verify Cloudflare routes token
        id: routes_token
        if: steps.triggers_dry_run.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -o "$response_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$http_code" = "200"
          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.success !== true || payload.result?.status !== "active") {
            throw new Error("Cloudflare routes token is not active");
          }
          console.log("Cloudflare routes token is active");
          NODE

      - name: Sync exact admin-worker routes
        id: triggers
        if: steps.routes_token.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee "$RUNNER_TEMP/admin-worker-triggers.log"
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "admin-worker";
          const paths = [
            "/internal/admin/mmd-review*",
            "/v1/admin/private-media*",
            "/v1/admin/line/rich-menu/three-level/prepare",
            "/v1/admin/line/rich-menu/three-level/audit",
            "/internal/admin/kenji",
            "/internal/admin/kenji/",
            "/internal/admin/kenji-knowledge",
            "/internal/admin/kenji-knowledge/",
            "/internal/admin/kenji-knowledge*",
            "/internal/admin/mms",
            "/v1/admin/mms/*",
            "/v1/admin/auth/me",
            "/v1/admin/payment-issuer-diagnostic",
            "/v1/admin/cancellation-credit-recovery",
            "/v1/admin/model-media/e2e-smoke",
            "/v1/admin/models/review-queue*",
            "/v1/admin/membership/payment-entitlement/approve",
            "/v1/admin/payments/review-queue*",
            "/v1/admin/payments/evidence*",
            "/v1/admin/payments/review",
            "/v1/admin/kenji/models",
            "/v1/admin/kenji/models/draft",
            "/v1/admin/kenji/models*",
            "/v1/admin/kenji/knowledge/meta",
            "/v1/admin/kenji/knowledge/list",
            "/v1/admin/kenji/knowledge/draft",
            "/v1/admin/kenji/knowledge/*",
            "/v1/internal/kenji/knowledge/published",
            "/v1/public/kenji/knowledge/published",
            "/v1/public/kenji/knowledge/published*",
            "/v1/admin/job/create",
            "/v1/admin/job/owner-grant",
            "/v1/admin/kenji/control/memory*",
            "/v1/admin/kenji/control/conversations*",
            "/v1/admin/kenji/control/approvals*",
            "/v1/admin/kenji/conversation-shadow-receipt",
            "/v1/model/visibility/update",
            "/v1/model/rate/request",
            "/v1/model/telegram/bind",
            "/v1/model/history",
            "/v1/model/media/upload-init",
            "/v1/model/media/upload-complete",
            "/v1/model/media/review-request",
            "/v1/model/compcard/request",
            "/v1/model/compcard/request*",
            "/v1/model/private-gallery/request",
            "/v1/model/private-flash/request",
            "/internal/admin/recovery",
            "/internal/admin/recovery*",
            "/v1/admin/recovery/cases",
            "/v1/admin/recovery/cases*",
            "/internal/admin/partners*",
            "/v1/admin/partners/*",
            "/internal/admin/shop/orders*",
            "/internal/admin/shop/inventory*",
            "/internal/admin/shop/products*",
            "/v1/admin/shop/orders*",
            "/v1/admin/shop/inventory*",
            "/v1/admin/shop/products*",
            "/v1/model/private-flash/authorize",
          ];
          const desired = paths.flatMap((path) => [
            `mmdbkk.com${path}`,
            `www.mmdbkk.com${path}`,
          ]);

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing to replace existing routes: ${conflicts.map((route) => `${route.pattern} -> ${route.script || "no script"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) {
            throw new Error(`Route verification failed: ${unresolved.join(", ")}`);
          }
          console.log(`Verified ${desired.length}/${desired.length} exact admin-worker routes for ${worker}; created ${missing.length}`);
          NODE

      - name: Verify production dashboard route
        id: smoke
        if: steps.triggers.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" "$ADMIN_DASHBOARD_PRODUCTION_URL")"
          cat "$body_file"
          test "$http_code" = "401"
          grep -q '"error":"unauthorized"' "$body_file"

          # Verify MMD Shop admin APIs are routed to admin-worker and remain session-gated.
          for path in /v1/admin/shop/orders /v1/admin/shop/inventory /v1/admin/shop/products; do
            shop_body="$(mktemp)"
            shop_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$shop_body" -w "%{http_code}" "https://mmdbkk.com${path}")"
            cat "$shop_body"
            test "$shop_code" = "401"
            grep -Eq '"error":"admin_session_required"|"error":"unauthorized"' "$shop_body"
          done

          # Three-level LINE Rich Menu acceptance routes are exact, owner-authenticated
          # admin APIs. Unauthenticated probes must reach admin-worker, never Webflow.
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            rich_prepare_body="$(mktemp)"
            rich_prepare_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$rich_prepare_body" -w "%{http_code}" -X POST "$origin/v1/admin/line/rich-menu/three-level/prepare" -H 'Content-Type: application/json' --data '{}')"
            cat "$rich_prepare_body"
            test "$rich_prepare_code" = "401"
            grep -q '"error":"unauthorized"' "$rich_prepare_body"

            rich_audit_body="$(mktemp)"
            rich_audit_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$rich_audit_body" -w "%{http_code}" "$origin/v1/admin/line/rich-menu/three-level/audit")"
            cat "$rich_audit_body"
            test "$rich_audit_code" = "401"
            grep -q '"error":"unauthorized"' "$rich_audit_body"
          done

          # Recovery Control must be routed to admin-worker and remain credential-session gated.
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            recovery_api_body="$(mktemp)"
            recovery_api_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$recovery_api_body" -w "%{http_code}" "$origin/v1/admin/recovery/cases?limit=1")"
            cat "$recovery_api_body"
            test "$recovery_api_code" = "401"
            grep -Eq '"error":"admin_session_required"|"error":"unauthorized"' "$recovery_api_body"

            recovery_page_headers="$(mktemp)"
            recovery_page_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -D "$recovery_page_headers" -o /dev/null -w "%{http_code}" "$origin/internal/admin/recovery")"
            test "$recovery_page_code" = "303"
            grep -Fqi "location: $origin/internal/admin/login?next=%2Finternal%2Fadmin%2Frecovery" "$recovery_page_headers"
          done

          # The direct workers.dev dashboard is intentionally host-blocked.
          body_file="$(mktemp)"
          http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
            "https://admin-worker.malemodel-bkk.workers.dev/v1/admin/dashboard")"
          test "$http_code" = "403"
          grep -q '"error":"dashboard_host_not_allowed"' "$body_file"

          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            # My Card is model-session-only. This unauthenticated probe must reach
            # admin-worker on both production hosts, never the Webflow fallback.
            my_card_body="$(mktemp)"
            my_card_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$my_card_body" -w "%{http_code}"               "$origin/v1/model/compcard/request")"
            cat "$my_card_body"
            test "$my_card_code" = "401"
            grep -q '"error":"model_session_required"' "$my_card_body"

            # Conversation shadow receipt is owner/admin-only and must reach
            # admin-worker on both production hosts (never the Webflow origin).
            receipt_headers="$(mktemp)"
            receipt_body="$(mktemp)"
            receipt_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -D "$receipt_headers" -o "$receipt_body" -w "%{http_code}" "$origin/v1/admin/kenji/conversation-shadow-receipt")"
            cat "$receipt_body"
            test "$receipt_code" = "401"
            grep -Eiq '^x-mmd-route-owner:[[:space:]]*admin-worker' "$receipt_headers"
            grep -Eq '"error":"owner_admin_session_required"|"error":"unauthorized"|"error":"admin_session_required"' "$receipt_body"

            # Private Media Review must stay behind credential-bound admin auth.
            review_body="$(mktemp)"
            review_code="$(curl -sS --max-time 20 -o "$review_body" -w "%{http_code}" "$origin/v1/admin/private-media")"
            test "$review_code" = "401"
            grep -q '\"error\":\"unauthorized\"' "$review_body"
            review_page_code="$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "$origin/internal/admin/mmd-review")"
            test "$review_page_code" = "303"
            # An empty unauthenticated probe must reach the admin gate, never Webflow.
            diagnostic_body="$(mktemp)"
            diagnostic_code="$(curl -sS --max-time 20 -o "$diagnostic_body" -w "%{http_code}" \
              -X POST -H "Origin: $origin" -H "Content-Type: application/json" --data '{}' \
              "$origin/v1/admin/payment-issuer-diagnostic")"
            test "$diagnostic_code" = "401"
            grep -q '"error":"unauthorized"' "$diagnostic_body"

            # Cancellation-to-credit recovery is an owner-only POST API. An
            # unauthenticated request must reach admin-worker (401), never
            # fall through to the Webflow origin (405).
            cancellation_headers="$(mktemp)"
            cancellation_body="$(mktemp)"
            cancellation_code="$(curl -sS --max-time 20 -D "$cancellation_headers" -o "$cancellation_body" -w "%{http_code}" \
              -X POST -H "Origin: $origin" -H "Content-Type: application/json" --data '{"action":"prepare"}' \
              "$origin/v1/admin/cancellation-credit-recovery")"
            cat "$cancellation_body"
            test "$cancellation_code" = "401"
            grep -Eq '"code":"ADMIN_SESSION_REQUIRED"' "$cancellation_body"

            # Unified Model owner review queue must reach admin-worker and stay behind the owner browser session.
            model_review_queue_body="$(mktemp)"
            model_review_queue_code="$(curl -sS --max-time 20 -o "$model_review_queue_body" -w "%{http_code}" \
              "$origin/v1/admin/models/review-queue?limit=1")"
            cat "$model_review_queue_body"
            test "$model_review_queue_code" = "401"
            grep -q '"error":"unauthorized"' "$model_review_queue_body"

            # Real-model media E2E smoke route must also stay behind the owner browser session.
            model_media_smoke_body="$(mktemp)"
            model_media_smoke_code="$(curl -sS --max-time 20 -o "$model_media_smoke_body" -w "%{http_code}" \
              -X POST -H "Origin: $origin" -H "Content-Type: application/json" \
              --data '{"model_record_id":"recBKaHfxUKs8fkMV"}' \
              "$origin/v1/admin/model-media/e2e-smoke")"
            test "$model_media_smoke_code" = "401"
            grep -q '"error":"unauthorized"' "$model_media_smoke_body"

            # Check the real browser ingress on both allowed production hosts.
            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              "$origin/v1/admin/dashboard")"
            test "$http_code" = "401"
            grep -q '"error":"unauthorized"' "$body_file"

            shell_headers="$(mktemp)"
            shell_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -D "$shell_headers" -o "$shell_file" -w "%{http_code}" \
              "$origin/internal/admin/kenji")"
            test "$http_code" = "303"
            grep -Fqi "location: ${origin}/internal/admin/login?next=%2Finternal%2Fadmin%2Fkenji" "$shell_headers"

            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              "$origin/v1/admin/kenji/models/review-queue?limit=1")"
            cat "$body_file"
            test "$http_code" = "401"
            grep -q '"error":"unauthorized"' "$body_file"

            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: smoke-kenji-model-review-no-auth" \
              --data '{"expected_version":1}' \
              "$origin/v1/admin/kenji/models/reviews/smoke-review-request/review")"
            cat "$body_file"
            test "$http_code" = "401"
            grep -q '"error":"unauthorized"' "$body_file"

            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              "$origin/v1/admin/payments/review-queue?limit=1")"
            cat "$body_file"
            test "$http_code" = "401"
            grep -q '"error":"unauthorized"' "$body_file"

            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              "$origin/v1/admin/payments/evidence?proof_id=smoke")"
            test "$http_code" = "401"
            grep -q '"error":"unauthorized"' "$body_file"

            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: smoke-payment-review-no-auth" \
              --data '{"decision":"reject","proof_id":"smoke","admin_reason":"unauthenticated route ownership smoke"}' \
              "$origin/v1/admin/payments/review")"
            cat "$body_file"
            test "$http_code" = "401"
            grep -q '"error":"unauthorized"' "$body_file"

            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              "$origin/v1/model/private-flash/authorize")"
            cat "$body_file"
            test "$http_code" = "401"
            grep -q '"error":"unauthorized"' "$body_file"

            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/json" \
              --data '{"model_id":"smoke-model","rates":{"minimum_rate_thb":5000}}' \
              "$origin/v1/model/rate/request")"
            cat "$body_file"
            test "$http_code" = "401"
            grep -q '"error":"signed_t_required"' "$body_file"

            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/json" \
              --data '{"decision":"approve","event_id":"smoke-no-auth","approval_reason":"unauthenticated route ownership smoke"}' \
              "$origin/v1/admin/membership/payment-entitlement/approve")"
            cat "$body_file"
            test "$http_code" = "401"
            grep -q '"error":"unauthorized"' "$body_file"

            for endpoint in \
              "/v1/admin/kenji/control/memory?client_id=smoke" \
              "/v1/admin/kenji/control/conversations?client_id=smoke" \
              "/v1/admin/kenji/control/approvals?status=pending"
            do
              body_file="$(mktemp)"
              http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" \
                "$origin$endpoint")"
              cat "$body_file"
              test "$http_code" = "401"
              grep -q '"error":"unauthorized"' "$body_file"
            done
          done

      # Issue comments are best-effort telemetry; production acceptance is enforced by the verified-live gate below.
      - name: Report deploy stage diagnosis
        if: always()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          WHOAMI_OUTCOME: ${{ steps.whoami.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.wrangler_dry_run.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          MIGRATION_DEPLOY_OUTCOME: ${{ steps.migration_deploy.outcome }}
          RESOLVE_OUTCOME: ${{ steps.resolve_version.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          TRIGGERS_DRY_RUN_OUTCOME: ${{ steps.triggers_dry_run.outcome }}
          ROUTES_TOKEN_OUTCOME: ${{ steps.routes_token.outcome }}
          TRIGGERS_OUTCOME: ${{ steps.triggers.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$CREDENTIALS_OUTCOME" != "success" ]; then
            stopped="cloudflare token normalization"
          elif [ "$WHOAMI_OUTCOME" != "success" ]; then
            stopped="cloudflare token account preflight"
          elif [ "$TESTS_OUTCOME" != "success" ]; then
            stopped="tests"
          elif [ "$DRY_RUN_OUTCOME" != "success" ]; then
            stopped="wrangler versions dry-run"
          elif [ "$UPLOAD_OUTCOME" != "success" ] && [ "$MIGRATION_DEPLOY_OUTCOME" != "success" ]; then
            stopped="wrangler versions upload / direct migration deploy"
          elif [ "$UPLOAD_OUTCOME" = "success" ] && [ "$RESOLVE_OUTCOME" != "success" ]; then
            stopped="resolve uploaded version"
          elif [ "$UPLOAD_OUTCOME" = "success" ] && [ "$DEPLOY_OUTCOME" != "success" ]; then
            stopped="wrangler versions deploy"
          elif [ "$TRIGGERS_DRY_RUN_OUTCOME" != "success" ]; then
            stopped="wrangler triggers dry-run"
          elif [ "$ROUTES_TOKEN_OUTCOME" != "success" ]; then
            stopped="cloudflare routes token verification"
          elif [ "$TRIGGERS_OUTCOME" != "success" ]; then
            stopped="Cloudflare admin-worker route sync"
          elif [ "$SMOKE_OUTCOME" != "success" ]; then
            stopped="production auth-guard smoke"
          else
            stopped="none — live verified"
          fi

          deploy_detail=""
          for log in "$RUNNER_TEMP/admin-worker-upload.log" "$RUNNER_TEMP/admin-worker-deploy.log" "$RUNNER_TEMP/admin-worker-triggers.log"; do
            if [ -f "$log" ]; then
              deploy_detail="${deploy_detail}$(grep -Ei 'error|failed|permission|route|conflict|workers.dev|code:|code |version' "$log" | tail -n 30 || true)\n"
            fi
          done
          if [ -z "${deploy_detail//\\n/}" ]; then
            deploy_detail="No focused Wrangler error lines captured."
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ### admin-worker deploy diagnosis

          - source_sha: \`${GITHUB_SHA}\`
          - checked_at: \`${checked_at}\`
          - token normalization: \`${CREDENTIALS_OUTCOME}\`
          - wrangler whoami: \`${WHOAMI_OUTCOME}\`
          - tests: \`${TESTS_OUTCOME}\`
          - versions dry-run: \`${DRY_RUN_OUTCOME}\`
          - versions upload: \`${UPLOAD_OUTCOME}\`
          - direct migration deploy: \`${MIGRATION_DEPLOY_OUTCOME}\`
          - resolve version: \`${RESOLVE_OUTCOME}\`
          - versions deploy: \`${DEPLOY_OUTCOME}\`
          - triggers dry-run: \`${TRIGGERS_DRY_RUN_OUTCOME}\`
          - routes-token verification: \`${ROUTES_TOKEN_OUTCOME}\`
          - admin-worker route sync: \`${TRIGGERS_OUTCOME}\`
          - production auth-guard smoke: \`${SMOKE_OUTCOME}\`
          - **stopped_at: \`${stopped}\`**

          Wrangler detail:
          \`\`\`text
          ${deploy_detail}
          \`\`\`
          EOF
          if ! gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body-file "$body_file"; then
            echo "::warning::Deploy diagnosis could not be written to the launch issue."
          fi

      - name: Record verified live receipt on launch issue
        if: always() && steps.smoke.outcome == 'success'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "✅ admin-worker LIVE + ROUTES VERIFIED\n\n- source_sha: \`${GITHUB_SHA}\`\n- deployed_at: \`${deployed_at}\`\n- deployment_ref: \`${ADMIN_WORKER_VERSION_ID}\`\n- endpoint: \`${ADMIN_DASHBOARD_PRODUCTION_URL}\`\n- production auth guards: \`dashboard + protected Kenji shell + Model Review/QA/Publish/Audit ingress + Payment Entitlement + Payment Review guards passed\`\n- route mutation: \`required exact/wildcard admin-worker routes verified via Zone Workers Routes API\`\n\nMMS authenticated production smoke is temporarily excluded from this deploy gate."; then
            echo "::warning::Live deployment is verified, but the launch-issue receipt comment could not be recorded."
          fi

      - name: Require verified live deployment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.smoke.outcome }}" = "success"
