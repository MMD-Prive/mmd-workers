name: Deploy admin-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/**"
      - "knowledge/kenji/**"
      - ".github/workflows/deploy-admin-worker.yml"

concurrency:
  group: deploy-admin-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_DASHBOARD_PRODUCTION_URL: https://admin-worker.malemodel-bkk.workers.dev/v1/admin/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_API_TOKEN);
          const accountId = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          if (!token || !accountId) {
            throw new Error("Cloudflare credentials are missing after normalization");
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${token}\nCLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
          NODE

      - name: Run tests and source validation
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/admin-login-hero-worker.js
          node --check src/admin-login-page.js
          node --check src/dashboard-worker.js
          node --test \
            admin-login-hero.test.mjs \
            admin-login-regression-guard.test.mjs \
            admin-login-session.test.mjs
          node ../knowledge/kenji/validate.mjs
          node --test \
            kenji-knowledge-runtime-storage.test.mjs \
            kenji-public-knowledge-runtime.test.mjs

      - name: Validate Cloudflare deployment
        id: wrangler_dry_run
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars

      - name: Deploy admin-worker
        id: deploy
        run: npx --yes wrangler@4 deploy --keep-vars

      - name: Verify production dashboard route
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" "$ADMIN_DASHBOARD_PRODUCTION_URL")"
          cat "$body_file"
          test "$http_code" = "401"
          grep -q '"error":"unauthorized"' "$body_file"

      - name: Report deploy stage diagnosis
        if: always()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.wrangler_dry_run.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$CREDENTIALS_OUTCOME" != "success" ]; then
            stopped="cloudflare credentials preflight"
          elif [ "$TESTS_OUTCOME" != "success" ]; then
            stopped="tests"
          elif [ "$DRY_RUN_OUTCOME" != "success" ]; then
            stopped="wrangler dry-run"
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            stopped="wrangler deploy"
          elif [ "$SMOKE_OUTCOME" != "success" ]; then
            stopped="production smoke"
          else
            stopped="none — live verified"
          fi
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "### admin-worker deploy diagnosis\n\n- source_sha: \`${GITHUB_SHA}\`\n- checked_at: \`${checked_at}\`\n- credentials: \`${CREDENTIALS_OUTCOME}\`\n- tests: \`${TESTS_OUTCOME}\`\n- wrangler dry-run: \`${DRY_RUN_OUTCOME}\`\n- wrangler deploy: \`${DEPLOY_OUTCOME}\`\n- production smoke: \`${SMOKE_OUTCOME}\`\n- **stopped_at: \`${stopped}\`**"

      - name: Record verified live receipt on launch issue
        if: steps.smoke.outcome == 'success'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "✅ admin-worker LIVE VERIFIED\n\n- source_sha: \`${GITHUB_SHA}\`\n- deployed_at: \`${deployed_at}\`\n- endpoint: \`${ADMIN_DASHBOARD_PRODUCTION_URL}\`\n- production smoke: \`401 unauthorized\`\n\nThis receipt is written only after Wrangler deploy succeeds and the production Worker returns the expected auth-guard response."
