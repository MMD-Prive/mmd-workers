name: Deploy admin-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/**"
      - "knowledge/kenji/**"
      - ".github/workflows/deploy-admin-worker.yml"

concurrency:
  group: deploy-admin-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_DASHBOARD_PRODUCTION_URL: https://admin-worker.malemodel-bkk.workers.dev/v1/admin/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_API_TOKEN);
          const accountId = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          if (!token || !accountId) {
            throw new Error("Cloudflare credentials are missing after normalization");
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${token}\nCLOUDFLARE_ACCOUNT_ID=${accountId}\n`);
          NODE

      - name: Validate production entrypoints
        run: |
          node --check src/admin-login-hero-worker.js
          node --check src/admin-login-page.js
          node --check src/dashboard-worker.js

      - name: Run focused admin login tests
        run: |
          node --test \
            admin-login-hero.test.mjs \
            admin-login-regression-guard.test.mjs \
            admin-login-session.test.mjs

      - name: Validate Kenji knowledge source and public runtime
        run: |
          node ../knowledge/kenji/validate.mjs
          node --test \
            kenji-knowledge-runtime-storage.test.mjs \
            kenji-public-knowledge-runtime.test.mjs

      - name: Validate Cloudflare deployment
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars

      - name: Deploy admin-worker
        run: npx --yes wrangler@4 deploy --keep-vars

      - name: Verify production dashboard route
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body_file" -w "%{http_code}" "$ADMIN_DASHBOARD_PRODUCTION_URL")"
          cat "$body_file"
          test "$http_code" = "401"
          grep -q '"error":"unauthorized"' "$body_file"

      - name: Record verified live receipt on launch issue
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "✅ admin-worker LIVE VERIFIED\n\n- source_sha: \`${GITHUB_SHA}\`\n- deployed_at: \`${deployed_at}\`\n- endpoint: \`${ADMIN_DASHBOARD_PRODUCTION_URL}\`\n- production smoke: \`401 unauthorized\`\n\nThis receipt is written only after Wrangler deploy succeeds and the production Worker returns the expected auth-guard response."
