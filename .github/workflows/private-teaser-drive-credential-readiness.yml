name: Private Teaser Drive credential readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-teaser-drive-credential-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "${!1:-}" ]; then printf true; else printf false; fi; }
          sa="$(present GOOGLE_SERVICE_ACCOUNT_JSON)"
          cid="$(present GOOGLE_DRIVE_CLIENT_ID)"
          csecret="$(present GOOGLE_DRIVE_CLIENT_SECRET)"
          refresh="$(present GOOGLE_DRIVE_REFRESH_TOKEN)"
          oauth=false
          if [ "$cid" = true ] && [ "$csecret" = true ] && [ "$refresh" = true ]; then oauth=true; fi
          echo "service_account_present=$sa"
          echo "drive_client_id_present=$cid"
          echo "drive_client_secret_present=$csecret"
          echo "drive_refresh_token_present=$refresh"
          echo "drive_oauth_trio_present=$oauth"
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "## Private Teaser — Drive credential readiness

          - checked_at: \`$checked_at\`
          - source_sha: \`$GITHUB_SHA\`
          - GitHub Actions service-account secret present: \`$sa\`
          - GitHub Actions Drive client ID present: \`$cid\`
          - GitHub Actions Drive client secret present: \`$csecret\`
          - GitHub Actions Drive refresh token present: \`$refresh\`
          - complete Drive OAuth trio present: \`$oauth\`
          - secret values exposed: \`false\`"
