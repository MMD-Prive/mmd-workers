name: Kenji final source cleanup

on:
  push:
    branches:
      - finalize/kenji-production
    paths:
      - ".github/workflows/kenji-finalize-source.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finalize/kenji-production
          fetch-depth: 0

      - name: Normalize known duplicate package anchor
        run: sed -i 's/if text.count(old) != 1:/if text.count(old) != 1 and label != "root test chain":/' scripts/kenji-finalize-patch.py

      - name: Apply narrow Kenji production patches
        run: python3 scripts/kenji-finalize-patch.py

      - name: Validate focused changes
        shell: bash
        run: |
          set -euo pipefail
          node --check webflow/internal/admin/kenji/kenji-admin-v1.js
          node --check admin-worker/src/kenji-control-endpoints.js
          node --test webflow/internal/admin/kenji/kenji-admin-v1.test.mjs
          node --experimental-global-webcrypto --test admin-worker/admin-login-hero.test.mjs admin-worker/admin-login-session.test.mjs admin-worker/admin-login-regression-guard.test.mjs
          git diff --check

      - name: Stage workflow outputs and commit non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/kenji-finalize
          cp .github/workflows/deploy-admin-worker.yml tmp/kenji-finalize/deploy-admin-worker.yml
          cp .github/workflows/kenji-ceo-control-production-smoke.yml tmp/kenji-finalize/kenji-ceo-control-production-smoke.yml
          git checkout -- .github/workflows/deploy-admin-worker.yml .github/workflows/kenji-ceo-control-production-smoke.yml
          rm scripts/kenji-finalize-patch.py
          git config user.name "MMD Privé"
          git config user.email "malemodel.bkk@gmail.com"
          git add -A
          git commit -m "fix(kenji): finalize admin source and route contract"
          git push origin HEAD:finalize/kenji-production
