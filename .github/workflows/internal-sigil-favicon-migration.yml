name: Internal SIGIL favicon migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/internal-sigil-favicon-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow canonical SIGIL favicon in MMS CSP
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'admin-worker/src/mms-admin-runtime.js';
          const before = "img-src 'self' data: https://s3.amazonaws.com;";
          const after = "img-src 'self' data: https://s3.amazonaws.com https://cdn.prod.website-files.com;";
          let source = fs.readFileSync(file, 'utf8');
          if (!source.includes(after)) {
            if (!source.includes(before)) throw new Error('MMS CSP marker not found');
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
          }
          NODE

      - name: Validate targeted internal surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/mms-admin-runtime.js
          node --check admin-worker/src/mms-admin-mobile-bundle.js
          node --test \
            admin-worker/mms-admin-inline-syntax.test.mjs \
            admin-worker/mms-admin-mobile-bundle.test.mjs

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No CSP migration changes required"
            exit 0
          fi
          git config user.name "MMD Privé"
          git config user.email "malemodel.bkk@gmail.com"
          git add admin-worker/src/mms-admin-runtime.js
          git commit -m "fix(mms-admin): allow canonical SIGIL favicon CDN"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
