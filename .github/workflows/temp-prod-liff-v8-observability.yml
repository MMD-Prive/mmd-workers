name: Temporary production LIFF V8 observability

on:
  push:
    branches:
      - diag/prod-liff-v8-observability
    paths:
      - ".github/workflows/temp-prod-liff-v8-observability.yml"

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
    steps:
      - name: Query recent production LIFF diagnostic events
        shell: bash
        run: |
          node <<'NODE'
          const clean = (value) => String(value || '').replace(/[\r\n\u2028\u2029]/g, '').trim();
          const tokens = [
            ['deploy', clean(process.env.CLOUDFLARE_API_TOKEN)],
            ['routes', clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN)],
          ].filter(([, token]) => token);
          const account = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          if (!tokens.length || !account) throw new Error('Cloudflare observability credentials missing');
          for (const [, token] of tokens) console.log(`::add-mask::${token}`);

          const to = Date.now();
          const from = to - 60 * 60 * 1000;
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/observability/telemetry/query`;
          const diagnostics = [
            'member_status_resolver_failure',
            'member_profile_resolver_failure',
            'liff_gateway_airtable_failure',
          ];
          const body = {
            queryId: `adhoc-prod-liff-v8-${to}`,
            timeframe: { from, to },
            view: 'events',
            limit: 500,
            needle: {
              value: diagnostics.join('|'),
              isRegex: true,
              matchCase: false,
            },
          };

          let payload = null;
          let used = '';
          for (const [label, token] of tokens) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify(body),
            });
            const candidate = await response.json().catch(() => null);
            if (response.ok && candidate) {
              payload = candidate;
              used = label;
              break;
            }
            const code = Array.isArray(candidate?.errors) ? candidate.errors.map((item) => item?.code).filter(Boolean).join(',') : '';
            console.log(`token_${label}_observability_status=${response.status}${code ? ` error_codes=${code}` : ''}`);
          }
          if (!payload) throw new Error('No configured Cloudflare token can query Workers observability');

          const root = payload.result || payload;
          const events = Array.isArray(root?.events?.events) ? root.events.events : [];
          const rows = [];
          for (const item of events) {
            const meta = item?.$metadata || {};
            const eventName = typeof item?.event === 'string' ? item.event : '';
            const message = typeof meta?.message === 'string' ? meta.message : '';
            const matched = diagnostics.includes(eventName) || diagnostics.some((name) => message.includes(name));
            if (!matched) continue;
            rows.push({
              timestamp: item?.timestamp || meta?.timestamp || meta?.startTime || meta?.endTime || null,
              service: meta?.service || meta?.scriptName || meta?.script || meta?.origin || null,
              event: eventName || diagnostics.find((name) => message.includes(name)) || null,
              stage: typeof item?.stage === 'string' ? item.stage : null,
              operation: typeof item?.operation === 'string' ? item.operation : null,
              failure_class: typeof item?.failure_class === 'string' ? item.failure_class : null,
              duration_ms: Number.isFinite(item?.duration_ms) ? item.duration_ms : null,
              level: meta?.level || null,
              error: meta?.error || null,
            });
          }
          console.log(JSON.stringify({ token_class: used, window: { from, to }, total_events: events.length, diagnostic_rows: rows }, null, 2));
          if (!rows.length) console.log('No whitelisted diagnostic event found in the last 60 minutes.');
          NODE
