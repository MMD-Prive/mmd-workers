name: Deploy MMD LINE Slip Intake Staging Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-mmd-line-slip-staging-core.yml"

concurrency:
  group: deploy-mmd-line-slip-intake-staging-core
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  provision-deploy-core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: "appsV1ILPRfIjkaYg"
      AIRTABLE_STAGING_TABLE_ID: "tbl9Y6IMM4EWYjIBJ"
      EXTRACTOR_URL: "https://mmd-slip-extractor-staging.malemodel-bkk.workers.dev"
      INTAKE_URL: "https://mmd-line-slip-intake-staging.malemodel-bkk.workers.dev"
      NO_COLOR: "1"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/mmd-slip-extractor/package-lock.json
            services/mmd-slip-extractor/cloudflare/package-lock.json

      - name: Lock staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const extractor = JSON.parse(fs.readFileSync("services/mmd-slip-extractor/cloudflare/wrangler.jsonc", "utf8"));
          const intake = JSON.parse(fs.readFileSync("services/mmd-line-slip-intake/cloudflare/wrangler.jsonc", "utf8"));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(extractor.name === "mmd-slip-extractor-staging", "extractor worker must remain staging");
          assert(extractor.workers_dev === true && extractor.preview_urls === false, "extractor must remain workers.dev-only");
          assert(Array.isArray(extractor.routes) && extractor.routes.length === 0, "extractor custom routes are forbidden");
          assert(extractor.vars?.MMD_RUNTIME_SCOPE === "staging", "extractor staging scope required");
          assert(intake.name === "mmd-line-slip-intake-staging", "intake worker must remain staging");
          assert(intake.workers_dev === true && intake.preview_urls === false, "intake must remain workers.dev-only");
          assert(!intake.routes || intake.routes.length === 0, "intake custom routes are forbidden");
          assert(intake.vars?.MMD_RUNTIME_SCOPE === "staging", "intake staging scope required");
          assert(intake.queues?.producers?.[0]?.queue === "mmd-line-slip-intake-staging", "staging Queue name lock failed");
          assert(intake.queues?.consumers?.[0]?.dead_letter_queue === "mmd-line-slip-intake-staging-dlq", "staging DLQ name lock failed");
          assert(intake.r2_buckets?.[0]?.bucket_name === "mmd-line-slip-evidence-staging", "staging R2 name lock failed");
          const source = fs.readFileSync("services/mmd-line-slip-intake/cloudflare/worker.mjs", "utf8");
          assert(!source.includes("LINE_WEBHOOK_UPSTREAM_URL"), "retired LINE upstream must remain absent");
          assert(source.includes("source === \"synthetic_isolated\""), "synthetic-only consumer gate missing");
          NODE

      - name: Normalize required credentials and generate staging-only bearer tokens
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const clean = (value) => String(value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const cf = clean(process.env.CLOUDFLARE_API_TOKEN);
          const account = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const airtable = clean(process.env.AIRTABLE_API_KEY);
          if (!cf || !account) throw new Error("Cloudflare staging deploy credentials missing");
          if (!airtable) throw new Error("Airtable staging token missing");
          console.log(`::add-mask::${cf}`);
          console.log(`::add-mask::${airtable}`);
          const extractorToken = crypto.randomBytes(32).toString("base64url");
          const intakeToken = crypto.randomBytes(32).toString("base64url");
          console.log(`::add-mask::${extractorToken}`);
          console.log(`::add-mask::${intakeToken}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `MMD_SLIP_EXTRACTOR_TOKEN=${extractorToken}\nMMD_SLIP_INTAKE_STAGING_TOKEN=${intakeToken}\n`);
          fs.writeFileSync(process.env.RUNNER_TEMP + "/extractor.env", `MMD_SLIP_EXTRACTOR_TOKEN=${extractorToken}\n`, { mode: 0o600 });
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/intake.env",
            [
              `MMD_SLIP_INTAKE_STAGING_TOKEN=${intakeToken}`,
              `MMD_SLIP_EXTRACTOR_TOKEN=${extractorToken}`,
              `AIRTABLE_API_KEY=${airtable}`,
              "",
            ].join("\n"),
            { mode: 0o600 },
          );
          NODE

      - name: Verify Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 whoami

      - name: Install and validate staging source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix services/mmd-slip-extractor
          npm ci --prefix services/mmd-slip-extractor/cloudflare
          node --test services/mmd-slip-extractor/test/*.test.mjs
          node --test services/mmd-slip-extractor/cloudflare/test/*.test.mjs
          node --experimental-global-webcrypto --test services/mmd-line-slip-intake/cloudflare/test/*.test.mjs
          node --check services/mmd-line-slip-intake/cloudflare/worker.mjs

      - name: Provision staging Queue DLQ and private R2
        shell: bash
        run: |
          set -euo pipefail
          ensure_resource() {
            label="$1"
            shift
            set +e
            output="$("$@" 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "${label}: created"
              return 0
            fi
            if printf '%s' "$output" | grep -Eqi 'already exists|already been created|already in use|duplicate'; then
              echo "${label}: already exists"
              return 0
            fi
            printf '%s\n' "$output" >&2
            return "$status"
          }
          ensure_resource "Queue mmd-line-slip-intake-staging" npx --yes wrangler@4.128.0 queues create mmd-line-slip-intake-staging
          ensure_resource "DLQ mmd-line-slip-intake-staging-dlq" npx --yes wrangler@4.128.0 queues create mmd-line-slip-intake-staging-dlq
          ensure_resource "R2 mmd-line-slip-evidence-staging" npx --yes wrangler@4.128.0 r2 bucket create mmd-line-slip-evidence-staging

      - name: Deploy isolated staging extractor Container
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 deploy \
            --config services/mmd-slip-extractor/cloudflare/wrangler.jsonc \
            --keep-vars \
            --secrets-file "$RUNNER_TEMP/extractor.env"

      - name: Wait for extractor health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/extractor-health.json" --write-out '%{http_code}' "$EXTRACTOR_URL/health" || true)"
            if [ "$code" = "200" ]; then
              node -e 'const fs=require("node:fs"); const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (b.ok!==true) process.exit(1)' "$RUNNER_TEMP/extractor-health.json"
              echo "Extractor staging healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Extractor staging health timeout" >&2
          exit 1

      - name: Preflight Airtable staging table
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.AIRTABLE_BASE_ID;
          const table = process.env.AIRTABLE_STAGING_TABLE_ID;
          const token = process.env.AIRTABLE_API_KEY;
          const response = await fetch(`https://api.airtable.com/v0/${base}/${table}?maxRecords=1`, { headers: { Authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`Airtable staging preflight HTTP ${response.status}`);
          console.log("Airtable staging table reachable");
          NODE

      - name: Deploy Queue-backed staging intake without HYPE credential
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 deploy \
            --config services/mmd-line-slip-intake/cloudflare/wrangler.jsonc \
            --keep-vars \
            --secrets-file "$RUNNER_TEMP/intake.env"

      - name: Wait for intake health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error "$INTAKE_URL/health" || true)"
            if node -e 'const b=JSON.parse(process.argv[1]); if (b.ok!==true || b.worker!=="mmd-line-slip-intake-staging" || b.runtime_scope!=="staging") process.exit(1)' "$body" 2>/dev/null; then
              echo "Queue intake staging healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Queue intake staging health timeout" >&2
          exit 1

      - name: Create synthetic redacted fixture
        shell: bash
        working-directory: services/mmd-slip-extractor
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          const svg = '<svg width="1100" height="420" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="60" y="130" font-family="Arial" font-size="54" fill="black">MMD SYNTHETIC SLIP</text><text x="60" y="230" font-family="Arial" font-size="48" fill="black">Amount: THB 690.00</text><text x="60" y="320" font-family="Arial" font-size="40" fill="black">Transaction ID: SYNTHETIC-STAGING-690</text></svg>';
          await sharp(Buffer.from(svg)).png().toFile(process.env.RUNNER_TEMP + "/synthetic-slip.png");
          NODE

      - name: Run synthetic Queue-backed core smoke
        shell: bash
        run: |
          set -euo pipefail
          unauth="$(curl --silent --show-error --output "$RUNNER_TEMP/intake-unauth.json" --write-out '%{http_code}' \
            -X POST -H 'Content-Type: image/png' --data-binary "@$RUNNER_TEMP/synthetic-slip.png" "$INTAKE_URL/v1/staging/intake")"
          test "$unauth" = "401"

          run_id="gha-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${MMD_SLIP_INTAKE_STAGING_TOKEN}" \
            -H 'Content-Type: image/png' \
            -H "x-mmd-run-id: ${run_id}" \
            --data-binary "@$RUNNER_TEMP/synthetic-slip.png" \
            "$INTAKE_URL/v1/staging/intake")"
          printf '%s' "$response" > "$RUNNER_TEMP/intake.json"
          node <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/intake.json", "utf8"));
          if (body.ok !== true || body.accepted !== true || body.state !== "queued") throw new Error("intake did not queue");
          if (!/^syn_[a-f0-9]{24}$/.test(body.proof_id || "")) throw new Error("synthetic proof id missing");
          if ("r2_key" in body || "paid" in body || "verified" in body) throw new Error("forbidden field exposed");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/proof-id.txt", body.proof_id);
          console.log(`Synthetic proof queued: ${body.proof_id}`);
          NODE

      - name: Verify pending proof and replay idempotency
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const proofId = fs.readFileSync(process.env.RUNNER_TEMP + "/proof-id.txt", "utf8").trim();
          const base = process.env.AIRTABLE_BASE_ID;
          const table = process.env.AIRTABLE_STAGING_TABLE_ID;
          const token = process.env.AIRTABLE_API_KEY;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const formula = `{proof_id}='${proofId.replace(/'/g, "\\'")}'`;
          const url = `https://api.airtable.com/v0/${base}/${table}?maxRecords=10&filterByFormula=${encodeURIComponent(formula)}`;
          let records = [];
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            if (!response.ok) throw new Error(`Airtable proof read HTTP ${response.status}`);
            const payload = await response.json();
            records = Array.isArray(payload.records) ? payload.records : [];
            if (records.length) break;
            await sleep(3000);
          }
          if (records.length !== 1) throw new Error(`expected exactly one pending proof, got ${records.length}`);
          const fields = records[0].fields || {};
          if (fields.status !== "pending" || fields.source !== "synthetic_isolated") throw new Error("staging proof authority boundary failed");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/proof-record.json", JSON.stringify({ proof_id: proofId }));
          console.log(`Pending staging proof verified: ${proofId}`);
          NODE

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${MMD_SLIP_INTAKE_STAGING_TOKEN}" \
            -H 'Content-Type: image/png' \
            -H "x-mmd-run-id: replay-${GITHUB_RUN_ID}" \
            --data-binary "@$RUNNER_TEMP/synthetic-slip.png" \
            "$INTAKE_URL/v1/staging/intake" > "$RUNNER_TEMP/replay.json"
          sleep 8

          node <<'NODE'
          const fs = require("node:fs");
          const proofId = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/proof-record.json", "utf8")).proof_id;
          const base = process.env.AIRTABLE_BASE_ID;
          const table = process.env.AIRTABLE_STAGING_TABLE_ID;
          const token = process.env.AIRTABLE_API_KEY;
          const formula = `{proof_id}='${proofId.replace(/'/g, "\\'")}'`;
          const response = await fetch(`https://api.airtable.com/v0/${base}/${table}?maxRecords=10&filterByFormula=${encodeURIComponent(formula)}`, { headers: { Authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`Airtable replay read HTTP ${response.status}`);
          const payload = await response.json();
          const records = Array.isArray(payload.records) ? payload.records : [];
          if (records.length !== 1) throw new Error(`replay idempotency failed; record count=${records.length}`);
          console.log(`Replay idempotency verified: ${proofId}`);
          NODE

      - name: Record staging core result in issue 317
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof_id=""
          if [ -f "$RUNNER_TEMP/proof-id.txt" ]; then proof_id="$(cat "$RUNNER_TEMP/proof-id.txt")"; fi
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment 317 --repo "$GITHUB_REPOSITORY" --body "✅ Cloudflare Queue-backed slip intake CORE STAGING DEPLOYED\n\n- source_sha: \`${GITHUB_SHA}\`\n- workflow_run_id: \`${GITHUB_RUN_ID}\`\n- Queue: \`mmd-line-slip-intake-staging\`\n- DLQ: \`mmd-line-slip-intake-staging-dlq\`\n- private R2: \`mmd-line-slip-evidence-staging\`\n- extractor: \`mmd-slip-extractor-staging\`\n- intake: \`mmd-line-slip-intake-staging\`\n- synthetic proof: \`${proof_id}\`\n- Airtable staging: \`pending / synthetic_isolated\`\n- replay idempotency: PASS\n- HYPE alert: BLOCKED — repository Actions does not currently expose an accepted Telegram service credential\n- production LINE route mutation: NONE\n- real-LINE production: NOT TOUCHED / NOT CLAIMED\n\nCore staging deployment is not the full staging acceptance gate until the redacted HYPE alert credential is provided. Synthetic staging never counts as real-LINE production PASS."
          else
            gh issue comment 317 --repo "$GITHUB_REPOSITORY" --body "❌ Cloudflare Queue-backed slip intake CORE STAGING deploy/smoke failed.\n\n- source_sha: \`${GITHUB_SHA}\`\n- workflow_run_id: \`${GITHUB_RUN_ID}\`\n- production LINE route mutation: NONE\n- real-LINE production: NOT TOUCHED\n\nInspect the failed step; do not promote to production."
          fi
