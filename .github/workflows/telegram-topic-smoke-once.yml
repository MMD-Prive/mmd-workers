name: Telegram Topic Smoke Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram-topic-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ contains(github.event.head_commit.message, '[telegram-smoke-once]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
    steps:
      - name: Fire production Telegram topic smoke
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INTERNAL_API_TOKEN"
          body="$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsS \
            -X POST 'https://telegram-worker.malemodel-bkk.workers.dev/telegram/internal/topics/smoke' \
            -H "Authorization: Bearer ${INTERNAL_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"confirm":"SEND_REDACTED_TOPIC_SMOKE","disable_notification":true}')"
          echo "$body"
          echo '### Telegram topic smoke' >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n%s\n```\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const d=JSON.parse(process.argv[1]); if (!d.ok || d.failed !== 0 || Number(d.tested) < 7) process.exit(1);' "$body"
