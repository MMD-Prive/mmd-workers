name: Telegram Topic Smoke Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/telegram-topic-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ contains(github.event.head_commit.message, '[telegram-smoke-once]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mmd-slip-extractor-staging
    env:
      TELEGRAM_BOT_TOKEN_MMS: ${{ secrets.MMS_TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "-1003546439681"
    steps:
      - name: Diagnose Confirm and Alerts topic delivery
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "${TELEGRAM_BOT_TOKEN_MMS:-}" | tr -d '\r\n' | xargs)"
          test -n "$token"
          echo "::add-mask::${token}"
          run_id="tg-pay-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          failures=0

          for thread in 21 9; do
            case "$thread" in
              21) expected='Service / Deposit / Balance'; route='confirm → thread 21' ;;
              9) expected='Conflict / Mismatch exception'; route='alerts → thread 9' ;;
            esac
            text="🧪 MMD PAYMENT ROUTING SMOKE
Expected: ${expected}
Route: ${route}
Run: ${run_id}
Synthetic / no customer data"
            payload="$(node -e 'process.stdout.write(JSON.stringify({chat_id:process.env.TELEGRAM_CHAT_ID,message_thread_id:Number(process.argv[1]),text:process.argv[2],disable_notification:true}))' "$thread" "$text")"
            file="$RUNNER_TEMP/thread-${thread}.json"
            code="$(curl -sS -o "$file" -w '%{http_code}' \
              -X POST "https://api.telegram.org/bot${token}/sendMessage" \
              -H 'Content-Type: application/json' \
              --data-binary "$payload" || true)"

            if node - <<'NODE' "$file" "$thread" "$code"
const fs = require('node:fs');
const [file, thread, code] = process.argv.slice(2);
let body = {};
try { body = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
if (code === '200' && body.ok === true) {
  console.log(`PASS thread=${thread} message_id=${body.result?.message_id || 'n/a'}`);
  process.exit(0);
}
const description = String(body.description || body.error || 'delivery_failed').replace(/[^A-Za-z0-9 _.:/-]/g, '_').slice(0, 180);
console.log(`FAIL thread=${thread} http=${code} error_code=${body.error_code || 'n/a'} description=${description}`);
process.exit(1);
NODE
            then
              :
            else
              failures=$((failures+1))
            fi
          done

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "### Payment routing smoke diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "- Membership thread 20 already delivered in previous run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Confirm thread 21 tested in this run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alerts thread 9 tested in this run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synthetic / silent / no customer data" >> "$GITHUB_STEP_SUMMARY"

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
