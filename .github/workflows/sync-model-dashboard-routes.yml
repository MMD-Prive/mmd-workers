name: Sync Model Dashboard routes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/src/model-liff-worker.js"
      - "admin-worker/src/model-gps-visibility.js"
      - "admin-worker/src/model-location-runtime.js"
      - "admin-worker/src/studio-telegram-worker.js"
      - "admin-worker/wrangler.toml"
      - ".github/workflows/sync-model-dashboard-routes.yml"

concurrency:
  group: sync-model-dashboard-routes-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize and verify routes token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const token = (process.env.CLOUDFLARE_ROUTES_API_TOKEN || "")
            .replace(/[\u2028\u2029\r\n]/g, "")
            .trim();
          if (!token) throw new Error("CLOUDFLARE_ROUTES_API_TOKEN is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${token}\n`);
          NODE
          response="$(mktemp)"
          code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -o "$response" -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$code" = "200"
          node - "$response" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (body.success !== true || body.result?.status !== "active") {
            throw new Error("Cloudflare routes token is not active");
          }
          NODE

      - name: Sync Model Dashboard routes to admin-worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "admin-worker";
          const paths = [
            "/v1/model/liff/exchange",
            "/v1/model/session/current*",
            "/v1/model/session/action",
            "/v1/model/profile",
            "/v1/model/profile*",
            "/v1/model/media*",
            "/v1/model/settings/gps-visibility",
            "/v1/model/location/capability",
            "/v1/model/location/current*",
          ];
          const desired = paths.flatMap((path) => [
            `mmdbkk.com${path}`,
            `www.mmdbkk.com${path}`,
          ]);

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const detail = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare request failed (${response.status}): ${detail}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing route takeover: ${conflicts.map((r) => `${r.pattern} -> ${r.script || "none"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cf(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cf(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Unresolved routes: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length}; created ${missing.length}`);
          NODE

      - name: Smoke fail-closed Model Dashboard routes on apex and www
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
              "$origin/v1/model/profile")"
            cat "$body"
            test "$code" = "401"
            grep -q '"error":"model_session_required"' "$body"

            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
              "$origin/v1/model/media")"
            cat "$body"
            test "$code" = "401"
            grep -q '"error":"model_session_required"' "$body"

            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
              "$origin/v1/model/settings/gps-visibility")"
            cat "$body"
            test "$code" = "401"
            grep -q '"error":"model_session_required"' "$body"

            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
              "$origin/v1/model/location/capability")"
            cat "$body"
            test "$code" = "401"
            grep -q '"error":"model_session_required"' "$body"

            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
              "$origin/v1/model/location/current")"
            cat "$body"
            test "$code" = "401"
            grep -q '"error":"model_session_required"' "$body"

            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/json" \
              --data '{"action":"send_eta","eta_minutes":15}' \
              "$origin/v1/model/session/action")"
            cat "$body"
            test "$code" = "401"
            grep -q '"error":"model_session_required"' "$body"

            body="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/json" \
              --data '{"environment":"published"}' \
              "$origin/v1/model/liff/exchange")"
            cat "$body"
            test "$code" = "400"
            grep -q '"error":"id_token_required"' "$body"
          done
