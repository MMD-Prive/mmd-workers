name: Smoke Kenji Mek admin media preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/smoke-kenji-mek-media-preview.yml"

permissions:
  contents: read

concurrency:
  group: smoke-kenji-mek-media-preview
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_LOGIN_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
      MODEL_ID: recBKaHfxUKs8fkMV
      MODEL_NAME: Mek
      ORIGIN: https://www.mmdbkk.com
    steps:
      - name: Verify apex canonical redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          code="$(curl -sS -D "$headers" -o /dev/null -w "%{http_code}" 'https://mmdbkk.com/v1/admin/kenji/models?q=Mek&limit=20')"
          location="$(grep -i '^location:' "$headers" | tail -n 1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' || true)"
          echo "apex models=$code location=${location:-none}"
          test "$code" = "301"
          test "$location" = "https://www.mmdbkk.com/v1/admin/kenji/models?q=Mek&limit=20"

      - name: Verify authenticated Mek admin media preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_LOGIN_CREDENTIAL:-}"
          echo "::add-mask::$ADMIN_LOGIN_CREDENTIAL"
          cookie_jar="$(mktemp)"
          login_headers="$(mktemp)"
          models_body="$(mktemp)"
          preview_headers="$(mktemp)"
          preview_body="$(mktemp)"

          login_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -D "$login_headers" -c "$cookie_jar" -o /dev/null -w "%{http_code}" \
            -X POST -H "Origin: $ORIGIN" -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "credential=$ADMIN_LOGIN_CREDENTIAL" \
            --data-urlencode "next=/internal/admin/kenji" \
            "$ORIGIN/internal/admin/login/session")"
          echo "www login=$login_code"
          test "$login_code" = "303"
          grep -qi '^location: /internal/admin/kenji' "$login_headers"
          grep -q 'mmd_admin_gate_v1' "$cookie_jar"

          shell_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -b "$cookie_jar" -o /dev/null -w "%{http_code}" \
            "$ORIGIN/internal/admin/kenji")"
          echo "www shell=$shell_code"
          test "$shell_code" = "200"

          models_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -b "$cookie_jar" -o "$models_body" -w "%{http_code}" \
            "$ORIGIN/v1/admin/kenji/models?q=Mek&limit=20")"
          echo "www models=$models_code"
          test "$models_code" = "200"

          preview_path="$(node - "$models_body" "$MODEL_ID" "$MODEL_NAME" <<'NODE'
          const fs = require('node:fs');
          const [file, modelId, modelName] = process.argv.slice(2);
          const raw = fs.readFileSync(file, 'utf8');
          const payload = JSON.parse(raw);
          if (payload?.ok !== true || !Array.isArray(payload.items)) throw new Error('models payload invalid');
          const exact = payload.items.filter((item) => item.model_id === modelId && item.working_name === modelName);
          if (exact.length !== 1) throw new Error(`expected one exact ${modelName}; found ${exact.length}`);
          const model = exact[0];
          if (model.has_admin_preview !== true) throw new Error('Mek admin preview not enabled');
          const expected = `/v1/admin/kenji/models?preview_model_id=${encodeURIComponent(modelId)}`;
          if (model.admin_preview_url !== expected) throw new Error(`unexpected preview URL: ${model.admin_preview_url}`);
          for (const forbidden of ['primary_image_key', 'r2_prefix', 'private_original_key', 'signed_url']) {
            if (raw.includes(forbidden)) throw new Error(`private storage field leaked: ${forbidden}`);
          }
          process.stdout.write(model.admin_preview_url);
          NODE
          )"
          echo "www exact-model=ok preview-path=resolved"

          preview_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -D "$preview_headers" -b "$cookie_jar" -o "$preview_body" -w "%{http_code}" \
            "$ORIGIN$preview_path")"
          content_type="$(grep -i '^content-type:' "$preview_headers" | tail -n 1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' | tr '[:upper:]' '[:lower:]')"
          cache_control="$(grep -i '^cache-control:' "$preview_headers" | tail -n 1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' | tr '[:upper:]' '[:lower:]')"
          echo "www preview=$preview_code bytes=$(wc -c < "$preview_body" | tr -d ' ') content-type=$content_type cache-control=$cache_control"
          test "$preview_code" = "200"
          test -s "$preview_body"
          [[ "$content_type" == image/* ]]
          [[ "$cache_control" == *private* ]]
          [[ "$cache_control" == *no-store* ]]

          unauth_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -o /dev/null -w "%{http_code}" "$ORIGIN$preview_path")"
          echo "www unauth-preview=$unauth_code"
          test "$unauth_code" = "401"

      - name: Verify Kenji admin CDN UI contains preview renderer
        shell: bash
        run: |
          set -euo pipefail
          js_file="$(mktemp)"
          curl --retry 6 --retry-delay 2 --retry-all-errors -fsS \
            -H 'Cache-Control: no-cache' \
            "https://models.mmdbkk.com/webflow/internal/admin/kenji/kenji-admin-v1.js?smoke=${GITHUB_SHA}" \
            -o "$js_file"
          grep -q 'ADMIN MEDIA PREVIEW' "$js_file"
          grep -q 'admin_preview_url' "$js_file"
          grep -q 'has_admin_preview' "$js_file"
          if grep -q 'primary_image_key\|r2_prefix\|private_original_key\|signed_url' "$js_file"; then
            echo "Private storage field marker leaked into browser UI source" >&2
            exit 1
          fi
          echo "Kenji admin UI preview renderer verified on CDN"