name: Request owner-reviewed admin deploy

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner requests this exact production deploy'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval reference for this workflow and commit'
        type: string
        required: true
      approved_sha:
        description: 'Full main commit SHA approved for this workflow'
        type: string
        required: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mmdprive' && github.triggering_actor == 'mmdprive' && github.run_attempt == 1 && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPROVAL_REF: ${{ inputs.approval_ref }}
      APPROVED_SHA: ${{ inputs.approved_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch exact main SHA as GitHub Actions
        run: |
          set -euo pipefail
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          jq -n --arg ref main --arg approval_ref "$APPROVAL_REF" --arg approved_sha "$APPROVED_SHA" \
            '{ref:$ref,inputs:{production_approved:true,approval_ref:$approval_ref,approved_sha:$approved_sha}}' |
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-admin-worker.yml/dispatches" --input -
          echo "Requested Deploy admin-worker at $APPROVED_SHA; mmdprive must still review mmd-production-mutation."
