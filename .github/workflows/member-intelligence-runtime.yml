name: Member Intelligence Runtime

on:
  pull_request:
    paths:
      - "immigrate-worker/public/a/member-intelligence.js"
      - "immigrate-worker/src/canonical-admin-login-core.ts"
      - "immigrate-worker/src/control-room-dashboard-ingress-wrapper.ts"
      - "immigrate-worker/wrangler.toml"
      - "immigrate-worker/package.json"
      - "immigrate-worker/test/client-intelligence-ingress.test.mjs"
      - "immigrate-worker/test/member-intelligence-runtime.test.mjs"
      - ".github/workflows/member-intelligence-runtime.yml"
      - ".github/workflows/deploy-immigrate-worker.yml"
  push:
    branches:
      - main
    paths:
      - "immigrate-worker/public/a/member-intelligence.js"
      - "immigrate-worker/src/canonical-admin-login-core.ts"
      - "immigrate-worker/src/control-room-dashboard-ingress-wrapper.ts"
      - "immigrate-worker/wrangler.toml"
      - "immigrate-worker/package.json"
      - "immigrate-worker/test/client-intelligence-ingress.test.mjs"
      - "immigrate-worker/test/member-intelligence-runtime.test.mjs"
      - ".github/workflows/member-intelligence-runtime.yml"
      - ".github/workflows/deploy-immigrate-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser runtime syntax
        run: node --check immigrate-worker/public/a/member-intelligence.js

      - name: Run Member Intelligence authority contract
        run: node --test immigrate-worker/test/member-intelligence-runtime.test.mjs immigrate-worker/test/client-intelligence-ingress.test.mjs

      - name: Verify Control Room runtime lane
        run: |
          set -euo pipefail
          grep -F 'pattern = "mmdbkk.com/internal/admin/control-room*"' immigrate-worker/wrangler.toml
          grep -F 'pattern = "www.mmdbkk.com/internal/admin/control-room*"' immigrate-worker/wrangler.toml
          grep -F '/internal/admin/control-room/member-intelligence-runtime' immigrate-worker/src/canonical-admin-login-core.ts
          ! grep -F 'pattern = "mmdbkk.com/internal/admin/member-intelligence/runtime"' immigrate-worker/wrangler.toml
          ! grep -F 'pattern = "www.mmdbkk.com/internal/admin/member-intelligence/runtime"' immigrate-worker/wrangler.toml

      - name: Wrangler dry run
        working-directory: immigrate-worker
        run: npx --yes wrangler@4.128.0 versions upload --dry-run --keep-vars
