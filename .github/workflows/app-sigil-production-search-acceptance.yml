name: APP SIGIL production search acceptance

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy sigil-booking-worker"
    types:
      - completed

permissions:
  contents: read

jobs:
  real-production-search:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify customer search privacy and canonical entitlement gate
        shell: bash
        env:
          BASE_URL: https://sigil.mmdbkk.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const protectedCases = [
            { q: "Atom IX", modelId: "reccoIEmIticuALwb" },
            { q: "Book EI", modelId: "recj1SiBHrrGOBr8K" },
          ];

          for (const testCase of protectedCases) {
            const url = new URL("/sigil/api/models/search", process.env.BASE_URL);
            url.searchParams.set("q", testCase.q);
            url.searchParams.set("scope", "booking");

            const response = await fetch(url, {
              headers: {
                Origin: "https://mmdbkk.com",
                Accept: "application/json",
                "User-Agent": "mmd-app-sigil-production-acceptance/2",
              },
            });
            const text = await response.text();
            if (response.status !== 200) {
              throw new Error(`${testCase.q}: booking discovery HTTP ${response.status}: ${text.slice(0, 500)}`);
            }

            const body = JSON.parse(text);
            if (body?.ok !== true) throw new Error(`${testCase.q}: ok=true required`);
            if (body?.visibility_enforced !== true) {
              throw new Error(`${testCase.q}: visibility_enforced=true required`);
            }

            const models = [
              ...(Array.isArray(body.items) ? body.items : []),
              ...(body.model ? [body.model] : []),
            ];
            if (models.some((item) => item?.model_id === testCase.modelId || item?.model_record_id === testCase.modelId)) {
              throw new Error(`${testCase.q}: protected/private Model leaked without canonical customer entitlement`);
            }

            const serialized = JSON.stringify(body);
            for (const forbidden of [
              "private_original_key",
              "drive_folder_id",
              "drive_folder_url",
              "r2_prefix",
              "primary_image_key",
              "private_real_name",
            ]) {
              if (serialized.includes(`"${forbidden}"`)) {
                throw new Error(`${testCase.q}: forbidden customer storage/private field leaked: ${forbidden}`);
              }
            }

            console.log(JSON.stringify({
              accepted: true,
              query: testCase.q,
              unauthenticated_private_model_hidden: true,
              visibility_enforced: true,
            }));
          }

          const privateUrl = new URL("/sigil/api/models/search", process.env.BASE_URL);
          privateUrl.searchParams.set("q", "Atom IX");
          privateUrl.searchParams.set("scope", "private");
          privateUrl.searchParams.set("booking_ref", "production-acceptance-no-authority");

          const privateResponse = await fetch(privateUrl, {
            headers: {
              Origin: "https://mmdbkk.com",
              Accept: "application/json",
              "User-Agent": "mmd-app-sigil-production-acceptance/2",
            },
          });
          const privateText = await privateResponse.text();
          if (privateResponse.status !== 200) {
            throw new Error(`private fail-closed HTTP ${privateResponse.status}: ${privateText.slice(0, 500)}`);
          }
          const privateBody = JSON.parse(privateText);
          if (privateBody?.ok !== true || privateBody?.blocked !== true) {
            throw new Error("private search must remain blocked without a canonical entitlement snapshot");
          }
          if (Array.isArray(privateBody?.items) && privateBody.items.length) {
            throw new Error("blocked private search must return no Model items");
          }
          console.log(JSON.stringify({
            accepted: true,
            private_search_without_entitlement: "blocked",
            reason: privateBody.reason || "",
          }));
          NODE
