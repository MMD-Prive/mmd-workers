name: Member Model shared-session production canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/member-model-shared-session-production-canary.yml"
      - "payments-worker/confirmation-link-reissue.js"
      - "payments-worker/index.review-wrapper.js"
      - "admin-worker/src/payment-issuer-diagnostic.js"
      - "admin-worker/src/payments-issuer-transport.js"

permissions:
  contents: read

concurrency:
  group: member-model-shared-session-production-canary
  cancel-in-progress: false

jobs:
  shared-session-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORIGIN: https://mmdbkk.com
      ADMIN_SMOKE_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: appsV1ILPRfIjkaYg
      SESSIONS_TABLE_ID: tblC98mKWbzmPuNzX

    steps:
      - name: Require canary credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AIRTABLE_API_KEY:-}" || { echo "Airtable read credential missing" >&2; exit 1; }
          test -n "${ADMIN_SMOKE_CREDENTIAL:-}" || { echo "Admin canary credential missing" >&2; exit 1; }
          echo "::add-mask::$AIRTABLE_API_KEY"
          echo "::add-mask::$ADMIN_SMOKE_CREDENTIAL"

      - name: Wait for safe confirmation reissue to reach production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            headers="$RUNNER_TEMP/admin-login-$attempt.headers"
            cookie="$RUNNER_TEMP/admin-login-$attempt.cookies"
            body="$RUNNER_TEMP/admin-login-$attempt.body"
            code="$(curl -sS -D "$headers" -o "$body" -c "$cookie" -w "%{http_code}"               -X POST -H "Origin: $ORIGIN" -H "Content-Type: application/x-www-form-urlencoded"               --data-urlencode "credential=$ADMIN_SMOKE_CREDENTIAL"               --data-urlencode "next=/internal/admin/control-room"               "$ORIGIN/internal/admin/login/session" || true)"
            if [ "$code" = "303" ]; then
              echo "ADMIN_COOKIE_JAR=$cookie" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Admin deploy/login not ready attempt=$attempt/36 http=$code"
            sleep 10
          done
          echo "admin_canary_login_not_ready" >&2
          exit 1

      - name: Select one canonical Session whose Model Console currently resolves
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const origin = process.env.ORIGIN;
          const baseId = process.env.AIRTABLE_BASE_ID;
          const table = process.env.SESSIONS_TABLE_ID;
          const apiKey = process.env.AIRTABLE_API_KEY;
          const fields = {
            sessionId: "fldLTq2kZbyRv22IA",
            customerUrl: "fldi9ZdoiUXzSv1rI",
            modelUrl: "fld0mFma9J9yfEaKb",
            paymentRef: "fldojgjSQLaO0uQLX",
          };
          const parse = (raw, role) => {
            try {
              const url = new URL(String(raw || "").trim());
              if (!new Set(["mmdbkk.com", "www.mmdbkk.com"]).has(url.hostname)) return "";
              const expected = role === "model"
                ? new Set(["/sigil/confirm/job-model", "/confirm/job-model"])
                : new Set(["/sigil/confirm/job-confirmation", "/confirm/job-confirmation"]);
              if (!expected.has(url.pathname)) return "";
              const keys = [...url.searchParams.keys()];
              const token = String(url.searchParams.get("t") || "").trim();
              return keys.length === 1 && keys[0] === "t" && token ? token : "";
            } catch { return ""; }
          };

          const url = new URL(`https://api.airtable.com/v0/${baseId}/${table}`);
          url.searchParams.set("pageSize", "100");
          url.searchParams.set("maxRecords", "100");
          url.searchParams.set("returnFieldsByFieldId", "true");
          for (const field of Object.values(fields)) url.searchParams.append("fields[]", field);
          const response = await fetch(url, { headers: { authorization: `Bearer ${apiKey}`, accept: "application/json" } });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(`airtable_http_${response.status}`);

          const records = (Array.isArray(payload.records) ? payload.records : [])
            .sort((a, b) => String(b.createdTime || "").localeCompare(String(a.createdTime || "")));

          let selected = null;
          for (const record of records) {
            const f = record?.fields || {};
            const sessionId = String(f[fields.sessionId] || "").trim();
            const paymentRef = String(f[fields.paymentRef] || "").trim();
            const modelToken = parse(f[fields.modelUrl], "model");
            const customerToken = parse(f[fields.customerUrl], "customer");
            if (!sessionId || !paymentRef || !modelToken || !customerToken) continue;

            const modelResponse = await fetch(`${origin}/v1/model/session/current?t=${encodeURIComponent(modelToken)}`, {
              headers: { accept: "application/json", origin, "cache-control": "no-cache" },
            });
            const modelPayload = await modelResponse.json().catch(() => null);
            const modelSession = modelPayload?.session || modelPayload?.data?.session;
            if (modelResponse.status === 200 && modelSession?.session_id === sessionId) {
              selected = { sessionId, paymentRef };
              break;
            }
          }
          if (!selected) throw new Error("no_model_resolvable_shared_session_candidate");
          fs.appendFileSync(process.env.GITHUB_ENV, `CANARY_SESSION_ID=${selected.sessionId}\n`);
          console.log(`Selected canary session=${selected.sessionId}`);
          NODE

      - name: Reissue only the signed Customer and Model confirmation pair
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/confirmation-reissue.json"
          code=""
          for attempt in $(seq 1 36); do
            code="$(curl -sS -b "$ADMIN_COOKIE_JAR" -o "$result" -w "%{http_code}"               -X POST -H "Origin: $ORIGIN" -H "Content-Type: application/json"               --data-binary "$(jq -nc --arg sid "$CANARY_SESSION_ID" '{mode:"refresh_confirmation_links",session_id:$sid}')"               "$ORIGIN/v1/admin/payment-issuer-diagnostic" || true)"
            if [ "$code" = "200" ] && jq -e '.ok == true and .stage == "confirmation_links_refreshed"' "$result" >/dev/null 2>&1; then
              break
            fi
            echo "Safe reissue not ready attempt=$attempt/36 http=$code"
            sleep 10
          done
          test "$code" = "200"
          jq -e '
            .ok == true
            and .stage == "confirmation_links_refreshed"
            and .customer_confirmation_url_present == true
            and .model_confirmation_url_present == true
            and .payment_state_mutated == false
            and .notification_sent == false
          ' "$result" >/dev/null
          echo "PASS confirmation pair reissued without payment-state mutation or notification"

      - name: Read the freshly reissued signed pair
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const sessionId = process.env.CANARY_SESSION_ID;
          const baseId = process.env.AIRTABLE_BASE_ID;
          const table = process.env.SESSIONS_TABLE_ID;
          const apiKey = process.env.AIRTABLE_API_KEY;
          const fields = {
            sessionId: "fldLTq2kZbyRv22IA",
            customerUrl: "fldi9ZdoiUXzSv1rI",
            modelUrl: "fld0mFma9J9yfEaKb",
          };
          const formula = sessionId.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
          const url = new URL(`https://api.airtable.com/v0/${baseId}/${table}`);
          url.searchParams.set("maxRecords", "2");
          url.searchParams.set("filterByFormula", `{session_id}='${formula}'`);
          url.searchParams.set("returnFieldsByFieldId", "true");
          for (const field of Object.values(fields)) url.searchParams.append("fields[]", field);

          const response = await fetch(url, { headers: { authorization: `Bearer ${apiKey}`, accept: "application/json" } });
          const payload = await response.json().catch(() => ({}));
          const rows = Array.isArray(payload.records) ? payload.records : [];
          if (!response.ok || rows.length !== 1) throw new Error("reissued_session_lookup_failed");
          const f = rows[0].fields || {};

          const tokenFrom = (raw, expectedPath) => {
            const parsed = new URL(String(raw || ""));
            if (!new Set(["mmdbkk.com", "www.mmdbkk.com"]).has(parsed.hostname)) throw new Error("reissued_host_invalid");
            if (parsed.pathname !== expectedPath) throw new Error("reissued_path_invalid");
            const keys = [...parsed.searchParams.keys()];
            const token = String(parsed.searchParams.get("t") || "").trim();
            if (keys.length !== 1 || keys[0] !== "t" || !token) throw new Error("reissued_token_invalid");
            return token;
          };
          const customerToken = tokenFrom(f[fields.customerUrl], "/sigil/confirm/job-confirmation");
          const modelToken = tokenFrom(f[fields.modelUrl], "/sigil/confirm/job-model");
          console.log(`::add-mask::${customerToken}`);
          console.log(`::add-mask::${modelToken}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CUSTOMER_T=${customerToken}\nMODEL_T=${modelToken}\n`);
          NODE

      - name: Compare Member Console and Model Console on the same session_id
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const origin = process.env.ORIGIN;
          const expectedSessionId = process.env.CANARY_SESSION_ID;
          const customerToken = process.env.CUSTOMER_T;
          const modelToken = process.env.MODEL_T;

          const [memberResponse, modelResponse] = await Promise.all([
            fetch(`${origin}/api/member/app/session/context?t=${encodeURIComponent(customerToken)}`, {
              headers: { accept: "application/json", origin, "cache-control": "no-cache" },
            }),
            fetch(`${origin}/v1/model/session/current?t=${encodeURIComponent(modelToken)}`, {
              headers: { accept: "application/json", origin, "cache-control": "no-cache" },
            }),
          ]);
          if (memberResponse.status !== 200) throw new Error(`member_console_http_${memberResponse.status}`);
          if (modelResponse.status !== 200) throw new Error(`model_console_http_${modelResponse.status}`);

          const memberPayload = await memberResponse.json();
          const modelPayload = await modelResponse.json();
          const member = memberPayload?.session;
          const model = modelPayload?.session || modelPayload?.data?.session;
          if (memberPayload?.valid !== true || !member) throw new Error("member_console_signed_context_invalid");
          if (!model) throw new Error("model_console_session_missing");
          if (String(member.sessionId || "") !== expectedSessionId) throw new Error("member_session_mismatch");
          if (String(model.session_id || "") !== expectedSessionId) throw new Error("model_session_mismatch");

          const memberDate = String(member?.jobDate || "").slice(0, 10);
          const modelDate = String(model?.job_date || "").slice(0, 10);
          if (memberDate && modelDate && memberDate !== modelDate) throw new Error("job_date_diverged");

          const memberModel = String(member?.model?.displayName || "").trim().toLowerCase();
          const modelModel = String(model?.model_name || model?.modelName || "").trim().toLowerCase();
          if (memberModel && modelModel && memberModel !== modelModel) throw new Error("model_identity_diverged");

          const memberState = String(member?.lifecycle || "").trim().toLowerCase();
          const modelState = String(model?.normalized_state || model?.state || "").trim().toLowerCase();
          const memberFamily = new Map([
            ["pending_confirmation","pre"],["confirmed","confirmed"],["preparing","confirmed"],
            ["en_route","en_route"],["nearby","nearby"],["arrived","arrived"],["met_customer","met_customer"],
            ["in_progress","work"],["completed","done"],["cancelled","cancelled"],
          ]);
          const modelFamily = new Map([
            ["offered","pre"],["confirmed","confirmed"],["en_route","en_route"],["nearby","nearby"],
            ["arrived","arrived"],["met_customer","met_customer"],["final_payment_pending","met_customer"],
            ["final_payment_confirmed","met_customer"],["work_started","work"],["work_finished","work"],
            ["separated","work"],["under_review","work"],["payout_pending","work"],["closed","done"],
            ["offer_declined","cancelled"],["offer_expired","cancelled"],
          ]);
          const mf = memberFamily.get(memberState);
          const modf = modelFamily.get(modelState);
          if (!mf || !modf) throw new Error(`state_not_comparable:${memberState}:${modelState}`);
          if (mf !== modf) throw new Error(`console_state_diverged:${memberState}:${modelState}`);

          console.log(JSON.stringify({
            result: "PASS",
            session_id: expectedSessionId,
            member_console: { lifecycle: memberState, family: mf },
            model_console: { state: modelState, family: modf },
            same_session: true,
            same_state_family: true,
            reissue: "confirmation_urls_only",
            payment_state_mutated: false,
            notifications: 0,
          }, null, 2));
          NODE
