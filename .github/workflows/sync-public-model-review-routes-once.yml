name: Sync Public Model review routes once

on:
  push:
    branches:
      - main
    paths:
      - "admin-worker/src/public-model-application-review.js"
      - "admin-worker/src/admin-login-hero-worker.js"
      - "admin-worker/wrangler.toml"
      - "sigil-worker/src/public-model-notify.js"
      - ".github/workflows/sync-public-model-review-routes-once.yml"

permissions:
  contents: read
  actions: read

jobs:
  sync-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367

    steps:
      - name: Verify route credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ROUTES_API_TOKEN:-}"
          response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.success!==true||p.result?.status!=="active") process.exit(1)' "$response"

      - name: Bind Public Model review routes to admin-worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "admin-worker";
          const desired = [
            "mmdbkk.com/internal/admin/model-applications*",
            "www.mmdbkk.com/internal/admin/model-applications*",
            "mmdbkk.com/v1/admin/model-applications*",
            "www.mmdbkk.com/v1/admin/model-applications*",
          ];
          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", ...(options.headers || {}) },
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              const detail = (payload?.errors || []).map((e) => `${e.code || "?"}: ${e.message || "unknown"}`).join("; ");
              throw new Error(`Cloudflare route API failed (${response.status}): ${detail}`);
            }
            return payload.result;
          }
          const routePath = `/zones/${zoneId}/workers/routes`;
          let existing = await cf(routePath);
          const conflicts = desired.flatMap((pattern) => existing.filter((route) => route.pattern === pattern && route.script !== worker));
          if (conflicts.length) throw new Error(`Refusing route takeover: ${conflicts.map((r) => `${r.pattern} -> ${r.script || "none"}`).join(", ")}`);
          for (const pattern of desired) {
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) continue;
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`Created ${pattern} -> ${worker}`);
          }
          existing = await cf(routePath);
          const missing = desired.filter((pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`Route verification failed: ${missing.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length} Public Model admin routes`);
          NODE

      - name: Wait for matching admin-worker deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { GH_TOKEN, REPO, SHA } = process.env;
          const headers = { Authorization: `Bearer ${GH_TOKEN}`, Accept: "application/vnd.github+json" };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 48; attempt++) {
            const r = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=30`, { headers });
            const p = await r.json();
            const run = (p.workflow_runs || []).find((item) => item.name === "Deploy admin-worker");
            if (run?.status === "completed") {
              if (run.conclusion !== "success") throw new Error(`Deploy admin-worker concluded ${run.conclusion}`);
              console.log(`Deploy admin-worker success: ${run.id}`);
              process.exit(0);
            }
            console.log(`Waiting for Deploy admin-worker (${attempt}/48): ${run?.status || "not-visible-yet"}`);
            await sleep(5000);
          }
          throw new Error("Timed out waiting for matching admin-worker deployment");
          NODE

      - name: Smoke authenticated boundary and deep-link bounce
        shell: bash
        run: |
          set -euo pipefail
          app_id="pma_smokeabcdefgh1234"
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$origin/internal/admin/model-applications?application_id=$app_id")"
            test "$code" = "303"
            grep -qi '^location: .*\/internal\/admin\/login' "$headers"
            grep -qi 'model-applications' "$headers"
            grep -qi 'application_id' "$headers"

            code="$(curl -sS -o "$body" -w '%{http_code}' "$origin/v1/admin/model-applications?limit=1")"
            test "$code" = "401"
            grep -q '"error":"unauthorized"' "$body"
          done
