name: Private Media Review CI
on:
  pull_request:
    paths:
      - 'admin-worker/src/private-media-review*'
      - 'admin-worker/private-media-review.test.mjs'
      - 'admin-worker/private-media-ingest-once.test.mjs'
      - 'admin-worker/src/private-media-ingest-once.js'
      - 'admin-worker/src/admin-login-hero-worker.js'
      - 'webflow/internal/admin/mmd-review/**'
      - '.github/workflows/private-media-review-ci.yml'
permissions:
  contents: read
jobs:
  review-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test admin-worker/private-media-review.test.mjs admin-worker/private-media-ingest-once.test.mjs admin-worker/model-schema-patch-v1.test.mjs admin-worker/admin-login-active-entrypoint.test.mjs
