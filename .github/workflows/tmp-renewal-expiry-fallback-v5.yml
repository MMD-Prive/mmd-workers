          if old not in package_text:
              raise SystemExit("package test anchor not found")
          package_path.write_text(package_text.replace(old, new, 1))

          docs = r'''# Renewal Membership Expiry Fallback V5

Status: canonical compatibility readback for `immigrate-worker` renewal status.

## Purpose

Resolve `membership.expire_at` without allowing legacy profile data to become membership, tier, status, or access authority.

## Resolution order

1. explicit **verified internal** expiry context, when one is supplied by a trusted server-side caller;
2. `MMD — Member Entitlements`, interpreted with the same capability/status vocabulary as `my_mmd_entitlement_resolver_v1`;
3. a uniquely matched canonical `Members` record, using exact LINE user ID, email, or memberstack ID only;
4. the latest Session that matches one of those strict identifiers;
5. blank (`""`) when no trustworthy expiry is available.

An ambiguous, conflicting, blocked, or failed authoritative read stops the fallback chain and returns blank. This is intentionally fail-closed.

## Boundary locks

- `MMD — Member Entitlements` / `my_mmd_entitlement_resolver_v1` remains current-rights authority.
- `Members` is compatibility/readback only.
- `Clients` is **not** an expiry fallback authority in V5.
- No name/display-name matching is allowed for expiry resolution.
- Canonical Member readback cannot set `current_tier`, `membership_status`, or access.
- Session fallback cannot set `current_tier`, `membership_status`, or access.
- Public `/member/api/renewal/status` callers cannot submit an authoritative `expire_at` value.
- Existing service-history compatibility matching may still use a display name, but the expiry fallback uses only strict LINE user ID / memberstack ID / email matches.

## Observability

`context.membership.expire_at_source` reports one of:

- `explicit_verified_context`
- `my_mmd_entitlement_resolver_v1`
- `verified_canonical_member_readback`
- `latest_verified_session`
- `none`

`expire_at_reason` provides a bounded diagnostic such as `member_entitlements`, `canonical_member`, `strict_identity_session_match`, `resolver_member_blocked`, identity conflict, or `not_found`.
'''
          Path("docs/ops/RENEWAL_MEMBERSHIP_EXPIRY_FALLBACK_V5.md").write_text(docs)
