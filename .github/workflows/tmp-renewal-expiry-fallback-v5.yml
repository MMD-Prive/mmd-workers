import fs from "node:fs";
import path from "node:path";
import { fileURLToPath } from "node:url";

const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
const helper = fs.readFileSync(path.join(root, "src/lib/membership-expiry-v5.ts"), "utf8");
const airtable = fs.readFileSync(path.join(root, "src/lib/airtable.ts"), "utf8");
