name: R2 Mek Readonly Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/r2-mek-readonly-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      R2_BUCKET: mmd-models
    steps:
      - name: Probe exact Mek path segment in R2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          bucket = os.environ.get("R2_BUCKET", "").strip()
          if not token:
              print(json.dumps({"ok": False, "error": "missing_cloudflare_api_token"}))
              sys.exit(2)

          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/r2/buckets/{bucket}/objects"
          cursor = ""
          pages = 0
          scanned = 0
          matches = []

          while pages < 100:
              params = {"per_page": "1000"}
              if cursor:
                  params["cursor"] = cursor
              url = base + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:2000]
                  print(json.dumps({"ok": False, "error": "cloudflare_http_error", "status": exc.code, "body": body}))
                  sys.exit(3)

              if not payload.get("success"):
                  print(json.dumps({"ok": False, "error": "cloudflare_api_error", "errors": payload.get("errors", [])}))
                  sys.exit(4)

              rows = payload.get("result") or []
              scanned += len(rows)
              for row in rows:
                  key = str(row.get("key") or "")
                  segments = [segment for segment in key.split("/") if segment]
                  if any(segment.casefold() == "mek" for segment in segments):
                      matches.append({
                          "key": key,
                          "size": row.get("size"),
                          "uploaded": row.get("uploaded"),
                          "content_type": (row.get("http_metadata") or {}).get("contentType"),
                          "etag": row.get("etag"),
                      })

              info = payload.get("result_info") or {}
              if not info.get("is_truncated"):
                  break
              cursor = str(info.get("cursor") or "")
              if not cursor:
                  break
              pages += 1

          prefixes = {}
          for item in matches:
              key = item["key"]
              parts = [part for part in key.split("/") if part]
              for index, part in enumerate(parts[:-1]):
                  if part.casefold() == "mek":
                      prefix = "/".join(parts[: index + 1]) + "/"
                      prefixes[prefix] = prefixes.get(prefix, 0) + 1

          result = {
              "ok": True,
              "bucket": bucket,
              "scanned_objects": scanned,
              "exact_mek_prefixes": [{"prefix": key, "object_count": value} for key, value in sorted(prefixes.items())],
              "matches": sorted(matches, key=lambda item: item["key"]),
          }
          with open("mek-r2-probe.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
          print("R2_MEK_PROBE_RESULT=" + json.dumps(result, ensure_ascii=False, separators=(",", ":")))
          PY

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-mek-probe
          path: mek-r2-probe.json
          if-no-files-found: ignore
          retention-days: 1
