name: Deploy model-console-worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "model-console-worker/**"
      - ".github/workflows/deploy-model-console-worker.yml"

concurrency:
  group: deploy-model-console-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: model-console-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      WORKER_URL: https://model-console-worker.malemodel-bkk.workers.dev

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate source
        run: |
          set -euo pipefail
          node --check src/index.js
          ! grep -q 'placeholder="ADMIN_BEARER"' public/index.html
          grep -q "credentials:'include'" public/index.html
          grep -q '"generic_proxy_disabled"' src/index.js
          grep -q 'SESSION_VALIDATOR_BASE_URL = "https://mmdbkk.com"' wrangler.toml
          grep -q 'ADMIN_EVENT_LOG_PATH = "/v1/admin/model-console/audit"' wrangler.toml
          npx --yes wrangler@4 deploy --dry-run

      - name: Ensure working-memory KV binding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          (async () => {
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = (process.env.CLOUDFLARE_API_TOKEN || "").trim();
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is missing");
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces`;
          const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
          const call = async (url, init = {}) => {
            const response = await fetch(url, { ...init, headers: { ...headers, ...(init.headers || {}) } });
            const data = await response.json();
            if (!response.ok || data.success !== true) throw new Error(JSON.stringify(data.errors || data));
            return data.result;
          };
          let namespaces = await call(api + "?per_page=100");
          let ns = namespaces.find((item) => item.title === "MMD_MODEL_CONSOLE_MEMORY");
          if (!ns) ns = await call(api, { method: "POST", body: JSON.stringify({ title: "MMD_MODEL_CONSOLE_MEMORY" }) });
          const source = fs.readFileSync("wrangler.toml", "utf8");
          const cleaned = source.replace(/\n# \[\[kv_namespaces\]\]\n# binding = "MMD_MODEL_CONSOLE_MEMORY"\n# id = "<KV_NAMESPACE_ID>"\n?/, "\n");
          fs.writeFileSync(".wrangler-production.toml", cleaned + `\n[[kv_namespaces]]\nbinding = "MMD_MODEL_CONSOLE_MEMORY"\nid = "${ns.id}"\n`);
          console.log("KV namespace resolved");
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Deploy production
        run: npx --yes wrangler@4 deploy --keep-vars --config .wrangler-production.toml

      - name: Smoke production
        run: |
          set -euo pipefail
          body="$(curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$WORKER_URL/ping")"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true||x.version!=="model-console-v1.1"||x.contract_version!=="mmd.model-console.v1.1") process.exit(1)' "$body"
