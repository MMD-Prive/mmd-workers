name: Connect CEO model supply production ingress

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/model-supply-production-ingress.yml"
      - "admin-worker/src/index.js"
      - "admin-worker/src/admin-login-hero-worker.js"
      - "admin-worker/src/model-asset-readiness.js"
  workflow_run:
    workflows:
      - Deploy admin-worker
    types:
      - completed

permissions:
  contents: read

jobs:
  connect-model-supply-routes:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      ADMIN_SMOKE_CREDENTIAL: ${{ secrets.ADMIN_LOGIN_CREDENTIAL || secrets.ADMIN_BEARER }}
    steps:
      - name: Point model supply endpoints to admin-worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = (process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").trim();
          const worker = "admin-worker";
          if (!token) throw new Error("CLOUDFLARE_ROUTES_API_TOKEN is missing");

          const desired = [
            "mmdbkk.com/v1/admin/models/list",
            "www.mmdbkk.com/v1/admin/models/list",
            "mmdbkk.com/v1/admin/models/list*",
            "www.mmdbkk.com/v1/admin/models/list*",
            "mmdbkk.com/v1/admin/models/resolve-source",
            "www.mmdbkk.com/v1/admin/models/resolve-source",
            "mmdbkk.com/v1/admin/models/resolve-source*",
            "www.mmdbkk.com/v1/admin/models/resolve-source*",
          ];

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing to replace existing routes: ${conflicts.map((route) => `${route.pattern} -> ${route.script || "no script"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Route verification failed: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length} CEO model supply routes`);
          NODE

      - name: Smoke unauthenticated model supply ownership
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            for path in "/v1/admin/models/list?limit=1" "/v1/admin/models/resolve-source?q=route-smoke"; do
              body_file="$(mktemp)"
              http_code="$(curl -L --max-redirs 3 --retry 6 --retry-delay 2 --retry-all-errors -sS \
                -o "$body_file" -w "%{http_code}" \
                "$origin$path")"
              cat "$body_file"
              test "$http_code" = "401"
              grep -q '"error":"unauthorized"' "$body_file"
            done
          done

      - name: Smoke authenticated CEO models page and live model APIs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_SMOKE_CREDENTIAL:-}"
          echo "::add-mask::$ADMIN_SMOKE_CREDENTIAL"

          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            cookie="$(mktemp)"
            headers="$(mktemp)"
            body="$(mktemp)"

            login_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
              -D "$headers" -o "$body" -c "$cookie" -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "credential=$ADMIN_SMOKE_CREDENTIAL" \
              --data-urlencode "next=/internal/ceo/models" \
              "$origin/internal/admin/login/session")"
            test "$login_code" = "303"
            grep -qi '^set-cookie: mmd_admin_gate_v1=' "$headers"
            tr -d '\r' < "$headers" | grep -Fqi 'location: /internal/ceo/models'

            page_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
              -o "$body" -b "$cookie" -w "%{http_code}" \
              "$origin/internal/ceo/models")"
            test "$page_code" = "200"
            grep -q 'model-supply-v3' "$body"
            grep -q 'SUPPLY INTELLIGENCE' "$body"
            grep -Fq '/v1/admin/models/list?limit=100' "$body"
            grep -Fq '/v1/admin/models/resolve-source?q=' "$body"

            list_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
              -o "$body" -b "$cookie" -w "%{http_code}" \
              "$origin/v1/admin/models/list?limit=5")"
            test "$list_code" = "200"

            model_count="$(node - "$body" <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const list = Array.isArray(p.items) ? p.items : Array.isArray(p.models) ? p.models : Array.isArray(p.records) ? p.records : [];
          if (!list.length) process.exit(1);
          process.stdout.write(String(list.length));
          NODE
            )"

            model_query="$(node - "$body" <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const list = Array.isArray(p.items) ? p.items : Array.isArray(p.models) ? p.models : Array.isArray(p.records) ? p.records : [];
          const x = list[0] || {};
          const f = x && typeof x.fields === 'object' && x.fields ? x.fields : {};
          const values = [x.working_name, x.model_name, x.name, x.model_code, x.model_id, x.model_record_id, x.id, f.working_name, f.model_name, f.name, f.model_code, f.model_id, f.id];
          const q = values.find((v) => typeof v === 'string' && v.trim());
          if (!q) process.exit(1);
          process.stdout.write(q.trim());
          NODE
            )"

            resolve_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
              -o "$body" -b "$cookie" -w "%{http_code}" \
              -G --data-urlencode "q=$model_query" \
              "$origin/v1/admin/models/resolve-source")"
            test "$resolve_code" = "200"
            node - "$body" <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!p || typeof p !== 'object' || p.ok === false) process.exit(1);
          if (p.authority !== 'backend') process.exit(1);
          if (p.published !== false || p.can_publish !== false) process.exit(1);
          NODE

            echo "PASS: $origin authenticated CEO models page + model inventory ($model_count sampled) + readiness lookup"
          done
