name: Apply approved immigrate-worker routes
run-name: 'Routes ${{ inputs.route_scope }} at ${{ inputs.approved_sha }}'

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: Confirm this run requests a production route change
        type: boolean
        required: true
        default: false
      approval_ref:
        description: Boss Per approval reference for this exact route change
        type: string
        required: true
      approved_sha:
        description: Full current main SHA to approve
        type: string
        required: true
      route_scope:
        description: Route group to reconcile
        type: choice
        options:
          - ingress
          - member-intelligence
          - ceo
        required: true
      route_plan:
        description: Exact route plan JSON generated from live state with read-only access
        type: string
        required: true
      route_plan_digest:
        description: SHA-256 of the canonical route plan
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-immigrate-worker-production
  cancel-in-progress: false

jobs:
  approval-policy:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}

  review-plan:
    needs: approval-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Publish the exact route diff for Boss Per to review
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          ROUTE_SCOPE: ${{ inputs.route_scope }}
          ROUTE_PLAN: ${{ inputs.route_plan }}
          ROUTE_PLAN_DIGEST: ${{ inputs.route_plan_digest }}
        run: node scripts/immigrate-worker-route-plan.mjs --review >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: review-plan
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify and apply only the approved route operations
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_ENVIRONMENT_NAME: mmd-production-mutation
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          ROUTE_SCOPE: ${{ inputs.route_scope }}
          ROUTE_PLAN: ${{ inputs.route_plan }}
          ROUTE_PLAN_DIGEST: ${{ inputs.route_plan_digest }}
          IMMIGRATE_ROUTE_MUTATION_TOKEN: ${{ secrets.IMMIGRATE_ROUTE_MUTATION_TOKEN }}
        run: node scripts/immigrate-worker-route-plan.mjs --apply
