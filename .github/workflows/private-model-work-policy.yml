name: Private Model work policy

on:
  pull_request:
    paths:
      - "admin-worker/src/private-model-work-policy.js"
      - "admin-worker/src/admin-login-hero-worker.js"
      - "admin-worker/private-model-work-policy.test.mjs"
      - ".github/workflows/private-model-work-policy.yml"
  push:
    branches:
      - main
    paths:
      - "admin-worker/src/private-model-work-policy.js"
      - "admin-worker/src/admin-login-hero-worker.js"
      - "admin-worker/private-model-work-policy.test.mjs"
      - ".github/workflows/private-model-work-policy.yml"

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check admin-worker/src/private-model-work-policy.js
          node --check admin-worker/src/admin-login-hero-worker.js
      - name: Private work capability tests
        run: node --test admin-worker/private-model-work-policy.test.mjs
      - name: Admin Worker dry run
        run: npx wrangler deploy --dry-run --config admin-worker/wrangler.toml
