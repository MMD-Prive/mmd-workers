name: Patch Refund Model MiniApp Direct

on:
  push:
    branches:
      - patch/refund-model-miniapp-direct

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: patch/refund-model-miniapp-direct
      - name: Patch refund model URL and existing-model copy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'admin-worker/src/refund-ops.js';
          let src = fs.readFileSync(file, 'utf8');
          const oldFn = `function modelJobAppUrl(payload = {}) {
  const jobId = clean(payload.job_id, 120);
  if (!jobId) return "";
  const next = new URL(\`https://sigil.mmdbkk.com/public/api/jobs/\${encodeURIComponent(jobId)}\`);
  const url = new URL("https://www.mmdbkk.com/sigil/model/login");
  url.searchParams.set("intent", "job_board");
  url.searchParams.set("source", "refund_completed_pack");
  url.searchParams.set("return_to", "public_job_board");
  url.searchParams.set("job_id", jobId);
  url.searchParams.set("next", next.toString());
  return url.toString();
}
`;
          const newFn = `function modelJobAppUrl(payload = {}) {
  const jobId = clean(payload.job_id, 120);
  if (!jobId) return "";
  const next = new URL(\`https://sigil.mmdbkk.com/public/api/jobs/\${encodeURIComponent(jobId)}\`);
  const url = new URL("https://miniapp.line.me/2010864854-N34SgCqq/");
  url.searchParams.set("intent", "job_board");
  url.searchParams.set("source", "refund_completed_pack");
  url.searchParams.set("return_to", "public_job_board");
  url.searchParams.set("job_id", jobId);
  url.searchParams.set("next", next.toString());
  url.searchParams.set("lang", "th");
  return url.toString();
}
`;
          if (!src.includes(oldFn)) throw new Error('modelJobAppUrl block not found');
          src = src.replace(oldFn, newFn);
          fs.writeFileSync(file, src);

          const testFile = 'admin-worker/refund-ops.test.mjs';
          let test = fs.readFileSync(testFile, 'utf8');
          test = test.replace(
            '    assert.match(stored.model_job_app_url, /\\/sigil\\/model\\/login\\?/);',
            '    assert.match(stored.model_job_app_url, /^https:\\/\\/miniapp\\.line\\.me\\/2010864854-N34SgCqq\\//);'
          );
          test = test.replace(
            '    assert.match(payload.model_job_app_url, /^https:\\/\\/www\\.mmdbkk\\.com\\/sigil\\/model\\/login\\?/);',
            '    assert.match(payload.model_job_app_url, /^https:\\/\\/miniapp\\.line\\.me\\/2010864854-N34SgCqq\\//);'
          );
          test = test.replace(
            '    assert.match(payload.model_job_app_url, /job_id=JOB-FILM-J-20260929/);',
            '    assert.match(payload.model_job_app_url, /job_id=JOB-FILM-J-20260929/);\n    assert.match(payload.model_job_app_url, /lang=th/);'
          );
          if (!test.includes('miniapp\\.line\\.me')) throw new Error('test patch did not apply');
          fs.writeFileSync(testFile, test);

          const docFile = 'docs/ops/REFUND_COMPLETED_LINK_PACK_POLICY.md';
          if (fs.existsSync(docFile)) {
            let doc = fs.readFileSync(docFile, 'utf8');
            if (!doc.includes('miniapp.line.me')) {
              doc += `\n\n## Model App Link Authority\n\nFor refund-completed packs, the Model job/app URL must be a direct LINE Mini App link:\n\n\`https://miniapp.line.me/2010864854-N34SgCqq/?intent=job_board&source=refund_completed_pack&return_to=public_job_board&job_id=...&next=...&lang=th\`\n\nDo not send \`https://www.mmdbkk.com/sigil/model/login?...\` as the model-facing link in this pack; that Web route is only a presentation/fallback surface and can land on the guide page before the Mini App handoff.\n`;
              fs.writeFileSync(docFile, doc);
            }
          }

          const existingDoc = 'docs/model/EXISTING_MODEL_VERIFY_COPY_POLICY.md';
          fs.writeFileSync(existingDoc, `# Existing Model Verify Copy Policy\n\nExisting MMD models who open a job, wish, or direct model link must not be told to apply again.\n\nRequired copy intent:\n\n- Use \"ยืนยันตัวตนโมเดลเดิม\" / \"Verify existing model identity\".\n- Avoid \"สมัครใหม่\", \"สมัครเป็นโมเดล\", \"Apply\", or copy that implies a new application when ` + "`" + `intent=job_board` + "`" + `, ` + "`" + `/wish` + "`" + `, or an existing model context is present.\n- After LINE verification, route to ` + "`" + `existing_bound` + "`" + ` and continue to the requested job or wish destination.\n- For unknown identity, show review/verify language, not a new application promise.\n\nOwner examples: ATOM IX and EMs11 are existing-model cases; they should verify/bind, not reapply.\n`);
          NODE
      - name: Validate focused refund ops tests
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/refund-ops.js
          node --test admin-worker/refund-ops.test.mjs
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-refund-model-miniapp-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-worker/src/refund-ops.js admin-worker/refund-ops.test.mjs docs/ops/REFUND_COMPLETED_LINK_PACK_POLICY.md docs/model/EXISTING_MODEL_VERIFY_COPY_POLICY.md .github/workflows/patch-refund-model-miniapp-direct.yml
          git commit -m "Use Mini App direct link for refund model jobs"
          git push origin HEAD:patch/refund-model-miniapp-direct
