name: Patch Model Job Handoff Owner Alias

on:
  push:
    branches:
      - patch/refund-model-miniapp-direct

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: patch/refund-model-miniapp-direct
      - name: Patch model job URL and owner alias handoff
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(file, oldText, newText, label) {
            let src = fs.readFileSync(file, 'utf8');
            if (!src.includes(oldText)) throw new Error(`${label} not found in ${file}`);
            src = src.replace(oldText, newText);
            fs.writeFileSync(file, src);
          }

          // 1) Refund completed pack: model-facing link must open the LINE Mini App directly
          // and carry Boss Per's job-assigned model alias. Do not rely on a model self-set
          // onboarding display name such as "film BB".
          replaceOnce('admin-worker/src/refund-ops.js', `function modelJobAppUrl(payload = {}) {
  const jobId = clean(payload.job_id, 120);
  if (!jobId) return "";
  const next = new URL(` + '`' + `https://sigil.mmdbkk.com/public/api/jobs/` + '${encodeURIComponent(jobId)}' + '`' + `);
  const url = new URL("https://www.mmdbkk.com/sigil/model/login");
  url.searchParams.set("intent", "job_board");
  url.searchParams.set("source", "refund_completed_pack");
  url.searchParams.set("return_to", "public_job_board");
  url.searchParams.set("job_id", jobId);
  url.searchParams.set("next", next.toString());
  return url.toString();
}
`, `function modelJobAppUrl(payload = {}) {
  const jobId = clean(payload.job_id, 120);
  if (!jobId) return "";
  const next = new URL(` + '`' + `https://sigil.mmdbkk.com/public/api/jobs/` + '${encodeURIComponent(jobId)}' + '`' + `);
  const url = new URL("https://miniapp.line.me/2010864854-N34SgCqq/");
  const modelAlias = clean(payload.model_alias || payload.owner_model_alias || payload.model_name || payload.model_display_name || "Film J", 160);
  const modelRecordId = clean(payload.model_record_id || payload.model_id || payload.model_airtable_id || "", 120);
  url.searchParams.set("intent", "job_board");
  url.searchParams.set("source", "refund_completed_pack");
  url.searchParams.set("return_to", "public_job_board");
  url.searchParams.set("job_id", jobId);
  url.searchParams.set("next", next.toString());
  url.searchParams.set("lang", "th");
  if (modelAlias) url.searchParams.set("model_alias", modelAlias);
  if (modelRecordId) url.searchParams.set("model_record_id", modelRecordId);
  return url.toString();
}
`, 'refund modelJobAppUrl');

          // 2) Web fallback /sigil/model/login must preserve owner-assigned model alias
          // when it forwards into the Mini App.
          replaceOnce('webflow/sigil/model/model-login-miniapp-entry-v1.js', `    const campaignId = String(sourceUrl.searchParams.get("campaign_id") || "").trim();
    return {
      intent: "job_board",
      return_to: "public_job_board",
      source: /^[A-Za-z0-9._:-]{1,80}$/.test(source) ? source : "line_model_group",
      job_id: jobId,
      next: safeJobBoardNext(sourceUrl.searchParams.get("next"), jobId),
      campaign_id: /^[A-Za-z0-9._:-]{1,128}$/.test(campaignId) ? campaignId : "",
    };
`, `    const campaignId = String(sourceUrl.searchParams.get("campaign_id") || "").trim();
    const modelAlias = String(sourceUrl.searchParams.get("model_alias") || "").trim().slice(0, 160);
    const modelRecordId = String(sourceUrl.searchParams.get("model_record_id") || "").trim();
    return {
      intent: "job_board",
      return_to: "public_job_board",
      source: /^[A-Za-z0-9._:-]{1,80}$/.test(source) ? source : "line_model_group",
      job_id: jobId,
      next: safeJobBoardNext(sourceUrl.searchParams.get("next"), jobId),
      campaign_id: /^[A-Za-z0-9._:-]{1,128}$/.test(campaignId) ? campaignId : "",
      model_alias: modelAlias,
      model_record_id: /^[A-Za-z0-9._:-]{1,120}$/.test(modelRecordId) ? modelRecordId : "",
    };
`, 'model login context owner alias');
          replaceOnce('webflow/sigil/model/model-login-miniapp-entry-v1.js', `    if (context.job_id) url.searchParams.set("job_id", context.job_id);
    if (context.campaign_id) url.searchParams.set("campaign_id", context.campaign_id);
    return url.toString();
`, `    if (context.job_id) url.searchParams.set("job_id", context.job_id);
    if (context.campaign_id) url.searchParams.set("campaign_id", context.campaign_id);
    if (context.model_alias) url.searchParams.set("model_alias", context.model_alias);
    if (context.model_record_id) url.searchParams.set("model_record_id", context.model_record_id);
    return url.toString();
`, 'model login target preserves alias');

          // 3) Worker Mini App handoff must preserve owner alias and must never fall through
          // to Phase A onboarding for job_board intent after LIFF bootstrap.
          replaceOnce('model-dashboard-presentation-worker/src/index.js', `  const rawSource = String(boundedParam(source, "source") || "line_model_group").trim();
  return {
    intent: "job_board",
    return_to: "public_job_board",
    source: /^[A-Za-z0-9._:-]{1,80}$/.test(rawSource) ? rawSource : "line_model_group",
    job_id: jobId,
    next,
  };
}
`, `  const rawSource = String(boundedParam(source, "source") || "line_model_group").trim();
  const rawModelAlias = String(boundedParam(source, "model_alias") || "").trim().slice(0, 160);
  const rawModelRecordId = String(boundedParam(source, "model_record_id") || "").trim();
  return {
    intent: "job_board",
    return_to: "public_job_board",
    source: /^[A-Za-z0-9._:-]{1,80}$/.test(rawSource) ? rawSource : "line_model_group",
    job_id: jobId,
    next,
    model_alias: rawModelAlias,
    model_record_id: /^[A-Za-z0-9._:-]{1,120}$/.test(rawModelRecordId) ? rawModelRecordId : "",
  };
}
`, 'dashboard job board context alias');
          replaceOnce('model-dashboard-presentation-worker/src/index.js', `    if (jobBoard.job_id) params.set("job_id", jobBoard.job_id);
`, `    if (jobBoard.job_id) params.set("job_id", jobBoard.job_id);
    if (jobBoard.model_alias) params.set("model_alias", jobBoard.model_alias);
    if (jobBoard.model_record_id) params.set("model_record_id", jobBoard.model_record_id);
`, 'safe bootstrap alias params');
          replaceOnce('model-dashboard-presentation-worker/src/index.js', `    && !boundedParam(url, "return_to")
    && !boundedParam(url, "handoff")
    && !boundedParam(url, "flow");
}
`, `    && boundedParam(url, "intent") !== "job_board"
    && !boundedParam(url, "return_to")
    && !boundedParam(url, "handoff")
    && !boundedParam(url, "flow");
}
`, 'prevent job board phase a fallback');
          replaceOnce('model-dashboard-presentation-worker/src/index.js', `    if (jobBoard.job_id) params.set("job_id", jobBoard.job_id);
  } else {
`, `    if (jobBoard.job_id) params.set("job_id", jobBoard.job_id);
    if (jobBoard.model_alias) params.set("model_alias", jobBoard.model_alias);
    if (jobBoard.model_record_id) params.set("model_record_id", jobBoard.model_record_id);
  } else {
`, 'miniapp handoff alias params');
          replaceOnce('model-dashboard-presentation-worker/src/model-liff-digital-shell.js', `        job_id: String(jobBoard.job_id || ""),
        next: String(jobBoard.next || ""),
      }
`, `        job_id: String(jobBoard.job_id || ""),
        next: String(jobBoard.next || ""),
        model_alias: String(jobBoard.model_alias || ""),
        model_record_id: String(jobBoard.model_record_id || ""),
      }
`, 'digital shell safe jobboard alias');
          replaceOnce('model-dashboard-presentation-worker/src/model-liff-digital-shell.js', `    ${safeJobBoard.next ? ` + '`' + `handoffParams.set("next",${JSON.stringify(safeJobBoard.next)});` + '`' + ` : ""}
    var handoff=await fetch("/v1/model/job-board/handoff?"+handoffParams.toString(),{method:"GET",credentials:"include",cache:"no-store",headers:{accept:"application/json"}});
`, `    ${safeJobBoard.next ? ` + '`' + `handoffParams.set("next",${JSON.stringify(safeJobBoard.next)});` + '`' + ` : ""}
    ${safeJobBoard.model_alias ? ` + '`' + `handoffParams.set("model_alias",${JSON.stringify(safeJobBoard.model_alias)});` + '`' + ` : ""}
    ${safeJobBoard.model_record_id ? ` + '`' + `handoffParams.set("model_record_id",${JSON.stringify(safeJobBoard.model_record_id)});` + '`' + ` : ""}
    var handoff=await fetch("/v1/model/job-board/handoff?"+handoffParams.toString(),{method:"GET",credentials:"include",cache:"no-store",headers:{accept:"application/json"}});
`, 'digital shell handoff alias params');
          replaceOnce('model-dashboard-presentation-worker/src/model-liff-digital-shell.js', `  const title = jobBoardMode ? "กำลังเปิดงาน MMD" : (primary ? "ยืนยัน LINE สำหรับ MMD APP" : "เปิด MMD APP");
  const copy = jobBoardMode ? "ยืนยัน LINE ครั้งเดียว แล้วเปิดรายละเอียดงานนี้ต่อทันที" : (primary ? "กำลังสร้างเซสชันโมเดลที่ปลอดภัย" : "กำลังยืนยัน LINE และเตรียมพื้นที่ทำงาน");
  const success = jobBoardMode ? "ยืนยัน LINE แล้ว · กำลังเปิดงาน…" : (primary ? "ยืนยัน LINE แล้ว · กำลังเปิด MMD APP…" : "ยืนยัน LINE แล้ว · กำลังเปิดพื้นที่ทำงาน…");
`, `  const ownerAlias = safeJobBoard && safeJobBoard.model_alias ? safeJobBoard.model_alias : "";
  const title = jobBoardMode ? (ownerAlias ? "ยืนยันตัวตนสำหรับงาน " + ownerAlias : "กำลังเปิดงาน MMD") : (primary ? "ยืนยัน LINE สำหรับ MMD APP" : "เปิด MMD APP");
  const copy = jobBoardMode ? "ยืนยัน LINE ครั้งเดียว แล้วเปิดรายละเอียดงานนี้ต่อทันที" : (primary ? "กำลังสร้างเซสชันโมเดลที่ปลอดภัย" : "กำลังยืนยัน LINE และเตรียมพื้นที่ทำงาน");
  const success = jobBoardMode ? (ownerAlias ? "ยืนยัน LINE แล้ว · กำลังเปิดงาน " + ownerAlias + "…" : "ยืนยัน LINE แล้ว · กำลังเปิดงาน…") : (primary ? "ยืนยัน LINE แล้ว · กำลังเปิด MMD APP…" : "ยืนยัน LINE แล้ว · กำลังเปิดพื้นที่ทำงาน…");
`, 'digital shell owner alias copy');

          // 4) Tests/source locks.
          const testFile = 'admin-worker/refund-ops.test.mjs';
          if (fs.existsSync(testFile)) {
            let test = fs.readFileSync(testFile, 'utf8');
            test = test.replace(
              '    assert.match(stored.model_job_app_url, /\\/sigil\\/model\\/login\\?/);',
              '    assert.match(stored.model_job_app_url, /^https:\\/\\/miniapp\\.line\\.me\\/2010864854-N34SgCqq\\//);'
            );
            test = test.replace(
              '    assert.match(payload.model_job_app_url, /^https:\\/\\/www\\.mmdbkk\\.com\\/sigil\\/model\\/login\\?/);',
              '    assert.match(payload.model_job_app_url, /^https:\\/\\/miniapp\\.line\\.me\\/2010864854-N34SgCqq\\//);'
            );
            test = test.replace(
              '    assert.match(payload.model_job_app_url, /job_id=JOB-FILM-J-20260929/);',
              '    assert.match(payload.model_job_app_url, /job_id=JOB-FILM-J-20260929/);\n    assert.match(payload.model_job_app_url, /model_alias=Film\\+J/);\n    assert.match(payload.model_job_app_url, /lang=th/);'
            );
            fs.writeFileSync(testFile, test);
          }

          const guard = 'model-dashboard-presentation-worker/model-job-board-owner-alias.test.mjs';
          fs.writeFileSync(guard, `import assert from "node:assert/strict";\nimport { test } from "node:test";\n\nimport {\n  modelMiniAppHandoffUrl,\n  resolveJobBoardContextFromRequest,\n  shouldServePhaseAAfterBootstrap,\n} from "./src/index.js";\nimport { modelLiffDigitalBootstrapHtml } from "./src/model-liff-digital-shell.js";\n\ntest("job board handoff preserves owner assigned model alias", () => {\n  const request = new Request("https://www.mmdbkk.com/sigil/model/dashboard?intent=job_board&source=refund_completed_pack&job_id=JOB-FILM-J-20260929&model_alias=Film%20J&model_record_id=recFilmJ&next=https%3A%2F%2Fsigil.mmdbkk.com%2Fpublic%2Fapi%2Fjobs%2FJOB-FILM-J-20260929");\n  const context = resolveJobBoardContextFromRequest(request);\n  assert.equal(context.model_alias, "Film J");\n  assert.equal(context.model_record_id, "recFilmJ");\n  const handoff = new URL(modelMiniAppHandoffUrl(request));\n  assert.equal(handoff.origin, "https://miniapp.line.me");\n  assert.equal(handoff.searchParams.get("model_alias"), "Film J");\n  assert.equal(handoff.searchParams.get("model_record_id"), "recFilmJ");\n});\n\ntest("job board bootstrap does not fall through to Phase A onboarding", () => {\n  const request = new Request("https://www.mmdbkk.com/sigil/model/dashboard?intent=job_board&job_id=JOB-FILM-J-20260929", { headers: { cookie: "mmd_liff_boot=1" } });\n  assert.equal(shouldServePhaseAAfterBootstrap(request), false);\n});\n\ntest("job board bootstrap copy uses owner alias instead of self display name", () => {\n  const html = modelLiffDigitalBootstrapHtml({\n    liffId: "2010864854-N34SgCqq",\n    fallback: "https://miniapp.line.me/2010864854-N34SgCqq/",\n    sdk: "https://static.line-scdn.net/liff/edge/2/sdk.js",\n    jobBoard: { job_id: "JOB-FILM-J-20260929", next: "https://sigil.mmdbkk.com/public/api/jobs/JOB-FILM-J-20260929", model_alias: "Film J", model_record_id: "recFilmJ" },\n  });\n  assert.match(html, /ยืนยันตัวตนสำหรับงาน Film J/);\n  assert.match(html, /model_alias/);\n  assert.doesNotMatch(html, /สมัครเป็นโมเดล MMD/);\n});\n`);

          const existingDoc = 'docs/model/EXISTING_MODEL_VERIFY_COPY_POLICY.md';
          fs.mkdirSync('docs/model', { recursive: true });
          fs.writeFileSync(existingDoc, `# Existing Model Verify Copy Policy\n\nExisting MMD models who open a job, wish, or direct model link must not be told to apply again.\n\nRequired copy intent:\n\n- Use \"ยืนยันตัวตนโมเดลเดิม\" / \"Verify existing model identity\".\n- For job links, use the owner/job-assigned alias from the handoff, for example \"Film J\". Do not replace it with a self-set onboarding display name such as \"film BB\".\n- Avoid \"สมัครใหม่\", \"สมัครเป็นโมเดล\", \"Apply\", or copy that implies a new application when ` + "`" + `intent=job_board` + "`" + `, ` + "`" + `/wish` + "`" + `, or an existing model context is present.\n- After LINE verification, route to ` + "`" + `existing_bound` + "`" + ` and continue to the requested job or wish destination.\n- For unknown identity, show review/verify language, not a new application promise.\n\nOwner examples: Film J, ATOM IX and EMs11 are existing-model/job-handoff cases; they should verify/bind, not reapply.\n`);

          const opsDoc = 'docs/ops/REFUND_COMPLETED_LINK_PACK_POLICY.md';
          if (fs.existsSync(opsDoc)) {
            let doc = fs.readFileSync(opsDoc, 'utf8');
            if (!doc.includes('model_alias=Film+J')) {
              doc += `\n\n## Model App Link Authority\n\nFor refund-completed packs, the Model job/app URL must be a direct LINE Mini App link and preserve Boss Per's job-assigned model alias:\n\n\`https://miniapp.line.me/2010864854-N34SgCqq/?intent=job_board&source=refund_completed_pack&return_to=public_job_board&job_id=...&next=...&lang=th&model_alias=Film+J&model_record_id=...\`\n\nDo not send \`https://www.mmdbkk.com/sigil/model/login?...\` as the model-facing link in this pack; that Web route is only a presentation/fallback surface and can land on the guide page before the Mini App handoff.\n\nDo not infer model identity from the model's self-set onboarding display name. The job link owns the assignment alias.\n`;
              fs.writeFileSync(opsDoc, doc);
            }
          }
          NODE
      - name: Validate focused model job handoff tests
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/refund-ops.js
          node --check model-dashboard-presentation-worker/src/index.js
          node --check model-dashboard-presentation-worker/src/model-liff-digital-shell.js
          node --test model-dashboard-presentation-worker/model-job-board-owner-alias.test.mjs
          node --test admin-worker/refund-ops.test.mjs
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-refund-model-miniapp-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-worker/src/refund-ops.js admin-worker/refund-ops.test.mjs webflow/sigil/model/model-login-miniapp-entry-v1.js model-dashboard-presentation-worker/src/index.js model-dashboard-presentation-worker/src/model-liff-digital-shell.js model-dashboard-presentation-worker/model-job-board-owner-alias.test.mjs docs/ops/REFUND_COMPLETED_LINK_PACK_POLICY.md docs/model/EXISTING_MODEL_VERIFY_COPY_POLICY.md .github/workflows/patch-refund-model-miniapp-direct.yml
          git commit -m "Preserve owner alias in model job handoff"
          git push origin HEAD:patch/refund-model-miniapp-direct
