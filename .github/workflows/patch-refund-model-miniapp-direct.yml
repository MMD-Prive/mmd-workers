name: Patch Model Job Handoff Owner Alias

on:
  push:
    branches:
      - patch/refund-model-miniapp-direct

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: patch/refund-model-miniapp-direct

      - name: Apply owner alias job handoff patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def replace_exact(path, old, new, label):
              src = read(path)
              if old not in src:
                  raise SystemExit(f"{label} not found in {path}")
              write(path, src.replace(old, new, 1))

          def replace_exact_count(path, old, new, count, label):
              src = read(path)
              if src.count(old) < count:
                  raise SystemExit(f"{label} expected {count} matches in {path}")
              for _ in range(count):
                  src = src.replace(old, new, 1)
              write(path, src)

          def replace_regex(path, pattern, new, label):
              src = read(path)
              next_src, hits = re.subn(pattern, lambda _m: new, src, count=1, flags=re.S)
              if hits != 1:
                  raise SystemExit(f"{label} not found in {path}")
              write(path, next_src)

          replace_regex(
              "admin-worker/src/refund-ops.js",
              r"function modelJobAppUrl\(payload = \{\}\) \{.*?\n\}\n\nfunction telegramChatId",
              '''function modelJobAppUrl(payload = {}) {
  const jobId = clean(payload.job_id, 120);
  if (!jobId) return "";
  const next = new URL(`https://sigil.mmdbkk.com/public/api/jobs/${encodeURIComponent(jobId)}`);
  const url = new URL("https://miniapp.line.me/2010864854-N34SgCqq/");
  const modelAlias = clean(payload.model_alias || payload.owner_model_alias || payload.model_name || payload.model_display_name || "Film J", 160);
  const modelRecordId = clean(payload.model_record_id || payload.model_id || payload.model_airtable_id || "", 120);
  url.searchParams.set("intent", "job_board");
  url.searchParams.set("source", "refund_completed_pack");
  url.searchParams.set("return_to", "public_job_board");
  url.searchParams.set("job_id", jobId);
  url.searchParams.set("next", next.toString());
  url.searchParams.set("lang", "th");
  if (modelAlias) url.searchParams.set("model_alias", modelAlias);
  if (modelRecordId) url.searchParams.set("model_record_id", modelRecordId);
  return url.toString();
}

function telegramChatId''',
              "refund modelJobAppUrl",
          )

