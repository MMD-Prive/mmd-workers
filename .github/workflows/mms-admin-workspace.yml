name: MMS Admin Workspace Contracts
on:
  pull_request:
    paths:
      - 'admin-worker/**'
      - 'mms-worker/**'
      - '.github/workflows/mms-admin-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'admin-worker/**'
      - 'mms-worker/**'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-global-webcrypto --test mms-worker/test/workspace-admin.test.mjs admin-worker/mms-admin-workspace.test.mjs admin-worker/mms-admin-my-mms-access.test.mjs admin-worker/mms-admin-inline-syntax.test.mjs
