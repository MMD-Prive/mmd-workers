name: Deploy MY MMD Standby Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-my-mmd-standby-worker.yml"
  pull_request:
    paths:
      - "my-mmd-standby-worker/**"
      - "docs/ops/MY_MMD_LIFF_STANDBY_20260921.md"
      - ".github/workflows/deploy-my-mmd-standby-worker.yml"
  workflow_run:
    workflows:
      - "Deploy member-pages-worker"
    types:
      - completed
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY after the backup LIFF app exists in channel 2011691294"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and contract tests
        run: |
          set -euo pipefail
          node --check my-mmd-standby-worker/src/index.js
          node --test my-mmd-standby-worker/test/index.test.mjs
      - name: Cloudflare upload dry run
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run \
            --config my-mmd-standby-worker/wrangler.toml \
            --var LINE_LIFF_BACKUP_ID:2011691294-GCxAQ2yW

  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      BACKUP_LIFF_ID: "2011691294-GCxAQ2yW"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate activation inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ROUTES_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_ZONE_ID"
          [[ "$BACKUP_LIFF_ID" =~ ^[0-9]{10,20}-[A-Za-z0-9_-]{4,120}$ ]]
          test "$BACKUP_LIFF_ID" != "2010862595-yT4DCEMc"
      - name: Build route-free deploy config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const source = "my-mmd-standby-worker/wrangler.toml";
          const target = "my-mmd-standby-worker/wrangler.no-routes.toml";
          const lines = fs.readFileSync(source, "utf8").split(/\r?\n/);
          const output = [];
          let skippingRoute = false;
          for (const line of lines) {
            if (/^\s*\[\[routes\]\]\s*$/.test(line)) {
              skippingRoute = true;
              continue;
            }
            if (skippingRoute && /^\s*\[/.test(line)) skippingRoute = false;
            if (!skippingRoute) output.push(line);
          }
          const result = `${output.join("\n")}\n`;
          if (/^\s*\[\[routes\]\]/m.test(result)) throw new Error("Route-free config still contains routes");
          fs.writeFileSync(target, result);
          NODE
      - name: Deploy standby front door code
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --keep-vars \
            --config my-mmd-standby-worker/wrangler.no-routes.toml \
            --var "LINE_LIFF_BACKUP_ID:${BACKUP_LIFF_ID}"
      - name: Verify Cloudflare routes token
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/routes-token.json"
          code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$code" = "200"
          jq -e '.success == true and .result.status == "active"' "$body" >/dev/null
      - name: Bind exact standby routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = String(process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").trim();
          const zoneId = String(process.env.CLOUDFLARE_ZONE_ID || "").trim();
          const worker = "my-mmd-standby-worker";
          const desired = [
            "mmdbkk.com/member/liff-backup*",
            "www.mmdbkk.com/member/liff-backup*",
            "mmdbkk.com/member/api/liff-backup/*",
            "www.mmdbkk.com/member/api/liff-backup/*",
            "mmdbkk.com/api/member-backup/app/*",
            "www.mmdbkk.com/api/member-backup/app/*",
            "mmdbkk.com/v1/member-backup/payments*",
            "www.mmdbkk.com/v1/member-backup/payments*",
            "mmdbkk.com/my-mmd-backup*",
            "www.mmdbkk.com/my-mmd-backup*",
          ];

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.success !== true) {
              const detail = (payload?.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare route request failed (${response.status}): ${detail}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing standby route takeover: ${conflicts.map((route) => `${route.pattern} -> ${route.script || "none"}`).join(", ")}`);
          }
          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cf(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }
          const verified = await cf(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Unresolved standby routes: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length}; created ${missing.length}`);
          NODE
      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail
          origin="https://www.mmdbkk.com"
          for attempt in $(seq 1 12); do
            health_code="$(curl -sS -o "$RUNNER_TEMP/standby-health.json" -w '%{http_code}' "$origin/my-mmd-backup/health" || true)"
            if [[ "$health_code" == "200" ]] && jq -e '.ok == true and .mode == "warm_standby" and .checks.anonymous_session_boundary == "401"' "$RUNNER_TEMP/standby-health.json" >/dev/null; then break; fi
            sleep 5
          done
          test "${health_code:-}" = "200"

          curl -sS -D "$RUNNER_TEMP/shell.headers" -o "$RUNNER_TEMP/shell.html" "$origin/member/liff-backup?intent=status&lang=th"
          grep -qi '^x-mmd-route-owner: my-mmd-standby-worker' "$RUNNER_TEMP/shell.headers"
          grep -q 'data-mmd-standby="warm-v1"' "$RUNNER_TEMP/shell.html"
          grep -q '/pay/membership?source=line&amp;entry=standby' "$RUNNER_TEMP/shell.html"
          grep -q '/sigil/member/membership?source=line&amp;intent=signup&amp;entry=standby' "$RUNNER_TEMP/shell.html"
          grep -q '/sigil/member/membership?source=line&amp;intent=renew&amp;entry=standby' "$RUNNER_TEMP/shell.html"

          status_code="$(curl -sS -D "$RUNNER_TEMP/status.headers" -o "$RUNNER_TEMP/status.json" -w '%{http_code}' "$origin/member/api/liff-backup/status")"
          test "$status_code" = "401"
          grep -qi '^x-mmd-route-owner: my-mmd-standby-worker' "$RUNNER_TEMP/status.headers"
          grep -qi '^x-mmd-upstream-service: member-pages-worker' "$RUNNER_TEMP/status.headers"

          dashboard_code="$(curl -sS -D "$RUNNER_TEMP/dashboard.headers" -o "$RUNNER_TEMP/dashboard.json" -w '%{http_code}' "$origin/api/member-backup/app/dashboard")"
          test "$dashboard_code" = "401"
          grep -qi '^x-mmd-route-owner: my-mmd-standby-worker' "$RUNNER_TEMP/dashboard.headers"

          redirect_code="$(curl -sS -D "$RUNNER_TEMP/redirect.headers" -o /dev/null -w '%{http_code}' "$origin/my-mmd-backup/history?lang=th")"
          test "$redirect_code" = "302"
          grep -qi '^location: https://www.mmdbkk.com/member/liff-backup?intent=status&view=history&lang=th' "$RUNNER_TEMP/redirect.headers"
      - name: Publish standby receipt
        run: |
          {
            echo "## MY MMD standby deployed"
            echo
            echo "- Worker: \`my-mmd-standby-worker\`"
            echo "- Health: \`https://www.mmdbkk.com/my-mmd-backup/health\`"
            echo "- LIFF endpoint: \`https://www.mmdbkk.com/member/liff-backup\`"
            echo "- Secondary LIFF: \`https://liff.line.me/${BACKUP_LIFF_ID}?intent=status\`"
            echo "- Automated smoke: PASS"
            echo "- Real LINE device E2E: still required before break-glass use"
          } >> "$GITHUB_STEP_SUMMARY"
