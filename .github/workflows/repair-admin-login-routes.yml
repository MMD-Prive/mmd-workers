name: Repair admin login routes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/**"
      - ".github/workflows/deploy-admin-worker.yml"
      - ".github/workflows/repair-admin-login-routes.yml"

concurrency:
  group: repair-admin-login-routes-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify login source contract
        run: |
          set -euo pipefail
          node --check admin-worker/src/admin-login-hero-worker.js
          node --check admin-worker/src/admin-login-page.js
          node --test \
            admin-worker/admin-login-hero.test.mjs \
            admin-worker/admin-login-regression-guard.test.mjs \
            admin-worker/admin-login-session.test.mjs

      - name: Normalize and verify Cloudflare routes token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          if (!token) throw new Error("Cloudflare routes API token is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${token}\n`);
          NODE

          response_file="$(mktemp)"
          http_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -o "$response_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$http_code" = "200"
          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.success !== true || payload.result?.status !== "active") {
            throw new Error("Cloudflare routes token is not active");
          }
          NODE

      - name: Repair canonical admin login routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "admin-worker";
          const paths = [
            "/internal/admin",
            "/internal/admin/login",
            "/internal/admin/login*",
            "/internal/admin/login/session",
          ];
          const desired = paths.flatMap((path) => [
            `mmdbkk.com${path}`,
            `www.mmdbkk.com${path}`,
          ]);

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(
              `Refusing to replace conflicting login routes: ${conflicts
                .map((route) => `${route.pattern} -> ${route.script || "no script"}`)
                .join(", ")}`
            );
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) {
            throw new Error(`Admin login route verification failed: ${unresolved.join(", ")}`);
          }
          console.log(`Verified ${desired.length}/${desired.length} canonical admin login routes; created ${missing.length}`);
          NODE

      - name: Smoke canonical admin login on apex and www
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            headers_file="$(mktemp)"
            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -D "$headers_file" \
              -o "$body_file" \
              -w "%{http_code}" \
              "$origin/internal/admin/login?next=/internal/admin/jobs/create-job")"
            test "$http_code" = "200"
            grep -Eiq '^x-mmd-route-owner:[[:space:]]*admin-worker' "$headers_file"
            grep -Eiq '^x-mmd-page:[[:space:]]*admin-login-approved-hero' "$headers_file"
            grep -q 'Enter the' "$body_file"
            grep -q 'control room' "$body_file"

            headers_file="$(mktemp)"
            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -D "$headers_file" \
              -o "$body_file" \
              -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data 'credential=route-smoke-invalid&next=/internal/admin/jobs/create-job' \
              "$origin/internal/admin/login/session")"
            test "$http_code" = "401"
            grep -Eiq '^x-mmd-route-owner:[[:space:]]*admin-worker' "$headers_file"
            grep -q 'รหัสยังไม่ถูกต้องครับ' "$body_file"
          done
