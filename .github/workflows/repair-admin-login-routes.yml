name: Repair admin login routes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-admin-login-routes.yml"
  workflow_run:
    workflows:
      - Deploy admin-worker
    types:
      - completed

concurrency:
  group: repair-admin-login-routes-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair-and-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify login source contract
        run: |
          set -euo pipefail
          node --check admin-worker/src/admin-login-hero-worker.js
          node --check admin-worker/src/admin-login-page.js
          node --test \
            admin-worker/admin-login-hero.test.mjs \
            admin-worker/admin-login-regression-guard.test.mjs \
            admin-worker/admin-login-session.test.mjs

      - name: Normalize and verify Cloudflare routes token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          if (!token) throw new Error("Cloudflare routes API token is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${token}\n`);
          NODE

          response_file="$(mktemp)"
          http_code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -o "$response_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$http_code" = "200"
          node - "$response_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.success !== true || payload.result?.status !== "active") {
            throw new Error("Cloudflare routes token is not active");
          }
          NODE

      - name: Repair canonical admin login routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = "admin-worker";
          const paths = [
            "/internal/admin",
            "/internal/admin/login",
            "/internal/admin/login*",
            "/internal/admin/login/session",
            "/sigil/admin/login",
            "/sigil/admin/login*",
            "/admin/login",
            "/admin/login*",
          ];
          const desired = paths.flatMap((path) => [
            `mmdbkk.com${path}`,
            `www.mmdbkk.com${path}`,
          ]);

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(
              `Refusing to replace conflicting login routes: ${conflicts
                .map((route) => `${route.pattern} -> ${route.script || "no script"}`)
                .join(", ")}`
            );
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) {
            throw new Error(`Admin login route verification failed: ${unresolved.join(", ")}`);
          }
          console.log(`Verified ${desired.length}/${desired.length} canonical admin login routes; created ${missing.length}`);
          NODE

      - name: Smoke canonical admin login on apex and www
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            login_ok=0
            http_code="000"
            route_owner=""
            page_id=""
            for attempt in $(seq 1 12); do
              headers_file="$(mktemp)"
              body_file="$(mktemp)"
              http_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
                -D "$headers_file" \
                -o "$body_file" \
                -w "%{http_code}" \
                "$origin/internal/admin/login?next=/internal/admin/jobs/create-job")"
              route_owner=$(grep -Ei '^x-mmd-route-owner:' "$headers_file" | tail -1 | tr -d '\r' | cut -d ':' -f2- | xargs || true)
              page_id=$(grep -Ei '^x-mmd-page:' "$headers_file" | tail -1 | tr -d '\r' | cut -d ':' -f2- | xargs || true)
              if [ "$http_code" = "200" ] \
                && grep -Eiq '^x-mmd-route-owner:[[:space:]]*admin-worker' "$headers_file" \
                && grep -Eiq '^x-mmd-page:[[:space:]]*admin-login-approved-hero' "$headers_file" \
                && grep -q 'id="ownerLoginForm"' "$body_file" \
                && grep -q 'id="partnerLoginForm"' "$body_file"; then
                login_ok=1
                echo "Admin login GET smoke passed: origin=$origin attempt=$attempt"
                break
              fi
              echo "Admin login GET not converged yet: origin=$origin attempt=$attempt status=$http_code route_owner=$route_owner page=$page_id"
              sleep 5
            done
            if [ "$login_ok" != "1" ]; then
              echo "::error title=Admin login GET smoke failed::origin=$origin status=$http_code route_owner=$route_owner page=$page_id after=12-attempts"
              exit 1
            fi

            headers_file="$(mktemp)"
            body_file="$(mktemp)"
            http_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -D "$headers_file" \
              -o "$body_file" \
              -w "%{http_code}" \
              -X POST \
              -H "Origin: $origin" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data 'credential=route-smoke-invalid&next=/internal/admin/jobs/create-job' \
              "$origin/internal/admin/login/session")"
            if [ "$http_code" != "401" ] || ! grep -Eiq '^x-mmd-route-owner:[[:space:]]*admin-worker' "$headers_file" || ! grep -q 'รหัสยังไม่ถูกต้อง' "$body_file"; then
              route_owner=$(grep -Ei '^x-mmd-route-owner:' "$headers_file" | tail -1 | tr -d '\r' | cut -d ':' -f2- | xargs)
              page_id=$(grep -Ei '^x-mmd-page:' "$headers_file" | tail -1 | tr -d '\r' | cut -d ':' -f2- | xargs)
              echo "::error title=Admin login invalid-credential smoke failed::origin=$origin status=$http_code route_owner=$route_owner page=$page_id"
              exit 1
            fi
          done

      - name: Smoke legacy admin login aliases
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            for alias_path in /sigil/admin/login /admin/login; do
              alias_ok=0
              for attempt in $(seq 1 12); do
                headers_file="$(mktemp)"
                body_file="$(mktemp)"
                http_code="$(curl --retry 3 --retry-delay 1 --retry-all-errors -sS \
                  -D "$headers_file" \
                  -o "$body_file" \
                  -w "%{http_code}" \
                  "$origin$alias_path?source=phase1")"
                location="$(grep -Ei '^location:' "$headers_file" | tail -1 | tr -d '\r' | cut -d ':' -f2- | xargs || true)"
                if [ "$http_code" = "308" ] \
                  && grep -Eiq '^x-mmd-route-owner:[[:space:]]*admin-worker' "$headers_file" \
                  && grep -Eiq '^x-mmd-admin-login-canonical:[[:space:]]*/internal/admin/login' "$headers_file" \
                  && printf '%s' "$location" | grep -Eq '^https://mmdbkk\.com/internal/admin/login\?' \
                  && printf '%s' "$location" | grep -q 'source=phase1' \
                  && printf '%s' "$location" | grep -q 'next=%2Finternal%2Fadmin%2Fcontrol-room'; then
                  alias_ok=1
                  echo "Legacy admin alias passed: origin=$origin path=$alias_path attempt=$attempt"
                  break
                fi
                echo "Legacy admin alias not converged: origin=$origin path=$alias_path attempt=$attempt status=$http_code location=$location"
                sleep 5
              done
              test "$alias_ok" = "1"
            done
          done

          post_headers="$(mktemp)"
          post_body="$(mktemp)"
          post_code="$(curl -sS -D "$post_headers" -o "$post_body" -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'credential=must-not-run' \
            'https://www.mmdbkk.com/sigil/admin/login')"
          test "$post_code" = "405"
          grep -Eiq '^allow:[[:space:]]*GET, HEAD' "$post_headers"
          grep -Eiq '^x-mmd-route-owner:[[:space:]]*admin-worker' "$post_headers"
