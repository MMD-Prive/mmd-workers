name: Deploy telegram-worker

on:
  workflow_dispatch:
    inputs:
      production_approved:
        description: 'Owner approval for this code release only'
        type: boolean
        required: true
        default: false
      approval_ref:
        description: 'Owner approval and reviewed release packet reference'
        type: string
        required: true
      approved_sha:
        description: 'Full main commit SHA approved for this release'
        type: string
        required: true

concurrency:
  group: deploy-telegram-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && github.run_attempt == 1
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}

  validate-and-deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha && github.run_attempt == 1
    needs: [production-approval]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram-worker
    steps:
      - name: Check out approved source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate source and tests without production credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/index.js
          node --check src/access-runtime.js
          node --test test/*.test.mjs
      - name: Validate version upload
        run: npx --yes wrangler@4.105.0 versions upload --dry-run --keep-vars
      - name: Upload and promote the exact version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
        shell: bash
        run: |
          set -euo pipefail
          tag="gha-${GITHUB_SHA:0:12}"
          npx --yes wrangler@4.105.0 versions upload --keep-vars --tag "$tag" --message "GitHub Actions ${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/telegram-worker-upload.log"
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/telegram-worker-upload.log" | tail -n 1)"
          test -n "$version_id"
          node ../scripts/deploy-uploaded-worker-version.mjs telegram-worker "$version_id"
      - name: Read production health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://telegram-worker.malemodel-bkk.workers.dev/health |
            node --input-type=module -e '
              let raw="";
              for await (const chunk of process.stdin) raw+=chunk;
              const result=JSON.parse(raw);
              const markers=["mmd-concierge-capability-pack-v1-20260919", "mmd-recovery-outcome-taxonomy-v1-20260919", "mmd.hype_conversational_understanding.v2"];
              if(result.ok!==true || result.worker!=="telegram" || markers.some(marker=>!raw.includes(marker))) process.exit(1);
              console.log("Telegram health and capability markers passed; delivery is not tested");'
