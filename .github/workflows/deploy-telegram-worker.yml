name: Deploy telegram-worker

on:
  workflow_dispatch:
    inputs:
      smoke_topics:
        description: "Send one silent redacted check to every MMD Telegram topic after deploy"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "telegram-worker/**"
      - ".github/workflows/deploy-telegram-worker.yml"

concurrency:
  group: deploy-telegram-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: telegram-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${{ secrets.TELEGRAM_WEBHOOK_SECRET_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare tokens
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const deployToken = clean(process.env.CLOUDFLARE_API_TOKEN);
          const routesToken = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          if (!deployToken) throw new Error("CLOUDFLARE_API_TOKEN missing");
          if (!routesToken) throw new Error("CLOUDFLARE_ROUTES_API_TOKEN missing");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${deployToken}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${routesToken}\n`);
          NODE

      - name: Verify Cloudflare token
        run: npx --yes wrangler@4 whoami

      - name: Validate source and tests
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/access-runtime.js
          node --test test/*.test.mjs

      - name: Validate version upload
        run: npx --yes wrangler@4 versions upload --dry-run --keep-vars

      - name: Upload telegram-worker version
        shell: bash
        run: |
          set -euo pipefail
          tag="gha-${GITHUB_SHA:0:12}"
          npx --yes wrangler@4 versions upload --keep-vars --tag "$tag" --message "GitHub Actions ${GITHUB_SHA}" 2>&1 | tee "$RUNNER_TEMP/telegram-worker-upload.log"
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/telegram-worker-upload.log" | tail -n 1)"
          test -n "$version_id"
          echo "TELEGRAM_WORKER_VERSION_ID=$version_id" >> "$GITHUB_ENV"

      - name: Deploy telegram-worker version
        run: npx --yes wrangler@4 versions deploy "${TELEGRAM_WORKER_VERSION_ID}@100%" -y

      - name: Sync canonical Telegram routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = (process.env.CLOUDFLARE_ROUTES_API_TOKEN || "").trim();
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = "telegram-worker";
          if (!token) throw new Error("CLOUDFLARE_ROUTES_API_TOKEN missing");
          const paths = [
            "/telegram/webhook",
            "/v1/webhook",
            "/telegram/internal/send",
            "/v1/internal/send",
            "/v1/send",
          ];
          const desired = paths.flatMap((path) => [`mmdbkk.com${path}`, `www.mmdbkk.com${path}`]);

          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success !== true) {
              throw new Error(`Cloudflare route API failed: ${response.status} ${JSON.stringify(body.errors || body)}`);
            }
            return body.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cf(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing route takeover: ${conflicts.map((route) => `${route.pattern}->${route.script || "none"}`).join(",")}`);
          }
          for (const pattern of desired) {
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) continue;
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
          }
          const verified = await cf(routePath);
          const missing = desired.filter((pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`missing canonical Telegram routes: ${missing.join(",")}`);
          console.log(`verified ${desired.length}/${desired.length} canonical Telegram routes`);
          NODE

      - name: Verify production health
        run: |
          set -euo pipefail
          body="$(curl --retry 6 --retry-delay 2 --retry-all-errors -fsS https://telegram-worker.malemodel-bkk.workers.dev/health)"
          echo "$body"
          printf '%s' "$body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
          printf '%s' "$body" | grep -Eq '"worker"[[:space:]]*:[[:space:]]*"telegram"'
          printf '%s' "$body" | grep -Fq 'mmd-concierge-capability-pack-v1-20260919'
          printf '%s' "$body" | grep -Fq 'mmd-recovery-outcome-taxonomy-v1-20260919'

      - name: Point Telegram webhook to canonical route
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_WEBHOOK_SECRET_TOKEN"
          node <<'NODE'
          (async () => {
            const botToken = String(process.env.TELEGRAM_BOT_TOKEN || "").trim();
            const secret = String(process.env.TELEGRAM_WEBHOOK_SECRET_TOKEN || "").trim();
            const canonical = "https://mmdbkk.com/telegram/webhook";
            if (!botToken || !secret) throw new Error("Telegram webhook credentials missing");
            const call = async (method, body) => {
              const response = await fetch(`https://api.telegram.org/bot${botToken}/${method}`, {
                method: body ? "POST" : "GET",
                headers: body ? { "content-type": "application/json" } : {},
                body: body ? JSON.stringify(body) : undefined,
              });
              const payload = await response.json().catch(() => ({}));
              if (!response.ok || payload.ok !== true) throw new Error(`${method} failed: ${response.status}`);
              return payload.result;
            };
            await call("setWebhook", {
              url: canonical,
              secret_token: secret,
              drop_pending_updates: false,
            });
            const info = await call("getWebhookInfo");
            if (info?.url !== canonical) throw new Error(`canonical webhook mismatch: ${info?.url || "empty"}`);
            console.log(`Telegram webhook locked to ${canonical}`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Smoke canonical Telegram auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            send_body="$(mktemp)"
            send_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$send_body" -w "%{http_code}" -X POST -H 'Content-Type: application/json' --data '{"chat_id":"0","text":"redacted-route-smoke"}' "$origin/telegram/internal/send")"
            cat "$send_body"
            test "$send_code" = "401"

            alias_body="$(mktemp)"
            alias_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$alias_body" -w "%{http_code}" -X POST -H 'Content-Type: application/json' --data '{"chat_id":"0","text":"redacted-route-smoke"}' "$origin/v1/send")"
            cat "$alias_body"
            test "$alias_code" = "401"

            webhook_body="$(mktemp)"
            webhook_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o "$webhook_body" -w "%{http_code}" -X POST -H 'Content-Type: application/json' -H 'X-Telegram-Bot-Api-Secret-Token: invalid-smoke-secret' --data '{"update_id":0}' "$origin/telegram/webhook")"
            cat "$webhook_body"
            test "$webhook_code" = "401"
          done

      - name: Smoke every Telegram topic
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_topics }}
        env:
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$INTERNAL_API_TOKEN"
          body="$(curl --retry 3 --retry-delay 2 --retry-all-errors -fsS \
            -X POST 'https://telegram-worker.malemodel-bkk.workers.dev/telegram/internal/topics/smoke' \
            -H "Authorization: Bearer ${INTERNAL_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"confirm":"SEND_REDACTED_TOPIC_SMOKE","disable_notification":true}')"
          echo "$body"
          node -e 'const d=JSON.parse(process.argv[1]); if (!d.ok || d.failed !== 0 || Number(d.tested) < 7) process.exit(1);' "$body"


      - name: Record Telegram production deployment receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 325 --repo "$GITHUB_REPOSITORY" --body "### Telegram production route receipt

- source_sha: \`${GITHUB_SHA}\`
- job_status: \`${{ job.status }}\`
- canonical webhook: \`https://mmdbkk.com/telegram/webhook\`
- canonical internal send: \`https://mmdbkk.com/telegram/internal/send\`
- route owner: \`telegram-worker\`
- workers.dev: compatibility transport only
- acceptance: exact apex/www route sync + webhook URL lock + invalid-secret fail-closed + unauthenticated internal-send fail-closed

If job_status is success, Telegram core route ownership is live-verified for this source SHA."
