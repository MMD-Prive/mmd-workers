name: Deploy LINE group image capture

on:
  workflow_run:
    workflows:
      - "Deploy member-dashboard-chat-worker"
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-line-group-image-capture.yml"

permissions:
  contents: read

jobs:
  validate-storage-and-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      NO_COLOR: "1"
      R2_BUCKET: "mmd-line-slip-evidence"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate LINE image capture code
        run: |
          node --check member-dashboard-chat-worker/src/line-group-ingress-front-gate.js
          node --check member-dashboard-chat-worker/src/front-gate-index.js
          node --check member-dashboard-chat-worker/src/index.js
          node --experimental-global-webcrypto --test member-dashboard-chat-worker/test/line-payment-proof-ingress.test.mjs
          npm run test:member-dashboard-line

      - name: Validate private LINE slip evidence binding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const src = fs.readFileSync("member-dashboard-chat-worker/wrangler.toml", "utf8");
          const expected = /\[\[r2_buckets\]\]\s*binding\s*=\s*"LINE_SLIP_EVIDENCE"\s*bucket_name\s*=\s*"mmd-line-slip-evidence"/m;
          if (!expected.test(src)) {
            throw new Error("canonical LINE_SLIP_EVIDENCE -> mmd-line-slip-evidence binding is missing");
          }
          console.log("canonical private R2 binding declared");
          NODE
          (
            cd member-dashboard-chat-worker
            npx --yes wrangler@4 versions upload --dry-run --keep-vars
          )

          # Provisioning is intentionally not performed here. This workflow runs
          # after a successful production Worker deploy, where the R2 binding has
          # already been accepted. Re-running 'r2 bucket create' on every deploy
          # requires unnecessary R2-admin permission and caused false-negative
          # production receipts when the deploy token was correctly least-privilege.

      - name: Smoke production LINE owner
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 6 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error https://www.mmdbkk.com/webhooks/line)"
          node -e '
            const body=JSON.parse(process.argv[1]);
            if(body.ok!==true || body.worker!=="member-dashboard-chat-worker" || body.route!=="line_webhook") {
              throw new Error(`Unexpected production response: ${process.argv[1]}`);
            }
          ' "$response"
