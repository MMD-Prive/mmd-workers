name: Shop Phase 1 safety CI

on:
  pull_request:
    paths:
      - "himai-chat-worker/**"
      - "payments-worker/**"
      - "shared/shop-*.mjs"
      - "webflow/himai-shop/**"
      - "webflow/mmd-shop/**"
      - "webflow/shared/**"
      - "webflow/pay/checkout/**"
      - "telegram-worker/**"
      - "scripts/test-shop-phase1*"
      - "docs/architecture/SHOP_PHASE1_TRUSTED_CHECKOUT_20260922.md"
      - ".github/workflows/shop-phase1-safety-ci.yml"

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Phase 1 and existing commerce regressions
        run: |
          set -euo pipefail
          node scripts/test-shop-phase1.mjs | tee "$RUNNER_TEMP/shop-phase1-tests.txt"
      - name: Secret-free Worker bundle validation
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --config himai-chat-worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --config payments-worker/wrangler.merged.toml
          npx --yes wrangler@4 deploy --dry-run --config telegram-worker/wrangler.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Browser scripts on generated fixture documents, no live transactions
        env:
          SHOP_BROWSER_REPORT: ${{ runner.temp }}/shop-phase1-browser-report.json
        run: python scripts/test-shop-phase1-browser.py
      - name: Write tested source receipt
        if: always()
        run: git rev-parse HEAD > "$RUNNER_TEMP/shop-phase1-source-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-phase1-verification
          path: |
            ${{ runner.temp }}/shop-phase1-tests.txt
            ${{ runner.temp }}/shop-phase1-browser-report.json
            ${{ runner.temp }}/shop-phase1-source-sha.txt
          retention-days: 14
