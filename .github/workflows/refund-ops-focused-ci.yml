name: Refund Ops Focused CI

on:
  pull_request:
    paths:
      - "admin-worker/src/refund-ops.js"
      - "admin-worker/refund-ops.test.mjs"
      - "member-dashboard-chat-worker/src/index.js"
      - "member-dashboard-chat-worker/test/refund-receipt-notify.test.mjs"
      - ".github/workflows/refund-ops-focused-ci.yml"
  push:
    branches:
      - main
    paths:
      - "admin-worker/src/refund-ops.js"
      - "admin-worker/refund-ops.test.mjs"
      - "member-dashboard-chat-worker/src/index.js"
      - "member-dashboard-chat-worker/test/refund-receipt-notify.test.mjs"
      - ".github/workflows/refund-ops-focused-ci.yml"

permissions:
  contents: read

jobs:
  refund-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Refund Ops and LINE receipt tests
        run: node --test admin-worker/refund-ops.test.mjs member-dashboard-chat-worker/test/refund-receipt-notify.test.mjs
