name: Refund Ops Focused CI

on:
  pull_request:
    paths:
      - "admin-worker/src/refund-ops.js"
      - "admin-worker/src/refund-receipt-journal.js"
      - "admin-worker/refund-delivery-outcomes.test.mjs"
      - "admin-worker/refund-line-fallback.test.mjs"
      - "admin-worker/refund-ops.test.mjs"
      - "member-dashboard-chat-worker/src/index.js"
      - "member-dashboard-chat-worker/test/refund-receipt-notify.test.mjs"
      - "scripts/refund-read-live-baselines.py"
      - ".github/workflows/refund-ops-focused-ci.yml"
  push:
    branches:
      - main
    paths:
      - "admin-worker/src/refund-ops.js"
      - "admin-worker/src/refund-receipt-journal.js"
      - "admin-worker/refund-delivery-outcomes.test.mjs"
      - "admin-worker/refund-line-fallback.test.mjs"
      - "admin-worker/refund-ops.test.mjs"
      - "member-dashboard-chat-worker/src/index.js"
      - "member-dashboard-chat-worker/test/refund-receipt-notify.test.mjs"
      - "scripts/refund-read-live-baselines.py"
      - ".github/workflows/refund-ops-focused-ci.yml"

permissions:
  contents: read

jobs:
  refund-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Refund Ops and LINE receipt tests
        run: node --test admin-worker/refund-line-fallback.test.mjs admin-worker/refund-delivery-outcomes.test.mjs admin-worker/refund-ops.test.mjs member-dashboard-chat-worker/test/refund-receipt-notify.test.mjs
      - name: Prepare runtime exports from unchanged Worker configs
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, tomllib
          out = pathlib.Path("refund-bundles")
          out.mkdir(exist_ok=True)
          for worker, label in [("admin-worker", "admin"), ("member-dashboard-chat-worker", "member")]:
              config = tomllib.loads(pathlib.Path(worker, "wrangler.toml").read_text())
              classes = sorted({b["class_name"] for b in config.get("durable_objects", {}).get("bindings", []) if not b.get("script_name")})
              entry = pathlib.Path(worker, config["main"])
              relative = os.path.relpath(entry, out)
              exports = ", ".join(["default", *classes])
              (out / (label + "-entry.mjs")).write_text(f'export {{ {exports} }} from "./{relative}";\n')
          PYTHON
      - name: Build complete admin-worker entrypoint (no deploy)
        run: npm exec --yes --package=esbuild@0.27.3 -- esbuild refund-bundles/admin-entry.mjs --bundle --format=esm --platform=browser --target=es2022 '--external:cloudflare:*' '--external:node:*' --sourcemap=external --metafile=refund-bundles/admin.meta.json --outfile=refund-bundles/admin-worker.js
      - name: Build complete member-dashboard-chat-worker entrypoint (no deploy)
        run: npm exec --yes --package=esbuild@0.27.3 -- esbuild refund-bundles/member-entry.mjs --bundle --format=esm --platform=browser --target=es2022 '--external:cloudflare:*' '--external:node:*' --sourcemap=external --metafile=refund-bundles/member.meta.json --outfile=refund-bundles/member-dashboard-chat-worker.js
      - name: Record bundle hashes
        run: sha256sum refund-bundles/*.js > refund-bundles/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: refund-full-bundles-${{ github.event.pull_request.head.sha || github.sha }}
          path: refund-bundles/
          retention-days: 7

  read-live-baselines:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/refund-delivery-outcome-guard-v7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read pinned live Worker modules and maps (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/refund-read-live-baselines.py
      - uses: actions/upload-artifact@v4
        with:
          name: refund-live-baselines-${{ github.event.pull_request.head.sha }}
          path: refund-live-baselines/
          retention-days: 3
