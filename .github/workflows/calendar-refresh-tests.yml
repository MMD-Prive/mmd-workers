name: Calendar Refresh Tests
on:
  push:
    branches: [fix/calendar-live-cal-diagnostics-20260914]
    paths: ['.github/workflows/calendar-refresh-tests.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-live-cal-diagnostics-20260914
      - name: Refresh Calendar v1.2 assertion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-worker/src/admin-calendar-visibility.test.mjs')
          s=p.read_text()
          old="assert.equal(r.headers.get('x-mmd-calendar-surface'),'admin-worker-v1.1');"
          new="assert.equal(r.headers.get('x-mmd-calendar-surface'),'admin-worker-v1.2');"
          if old not in s and new not in s:
              raise SystemExit('calendar surface assertion not found')
          p.write_text(s.replace(old,new))
          PY
          node --test admin-worker/src/admin-calendar-service-binding.test.mjs admin-worker/src/admin-calendar-visibility.test.mjs admin-worker/src/admin-calendar-runtime.test.mjs
      - name: Commit refreshed test
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-worker/src/admin-calendar-visibility.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(calendar): expect v1.2 protected surface'
          git push origin HEAD:fix/calendar-live-cal-diagnostics-20260914
