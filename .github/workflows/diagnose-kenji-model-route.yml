name: Diagnose Kenji model route

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-kenji-model-route.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
    steps:
      - name: Inspect Cloudflare route ownership
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ROUTES_API_TOKEN:-}"
          echo "::add-mask::$CLOUDFLARE_ROUTES_API_TOKEN"
          routes="$(mktemp)"
          code="$(curl -sS -o "$routes" -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes")"
          test "$code" = "200"
          node - "$routes" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.success !== true || !Array.isArray(payload.result)) throw new Error('route list failed');
          const relevant = payload.result.filter((r) => String(r.pattern || '').includes('/v1/admin/kenji/models'));
          if (!relevant.length) throw new Error('no Kenji model route found');
          for (const r of relevant) console.log(`${r.pattern} -> ${r.script || '(no script)'}`);
          const expected = [
            'mmdbkk.com/v1/admin/kenji/models',
            'www.mmdbkk.com/v1/admin/kenji/models',
          ];
          for (const pattern of expected) {
            const matches = relevant.filter((r) => r.pattern === pattern);
            if (matches.length !== 1) throw new Error(`expected one route for ${pattern}; found ${matches.length}`);
            if (matches[0].script !== 'admin-worker') throw new Error(`${pattern} owned by ${matches[0].script}`);
          }
          NODE

      - name: Fingerprint public responses safely
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://www.mmdbkk.com/v1/admin/kenji/models?q=Mek&limit=20' \
            'https://www.mmdbkk.com/v1/admin/auth/me' \
            'https://www.mmdbkk.com/v1/admin/kenji/knowledge/meta'
          do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS -D "$headers" -o "$body" -w "%{http_code}" "$url")"
            ctype="$(grep -i '^content-type:' "$headers" | tail -n 1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' || true)"
            server="$(grep -i '^server:' "$headers" | tail -n 1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' || true)"
            echo "$url -> status=$code content-type=${ctype:-none} server=${server:-none} bytes=$(wc -c < "$body" | tr -d ' ')"
            node - "$body" "$ctype" <<'NODE'
          const fs = require('node:fs');
          const [file, ctype] = process.argv.slice(2);
          const raw = fs.readFileSync(file, 'utf8');
          if (/application\/json/i.test(ctype)) {
            try {
              const payload = JSON.parse(raw);
              const safe = {
                ok: payload?.ok,
                authenticated: payload?.authenticated,
                error: typeof payload?.error === 'string' ? payload.error : payload?.error?.code,
                keys: payload && typeof payload === 'object' && !Array.isArray(payload) ? Object.keys(payload).sort() : [],
              };
              console.log(JSON.stringify(safe));
            } catch { console.log('json-parse-failed'); }
          } else {
            const title = (raw.match(/<title>([^<]{0,120})<\/title>/i) || [,''])[1];
            console.log(`html=${/^\s*</.test(raw)} title=${JSON.stringify(title)} sha256_pending=false`);
          }
          NODE
          done
