name: Deploy realtime-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "realtime-worker/**"
      - ".github/workflows/deploy-realtime-worker.yml"

concurrency:
  group: deploy-realtime-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: realtime-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      REALTIME_WORKERS_DEV_URL: https://realtime-worker.malemodel-bkk.workers.dev
      REALTIME_CUSTOM_HEALTH: https://www.mmdbkk.com/v1/rt/health

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize deploy token
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const token = (process.env.CLOUDFLARE_API_TOKEN || "")
            .replace(/[\u2028\u2029\r\n]/g, "")
            .trim();
          if (!token) throw new Error("CLOUDFLARE_API_TOKEN is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${token}\n`);
          NODE

      - name: Verify Cloudflare account
        run: npx --yes wrangler@4 whoami

      - name: Verify dedicated realtime service secret exists
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list > "$RUNNER_TEMP/realtime-secrets.json"
          node - "$RUNNER_TEMP/realtime-secrets.json" <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync(process.argv[2], "utf8");
          const parsed = JSON.parse(raw);
          const names = new Set((Array.isArray(parsed) ? parsed : []).map((item) => String(item?.name || "")));
          if (!names.has("AUTH_SERVICE_EVENTS_TO_REALTIME")) {
            throw new Error("AUTH_SERVICE_EVENTS_TO_REALTIME must exist before realtime-worker deployment");
          }
          NODE

      - name: Validate source and privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          node --test location-policy.test.mjs service-auth-contract.test.mjs

      - name: Validate Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml

      - name: Refuse custom-route takeover
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const zone = process.env.CLOUDFLARE_ZONE_ID;
          const token = String(process.env.CLOUDFLARE_ROUTES_API_TOKEN || process.env.CLOUDFLARE_API_TOKEN || "").trim();
          if (!token) throw new Error("Cloudflare routes credential missing");
          const desired = [
            "mmdbkk.com/v1/rt/*",
            "www.mmdbkk.com/v1/rt/*",
          ];
          const response = await fetch(`https://api.cloudflare.com/client/v4/zones/${zone}/workers/routes`, {
            headers: { authorization: `Bearer ${token}` },
          });
          const payload = await response.json();
          if (!response.ok || payload?.success !== true) throw new Error("unable to inspect Cloudflare worker routes");
          for (const pattern of desired) {
            const conflict = (payload.result || []).find((route) => route.pattern === pattern && route.script && route.script !== "realtime-worker");
            if (conflict) throw new Error(`refusing route takeover: ${pattern} is owned by ${conflict.script}`);
          }
          NODE

      - name: Deploy realtime-worker with canonical custom routes
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml --keep-vars

      - name: Smoke health
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$body" -w "%{http_code}" \
            "$REALTIME_WORKERS_DEV_URL/health")"
          cat "$body"
          test "$code" = "200"
          grep -q '"worker":"realtime-worker"' "$body"

          custom_body="$(mktemp)"
          custom_code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS -o "$custom_body" -w "%{http_code}"             -H 'Origin: https://www.mmdbkk.com' "$REALTIME_CUSTOM_HEALTH")"
          cat "$custom_body"
          test "$custom_code" = "200"
          grep -q '"worker":"realtime-worker"' "$custom_body"
          grep -q '"route_owner":"realtime-worker"' "$custom_body"

          unauth_code="$(curl --retry 4 --retry-delay 1 --retry-all-errors -sS -o /dev/null -w "%{http_code}"             -X POST -H 'Origin: https://www.mmdbkk.com' -H 'Content-Type: application/json'             --data '{"job_id":"phase1-route-smoke"}' https://www.mmdbkk.com/v1/rt/room/open || true)"
          test "$unauth_code" = "401"

      - name: Deployment receipt
        shell: bash
        run: |
          echo "realtime-worker deployed to workers.dev implementation owner"
          echo "commit=$GITHUB_SHA"
          echo "custom_host_routes=/v1/rt/*"
          echo "canonical_owner=realtime-worker"
          echo "gps_room_policy=fail_closed"
