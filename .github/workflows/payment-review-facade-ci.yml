name: Payment Review Facade CI

on:
  pull_request:
    paths:
      - "admin-worker/src/admin-payment-review-entry.js"
      - "admin-worker/src/payment-review-runtime.js"
      - "admin-worker/wrangler.toml"
      - "payments-worker/index.review-wrapper.js"
      - "payments-worker/reviewed-proof.js"
      - "payments-worker/wrangler.merged.toml"
      - ".github/workflows/deploy-admin-worker.yml"
      - ".github/workflows/payment-review-facade-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax
        run: |
          set -euo pipefail
          node --check admin-worker/src/admin-payment-review-entry.js
          node --check admin-worker/src/payment-review-runtime.js
          node --check payments-worker/index.review-wrapper.js
          node --check payments-worker/reviewed-proof.js

      - name: Browser facade guardrails
        run: |
          set -euo pipefail
          grep -F 'browser_admin_session_required' admin-worker/src/admin-payment-review-entry.js
          grep -F 'forbidden_origin' admin-worker/src/admin-payment-review-entry.js
          grep -F 'Idempotency-Key' admin-worker/src/payment-review-runtime.js
          grep -F 'browser_can_mark_paid: false' admin-worker/src/payment-review-runtime.js
          grep -F 'browser_can_award_points: false' admin-worker/src/payment-review-runtime.js
          grep -F 'historical_backfill_separate: true' admin-worker/src/payment-review-runtime.js

      - name: Money Truth separation
        run: |
          set -euo pipefail
          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' admin-worker/src/payment-review-runtime.js
          grep -F '/v1/internal/payments/reviewed-proof' admin-worker/src/payment-review-runtime.js
          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' payments-worker/reviewed-proof.js
          grep -F 'historical_proof_requires_historical_review_contract' payments-worker/reviewed-proof.js
          grep -F 'X-MMD-Payment-Authority' payments-worker/reviewed-proof.js
          if grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' webflow/internal/admin/payments 2>/dev/null; then
            echo 'service secret reference found in Webflow payment assets' >&2
            exit 1
          fi

      - name: Exact route ownership
        run: |
          set -euo pipefail
          grep -F 'mmdbkk.com/v1/admin/payments/review-queue*' admin-worker/wrangler.toml
          grep -F 'www.mmdbkk.com/v1/admin/payments/review-queue*' admin-worker/wrangler.toml
          grep -F 'mmdbkk.com/v1/admin/payments/review"' admin-worker/wrangler.toml
          grep -F 'www.mmdbkk.com/v1/admin/payments/review"' admin-worker/wrangler.toml
          grep -F '"/v1/admin/payments/review-queue*"' .github/workflows/deploy-admin-worker.yml
          grep -F '"/v1/admin/payments/review"' .github/workflows/deploy-admin-worker.yml

      - name: Production entrypoint contracts
        run: |
          set -euo pipefail
          grep -F 'main = "src/admin-payment-review-entry.js"' admin-worker/wrangler.toml
          grep -F 'main = "index.review-wrapper.js"' payments-worker/wrangler.merged.toml
          npx --yes wrangler@4 versions upload --dry-run --keep-vars --config admin-worker/wrangler.toml
          npx --yes wrangler@4 versions upload --dry-run --keep-vars --config payments-worker/wrangler.merged.toml
