name: Payment Review Facade CI

on:
  pull_request:
    paths:
      - "admin-worker/src/admin-login-hero-worker.js"
      - "admin-worker/src/payment-review-runtime.js"
      - "admin-worker/src/payment-review-display-context.js"
      - "admin-worker/src/payment-review-discovery.js"
      - "admin-worker/payment-review-discovery.test.mjs"
      - "admin-worker/src/payment-proof-client-provenance-wrapper.js"
      - "admin-worker/payment-proof-client-provenance-wrapper.test.mjs"
      - "admin-worker/payment-review-simple.test.mjs"
      - "admin-worker/src/payment-review-line-recovery.js"
      - "admin-worker/src/payment-review-owner-context.js"
      - "admin-worker/src/payment-review-auto-context.js"
      - "admin-worker/line-slip-intake-review-queue.contract.test.mjs"
      - "admin-worker/payment-review-queue-v3-normalization.test.mjs"
      - "admin-worker/payment-review-manual-renewal-recovery.test.mjs"
      - "admin-worker/payment-review-owner-context.test.mjs"
      - "admin-worker/payment-review-auto-context.test.mjs"
      - "admin-worker/wrangler.toml"
      - "payments-worker/index.review-wrapper.js"
      - "payments-worker/reviewed-proof.js"
      - "payments-worker/reviewed-proof-line-recovery.test.mjs"
      - "payments-worker/reviewed-proof-canonical-money-truth.js"
      - "payments-worker/reviewed-proof-canonical-money-truth.test.mjs"
      - "payments-worker/reviewed-membership-write-through.js"
      - "payments-worker/reviewed-membership-write-through.test.mjs"
      - "payments-worker/wrangler.merged.toml"
      - "shared/membership-promotion-policy.mjs"
      - "shared/membership-promotion-policy.test.mjs"
      - "webflow/internal/admin/payments/**"
      - ".github/workflows/deploy-admin-worker.yml"
      - ".github/workflows/payment-review-facade-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax
        run: |
          set -euo pipefail
          node --check admin-worker/src/admin-login-hero-worker.js
          node --check admin-worker/src/payment-review-runtime.js
          node --check admin-worker/src/payment-review-discovery.js
          node --check admin-worker/src/payment-review-line-recovery.js
          node --check admin-worker/src/payment-review-owner-context.js
          node --check admin-worker/src/payment-review-auto-context.js
          node --check webflow/internal/admin/payments/payment-owner-match-v1.js
          node --check webflow/internal/admin/payments/payment-owner-match-v2.js
          node --check webflow/internal/admin/payments/historical-payment-context-v3.js
          node --check payments-worker/index.review-wrapper.js
          node --check payments-worker/reviewed-proof.js
          node --check payments-worker/reviewed-proof-canonical-money-truth.js
          node --experimental-default-type=module --check payments-worker/reviewed-membership-write-through.js
          node --check shared/membership-promotion-policy.mjs

      - name: Newest payment proof queue contract
        run: |
          set -euo pipefail
          node --test admin-worker/line-slip-intake-review-queue.contract.test.mjs
          node --test admin-worker/payment-review-queue-v3-normalization.test.mjs
          node --test admin-worker/payment-review-simple.test.mjs
          node --test admin-worker/payment-review-discovery.test.mjs admin-worker/payment-proof-client-provenance-wrapper.test.mjs

      - name: Manual renewal recovery contract
        run: |
          set -euo pipefail
          node --test admin-worker/payment-review-manual-renewal-recovery.test.mjs

      - name: Owner payment context match contract
        run: |
          set -euo pipefail
          node --test admin-worker/payment-review-owner-context.test.mjs
          node --test admin-worker/payment-review-auto-context.test.mjs

      - name: Email-less LINE renewal recovery contract
        run: |
          set -euo pipefail
          node --test payments-worker/reviewed-proof-line-recovery.test.mjs

      - name: Canonical recovery Money Truth contract
        run: |
          set -euo pipefail
          node --test payments-worker/reviewed-proof-canonical-money-truth.test.mjs

      - name: Canonical membership write-through contract
        run: |
          set -euo pipefail
          node --experimental-global-webcrypto --experimental-default-type=module --test payments-worker/reviewed-membership-write-through.test.mjs
          node --test shared/membership-promotion-policy.test.mjs

      - name: Browser facade guardrails
        run: |
          set -euo pipefail
          grep -F 'browser_admin_session_required' admin-worker/src/admin-login-hero-worker.js
          grep -F 'forbidden_origin' admin-worker/src/admin-login-hero-worker.js
          grep -F 'isPaymentReviewRequest' admin-worker/src/admin-login-hero-worker.js
          grep -F 'handlePaymentReviewRequest' admin-worker/src/admin-login-hero-worker.js
          grep -F 'Idempotency-Key' admin-worker/src/payment-review-runtime.js
          grep -F 'browser_can_mark_paid: false' admin-worker/src/payment-review-runtime.js
          grep -F 'browser_can_award_points: false' admin-worker/src/payment-review-runtime.js
          grep -F 'historical_backfill_separate: true' admin-worker/src/payment-review-runtime.js
          grep -F 'manual_recovery_requires_owner_admin: true' admin-worker/src/payment-review-runtime.js
          grep -F 'manual_recovery_requires_canonical_member: true' admin-worker/src/payment-review-runtime.js
          grep -F 'owner_context_match_requires_exact_session_or_member: true' admin-worker/src/payment-review-runtime.js
          grep -F 'owner_context_names_are_audit_only: true' admin-worker/src/payment-review-runtime.js
          grep -F 'customer_model_labels_authoritative: false' admin-worker/src/payment-review-owner-context.js
          grep -F 'line_context_auto_match' admin-worker/src/payment-review-auto-context.js
          grep -F 'amount alone never creates membership intent' admin-worker/payment-review-owner-context.test.mjs
          grep -F 'ordering: "created_at_desc"' admin-worker/src/payment-review-runtime.js
          grep -F 'sort: [{ field: "created_at", direction: "desc" }]' admin-worker/src/payment-review-runtime.js
          grep -F 'browser_can_mark_paid: false' admin-worker/src/payment-review-line-recovery.js
          grep -F 'browser_can_mutate_entitlement: false' admin-worker/src/payment-review-line-recovery.js

      - name: Payment evidence v3 normalization
        run: |
          set -euo pipefail
          grep -F 'extraction.method || extraction.extraction_method || note.extraction_method' admin-worker/src/payment-review-runtime.js
          grep -F 'extraction.confidence ?? extraction.confidence_score ?? note.extraction_confidence' admin-worker/src/payment-review-runtime.js
          grep -F 'linkedPaymentPresent || linkedSessionPresent || linkedRenewalPresent || linkedMemberPresent' admin-worker/src/payment-review-runtime.js
          grep -F 'inferred_label: paymentInferenceLabel(paymentIntelligence)' admin-worker/src/payment-review-runtime.js
          grep -F 'deposit: "ค่าจอง / มัดจำ"' admin-worker/src/payment-review-runtime.js
          grep -F 'final: "ค่าจบงาน / ยอดคงเหลือ"' admin-worker/src/payment-review-runtime.js

      - name: Membership receipt contract
        run: |
          set -euo pipefail
          grep -F 'function safeMembershipWriteThrough(value)' admin-worker/src/payment-review-runtime.js
          grep -F 'membership_write_through: safeMembershipWriteThrough(payload.membership_write_through)' admin-worker/src/payment-review-runtime.js
          grep -F 'membership_write_through: safeMembershipWriteThrough(after.membership_write_through)' admin-worker/src/payment-review-runtime.js
          grep -F 'manual_membership_review_required: payload.manual_membership_review_required === true' admin-worker/src/payment-review-runtime.js
          grep -F 'payment_stage: input.payment_stage || null' admin-worker/src/payment-review-runtime.js
          grep -F 'money-control-v4-entitlement-receipt-20260913' webflow/internal/admin/payments/money-control-v3.html
          grep -F 'Membership Review' webflow/internal/admin/payments/money-control-v3.html
          grep -F "notice='ยืนยันเงินแล้ว · '+actionLabel" webflow/internal/admin/payments/money-control-v3.html

      - name: Payment Review fail-closed hardening
        run: |
          set -euo pipefail
          grep -F 'const CANONICAL_PAYMENTS_TABLE_ID = "tblWGGJJOx5eBvBZJ";' admin-worker/src/payment-review-runtime.js
          grep -F 'env.AIRTABLE_TABLE_PAYMENTS_ID ||' admin-worker/src/payment-review-runtime.js
          grep -F 'if (!proofId) return null;' admin-worker/src/payment-review-runtime.js
          grep -F 'authority: "admin-worker"' admin-worker/src/payment-review-runtime.js
          grep -F 'manual_audit_required: audit.ok === false' admin-worker/src/payment-review-runtime.js
          grep -F 'audit_write_failed: audit.ok === false' admin-worker/src/payment-review-runtime.js
          grep -F 'context_source: "liff_renewal_recovery"' admin-worker/src/payment-review-runtime.js
          grep -F 'manual_recovery_requires_owner_admin' admin-worker/src/payment-review-runtime.js
          grep -F 'canonical_member_context_ambiguous' admin-worker/src/payment-review-runtime.js
          grep -F 'resolveOperatorPaymentContext' admin-worker/src/payment-review-runtime.js
          grep -F 'mergeOperatorPaymentContext' admin-worker/src/payment-review-runtime.js
          grep -F 'operator_context_requires_verified_money_evidence' admin-worker/src/payment-review-owner-context.js
          grep -F 'operator_context_session_not_found' admin-worker/src/payment-review-owner-context.js
          grep -F 'operator_context_member_not_found' admin-worker/src/payment-review-owner-context.js
          grep -F 'raw === "mmd_member" || raw === "member_690" || raw === "membership" || raw === "public_member"' admin-worker/src/payment-review-runtime.js
          grep -F 'raw === "elite" || raw === "elite_membership"' admin-worker/src/payment-review-runtime.js
          grep -F 'raw === "red_card" || raw === "redcard"' admin-worker/src/payment-review-runtime.js
          grep -F 'const RENEWAL_PRICES = Object.freeze({ standard: new Set([499, 799, 1000]), premium: new Set([999, 1999, 2500]) });' admin-worker/src/payment-review-line-recovery.js
          grep -F 'context_source: "liff_renewal_recovery"' admin-worker/src/payment-review-line-recovery.js
          if grep -F 'maxRecords: 2 }).catch(() => [])' admin-worker/src/payment-review-runtime.js; then
            echo 'audit idempotency lookup must fail closed; swallowed Airtable error found' >&2
            exit 1
          fi

      - name: Money Truth separation
        run: |
          set -euo pipefail
          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' admin-worker/src/payment-review-runtime.js
          grep -F '/v1/internal/payments/reviewed-proof' admin-worker/src/payment-review-runtime.js
          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' admin-worker/src/payment-review-line-recovery.js
          grep -F '/v1/internal/payments/reviewed-proof' admin-worker/src/payment-review-line-recovery.js
          grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' payments-worker/reviewed-proof.js
          grep -F 'historical_proof_requires_historical_review_contract' payments-worker/reviewed-proof.js
          grep -F 'X-MMD-Payment-Authority' payments-worker/reviewed-proof.js
          grep -F 'materializeRecoveredMembership' payments-worker/reviewed-proof.js
          grep -F 'downstream_access_reconcile_required' payments-worker/reviewed-proof.js
          grep -F 'isEmailLessLineRenewalMoneyTruth' payments-worker/index.review-wrapper.js
          grep -F 'reconcileReviewedMembershipEntitlement' payments-worker/index.review-wrapper.js
          grep -F 'my_mmd_entitlement_resolver_v1' payments-worker/reviewed-membership-write-through.js
          grep -F 'Payment Reference' payments-worker/reviewed-proof-canonical-money-truth.js
          if grep -F 'AUTH_SERVICE_ADMIN_TO_PAYMENTS' webflow/internal/admin/payments 2>/dev/null; then
            echo 'service secret reference found in Webflow payment assets' >&2
            exit 1
          fi

      - name: Exact route ownership
        run: |
          set -euo pipefail
          grep -F 'mmdbkk.com/v1/admin/payments/review-queue*' admin-worker/wrangler.toml
          grep -F 'www.mmdbkk.com/v1/admin/payments/review-queue*' admin-worker/wrangler.toml
          grep -F 'mmdbkk.com/v1/admin/payments/review"' admin-worker/wrangler.toml
          grep -F 'www.mmdbkk.com/v1/admin/payments/review"' admin-worker/wrangler.toml
          grep -F '"/v1/admin/payments/review-queue*"' .github/workflows/deploy-admin-worker.yml
          grep -F '"/v1/admin/payments/review"' .github/workflows/deploy-admin-worker.yml

      - name: Production entrypoint contracts
        run: |
          set -euo pipefail
          grep -F 'main = "src/admin-login-hero-worker.js"' admin-worker/wrangler.toml
          grep -F 'main = "index.review-wrapper.js"' payments-worker/wrangler.merged.toml
          npx --yes wrangler@4 versions upload --dry-run --keep-vars --config admin-worker/wrangler.toml
          npx --yes wrangler@4 versions upload --dry-run --keep-vars --config payments-worker/wrangler.merged.toml
