name: Payment Review Facade CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-payment-transport-repair:
    if: github.head_ref == 'fix/payment-internal-binding-headline-20260913'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply binding-first transport and headline contrast
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              write(path, text.replace(old, new, 1))

          # 1) Normal Payment Review: PAYMENTS_WORKER service binding first, HTTPS only as fallback.
          replace_once(
              "admin-worker/src/payment-review-runtime.js",
              '''async function sendReviewedProofToPayments(env, body) {
  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  const token = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!base) throw httpError(503, "payments_worker_base_url_missing");
  if (!token) throw httpError(503, "payments_worker_service_auth_missing");
  return fetch(`${base}/v1/internal/payments/reviewed-proof`, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}
''',
              '''async function sendReviewedProofToPayments(env, body) {
  const token = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!token) throw httpError(503, "payments_worker_service_auth_missing");
  const init = {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  if (typeof env.PAYMENTS_WORKER?.fetch === "function") {
    return env.PAYMENTS_WORKER.fetch(new Request("https://sigil.mmdbkk.com/v1/internal/payments/reviewed-proof", init));
  }
  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  if (!base) throw httpError(503, "payments_worker_base_url_missing");
  return fetch(`${base}/v1/internal/payments/reviewed-proof`, init);
}
''',
          )

          # 2) Email-less LINE renewal recovery: same binding-first transport, preserving legacy errors.
          replace_once(
              "admin-worker/src/payment-review-line-recovery.js",
              '''async function sendToPayments(env, body) {
  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  const tokenValue = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!base || !tokenValue) throw httpError(503, "payments_worker_service_not_ready");
  return fetch(`${base}/v1/internal/payments/reviewed-proof`, {
    method: "POST",
    headers: { Authorization: `Bearer ${tokenValue}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}
''',
              '''async function sendToPayments(env, body) {
  const tokenValue = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!tokenValue) throw httpError(503, "payments_worker_service_not_ready");
  const init = {
    method: "POST",
    headers: { Authorization: `Bearer ${tokenValue}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  if (typeof env.PAYMENTS_WORKER?.fetch === "function") {
    return env.PAYMENTS_WORKER.fetch(new Request("https://sigil.mmdbkk.com/v1/internal/payments/reviewed-proof", init));
  }
  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  if (!base) throw httpError(503, "payments_worker_service_not_ready");
  return fetch(`${base}/v1/internal/payments/reviewed-proof`, init);
}
''',
          )

          # 3) Historical backfill: both real review handoff and safe validate_handoff probe use binding first.
          replace_once(
              "admin-worker/src/historical-slip-backfill-runtime.js",
              '''  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  const serviceToken = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!base) throw httpError(503, "payments_worker_base_url_missing");
  if (!serviceToken) throw httpError(503, "payments_worker_service_auth_missing");

  const handoff = {
''',
              '''  const serviceToken = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!serviceToken) throw httpError(503, "payments_worker_service_auth_missing");

  const handoff = {
''',
          )
          replace_once(
              "admin-worker/src/historical-slip-backfill-runtime.js",
              '''  const response = await fetch(`${base}/v1/internal/payments/historical-slip/reviewed`, {
    method: "POST",
    headers: { Authorization: `Bearer ${serviceToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(handoff),
  });
''',
              '''  const handoffInit = {
    method: "POST",
    headers: { Authorization: `Bearer ${serviceToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(handoff),
  };
  const response = typeof env.PAYMENTS_WORKER?.fetch === "function"
    ? await env.PAYMENTS_WORKER.fetch(new Request("https://sigil.mmdbkk.com/v1/internal/payments/historical-slip/reviewed", handoffInit))
    : await (() => {
        const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
        if (!base) throw httpError(503, "payments_worker_base_url_missing");
        return fetch(`${base}/v1/internal/payments/historical-slip/reviewed`, handoffInit);
      })();
''',
          )
          replace_once(
              "admin-worker/src/historical-slip-backfill-runtime.js",
              '''async function validateHistoricalHandoff(proof, note, body, env, reviewReason) {
  const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
  const serviceToken = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!base) throw httpError(503, "payments_worker_base_url_missing");
  if (!serviceToken) throw httpError(503, "payments_worker_service_auth_missing");

''',
              '''async function validateHistoricalHandoff(proof, note, body, env, reviewReason) {
  const serviceToken = clean(env.AUTH_SERVICE_ADMIN_TO_PAYMENTS);
  if (!serviceToken) throw httpError(503, "payments_worker_service_auth_missing");

''',
          )
          replace_once(
              "admin-worker/src/historical-slip-backfill-runtime.js",
              '''  const response = await fetch(base + "/v1/internal/payments/historical-slip/reviewed", {
    method: "POST",
    headers: { Authorization: "Bearer " + serviceToken, "Content-Type": "application/json" },
    body: JSON.stringify(handoffProbe),
  });
''',
              '''  const handoffProbeInit = {
    method: "POST",
    headers: { Authorization: "Bearer " + serviceToken, "Content-Type": "application/json" },
    body: JSON.stringify(handoffProbe),
  };
  const response = typeof env.PAYMENTS_WORKER?.fetch === "function"
    ? await env.PAYMENTS_WORKER.fetch(new Request("https://sigil.mmdbkk.com/v1/internal/payments/historical-slip/reviewed", handoffProbeInit))
    : await (() => {
        const base = clean(env.PAYMENTS_BASE_URL).replace(/\\/+$/, "");
        if (!base) throw httpError(503, "payments_worker_base_url_missing");
        return fetch(base + "/v1/internal/payments/historical-slip/reviewed", handoffProbeInit);
      })();
''',
          )

          # Payment Control Plane headline readability lock for all three canonical pages.
          style_block = '''\n    if (!document.getElementById('mmd-payment-headline-contrast-v1')) {
      const style = document.createElement('style');
      style.id = 'mmd-payment-headline-contrast-v1';
      style.textContent = `
        #money-control-v3 h1, #mmd-slip-inbox h1, #mmd-history-backfill h1 {
          background: none !important;
          color: #f4efe6 !important;
          -webkit-text-fill-color: #f4efe6 !important;
          opacity: 1 !important;
          filter: none !important;
          text-shadow: 0 1px 0 rgba(255,255,255,.05), 0 14px 38px rgba(0,0,0,.38) !important;
        }
        #money-control-v3 h2, #mmd-slip-inbox h2, #mmd-history-backfill h2 {
          background: none !important;
          color: #ece5da !important;
          -webkit-text-fill-color: #ece5da !important;
          opacity: 1 !important;
          filter: none !important;
        }
      `;
      document.head.appendChild(style);
    }
'''
          replace_once(
              "webflow/internal/admin/payments/payment-control-plane-v6.js",
              "    if (!root) return;\n",
              "    if (!root) return;\n" + style_block,
          )

          style_block_2 = style_block.replace("\n    if", "\n  if", 1).replace("\n      const style", "\n    const style").replace("\n      style.id", "\n    style.id").replace("\n      style.textContent", "\n    style.textContent").replace("\n      document.head", "\n    document.head").replace("\n    }\n", "\n  }\n", 1)
          replace_once(
              "webflow/internal/ceo/payment-slip-inbox-v5.js",
              "  if (!root || root.__psi5) return;\n",
              "  if (!root || root.__psi5) return;\n" + style_block_2,
          )
          replace_once(
              "webflow/internal/admin/payments/historical-backfill-control-plane-v2.js",
              "  if (!root) return;\n",
              "  if (!root) return;\n" + style_block_2,
          )
          PY

      - name: Validate targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check admin-worker/src/payment-review-runtime.js
          node --check admin-worker/src/payment-review-line-recovery.js
          node --check admin-worker/src/historical-slip-backfill-runtime.js
          node --experimental-global-webcrypto --test admin-worker/historical-slip-backfill-handoff-probe.test.mjs
          node --test admin-worker/payment-review-manual-renewal-recovery.test.mjs
          node --check webflow/internal/admin/payments/payment-control-plane-v6.js
          node --check webflow/internal/ceo/payment-slip-inbox-v5.js
          node --check webflow/internal/admin/payments/historical-backfill-control-plane-v2.js
          grep -F 'PAYMENTS_WORKER?.fetch' admin-worker/src/payment-review-runtime.js
          grep -F 'PAYMENTS_WORKER?.fetch' admin-worker/src/payment-review-line-recovery.js
          test "$(grep -F -c 'PAYMENTS_WORKER?.fetch' admin-worker/src/historical-slip-backfill-runtime.js)" -ge 2
          grep -F 'mmd-payment-headline-contrast-v1' webflow/internal/admin/payments/payment-control-plane-v6.js
          grep -F 'mmd-payment-headline-contrast-v1' webflow/internal/ceo/payment-slip-inbox-v5.js
          grep -F 'mmd-payment-headline-contrast-v1' webflow/internal/admin/payments/historical-backfill-control-plane-v2.js

      - name: Commit repair to PR branch and restore canonical CI
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/payment-review-facade-ci.yml
          git add -A
          git diff --cached --check
          git config user.name "mmd-payment-bot"
          git config user.email "mmd-payment-bot@users.noreply.github.com"
          git commit -m "Fix payment internal binding and headline contrast"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
