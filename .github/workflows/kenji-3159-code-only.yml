name: 'Kenji #3159 code-only release'
on:
  pull_request:
    paths:
      - 'scripts/kenji-3159-entry-*'
      - '.github/workflows/kenji-3159-code-only.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, upload, promote, deploy]
        required: true
        default: inspect
      production_approved:
        type: boolean
        required: true
        default: false
      approval_ref:
        type: string
        required: true
      approved_sha:
        description: Exact main tooling SHA approved for this operation
        type: string
        required: true
      candidate_version:
        description: Promote only - existing exact uploaded version; never upload again
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-member-dashboard-chat-worker-production' || format('kenji-entry-contracts-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Offline release, Owner protection and entry contracts
        run: |
          node scripts/kenji-3159-entry-release.mjs --check-source
          node --test scripts/kenji-3159-entry-release.test.mjs scripts/admin-production-approval.test.mjs member-dashboard-chat-worker/test/kenji-entry-topics.test.mjs member-dashboard-chat-worker/test/kenji-category-source.test.mjs
          git diff --check
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mmdprive' && github.run_attempt == 1 && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [contracts]
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}
  reviewed-operation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mmdprive' && github.run_attempt == 1 && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [contracts, production-approval]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Execute only the separately approved mode
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          MODE: ${{ inputs.mode }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/kenji-3159-entry-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kenji-entry-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kenji-3159-entry-receipt.json
          if-no-files-found: ignore
          retention-days: 90
