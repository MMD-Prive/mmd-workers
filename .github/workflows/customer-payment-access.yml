name: Customer payment access contract

on:
  pull_request:
    paths:
      - 'webflow/sigil/confirm/customer-payment-access*'
      - '.github/workflows/customer-payment-access.yml'
  push:
    branches: [main]
    paths:
      - 'webflow/sigil/confirm/customer-payment-access*'
      - '.github/workflows/customer-payment-access.yml'

permissions:
  contents: read

jobs:
  customer-payment-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate customer-only navigation and synthetic bank states
        run: |
          node --check webflow/sigil/confirm/customer-payment-access.js
          node --test webflow/sigil/confirm/customer-payment-access.test.cjs
