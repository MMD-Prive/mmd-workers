name: Patch Model Location Readiness

on:
  push:
    branches:
      - feat/model-gps-location-readiness
    paths:
      - ".github/workflows/patch-model-location-readiness.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/model-gps-location-readiness

      - name: Harden GPS disable purge and location storage errors
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          gps = Path("admin-worker/src/model-gps-visibility.js")
          text = gps.read_text()
          old = '''  if (!updated.ok) {\n    return json({ ok: false, error: "gps_visibility_update_failed" }, updated.status, request, env);\n  }\n\n  return json({ ok: true, data: safeSetting(updated.record?.fields || {}, env) }, 200, request, env);\n}\n'''
          new = '''  if (!updated.ok) {\n    return json({ ok: false, error: "gps_visibility_update_failed" }, updated.status, request, env);\n  }\n\n  // Turning visibility OFF is also a purge signal. If the short-lived location\n  // coordinator exists, delete its current point immediately. This never makes\n  // the permission endpoint accept or store coordinates.\n  if (normalized.enabled === false) {\n    await clearEphemeralLocation(env, auth.payload.model_record_id);\n  }\n\n  return json({ ok: true, data: safeSetting(updated.record?.fields || {}, env) }, 200, request, env);\n}\n'''
          if 'await clearEphemeralLocation(env, auth.payload.model_record_id);' not in text:
              if old not in text:
                  raise SystemExit("GPS update marker missing")
              text = text.replace(old, new, 1)
          if 'async function clearEphemeralLocation' not in text:
              marker = '''function gpsField(env) {\n  return clean(env.AT_MODELS__GPS_VISIBILITY_ENABLED || GPS_FIELD_DEFAULT);\n}\n'''
              helper = '''async function clearEphemeralLocation(env, modelRecordId) {\n  const namespace = env.MODEL_LOCATION_COORDINATOR;\n  const recordId = clean(modelRecordId);\n  if (!recordId || !namespace?.idFromName || !namespace?.get) return false;\n  try {\n    const id = namespace.idFromName(`model:${recordId}`);\n    const response = await namespace.get(id).fetch("https://model-location.internal/clear", { method: "POST" });\n    return response.ok;\n  } catch {\n    // Permission OFF is authoritative even if the ephemeral purge path is\n    // temporarily unavailable; the location read/ingest gates still fail closed.\n    return false;\n  }\n}\n\n''' + marker
              if marker not in text:
                  raise SystemExit("GPS helper marker missing")
              text = text.replace(marker, helper, 1)
          gps.write_text(text)

          runtime = Path("admin-worker/src/model-location-runtime.js")
          text = runtime.read_text()
          old = '''  await writeStoredModelLocation(env, auth.payload.model_record_id, stored);\n  return json({ ok: true, data: safeCurrentMetadata(stored, context, env) }, 200, request, env);\n}\n'''
          new = '''  try {\n    await writeStoredModelLocation(env, auth.payload.model_record_id, stored);\n  } catch {\n    return json({ ok: false, error: "model_location_storage_write_failed" }, 503, request, env);\n  }\n  return json({ ok: true, data: safeCurrentMetadata(stored, context, env) }, 200, request, env);\n}\n'''
          if 'error: "model_location_storage_write_failed"' not in text:
              if old not in text:
                  raise SystemExit("location write marker missing")
              text = text.replace(old, new, 1)

          old = '''  const current = await currentResponse.clone().json().catch(() => ({}));\n\n  let session = null;\n  if (currentResponse.ok && current?.session && typeof current.session === "object") session = current.session;\n'''
          new = '''  const current = await currentResponse.clone().json().catch(() => ({}));\n  if (!currentResponse.ok) {\n    return {\n      ok: false,\n      status: currentResponse.status || 503,\n      error: clean(current?.error) || "session_lookup_failed",\n    };\n  }\n\n  let session = null;\n  if (current?.session && typeof current.session === "object") session = current.session;\n'''
          if 'error: clean(current?.error) || "session_lookup_failed"' not in text:
              if old not in text:
                  raise SystemExit("session lookup marker missing")
              text = text.replace(old, new, 1)
          runtime.write_text(text)
          PY

          git config user.name "MMD Privé"
          git config user.email "malemodel.bkk@gmail.com"
          git add admin-worker/src/model-gps-visibility.js admin-worker/src/model-location-runtime.js
          if git diff --cached --quiet; then
            echo "No hardening changes needed"
            exit 0
          fi
          git commit -m "security(model): purge location when GPS visibility turns off"
          git push origin HEAD:feat/model-gps-location-readiness
