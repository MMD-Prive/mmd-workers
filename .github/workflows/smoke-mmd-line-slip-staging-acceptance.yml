name: Smoke MMD LINE Slip Staging Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - fix/slip-staging-acceptance-smoke
    paths:
      - ".github/workflows/smoke-mmd-line-slip-staging-acceptance.yml"

concurrency:
  group: smoke-mmd-line-slip-staging-acceptance
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  synthetic-queue-airtable-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: "appsV1ILPRfIjkaYg"
      AIRTABLE_STAGING_TABLE_ID: "tbl9Y6IMM4EWYjIBJ"
      EXTRACTOR_URL: "https://mmd-slip-extractor-staging.malemodel-bkk.workers.dev"
      INTAKE_URL: "https://mmd-line-slip-intake-staging.malemodel-bkk.workers.dev"
      NO_COLOR: "1"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/mmd-slip-extractor/package-lock.json
            services/mmd-slip-extractor/cloudflare/package-lock.json

      - name: Lock staging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const extractor = JSON.parse(fs.readFileSync("services/mmd-slip-extractor/cloudflare/wrangler.jsonc", "utf8"));
          const intake = JSON.parse(fs.readFileSync("services/mmd-line-slip-intake/cloudflare/wrangler.jsonc", "utf8"));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(extractor.name === "mmd-slip-extractor-staging", "extractor must remain staging");
          assert(extractor.workers_dev === true && extractor.preview_urls === false, "extractor must remain workers.dev-only");
          assert(Array.isArray(extractor.routes) && extractor.routes.length === 0, "extractor custom routes forbidden");
          assert(extractor.vars?.MMD_RUNTIME_SCOPE === "staging", "extractor staging scope required");
          assert(intake.name === "mmd-line-slip-intake-staging", "intake must remain staging");
          assert(intake.workers_dev === true && intake.preview_urls === false, "intake must remain workers.dev-only");
          assert(!intake.routes || intake.routes.length === 0, "intake custom routes forbidden");
          assert(intake.vars?.MMD_RUNTIME_SCOPE === "staging", "intake staging scope required");
          assert(intake.queues?.producers?.[0]?.queue === "mmd-line-slip-intake-staging", "staging Queue lock failed");
          assert(intake.queues?.consumers?.[0]?.dead_letter_queue === "mmd-line-slip-intake-staging-dlq", "staging DLQ lock failed");
          assert(intake.r2_buckets?.[0]?.bucket_name === "mmd-line-slip-evidence-staging", "staging R2 lock failed");
          const source = fs.readFileSync("services/mmd-line-slip-intake/cloudflare/worker.mjs", "utf8");
          assert(!source.includes("LINE_WEBHOOK_UPSTREAM_URL"), "retired LINE upstream must remain absent");
          assert(source.includes("source === \"synthetic_isolated\""), "synthetic-only gate missing");
          NODE

      - name: Generate ephemeral staging bearer tokens
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const clean = (value) => String(value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const cf = clean(process.env.CLOUDFLARE_API_TOKEN);
          const airtable = clean(process.env.AIRTABLE_API_KEY);
          if (!cf) throw new Error("Cloudflare staging credential missing");
          if (!airtable) throw new Error("Airtable staging credential missing");
          console.log(`::add-mask::${cf}`);
          console.log(`::add-mask::${airtable}`);
          const extractorToken = crypto.randomBytes(32).toString("base64url");
          const intakeToken = crypto.randomBytes(32).toString("base64url");
          console.log(`::add-mask::${extractorToken}`);
          console.log(`::add-mask::${intakeToken}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `MMD_SLIP_EXTRACTOR_TOKEN=${extractorToken}\nMMD_SLIP_INTAKE_STAGING_TOKEN=${intakeToken}\n`);
          fs.writeFileSync(process.env.RUNNER_TEMP + "/extractor.env", `MMD_SLIP_EXTRACTOR_TOKEN=${extractorToken}\n`, { mode: 0o600 });
          fs.writeFileSync(
            process.env.RUNNER_TEMP + "/intake.env",
            [
              `MMD_SLIP_INTAKE_STAGING_TOKEN=${intakeToken}`,
              `MMD_SLIP_EXTRACTOR_TOKEN=${extractorToken}`,
              `AIRTABLE_API_KEY=${airtable}`,
              "",
            ].join("\n"),
            { mode: 0o600 },
          );
          NODE

      - name: Verify Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 whoami

      - name: Install fixture dependency and run staging unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix services/mmd-slip-extractor
          npm ci --prefix services/mmd-slip-extractor/cloudflare
          node --test services/mmd-slip-extractor/test/*.test.mjs
          node --test services/mmd-slip-extractor/cloudflare/test/*.test.mjs
          node --experimental-global-webcrypto --test services/mmd-line-slip-intake/cloudflare/test/*.test.mjs

      - name: Redeploy isolated staging extractor with fresh bearer
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 deploy \
            --config services/mmd-slip-extractor/cloudflare/wrangler.jsonc \
            --keep-vars \
            --secrets-file "$RUNNER_TEMP/extractor.env"

      - name: Redeploy Queue-backed staging intake with fresh bearer
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 deploy \
            --config services/mmd-line-slip-intake/cloudflare/wrangler.jsonc \
            --keep-vars \
            --secrets-file "$RUNNER_TEMP/intake.env"

      - name: Wait for staging health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            extractor_code="$(curl --silent --show-error --output "$RUNNER_TEMP/extractor-health.json" --write-out '%{http_code}' "$EXTRACTOR_URL/health" || true)"
            intake_code="$(curl --silent --show-error --output "$RUNNER_TEMP/intake-health.json" --write-out '%{http_code}' "$INTAKE_URL/health" || true)"
            if [ "$extractor_code" = "200" ] && [ "$intake_code" = "200" ]; then
              node <<'NODE'
              const fs = require("node:fs");
              const extractor = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/extractor-health.json", "utf8"));
              const intake = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/intake-health.json", "utf8"));
              if (extractor.ok !== true) process.exit(1);
              if (intake.ok !== true || intake.worker !== "mmd-line-slip-intake-staging" || intake.runtime_scope !== "staging") process.exit(1);
              NODE
              echo "Staging extractor and intake healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Staging health timeout" >&2
          exit 1

      - name: Create unique synthetic redacted fixture
        shell: bash
        working-directory: services/mmd-slip-extractor
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          const marker = `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const svg = `<svg width="1100" height="420" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="60" y="120" font-family="Arial" font-size="54" fill="black">MMD SYNTHETIC SLIP</text><text x="60" y="220" font-family="Arial" font-size="48" fill="black">Amount: THB 690.00</text><text x="60" y="305" font-family="Arial" font-size="38" fill="black">Transaction ID: SYNTHETIC-${marker}</text></svg>`;
          await sharp(Buffer.from(svg)).png().toFile(process.env.RUNNER_TEMP + "/synthetic-slip.png");
          NODE

      - name: Prove unauthorized boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/unauth.json" --write-out '%{http_code}' \
            -X POST -H 'Content-Type: image/png' --data-binary "@$RUNNER_TEMP/synthetic-slip.png" "$INTAKE_URL/v1/staging/intake" || true)"
          test "$code" = "401"
          node -e 'const fs=require("node:fs"); const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (b.error!=="unauthorized") process.exit(1)' "$RUNNER_TEMP/unauth.json"
          echo "Unauthenticated staging intake fails closed"

      - name: Authorized synthetic intake with deploy-propagation retry
        shell: bash
        run: |
          set -euo pipefail
          run_id="gha-accept-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          accepted=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/intake.json" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${MMD_SLIP_INTAKE_STAGING_TOKEN}" \
              -H 'Content-Type: image/png' \
              -H "x-mmd-run-id: ${run_id}" \
              --data-binary "@$RUNNER_TEMP/synthetic-slip.png" \
              "$INTAKE_URL/v1/staging/intake" || true)"
            if [ "$code" = "202" ]; then
              accepted=1
              break
            fi
            safe_error="$(node -e 'const fs=require("node:fs"); try { const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(b.error||"non_json_error").slice(0,120)); } catch { process.stdout.write("non_json_error"); }' "$RUNNER_TEMP/intake.json")"
            echo "Authorized intake attempt ${attempt}: HTTP ${code} / ${safe_error}"
            sleep 5
          done
          test "$accepted" = "1"
          node <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/intake.json", "utf8"));
          if (body.ok !== true || body.accepted !== true || body.state !== "queued") throw new Error("authorized intake did not queue");
          if (!/^syn_[a-f0-9]{24}$/.test(body.proof_id || "")) throw new Error("synthetic proof id missing");
          if ("r2_key" in body || "paid" in body || "verified" in body) throw new Error("forbidden field exposed");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/proof-id.txt", body.proof_id);
          console.log(`Synthetic proof queued: ${body.proof_id}`);
          NODE

      - name: Verify Airtable pending proof
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const proofId = fs.readFileSync(process.env.RUNNER_TEMP + "/proof-id.txt", "utf8").trim();
          const base = process.env.AIRTABLE_BASE_ID;
          const table = process.env.AIRTABLE_STAGING_TABLE_ID;
          const token = process.env.AIRTABLE_API_KEY;
          const formula = `{proof_id}='${proofId.replace(/'/g, "\\'")}'`;
          const url = `https://api.airtable.com/v0/${base}/${table}?maxRecords=10&filterByFormula=${encodeURIComponent(formula)}`;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let records = [];
          for (let attempt = 1; attempt <= 40; attempt += 1) {
            const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            if (!response.ok) throw new Error(`Airtable proof read HTTP ${response.status}`);
            const payload = await response.json();
            records = Array.isArray(payload.records) ? payload.records : [];
            if (records.length === 1) break;
            if (records.length > 1) throw new Error(`duplicate proof records observed: ${records.length}`);
            await sleep(3000);
          }
          if (records.length !== 1) throw new Error(`expected exactly one pending proof, got ${records.length}`);
          const fields = records[0].fields || {};
          if (fields.status !== "pending") throw new Error(`unexpected proof status: ${fields.status}`);
          if (fields.source !== "synthetic_isolated") throw new Error(`unexpected proof source: ${fields.source}`);
          if (!String(fields.note || "").includes("extraction_")) throw new Error("extraction result metadata missing");
          fs.writeFileSync(process.env.RUNNER_TEMP + "/proof-record.json", JSON.stringify({ proof_id: proofId }));
          console.log(`Queue -> extractor -> Airtable pending PASS: ${proofId}`);
          NODE

      - name: Replay same evidence and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/replay.json" --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${MMD_SLIP_INTAKE_STAGING_TOKEN}" \
            -H 'Content-Type: image/png' \
            -H "x-mmd-run-id: replay-${GITHUB_RUN_ID}" \
            --data-binary "@$RUNNER_TEMP/synthetic-slip.png" \
            "$INTAKE_URL/v1/staging/intake" || true)"
          test "$code" = "202"
          sleep 10
          node <<'NODE'
          const fs = require("node:fs");
          const proofId = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/proof-record.json", "utf8")).proof_id;
          const base = process.env.AIRTABLE_BASE_ID;
          const table = process.env.AIRTABLE_STAGING_TABLE_ID;
          const token = process.env.AIRTABLE_API_KEY;
          const formula = `{proof_id}='${proofId.replace(/'/g, "\\'")}'`;
          const url = `https://api.airtable.com/v0/${base}/${table}?maxRecords=10&filterByFormula=${encodeURIComponent(formula)}`;
          const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`Airtable replay read HTTP ${response.status}`);
          const payload = await response.json();
          const records = Array.isArray(payload.records) ? payload.records : [];
          if (records.length !== 1) throw new Error(`replay idempotency failed: ${records.length} records`);
          const fields = records[0].fields || {};
          if (fields.status !== "pending" || fields.source !== "synthetic_isolated") throw new Error("replay changed authority boundary");
          console.log(`Replay idempotency PASS: ${proofId}`);
          NODE

      - name: Record acceptance evidence in issue 317
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          proof_id=""
          if [ -f "$RUNNER_TEMP/proof-id.txt" ]; then proof_id="$(cat "$RUNNER_TEMP/proof-id.txt")"; fi
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment 317 --repo "$GITHUB_REPOSITORY" --body "✅ Staging acceptance item PASS: authorized synthetic → R2/Queue → extractor → Airtable \`pending / synthetic_isolated\` + replay idempotency.\n\n- source_sha: \`${GITHUB_SHA}\`\n- workflow_run_id: \`${GITHUB_RUN_ID}\`\n- proof_id: \`${proof_id}\`\n- production LINE route mutation: NONE\n- real-LINE production: NOT TOUCHED\n- HYPE redacted alert: still a separate gate; not claimed by this workflow."
          else
            gh issue comment 317 --repo "$GITHUB_REPOSITORY" --body "❌ Staging authorized synthetic acceptance smoke failed.\n\n- source_sha: \`${GITHUB_SHA}\`\n- workflow_run_id: \`${GITHUB_RUN_ID}\`\n- production LINE route mutation: NONE\n- real-LINE production: NOT TOUCHED\n\nInspect the failed step; do not promote."
          fi
