name: Sync model line link API routes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-model-line-link-api-routes.yml"
      - "admin-worker/wrangler.toml"
      - "admin-worker/src/admin-model-line-link-worker.js"
      - "admin-worker/src/model-line-avatar-review.js"
      - "admin-worker/src/model-line-link-review.js"

permissions:
  contents: read

concurrency:
  group: sync-model-line-link-api-routes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      WORKER_NAME: admin-worker
    steps:
      - name: Verify Cloudflare route token
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          code="$(curl --retry 3 --retry-delay 2 --retry-all-errors -sS \
            -o "$body_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_ROUTES_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$code" = "200"
          node - "$body_file" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload.success !== true || payload.result?.status !== "active") {
            throw new Error("Cloudflare routes token is not active");
          }
          NODE

      - name: Sync model line link API routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const worker = process.env.WORKER_NAME;
          const desired = [
            "mmdbkk.com/v1/admin/models/activation-candidates",
            "mmdbkk.com/v1/admin/models/activation-candidates*",
            "www.mmdbkk.com/v1/admin/models/activation-candidates",
            "www.mmdbkk.com/v1/admin/models/activation-candidates*",
            "mmdbkk.com/v1/admin/model/activation/issue",
            "www.mmdbkk.com/v1/admin/model/activation/issue",
          ];

          async function cloudflare(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const payload = await response.json();
            if (!response.ok || payload.success !== true) {
              const errors = (payload.errors || [])
                .map((error) => `${error.code || "unknown"}: ${error.message || "unknown error"}`)
                .join("; ");
              throw new Error(`Cloudflare ${options.method || "GET"} ${path} failed (${response.status}): ${errors}`);
            }
            return payload.result;
          }

          const routePath = `/zones/${zoneId}/workers/routes`;
          const existing = await cloudflare(routePath);
          const conflicts = desired.flatMap((pattern) =>
            existing.filter((route) => route.pattern === pattern && route.script !== worker)
          );
          if (conflicts.length) {
            throw new Error(`Refusing to replace existing routes: ${conflicts.map((route) => `${route.pattern} -> ${route.script || "no script"}`).join(", ")}`);
          }

          const missing = desired.filter(
            (pattern) => !existing.some((route) => route.pattern === pattern && route.script === worker)
          );
          for (const pattern of missing) {
            await cloudflare(routePath, {
              method: "POST",
              body: JSON.stringify({ pattern, script: worker }),
            });
            console.log(`Created ${pattern} -> ${worker}`);
          }

          const verified = await cloudflare(routePath);
          const unresolved = desired.filter(
            (pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker)
          );
          if (unresolved.length) throw new Error(`Route verification failed: ${unresolved.join(", ")}`);
          console.log(`Verified ${desired.length}/${desired.length} model line link API routes; created ${missing.length}`);
          NODE

      - name: Smoke unauthenticated model link queue endpoint
        shell: bash
        run: |
          set -euo pipefail
          for host in mmdbkk.com www.mmdbkk.com; do
            url="https://${host}/v1/admin/models/activation-candidates?mode=line-link-claims"
            body_file="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -o "$body_file" \
              -w "%{http_code}" \
              -H "accept: application/json" \
              "$url")"
            body="$(cat "$body_file")"
            echo "$url -> HTTP $code"
            if [ "$code" = "404" ] || printf '%s' "$body" | grep -qi '<html'; then
              echo "Model link queue endpoint is still falling through to HTML/404: $url" >&2
              cat "$body_file" >&2
              exit 1
            fi
            node - "$body_file" <<'NODE'
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (payload?.ok !== false || payload?.error !== "unauthorized") {
              throw new Error(`Expected unauthorized JSON, got ${JSON.stringify(payload)}`);
            }
            NODE
          done

      - name: Smoke unauthenticated model link bind endpoint
        shell: bash
        run: |
          set -euo pipefail
          for host in mmdbkk.com www.mmdbkk.com; do
            url="https://${host}/v1/admin/model/activation/issue"
            body_file="$(mktemp)"
            code="$(curl --retry 6 --retry-delay 2 --retry-all-errors -sS \
              -o "$body_file" \
              -w "%{http_code}" \
              -H "content-type: application/json" \
              -H "accept: application/json" \
              --data '{"mode":"bind_verified_claim","claim_id":"smoke","model_record_id":"recSmoke","confirm":true}' \
              "$url")"
            body="$(cat "$body_file")"
            echo "$url -> HTTP $code"
            if [ "$code" = "404" ] || printf '%s' "$body" | grep -qi '<html'; then
              echo "Model link bind endpoint is still falling through to HTML/404: $url" >&2
              cat "$body_file" >&2
              exit 1
            fi
            node - "$body_file" <<'NODE'
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (payload?.ok !== false || payload?.error !== "unauthorized") {
              throw new Error(`Expected unauthorized JSON, got ${JSON.stringify(payload)}`);
            }
            NODE
          done
