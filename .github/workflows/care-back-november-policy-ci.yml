name: CARE BACK November exact policy contracts

on:
  pull_request:
    paths:
      - 'scripts/kenji-care-back-november-release*'
      - 'member-pages-worker/src/kenji-member-benefits.js'
      - 'member-pages-worker/src/liff-renewal-card.js'
      - 'member-pages-worker/src/liff-renewal-view.js'
      - 'member-pages-worker/test/care-back-november-month-propagation.test.mjs'
      - 'member-pages-worker/test/liff-renewal-care-back-copy.test.mjs'
      - 'member-dashboard-chat-worker/src/kenji-care-back-*'
      - 'member-dashboard-chat-worker/src/kenji-line-live-truth.mjs'
      - 'member-dashboard-chat-worker/src/mmd-i18n.mjs'
      - 'member-dashboard-chat-worker/test/kenji-care-back-*'
      - 'member-dashboard-chat-worker/test/fixtures/kenji-care-back-*'
      - 'assets/promotions/care-back/2026-11/**'
      - '.github/workflows/deploy-kenji-care-back-november.yml'
      - 'scripts/care-back-november-*'
      - 'scripts/fixtures/care-back-november-*'
      - 'scripts/member-pages-owner-approval.test.mjs'
      - 'shared/membership-promotion-policy*'
      - 'payments-worker/reviewed-membership-write-through*'
      - 'payments-worker/canonical-web-renewal-settlement*'
      - 'payments-worker/reviewed-proof*'
      - '.github/workflows/deploy-care-back-november-policy.yml'
      - '.github/workflows/deploy-member-pages-worker-code-only.yml'
      - '.github/workflows/care-back-november-policy-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/kenji-care-back-november-release*'
      - 'member-pages-worker/src/kenji-member-benefits.js'
      - 'member-pages-worker/src/liff-renewal-card.js'
      - 'member-pages-worker/src/liff-renewal-view.js'
      - 'member-pages-worker/test/care-back-november-month-propagation.test.mjs'
      - 'member-pages-worker/test/liff-renewal-care-back-copy.test.mjs'
      - 'member-dashboard-chat-worker/src/kenji-care-back-*'
      - 'member-dashboard-chat-worker/src/kenji-line-live-truth.mjs'
      - 'member-dashboard-chat-worker/src/mmd-i18n.mjs'
      - 'member-dashboard-chat-worker/test/kenji-care-back-*'
      - 'member-dashboard-chat-worker/test/fixtures/kenji-care-back-*'
      - 'assets/promotions/care-back/2026-11/**'
      - '.github/workflows/deploy-kenji-care-back-november.yml'
      - 'scripts/care-back-november-*'
      - 'scripts/fixtures/care-back-november-*'
      - 'scripts/member-pages-owner-approval.test.mjs'
      - 'shared/membership-promotion-policy*'
      - 'payments-worker/reviewed-membership-write-through*'
      - 'payments-worker/canonical-web-renewal-settlement*'
      - 'payments-worker/reviewed-proof*'
      - '.github/workflows/deploy-care-back-november-policy.yml'
      - '.github/workflows/deploy-member-pages-worker-code-only.yml'
      - '.github/workflows/care-back-november-policy-ci.yml'

permissions:
  contents: read

jobs:
  policy-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate artifact transport, existing approval guards, and exact recovered function behavior
        run: node --experimental-vm-modules --test scripts/care-back-november-policy-release.test.mjs scripts/care-back-november-*-manifest.test.mjs scripts/member-pages-owner-approval.test.mjs scripts/admin-production-approval.test.mjs
      - name: Validate canonical payment-time policy and all existing payment paths
        run: node --test shared/membership-promotion-policy.test.mjs payments-worker/reviewed-membership-write-through.test.mjs payments-worker/canonical-web-renewal-settlement.test.mjs payments-worker/reviewed-proof-line-recovery.test.mjs
      - name: Validate scoped Member Pages and Kenji announcement semantics
        run: node --experimental-global-webcrypto --test member-pages-worker/test/care-back-november-month-propagation.test.mjs member-pages-worker/test/liff-renewal-care-back-copy.test.mjs member-dashboard-chat-worker/test/kenji-care-back-november.test.mjs member-dashboard-chat-worker/test/kenji-care-back-poster.test.mjs scripts/kenji-care-back-november-release.test.mjs

