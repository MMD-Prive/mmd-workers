name: Deploy member-pages-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "shared/posthog-authority-events.mjs"
      - "member-pages-worker/**"
      - "shared/mmd-shop-stock-reservation.mjs"
      - "shared/mmd-shop-fulfillment.mjs"
      - "shared/my-mmd-fast-trust-source.mjs"
      - "scripts/validate-my-mmd-fast-trust-airtable-schema.mjs"
      - "shared/private-media.mjs"
      - "scripts/ensure-private-media-bucket.mjs"
      - ".github/workflows/deploy-member-pages-worker.yml"
      - "shared/payment-intelligence.mjs"

concurrency:
  group: deploy-member-pages-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      AIRTABLE_API_KEY: ${{ secrets.MMS_AIRTABLE_API_TOKEN || secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: "appsV1ILPRfIjkaYg"
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Normalize Cloudflare and Airtable credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_API_TOKEN);
          const accountId = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const airtableApiKey = clean(process.env.AIRTABLE_API_KEY);
          const airtableBaseId = clean(process.env.AIRTABLE_BASE_ID);
          if (!token || !accountId) throw new Error("Cloudflare credentials are missing after normalization");
          if (!airtableApiKey) throw new Error("Airtable production token is missing after normalization");
          if (airtableBaseId !== "appsV1ILPRfIjkaYg") throw new Error("Unexpected AIRTABLE_BASE_ID for member-pages-worker");
          console.log(`::add-mask::${airtableApiKey}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${token}\nCLOUDFLARE_ACCOUNT_ID=${accountId}\nAIRTABLE_API_KEY=${airtableApiKey}\nAIRTABLE_BASE_ID=${airtableBaseId}\n`);
          NODE

      - name: Verify Airtable LIFF gateway access
        shell: bash
        run: |
          node <<'NODE'
          const token = String(process.env.AIRTABLE_API_KEY || "").trim();
          const base = String(process.env.AIRTABLE_BASE_ID || "").trim();
          const table = "tblXjQFwo0A2cHseh";
          const response = await fetch(`https://api.airtable.com/v0/${base}/${table}?maxRecords=1`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            const type = String(payload?.error?.type || `HTTP_${response.status}`).slice(0, 120);
            throw new Error(`LIFF gateway Airtable preflight failed: ${type}`);
          }
          console.log("LIFF gateway Airtable read preflight passed");
          NODE

      - name: Verify My MMD Fast Trust Airtable schema
        run: node scripts/validate-my-mmd-fast-trust-airtable-schema.mjs

      - name: Verify Birthday Wish Airtable write access
        shell: bash
        run: |
          node <<'NODE'
          const { createHash, randomUUID } = await import("node:crypto");
          const token = String(process.env.AIRTABLE_API_KEY || "").trim();
          const base = String(process.env.AIRTABLE_BASE_ID || "").trim();
          const table = "tblvMJjYXy29mgDLb";
          const now = new Date().toISOString();
          const nonce = randomUUID().replace(/-/g, "");
          const requestId = `gha-wish-preflight-${process.env.GITHUB_RUN_ID}-${nonce.slice(0, 12)}`;
          const hash = createHash("sha256").update(`gha-wish-preflight:${requestId}`).digest("hex");
          const fields = {
            wish_id: `wish_${nonce}`,
            campaign_id: "care_back",
            verified_customer_ref_hash: hash,
            wish_text: "GitHub Birthday Wish storage preflight",
            wish_status: "completed",
            idempotency_key: requestId,
            submitted_at: now,
            completed_at: now,
            public_display_text: "MMD has received your birthday wish.",
            source: "member_page",
            source_path: "/promotion/6-years-care-back/wish",
            language: "en",
            display_version: "care_back_public_v1",
            payload_json: JSON.stringify({ schema_version: 2, campaign_id: "care_back", wish_kind: "deployment_preflight" }),
            created_at: now,
            updated_at: now,
          };
          const endpoint = `https://api.airtable.com/v0/${base}/${table}`;
          const create = await fetch(endpoint, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "content-type": "application/json" },
            body: JSON.stringify({ fields, typecast: false }),
          });
          const created = await create.json().catch(() => ({}));
          if (!create.ok || !created?.id) {
            const type = String(created?.error?.type || `HTTP_${create.status}`).slice(0, 120);
            const message = String(created?.error?.message || "").slice(0, 180);
            throw new Error(`Birthday Wish Airtable write preflight failed: ${type}${message ? `: ${message}` : ""}`);
          }
          const remove = await fetch(`${endpoint}/${encodeURIComponent(created.id)}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!remove.ok) throw new Error(`Birthday Wish Airtable cleanup failed: HTTP_${remove.status}`);
          console.log("Birthday Wish Airtable write preflight passed and synthetic record was removed");
          NODE

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix member-pages-worker/test-runtime

      - name: Run focused LIFF, CARE BACK, and model Drive tests
        run: |
          npm run test:member-pages-liff
          node --test member-pages-worker/test/model-drive-directory.test.mjs
          node --experimental-global-webcrypto --test member-pages-worker/private-preview.test.mjs shared/private-media.test.mjs
          npm run check:member-pages-wrangler

      - name: Verify private media bucket is private
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: node scripts/ensure-private-media-bucket.mjs

      - name: Validate Cloudflare deploy
        working-directory: member-pages-worker
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars

      - name: Provision Airtable API secret
        shell: bash
        run: |
          set -euo pipefail
          set +x
          printf '%s' "$AIRTABLE_API_KEY" | npx --yes wrangler@4 secret put AIRTABLE_API_KEY --env="" --config member-pages-worker/wrangler.toml

      - name: Deploy member-pages-worker
        id: deploy
        shell: bash
        working-directory: member-pages-worker
        run: |
          set -euo pipefail
          set -o pipefail
          tag="gha-${GITHUB_SHA:0:12}"
          echo "MEMBER_PAGES_WORKER_VERSION_TAG=${tag}" >> "$GITHUB_ENV"
          npx --yes wrangler@4 deploy \
            --keep-vars \
            2>&1 | tee "$RUNNER_TEMP/member-pages-worker-deploy.log"
          version_id="$(sed -n 's/.*Current Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/member-pages-worker-deploy.log" | tail -n 1)"
          echo "MEMBER_PAGES_WORKER_VERSION_ID=${version_id:-direct-deploy}" >> "$GITHUB_ENV"

      - name: Smoke production Exclusive EMs15 and EMs16 Drive resolution
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");

          (async () => {
            const secret = String(process.env.AIRTABLE_API_KEY || "").trim();
            if (!secret) throw new Error("Model Drive directory signing secret is unavailable");

            const base = "https://member-pages-worker.malemodel-bkk.workers.dev";
            const ems15Id = "1CCf755JC6-e4VPM5ApqadNozXVFpofmh";
            const expectedRoot = "1j1NRB44PboVQR91M8-17Vb8kcCTCLS97";
            const expectedScope = `exclusive:drive:${ems15Id}`;

            async function signedFetch(url, { method = "GET", body = "" } = {}) {
              const timestamp = String(Math.floor(Date.now() / 1000));
              const bodyHash = crypto.createHash("sha256").update(body).digest("hex");
              const canonical = `${timestamp}\n${method}\n${url.pathname}\n${url.search}\n${bodyHash}`;
              const signature = crypto.createHmac("sha256", secret).update(canonical).digest("hex");
              return fetch(url, {
                method,
                body: method === "GET" ? undefined : body,
                headers: {
                  accept: "application/json",
                  "content-type": "application/json",
                  "x-mmd-model-drive-ts": timestamp,
                  "x-mmd-model-drive-signature": signature,
                },
                redirect: "manual",
              });
            }

            const search = new URL("/__internal/model-drive/search", base);
            search.searchParams.set("q", "EMs15");
            search.searchParams.set("lane", "all");

            const response = await signedFetch(search);
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.ok !== true || !Array.isArray(payload?.items)) {
              throw new Error(`EMs15 signed Drive search failed: HTTP ${response.status} ${JSON.stringify(payload).slice(0, 300)}`);
            }

            const candidate = payload.items.find((item) => item?.drive_folder_id === ems15Id);
            if (!candidate) throw new Error(`EMs15 was not returned by approved Drive search; count=${payload.items.length}`);
            if (candidate.lane !== "exclusive") throw new Error(`EMs15 lane must be exclusive; got ${candidate.lane}`);
            if (candidate.folder_scope_key !== expectedScope) throw new Error(`EMs15 folder_scope_key mismatch: ${candidate.folder_scope_key}`);
            if (candidate.approved_root_id !== expectedRoot) throw new Error(`EMs15 approved_root_id mismatch: ${candidate.approved_root_id}`);
            if (!String(candidate.folder_path || "").includes("MMD Exclusive Models / Exclusive VIP / Both / EMs15")) {
              throw new Error(`EMs15 folder_path mismatch: ${candidate.folder_path}`);
            }

            const resolve = new URL("/__internal/model-drive/resolve", base);
            const body = JSON.stringify({ drive_folder_id: ems15Id });
            const resolvedResponse = await signedFetch(resolve, { method: "POST", body });
            const resolved = await resolvedResponse.json().catch(() => ({}));
            if (!resolvedResponse.ok || resolved?.ok !== true || resolved?.item?.drive_folder_id !== ems15Id) {
              throw new Error(`EMs15 exact Drive re-resolution failed: HTTP ${resolvedResponse.status} ${JSON.stringify(resolved).slice(0, 300)}`);
            }
            if (resolved?.item?.lane !== "exclusive") throw new Error(`EMs15 re-resolution lost exclusive lane: ${resolved?.item?.lane}`);
            if (resolved?.item?.folder_scope_key !== expectedScope) throw new Error(`EMs15 re-resolution scope mismatch: ${resolved?.item?.folder_scope_key}`);

            console.log(`EMs15 production Drive smoke passed: ${expectedScope}`);

            const ems16Id = "1aJGfs0fBI-bH1mwra3SG1uXz71JWtM3t";
            const ems16ReviewId = "1JNv8OWPmQValSlUf5VirOtQ_nRaWq4Vd";
            const ems16Scope = `exclusive:drive:${ems16Id}`;
            const ems16Search = new URL("/__internal/model-drive/search", base);
            ems16Search.searchParams.set("q", "EMs16");
            ems16Search.searchParams.set("lane", "all");

            const ems16Response = await signedFetch(ems16Search);
            const ems16Payload = await ems16Response.json().catch(() => ({}));
            if (!ems16Response.ok || ems16Payload?.ok !== true || !Array.isArray(ems16Payload?.items)) {
              throw new Error(`EMs16 signed Drive search failed: HTTP ${ems16Response.status} ${JSON.stringify(ems16Payload).slice(0, 300)}`);
            }
            const ems16 = ems16Payload.items.find((item) => item?.drive_folder_id === ems16Id);
            if (!ems16) throw new Error(`EMs16 model root was not returned; count=${ems16Payload.items.length}`);
            if (ems16Payload.items.some((item) => item?.drive_folder_id === ems16ReviewId)) {
              throw new Error("Nested Review EMs16 Gohan folder leaked into model candidates");
            }
            if (ems16.lane !== "exclusive") throw new Error(`EMs16 lane must be exclusive; got ${ems16.lane}`);
            if (ems16.folder_scope_key !== ems16Scope) throw new Error(`EMs16 folder_scope_key mismatch: ${ems16.folder_scope_key}`);
            if (ems16.approved_root_id !== expectedRoot) throw new Error(`EMs16 approved_root_id mismatch: ${ems16.approved_root_id}`);
            if (!String(ems16.folder_path || "").includes("MMD Exclusive Models / Exclusive PN / EMs16")) {
              throw new Error(`EMs16 folder_path mismatch: ${ems16.folder_path}`);
            }

            const ems16Resolve = new URL("/__internal/model-drive/resolve", base);
            const ems16Body = JSON.stringify({ drive_folder_id: ems16Id });
            const ems16ResolvedResponse = await signedFetch(ems16Resolve, { method: "POST", body: ems16Body });
            const ems16Resolved = await ems16ResolvedResponse.json().catch(() => ({}));
            if (!ems16ResolvedResponse.ok || ems16Resolved?.ok !== true || ems16Resolved?.item?.drive_folder_id !== ems16Id) {
              throw new Error(`EMs16 exact Drive re-resolution failed: HTTP ${ems16ResolvedResponse.status} ${JSON.stringify(ems16Resolved).slice(0, 300)}`);
            }
            if (ems16Resolved?.item?.folder_scope_key !== ems16Scope) {
              throw new Error(`EMs16 re-resolution scope mismatch: ${ems16Resolved?.item?.folder_scope_key}`);
            }

            console.log(`EMs16 production Drive smoke passed: ${ems16Scope}; nested review excluded`);
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE

      - name: Smoke production public Wish endpoint
        shell: bash
        run: |
          node <<'NODE'
          const token = String(process.env.AIRTABLE_API_KEY || "").trim();
          const base = String(process.env.AIRTABLE_BASE_ID || "").trim();
          const table = "tblvMJjYXy29mgDLb";
          const requestId = `prod-wish-smoke-${process.env.GITHUB_RUN_ID}-${String(process.env.GITHUB_SHA || "").slice(0, 12)}`;
          const endpoint = "https://mmdbkk.com/member/api/care-back/public-wish";
          let response;
          let payload = null;
          try {
            response = await fetch(endpoint, {
              method: "POST",
              redirect: "manual",
              headers: {
                accept: "application/json",
                "content-type": "application/json",
                origin: "https://mmdbkk.com",
                referer: "https://mmdbkk.com/promotion/6-years-care-back/wish",
              },
              body: JSON.stringify({
                wish_text: "Production public Wish route smoke",
                request_id: requestId,
                language: "en",
              }),
            });
            payload = await response.json().catch(() => null);
          } finally {
            const formula = `AND({campaign_id}='care_back',{idempotency_key}='${requestId}')`;
            const lookup = new URL(`https://api.airtable.com/v0/${base}/${table}`);
            lookup.searchParams.set("filterByFormula", formula);
            lookup.searchParams.set("maxRecords", "2");
            const foundResponse = await fetch(lookup, { headers: { Authorization: `Bearer ${token}` } });
            const found = await foundResponse.json().catch(() => ({}));
            for (const record of Array.isArray(found?.records) ? found.records : []) {
              if (!record?.id) continue;
              await fetch(`https://api.airtable.com/v0/${base}/${table}/${encodeURIComponent(record.id)}`, {
                method: "DELETE",
                headers: { Authorization: `Bearer ${token}` },
              }).catch(() => null);
            }
          }
          const code = String(payload?.error?.code || "").slice(0, 120);
          console.log(`Public Wish production smoke: HTTP ${response?.status || 0}; ok=${payload?.ok === true}; state=${String(payload?.state || "")}; code=${code || "none"}`);
          if (!response || response.status !== 200 || payload?.ok !== true || payload?.state !== "completed") {
            throw new Error(`Public Wish production smoke failed: HTTP_${response?.status || 0}${code ? ` ${code}` : ""}`);
          }
          console.log("Public Wish production endpoint accepted and persisted a synthetic wish; smoke record was removed");
          NODE

      - name: Record deployment receipt
        shell: bash
        run: |
          mkdir -p deployments
          cat > deployments/member-pages-worker-last.json <<EOF
          {
            "worker": "member-pages-worker",
            "status": "deployed",
            "deployment_method": "github_actions_direct_deploy",
            "source_sha": "${GITHUB_SHA}",
            "version_id": "${MEMBER_PAGES_WORKER_VERSION_ID}",
            "version_tag": "${MEMBER_PAGES_WORKER_VERSION_TAG}",
            "traffic_percent": 100,
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          {
            echo "### member-pages-worker deployment receipt"
            echo '```json'
            cat deployments/member-pages-worker-last.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: member-pages-worker-deploy-${{ github.run_id }}
          path: deployments/member-pages-worker-last.json
          if-no-files-found: error
          retention-days: 30
