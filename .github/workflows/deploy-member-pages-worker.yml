name: Deploy member-pages-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "member-pages-worker/**"
      - ".github/workflows/deploy-member-pages-worker.yml"

concurrency:
  group: deploy-member-pages-worker-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: "appsV1ILPRfIjkaYg"
      NO_COLOR: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Normalize Cloudflare and Airtable configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const token = clean(process.env.CLOUDFLARE_API_TOKEN);
          const accountId = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const airtableApiKey = clean(process.env.AIRTABLE_API_KEY);
          const airtableBaseId = clean(process.env.AIRTABLE_BASE_ID);
          if (!token || !accountId) throw new Error("Cloudflare credentials are missing after normalization");
          if (airtableBaseId !== "appsV1ILPRfIjkaYg") throw new Error("Unexpected AIRTABLE_BASE_ID for member-pages-worker");
          if (airtableApiKey) console.log(`::add-mask::${airtableApiKey}`);
          const lines = [
            `CLOUDFLARE_API_TOKEN=${token}`,
            `CLOUDFLARE_ACCOUNT_ID=${accountId}`,
            `AIRTABLE_BASE_ID=${airtableBaseId}`,
          ];
          if (airtableApiKey) lines.push(`AIRTABLE_API_KEY=${airtableApiKey}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix member-pages-worker/test-runtime

      - name: Run focused LIFF and CARE BACK tests
        run: |
          npm run test:member-pages-liff
          npm run check:member-pages-wrangler

      - name: Validate Cloudflare deployment
        run: npx --yes wrangler@4 deploy --dry-run --keep-vars --config member-pages-worker/wrangler.toml

      - name: Ensure Airtable API secret exists
        shell: bash
        run: |
          set -euo pipefail
          set +x
          secrets_json="$(npx --yes wrangler@4 secret list --format json --config member-pages-worker/wrangler.toml)"
          secret_state="$(printf '%s' "$secrets_json" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const secrets = JSON.parse(input);
              process.stdout.write(secrets.some((secret) => secret.name === "AIRTABLE_API_KEY") ? "present" : "absent");
            });
          ')"
          if [ "$secret_state" = "present" ]; then
            echo "Airtable API secret already exists in member-pages-worker"
          elif [ "$secret_state" = "absent" ] && [ -n "${AIRTABLE_API_KEY:-}" ]; then
            printf '%s' "$AIRTABLE_API_KEY" | npx --yes wrangler@4 secret put AIRTABLE_API_KEY --config member-pages-worker/wrangler.toml
            echo "Airtable API secret provisioned from GitHub Actions secret"
          else
            echo "AIRTABLE_API_KEY is absent from both member-pages-worker and GitHub Actions" >&2
            exit 1
          fi

      - name: Deploy member-pages-worker
        run: npx --yes wrangler@4 deploy --keep-vars --config member-pages-worker/wrangler.toml

      - name: Record deployment receipt
        shell: bash
        run: |
          mkdir -p deployments
          cat > deployments/member-pages-worker-last.json <<EOF
          {
            "worker": "member-pages-worker",
            "status": "deployed",
            "source_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "deployed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/member-pages-worker-last.json
          git commit -m "chore(deploy): record member-pages-worker production deploy" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
