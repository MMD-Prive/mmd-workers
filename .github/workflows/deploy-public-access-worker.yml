name: Deploy public-access-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public-access-worker/**"
      - ".github/workflows/deploy-public-access-worker.yml"
      - ".github/workflows/public-access-production-smoke.yml"

permissions:
  contents: read

concurrency:
  group: deploy-public-access-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "b176eda1172b741fd2e58904cc9d77c5"
      CLOUDFLARE_ZONE_ID: "2d62396174fa2ddadbbcd0e8cf0f3367"
      WORKER_NAME: "public-access-worker"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require deploy credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ROUTES_API_TOKEN:-}"

      - name: Install dependencies
        run: npm ci

      - name: Validate public-access worker source
        shell: bash
        run: |
          set -euo pipefail
          node --check public-access-worker/src/index.js
          grep -q 'sigil.mmdbkk.com/public/api/\*' public-access-worker/wrangler.toml
          grep -q 'AIRTABLE_BASE_ID = "appsV1ILPRfIjkaYg"' public-access-worker/wrangler.toml

      - name: Upload public-access-worker version
        id: upload
        shell: bash
        working-directory: public-access-worker
        run: |
          set -o pipefail
          npx --yes wrangler@4 versions upload 2>&1 | tee "$RUNNER_TEMP/public-access-worker-upload.log"

      - name: Resolve uploaded version ID
        id: resolve_version
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/public-access-worker-upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Unable to parse Worker Version ID" >&2
            cat "$RUNNER_TEMP/public-access-worker-upload.log" >&2
            exit 2
          fi
          echo "PUBLIC_ACCESS_WORKER_VERSION_ID=$version_id" >> "$GITHUB_ENV"

      - name: Deploy uploaded public-access-worker version
        id: deploy
        shell: bash
        working-directory: public-access-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions deploy "${PUBLIC_ACCESS_WORKER_VERSION_ID}@100%" -y

      - name: Sync canonical Public Access route
        id: route_sync
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = process.env.WORKER_NAME;
          const pattern = "sigil.mmdbkk.com/public/api/*";
          async function cf(path, options = {}) {
            const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
              ...options,
              headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text); } catch {}
            if (!response.ok || body?.success !== true) {
              throw new Error(body ? JSON.stringify(body.errors || body) : "cloudflare_" + response.status + ":" + text.slice(0, 160));
            }
            return body.result;
          }
          const routePath = "/zones/" + zoneId + "/workers/routes";
          const existing = await cf(routePath);
          const conflict = existing.find((route) => route.pattern === pattern && route.script !== worker);
          if (conflict) throw new Error("route conflict " + pattern + " -> " + (conflict.script || "none"));
          if (!existing.some((route) => route.pattern === pattern && route.script === worker)) {
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log("created " + pattern + " -> " + worker);
          }
          const verified = await cf(routePath);
          if (!verified.some((route) => route.pattern === pattern && route.script === worker)) {
            throw new Error("Public Access route verification failed");
          }
          console.log("verified " + pattern + " -> " + worker);
          NODE
