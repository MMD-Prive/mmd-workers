name: Deploy immigrate-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "immigrate-worker/**"
      - ".github/workflows/deploy-immigrate-worker.yml"

concurrency:
  group: deploy-immigrate-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: immigrate-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ROUTES_API_TOKEN: ${{ secrets.CLOUDFLARE_ROUTES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b176eda1172b741fd2e58904cc9d77c5
      CLOUDFLARE_ZONE_ID: 2d62396174fa2ddadbbcd0e8cf0f3367
      WORKER_NAME: immigrate-worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: immigrate-worker/package-lock.json

      - name: Normalize Cloudflare tokens
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const clean = (value) => (value || "").replace(/[\u2028\u2029\r\n]/g, "").trim();
          const deployToken = clean(process.env.CLOUDFLARE_API_TOKEN);
          const routesToken = clean(process.env.CLOUDFLARE_ROUTES_API_TOKEN);
          if (!deployToken) throw new Error("Cloudflare deploy API token is missing after normalization");
          if (!routesToken) throw new Error("Cloudflare routes API token is missing after normalization");
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_API_TOKEN=${deployToken}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ROUTES_API_TOKEN=${routesToken}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run immigrate-worker runtime validation
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node test/internal-admin-gate-bridge.test.mjs

      - name: Verify Cloudflare token account
        run: npx --yes wrangler@4.128.0 whoami

      - name: Validate version upload
        run: npx --yes wrangler@4.128.0 versions upload --dry-run --keep-vars

      - name: Upload immigrate-worker version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          tag="gha-${GITHUB_SHA:0:12}"
          npx --yes wrangler@4.128.0 versions upload \
            --keep-vars \
            --tag "$tag" \
            --message "GitHub Actions ${GITHUB_SHA}" \
            2>&1 | tee "$RUNNER_TEMP/immigrate-worker-upload.log"

      - name: Resolve uploaded version ID
        id: resolve_version
        shell: bash
        run: |
          set -euo pipefail
          version_id="$(sed -n 's/.*Worker Version ID:[[:space:]]*\([0-9a-fA-F-][0-9a-fA-F-]*\).*/\1/p' "$RUNNER_TEMP/immigrate-worker-upload.log" | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "Unable to parse Worker Version ID from upload output" >&2
            cat "$RUNNER_TEMP/immigrate-worker-upload.log" >&2
            exit 2
          fi
          echo "IMMIGRATE_WORKER_VERSION_ID=${version_id}" >> "$GITHUB_ENV"
          echo "Resolved version ${version_id}"

      - name: Deploy uploaded version only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.128.0 versions deploy "${IMMIGRATE_WORKER_VERSION_ID}@100%" -y

      - name: Sync exact Create Session core asset routes
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_ROUTES_API_TOKEN;
          const zoneId = process.env.CLOUDFLARE_ZONE_ID;
          const worker = process.env.WORKER_NAME;
          const desired = [
            "mmdbkk.com/a/create-session.js",
            "www.mmdbkk.com/a/create-session.js",
          ];
          const obsolete = [
            "mmdbkk.com/a/create-session.js*",
            "www.mmdbkk.com/a/create-session.js*",
            "mmdbkk.com/a/create-session-focus-flow-v2.js",
            "www.mmdbkk.com/a/create-session-focus-flow-v2.js",
            "mmdbkk.com/a/create-session-focus-flow-v2.js*",
            "www.mmdbkk.com/a/create-session-focus-flow-v2.js*",
          ];
          async function cf(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                ...(options.headers || {}),
              },
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) throw new Error(JSON.stringify(body.errors || body));
            return body.result;
          }
          const routePath = `/zones/${zoneId}/workers/routes`;
          let existing = await cf(routePath);
          for (const pattern of desired) {
            const conflict = existing.find((route) => route.pattern === pattern && route.script !== worker);
            if (conflict) throw new Error(`route conflict ${pattern} -> ${conflict.script || "none"}`);
          }
          for (const pattern of obsolete) {
            const route = existing.find((item) => item.pattern === pattern && item.script === worker);
            if (!route) continue;
            await cf(`${routePath}/${route.id}`, { method: "DELETE" });
            console.log(`removed obsolete ${pattern} -> ${worker}`);
          }
          existing = await cf(routePath);
          for (const pattern of desired) {
            if (existing.some((route) => route.pattern === pattern && route.script === worker)) continue;
            await cf(routePath, { method: "POST", body: JSON.stringify({ pattern, script: worker }) });
            console.log(`created ${pattern} -> ${worker}`);
          }
          const verified = await cf(routePath);
          const missing = desired.filter((pattern) => !verified.some((route) => route.pattern === pattern && route.script === worker));
          const stale = obsolete.filter((pattern) => verified.some((route) => route.pattern === pattern && route.script === worker));
          if (missing.length) throw new Error(`missing routes: ${missing.join(", ")}`);
          if (stale.length) throw new Error(`obsolete routes still present: ${stale.join(", ")}`);
          console.log(`verified ${desired.length}/${desired.length} exact queryless Create Session core routes`);
          NODE

      - name: Verify latest Control Room in production
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          verified=0
          for attempt in 1 2 3 4 5 6 7 8; do
            : > "$headers"
            : > "$body"
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
              "https://mmdbkk.com/internal/admin/control-room?mock=1&deploy=${GITHUB_SHA}&attempt=${attempt}")"

            if [ "$code" = "200" ] \
              && grep -Eiq '^x-mmd-control-room-ui:[[:space:]]*owner-desktop-v3-latest' "$headers" \
              && grep -Eiq '^x-mmd-control-room-authority:[[:space:]]*canonical-backend' "$headers" \
              && grep -q 'data-control-room-v3' "$body" \
              && grep -q 'MMD PRIVÉ · OWNER CONTROL ROOM V3' "$body" \
              && grep -q 'My MMD Entitlement Resolver' "$body" \
              && grep -q 'Telegram / Google Drive' "$body" \
              && ! grep -q 'WORKER-RENDERED INTERNAL PAGES' "$body"; then
              echo "Production Control Room owner v3 verified on attempt ${attempt}"
              verified=1
              break
            fi

            echo "Control Room v3 not propagated yet (attempt ${attempt}, HTTP ${code}); retrying..."
            sleep 2
          done

          if [ "$verified" != "1" ]; then
            echo "Control Room v3 production verification failed after bounded propagation retries" >&2
            grep -Ei '^(x-mmd-control-room-ui|x-mmd-control-room-authority|server|cf-ray):' "$headers" || true
            exit 1
          fi

      - name: Verify MMD Create Session Owner v14 in production
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT

          verified=0
          for attempt in 1 2 3 4 5 6 7 8; do
            : > "$headers"
            : > "$body"
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
              "https://mmdbkk.com/internal/admin/jobs/create-session?mock=1&deploy=${GITHUB_SHA}&attempt=${attempt}")"

            if [ "$code" = "200" ] \
              && grep -Eiq '^x-mmd-create-session-ui:[[:space:]]*owner-v14-vnext2-restored' "$headers" \
              && grep -Eiq '^x-mmd-create-session-runtime:[[:space:]]*current-entitlement-aware' "$headers" \
              && grep -Eiq '^x-mmd-create-session-authority:[[:space:]]*canonical-backend' "$headers" \
              && grep -Eiq '^x-mmd-create-session-assets:[[:space:]]*worker-owned-core-route' "$headers" \
              && grep -Eiq '^x-mmd-create-session-gate-ui:[[:space:]]*server-verified' "$headers" \
              && grep -Eiq '^x-mmd-create-session-business:[[:space:]]*mmd-only' "$headers" \
              && grep -q 'class="mmd-cs-v14"' "$body" \
              && grep -q 'data-mmd-create-session-pro' "$body" \
              && grep -q 'data-business-context="mmd"' "$body" \
              && grep -q 'data-op-work-type="public"' "$body" \
              && grep -q 'data-op-work-type="private"' "$body" \
              && grep -q 'Admin%20CS%202.webp' "$body" \
              && grep -q 'src="/internal/admin/jobs/create-session.js"' "$body" \
              && ! grep -q 'data-focus-flow-v2' "$body" \
              && ! grep -q 'Create Session · Focus Flow v2' "$body"; then
              echo "Production MMD Create Session Owner v14 verified on attempt ${attempt}"
              verified=1
              break
            fi

            echo "MMD Owner v14 not propagated yet (attempt ${attempt}, HTTP ${code}); retrying..."
            sleep 2
          done

          if [ "$verified" != "1" ]; then
            echo "MMD Create Session Owner v14 production verification failed after bounded propagation retries" >&2
            grep -Ei '^(x-mmd-create-session-ui|x-mmd-create-session-runtime|x-mmd-create-session-authority|x-mmd-create-session-assets|x-mmd-create-session-gate-ui|x-mmd-create-session-business|server|cf-ray):' "$headers" || true
            exit 1
          fi

      - name: Verify worker-owned MMD Create Session core asset in production
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          for origin in https://mmdbkk.com https://www.mmdbkk.com; do
            headers="$(mktemp)"
            core="$(mktemp)"
            verified=0
            for attempt in 1 2 3 4 5 6 7 8; do
              : > "$headers"
              : > "$core"
              core_code="$(curl -sS -D "$headers" -o "$core" -w '%{http_code}' "$origin/internal/admin/jobs/create-session.js")"
              if [ "$core_code" = "200" ] \
                && grep -Eiq '^x-mmd-create-session-core:[[:space:]]*worker-owned' "$headers" \
                && grep -Eiq '^x-mmd-create-session-business:[[:space:]]*mmd' "$headers" \
                && grep -q 'mmd_sigil_create_session_external_js_v3' "$core"; then
                echo "Worker-owned MMD Create Session core verified for ${origin} on attempt ${attempt}"
                verified=1
                break
              fi
              echo "Worker-owned MMD core route not ready for ${origin} (attempt ${attempt}, core=${core_code}); retrying..."
              sleep 2
            done
            rm -f "$headers" "$core"
            if [ "$verified" != "1" ]; then
              echo "Worker-owned MMD Create Session core verification failed for ${origin}" >&2
              exit 1
            fi
          done
