name: 'Kenji #3285 upload-only'
on:
  pull_request:
    paths:
      - 'scripts/kenji-3285-upload*'
      - '.github/workflows/kenji-3285-upload-only.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: Upload one pinned candidate, without switching traffic
        type: choice
        required: true
        options:
          - member-dashboard-chat-worker
          - member-pages-worker
      production_approved:
        type: boolean
        required: true
        default: false
      approval_ref:
        type: string
        required: true
      approved_sha:
        description: Exact main tooling SHA approved for the selected Worker
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('deploy-{0}-production', inputs.worker) || format('kenji-3285-upload-contracts-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Offline artifact and Owner boundary contracts
        run: node --test scripts/kenji-3285-upload.test.mjs
  production-approval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mmdprive' && github.run_attempt == 1 && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [contracts]
    uses: ./.github/workflows/admin-production-approval.yml
    with:
      approval_ref: ${{ inputs.approval_ref }}
      approved_sha: ${{ inputs.approved_sha }}
  reviewed-operation:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mmdprive' && github.run_attempt == 1 && inputs.production_approved == true && inputs.approval_ref != '' && inputs.approved_sha == github.sha
    needs: [contracts, production-approval]
    environment: mmd-production-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Upload selected Worker version and verify readback without changing traffic
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKER: ${{ inputs.worker }}
          PRODUCTION_APPROVED: ${{ inputs.production_approved }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/kenji-3285-upload.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kenji-3285-upload-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kenji-3285-upload-receipt.json
          if-no-files-found: ignore
          retention-days: 90
