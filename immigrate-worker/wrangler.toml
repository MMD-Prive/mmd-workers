[[routes]]
pattern = "mmdbkk.com/v1/admin/create-job*"
zone_name = "mmdbkk.com"

[[routes]]
pattern = "www.mmdbkk.com/v1/admin/create-job*"
zone_name = "mmdbkk.com"

[[routes]]
