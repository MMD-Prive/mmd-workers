name = "realtime-worker"
main = "src/index.js"
compatibility_date = "2026-01-27"

# Implementation owner is intentionally workers.dev-only until /v1/rt/* custom-host
# route acceptance is explicitly proven. Do not add mmdbkk.com routes here casually.
workers_dev = true
# preview_urls = false

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomDO"]

[vars]
# Browser origins are prepared for the current MMD production hosts, but this does
# not itself claim any custom-host route or enable GPS collection.
ALLOWED_ORIGINS = "https://mmdbkk.com,https://www.mmdbkk.com,https://mmdprive.webflow.io,https://mmdprive.com"
WEB_BASE_URL = "https://mmdbkk.com"
CONFIRM_BASE_URL = "https://mmdbkk.com"

ROOM_TTL_SECONDS = "7200"

# Required secret before deploy:
# - AUTH_SERVICE_EVENTS_TO_REALTIME
# Optional second dedicated service credential for future admin-owned room policy:
# - AUTH_SERVICE_ADMIN_TO_REALTIME
# Legacy INTERNAL_TOKEN is intentionally not accepted by the current realtime runtime.

# live chat / video call policy
VIDEO_PROVIDER = "daily"
VIDEO_MAX_CALLS = "2"
VIDEO_CALL_SECONDS = "10"
