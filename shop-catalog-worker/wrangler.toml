name = "shop-catalog-worker"
main = "src/index.js"
compatibility_date = "2026-08-21"

[vars]
AIRTABLE_BASE_ID = "appsV1ILPRfIjkaYg"
SHARED_SHOP_PRODUCTS_TABLE_ID = "tblzsmNLfP6J0kQ90"
DEFAULT_TIMEZONE = "Asia/Bangkok"

# AIRTABLE_TOKEN must be configured as a Cloudflare secret.
# This worker deliberately exposes separate routes and separate price fields:
# /shop/api/products     -> Himai Selling Price THB
# /mmd-shop/api/products -> MMD Shop Selling Price THB
# Never fall back from one shop price to the other or to legacy Selling Price THB.
